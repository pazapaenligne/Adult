<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission — Writing a practical email</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF8E1;
  --white:#FFFFFF;
  --muted:#4d4d4a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  background:var(--white);
  color:var(--pazapa-grey-dark);
  line-height:1.55;
  font-size:1rem;
}
h1,h2,h3{
  font-family:"Filson Soft","Open Sans",Arial,sans-serif;
  font-weight:800;
  margin:0 0 8px 0;
  line-height:1.25;
}
h2{font-size:1.4rem;}
h3{font-size:1.05rem;}
.app{max-width:760px;margin:0 auto;padding:14px 16px 40px 16px;}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
  padding:6px 0 12px 0;border-bottom:4px solid var(--pazapa-blue);
}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.brand-logo{height:38px;width:auto;display:block;}
.brand-sub{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:0.95rem;}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.progress-label{
  background:var(--pazapa-grey-light);border-radius:999px;
  padding:6px 14px;font-size:0.92rem;white-space:nowrap;
}
.progress-track{display:flex;gap:6px;margin:10px 0 18px 0;}
.progress-dot{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
.progress-dot.done{background:var(--pazapa-blue);}
.progress-dot.current{background:var(--pazapa-yellow);}
.screen{outline:none;}
.card{background:var(--blue-tint);border-radius:16px;padding:20px;margin-bottom:16px;}
.card.green{background:var(--green-tint);}
.card.white{background:var(--white);border:2px solid var(--pazapa-blue);}
.lead{font-size:1.1rem;margin:0 0 14px 0;}
.sub{color:var(--muted);margin:0 0 12px 0;}
.illustration{display:block;width:100%;max-width:260px;height:auto;margin:6px auto 14px auto;border-radius:14px;}
.facts{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0;}
@media (min-width:560px){.facts{grid-template-columns:1fr 1fr;}}
.fact{background:var(--white);border-radius:12px;padding:12px 14px;border-left:6px solid var(--pazapa-blue);}
.fact b{display:block;font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;}
.goal{background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:14px;padding:14px 16px;margin-top:6px;}
.note{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:10px;padding:10px 14px;margin:12px 0;}
.btn{
  font-family:inherit;font-size:1rem;font-weight:700;
  min-height:48px;min-width:48px;padding:10px 20px;border-radius:999px;
  border:2px solid var(--pazapa-blue);cursor:pointer;touch-action:manipulation;
  color:var(--pazapa-grey-dark);background:var(--pazapa-blue);
}
.btn.sec{background:var(--white);}
.btn.sec[aria-pressed="true"]{background:var(--green-tint);border-color:var(--pazapa-green);border-width:3px;}
.btn.green{background:var(--pazapa-green);border-color:var(--pazapa-green);}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#5c5c58;cursor:not-allowed;}
.btn.small{padding:8px 14px;}
.lang-btn{background:var(--white);}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:20px;}
.actions[hidden]{display:none;}
.btn[hidden]{display:none;}
.hint{min-height:24px;margin:8px 0 0 0;color:var(--muted);text-align:right;font-size:0.95rem;}
.status{min-height:24px;font-weight:700;margin:8px 0 0 0;}
.status.ok{border-left:6px solid var(--pazapa-green);background:var(--green-tint);padding:8px 12px;border-radius:8px;}
.status.retry{border-left:6px solid var(--pazapa-yellow);background:var(--yellow-tint);padding:8px 12px;border-radius:8px;}
.status:empty{padding:0;border:0;background:none;}
.phrase-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0;}
@media (min-width:560px){.phrase-grid{grid-template-columns:1fr 1fr;}}
.phrase{
  font-family:inherit;font-size:1rem;text-align:left;
  background:var(--white);border:2px solid var(--pazapa-blue);border-radius:12px;
  padding:12px 14px;min-height:64px;cursor:pointer;touch-action:manipulation;color:var(--pazapa-grey-dark);
  display:flex;flex-direction:column;gap:4px;
}
.phrase .en{font-weight:700;}
.phrase .fr{font-size:0.92rem;color:var(--muted);font-style:italic;}
.phrase .stat{font-size:0.9rem;font-weight:700;min-height:1.2em;}
.phrase.sel{border:4px solid var(--pazapa-grey-dark);padding:10px 12px;}
.phrase.good{background:var(--green-tint);border-color:var(--pazapa-green);}
.phrase.bad{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.phrase .why{font-size:0.92rem;}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 0;padding:0;list-style:none;}
.tray li{background:var(--green-tint);border:2px solid var(--pazapa-green);border-radius:999px;padding:6px 14px;}
fieldset{border:2px solid var(--pazapa-blue);border-radius:12px;background:var(--white);margin:0 0 14px 0;padding:10px 14px 12px 14px;}
legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;padding:0 6px;}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;}
.opt input{width:22px;height:22px;flex:none;accent-color:#1b6d80;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border:2px solid var(--pazapa-blue);border-radius:999px;background:var(--white);cursor:pointer;}
.chip input{width:20px;height:20px;accent-color:#1b6d80;}
.chip.on{background:var(--green-tint);border-color:var(--pazapa-green);border-width:3px;}
.example{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:10px;padding:12px 14px;margin:10px 0;}
.example p{margin:0 0 6px 0;}
.example .fr{color:var(--muted);font-style:italic;}
.infocard{background:var(--white);border:3px solid var(--pazapa-blue);border-radius:14px;padding:14px 16px;margin:12px 0;}
.infocard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;}
.infocard dt{font-weight:800;}
.infocard dd{margin:0;}
.tag{display:inline-block;background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);border-radius:999px;padding:0 10px;font-weight:700;font-size:0.9rem;}
.modes{display:flex;flex-wrap:wrap;gap:10px;}
label.lbl{display:block;font-weight:700;margin:12px 0 4px 0;}
input[type="text"],textarea{
  width:100%;font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);
  border:2px solid var(--pazapa-blue);border-radius:10px;padding:10px 12px;background:var(--white);
}
input[type="text"]{min-height:48px;}
textarea{min-height:140px;resize:vertical;}
.count{font-size:0.92rem;color:var(--muted);margin:4px 0 0 0;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px 0;}
.script{background:var(--white);border:2px dashed var(--pazapa-blue);border-radius:12px;padding:12px 14px;white-space:pre-wrap;margin:8px 0 14px 0;}
.rec{background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:14px;padding:14px 16px;margin:10px 0;}
.rec-row{display:flex;flex-wrap:wrap;gap:10px;}
.rec-status{min-height:24px;margin:10px 0 0 0;}
.rec-status.warn{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);padding:8px 12px;border-radius:8px;}
.timer{margin:8px 0 0 0;font-weight:700;min-height:1.4em;}
.parts{list-style:none;margin:8px 0;padding:0;}
.parts li{padding:6px 0;border-bottom:1px solid var(--pazapa-grey-light);}
.parts .mark{display:inline-block;min-width:5.5em;font-weight:800;}
.feedback{background:var(--white);border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px 14px;margin:12px 0;}
.feedback.good{border-color:var(--pazapa-green);background:var(--green-tint);}
.feedback.almost{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
.feedback p{margin:0 0 8px 0;}
.feedback:empty{display:none;}
.sc li{list-style:none;}
.sc{padding:0;margin:0;}
.sc .opt{align-items:flex-start;padding:6px 0;}
.sc small{display:block;color:var(--muted);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 5px #fff;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important;}}
@media (max-width:420px){.btn{padding:10px 14px;}.lead{font-size:1.02rem;}}
</style>
</head>

var TARGETS=["deadline","confirm","regards","sincerely","writing","question","homework","monday","tuesday","wednesday","thursday","friday","saturday","sunday","please","thank","thanks","could","would","teacher"];
function lev1(a,b){
  if(a===b){ return true; }
  var la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1){ return false; }
  var i=0,j=0,e=0;
  while(i<la && j<lb){
    if(a.charAt(i)===b.charAt(j)){ i++; j++; continue; }
    e++; if(e>1){ return false; }
    if(la>lb){ i++; } else if(lb>la){ j++; } else { i++; j++; }
  }
  return e+(la-i)+(lb-j)<=1;
}
/* normalise: Unicode, apostrophes, case, punctuation, spaces; repair one-letter spelling slips in key words */
function prep(text){
  var n=String(text||"").normalize("NFKC")
    .replace(/[‘’ʼ`´]/g,"'")
    .toLowerCase()
    .replace(/[.,!?;:()"“”\/\\\-]/g," ")
    .replace(/\s+/g," ").trim();
  return n.split(" ").map(function(w){
    if(w.length>=5 && TARGETS.indexOf(w)<0){
      for(var i=0;i<TARGETS.length;i++){
        var t=TARGETS[i];
        if(t.length>=6 && lev1(w,t)){ return t; }
      }
    }
    return w;
  }).join(" ");
}
/* documented phrase groups (any one match counts) */
var GROUPS={
  greeting:[/\b(dear|hello|hi|good morning|good afternoon|good evening)\b/],
  purpose:[/\b(i'm|i am|im)\s+writing\b/,/\bwriting (to|about)\b/,/\b(want|would like|need) to (ask|know)\b/,/\bi have a (question|problem)\b/,/\bto ask (about|for)\b/,/\bquestion about\b/,/\bmy question\b/,/\bi'm asking\b/],
  key:[/\b(deadline|due date|due|the date|monday|tuesday|wednesday|thursday|friday|saturday|sunday|when)\b/],
  request:[/\b(could|can|would|will) you\b/,/\bplease (confirm|tell|send|let me know|check|give)\b/,/\bconfirm\b/,/\bi would like (to know|you to confirm)\b/,/\bdo you know\b/],
  closing:[/\b(thank you|thanks|kind regards|best regards|regards|sincerely|best wishes|yours)\b/]
};
function analyze(subject,message){
  var n=prep(message), r={};
  Object.keys(GROUPS).forEach(function(k){
    r[k]=GROUPS[k].some(function(re){ return re.test(n); });
  });
  r.subject=String(subject||"").trim().length>=3;
  r.complete=r.greeting&&r.purpose&&r.key&&r.request&&r.closing&&r.subject;
  return r;
}

function finishRec(failed){
  clearTimer(); stopTracks(rec.stream); rec.stream=null; rec.mr=null;
  if(failed){ rec.state="idle"; rec.chunks=[]; setRecMsg("errFail"); updateRecUI(); updateActions(); return; }
  var blob=new Blob(rec.chunks,{type:rec.mime||"audio/mp4"});
  rec.chunks=[];
  if(!blob.size){ rec.state="idle"; setRecMsg("errEmpty"); updateRecUI(); updateActions(); return; }
  disposeRecording();
  rec.url=URL.createObjectURL(blob);
  rec.state="ready"; setRecMsg("recReady");
  updateRecUI(); updateActions();
}
function startRec(){
  if(rec.state!=="idle" && rec.state!=="ready"){ return; }
  var u=recSupport();
  if(u){ setRecMsg(u); updateRecUI(); return; }
  stopPlayback(); disposeRecording();
  rec.state="requesting"; setRecMsg("recReq");
  var tok=++rec.token;
  updateRecUI(); updateActions();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(tok!==rec.token){ stopTracks(stream); return; }
    var mime=pickMime(),mr;
    try{ mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }
    catch(e){ stopTracks(stream); rec.state="idle"; setRecMsg("errFail"); updateRecUI(); updateActions(); return; }
    rec.stream=stream; rec.mr=mr; rec.chunks=[]; rec.mime=mr.mimeType||mime||"audio/mp4";
    mr.ondataavailable=function(e){ if(e.data && e.data.size>0){ rec.chunks.push(e.data); } };
    mr.onerror=function(){ if(tok===rec.token){ finishRec(true); } };
    mr.onstop=function(){ if(tok===rec.token){ finishRec(false); } };
    try{ mr.start(); }catch(e2){ finishRec(true); return; }
    rec.state="recording"; rec.secs=0; setRecMsg("recRec");
    clearTimer();
    rec.timer=setInterval(function(){ rec.secs++; var t=$("recTimer"); if(t){ t.textContent=fmtTime(rec.secs); } },1000);
    updateRecUI(); updateActions();
  }).catch(function(err){
    if(tok!==rec.token){ return; }
    rec.state="idle"; setRecMsg(errKey(err)); updateRecUI(); updateActions();
  });
}
function stopRec(){
  if(rec.state!=="recording"){ return; }
  rec.state="stopping"; updateRecUI();
  try{ rec.mr.stop(); }catch(e){ finishRec(true); }
}
function togglePlay(){
  if(!hasRecording()){ return; }
  if(rec.audio){ stopPlayback(); setRecMsg("recReady"); updateRecUI(); return; }
  var a=new Audio(rec.url); rec.audio=a;
  a.onended=function(){ if(rec.audio!==a){ return; } rec.audio=null; setRecMsg("recDone"); updateRecUI(); };
  a.onerror=function(){ if(rec.audio!==a){ return; } rec.audio=null; setRecMsg("errPlay"); updateRecUI(); };
  setRecMsg("recPlay");
  var p=a.play();
  if(p && p.catch){ p.catch(function(){ if(rec.audio===a){ rec.audio=null; setRecMsg("errPlay"); updateRecUI(); } }); }
  updateRecUI();
}
function retryRec(){
  if(rec.state!=="ready"){ return; }
  stopPlayback(); disposeRecording();
  rec.state="idle"; setRecMsg("recClear");
  updateRecUI(); updateActions();
}
function recorderHTML(){
  return '<div class="rec" id="recBox">'+
    '<div class="rec-row">'+

function updateRecUI(){
  if(!$("recBox")){ return; }
  var busy=(rec.state==="requesting"||rec.state==="recording"||rec.state==="stopping");
  var unsupported=!!recSupport();
  var rs=$("recStart"),st=$("recStop"),hr=$("recHear"),rt=$("recRetry");
  rs.textContent=T("recStart"); st.textContent=T("recStop");
  hr.textContent=rec.audio?T("recStopHear"):T("recHear"); rt.textContent=T("recRetry");
  rs.disabled=busy||unsupported;
  st.disabled=rec.state!=="recording";
  hr.disabled=!hasRecording();
  rt.disabled=rec.state!=="ready";
  var ab=$("aloudBtn");
  ab.textContent=S.aloud?T("aloudOn"):T("aloud");
  ab.setAttribute("aria-pressed",S.aloud?"true":"false");
  var msg=$("recStatus");
  var key=rec.msgKey;
  if(unsupported && rec.state==="idle" && key==="recIdle"){ key="errUnsup"; }
  msg.textContent=T(key);
  msg.className="rec-status"+(/^err/.test(key)?" warn":"");
  var t=$("recTimer"); if(t){ t.textContent=(rec.state==="recording")?fmtTime(rec.secs):""; }
  var as=$("aloudStatus"); if(as){ as.textContent=S.aloud?T("aloudNote"):""; }
}

function mainLabel(){
  var s=S.screen;
  if(s===4){ return T("review"); }
  if(s===5){ return T("finish"); }

}
function updateActions(){
  var s=S.screen;
  mainBtn.hidden=(s===6);
  retryBtn.hidden=(s!==6);
  doneBtn.hidden=(s!==6);
  mainBtn.textContent=mainLabel();
  retryBtn.textContent=T("retryAll");
  doneBtn.textContent=doneShown?T("doneOk"):T("done");
  var ok=false,hint="";
  if(s===1){ ok=true; }
  else if(s===2){ ok=S.phraseOK; }
  else if(s===3){ ok=planComplete(); if(!ok){ hint=T("planHint"); } }
  else if(s===4){
    ok=responseReady();
    if(!ok){ hint=(S.mode==="speak")?T("needSpeak"):T("needText"); }
  }
  else if(s===5){
    ok=finishReady();
    if(!ok){
      if(S.mode==="type" && !S.validated && S.incomplete<3){ hint=T("needCheck"); }
      else if(S.mode==="speak" && !(hasRecording()||S.aloud)){ hint=T("needSpeak"); }
      else if(!allTicked()){ hint=T("needTicks"); }
    }
  }
  mainBtn.disabled=!ok;
  doneBtn.disabled=(s!==6);
  setHint(hint);
}

}

/* --- screen 5 --- */
function resultHTML(){
  var r=run.result;
  if(run.changedNote){ return '<div class="feedback almost"><p>'+esc(T("changed"))+'</p></div>'; }
  if(!r){ return ""; }
  var parts=[["subject","pSubj"],["greeting","pGreet"],["purpose","pPurp"],["key","pKey"],["request","pReq"],["closing","pClose"]];
  var ok="";
  if(r.request){ ok="okReq"; } else if(r.closing){ ok="okClose"; } else if(r.greeting){ ok="okGreet"; } else if(r.purpose){ ok="okPurp"; } else { ok="okStart"; }
  var next="nxDone";
  if(!r.purpose){ next="nxPurp"; } else if(!r.key){ next="nxKey"; } else if(!r.request){ next="nxReq"; }
  else if(!r.greeting){ next="nxGreet"; } else if(!r.closing){ next="nxClose"; } else if(!r.subject){ next="nxSubj"; }
  return '<div class="feedback '+(r.complete?"good":"almost")+'">'+
    '<h3>'+esc(T("fbT"))+'</h3>'+
    '<p><b>'+esc(r.complete?T("leadOk"):T("leadAlmost"))+'</b></p>'+
    '<p>'+esc(T(ok))+'</p>'+
    '<ul class="parts">'+parts.map(function(p){
      return '<li><span class="mark">'+esc(r[p[0]]?T("found"):T("addIt"))+'</span> '+esc(T(p[1]))+'</li>';
    }).join("")+'</ul>'+
    '<p>'+esc(T(next))+'</p></div>';
}
function bankHTML(){
  if(S.incomplete<2 || S.mode!=="type"){ return ""; }
  S.helpUsed=true;
  var h='<div class="note"><h3>'+esc(T("bankT"))+'</h3><p style="margin:0 0 6px 0;">'+esc(T("bankLead"))+'</p><ul style="margin:0;padding-left:20px;" lang="en-GB">'+
    D.en.bank.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul>'+
    '<div style="margin-top:10px;"><button type="button" class="btn sec small" id="exBtn5" aria-expanded="'+(run.showEx?"true":"false")+'">'+esc(run.showEx?T("hideEx"):T("showEx"))+'</button></div>';
  if(run.showEx){
    h+='<div class="example" lang="en-GB"><p><b>'+esc(D.en.exSubj)+'</b></p>'+D.en.ex.map(function(x){ return '<p>'+esc(x)+'</p>'; }).join("")+'</div>';
  }
  return h+'</div>';
}
function renderS5(){
  var sc=[["sc1","sc1e"],["sc2","sc2e"],["sc3","sc3e"],["sc4","sc4e"]];
  var body;
  if(S.mode==="type"){
    body=fieldsHTML("c")+
      '<div class="btn-row" style="margin-top:12px;"><button type="button" class="btn" id="chkBtn">'+esc(T("checkBtn"))+'</button></div>'+
      '<div id="results" role="status" aria-live="polite">'+resultHTML()+'</div>'+
      '<div id="bank">'+bankHTML()+'</div>';
  } else {
    var script=((S.subject?("Subject: "+S.subject+"\n"):"")+S.message).trim();
    body='<p class="lead">'+esc(T("spoken"))+'</p>'+(script?'<div class="script" lang="en-GB">'+esc(script)+'</div>':'')+recorderHTML();
  }
  return '<section aria-labelledby="h"><div class="card">'+
    '<h2 id="h" tabindex="-1">'+esc(T("s5Title"))+'</h2>'+
    '<p class="lead">'+esc(T("s5Lead"))+'</p>'+
    body+
  '</div><div class="card green"><fieldset style="margin:0;"><legend>'+esc(T("scT"))+'</legend>'+
    '<p class="sub">'+esc(T("scLead"))+'</p><ul class="sc">'+
    sc.map(function(p,i){
      return '<li><label class="opt"><input type="checkbox" data-ck="'+i+'"'+(S.ck[i]?" checked":"")+'><span><b>'+esc(T(p[0]))+'</b><small>'+esc(T(p[1]))+'</small></span></label></li>';
    }).join("")+'</ul></fieldset></div></section>';
}
function wireS5(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-ck]"),function(cb){
    cb.addEventListener("change",function(){
      S.ck[+cb.getAttribute("data-ck")]=cb.checked; queueSave(); updateActions();
    });
  });
  if(S.mode==="type"){
    bindFields("c",function(){
      if(run.result || run.changedNote){
        run.result=null; run.changedNote=true;
        $("results").innerHTML=resultHTML();
      }
    });
    $("chkBtn").addEventListener("click",function(){
      var r=analyze(S.subject,S.message);
      run.result=r; run.changedNote=false;
      S.attempts++;
      if(r.complete){ S.validated=true; } else { S.validated=false; S.incomplete++; }
      queueSave();
      $("results").innerHTML=resultHTML();
      $("bank").innerHTML=bankHTML();
      wireBank();
      updateActions();
    });
    wireBank();
  } else {
    bindRecorder();
  }
}
function wireBank(){
  var b=$("exBtn5");
  if(b){
    b.addEventListener("click",function(){
      run.showEx=!run.showEx; S.modelUsed=true; queueSave();
      $("bank").innerHTML=bankHTML(); wireBank();
      var nb=$("exBtn5"); if(nb){ nb.focus(); }
    });
  }
}

/* --- screen 6 --- */
function renderS6(){
  return '<section aria-labelledby="h"><div class="card green">'+
    '<h2 id="h" tabindex="-1">'+esc(T("s6Title"))+'</h2>'+
    '<img class="illustration" src="'+IMG_SCENE+'" alt="">'+
    '<p class="lead">'+esc(T("s6A"))+'</p>'+
    '<p>'+esc(T("s6B"))+'</p>'+
  '</div></section>';
}

/* ================= render control ================= */
function renderScreen(keepFocus){
  var el=$("screen"),s=S.screen,html="";
  if(s===1){ html=renderS1(); }
  else if(s===2){ html=renderS2(); }
  else if(s===3){ html=renderS3(); }
  else if(s===4){ html=renderS4(); }
  else if(s===5){ html=renderS5(); }
  else { html=renderS6(); }
  el.innerHTML=html;
  if(s===2){ wireS2(); }
  else if(s===3){ wireS3(); }
  else if(s===4){ wireS4(); }
  else if(s===5){ wireS5(); }
  renderChrome();
  updateActions();
  if(!keepFocus){
    var h=$("h"); if(h){ h.focus(); }
    window.scrollTo(0,0);
  }
}
function goTo(n){
  if(n===4 && !S.af && !S.message.trim() && !S.subject.trim() && planComplete()){
    var c=composePlan();
    S.message=c.body.slice(0,250); S.subject=c.subject; S.af=true;
  }
  S.screen=n;
  if(n===5 && S.mode==="type"){ run.result=null; run.changedNote=false; }
  queueSave();
  renderScreen(false);
}
function resetAll(){
  resetRecorder();
  var lang=S.lang;
  S=freshState(lang);
  resetRun(); S.s2Checked=false;
  doneShown=false;
  doneBtn.disabled=true;
  saveProgress();
  renderScreen(false);
  announce(T("s1Title"));
}

mainBtn.addEventListener("click",function(){
  if(mainBtn.disabled){ return; }
  var s=S.screen;
  if(s===2 && !S.phraseOK){ return; }
  if(s===3 && !planComplete()){ return; }
  if(s===4 && !responseReady()){ return; }
  if(s===5 && !finishReady()){ return; }
  goTo(s+1);
});
retryBtn.addEventListener("click",resetAll);
doneBtn.addEventListener("click",function(){
  if(doneBtn.disabled || S.screen!==6){ return; }
  activityCompleted();
  doneShown=true;
  doneBtn.textContent=T("doneOk");
  announce(T("doneSaid"));
  saveProgress();
});
$("langBtn").addEventListener("click",function(){
  S.lang=(S.lang==="en")?"fr":"en";
  queueSave();
  renderScreen(true);
  $("langBtn").focus();
});
window.addEventListener("pagehide",function(){
  resetRecorder();
  try{ saveProgress(); }catch(e){}
  if(SC.api && SC.inited){
    try{ lmsCommit(); if(SC.ver==="2004"){ SC.api.Terminate(""); } else { SC.api.LMSFinish(""); } }catch(e){}
    SC.inited=false;
  }
});

/* ================= start ================= */
(function init(){
  var saved=null;
  try{ saved=loadSaved(); }catch(e){ saved=null; }
  if(saved){ try{ restoreState(saved); }catch(e){ S=freshState("en"); } }
  else { S=freshState("en"); }
  S.s2Checked=!!S.phraseOK;
  if(S.s2Checked){ run.s2Msg=""; }
  resetRun();
  doneBtn.disabled=true;
  renderScreen(true);
})();

})();
</script>
</body>
</html>
