<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission - Asking for a solution</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF6D6;
  --focus:#14505E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Open Sans",Arial,sans-serif;background:#fff;color:var(--pazapa-grey-dark);line-height:1.5;font-size:1rem;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 8px 0;line-height:1.25;}
h2{font-size:1.4rem;}
h3{font-size:1.05rem;}
.app{max-width:760px;margin:0 auto;padding:12px 16px 48px 16px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px 0;border-bottom:4px solid var(--pazapa-blue);margin-bottom:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:36px;width:auto;display:block;}
.brand span{font-weight:700;font-size:.95rem;}
.top-right{display:flex;align-items:center;gap:10px;}
.progress{font-size:.9rem;background:var(--pazapa-grey-light);border-radius:999px;padding:6px 14px;white-space:nowrap;}
.progress-track{display:flex;gap:6px;margin-bottom:16px;}
.progress-dot{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
.progress-dot.done{background:var(--pazapa-blue-dark);}
.progress-dot.current{background:var(--pazapa-yellow);}
button{font-family:inherit;touch-action:manipulation;}
button.lang{min-height:48px;min-width:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--pazapa-blue-dark);background:#fff;color:var(--pazapa-blue-dark);font-weight:700;font-size:.95rem;cursor:pointer;}
button.lang:hover{background:var(--blue-tint);}
.screen{outline:none;}
.screen[hidden]{display:none;}
.card{background:var(--blue-tint);border-radius:16px;padding:20px;margin-bottom:16px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:#fff;border:2px solid var(--pazapa-grey-light);}
.lead{font-size:1.1rem;margin:0 0 14px 0;}
.sub{color:#4a4b46;font-size:.95rem;margin:0 0 12px 0;}
.fr{display:block;font-size:.85rem;color:#3c5a63;font-style:italic;margin-top:2px;}
.illus{width:100%;max-width:240px;display:block;margin:0 auto 14px auto;border-radius:14px;}
.illus-sm{width:88px;height:88px;border-radius:12px;flex:none;object-fit:cover;}
.info-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0;}
@media(min-width:560px){.info-grid{grid-template-columns:1fr 1fr;}}
.info{background:#fff;border-radius:12px;padding:12px 14px;border-left:6px solid var(--pazapa-blue);}
.info b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--pazapa-blue-dark);}
.goal{background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:14px;padding:14px 16px;margin-top:8px;font-weight:600;}
.phrase-list{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0;padding:0;border:0;min-inline-size:0;}
@media(min-width:560px){.phrase-list{grid-template-columns:1fr 1fr;}}
.phrase{position:relative;}
.phrase input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;inset:0;}
.phrase label{display:flex;align-items:center;gap:10px;min-height:56px;background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;}
.phrase input:checked + label{background:var(--green-tint);border-color:#4f6a00;box-shadow:inset 0 0 0 2px #4f6a00;}
.phrase input:checked + label::before{content:"\2713";font-weight:800;color:#3b5000;}
.phrase input:focus-visible + label{outline:3px solid var(--focus);outline-offset:2px;}
.phrase.bad-flag label{border-color:#8a6400;background:#FFF8E1;}
.count{font-size:.9rem;color:#4a4b46;margin:0 0 6px 0;}
.feedback{min-height:24px;font-weight:700;margin:8px 0;}
.feedback.ok{color:#2c5a0b;}
.feedback.retry{color:#7a5600;}
.box{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0;border:2px solid var(--pazapa-grey-light);}
.box.yellow{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.nav-row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px;margin-top:20px;}
button.nav,button.sec,button.chip-btn{min-height:48px;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer;padding:10px 22px;}
button.nav{background:var(--pazapa-blue-dark);color:#fff;border:2px solid var(--pazapa-blue-dark);}
button.nav[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#595955;cursor:not-allowed;}
button.nav.done-ok{background:var(--pazapa-green);border-color:#7f8f12;color:var(--pazapa-grey-dark);}
button.sec{background:#fff;color:var(--pazapa-blue-dark);border:2px solid var(--pazapa-blue-dark);}
button.sec:hover{background:var(--blue-tint);}
button.sec[disabled]{opacity:.5;cursor:not-allowed;}
button.help{background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);border:2px solid var(--pazapa-yellow);min-height:48px;border-radius:999px;font-weight:700;padding:10px 20px;cursor:pointer;}
button.chip-btn{background:#fff;border:2px solid var(--pazapa-blue-dark);color:var(--pazapa-grey-dark);font-weight:600;padding:8px 14px;font-size:.95rem;}
button.chip-btn:hover{background:var(--blue-tint);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
fieldset{border:0;padding:0;margin:0 0 14px 0;min-inline-size:0;}
legend{font-weight:700;padding:0;margin-bottom:6px;}
.radio-chips{display:flex;flex-wrap:wrap;gap:8px;}
.radio-chip{position:relative;}
.radio-chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;}
.radio-chip label{display:inline-flex;align-items:center;min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--pazapa-blue-dark);background:#fff;font-weight:600;cursor:pointer;}
.radio-chip input:checked + label{background:var(--pazapa-blue-dark);color:#fff;}
.radio-chip input:checked + label .fr{color:#e6f6f9;}
.radio-chip input:focus-visible + label{outline:3px solid var(--focus);outline-offset:2px;}
.plan-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0;}
.plan-sec{background:#fff;border-radius:12px;padding:12px 14px;border-top:6px solid var(--pazapa-blue);}
.plan-sec.s2{border-top-color:var(--pazapa-yellow);}
.plan-sec.s3{border-top-color:var(--pazapa-green);}
.plan-sec ul{margin:6px 0 0 0;padding-left:20px;}
.plan-sec .empty{color:#595955;font-style:italic;}
.tray-row{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px;}
.tray-row select{min-height:48px;font-family:inherit;font-size:1rem;border:2px solid var(--pazapa-blue-dark);border-radius:10px;padding:8px;background:#fff;color:var(--pazapa-grey-dark);}
label.lbl{font-weight:700;font-size:.92rem;}
.turn{margin:12px 0;}
.say{background:#fff;border-radius:14px;padding:12px 14px;border-left:6px solid var(--pazapa-green);margin-bottom:8px;}
.say b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#4f6a00;}
.choice-list{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
button.choice{text-align:left;font-size:1rem;background:#fff;border:2px solid var(--pazapa-blue-dark);border-radius:12px;padding:12px 16px;min-height:52px;cursor:pointer;color:var(--pazapa-grey-dark);font-weight:600;}
button.choice:hover{background:var(--blue-tint);}
button.choice.right{background:var(--green-tint);border-color:#4f6a00;}
button.choice.right::before{content:"\2713 ";font-weight:800;}
button.choice.wrong{background:#FFF8E1;border-color:#8a6400;}
button.choice.wrong::before{content:"\21BB ";font-weight:800;}
button.choice[disabled]{cursor:default;}
.mode-row{display:flex;gap:10px;margin:10px 0;}
.mode-row .radio-chip{flex:1;}
.mode-row .radio-chip label{width:100%;justify-content:center;}
textarea{width:100%;min-height:130px;font-family:inherit;font-size:1rem;padding:12px;border:2px solid var(--pazapa-blue-dark);border-radius:12px;color:var(--pazapa-grey-dark);background:#fff;resize:vertical;}
textarea[readonly]{background:#fafafa;}
.speak-controls{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
.rec-status{font-size:.95rem;font-weight:600;margin:6px 0;min-height:24px;}
.check-list{list-style:none;padding:0;margin:12px 0;}
.check-item{background:#fff;border-radius:12px;margin-bottom:8px;position:relative;}
.check-item input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;}
.check-item label{display:flex;gap:12px;align-items:flex-start;min-height:56px;padding:12px 14px;border:2px solid var(--pazapa-grey-light);border-radius:12px;cursor:pointer;}
.check-item label::before{content:"";flex:none;width:26px;height:26px;border:3px solid var(--pazapa-blue-dark);border-radius:6px;background:#fff;margin-top:2px;}
.check-item input:checked + label{background:var(--green-tint);border-color:#4f6a00;}
.check-item input:checked + label::before{content:"\2713";text-align:center;line-height:20px;font-weight:800;background:var(--pazapa-green);border-color:#4f6a00;}
.check-item input:focus-visible + label{outline:3px solid var(--focus);outline-offset:2px;}
.check-item small{display:block;color:#4a4b46;}
.final-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px;}
.done-note{text-align:center;font-weight:700;min-height:26px;margin-top:12px;color:#2c5a0b;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="brand"><img id="logoImg" alt="Pazapa"><span data-i18n="brand">English for Adults</span></div>
    <div class="top-right">
      <span class="progress" id="progressLabel"></span>
      <button type="button" class="lang" id="langBtn"></button>
    </div>
  </div>
  <div class="progress-track" id="progressTrack" aria-hidden="true"></div>

  <section id="s1" class="screen" tabindex="-1" aria-labelledby="h1" hidden></section>
  <section id="s2" class="screen" tabindex="-1" aria-labelledby="h2" hidden></section>
  <section id="s3" class="screen" tabindex="-1" aria-labelledby="h3" hidden></section>
  <section id="s4" class="screen" tabindex="-1" aria-labelledby="h4" hidden></section>
  <section id="s5" class="screen" tabindex="-1" aria-labelledby="h5" hidden></section>
  <section id="s6" class="screen" tabindex="-1" aria-labelledby="h6" hidden>
    <div class="card green">
      <img class="illus" id="doneImg" alt="">
      <h2 id="h6" tabindex="-1" data-i18n="s6_h">Communication Mission complete.</h2>
      <p class="lead" data-i18n="s6_a">You communicated about asking for a solution.</p>
      <p class="sub" data-i18n="s6_b">Next, you will review, improve and retry.</p>
      <div class="final-row">
        <button type="button" class="nav" id="retryBtn" data-i18n="try_again" style="background:#fff;color:var(--pazapa-blue-dark)">Try again</button>
        <button type="button" class="nav" id="doneBtn" data-i18n="done">Done</button>
      </div>
      <div class="done-note" id="doneNote" role="status" aria-live="polite"></div>
    </div>
  </section>

  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</div>

/* ============================================================
   LMS (SCORM 1.2 / 2004) - quiet, guarded, never downgrades
   ============================================================ */
var lms = {api:null, ver:null, init:false};
function scan(win, name){
  var n=0;
  try{
    while(win && n<25){
      try{ if(win[name]) return win[name]; }catch(e){}
      if(win.parent && win.parent!==win){ win = win.parent; } else { break; }
      n++;
    }
  }catch(e2){}
  return null;
}
function discoverLms(){
  if(lms.api) return true;
  var cands = [window];
  try{ if(window.opener && !window.opener.closed) cands.push(window.opener); }catch(e){}
  for(var i=0;i<cands.length;i++){
    var a = scan(cands[i],"API_1484_11");
    if(a){ lms.api=a; lms.ver="2004"; break; }
    a = scan(cands[i],"API");
    if(a){ lms.api=a; lms.ver="1.2"; break; }
  }
  if(lms.api && !lms.init){
    try{
      var r = lms.ver==="2004" ? lms.api.Initialize("") : lms.api.LMSInitialize("");
      lms.init = (String(r)==="true");
      if(!lms.init){ // may already be initialised by the player
        lms.init = true;
      }
    }catch(e3){ lms.api=null; lms.ver=null; return false; }
  }
  return !!lms.api;
}
function lmsGet(k){ try{ return String(lms.ver==="2004" ? lms.api.GetValue(k) : lms.api.LMSGetValue(k)); }catch(e){ return ""; } }
function lmsSet(k,v){ try{ return String(lms.ver==="2004" ? lms.api.SetValue(k,v) : lms.api.LMSSetValue(k,v))==="true"; }catch(e){ return false; } }
function lmsCommit(){ try{ return String(lms.ver==="2004" ? lms.api.Commit("") : lms.api.LMSCommit(""))==="true"; }catch(e){ return false; } }
function lmsStatusDone(){
  if(!lms.api) return false;
  if(lms.ver==="2004"){
    var c=lmsGet("cmi.completion_status"), s=lmsGet("cmi.success_status");
    return c==="completed" || s==="passed";
  }
  var st=lmsGet("cmi.core.lesson_status");
  return st==="completed" || st==="passed";
}
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }

/* compact, versioned, text/choice-only progress */
function pack(){
  return JSON.stringify({v:VERSION,s:state.screen,l:state.lang,sel:state.sel,po:state.phraseOK?1:0,a:state.assign,
    o:state.ordered,r:state.received,tm:state.time,t1:state.t1,t2:state.t2,tx:state.text,m:state.mode,al:state.aloud?1:0,
    ck:state.checks.map(function(c){return c?1:0;}),at:state.attempts,h:state.help?1:0,md:state.model?1:0,k:state.kind});
}
var saveTimer=null;
function saveProgress(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    var data=pack();
    if(data.length>3500) return;
    if(discoverLms()){
      lmsSet("cmi.suspend_data",data);
      lmsCommit();
    } else {
      lsSet(STORE_KEY,data);
    }
  },350);
}
function loadProgress(){
  var raw=null;
  if(discoverLms()){ raw=lmsGet("cmi.suspend_data"); } else { raw=lsGet(STORE_KEY); }
  if(!raw) return;
  var d; try{ d=JSON.parse(raw); }catch(e){ return; }
  if(!d || d.v!==VERSION || typeof d!=="object") return;
  var s=freshState(d.l==="fr"?"fr":"en");
  var ids=PHRASES.map(function(p){return p.id;});
  if(Array.isArray(d.sel)) s.sel=d.sel.filter(function(x){return ids.indexOf(x)>-1;}).slice(0,8);
  if(d.a && typeof d.a==="object"){ s.sel.forEach(function(id){ var v=d.a[id]; if(v==="open"||v==="req"||v==="close") s.assign[id]=v; }); }
  s.ordered = ORDERED.some(function(o){return o.en===d.o;})?d.o:"";
  s.received= RECEIVED.some(function(o){return o.en===d.r;})?d.r:"";
  s.time    = TIMES.some(function(o){return o.en===d.tm;})?d.tm:"";
  s.t1 = (d.t1===0)?0:-1;
  s.t2 = (d.t2===0||d.t2===1)?d.t2:-1;
  s.text = (typeof d.tx==="string")?d.tx.slice(0,MAXLEN):"";
  s.mode = d.m==="speak"?"speak":"type";
  s.aloud = d.al===1;
  if(Array.isArray(d.ck)) s.checks=[0,1,2,3].map(function(i){return d.ck[i]===1;});
  s.attempts = Math.min(5, d.at|0); s.help = d.h===1; s.model = d.md===1;
  s.kind = d.k||"";
  // Revalidate against current requirements instead of trusting stale flags
  s.phraseOK = phrasesValid(s.sel);
  var scr = Math.max(1, Math.min(6, d.s|0));
  if(scr>=3 && !s.phraseOK) scr=2;
  if(scr>=4 && !planValid(s)) scr=3;
  if(scr>=5){
    var ev = evidenceKind(s);   // recordings are never restored
    if(!ev){ scr=4; } else { s.kind=ev; s.reviewed=true; }
  }
  if(scr>=6 && !s.checks.every(Boolean)) scr=5;
  s.screen=scr;
  state=s;
}

function sendCompletion(){
  if(completionSent) return true;
  var ok=false;
  if(discoverLms()){
    if(lmsStatusDone()){ ok=true; }
    else{
      var set = lms.ver==="2004" ? lmsSet("cmi.completion_status","completed") : lmsSet("cmi.core.lesson_status","completed");
      if(lms.ver==="2004") lmsSet("cmi.success_status","passed");
      lmsSet("cmi.suspend_data",pack());
      var c = lmsCommit();
      var verified = lmsStatusDone();
      if(set && c && !verified){ lmsCommit(); verified = lmsStatusDone(); }
      ok = set && (verified || c);
    }
  } else {
    ok = lsSet(STORE_KEY+"_completed","1");
    ok = true;
  }
  if(ok){ completionSent=true; }
  return ok;
}
function activityCompleted(){
  var ok = sendCompletion();
  if(ok){ try{ console.log("W15D3 Communication Mission completed"); }catch(e){} }
  return ok;
}

/* ============================================================
   Analysis of the typed message (documented phrase groups)
   ============================================================ */
function normalise(s){
  s = String(s||"").normalize("NFKC").toLowerCase();
  s = s.replace(/[‘’ʼ`]/g,"'").replace(/[“”]/g,'"');
  s = s.replace(/\s+/g," ").trim().replace(/[.!?\s]+$/,"");
  return s;
}
/* Each group lists accepted wordings (not one exact sentence). */
var GROUPS = {
  problem:/(wrong|not correct|incorrect|different|ordered|received|got a|broken|late|missing|mistake|error|problem|did not|didn't|not what)/,
  request:/(replace|refund|check|repair|correct (item|bill|one)|send (me )?the|exchange|can you|could you|would like|i want|i need|please)/,
  lesson:/(replace|refund|check (my|the) order|repair|correct bill|deliver|apologi[sz]e|can you replace|could you check|would like a refund)/,
  arrive:/(when will|will it arrive|arrive|arrival|deliver|what happens next|how long|what time|when can)/,
  polite:/(thank|thanks|please|sorry|appreciate)/
};
function analyse(text){
  var n = normalise(text);
  var r = {problem:GROUPS.problem.test(n), request:GROUPS.request.test(n), lesson:GROUPS.lesson.test(n),
           arrive:GROUPS.arrive.test(n), polite:GROUPS.polite.test(n), empty:n.length===0};
  r.ok = !r.empty && r.problem && r.request && r.lesson;
  return r;
}
function suggestionFor(a){
  if(!a.problem) return t("m_problem");
  if(!a.request || !a.lesson) return t("m_request");
  if(!a.arrive) return t("m_arrive");
  if(!a.polite) return t("m_polite");
  return "";
}
function successFor(a){
  if(a.problem) return t("ok_problem");
  if(a.request) return t("ok_request");
  if(a.arrive) return t("ok_arrive");
  if(a.polite) return t("ok_polite");
  return "";
}
function feedbackPanel(a){
  var h = '<div class="box" aria-live="polite">';
  h += '<p style="margin:0 0 6px 0"><strong>'+esc(a.ok? t("fb_ok") : t("fb_more"))+'</strong></p>';
  var s = successFor(a); if(s) h += '<p style="margin:0 0 6px 0">✓ '+esc(s)+'</p>';
  var g = suggestionFor(a); if(g) h += '<p style="margin:0">'+esc(t("fb_next"))+esc(g)+'</p>';
  return h+'</div>';
}

/* ============================================================
   Validation helpers
   ============================================================ */
function phrasesValid(sel){
  if(!sel || sel.length<3 || sel.length>4) return false;
  return sel.every(function(id){ var p=phrase(id); return p && p.kind!=="bad"; });
}
function planValid(s){
  var hasReq=false;
  s.sel.forEach(function(id){ if(s.assign[id]==="req") hasReq=true; });
  return hasReq && !!s.ordered && !!s.received;
}
function evidenceKind(s){
  if(s.mode==="type" || (!s.aloud)){
    if(analyse(s.text).ok) return "typed";
  }
  if(s.aloud) return "spoken";
  if(rec.url && rec.status==="ready") return "recorded";
  if(s.text && s.text.trim() && s.attempts>=2) return "typed";
  return "";
}
function invalidate(){ state.reviewed=false; saveProgress(); }

/* ============================================================
   Recording (optional, direct action only, never stored)
   ============================================================ */
var rec = {status:"idle", url:null, stream:null, mr:null, chunks:[], gen:0, audio:null, playing:false, timer:null, secs:0, err:null};
function pickMime(){
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  if(!window.MediaRecorder || typeof MediaRecorder.isTypeSupported!=="function") return "";
  for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return "";
}
function recSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function classify(err){
  var n = err && err.name ? err.name : "";
  if(n==="NotAllowedError"||n==="PermissionDeniedError"||n==="SecurityError") return "e_denied";
  if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") return "e_nodev";
  return "e_fail";
}
function stopTracks(){ if(rec.stream){ try{ rec.stream.getTracks().forEach(function(tr){tr.stop();}); }catch(e){} rec.stream=null; } }
function clearTimer(){ if(rec.timer){ clearInterval(rec.timer); rec.timer=null; } }
function revokeUrl(){ if(rec.url){ try{ URL.revokeObjectURL(rec.url); }catch(e){} rec.url=null; } }
function stopPlayback(){
  if(rec.audio){ try{ rec.audio.onended=null; rec.audio.onerror=null; rec.audio.pause(); }catch(e){} rec.audio=null; }
  rec.playing=false;
}
function discardRecording(){
  rec.gen++;
  stopPlayback(); clearTimer();
  if(rec.mr && rec.mr.state && rec.mr.state!=="inactive"){ try{ rec.mr.onstop=null; rec.mr.stop(); }catch(e){} }
  rec.mr=null; stopTracks(); revokeUrl();
  rec.chunks=[]; rec.status="idle"; rec.secs=0; rec.err=null;
}
function startRecording(){
  if(rec.status==="starting"||rec.status==="recording"||rec.status==="stopping") return;
  if(!recSupported()){ rec.err="e_unsup"; updateRec(); return; }
  stopPlayback();
  revokeUrl(); rec.err=null; rec.status="starting"; updateRec();
  var gen=++rec.gen;
  var p;
  try{ p = navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ rec.status="idle"; rec.err=classify(e); updateRec(); return; }
  p.then(function(stream){
    if(gen!==rec.gen){ stream.getTracks().forEach(function(tr){tr.stop();}); return; }
    rec.stream=stream; rec.chunks=[];
    var mime=pickMime(), mr;
    try{ mr = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(e2){ stopTracks(); rec.status="idle"; rec.err="e_fail"; updateRec(); return; }
    rec.mr=mr;
    mr.ondataavailable=function(ev){ if(ev.data && ev.data.size>0) rec.chunks.push(ev.data); };
    mr.onerror=function(){ if(gen!==rec.gen) return; clearTimer(); stopTracks(); rec.status="idle"; rec.err="e_fail"; updateRec(); };
    mr.onstop=function(){
      if(gen!==rec.gen) return;
      clearTimer(); stopTracks();
      var blob = new Blob(rec.chunks,{type:mr.mimeType||mime||"audio/mp4"});
      if(!blob.size){ rec.status="idle"; rec.err="e_empty"; }
      else { revokeUrl(); rec.url=URL.createObjectURL(blob); rec.status="ready"; rec.err=null; invalidate(); }
      updateRec();
    };
    try{ mr.start(); }catch(e3){ stopTracks(); rec.status="idle"; rec.err="e_fail"; updateRec(); return; }
    rec.status="recording"; rec.secs=0; updateRec();
    rec.timer=setInterval(function(){ rec.secs++; updateRec(true); },1000);
  }).catch(function(err){
    if(gen!==rec.gen) return;
    stopTracks(); rec.status="idle"; rec.err=classify(err); updateRec();
  });
}
function stopRecording(){
  if(rec.status!=="recording" || !rec.mr) return;
  rec.status="stopping"; updateRec();
  try{ if(rec.mr.state!=="inactive") rec.mr.stop(); }catch(e){ clearTimer(); stopTracks(); rec.status="idle"; rec.err="e_fail"; updateRec(); }
}
function togglePlayback(){
  if(!rec.url || rec.status!=="ready") return;
  if(rec.playing){ stopPlayback(); updateRec(); return; }
  var gen=rec.gen, a=new Audio(rec.url);
  rec.audio=a; rec.playing=true;
  a.onended=function(){ if(gen!==rec.gen) return; rec.playing=false; rec.audio=null; updateRec(); };
  a.onerror=function(){ if(gen!==rec.gen) return; rec.playing=false; rec.audio=null; rec.err="e_fail"; updateRec(); };
  var pr; try{ pr=a.play(); }catch(e){ pr=null; }
  if(pr && pr.catch){ pr.catch(function(){ if(gen!==rec.gen) return; rec.playing=false; rec.audio=null; rec.err="e_fail"; updateRec(); }); }
  updateRec();
}
function fmt(s){ var m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }
function updateRec(timerOnly){
  var st=$("recStatus"); if(!st) return;
  var rb=$("recBtn"), sb=$("stopBtn"), hb=$("hearBtn"), tb=$("againBtn");
  var msg;
  if(rec.err) msg=t(rec.err);
  else if(rec.status==="starting") msg=t("r_start");
  else if(rec.status==="recording") msg=t("r_rec",{t:fmt(rec.secs)});
  else if(rec.status==="stopping") msg=t("r_ready");
  else if(rec.status==="ready") msg= rec.playing ? t("r_play") : t("r_ready");
  else if(state.aloud) msg=t("r_spoken");
  else msg=t("r_idle");
  if(timerOnly){ if(rec.status==="recording"){ st.textContent=msg; } return; }
  st.textContent=msg;
  var busy = rec.status==="starting"||rec.status==="recording"||rec.status==="stopping";
  rb.disabled = busy || rec.status==="ready" || !recSupported();
  sb.disabled = rec.status!=="recording";
  hb.disabled = !(rec.status==="ready" && rec.url);
  hb.textContent = rec.playing ? t("pause") : t("hear");
  tb.disabled = busy;
  sb.setAttribute("aria-pressed", rec.status==="recording" ? "true":"false");
}

function buildPlanText(){
  var L=planLines(), parts=[openingLine()];
  ["open","req","close"].forEach(function(k){ L[k].forEach(function(id){ parts.push(phrase(id).en); }); });
  var s=parts.join(" ");
  if(state.time && L.req.indexOf("arrive")<0 && L.open.indexOf("arrive")<0 && L.close.indexOf("arrive")<0){ /* time only goes in the reply if learner adds it */ }
  return s.slice(0,MAXLEN);
}
function chipGroup(name, legend, arr, cur){
  var h='<fieldset><legend>'+esc(legend)+'</legend><div class="radio-chips">';
  arr.forEach(function(o,i){
    h+='<div class="radio-chip"><input type="radio" name="'+name+'" id="'+name+i+'" value="'+esc(o.en)+'"'+(cur===o.en?' checked':'')+'>'+
       '<label for="'+name+i+'"><span>'+esc(o.en)+frLine(o.fr)+'</span></label></div>';
  });
  return h+'</div></fieldset>';
}
function renderPlanPreview(){
  var L=planLines(), h='';
  var secs=[["open","s1",true],["req","s2",false],["close","s3",false]];
  secs.forEach(function(s){
    var k=s[0], items='';
    if(k==="open" && (state.ordered||state.received)){
      items+='<li>'+esc(openingLine())+'</li>';
    }
    L[k].forEach(function(id){ var p=phrase(id); items+='<li>'+esc(p.en)+frLine(p.fr)+'</li>'; });
    h+='<div class="plan-sec '+s[1]+'"><h3>'+esc(secLabel(k))+'</h3>'+
       (items?'<ul>'+items+'</ul>':'<span class="empty">'+esc(t("nothing"))+'</span>')+'</div>';
  });
  return h;
}
function s3Ready(){ return planValid(state); }
function renderS3(){
  var tray = state.sel.map(function(id){
    var p=phrase(id), cur=state.assign[id]||"req";
    var opts=["open","req","close"].map(function(k){
      return '<option value="'+k+'"'+(cur===k?' selected':'')+'>'+esc(secLabel(k))+'</option>';
    }).join("");
    return '<div class="tray-row"><div><strong>'+esc(p.en)+'</strong>'+frLine(p.fr)+'</div>'+
      '<label class="lbl" for="as_'+id+'">'+esc(t("where_go"))+'</label>'+
      '<select id="as_'+id+'" data-id="'+id+'">'+opts+'</select></div>';
  }).join("");
  var h='<div class="card">'+
    '<h2 id="h3" tabindex="-1">'+esc(t("s3_h"))+'</h2>'+
    '<p class="lead">'+esc(t("s3_i"))+'</p>'+
    '<h3>'+esc(t("tray"))+'</h3>'+tray+
    chipGroup("ord",t("d_ordered"),ORDERED,state.ordered)+
    chipGroup("rcv",t("d_received"),RECEIVED,state.received)+
    chipGroup("tim",t("d_time"),TIMES,state.time)+
    '<h3>'+esc(t("my_plan"))+'</h3>'+
    '<div class="plan-grid" id="planGrid">'+renderPlanPreview()+'</div>'+
    '<button type="button" class="help" id="exBtn" aria-expanded="'+(state.planEx?'true':'false')+'" aria-controls="exBox">'+esc(state.planEx?t("hide_ex"):t("show_ex"))+'</button>'+
    '<div class="box yellow" id="exBox"'+(state.planEx?'':' hidden')+'><strong>'+esc(t("ex_title"))+'</strong><p style="margin:6px 0 0 0">'+esc(EXAMPLE_EN)+'</p>'+frLine(EXAMPLE_FR)+'</div>'+
    '<p class="sub" id="s3Need"'+(s3Ready()?' hidden':'')+'>'+esc(t("s3_need"))+'</p>'+
    navRow('<button type="button" class="nav" id="s3Next"'+(s3Ready()?'':' disabled')+'>'+esc(t("cont"))+'</button>')+
  '</div>';
  screens[3].innerHTML=h;
  function refresh(){
    $("planGrid").innerHTML=renderPlanPreview();
    var ok=s3Ready(); $("s3Next").disabled=!ok; $("s3Need").hidden=ok;
    invalidate();
  }
  Array.prototype.forEach.call(screens[3].querySelectorAll('select[data-id]'),function(sel){
    sel.onchange=function(){ state.assign[sel.getAttribute("data-id")]=sel.value; refresh(); };
  });
  [["ord","ordered"],["rcv","received"],["tim","time"]].forEach(function(g){
    Array.prototype.forEach.call(screens[3].querySelectorAll('input[name="'+g[0]+'"]'),function(r){
      r.onchange=function(){ state[g[1]]=r.value; refresh(); };
    });
  });
  $("exBtn").onclick=function(){
    state.planEx=!state.planEx; state.help=true;
    $("exBox").hidden=!state.planEx; this.textContent=state.planEx?t("hide_ex"):t("show_ex");
    this.setAttribute("aria-expanded",state.planEx?"true":"false"); saveProgress();
  };
  $("s3Next").onclick=function(){ if(s3Ready()) go(4); };
}

function saraTime(){ return state.time || "tomorrow"; }
function timeFr(){ var f="demain"; TIMES.forEach(function(o){ if(o.en===saraTime()) f=o.fr; }); return f; }
function saraReply3(){
  var refund = state.t2===1;
  var en = refund ? "Yes. We'll send your refund "+saraTime()+"." : "Yes. We'll deliver the correct item "+saraTime()+".";
  var fr = refund ? "Oui. Nous enverrons votre remboursement "+timeFr()+"." : "Oui. Nous livrerons le bon article "+timeFr()+".";
  return [en,fr];
}
function turnBlock(idx, data, cur){
  var h='<div class="turn"><div class="say"><b>'+esc(t("sara"))+'</b>'+esc(data.sara[0])+frLine(data.sara[1])+'</div>';
  h+='<div class="choice-list" role="group" aria-label="'+esc(t("you"))+'" id="turn'+idx+'">';
  data.opts.forEach(function(o,i){
    var cls = cur===i ? 'choice right' : 'choice';
    h+='<button type="button" class="'+cls+'" data-turn="'+idx+'" data-i="'+i+'"'+(cur>-1?' disabled':'')+'>'+esc(o.en)+frLine(o.fr)+'</button>';
  });
  h+='</div><div id="tfb'+idx+'" role="status" aria-live="polite">'+(cur>-1?fbHtml("ok",t("turn_ok")):"")+'</div></div>';
  return h;
}
function turnsDone(){ return state.t1===0 && (state.t2===0||state.t2===1); }

function starterBtns(){
  var st=["I ordered a ","I received a ","Can you ","When will it arrive?","Thank you for your help."];
  return st.map(function(s,i){ return '<button type="button" class="chip-btn" data-ins="'+esc(s)+'">'+esc(s.trim()+(i<3?"…":""))+'</button>'; }).join("");
}
function trayBtns(){
  return state.sel.map(function(id){ var p=phrase(id); return '<button type="button" class="chip-btn" data-ins="'+esc(p.en)+'">'+esc(p.en)+'</button>'; }).join("");
}
function detailBtns(){
  var out=[];
  if(state.ordered) out.push(state.ordered);
  if(state.received) out.push(state.received);
  if(state.time) out.push(state.time);
  return out.map(function(d){ return '<button type="button" class="chip-btn" data-ins="'+esc(d)+'">'+esc(d)+'</button>'; }).join("");
}
function insertAtCursor(txt){
  var ta=$("msg"); if(!ta) return;
  var s=ta.selectionStart!=null?ta.selectionStart:ta.value.length, e=ta.selectionEnd!=null?ta.selectionEnd:s;
  var v=ta.value, pre=v.slice(0,s), post=v.slice(e);
  if(pre && !/\s$/.test(pre)) txt=" "+txt;
  var nv=(pre+txt+post).slice(0,MAXLEN);
  ta.value=nv; state.text=nv; var pos=Math.min(nv.length,(pre+txt).length);
  ta.focus(); try{ ta.setSelectionRange(pos,pos); }catch(e2){}
  updateCount(); invalidate();
}
function updateCount(){ var c=$("msgCount"); if(c) c.textContent=t("chars",{n:state.text.length}); }

function renderS4(){
  var h='<div class="card">'+
    '<img class="illus" src="'+IMGS.counter+'" alt="A customer at the counter pointing to the wrong item while the shop assistant listens.">'+
    '<h2 id="h4" tabindex="-1">'+esc(t("s4_h"))+'</h2>'+
    '<p class="lead">'+esc(t("s4_i"))+'</p>'+
    turnBlock(1,TURN1,state.t1);
  if(state.t1===0) h+=turnBlock(2,TURN2,state.t2);
  if(turnsDone()){
    var r3=saraReply3();
    h+='<div class="say"><b>'+esc(t("sara"))+'</b>'+esc(r3[0])+frLine(r3[1])+'</div>';
    h+='<h3>'+esc(t("s4_b"))+'</h3><p class="lead">'+esc(t("s4_bi"))+'</p>'+
      '<fieldset><legend class="sr-only">'+esc(t("mode_legend"))+'</legend><div class="mode-row">'+
        '<div class="radio-chip"><input type="radio" name="mode" id="modeType" value="type"'+(state.mode==="type"?' checked':'')+'><label for="modeType">'+esc(t("mode_type"))+'</label></div>'+
        '<div class="radio-chip"><input type="radio" name="mode" id="modeSpeak" value="speak"'+(state.mode==="speak"?' checked':'')+'><label for="modeSpeak">'+esc(t("mode_speak"))+'</label></div>'+
      '</div></fieldset>';
    h+='<div id="helpers">'+
        '<p class="count"><strong>'+esc(t("starters"))+'</strong></p><div class="chips">'+starterBtns()+'</div>'+
        '<p class="count"><strong>'+esc(t("tray"))+'</strong></p><div class="chips">'+trayBtns()+'</div>'+
        '<p class="count"><strong>'+esc(t("details"))+'</strong></p><div class="chips">'+detailBtns()+'</div>'+
      '</div>';
    h+='<div id="typePane"'+(state.mode==="type"?'':' hidden')+'>'+
        '<label class="lbl" for="msg">'+esc(t("msg_lbl"))+'</label>'+
        '<textarea id="msg" maxlength="'+MAXLEN+'" aria-describedby="msgCount">'+esc(state.text)+'</textarea>'+
        '<p class="count" id="msgCount" aria-live="polite"></p>'+
        '<button type="button" class="sec" id="addPlan">'+esc(t("add_plan"))+'</button>'+
      '</div>';
    h+='<div id="speakPane"'+(state.mode==="speak"?'':' hidden')+'>'+
        '<div class="box yellow"><p style="margin:0 0 6px 0"><strong>'+esc(t("my_plan"))+'</strong></p><p style="margin:0 0 6px 0">'+esc(buildPlanText())+'</p><p class="sub" style="margin:0">'+esc(t("speak_note"))+'</p></div>'+
        '<div class="speak-controls">'+
          '<button type="button" class="nav" id="recBtn">'+esc(t("rec"))+'</button>'+
          '<button type="button" class="sec" id="stopBtn" aria-pressed="false">'+esc(t("stop"))+'</button>'+
          '<button type="button" class="sec" id="hearBtn">'+esc(t("hear"))+'</button>'+
          '<button type="button" class="sec" id="againBtn">'+esc(t("try_again"))+'</button>'+
        '</div>'+
        '<div class="rec-status" id="recStatus" role="status" aria-live="polite"></div>'+
        '<button type="button" class="help" id="aloudBtn" aria-pressed="'+(state.aloud?'true':'false')+'">'+esc(t("aloud"))+'</button>'+
      '</div>';
    h+='<div id="s4Fb"></div><div id="s4More"></div>';
    h+=navRow('<button type="button" class="nav" id="s4Next">'+esc(t("review"))+'</button>');
  }
  h+='</div>';
  screens[4].innerHTML=h;

  // turns
  Array.prototype.forEach.call(screens[4].querySelectorAll('button[data-turn]'),function(b){
    b.onclick=function(){
      var turn=+b.getAttribute("data-turn"), i=+b.getAttribute("data-i");
      var data= turn===1?TURN1:TURN2, o=data.opts[i], fb=$("tfb"+turn);
      if(o.ok){
        if(turn===1) state.t1=0; else state.t2=i;
        saveProgress(); renderS4(); announce(t("turn_ok"));
        var nx = screens[4].querySelector('#turn'+(turn+1)+' button, #msg, #recBtn'); // keep place
        if(nx){ try{ nx.focus(); }catch(e){} }
      } else {
        Array.prototype.forEach.call($("turn"+turn).querySelectorAll("button"),function(x){ x.classList.remove("wrong"); });
        b.classList.add("wrong");
        fb.innerHTML=fbHtml("retry",t("turn_bad")); announce(t("turn_bad"));
      }
    };
  });
  if(!turnsDone()) return;

  var ta=$("msg"); updateCount();
  ta.oninput=function(){ state.text=ta.value; updateCount(); invalidate(); };
  Array.prototype.forEach.call(screens[4].querySelectorAll('#helpers [data-ins]'),function(b){
    b.onclick=function(){
      if(state.mode!=="type"){ state.mode="type"; renderS4(); }
      insertAtCursor(b.getAttribute("data-ins"));
    };
  });
  $("addPlan").onclick=function(){ state.text=buildPlanText(); ta.value=state.text; updateCount(); ta.focus(); invalidate(); };
  $("modeType").onchange=function(){ if(rec.status==="recording") stopRecording(); state.mode="type"; $("typePane").hidden=false; $("speakPane").hidden=true; invalidate(); };
  $("modeSpeak").onchange=function(){ state.mode="speak"; $("typePane").hidden=true; $("speakPane").hidden=false; updateRec(); invalidate(); };
  $("recBtn").onclick=startRecording;
  $("stopBtn").onclick=stopRecording;
  $("hearBtn").onclick=togglePlayback;
  $("againBtn").onclick=function(){ discardRecording(); state.aloud=false; $("aloudBtn").setAttribute("aria-pressed","false"); invalidate(); updateRec(); announce(t("r_idle")); };
  $("aloudBtn").onclick=function(){
    state.aloud=!state.aloud; this.setAttribute("aria-pressed",state.aloud?"true":"false");
    updateRec(); invalidate(); if(state.aloud) announce(t("r_spoken"));
  };
  updateRec();
  if(state.attempts>=2) showMoreHelp();
  $("s4Next").onclick=reviewMessage;
}

function showMoreHelp(){
  var box=$("s4More"); if(!box) return;
  var bank=PHRASES.filter(function(p){return p.kind!=="bad";}).map(function(p){ return '<li>'+esc(p.en)+frLine(p.fr)+'</li>'; }).join("");
  var h='<div class="box yellow"><h3>'+esc(t("bank"))+'</h3><ul style="margin:6px 0;padding-left:20px"><li>I received the wrong item.'+frLine("J'ai reçu le mauvais article.")+'</li>'+bank+'</ul>'+
    '<button type="button" class="help" id="modelBtn">'+esc(state.model?t("hide_ex"):t("show_ex"))+'</button>'+
    '<div id="modelBox"'+(state.model?'':' hidden')+' style="margin-top:10px"><strong>'+esc(t("ex_title"))+'</strong><p style="margin:6px 0 0 0">'+esc(EXAMPLE_EN)+'</p>'+frLine(EXAMPLE_FR)+'</div></div>';
  if(state.mode==="type" && state.text.trim()){
    h+='<div class="nav-row"><button type="button" class="sec" id="contAnyway">'+esc(t("cont_anyway"))+'</button></div>';
  }
  box.innerHTML=h;
  var mb=$("modelBtn");
  if(mb) mb.onclick=function(){ state.model=!state.model; state.help=true; $("modelBox").hidden=!state.model; mb.textContent=state.model?t("hide_ex"):t("show_ex"); saveProgress(); };
  var ca=$("contAnyway");
  if(ca) ca.onclick=function(){ state.kind="typed"; state.reviewed=true; go(5); };
}
function reviewMessage(){
  var fb=$("s4Fb");
  if(state.mode==="speak"){
    if(rec.status==="ready" && rec.url){ state.kind="recorded"; }
    else if(state.aloud){ state.kind="spoken"; }
    else { fb.innerHTML=fbHtml("retry",t("need_speak")); announce(t("need_speak")); return; }
    state.reviewed=true; go(5); return;
  }
  var a=analyse(state.text);
  if(a.empty){ fb.innerHTML=fbHtml("retry",t("need_text")); announce(t("need_text")); return; }
  if(a.ok){ state.kind="typed"; state.reviewed=true; fb.innerHTML=""; go(5); return; }
  state.attempts++; saveProgress();
  fb.innerHTML=feedbackPanel(a);
  if(state.attempts>=2) showMoreHelp();
}

function renderS5(){
  var a = state.kind==="typed" ? analyse(state.text) : null;
  var msgBlock="";
  if(state.kind==="typed"){
    msgBlock='<h3>'+esc(t("my_msg"))+'</h3><textarea readonly aria-label="'+esc(t("my_msg"))+'">'+esc(state.text)+'</textarea>'+feedbackPanel(a);
  } else if(state.kind==="recorded"){
    msgBlock='<h3>'+esc(t("my_msg"))+'</h3><p>'+esc(t("made_rec"))+'</p>'+
      '<div class="speak-controls"><button type="button" class="sec" id="hearBtn">'+esc(t("hear"))+'</button></div>'+
      '<div class="rec-status" id="recStatus" role="status" aria-live="polite"></div>'+
      '<button type="button" class="sr-only" id="stopBtn" disabled></button><button type="button" class="sr-only" id="recBtn" disabled></button><button type="button" class="sr-only" id="againBtn" disabled></button>';
  } else {
    msgBlock='<h3>'+esc(t("my_msg"))+'</h3><p>'+esc(t("did_aloud"))+'</p>';
  }
  var items=[["c1","c1x"],["c2","c2x"],["c3","c3x"],["c4","c4x"]].map(function(p,i){
    return '<li class="check-item"><input type="checkbox" id="ck'+i+'"'+(state.checks[i]?' checked':'')+'><label for="ck'+i+'"><span>'+esc(t(p[0]))+'<small>'+esc(t(p[1]))+'</small></span></label></li>';
  }).join("");
  var ready = state.reviewed && state.checks.every(Boolean);
  var h='<div class="card">'+
    '<h2 id="h5" tabindex="-1">'+esc(t("s5_h"))+'</h2>'+
    '<p class="lead">'+esc(t("s5_i"))+'</p>'+
    msgBlock+
    '<ul class="check-list">'+items+'</ul>'+
    '<p class="sub" id="s5Need"'+(ready?' hidden':'')+'>'+esc(t("s5_need"))+'</p>'+
    navRow('<button type="button" class="sec" id="improveBtn">'+esc(t("improve"))+'</button>'+
           '<button type="button" class="nav" id="s5Next"'+(ready?'':' disabled')+'>'+esc(t("finish"))+'</button>')+
  '</div>';
  screens[5].innerHTML=h;
  [0,1,2,3].forEach(function(i){
    $("ck"+i).onchange=function(){
      state.checks[i]=this.checked;
      var ok=state.reviewed && state.checks.every(Boolean);
      $("s5Next").disabled=!ok; $("s5Need").hidden=ok; saveProgress();
    };
  });
  $("improveBtn").onclick=function(){ state.reviewed=false; saveProgress(); go(4); };
  $("s5Next").onclick=function(){ if(state.reviewed && state.checks.every(Boolean)) go(6); };
  if(state.kind==="recorded"){ $("hearBtn").onclick=togglePlayback; updateRec(); }
}

function renderS6(){
  $("doneImg").src=IMGS.thanks;
  $("doneImg").alt="A customer and a shop assistant finishing a polite conversation.";
  applyDoneLabel();
}
function applyDoneLabel(){
  var finished = doneShown;
  doneBtn.textContent = finished ? t("done_ok") : t("done");
  doneBtn.className = finished ? "nav done-ok" : "nav";
  $("doneNote").textContent = finished ? t("done_msg") : "";
  $("retryBtn").textContent = t("try_again");
  $("h6").textContent=t("s6_h");
  var cards=$("s6").querySelectorAll("[data-i18n]");
  Array.prototype.forEach.call(cards,function(el){
    var k=el.getAttribute("data-i18n");
    if(k==="s6_a"||k==="s6_b"){ el.textContent=t(k); }
  });
}

/* ============================================================
   Navigation + chrome
   ============================================================ */
var RENDER=[null,renderS1,renderS2,renderS3,renderS4,renderS5,renderS6];
function chrome(){
  $("progressLabel").textContent=t("prog",{n:state.screen});
  var tr=$("progressTrack"); tr.innerHTML="";
  for(var i=1;i<=6;i++){
    var d=document.createElement("div");
    d.className="progress-dot"+(i<state.screen?" done":"")+(i===state.screen?" current":"");
    tr.appendChild(d);
  }
  var lb=$("langBtn");
  lb.textContent=t("lang_btn"); lb.setAttribute("aria-label",t("lang_aria"));
  lb.setAttribute("lang", state.lang==="fr" ? "en" : "fr");
  document.querySelector(".brand span").textContent=t("brand");
}
function show(n, focus){
  for(var i=1;i<=6;i++){ screens[i].hidden = (i!==n); }
  RENDER[n]();
  chrome();
  if(n===6){ doneBtn.disabled=false; } else { doneBtn.disabled=true; }
  if(focus){
    var hd=screens[n].querySelector("h2");
    if(hd){ hd.focus(); } else { screens[n].focus(); }
    window.scrollTo(0,0);
  }
}
function go(n){
  if(n!==4 && n!==5){ /* leave recording UI idle when moving on */ }
  state.screen=n; saveProgress(); show(n,true);
}
$("langBtn").onclick=function(){
  state.lang = state.lang==="fr" ? "en" : "fr";
  document.documentElement.setAttribute("lang","en-GB");
  saveProgress(); show(state.screen,false);
  announce(state.lang==="fr" ? "Français" : "English");
};
doneBtn.onclick=function(){
  if(doneBtn.disabled) return;
  activityCompleted();
  doneShown = true;
  applyDoneLabel(); announce(t("done_msg"));
};
$("retryBtn").onclick=function(){
  discardRecording();
  var lang=state.lang;
  doneShown=false;
  state=freshState(lang);
  saveProgress();
  show(1,true);
};

/* ============================================================
   Init
   ============================================================ */
$("logoImg").src=IMGS.logo;
$("s6").querySelector(".card img").src=IMGS.thanks;
loadProgress();
if(lmsStatusDone()){ completionSent=true; }
show(state.screen,false);
})();
</script>
