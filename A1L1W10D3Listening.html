<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W10D3 Listening Mission – Reporting household problems</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --blue-mid:#AEE3EF;
  --green-tint:#F4F7D9;
  --yellow-tint:#FFF3CC;
  --text-soft:#575755;
  --white:#fff;
  --focus:#2E2E2D;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Open Sans",Arial,sans-serif;background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);line-height:1.55;font-size:1.0625rem;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;margin:0 0 10px;line-height:1.25;color:var(--pazapa-grey-dark)}
h1{font-size:1.7rem}
h2{font-size:1.4rem}
h1:focus,h2:focus{outline:none}
button,[role="radio"],[role="checkbox"],.grip{touch-action:manipulation;font-family:inherit}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 6px #fff}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column}
.topbar{background:var(--pazapa-blue);color:var(--pazapa-grey-dark);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:.92rem}
.fr-btn{min-height:48px;min-width:48px;padding:8px 18px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);font-weight:700;font-size:.98rem}
.fr-btn[aria-pressed="true"]{background:var(--pazapa-grey-dark);color:#fff}
.progress{padding:12px 18px 10px;border-bottom:1px solid var(--pazapa-grey-light)}
.progress-label{font-size:.88rem;font-weight:700;margin-bottom:6px}
.track{height:10px;background:var(--pazapa-grey-light);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--pazapa-blue);border-radius:6px;transition:width .25s ease}
main{flex:1;padding:22px 18px 34px}
.screen[hidden]{display:none}
.eyebrow{font-size:.88rem;font-weight:700;color:var(--text-soft);margin:0 0 4px}
.instr{background:var(--blue-tint);border:1px solid var(--blue-mid);border-radius:12px;padding:12px 16px;margin:0 0 16px;font-weight:600}
/* French */
.fr-block{display:none}
body.fr-on .fr-block{display:block}
.fr-panel{background:var(--yellow-tint);border:1px solid #F3D77A;border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:.98rem}
.fr-panel .fr-tag{font-weight:700;font-size:.85rem;margin:0 0 4px}
.fr-panel ul{margin:6px 0 0;padding-left:20px}
.fr-panel p{margin:0 0 4px}
.fr-line{display:none;margin:4px 0 0;font-style:italic;font-weight:400}
body.fr-on .fr-line{display:block}
/* player */
.player{background:#fff;border:2px solid var(--pazapa-blue);border-radius:14px;padding:14px;margin:0 0 18px}
.player-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pbtn{min-height:48px;min-width:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pbtn.main{background:var(--pazapa-blue);border-color:var(--pazapa-blue);color:var(--pazapa-grey-dark);min-width:140px}
.pbtn:disabled{background:var(--pazapa-grey-light);border-color:#cfcfcf;color:#6f6f6d;cursor:not-allowed}
.pbtn svg{width:20px;height:20px;flex:none}
.pstatus{margin:10px 0 0;font-size:.95rem;color:var(--text-soft);min-height:1.4em}
.placeholder{margin:10px 0 0;padding:10px 14px;background:var(--yellow-tint);border:1px solid #F3D77A;border-radius:10px;font-weight:600;font-size:.95rem}
.tr-toggle{margin-top:12px;min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--pazapa-grey-dark);font-weight:700;font-size:.96rem}
.tr-panel{margin-top:10px;background:#FAFAF7;border:1px solid var(--pazapa-grey-light);border-radius:10px;padding:12px 14px}
.tr-panel[hidden]{display:none}
.tr-line{margin:0 0 10px}
.tr-line:last-child{margin-bottom:0}
.tr-line b{display:block;font-size:.85rem}
/* choices */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 14px}
.choice{background:#fff;border:2px solid #cfcfcb;border-radius:14px;padding:10px;text-align:center;min-height:64px;font-size:1.02rem;font-weight:700;color:var(--pazapa-grey-dark);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;position:relative}
.choice:hover:not([aria-disabled="true"]){border-color:var(--pazapa-blue)}
.choice[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.choice.sel{border-color:var(--pazapa-blue);background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--pazapa-blue)}
.choice.good{border-color:var(--pazapa-green);background:var(--green-tint);box-shadow:inset 0 0 0 2px var(--pazapa-green)}
.choice .mark{position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--pazapa-grey-dark);color:#fff;font-size:.9rem;line-height:24px;display:none}
.choice.sel .mark,.choice.good .mark{display:block}
.thumb{width:100%;height:116px;object-fit:contain;background:#FFFBF2;border-radius:10px;display:block}
.icon-box{width:100%;height:116px;background:#FFFBF2;border-radius:10px;display:flex;align-items:center;justify-content:center}
.icon-box svg{width:84px;height:84px}
.q{border:0;margin:0 0 18px;padding:0}
.q legend{font-weight:700;padding:0;margin-bottom:8px;font-size:1.05rem}
.q .qnote{display:none;font-size:.9rem;font-weight:700;margin:0 0 6px}
.q.flag .qnote{display:block}
.q.flag .qnote::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark);margin-right:8px;vertical-align:-1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opts .choice{flex-direction:row;text-align:left;justify-content:flex-start;align-items:center;padding:8px 12px 8px 10px;min-height:72px}
.opts .choice .thumb{width:60px;height:60px;flex:none}
.opts .choice .txt{flex:1;padding-right:30px;min-width:0}
.opts .choice .mark{top:50%;transform:translateY(-50%)}
/* ordering */
.order{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #cfcfcb;border-radius:12px;padding:8px 10px;min-height:68px}
.ocard.sel{border-color:var(--pazapa-blue);background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--pazapa-blue)}
.ocard.good{border-color:var(--pazapa-green);background:var(--green-tint)}
.ocard.dragging{box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:.92}
.grip{width:48px;min-height:48px;flex:none;border:2px solid #cfcfcb;border-radius:10px;background:#fff;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;color:var(--pazapa-grey-dark);padding:0}
.grip svg{width:22px;height:22px}
.onum{width:32px;height:32px;border-radius:50%;background:var(--pazapa-grey-dark);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.otext{flex:1;font-weight:600}
.omove{display:flex;gap:6px;flex:none}
.omove button{min-width:48px;min-height:48px;border:2px solid var(--pazapa-grey-dark);background:#fff;border-radius:10px;font-weight:700;font-size:.9rem;padding:4px 8px}
.omove button:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:520px){
  .ocard{flex-wrap:wrap}
  .omove{width:100%;justify-content:flex-end}
}
/* feedback */
.feedback{display:none;margin:0 0 14px;padding:12px 14px;border-radius:10px;font-weight:600}
.feedback.show{display:block}
.feedback.ok{background:var(--green-tint);border:1px solid var(--pazapa-green)}
.feedback.again{background:var(--yellow-tint);border:1px solid var(--pazapa-yellow)}
.feedback.info{background:var(--blue-tint);border:1px solid var(--blue-mid)}
.feedback .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;border:2px solid var(--pazapa-grey-dark);vertical-align:-1px}
.feedback.ok .dot{background:var(--pazapa-green)}
.feedback.again .dot{background:var(--pazapa-yellow)}
.feedback.info .dot{background:var(--pazapa-blue)}
/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.btn{min-height:48px;min-width:48px;padding:11px 24px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);font-weight:700;font-size:1.02rem}
.btn[hidden]{display:none}
.btn-primary{background:var(--pazapa-blue);border-color:var(--pazapa-blue);color:var(--pazapa-grey-dark)}
.btn-primary:hover:not(:disabled){background:#2FA9C2;border-color:#2FA9C2}
.btn-next{background:var(--pazapa-green);border-color:var(--pazapa-green);color:var(--pazapa-grey-dark)}
.btn:disabled{background:var(--pazapa-grey-light);border-color:#cfcfcf;color:#6f6f6d;cursor:not-allowed}
.helper{font-size:.92rem;color:var(--text-soft);margin:0 0 12px}
/* completion */
.final{text-align:center;padding:10px 0}
.final .tick{width:72px;height:72px;margin:0 auto 12px;display:block}
.final img{max-width:240px;width:100%;height:auto;display:block;margin:0 auto 14px;border-radius:12px}
.final .actions{justify-content:center;margin-top:18px}
.donemsg{margin-top:14px;font-weight:600;min-height:1.5em}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
@media (max-width:420px){h1{font-size:1.45rem}h2{font-size:1.25rem}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

</div>

var main = document.getElementById('main');
var live = document.getElementById('live');
function announce(t){ live.textContent=''; setTimeout(function(){ live.textContent = t; }, 30); }
function h(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){ if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]); }
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function sameSet(a, b){ if (a.length !== b.length) return false; return a.every(function(x){ return b.indexOf(x) > -1; }); }
function sameSeq(a, b){ return a.length === b.length && a.every(function(x, i){ return x === b[i]; }); }
function sGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function sSet(k, v){ try { window.localStorage.setItem(k, v); } catch(e){} }

/* ---------- state (progress) – separate from LMS completion ---------- */
function freshState(fr){
  return {
    v: 1, screen: 1, fr: !!fr,
    p: {
      1: { sel: null, att: 0, ok: false, rev: false, heard: false },
      2: { sel: [],   att: 0, ok: false, rev: false, heard: false },
      3: { sel: {},   att: 0, ok: false, rev: false, heard: false, flag: [] },
      4: { sel: null, att: 0, ok: false, rev: false, heard: false }
    },
    order: makeOrders()
  };
}
function makeOrders(){
  var o = {};
  o.s1 = shuffle(CONTENT.s1.options.map(function(x){ return x.id; }));
  o.s2 = shuffle(CONTENT.s2.options.map(function(x){ return x.id; }));
  CONTENT.s3.questions.forEach(function(q){ o[q.id] = shuffle(q.options.map(function(x){ return x.id; })); });
  var ids = CONTENT.s4.cards.map(function(x){ return x.id; });
  var s;
  do { s = shuffle(ids); } while (sameSeq(s, ANSWERS.s4));
  o.s4 = s;
  return o;
}
var state = loadState();
function loadState(){
  var raw = sGet(CFG.progressKey), s = null;
  if (raw){ try { s = JSON.parse(raw); } catch(e){ s = null; } }
  if (!s || s.v !== 1 || !s.p || !s.order) s = freshState(false);
  return s;
}
function saveState(){ sSet(CFG.progressKey, JSON.stringify(state)); }
function complete(n){ var p = state.p[n]; return !!(p.ok || p.rev); }
function allComplete(){ return [1,2,3,4].every(complete); }

var audioState = 'checking';   // checking | ready | failed
var playing = false;
var audio = new Audio();
var retriedBlob = false;
function retryAsBlob(){
  retriedBlob = true;
  try {
    var parts = AUDIO_FILES.listening.split(',');
    var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    audio.src = URL.createObjectURL(new Blob([arr], { type: 'audio/mpeg' }));
    audio.load();
  } catch(e){ audioState = 'failed'; refreshAll(); }
}
audio.preload = 'metadata';
audio.addEventListener('loadedmetadata', function(){ if (audioState !== 'ready'){ audioState = 'ready'; refreshAll(); } });
audio.addEventListener('error', function(){
  try { console.error('Audio loading error:', audio.error ? audio.error.code : 'unknown'); } catch(e){}
  playing = false;
  if (audioState !== 'ready' && !retriedBlob){ retryAsBlob(); return; }
  if (audioState !== 'ready'){ audioState = 'failed'; }
  refreshAll();
});
audio.addEventListener('play', function(){ playing = true; updatePlayers(); });
audio.addEventListener('pause', function(){ playing = false; updatePlayers(); });
audio.addEventListener('ended', function(){
  playing = false;
  var n = state.screen;
  if (n >= 1 && n <= 4){ state.p[n].heard = true; saveState(); }
  refreshAll();
  announce('Audio finished. You can listen again.');
});
try { audio.src = AUDIO_CONFIG.src; audio.load(); } catch(e){ audioState = 'failed'; }
setTimeout(function(){ if (audioState === 'checking'){ audioState = 'ready'; refreshAll(); } }, 4000);

function audioReady(){ return true; }
function gate(n){ return audioState === 'failed' || state.p[n].heard; }

function playPause(){
  if (!audioReady()) return;
  if (playing){ audio.pause(); return; }
  var pr = audio.play();
  if (pr && pr.catch) pr.catch(function(err){ try { console.error('Audio playback failed:', err); } catch(e){} playing = false; if (audioState !== 'ready' && !retriedBlob){ retryAsBlob(); } updatePlayers(); });
}
function restartAudio(){ if (!audioReady()) return; audio.pause(); try { audio.currentTime = 0; } catch(e){} playing = false; updatePlayers(); }
function replayAudio(){
  if (!audioReady()) return;
  audio.pause(); try { audio.currentTime = 0; } catch(e){}
  var pr = audio.play();
  if (pr && pr.catch) pr.catch(function(err){ try { console.error('Audio playback failed:', err); } catch(e){} playing = false; if (audioState !== 'ready' && !retriedBlob){ retryAsBlob(); } updatePlayers(); });
}

var ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>';
var ICON_RESTART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM20 4v16L9 12z" fill="currentColor"/></svg>';
var ICON_REPLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.7 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M4 4v6h6z" fill="currentColor"/></svg>';

function buildPlayer(n){
  var box = h('div', { 'class': 'player', 'data-player': n });
  var row = h('div', { 'class': 'player-row' });
  var pp = h('button', { type: 'button', 'class': 'pbtn main', 'data-role': 'pp', 'aria-pressed': 'false' });
  var rs = h('button', { type: 'button', 'class': 'pbtn', 'data-role': 'rs', 'aria-label': 'Restart audio' }, ICON_RESTART + '<span>Restart</span>');
  var rp = h('button', { type: 'button', 'class': 'pbtn', 'data-role': 'rp', 'aria-label': 'Replay audio from the start' }, ICON_REPLAY + '<span>Replay</span>');
  row.appendChild(pp); row.appendChild(rs); row.appendChild(rp);
  box.appendChild(row);
  box.appendChild(h('p', { 'class': 'pstatus', 'data-role': 'st' }));
  box.appendChild(h('div', { 'class': 'placeholder', 'data-role': 'ph', hidden: '' },
    'Audio placeholder: the recording has not been added yet. Read the script below for now.'));
  var tg = h('button', { type: 'button', 'class': 'tr-toggle', 'data-role': 'tg', 'aria-expanded': 'false', 'aria-controls': 'tr' + n }, 'Reveal conversation');
  var panel = h('div', { 'class': 'tr-panel', id: 'tr' + n, hidden: '', role: 'region', 'aria-label': 'Audio support transcript' });
  panel.appendChild(h('p', { 'class': 'eyebrow' }, 'Audio support transcript'));
  AUDIO_CONFIG.script.forEach(function(l){
    var d = h('div', { 'class': 'tr-line' });
    d.innerHTML = '<b>' + esc(l.speaker) + '</b>' + esc(l.text) + '<span class="fr-line">' + esc(l.fr) + '</span>';
    panel.appendChild(d);
  });
  box.appendChild(tg); box.appendChild(panel);
  pp.addEventListener('click', playPause);
  rs.addEventListener('click', restartAudio);
  rp.addEventListener('click', replayAudio);
  tg.addEventListener('click', function(){
    var open = panel.hidden;
    panel.hidden = !open;
    tg.setAttribute('aria-expanded', open ? 'true' : 'false');
    tg.textContent = open ? 'Hide conversation' : 'Reveal conversation';
  });
  return box;
}
function updatePlayers(){
  var boxes = document.querySelectorAll('[data-player]');
  for (var i = 0; i < boxes.length; i++){
    var b = boxes[i], n = +b.getAttribute('data-player');
    var pp = b.querySelector('[data-role=pp]'), rs = b.querySelector('[data-role=rs]'), rp = b.querySelector('[data-role=rp]');
    var st = b.querySelector('[data-role=st]'), ph = b.querySelector('[data-role=ph]');
    var tg = b.querySelector('[data-role=tg]'), panel = b.querySelector('.tr-panel');
    var ok = audioReady();
    pp.disabled = rs.disabled = rp.disabled = !ok;
    pp.innerHTML = (playing ? ICON_PAUSE + '<span>Pause</span>' : ICON_PLAY + '<span>Play</span>');
    pp.setAttribute('aria-pressed', playing ? 'true' : 'false');
    pp.setAttribute('aria-label', playing ? 'Pause audio' : 'Play audio');
    ph.hidden = true;
    if (audioState === 'failed'){
      st.textContent = 'The audio did not load. Press Play to try again, or use Reveal conversation.';
      if (!b._opened){ b._opened = true; panel.hidden = false; tg.setAttribute('aria-expanded', 'true'); tg.textContent = 'Hide conversation'; }
    } else if (audioState === 'checking'){ st.textContent = 'Loading audio…'; }
    else if (playing){ st.textContent = 'Playing…'; }
    else if (state.p[n] && state.p[n].heard){ st.textContent = 'Finished. You can listen again.'; }
    else { st.textContent = 'Press Play to listen.'; }
  }
}

/* ---------- screens ---------- */
var screens = {};      // n -> {root, refresh}
var doneBtn, againAllBtn, doneMsg;

function frPanel(parts){
  var d = h('div', { 'class': 'fr-block fr-panel' });
  d.innerHTML = '<p class="fr-tag">En français</p>' + parts;
  return d;
}
function commonShell(n, title, instr, instrFr, titleFr, extraFr){
  var root = h('section', { 'class': 'screen', id: 'screen' + n, hidden: '', 'aria-labelledby': 'h' + n });
  root.appendChild(h('p', { 'class': 'eyebrow' }, 'Listening Mission'));
  var tag = n === 1 ? 'h1' : 'h2';
  root.appendChild(h(tag, { id: 'h' + n, tabindex: '-1' }, esc(title)));
  root.appendChild(h('p', { 'class': 'instr' }, esc(instr)));
  root.appendChild(frPanel('<p><strong>' + esc(titleFr) + '</strong></p><p>' + esc(instrFr) + '</p>' + (extraFr || '')));
  root.appendChild(buildPlayer(n));
  return root;
}
function buildActions(n, onCheck, onAgain, onShow){
  var a = h('div', { 'class': 'actions' });
  var chk = h('button', { type: 'button', 'class': 'btn btn-primary', 'data-act': 'check' }, 'Check');
  var again = h('button', { type: 'button', 'class': 'btn', 'data-act': 'again' }, 'Try again');
  var show = h('button', { type: 'button', 'class': 'btn', 'data-act': 'show', hidden: '' }, 'Show me');
  var next = h('button', { type: 'button', 'class': 'btn btn-next', 'data-act': 'next', hidden: '' }, 'Continue');
  a.appendChild(chk); a.appendChild(again); a.appendChild(show); a.appendChild(next);
  chk.addEventListener('click', onCheck);
  again.addEventListener('click', onAgain);
  show.addEventListener('click', onShow);
  next.addEventListener('click', function(){ goTo(n + 1); });
  return a;
}
function fbHTML(kind, key, extraEn, extraFr){
  var m = typeof key === 'string' ? MSG[key] : key;
  return '<span class="dot"></span>' + esc(m.en) + (extraEn ? ' ' + esc(extraEn) : '') +
         '<span class="fr-line">' + esc(m.fr) + (extraFr ? ' ' + esc(extraFr) : '') + '</span>';
}
function setFeedback(n, kind, html){
  var f = screens[n].fb;
  f.className = 'feedback show ' + kind;
  f.innerHTML = html;
}
function clearFeedback(n){ var f = screens[n].fb; f.className = 'feedback'; f.innerHTML = ''; }

/* generic status-driven refresh for action buttons */
function refreshActions(n, hasInput){
  var s = screens[n], p = state.p[n];
  var chk = s.root.querySelector('[data-act=check]');
  var show = s.root.querySelector('[data-act=show]');
  var next = s.root.querySelector('[data-act=next]');
  chk.disabled = !(hasInput && gate(n)) || p.ok || p.rev;
  show.hidden = !(p.att >= 2 && !p.ok && !p.rev);
  next.hidden = !(p.ok || p.rev);
  var help = s.help;
  if (help){
    help.hidden = gate(n);
    help.textContent = gate(n) ? '' : MSG.needPlay.en;
  }
}
function invalidate(n){
  var p = state.p[n];
  if (p.ok || p.rev){ p.ok = false; p.rev = false; clearFeedback(n); }
}
function markHelp(n, root){
  var help = h('p', { 'class': 'helper' }, '');
  root.appendChild(help);
  return help;
}

/* ----- Screen 1 ----- */
function buildScreen1(){
  var C = CONTENT.s1;
  var root = commonShell(1, C.title, C.instr, C.instrFr, C.titleFr,
    '<ul>' + C.options.map(function(o){ return '<li>' + esc(o.fr) + '</li>'; }).join('') + '</ul>');
  var grid = h('div', { 'class': 'grid', role: 'radiogroup', 'aria-label': 'Situation' });
  root.appendChild(grid);
  var fb = h('div', { 'class': 'feedback', role: 'status' }); root.appendChild(fb);
  var help = markHelp(1, root); help.hidden = true;
  var acts = buildActions(1, check, again, show); root.appendChild(acts);
  main.appendChild(root);
  screens[1] = { root: root, fb: fb, help: help, grid: grid, built: null };

  function build(){
    grid.innerHTML = '';
    state.order.s1.forEach(function(id){
      var o = C.options.filter(function(x){ return x.id === id; })[0];
      var b = h('button', { type: 'button', 'class': 'choice', role: 'radio', 'aria-checked': 'false', 'data-id': o.id });
      var vis = o.img ? '<img class="thumb" alt="" src="' + IMG[o.img] + '">' : '<span class="icon-box">' + o.svg() + '</span>';
      b.innerHTML = vis + '<span>' + esc(o.label) + '</span><span class="mark" aria-hidden="true">✓</span>';
      b.addEventListener('click', function(){
        if (!gate(1)){ announce(MSG.needPlay.en); return; }
        invalidate(1);
        state.p[1].sel = o.id; saveState(); refresh();
      });
      grid.appendChild(b);
    });
  }
  function refresh(){
    var p = state.p[1];
    var btns = grid.querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++){
      var b = btns[i], id = b.getAttribute('data-id'), on = p.sel === id;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.setAttribute('aria-disabled', gate(1) ? 'false' : 'true');
      b.className = 'choice' + (on ? (p.ok || p.rev ? ' good' : ' sel') : '');
    }
    refreshActions(1, !!p.sel);
  }
  function check(){
    var p = state.p[1];
    if (!p.sel) return;
    if (p.sel === ANSWERS.s1){ p.ok = true; setFeedback(1, 'ok', fbHTML('ok', 'ok')); announce(MSG.ok.en); }
    else { p.att++; setFeedback(1, 'again', fbHTML('again', { en: C.hint, fr: C.hintFr })); announce(C.hint); }
    saveState(); refresh();
  }
  function again(){
    var p = state.p[1]; p.sel = null; p.att = 0; p.ok = false; p.rev = false;
    state.order.s1 = shuffle(C.options.map(function(x){ return x.id; }));
    clearFeedback(1); build(); saveState(); refresh();
  }
  function show(){
    var p = state.p[1]; p.sel = ANSWERS.s1; p.rev = true; p.ok = false;
    setFeedback(1, 'info', fbHTML('info', 'shown')); saveState(); refresh();
  }
  screens[1].build = build; screens[1].refresh = refresh;
  build();
}

/* ----- Screen 2 ----- */
function buildScreen2(){
  var C = CONTENT.s2;
  var root = commonShell(2, C.title, C.instr, C.instrFr, C.titleFr,
    '<p>' + esc(C.noteFr) + '</p><ul>' + C.options.map(function(o){ return '<li>' + esc(o.label) + ' = ' + esc(o.fr) + '</li>'; }).join('') + '</ul>');
  root.appendChild(h('p', { 'class': 'helper' }, C.note));
  var grid = h('div', { 'class': 'grid', role: 'group', 'aria-label': 'Words' });
  root.appendChild(grid);
  var fb = h('div', { 'class': 'feedback', role: 'status' }); root.appendChild(fb);
  var help = markHelp(2, root); help.hidden = true;
  root.appendChild(buildActions(2, check, again, show));
  main.appendChild(root);
  screens[2] = { root: root, fb: fb, help: help };

  function build(){
    grid.innerHTML = '';
    state.order.s2.forEach(function(id){
      var o = C.options.filter(function(x){ return x.id === id; })[0];
      var b = h('button', { type: 'button', 'class': 'choice', role: 'checkbox', 'aria-checked': 'false', 'data-id': o.id });

        if (!gate(2)){ announce(MSG.needPlay.en); return; }
        invalidate(2);
        var s = state.p[2].sel, k = s.indexOf(o.id);
        if (k > -1) s.splice(k, 1); else s.push(o.id);
        saveState(); refresh();
      });
      grid.appendChild(b);
    });
  }
  function refresh(){
    var p = state.p[2];
    var btns = grid.querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++){
      var b = btns[i], id = b.getAttribute('data-id'), on = p.sel.indexOf(id) > -1;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.setAttribute('aria-disabled', gate(2) ? 'false' : 'true');
      b.className = 'choice' + (on ? (p.ok || p.rev ? ' good' : ' sel') : '');
    }
    refreshActions(2, p.sel.length > 0);
  }
  function check(){
    var p = state.p[2];
    if (!p.sel.length) return;
    if (sameSet(p.sel, ANSWERS.s2)){ p.ok = true; setFeedback(2, 'ok', fbHTML('ok', 'ok')); announce(MSG.ok.en); }
    else { p.att++; setFeedback(2, 'again', fbHTML('again', { en: C.hint, fr: C.hintFr })); announce(C.hint); }
    saveState(); refresh();
  }
  function again(){
    var p = state.p[2]; p.sel = []; p.att = 0; p.ok = false; p.rev = false;
    state.order.s2 = shuffle(C.options.map(function(x){ return x.id; }));
    clearFeedback(2); build(); saveState(); refresh();
  }
  function show(){
    var p = state.p[2]; p.sel = ANSWERS.s2.slice(); p.rev = true; p.ok = false;
    setFeedback(2, 'info', fbHTML('info', 'shown')); saveState(); refresh();
  }
  screens[2].build = build; screens[2].refresh = refresh;
  build();
}

/* ----- Screen 3 ----- */
function buildScreen3(){
  var C = CONTENT.s3;
  var frList = '<ul>' + C.questions.map(function(q){
    return '<li>' + esc(q.fr) + ' (' + q.options.map(function(o){ return esc(o.fr); }).join(' / ') + ')</li>';
  }).join('') + '</ul>';
  var root = commonShell(3, C.title, C.instr, C.instrFr, C.titleFr, frList);
  var qwrap = h('div'); root.appendChild(qwrap);
  var fb = h('div', { 'class': 'feedback', role: 'status' }); root.appendChild(fb);
  var help = markHelp(3, root); help.hidden = true;
  root.appendChild(buildActions(3, check, again, show));
  main.appendChild(root);
  screens[3] = { root: root, fb: fb, help: help };

  function build(){
    qwrap.innerHTML = '';
    C.questions.forEach(function(q, qi){
      var fs = h('fieldset', { 'class': 'q', 'data-q': q.id });
      fs.appendChild(h('legend', null, (qi + 1) + '. ' + esc(q.text) + '<span class="fr-line">' + esc(q.fr) + '</span>'));
      fs.appendChild(h('p', { 'class': 'qnote' }, 'Listen again for this question.'));
      var opts = h('div', { 'class': 'opts', role: 'radiogroup', 'aria-label': q.text });
      state.order[q.id].forEach(function(id){
        var o = q.options.filter(function(x){ return x.id === id; })[0];
        var b = h('button', { type: 'button', 'class': 'choice', role: 'radio', 'aria-checked': 'false', 'data-id': o.id, 'data-qid': q.id });
        b.innerHTML = (o.img ? '<img class="thumb" alt="" src="' + IMG[o.img] + '">' : '') +
          '<span class="txt">' + esc(o.label) + '</span><span class="mark" aria-hidden="true">✓</span>';
        b.addEventListener('click', function(){
          if (!gate(3)){ announce(MSG.needPlay.en); return; }
          invalidate(3);
          state.p[3].sel[q.id] = o.id;
          state.p[3].flag = state.p[3].flag.filter(function(x){ return x !== q.id; });
          saveState(); refresh();
        });
        opts.appendChild(b);
      });
      fs.appendChild(opts);
      qwrap.appendChild(fs);
    });
  }
  function answeredAll(){ var s = state.p[3].sel; return C.questions.every(function(q){ return !!s[q.id]; }); }
  function refresh(){
    var p = state.p[3];
    var btns = qwrap.querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++){
      var b = btns[i], on = p.sel[b.getAttribute('data-qid')] === b.getAttribute('data-id');
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.setAttribute('aria-disabled', gate(3) ? 'false' : 'true');
      b.className = 'choice' + (on ? (p.ok || p.rev ? ' good' : ' sel') : '');
    }
    var fss = qwrap.querySelectorAll('.q');
    for (var j = 0; j < fss.length; j++){
      var qid = fss[j].getAttribute('data-q');
      fss[j].className = 'q' + (p.flag.indexOf(qid) > -1 && !p.ok && !p.rev ? ' flag' : '');
    }
    refreshActions(3, answeredAll());
  }
  function check(){
    var p = state.p[3];
    if (!answeredAll()) return;
    var wrong = C.questions.filter(function(q){ return p.sel[q.id] !== ANSWERS.s3[q.id]; }).map(function(q){ return q.id; });
    if (!wrong.length){ p.flag = []; p.ok = true; setFeedback(3, 'ok', fbHTML('ok', 'ok')); announce(MSG.ok.en); }
    else { p.att++; p.flag = wrong; setFeedback(3, 'again', fbHTML('again', { en: C.hint, fr: C.hintFr })); announce(C.hint); }
    saveState(); refresh();
  }
  function again(){
    var p = state.p[3]; p.sel = {}; p.flag = []; p.att = 0; p.ok = false; p.rev = false;
    C.questions.forEach(function(q){ state.order[q.id] = shuffle(q.options.map(function(x){ return x.id; })); });
    clearFeedback(3); build(); saveState(); refresh();
  }
  function show(){
    var p = state.p[3]; p.sel = {}; for (var k in ANSWERS.s3) p.sel[k] = ANSWERS.s3[k];
    p.flag = []; p.rev = true; p.ok = false;
    setFeedback(3, 'info', fbHTML('info', 'shown')); saveState(); refresh();
  }
  screens[3].build = build; screens[3].refresh = refresh;
  build();
}

/* ----- Screen 4 ----- */
function buildScreen4(){
  var C = CONTENT.s4;
  var root = commonShell(4, C.title, C.instr, C.instrFr, C.titleFr,
    '<p>' + esc(C.noteFr) + '</p><ul>' + C.cards.map(function(c){ return '<li>' + esc(c.fr) + '</li>'; }).join('') + '</ul>');
  root.appendChild(h('p', { 'class': 'helper' }, C.note));
  var list = h('ol', { 'class': 'order', 'aria-label': 'Three parts of the message' });
  root.appendChild(list);
  var fb = h('div', { 'class': 'feedback', role: 'status' }); root.appendChild(fb);
  var help = markHelp(4, root); help.hidden = true;
  root.appendChild(buildActions(4, check, again, show));
  main.appendChild(root);
  screens[4] = { root: root, fb: fb, help: help };
  var selected = null;
  var drag = null;
  var GRIP = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="6" r="2" fill="currentColor"/><circle cx="9" cy="12" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="9" cy="18" r="2" fill="currentColor"/><circle cx="15" cy="18" r="2" fill="currentColor"/></svg>';

  function cardById(id){ return C.cards.filter(function(c){ return c.id === id; })[0]; }
  function build(focusSel){
    list.innerHTML = '';
    var ord = state.order.s4;
    ord.forEach(function(id, i){
      var c = cardById(id);
      var li = h('li', { 'class': 'ocard', 'data-id': id });
      var grip = h('button', { type: 'button', 'class': 'grip', 'aria-label': 'Reorder: ' + c.text + ' Use the arrow keys, or the Move buttons.' }, GRIP);
      var num = h('span', { 'class': 'onum', 'aria-hidden': 'true' }, String(i + 1));
      var txt = h('span', { 'class': 'otext' }, esc(c.text) + '<span class="fr-line">' + esc(c.fr) + '</span>');
      var mv = h('span', { 'class': 'omove' });
      var up = h('button', { type: 'button', 'data-mv': 'up', 'aria-label': 'Move up: ' + c.text }, 'Move up');
      var dn = h('button', { type: 'button', 'data-mv': 'down', 'aria-label': 'Move down: ' + c.text }, 'Move down');
      if (i === 0) up.disabled = true;
      if (i === ord.length - 1) dn.disabled = true;
      mv.appendChild(up); mv.appendChild(dn);
      li.appendChild(grip); li.appendChild(num); li.appendChild(txt); li.appendChild(mv);
      li.addEventListener('click', function(e){
        if (e.target.closest('[data-mv]')) return;
        selected = id; paint();
      });
      up.addEventListener('click', function(){ move(id, -1, 'up'); });
      dn.addEventListener('click', function(){ move(id, 1, 'down'); });
      grip.addEventListener('keydown', function(e){
        if (e.key === 'ArrowUp'){ e.preventDefault(); move(id, -1, 'grip'); }
        else if (e.key === 'ArrowDown'){ e.preventDefault(); move(id, 1, 'grip'); }
      });
      grip.addEventListener('focus', function(){ selected = id; paint(); });
      list.appendChild(li);
    });
    paint();
  }
  function paint(){
    var p = state.p[4];
    var lis = list.children;
    for (var i = 0; i < lis.length; i++){
      var li = lis[i];
      li.className = 'ocard' + (li.getAttribute('data-id') === selected ? ' sel' : '') + ((p.ok || p.rev) ? ' good' : '') + (drag && drag.li === li ? ' dragging' : '');
      li.setAttribute('aria-current', li.getAttribute('data-id') === selected ? 'true' : 'false');
    }
  }
  function move(id, dir, source){
    if (!gate(4)){ announce(MSG.needPlay.en); return; }
    var ord = state.order.s4, i = ord.indexOf(id), j = i + dir;
    if (j < 0 || j >= ord.length) return;
    invalidate(4);
    ord.splice(i, 1); ord.splice(j, 0, id);
    state.p[4].sel = true;
    selected = id; saveState(); build();
    var li = list.querySelector('[data-id="' + id + '"]');
    var target = source === 'grip' ? li.querySelector('.grip') : li.querySelector('[data-mv=' + (dir < 0 ? 'up' : 'down') + ']');
    if (target && target.disabled) target = li.querySelector('[data-mv=' + (dir < 0 ? 'down' : 'up') + ']');
    if (target) target.focus();
    announce('Moved to position ' + (j + 1) + ' of ' + ord.length + '.');
    refresh();
  }
  /* pointer drag */
  list.addEventListener('pointerdown', function(e){
    var g = e.target.closest('.grip');
    if (!g) return;
    if (!gate(4)){ announce(MSG.needPlay.en); return; }
    var li = g.closest('li');
    drag = { li: li, pid: e.pointerId, moved: false };
    try { list.setPointerCapture(e.pointerId); } catch(err){}
    selected = li.getAttribute('data-id'); paint();
    e.preventDefault();
  });
  list.addEventListener('pointermove', function(e){
    if (!drag) return;
    var y = e.clientY, li = drag.li, sibs = [].slice.call(list.children).filter(function(c){ return c !== li; });
    var placed = false;
    for (var i = 0; i < sibs.length; i++){
      var r = sibs[i].getBoundingClientRect();
      if (y < r.top + r.height / 2){ if (li.nextSibling !== sibs[i]){ list.insertBefore(li, sibs[i]); drag.moved = true; } placed = true; break; }
    }
    if (!placed && list.lastElementChild !== li){ list.appendChild(li); drag.moved = true; }
    paint();
  });
  function endDrag(){
    if (!drag) return;
    var moved = drag.moved, id = drag.li.getAttribute('data-id');
    drag = null;
    if (moved){
      invalidate(4);
      state.order.s4 = [].slice.call(list.children).map(function(c){ return c.getAttribute('data-id'); });
      state.p[4].sel = true;
      saveState();
      build();
      var li = list.querySelector('[data-id="' + id + '"]');
      if (li) li.querySelector('.grip').focus();
      announce('Moved to position ' + (state.order.s4.indexOf(id) + 1) + ' of ' + state.order.s4.length + '.');
      refresh();
    } else paint();
  }
  list.addEventListener('pointerup', endDrag);
  list.addEventListener('pointercancel', endDrag);

  function refresh(){
    var p = state.p[4];
    paint();
    refreshActions(4, true);
  }
  function check(){
    var p = state.p[4];
    if (sameSeq(state.order.s4, ANSWERS.s4)){ p.ok = true; setFeedback(4, 'ok', fbHTML('ok', 'ok')); announce(MSG.ok.en); }
    else { p.att++; setFeedback(4, 'again', fbHTML('again', { en: C.hint, fr: C.hintFr })); announce(C.hint); }
    saveState(); refresh();
  }
  function again(){
    var p = state.p[4]; p.sel = null; p.att = 0; p.ok = false; p.rev = false;
    var ids = C.cards.map(function(x){ return x.id; }), s;
    do { s = shuffle(ids); } while (sameSeq(s, ANSWERS.s4));
    state.order.s4 = s; selected = null;
    clearFeedback(4); build(); saveState(); refresh();
  }
  function show(){
    var p = state.p[4]; state.order.s4 = ANSWERS.s4.slice(); p.rev = true; p.ok = false;
    setFeedback(4, 'info', fbHTML('info', 'shown')); saveState(); build(); refresh();
  }
  screens[4].build = build; screens[4].refresh = refresh;
  build();
}

/* ----- Screen 5 (completion) ----- */
function buildScreen5(){
  var C = CONTENT.end;
  var root = h('section', { 'class': 'screen', id: 'screen5', hidden: '', 'aria-labelledby': 'h5' });
  var wrap = h('div', { 'class': 'final' });
  wrap.innerHTML =
    '<svg class="tick" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#F4F7D9" stroke="#C9D646" stroke-width="4"/><path d="M19 33l9 9 17-19" fill="none" stroke="#2E2E2D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '<img alt="" src="' + IMG.done + '">' +
    '<h2 id="h5" tabindex="-1">' + esc(C.title) + '</h2>' +
    '<p>' + esc(C.line1) + '</p><p>' + esc(C.line2) + '</p>';
  var fr = frPanel('<p><strong>' + esc(C.titleFr) + '</strong></p><p>' + esc(C.line1Fr) + '</p><p>' + esc(C.line2Fr) + '</p>');
  fr.style.textAlign = 'left';
  wrap.appendChild(fr);
  var acts = h('div', { 'class': 'actions' });
  doneBtn = h('button', { type: 'button', 'class': 'btn btn-next', id: 'doneBtn' }, 'Done');
  againAllBtn = h('button', { type: 'button', 'class': 'btn', id: 'againAllBtn' }, 'Try again');
  acts.appendChild(doneBtn); acts.appendChild(againAllBtn);
  wrap.appendChild(acts);
  doneMsg = h('p', { 'class': 'donemsg', role: 'status' });
  wrap.appendChild(doneMsg);
  root.appendChild(wrap);
  main.appendChild(root);
  screens[5] = { root: root };
  doneBtn.disabled = true;
  doneBtn.addEventListener('click', onDone);
  againAllBtn.addEventListener('click', restartAll);
}

/* ---------- navigation ---------- */
function goTo(n){
  if (n < 1) n = 1;
  if (n > 5) n = 5;
  if (n === 5 && !allComplete()){
    for (var i = 1; i <= 4; i++){ if (!complete(i)){ n = i; break; } }
  }
  if (audio && playing) audio.pause();
  state.screen = n;
  for (var k = 1; k <= 5; k++){ screens[k].root.hidden = (k !== n); }
  saveState();
  updateProgress();
  refreshAll();
  var hd = document.getElementById('h' + n);
  if (hd){ hd.focus({ preventScroll: false }); }
  try { window.scrollTo(0, 0); } catch(e){}
}
function updateProgress(){
  var n = state.screen, lab = document.getElementById('progLabel'), fill = document.getElementById('progFill');
  if (n <= 4){ lab.textContent = 'Screen ' + n + ' of ' + CFG.totalScreens; fill.style.width = ((n - 1) / CFG.totalScreens * 100) + '%'; }
  else { lab.textContent = 'Complete'; fill.style.width = '100%'; }
}
function refreshAll(){
  for (var n = 1; n <= 4; n++){ if (screens[n] && screens[n].refresh) screens[n].refresh(); }
  updatePlayers();
  if (doneBtn) doneBtn.disabled = !(state.screen === 5 && allComplete());
}

/* ---------- LMS (SCORM 1.2 / 2004) – silent, idempotent ---------- */
var completionSent = false;
var lmsFound = null;
function findAPIIn(win){
  var tries = 0;
  while (win && tries < 12){
    try {
      if (win.API_1484_11) return { v: '2004', api: win.API_1484_11 };
      if (win.API) return { v: '1.2', api: win.API };
    } catch(e){}
    var next = null;
    try { next = (win.parent && win.parent !== win) ? win.parent : null; } catch(e){ next = null; }
    win = next; tries++;
  }
  return null;
}
function discoverAPI(){
  var r = null;
  try { r = findAPIIn(window); } catch(e){}
  if (!r){ try { if (window.opener && !window.opener.closed) r = findAPIIn(window.opener); } catch(e){} }
  return r;
}
function sendToLMS(){
  var found = lmsFound || discoverAPI();
  if (!found) return false;
  lmsFound = found;
  try {
    if (found.v === '2004'){
      var a = found.api;
      a.Initialize('');
      var cur = String(a.GetValue('cmi.completion_status') || '');
      if (cur !== 'completed'){ a.SetValue('cmi.completion_status', 'completed'); a.Commit(''); }
    } else {
      var b = found.api;
      b.LMSInitialize('');
      var st = String(b.LMSGetValue('cmi.core.lesson_status') || '');
      if (st !== 'completed' && st !== 'passed'){ b.LMSSetValue('cmi.core.lesson_status', 'completed'); b.LMSCommit(''); }
    }
    return true;
  } catch(e){ return false; }
}
function activityCompleted(){
  if (completionSent) return;
  if (!allComplete() && sGet(CFG.lmsKey) !== 'completed') return;
  sSet(CFG.lmsKey, 'completed');           // local record (never downgraded)
  if (sendToLMS()){ completionSent = true; sSet(CFG.lmsKey, 'sent'); try { console.info(CFG.logLabel); } catch(e){} }
}
function retryPendingCompletion(){
  if (completionSent) return;
  if (sGet(CFG.lmsKey) === 'completed'){
    if (sendToLMS()){ completionSent = true; sSet(CFG.lmsKey, 'sent'); try { console.info(CFG.logLabel); } catch(e){} }
  }
}
document.addEventListener('pointerdown', retryPendingCompletion, { passive: true });
document.addEventListener('keydown', retryPendingCompletion);

function onDone(){
  if (doneBtn.disabled) return;
  activityCompleted();
  doneMsg.innerHTML = esc(MSG.doneOk.en) + '<span class="fr-line">' + esc(MSG.doneOk.fr) + '</span>';
  announce(MSG.doneOk.en);
}
function restartAll(){
  var fr = state.fr;
  state = freshState(fr);
  saveState();
  doneMsg.textContent = '';
  for (var n = 1; n <= 4; n++){ clearFeedback(n); screens[n].build(); }
  if (audio){ try { audio.pause(); audio.currentTime = 0; } catch(e){} playing = false; }
  doneBtn.disabled = true;
  goTo(1);
  announce(MSG.reset.en);
}

/* ---------- French toggle ---------- */
var frBtn = document.getElementById('frBtn');
function applyFr(){
  document.body.classList.toggle('fr-on', !!state.fr);
  frBtn.setAttribute('aria-pressed', state.fr ? 'true' : 'false');
  frBtn.textContent = state.fr ? 'Hide français' : 'Français';
  frBtn.setAttribute('aria-label', state.fr ? 'Hide French translation' : 'Show French translation');
}
frBtn.addEventListener('click', function(){ state.fr = !state.fr; saveState(); applyFr(); announce(state.fr ? 'French translation shown.' : 'French translation hidden.'); });

/* ---------- init ---------- */
(function init(){
  buildScreen1(); buildScreen2(); buildScreen3(); buildScreen4(); buildScreen5();
  var lms = sGet(CFG.lmsKey);
  if (lms === 'sent') completionSent = true;
  doneBtn.disabled = true;
  applyFr();
  var start = state.screen;
  if (start === 5 && !allComplete()) start = 1;
  if (start < 1 || start > 5) start = 1;
  /* restore feedback text for checked screens */
  for (var n = 1; n <= 4; n++){
    var p = state.p[n];
    if (p.ok) setFeedback(n, 'ok', fbHTML('ok', 'ok'));
    else if (p.rev) setFeedback(n, 'info', fbHTML('info', 'shown'));
  }
  state.screen = start;
  for (var k = 1; k <= 5; k++){ screens[k].root.hidden = (k !== start); }
  updateProgress();
  refreshAll();
  retryPendingCompletion();
})();
</script>
