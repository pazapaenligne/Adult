<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing to a teacher: Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --white:#FFFFFF;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  background:var(--pazapa-grey-light);
  color:var(--pazapa-grey-dark);
  line-height:1.5;
  font-size:1rem;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;margin:0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* envelope-flap header */
.flap{
  background:var(--pazapa-blue);
  padding:16px 18px 44px;
  clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);
}
.flap-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.eyebrow{margin:0 0 2px;font-size:.82rem;font-weight:700;}
.flap h1{font-size:1.3rem;line-height:1.25;}
.lang-btn{
  min-height:48px;min-width:48px;padding:8px 16px;border-radius:24px;
  border:2px solid var(--pazapa-grey-dark);background:var(--white);color:var(--pazapa-grey-dark);
  font-size:.95rem;font-weight:700;cursor:pointer;touch-action:manipulation;flex:none;
}
.stepper-wrap{display:flex;align-items:center;gap:12px;padding:0 20px;margin-top:-18px;position:relative;}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;}
.steps li{width:14px;height:14px;border-radius:50%;background:var(--white);border:2px solid var(--pazapa-grey-dark);}
.steps li.done{background:var(--pazapa-blue);}
.steps li.now{background:var(--pazapa-grey-dark);}
.step-text{font-size:.85rem;font-weight:600;margin:0;}

main{flex:1;padding:18px 16px 12px;}
.sheet{
  background:var(--white);border-radius:var(--radius);padding:20px 18px 22px;
  border-left:8px solid var(--pazapa-blue);box-shadow:0 1px 4px rgba(46,46,45,.15);
}
.sheet h2{font-size:1.3rem;margin-bottom:6px;}
.sheet h2:focus{outline:none;}
.lead{margin:0 0 14px;}
.card{border-radius:12px;padding:14px;margin:0 0 14px;background:var(--blue-tint);}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:var(--white);border:2px solid var(--pazapa-grey-light);}
.card h3{font-size:1.05rem;margin-bottom:8px;}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0;}
legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;font-size:1.05rem;padding:0;margin-bottom:8px;}
small,.gloss{display:block;font-size:.85rem;color:var(--pazapa-grey-dark);}

/* hero / vocab */
.hero{display:flex;gap:14px;align-items:center;background:var(--blue-tint);border-radius:12px;padding:14px;margin-bottom:14px;}
.hero img{width:96px;height:auto;border-radius:10px;flex:none;}
.hero p{margin:0;}
.vgrid{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.vcard{background:var(--green-tint);border-radius:10px;padding:6px 4px 8px;text-align:center;font-weight:700;font-size:.82rem;overflow-wrap:anywhere;}
.vcard img{display:block;margin:0 auto 4px;height:84px;width:auto;max-width:100%;object-fit:contain;border-radius:6px;}
@media (max-width:480px){.vgrid{grid-template-columns:repeat(2,1fr);}.vcard img{height:96px;}}

/* options */
.opt{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;margin:0 0 8px;
  border:2px solid var(--pazapa-grey-dark);border-radius:10px;background:var(--white);cursor:pointer;touch-action:manipulation;
}
.opt.on{background:var(--blue-tint);font-weight:700;}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--pazapa-grey-dark);}
.opt .tag{margin-left:auto;font-size:.78rem;font-weight:700;background:var(--yellow-tint);border:1px solid var(--pazapa-grey-dark);border-radius:12px;padding:1px 8px;white-space:nowrap;}
.opt span.txt{flex:1;}
.opt span.txt small{font-weight:400;}
select,textarea{
  font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);background:var(--white);
  border:2px solid var(--pazapa-grey-dark);border-radius:10px;width:100%;
}
select{min-height:48px;padding:8px 10px;touch-action:manipulation;}
textarea{padding:10px 12px;min-height:130px;resize:vertical;line-height:1.5;}
label.lbl{display:block;font-weight:700;margin-bottom:6px;}
.row{margin-bottom:12px;}
.row .w{font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.row .w img{height:52px;width:auto;border-radius:6px;object-fit:contain;}
.fb{margin:8px 0 0;padding:8px 10px;border-radius:8px;font-size:.93rem;}
.fb:empty{display:none;}
.fb.ok{background:var(--green-tint);border:2px solid var(--pazapa-green);}
.fb.again{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);}

/* word bank */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
.chip{
  min-height:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-grey-dark);
  background:var(--white);color:var(--pazapa-grey-dark);font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation;text-align:left;
}
.chip:disabled{opacity:.45;cursor:default;border-style:dashed;}
.chip.phrase{border-radius:12px;}
.gap{
  min-height:48px;min-width:96px;padding:4px 12px;border:2px dashed var(--pazapa-grey-dark);border-radius:10px;
  background:var(--blue-tint);font:inherit;font-weight:700;color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;vertical-align:middle;
}
.gap.filled{border-style:solid;background:var(--white);}
.sent{line-height:2.6;margin:0 0 4px;}

/* hint */
.hintbox{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:8px;padding:8px 12px;margin:8px 0;}
.hintbox ol{margin:0;padding-left:20px;}

/* buttons */
.btn{
  min-height:48px;padding:10px 22px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;
  border:2px solid var(--pazapa-grey-dark);color:var(--pazapa-grey-dark);
}
.btn.primary{background:var(--pazapa-blue);}
.btn.primary:hover{background:#5CCBE0;}
.btn.second{background:var(--white);}
.btn.help{background:var(--yellow-tint);}
.btn.done-on{background:var(--pazapa-green);}
.btn:disabled{background:var(--pazapa-grey-light);color:#5b5b59;border-style:dashed;cursor:not-allowed;}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.opt:focus-within{
  outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 5px var(--white);
}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px;}

/* recorder */
.rec{background:var(--blue-tint);border-radius:12px;padding:12px;margin-bottom:12px;}
.rec-status{margin:8px 0 0;font-weight:600;}

/* compare */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
@media (max-width:700px){.compare{grid-template-columns:1fr;}}
.paper{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--white);border:2px solid var(--pazapa-grey-dark);border-radius:10px;padding:10px 12px;min-height:90px;}
.paper-h{font-weight:700;margin:0 0 6px;}

.actions{
  position:sticky;bottom:0;background:var(--white);border-top:2px solid var(--pazapa-grey-light);
  padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;
}
.actions .note{flex:1 1 100%;margin:0;font-size:.88rem;}
.actions .note:empty{display:none;}
.actions [hidden]{display:none;}
.pair{display:flex;gap:10px;flex-wrap:wrap;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="flap">
      <div class="flap-top">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="mainTitle"></h1>
        </div>
        <button type="button" class="lang-btn" id="langBtn"></button>
      </div>
    </div>
    <div class="stepper-wrap">
      <ol class="steps" id="steps" aria-hidden="true"></ol>
      <p class="step-text" id="stepText"></p>
    </div>
  </header>

  <main id="screen"></main>

  <div class="actions" id="actions">
    <p class="note" id="gateNote"></p>
    <button type="button" class="btn primary" id="nextBtn"></button>
    <div class="pair">
      <button type="button" class="btn second" id="tryAgainBtn" hidden></button>
      <button type="button" class="btn primary" id="doneBtn" hidden></button>
    </div>
  </div>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>

/* ============================================================
   CHECKING (deterministic, meaning first)
   ============================================================ */
function norm(s){
  return String(s||"").normalize("NFKC").replace(/[‘’ʼ`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g," ").trim().toLowerCase();
}
function wordCount(s){ var n=norm(s); return n? n.split(" ").length : 0; }
function checks(text){
  var x = norm(text);
  var c = {};
  c.greeting = /\b(dear|hello|hi|good (morning|afternoon))\b/.test(x);
  c.purpose = /\bwriting (about|to)\b|\babsent\b|\bhomework\b|\bmissed\b|\bnot (at|in) school\b/.test(x);
  c.when = /\b(yesterday|today|monday|tuesday|wednesday|thursday|friday|saturday|sunday|last week|this week|this morning|on the \d)/.test(x);
  c.need = /\bhomework\b|\bcomplete\b|\binstructions\b|\bmissed work\b|\bat home\b|\bassignment\b/.test(x);
  c.question = /\?/.test(x) || /\b(could|can|would) you\b|\bwhat should\b|\bwhat is\b|\bwhat are\b|\bplease (send|explain|tell)\b/.test(x);
  c.phrase = /could you (please )?(explain|tell|send|help)|what should (he|she|they|my \w+) (complete|do)|i'?m writing about|(son|daughter|child) was absent|thank you for your (support|help)|dear (ms|mr|mrs|miss) \w+/.test(x);
  c.polite = /(thank you|thanks|kind regards|best wishes|many thanks)\b[^?]{0,60}$/.test(x);
  return c;
}
function focusMet(text, f){
  var c = checks(text);
  if(f==="purpose") return c.purpose;
  if(f==="info") return c.when && c.need;
  if(f==="phrase") return c.phrase;
  if(f==="polite") return c.polite;
  return false;
}
function suggest(text){
  var c = checks(text), out = [];
  if(!c.purpose) out.push("purpose");
  if(!(c.when && c.need)) out.push("info");
  if(!c.phrase) out.push("phrase");
  if(!c.polite) out.push("polite");
  return out.slice(0,2);
}

function recSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function clearSlot(slot){

function recStart(slot){
  if(!recSupported()){ setRec(slot,"unsupported"); return; }
  if(Rec.active) return;
  clearSlot(slot);
  setRec(slot,"requesting");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr;
    try{ mr = new MediaRecorder(stream); }catch(e){
      try{ stream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e2){}
      setRec(slot,"failed"); return;
    }
    Rec.stream = stream; Rec.mr = mr; Rec.chunks = []; Rec.active = slot;
    mr.ondataavailable = function(ev){ if(ev.data && ev.data.size>0) Rec.chunks.push(ev.data); };
    mr.onerror = function(){ releaseStream(); Rec.active=null; setRec(slot,"failed","rs-"+slot); };
    mr.onstop = function(){
      releaseStream();
      var blob = Rec.chunks.length ? new Blob(Rec.chunks,{type:(mr.mimeType||"audio/webm")}) : null;
      Rec.active = null;
      if(!blob || blob.size<200){ clearSlot(slot); setRec(slot,"empty","rs-"+slot); }
      else { clearSlot(slot); Rec[slot].blob = blob; Rec[slot].url = URL.createObjectURL(blob); setRec(slot,"ready","rp-"+slot); }
    };
    try{ mr.start(); }catch(e){ releaseStream(); Rec.active=null; setRec(slot,"failed"); return; }

  }).catch(function(err){
    var n = err && err.name;

    else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") setRec(slot,"nodevice","rs-"+slot);

function recPlay(slot){
  var r = Rec[slot]; if(!r.url) return;
  stopAudio();
  var a = new Audio(r.url); Rec.audio = a;
  var p = a.play(); if(p && p.catch){ p.catch(function(){ setRec(slot,"failed","rp-"+slot); }); }
}

  try{ if(Rec.mr && Rec.mr.state && Rec.mr.state!=="inactive"){ Rec.mr.onstop=null; Rec.mr.stop(); } }catch(e){}

function isSpeech(){ return S.route==="speak"; }

function recallComplete(){
  var a = A_WORDS.every(function(w){ return S.rc.a[w]===w; });
  var b = B_ROWS.every(function(r,i){ return S.rc.b[i]===r.ans; });
  var c = C_ROWS.every(function(r,i){ return S.rc.c[i]===r.ans; });
  return a && b && c;
}
function secondValid(){
  if(isSpeech()) return !!Rec.second.blob && S.secondConfirm;
  if(wordCount(S.second)<2) return false;
  if(norm(S.second)===norm(S.firstSaved)) return false;
  return focusMet(S.second, S.focus);
}

    case 3: return recallComplete();
    case 4: return S.firstSaved!=="" ? true : (isSpeech() && S.firstSaved==="" && S.vsSpeech===true && !!Rec.first.blob);
    case 5: return !!S.focus;
    case 6: return secondValid() && S.compared;
    case 7: return S.improved.length>0 && S.finished;
  }
  return true;
}
function maxScreen(){
  var m = 1;
  for(var n=2;n<=TOTAL;n++){ if(gate(n)) m=n; else break; }
  return m;
}
function canAdvance(n){
  switch(n){
    case 1: return S.ic==="o1";
    case 2: return recallComplete();
    case 3: return firstValid();
    case 4: return !!S.focus;
    case 5: return secondValid();
    case 6: return S.improved.length>0;
  }
  return false;
}
function finalValid(){ return S.screen===7 && gate(2)&&gate(3)&&gate(4)&&gate(5)&&gate(6)&&gate(7); }
function invalidateFrom(level){
  if(level<=3){ S.firstSaved=""; S.vsSpeech=false; }
  if(level<=4){ S.focus=""; }
  S.compared=false; S.improved=[]; S.finished=false; S.doneClicked=false;

  $("tryAgainBtn").textContent = t("btnTryAll");

function renderScreen(focusFid, keepScroll){
  var y = window.pageYOffset;
  $("screen").innerHTML = VIEWS[S.screen]();
  if(focusFid){ var f = document.querySelector('[data-fid="'+focusFid+'"]'); if(f) f.focus({preventScroll:true}); }

function syncActions(){
  var n = S.screen, next = $("nextBtn"), again = $("tryAgainBtn");
  var gateNote = $("gateNote");
  if(n===7){
    next.hidden = true; again.hidden = false; doneBtn.hidden = false;
    doneBtn.disabled = !(finalValid()) || S.doneClicked;
    doneBtn.classList.toggle("done-on", S.doneClicked);
    doneBtn.textContent = S.doneClicked ? t("btnDoneOn") : t("btnDone");
    gateNote.textContent = "";
  } else {
    next.hidden = false; again.hidden = true; doneBtn.hidden = true; doneBtn.disabled = true;
    next.textContent = t(NEXT[n]);
    var ok = canAdvance(n);
    next.disabled = !ok;
    gateNote.textContent = ok ? "" : t("gate"+n);
  }
}

var screenEl = $("screen");
screenEl.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]"); if(!el || el.disabled) return;
  var act = el.getAttribute("data-act");
  if(act==="hint"){ var k = el.getAttribute("data-k"); var max = {a:A_HINTS,b:B_HINTS,c:C_HINTS}[k].length; if(S.h[k]<max) S.h[k]++; renderScreen("hint-"+k,true); save(); }
  else if(act==="bank"){
    var w = el.getAttribute("data-w"); var idx = S.rc.b.indexOf(""); if(idx<0) return;
    S.rc.b[idx] = w; renderScreen("gap-"+idx,true); announce(w); save(); syncActions();
  }
  else if(act==="gap"){ var i = +el.getAttribute("data-i"); S.rc.b[i] = ""; renderScreen("gap-"+i,true); save(); }
  else if(act==="recall-reset"){ S.rc={a:{},b:["","","",""],c:{}}; S.h={a:0,b:0,c:0}; reshuffle(); renderScreen("recall-reset",true); save(); }
  else if(act==="clear-first"){
    if(S.route==="type") S.typed=""; else if(S.route==="build") S.fb={g:"",r:"",q:"",c:""}; else { stopAudio(); clearSlot("first"); Rec.first.state="idle"; }
    invalidateFrom(3); renderScreen("clear-first",true); save();
  }
  else if(act==="clear-second"){
    if(isSpeech()){ stopAudio(); clearSlot("second"); Rec.second.state="idle"; S.secondConfirm=false; } else S.second="";
    S.compared=false; S.improved=[]; S.finished=false; renderScreen("clear-second",true); save();
  }
  else if(act==="copy-first"){ S.second = S.firstSaved; S.compared=false; S.improved=[]; S.finished=false; renderScreen("second",true); save(); }
  else if(act==="addphrase"){
    var p = PHRASES[+el.getAttribute("data-i")].en;
    S.second = S.second ? (S.second.replace(/\s+$/,"")+"\n"+p) : p;
    S.compared=false; S.improved=[]; S.finished=false;
    renderScreen("ph-"+el.getAttribute("data-i"),true); save();
  }
  else if(act==="toggle-ex"){ S.exShown = !S.exShown; if(S.exShown) S.modelUsed = true; renderScreen("ex",true); save(); }
  else if(act==="rec-start"){ recStart(el.getAttribute("data-slot")); }
  else if(act==="rec-stop"){ recStop(el.getAttribute("data-slot")); }
  else if(act==="rec-play"){ recPlay(el.getAttribute("data-slot")); }
  else if(act==="rec-reset"){ recReset(el.getAttribute("data-slot")); }
});
screenEl.addEventListener("change", function(ev){
  var el = ev.target.closest("[data-in]"); if(!el) return;
  var k = el.getAttribute("data-in"), fid = el.getAttribute("data-fid");
  if(k==="intro"){ S.ic = el.value; renderScreen(fid,true); save(); }
  else if(k==="a"){ S.rc.a[el.getAttribute("data-k")] = el.value; renderScreen(fid,true); save(); }
  else if(k==="c"){ S.rc.c[el.getAttribute("data-k")] = el.value; renderScreen(fid,true); save(); }
  else if(k==="route"){ hardStopRecording(); S.route = el.value; invalidateFrom(3); renderScreen(fid,true); save(); }
  else if(k==="b"){ S.fb[el.getAttribute("data-k")] = el.value; invalidateFrom(3); renderScreen(fid,true); save(); }
  else if(k==="focus"){ S.focus = el.value; S.compared=false; S.improved=[]; S.finished=false; renderScreen(fid,true); save(); }
  else if(k==="confirm"){ S.secondConfirm = el.checked; S.compared=false; S.improved=[]; S.finished=false; renderScreen(fid,true); save(); }
  else if(k==="improved"){
    var f = el.getAttribute("data-k"); var i = S.improved.indexOf(f);
    if(el.checked && i<0) S.improved.push(f); if(!el.checked && i>=0) S.improved.splice(i,1);
    S.finished=false; renderScreen(fid,true); save();
  }
});
screenEl.addEventListener("input", function(ev){
  var el = ev.target.closest("[data-in]"); if(!el) return;
  var k = el.getAttribute("data-in");
  if(k==="typed"){ S.typed = el.value; invalidateFrom(3); syncActions(); save(); }
  else if(k==="second"){
    S.second = el.value; S.compared=false; S.improved=[]; S.finished=false;
    var fb = $("secondFb"); if(fb) fb.innerHTML = secondFbHTML();
    syncActions(); save();
  }
});

$("nextBtn").addEventListener("click", function(){
  var n = S.screen; if(!canAdvance(n)) return;
  if(n===3){
    hardStopRecording();
    if(isSpeech()){ S.firstSaved = ""; S.vsSpeech = true; } else { S.firstSaved = firstText(); S.vsSpeech = false; }
  }
  if(n===5){ S.compared = true; }
  if(n===6){ S.finished = true; }
  if(n===3 && !isSpeech()){ /* first try saved unchanged */ }
  showScreen(n+1);
});
$("langBtn").addEventListener("click", function(){
  S.lang = S.lang==="en" ? "fr" : "en";
  try{ localStorage.setItem(LKEY,S.lang); }catch(e){}
  document.documentElement.lang = S.lang==="fr" ? "fr" : "en-GB";
  var ae = document.activeElement; var fid = ae && ae.getAttribute ? ae.getAttribute("data-fid") : null;
  renderScreen(fid,true);
  announce(S.lang==="fr" ? "Français" : "English");
});
$("tryAgainBtn").addEventListener("click", function(){ resetAll(); });
doneBtn.addEventListener("click", function(){
  if(doneBtn.disabled || !finalValid()) return;
  S.doneClicked = true;
  activityCompleted();
  doneBtn.disabled = true;
  syncActions();
  announce(t("doneLive"));
});

function resetAll(){
  releaseAll();
  var lang = S.lang; S = fresh(); S.lang = lang; S.screen = 1;
  reshuffle();
  try{ localStorage.removeItem(KEY); }catch(e){}
  doneBtn.disabled = true;
  showScreen(1);
}

/* ============================================================
   LMS / STORAGE (silent: nothing is shown to the learner)
   ============================================================ */
var lms = {api:null, ver:null, inited:false};
function findIn(win){
  var n = 0;
  while(win && n<15){
    try{ if(win.API_1484_11) return {api:win.API_1484_11, ver:"2004"}; }catch(e){}
    try{ if(win.API) return {api:win.API, ver:"1.2"}; }catch(e){}
    var p = null; try{ p = win.parent; }catch(e){}
    if(!p || p===win) break;
    win = p; n++;
  }
  return null;
}
function detectLMS(){
  if(lms.api) return true;
  var f = null;
  try{ f = findIn(window); }catch(e){}
  if(!f){ try{ if(window.opener && !window.opener.closed) f = findIn(window.opener); }catch(e){} }
  if(f){ lms.api = f.api; lms.ver = f.ver; initLMS(); }
  return !!lms.api;
}
function lcall(name12, name2004, a, b){
  var api = lms.api, fn = lms.ver==="2004" ? name2004 : name12;
  return api[fn](a, b);
}
function initLMS(){
  try{
    var r = lms.ver==="2004" ? lms.api.Initialize("") : lms.api.LMSInitialize("");
    lms.inited = String(r)==="true";
    if(!lms.inited){
      var err = lms.ver==="2004" ? lms.api.GetLastError() : lms.api.LMSGetLastError();
      if(String(err)==="0"||String(err)==="101"||String(err)==="103") lms.inited = true;
    }
  }catch(e){}
}
function statusEl(){ return lms.ver==="2004" ? "cmi.completion_status" : "cmi.core.lesson_status"; }
function lget(el){ try{ return String(lcall("LMSGetValue","GetValue",el)); }catch(e){ return ""; } }
function lset(el,val){ try{ return String(lcall("LMSSetValue","SetValue",el,val))==="true"; }catch(e){ return false; } }
function lcommit(){ try{ return String(lcall("LMSCommit","Commit",""))==="true"; }catch(e){ return false; } }

function compactState(){
  return {
    v:1, s:S.screen, ic:S.ic, rc:S.rc, h:S.h, m:S.modelUsed?1:0, r:S.route, t:S.typed, fb:S.fb,
    fs:S.firstSaved, sp:S.vsSpeech?1:0, f:S.focus, s2:S.second, sc:S.secondConfirm?1:0,
    cp:S.compared?1:0, im:S.improved, fin:S.finished?1:0,
    vs:{recall:recallComplete()?1:0, first:S.firstSaved?1:0, focus:S.focus?1:0, second:secondValid()?1:0, improved:S.improved.length?1:0}
  };
}
function saveProgress(){
  var json; try{ json = JSON.stringify(compactState()); }catch(e){ return; }
  var saved = false;
  if(detectLMS() && json.length<3500){
    try{ saved = lset("cmi.suspend_data", json); if(saved) lcommit(); }catch(e){}
  }
  if(!saved){ try{ localStorage.setItem(KEY, json); }catch(e){} }
}
function clip(s,n){ return typeof s==="string" ? s.slice(0,n) : ""; }
function loadProgress(){
  var raw = "";
  if(detectLMS()){ raw = lget("cmi.suspend_data"); }
  if(!raw){ try{ raw = localStorage.getItem(KEY)||""; }catch(e){} }
  if(!raw || raw.length>8000) return false;
  var d; try{ d = JSON.parse(raw); }catch(e){ return false; }
  if(!d || d.v!==1 || typeof d!=="object") return false;
  var n = fresh(); n.lang = S.lang;
  if(typeof d.ic==="string" && INTRO_OPTS.indexOf(d.ic)>=0) n.ic = d.ic;
  if(d.rc && typeof d.rc==="object"){
    A_WORDS.forEach(function(w){ var v = d.rc.a && d.rc.a[w]; if(A_WORDS.indexOf(v)>=0) n.rc.a[w]=v; });
    if(Array.isArray(d.rc.b)) for(var i=0;i<4;i++){ var vb = d.rc.b[i]; if(B_BANK.indexOf(vb)>=0 && n.rc.b.indexOf(vb)<0) n.rc.b[i]=vb; }
    if(d.rc.c) for(var j=0;j<4;j++){ var vc = d.rc.c[j]; if(PARTS.indexOf(vc)>=0) n.rc.c[j]=vc; }
  }
  if(d.h){ ["a","b","c"].forEach(function(k){ var x=+d.h[k]; if(x>=0 && x<=3) n.h[k]=x; }); }
  n.modelUsed = d.m===1;
  if(["type","build","speak"].indexOf(d.r)>=0) n.route = d.r;
  n.typed = clip(d.t,500);
  if(d.fb){ PARTS.forEach(function(p){ var v = d.fb[p]; if(BUILD[p].some(function(o){ return o.en===v; })) n.fb[p]=v; }); }
  n.firstSaved = clip(d.fs,600);
  n.vsSpeech = d.sp===1 && n.route==="speak";
  if(FOCI.indexOf(d.f)>=0) n.focus = d.f;
  n.second = clip(d.s2,500);
  n.secondConfirm = d.sc===1;
  n.compared = d.cp===1;
  if(Array.isArray(d.im)) n.improved = d.im.filter(function(x){ return FOCI.indexOf(x)>=0; });
  n.finished = d.fin===1;
  S = n;
  /* revalidate against current rules; audio is never restored */
  if(S.route==="speak"){ S.vsSpeech = false; S.firstSaved = ""; S.compared=false; S.improved=[]; S.finished=false; S.secondConfirm=false; }
  var ms = maxScreen();
  var want = Math.min(Math.max(1, +d.s||1), ms);
  /* if first try text is no longer valid, drop downstream work */
  if(!S.firstSaved && S.route!=="speak"){ S.focus = ""; S.compared=false; S.improved=[]; S.finished=false; }
  S.screen = Math.min(want, maxScreen());
  return true;
}

function activityCompleted(){
  if(completionSent) return true;
  detectLMS();
  var ok = true;
  if(lms.api){
    try{
      var cur = lget(statusEl());
      if(cur==="completed" || cur==="passed"){ completionSent = true; console.log(LOG); return true; }
      ok = lset(statusEl(), "completed");
      if(ok) ok = lcommit();
      var chk = lget(statusEl());
      if(chk && chk!=="completed" && chk!=="passed") ok = false;
    }catch(e){ ok = false; }
  } else {
    try{ localStorage.setItem(KEY+"_done","1"); }catch(e){}
  }
  if(ok){ completionSent = true; }
  console.log(LOG);
  return ok;
}

window.addEventListener("pagehide", function(){
  try{ saveProgress(); }catch(e){}
  if(S.doneClicked && !completionSent){ try{ activityCompleted(); }catch(e){} }
  releaseAll();
});

/* ============================================================
   INIT
   ============================================================ */
if(loadProgress()){ /* state restored and revalidated */ }
document.documentElement.lang = S.lang==="fr" ? "fr" : "en-GB";
S.doneClicked = false;
renderScreen();
})();
</script>
