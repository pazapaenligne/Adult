<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport vocabulary and travel plans — Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --white:#FFFFFF;
  --radius:14px;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:"Open Sans",Arial,sans-serif;
  font-size:1.0625rem;
  line-height:1.55;
  color:var(--pazapa-grey-dark);
  background:var(--pazapa-grey-light);
}
h1,h2,h3{
  font-family:"Filson Soft","Open Sans",Arial,sans-serif;
  font-weight:800;
  line-height:1.2;
  margin:0 0 .5rem;
}
h2{font-size:1.5rem;}
h3{font-size:1.15rem;}
p{margin:0 0 .75rem;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.skip{position:absolute;left:8px;top:-60px;background:#fff;color:var(--pazapa-grey-dark);padding:10px 14px;border-radius:8px;z-index:10;}
.skip:focus{top:8px;}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px;box-shadow:0 0 0 6px #fff;}
.app{max-width:860px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
.topbar{border-top:10px solid var(--pazapa-blue);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--pazapa-grey-light);}
.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:1rem;}
.lang-btn{min-height:48px;min-width:48px;padding:8px 18px;border-radius:24px;border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);font:700 1rem "Open Sans",Arial,sans-serif;cursor:pointer;touch-action:manipulation;}
.lang-btn[aria-pressed="true"]{background:var(--pazapa-yellow);}
main{flex:1;padding:18px 20px 12px;}
.part{display:inline-block;background:var(--pazapa-grey-light);border-radius:20px;padding:4px 14px;font-size:.9rem;font-weight:700;margin:0 0 14px;}
.eyebrow{display:inline-block;background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-weight:700;font-size:.9rem;padding:3px 12px;border-radius:6px;margin:0 0 8px;}
.lead{font-size:1.1rem;}
.card{background:var(--blue-tint);border-radius:var(--radius);padding:16px;margin:0 0 16px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:#fff;border:2px solid var(--pazapa-grey-light);}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin:0 0 10px;font-size:1.05rem;}
/* buttons */
.btn{min-height:48px;min-width:48px;padding:12px 22px;border-radius:12px;font:700 1rem "Open Sans",Arial,sans-serif;cursor:pointer;touch-action:manipulation;color:var(--pazapa-grey-dark);}
.btn.pri{background:var(--pazapa-blue);border:2px solid var(--pazapa-blue);}
.btn.pri.done{background:var(--pazapa-green);border-color:var(--pazapa-green);}
.btn.sec{background:#fff;border:2px solid var(--pazapa-grey-dark);}
.btn.hint{background:var(--pazapa-yellow);border:2px solid var(--pazapa-yellow);}
.btn:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#595958;cursor:not-allowed;}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.actions{padding:14px 20px 22px;border-top:1px solid var(--pazapa-grey-light);display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;}
/* choice buttons */
.choice{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:12px 14px;border:2px solid var(--pazapa-grey-dark);border-radius:12px;background:#fff;margin:0 0 10px;cursor:pointer;touch-action:manipulation;}
.choice input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--pazapa-grey-dark);}
.choice span.t{flex:1;}
.choice:has(input:checked){background:var(--blue-tint);border-color:var(--pazapa-blue);box-shadow:inset 0 0 0 2px var(--pazapa-blue);}
.tag{display:inline-block;background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;}
/* feedback */
.fb{margin:8px 0 0;min-height:1.4em;font-size:.98rem;}
.fb .dot{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;margin-right:8px;vertical-align:middle;flex:none;}
.fb .ok .dot,.dot.ok{background:var(--pazapa-green);}
.fb .try .dot,.dot.try{background:var(--pazapa-yellow);}
.fb .ok,.fb .try{display:block;padding:8px 10px;border-radius:10px;}
.fb .ok{background:var(--green-tint);}
.fb .try{background:var(--yellow-tint);}
/* forms */
select,input[type=text],textarea{font:inherit;color:var(--pazapa-grey-dark);border:2px solid var(--pazapa-grey-dark);border-radius:10px;background:#fff;}
select{min-height:48px;padding:8px 10px;max-width:100%;}
input[type=text]{min-height:48px;padding:8px 12px;width:8.5rem;}
textarea{width:100%;min-height:130px;padding:12px;resize:vertical;}
textarea[readonly]{background:var(--pazapa-grey-light);}
label.lbl{display:block;font-weight:700;margin:0 0 6px;}
/* departure-board task headers */
.station{border-radius:var(--radius);overflow:hidden;margin:0 0 18px;border:2px solid var(--pazapa-grey-dark);}
.board{background:var(--pazapa-grey-dark);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;}
.board h3{margin:0;color:#fff;font-size:1.1rem;}
.board .no{background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;}
.station .body{padding:14px 16px;background:#fff;}
.row{padding:12px 0;border-bottom:1px dashed var(--pazapa-grey-light);}
.row:last-child{border-bottom:0;}
.row .q{margin:0 0 8px;}
.hintbox{background:var(--yellow-tint);border-radius:10px;padding:10px 12px;margin:10px 0 0;}
.hintbox p{margin:0 0 6px;}
.hintbox p:last-child{margin:0;}
.hintimgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;}
.hintimgs img{width:64px;height:auto;border-radius:8px;}
/* opening pass */
.pass{display:grid;grid-template-columns:1fr;border:2px solid var(--pazapa-grey-dark);border-radius:18px;overflow:hidden;margin:0 0 18px;background:var(--yellow-tint);}
.pass .main{padding:18px;}
.pass .stub{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#fff;border-top:3px dashed var(--pazapa-grey-dark);}
.pass .stub img{width:100%;height:auto;border-radius:8px;display:block;}
.goalbox{background:#fff;border-left:8px solid var(--pazapa-blue);border-radius:8px;padding:10px 14px;margin:10px 0 0;font-weight:700;font-size:1.15rem;}
@media (min-width:720px){
  .pass{grid-template-columns:1.5fr 1fr;}
  .pass .stub{grid-template-columns:1fr 1fr;border-top:0;border-left:3px dashed var(--pazapa-grey-dark);align-content:center;}
}
/* first try layout */
.sit{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;margin:0 0 14px;}
.sit img{width:96px;height:auto;border-radius:10px;}
@media (max-width:420px){.sit{grid-template-columns:72px 1fr;}.sit img{width:72px;}}
.purpose{display:inline-block;background:var(--pazapa-blue);padding:3px 12px;border-radius:6px;font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--pazapa-blue);background:#fff;font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;text-align:left;}
.chip small{display:block;font-size:.8rem;}
.gloss{display:block;font-size:.9rem;}
.quote{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere;}
.bankgrp{margin:0 0 10px;}
.bankgrp strong{display:block;margin:0 0 4px;}
.bankgrp ul{margin:0;padding-left:1.2rem;}
.bankgrp li{margin:0 0 4px;}
.compare{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 16px;}
@media (min-width:720px){.compare{grid-template-columns:1fr 1fr;}}
.compare .quote{margin:0;min-height:80px;}
.compare h3{font-size:1rem;}
/* recorder */
.rec{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;margin:0 0 14px;}
.rec-title{font-weight:700;margin:0 0 8px;}
.rec-status{margin:10px 0 0;font-size:.95rem;}
.rec-status .st{display:inline-block;background:var(--pazapa-grey-light);border-radius:6px;padding:1px 8px;font-weight:700;margin-right:6px;}
.rec-status.err .st{background:var(--pazapa-yellow);}
.rec-status.rdy .st{background:var(--pazapa-green);}
details{margin:0 0 14px;}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700;}
.center{text-align:center;}
.hero2{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center;margin:0 0 16px;}
.hero2 img{width:140px;height:auto;border-radius:12px;}
@media (max-width:480px){.hero2{grid-template-columns:96px 1fr;}.hero2 img{width:96px;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>
<a class="skip" href="#stage" id="skipLink">Skip to activity</a>
<div class="app">
  <header class="topbar">
    <div class="brand">Pazapa English Programme for Adults</div>
    <button type="button" class="lang-btn" id="langBtn" aria-pressed="false" lang="fr">Français</button>
  </header>
  <main>
    <p class="part" id="partLabel"></p>
    <section id="stage" aria-live="off"></section>
  </main>
  <div class="actions" id="actions">
    <button type="button" class="btn sec" id="retryBtn" hidden>Try again</button>
    <button type="button" class="btn pri" id="nextBtn"></button>
    <button type="button" class="btn pri" id="doneBtn" hidden>Done</button>
  </div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</div>

/* ============================ TEXT CHECKS (deterministic, transparent) ============================ */
function norm(s){
  return String(s||"").normalize("NFKC")
    .replace(/[‘’ʼ`´]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-")
    .toLowerCase().replace(/\s+/g," ").trim();
}
function normCmp(s){ return norm(s).replace(/^[\s.,;:!?"']+|[\s.,;:!?"']+$/g,""); }
function wordCount(s){ var m = norm(s).match(/[a-z0-9'À-ɏ]+/g); return m?m.length:0; }
var NUM = "(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|\\d{1,2})";
var RX = {
  purpose: /check[\s-]?in|\bwhere\s+(?:is|are)\b|what time does the flight|correct queue|\bwhich gate\b/,
  time: new RegExp("\\b(?:at|is|leaves|leave|by)\\s+"+NUM+"(?:[:.]\\d{2})?\\b|\\b"+NUM+"\\s*o'?clock\\b|\\b\\d{1,2}[:.]\\d{2}\\b|\\b\\d{1,2}\\s*(?:am|pm)\\b"),
  gateNo: new RegExp("\\bgate\\s*"+NUM+"\\b"),
  luggage: /\b(?:suitcases?|luggage|bags?)\b/,
  flightNo: /\bpa\s*\d{2,4}\b/,
  phrases: [
    /my flight leaves at/, /where is the check[\s-]?in desk/, /i have (?:one|two|three|\d+) suitcases?/,
    /what time does the flight arrive/, new RegExp("where is gate\\s*"+NUM), /is this the correct queue/
  ],
  thanks: /\b(?:thank you|thanks)\b/,
  opener: /\b(?:excuse me|please|sorry|pardon)\b/
};
function feats(text){
  var t0 = norm(text);
  var first = (t0.split(/[.!?]+\s*/)[0])||"";
  var hasTime = RX.time.test(t0), gate = RX.gateNo.test(t0), lug = RX.luggage.test(t0), fno = RX.flightNo.test(t0);
  var thanks = RX.thanks.test(t0), opener = RX.opener.test(t0);
  return {
    purpose: RX.purpose.test(t0),
    purposeFirst: RX.purpose.test(first),
    hasTime: hasTime,
    detailScore: [hasTime,gate,lug,fno].filter(Boolean).length,
    phraseCount: RX.phrases.filter(function(r){return r.test(t0);}).length,
    thanks: thanks,
    politeCount: (thanks?1:0)+(opener?1:0)
  };
}
function improvedBetween(a,b){
  var f1=feats(a), f2=feats(b);
  return {
    purpose: (!f1.purpose && f2.purpose) || (!f1.purposeFirst && f2.purposeFirst),
    info: f2.detailScore>f1.detailScore || (!f1.hasTime && f2.hasTime),
    phrase: f2.phraseCount>f1.phraseCount,
    polite: f2.politeCount>f1.politeCount || (!f1.thanks && f2.thanks)
  };
}
function strengths(text){
  var f=feats(text), out=[];
  if(f.purpose) out.push("w_purpose");
  if(f.detailScore>0) out.push("w_detail");
  if(f.politeCount>0) out.push("w_polite");
  if(f.phraseCount>0) out.push("w_phrase");
  if(!out.length) out.push("w_basic");
  return out;
}
function suggestions(text){
  var f=feats(text), s=[];
  if(!f.purpose) s.push("purpose");
  if(!f.hasTime) s.push("info");
  if(!f.thanks) s.push("polite");
  if(f.phraseCount===0) s.push("phrase");
  return s.slice(0,2);
}

/* validation — always recomputed from the content, never from stored "completed" flags */
function goalOk(s){ return s.goal===GOAL_OK; }
function recallDone(s){
  return s.t1.every(function(v){return v!=="";}) && s.t2c.every(Boolean) && s.t3.every(function(v){return v!==null;});
}
function firstValid(s){ return s.firstLocked && wordCount(s.first)>=3; }
function focusValid(s){ return s.focus.length>=1 && s.focus.length<=2; }
function secondDistinct(s){ return wordCount(s.second)>=3 && normCmp(s.second)!==normCmp(s.first); }
function secondValid(s){ return secondDistinct(s) || s.spokenRetry; }
function reflectValid(s){ return s.reflect.length>=1; }
function maxScreen(s){
  if(!goalOk(s)) return 1;
  if(!recallDone(s)) return 2;
  if(!firstValid(s)) return 3;
  if(!focusValid(s)) return 4;
  if(!secondValid(s)) return 5;
  if(!reflectValid(s)) return 6;
  return 7;
}
function canAdvance(s){
  switch(s.screen){
    case 1: return goalOk(s);
    case 2: return recallDone(s);
    case 3: return wordCount(s.first)>=3;
    case 4: return focusValid(s);
    case 5: return secondValid(s);
    case 6: return reflectValid(s);
  }
  return false;
}

var LMS = {api:null, ver:null, init:false, tried:false};
function findAPIIn(win){

  while(win && depth<12){
    try{
      if(win.API_1484_11) return {api:win.API_1484_11, ver:"2004"};
      if(win.API) return {api:win.API, ver:"1.2"};

}
function detectLMS(){

  if(r){ LMS.api=r.api; LMS.ver=r.ver; return true; }

}
function lmsInit(){
  if(!LMS.api || LMS.init) return;
  try{
    var r = (LMS.ver==="2004") ? LMS.api.Initialize("") : LMS.api.LMSInitialize("");
    LMS.init = (String(r)==="true");

}
function lmsGet(k){ try{ return String((LMS.ver==="2004")?LMS.api.GetValue(k):LMS.api.LMSGetValue(k)); }catch(e){ return ""; } }

function activityCompleted(){
  /* transactional: set -> commit -> verify -> lock; never downgrades completed/passed */
  if(completionSent) return true;

var recs = {first:newRec(), second:newRec()};
function newRec(){ return {status:"idle", kind:"", url:null, stream:null, mr:null, chunks:[], timer:null, audio:null}; }

function releaseStream(r){
  try{ if(r.stream) r.stream.getTracks().forEach(function(tr){ try{tr.stop();}catch(e){} }); }catch(e2){}

function revokeUrl(r){ if(r.url){ try{URL.revokeObjectURL(r.url);}catch(e){} r.url=null; } }

function recStatusText(r){
  if(r.status==="idle") return ["st_ready","rec_idle","",""];
  if(r.status==="recording") return ["st_rec","rec_recording","",""];

      '<button type="button" class="btn sec" data-rec="'+key+'" data-act="stop"'+((s!=="recording")?" disabled":"")+'>'+t("rec_stop")+'</button>'+

function startRec(key){
  var r=recs[key];
  if(r.status==="recording") return;
  stopPlayback(r);
  if(!recSupported()){ setRec(key,"error","unsupported","again"); return; }
  var p;
  try{ p=navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ setRec(key,"error","unexpected","again"); return; }
  p.then(function(stream){
    r.stream=stream; r.chunks=[];
    var mr;
    try{ mr=new MediaRecorder(stream); }catch(e){ releaseStream(r); setRec(key,"error","unexpected","again"); return; }
    r.mr=mr;
    mr.ondataavailable=function(ev){ if(ev.data && ev.data.size>0) r.chunks.push(ev.data); };
    mr.onerror=function(){ releaseStream(r); clearTimeout(r.timer); setRec(key,"error","unexpected","again"); };
    mr.onstop=function(){
      releaseStream(r); clearTimeout(r.timer);
      var blob=new Blob(r.chunks,{type:mr.mimeType||"audio/webm"});
      r.chunks=[];
      if(!blob.size){ setRec(key,"error","empty","again"); return; }
      revokeUrl(r); r.url=URL.createObjectURL(blob);
      setRec(key,"ready","", "play");
    };
    try{ mr.start(); }catch(e2){ releaseStream(r); setRec(key,"error","unexpected","again"); return; }
    setRec(key,"recording","","stop");
    r.timer=setTimeout(function(){ stopRec(key); },30000);
  }).catch(function(err){
    var n=err&&err.name, kind="unexpected";
    if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError") kind="denied";
    else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") kind="nodevice";
    setRec(key,"error",kind,"again");

}
function stopRec(key){
  var r=recs[key];
  if(r.status!=="recording" || !r.mr) return;
  try{ if(r.mr.state!=="inactive") r.mr.stop(); }catch(e){ releaseStream(r); setRec(key,"error","unexpected","again"); }
}
function playRec(key){
  var r=recs[key];
  if(!r.url) return;
  stopPlayback(r);
  var a=new Audio(r.url); r.audio=a;
  a.onended=function(){ if(r.audio===a){ r.audio=null; if(r.status==="playing") setRec(key,"ready","","play"); } };
  a.onerror=function(){ r.audio=null; setRec(key,"error","unexpected","again"); };
  var p=a.play();
  setRec(key,"playing","","play");
  if(p && p.catch) p.catch(function(){ r.audio=null; setRec(key,"error","unexpected","again"); });
}
function againRec(key){
  var r=recs[key];
  stopPlayback(r); revokeUrl(r);
  if(key==="second" && state.spokenRetry){ state.spokenRetry=false; state.reflect=[]; saveSoon(); }
  setRec(key,"idle","","rec");
}
function resetRecs(){
  ["first","second"].forEach(function(k){
    var r=recs[k]; clearTimeout(r.timer);
    try{ if(r.mr && r.mr.state!=="inactive"){ r.mr.onstop=null; r.mr.stop(); } }catch(e){}
    releaseStream(r); stopPlayback(r); revokeUrl(r);
    recs[k]=newRec();
  });
}
function cleanupAll(){
  resetRecs();
  try{ if(LMS.init){ if(LMS.ver==="2004") LMS.api.Terminate(""); else LMS.api.LMSFinish(""); LMS.init=false; } }catch(e){}
}

var RENDERERS = {1:renderS1,2:renderS2,3:renderS3,4:renderS4,5:renderS5,6:renderS6,7:renderS7};

function refreshNav(){
  var s=state.screen, last=(s===NSCREENS);
  nextBtn.hidden=last; retryBtn.hidden=!last; doneBtn.hidden=!last;
  retryBtn.textContent=t("btn_try");
  if(!last){
    nextBtn.textContent=t(NEXT_LABEL[s]);
    nextBtn.disabled=!canAdvance(state);
  }
  doneBtn.textContent=(doneShown?"✓ ":"")+t("btn_done");
  doneBtn.classList.toggle("done",doneShown);
  doneBtn.disabled = !(last && maxScreen(state)===NSCREENS) || doneShown;
  if(s===3){
    var n3=document.getElementById("need3");
    if(n3) n3.textContent = (wordCount(state.first)>0 && wordCount(state.first)<3)? t("s3_need") : "";
  }
  if(s===6){
    var f6=document.getElementById("fb6");
    if(f6) f6.textContent = state.reflect.length? "" : t("s6_need");
  }
  if(s===4){
    var f4=document.getElementById("fbFocus");
    if(f4 && state.focus.length<2) f4.textContent="";
  }
}
function render(){
  var s=state.screen;
  stage.setAttribute("lang", STATE_LANG==="fr"?"fr":"en-GB");
  stage.innerHTML = RENDERERS[s]();
  partLabel.textContent = t("part",{n:s,N:NSCREENS});
  document.getElementById("skipLink").textContent=t("skip");
  langBtn.textContent = STATE_LANG==="fr" ? "English" : "Français";
  langBtn.setAttribute("lang", STATE_LANG==="fr" ? "en" : "fr");
  langBtn.setAttribute("aria-pressed", STATE_LANG==="fr" ? "true":"false");
  langBtn.setAttribute("aria-label", t("langBtnAria"));
  mountRecs();
  refreshNav();
}
function focusHeading(){
  var h=document.getElementById("h");
  if(h){ try{ h.focus({preventScroll:false}); }catch(e){ h.focus(); } }
  window.scrollTo(0,0);
}
function go(n){
  state.screen=n;
  save(true);
  render();
  focusHeading();
  announce(t("part",{n:n,N:NSCREENS}));
}

/* invalidation: changing reviewed content clears everything downstream */
function invalidateAfterFirst(){ state.focus=[]; state.second=""; state.spokenRetry=false; state.reflect=[]; state.showEx=false; }
function invalidateAfterSecond(){ state.reflect=[]; }

/* ============================ EVENTS ============================ */
function appendText(cur,add){ cur=cur.replace(/\s+$/,""); var out=(cur?cur+" ":"")+add; return out.slice(0,300); }

stage.addEventListener("change",function(e){
  var el=e.target;
  if(el.name==="goal"){
    state.goal=parseInt(el.value,10);
    document.getElementById("fbGoal").innerHTML = goalOk(state)? fbHtml("ok",t("s1_ok")) : fbHtml("try",t("s1_no"));
    announce(goalOk(state)?t("s1_ok"):t("s1_no"));
  } else if(el.hasAttribute("data-t1")){
    var ii=parseInt(el.getAttribute("data-t1"),10);
    state.t1[ii]=el.value;
    document.getElementById("fb1_"+ii).innerHTML=fb1For(ii);
    announce(el.value? (el.value===T1_KEYS[ii]? t("fb1_ok",{w:T1_KEYS[ii],m:MEANING[T1_KEYS[ii]][STATE_LANG==="fr"?1:0]}) : t("fb1_try")) : "");
  } else if(el.hasAttribute("data-t3")){
    var q=parseInt(el.getAttribute("data-t3"),10);
    state.t3[q]=parseInt(el.value,10);
    document.getElementById("fb3_"+q).innerHTML=fb3For(q);
    announce(state.t3[q]===T3_ITEMS[q].ok? t("fb3_ok"+q) : t("fb3_try"));
  } else if(el.name==="focus"){
    var id=el.value, idx=state.focus.indexOf(id);
    if(el.checked){
      if(state.focus.length>=2){ el.checked=false; var f=document.getElementById("fbFocus"); if(f) f.textContent=t("max2"); announce(t("max2")); return; }
      if(idx<0) state.focus.push(id);
    } else if(idx>=0) state.focus.splice(idx,1);
    invalidateAfterSecond();
    var f2=document.getElementById("fbFocus"); if(f2) f2.textContent="";
  } else if(el.name==="reflect"){
    var rid=el.value, ri=state.reflect.indexOf(rid);
    if(el.checked){ if(ri<0) state.reflect.push(rid); } else if(ri>=0) state.reflect.splice(ri,1);
  } else if(el.id==="spokenChk"){
    state.spokenRetry=el.checked; invalidateAfterSecond();
  }
  refreshNav(); saveSoon();
});

stage.addEventListener("input",function(e){
  var el=e.target;
  if(el.hasAttribute("data-t2")){
    var i=parseInt(el.getAttribute("data-t2"),10);
    state.t2[i]=el.value;
    if(state.t2c[i]){ state.t2c[i]=false; document.getElementById("fb2_"+i).innerHTML=""; }
  } else if(el.getAttribute("data-txt")==="first"){
    state.first=el.value.slice(0,300);
    invalidateAfterFirst(); state.firstLocked=false;
  } else if(el.getAttribute("data-txt")==="second"){
    state.second=el.value.slice(0,300);
    invalidateAfterSecond();
    var fb=document.getElementById("fb5"); if(fb) fb.innerHTML=s5Feedback();
  }
  refreshNav(); saveSoon();
});

stage.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target.hasAttribute && e.target.hasAttribute("data-t2")){
    e.preventDefault();
    checkT2(parseInt(e.target.getAttribute("data-t2"),10));
  }
});

function checkT2(i){
  var inp=document.getElementById("in"+i);
  if(inp) state.t2[i]=inp.value;
  var fbEl=document.getElementById("fb2_"+i);
  if(state.t2[i].trim()===""){
    state.t2c[i]=false;
    fbEl.innerHTML=fbHtml("try",t("fb2_empty"));
    announce(t("fb2_empty"));
  } else {
    state.t2c[i]=true;
    fbEl.innerHTML=fb2For(i);
    announce(t2Ok(i)? t("fb2_ok"+i) : t("fb2_try"));
  }
  refreshNav(); saveSoon();
}

stage.addEventListener("click",function(e){
  var b=e.target.closest ? e.target.closest("button") : null;
  if(!b) return;
  var act=b.getAttribute("data-act");
  if(!act) return;
  var rk=b.getAttribute("data-rec");
  if(rk){
    if(act==="rec") startRec(rk);
    else if(act==="stop") stopRec(rk);
    else if(act==="play") playRec(rk);
    else if(act==="again") againRec(rk);
    return;
  }
  if(act==="check2"){ checkT2(parseInt(b.getAttribute("data-i"),10)); return; }
  if(act==="hint"){
    var task=b.getAttribute("data-task");
    if(state.hints[task]<2){ state.hints[task]++; state.hintUsed=true; }
    document.getElementById("hb_"+task).innerHTML=hintBoxHtml(task);
    var again=hintBtnHtml(task); b.outerHTML=again;
    var nb=stage.querySelector('[data-act="hint"][data-task="'+task+'"]'); if(nb && !nb.disabled) nb.focus();
    announce(t("h"+task.charAt(1)+"_"+state.hints[task]));
    saveSoon(); return;
  }
  if(act==="hint4"){
    if(state.hints.s4<2){ state.hints.s4++; state.hintUsed=true; }
    render(); var nb4=stage.querySelector('[data-act="hint4"]'); if(nb4 && !nb4.disabled) nb4.focus();
    announce(t("s4_hint"+state.hints.s4)); saveSoon(); return;
  }
  if(act==="toggleEx"){
    state.showEx=!state.showEx; if(state.showEx) state.modelUsed=true;
    render(); var nbx=stage.querySelector('[data-act="toggleEx"]'); if(nbx) nbx.focus(); saveSoon(); return;
  }
  if(act==="retry2"){
    state.t1=["","","",""]; state.t2=["","",""]; state.t2c=[false,false,false]; state.t3=[null,null];
    state.hints.t1=0; state.hints.t2=0; state.hints.t3=0;
    ensureOrd(true,["m1","i1","o3a","o3b"]);
    render(); focusHeading(); announce(t("s2_title")); saveSoon(); return;
  }
  if(act==="addFirst"){
    var ta=document.getElementById("firstTxt");
    state.first=appendText(state.first,PHRASES[b.getAttribute("data-p")][0]);
    ta.value=state.first; invalidateAfterFirst(); state.firstLocked=false;
    ta.focus(); refreshNav(); saveSoon(); return;
  }
  if(act==="addSecond"){
    var tb=document.getElementById("secondTxt");
    state.second=appendText(state.second,PHRASES[b.getAttribute("data-p")][0]);
    tb.value=state.second; invalidateAfterSecond();
    document.getElementById("fb5").innerHTML=s5Feedback();
    tb.focus(); refreshNav(); saveSoon(); return;
  }
  if(act==="copyFirst"){
    var tc=document.getElementById("secondTxt");
    state.second=state.first; tc.value=state.second; invalidateAfterSecond();
    document.getElementById("fb5").innerHTML=s5Feedback();
    tc.focus(); refreshNav(); saveSoon(); return;
  }
});

nextBtn.addEventListener("click",function(){
  if(!canAdvance(state)) return;
  if(state.screen===3){ state.firstLocked=true; }
  go(state.screen+1);
});

doneBtn.addEventListener("click",function(){
  if(doneBtn.disabled) return;
  if(state.screen!==NSCREENS || maxScreen(state)!==NSCREENS) return;
  activityCompleted();
  doneShown=true;
  save(true);
  refreshNav();
  announce(t("s7_title"));
});

retryBtn.addEventListener("click",function(){
  var lang=state.lang;
  resetRecs();
  state=freshState(lang);
  ensureOrd(true);
  doneShown=false;
  try{ window.localStorage.removeItem(KEY); }catch(e){}
  save(true);
  render(); focusHeading();
  announce(t("part",{n:1,N:NSCREENS}));
});

langBtn.addEventListener("click",function(){
  STATE_LANG = (STATE_LANG==="fr") ? "en" : "fr";
  state.lang=STATE_LANG;
  render();
  langBtn.focus();
  announce(STATE_LANG==="fr" ? "Français" : "English");
  saveSoon();
});

window.addEventListener("pagehide",cleanupAll);
window.addEventListener("beforeunload",function(){ resetRecs(); });
/* if an LMS appears later, send a pending completion after the next interaction */
document.addEventListener("pointerdown",function(){
  if(!completionSent && lsHasUnsentCompletion() && !LMS.api && detectLMS()){ activityCompleted(); }
},true);

/* ============================ START ============================ */
(function init(){
  var restored=load();
  if(restored){ state=restored; }
  state.v=1;
  ensureOrd(false);
  STATE_LANG=state.lang;
  var mx=maxScreen(state);
  if(state.screen>mx) state.screen=mx;
  if(state.screen<1) state.screen=1;
  render();
})();

})();
</script>
</body>
</html>
