<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asking for clarification — Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --cream:#FFF8EE;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);font-family:"Open Sans",Arial,sans-serif;font-size:1rem;line-height:1.55;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;line-height:1.25;margin:0;}
.app{max-width:780px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;border-top:6px solid var(--pazapa-blue);}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--pazapa-grey-light);}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand img{height:34px;width:auto;display:block;}
.brand .meta{font-size:.85rem;font-weight:700;color:var(--pazapa-blue-dark);}
main{flex:1;padding:22px 20px 36px;}
.screen[hidden]{display:none;}
h2.title{font-size:1.5rem;margin-bottom:6px;}
h2.title:focus{outline:none;}
.kicker{font-size:.9rem;font-weight:700;color:var(--pazapa-blue-dark);margin:0 0 4px;}
.lead{margin:0 0 18px;}
.card{background:var(--blue-tint);border-radius:14px;padding:16px;margin:0 0 16px;}
.card.cream{background:var(--cream);}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card h3{font-size:1.05rem;margin-bottom:10px;}
.hero{display:block;width:100%;max-width:300px;margin:0 auto 16px;border-radius:14px;}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin-bottom:8px;}
fieldset.card>legend{float:left;width:100%;}
fieldset.card>legend+*{clear:both;}
.choice{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:10px 14px;margin-bottom:10px;border:2px solid var(--pazapa-blue-dark);border-radius:10px;background:#fff;cursor:pointer;touch-action:manipulation;}
.choice input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--pazapa-blue-dark);}
.choice:has(input:checked){background:var(--blue-tint);font-weight:700;}
.btn{min-height:48px;min-width:48px;padding:12px 24px;border-radius:10px;border:2px solid var(--pazapa-blue-dark);background:var(--pazapa-blue-dark);color:#fff;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;}
.btn.ghost{background:#fff;color:var(--pazapa-blue-dark);}
.btn.ok{background:var(--pazapa-green);border-color:#8d9620;color:var(--pazapa-grey-dark);}
.btn.small{padding:8px 16px;}
.btn:disabled{background:var(--pazapa-grey-light);border-color:#b8b8b8;color:#5b5b5b;cursor:not-allowed;}
.btn.ghost:disabled{background:#fff;}
:focus-visible{outline:3px solid var(--pazapa-blue-dark);outline-offset:3px;}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px;}
.help{font-size:.9rem;margin:10px 0 0;}
.fb{margin:10px 0 0;font-size:.95rem;min-height:1.3em;}
.fb.ok{background:var(--green-tint);border-left:5px solid var(--pazapa-green);padding:8px 12px;border-radius:8px;}
.fb.ok::before{content:"\2713  ";font-weight:700;}
.fb.help-fb{background:var(--yellow-tint);border-left:5px solid var(--pazapa-yellow);padding:8px 12px;border-radius:8px;}
.fb.help-fb::before{content:"\2192  ";font-weight:700;}
.hint{background:var(--yellow-tint);border-left:5px solid var(--pazapa-yellow);padding:8px 12px;border-radius:8px;margin:10px 0 0;font-size:.95rem;}
.hint::before{content:"Hint: ";font-weight:700;}
body.fr .hint::before{content:"Indice : ";}
select,input[type=text],textarea{font:inherit;color:var(--pazapa-grey-dark);border:2px solid var(--pazapa-blue-dark);border-radius:10px;background:#fff;}
select{min-height:48px;padding:8px 12px;max-width:100%;}
input[type=text]{min-height:48px;padding:8px 12px;width:9.5em;max-width:100%;}
textarea{width:100%;min-height:130px;padding:12px;resize:vertical;}
.item{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:12px 0;border-top:1px solid #cfe7ee;}
.item:first-of-type{border-top:0;}
.item img{width:84px;height:auto;border-radius:10px;flex:none;}
.item .body{flex:1;min-width:200px;}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.gloss{display:block;font-size:.85rem;color:#4a4a48;font-style:italic;font-weight:400;}
body:not(.fr) .gloss{display:none;}
.quote{background:#fff;border:1px solid #cfd6d8;border-radius:10px;padding:10px 14px;margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;}
.tag{display:inline-block;font-size:.85rem;font-weight:700;border-radius:14px;padding:2px 10px;margin:2px 6px 2px 0;}
.tag.yes{background:var(--pazapa-green);}
.tag.no{background:#fff;border:2px dashed #8a8a88;}
.checklist{list-style:none;margin:0 0 12px;padding:0;}
.checklist li{margin:0 0 6px;}
.checklist li .mk{display:inline-block;width:1.4em;font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--pazapa-blue-dark);background:#fff;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation;color:var(--pazapa-grey-dark);}
.chip:hover{background:var(--blue-tint);}
.bank-group{margin:0 0 6px;font-weight:700;font-size:.9rem;}
.bank{margin:0;padding-left:20px;}
.bank li{margin-bottom:6px;}
.two{display:grid;grid-template-columns:1fr;gap:14px;}
@media (min-width:700px){.two{grid-template-columns:1fr 1fr;}}
.rec{border:2px dashed var(--pazapa-blue-dark);border-radius:12px;padding:12px;margin:0 0 14px;background:#fff;}
.rec .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.rec-status{margin:8px 0 0;font-weight:700;font-size:.95rem;}
.panel[hidden]{display:none;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
details.model summary{cursor:pointer;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
@media (max-width:480px){main{padding:18px 14px 30px;}.item img{width:72px;}}
</style>
</head>

/* ================= CHECK RULES (deterministic) =================
   Each check looks for a meaning part, not an exact sentence:
   problem  - says something is not understood / unclear, or asks what a word means
   request  - asks for explanation, repetition, an example or help
   nextstep - asks where to submit, what to do next, or if this is the right place
   polite   - uses Could you / Can I / Would you / please / thank you
   detail   - names the part: question, word, instructions, activity, deadline
   time     - asks for more time                                                   */
var CK_KEYS = ["problem","request","nextstep","polite","detail","time"];
var CORE = ["problem","request","nextstep","polite"];
var RULES = {
  problem: function(s){ return /\b(don'?t|do not|dont|can'?t|cannot|can not|didn'?t|did not|not)\b.{0,14}\b(understand|know|clear|sure)\b/.test(s) || /what (does|do) .{1,40} mean/.test(s) || /\b(unclear|confus(ed|ing))\b/.test(s); },
  request: function(s){ return /\b(explain|repeat|example|help|show me)\b/.test(s) || /say (it|that) again/.test(s) || /what (does|do) .{1,40} mean/.test(s); },
  nextstep: function(s){ return /\bwhere\b.{0,25}\b(submit|send|upload|post|put|answer)\b/.test(s) || /\bwhat\b.{0,12}\bdo\b.{0,10}\bnext\b/.test(s) || /\bis this the (correct|right) (place|page)\b/.test(s) || /\bhow (do|can|should) i (submit|send)\b/.test(s); },
  polite: function(s){ return /\b(could you|can you|can i|would you|may i|please|thank you|thanks)\b/.test(s); },
  detail: function(s){ return /\b(instructions?|question|word|activity|deadline|attempt|friday)\b/.test(s); },
  time: function(s){ return /\b(more|extra) time\b/.test(s); }
};
function evalText(text){
  var s=norm(text), r={};
  CK_KEYS.forEach(function(k){ r[k]=!!RULES[k](s); });
  return r;
}
var FOCUS_PHRASE = {problem:P.ins, request:P.exp, nextstep:P.sub, polite:P.thanks, detail:P.q, time:P.time};

var KEY="pazapa_a1_w13d3_step7_v1";
function newResp(){ return {route:"text", text:"", ticks:{}, spoken:false}; }
function defaultState(){ return {v:1, goal:"", rec:{}, hint:0, model:0, first:newResp(), focus:[], second:newResp(), imp:[], spokenRoute:false}; }
var state = defaultState();
var current = 0;
let completionSent = false;
var doneBtn = $("doneBtn");

function checksOf(r){
  if(r.route==="speak"){ var o={}; CK_KEYS.forEach(function(k){ o[k]=!!r.ticks[k]; }); return o; }
  return evalText(r.text);
}
function respValid(r){
  if(r.route==="speak"){ return !!r.spoken && CK_KEYS.some(function(k){ return r.ticks[k]; }); }
  return words(r.text)>=3;
}
function focusOptions(c){
  var miss=CORE.filter(function(k){ return !c[k]; }).slice(0,2);
  if(miss.length<2 && !c.detail) miss.push("detail");
  if(miss.length<2 && !c.time) miss.push("time");
  if(!miss.length) miss=["own"];
  return miss;
}
function appliesFocus(k, r){ if(k==="own") return true; return !!checksOf(r)[k]; }
function secondValid(){
  var r=state.second;
  if(!respValid(r) || !state.focus.length) return false;
  if(r.route==="text" && state.first.route==="text" && norm(r.text)===norm(state.first.text)) return false;
  return state.focus.some(function(k){ return appliesFocus(k,r); });
}
function focusStillValid(){
  if(!respValid(state.first)) return false;
  var opts=focusOptions(checksOf(state.first));
  return state.focus.every(function(k){ return opts.indexOf(k)>-1; });
}
function revalidate(){
  if(!focusStillValid()){ state.focus=[]; }
  if(!secondValid()){ state.imp=[]; }
}
function recAttempted(id){ return state.rec[id] && state.rec[id].tries>0; }
function allValid(){
  return !!state.goal && ITEMS.every(function(it){ return recAttempted(it.id); }) && respValid(state.first) && state.focus.length>0 && secondValid() && state.imp.length>0;
}

/* ================= STORAGE & LMS ================= */
function serialise(){
  function r(x){ return {r:x.route, t:String(x.text||"").slice(0,420), k:CK_KEYS.filter(function(k){return x.ticks[k];}), s:x.spoken?1:0}; }
  var rec={}; Object.keys(state.rec).forEach(function(k){ rec[k]={v:String(state.rec[k].val||"").slice(0,40), n:Math.min(state.rec[k].tries||0,9)}; });
  return JSON.stringify({v:1, g:state.goal, rc:rec, h:state.hint, m:state.model, a:r(state.first), f:state.focus, b:r(state.second), i:state.imp});
}
function restore(str){
  try{
    var o=JSON.parse(str); if(!o||o.v!==1) return null;
    var s=defaultState();
    s.goal=/^g[123]$/.test(o.g)?o.g:"";
    if(o.rc&&typeof o.rc==="object"){ Object.keys(o.rc).forEach(function(k){ if(ITEMS.some(function(it){return it.id===k;})){ var e=o.rc[k]; s.rec[k]={val:String(e.v||"").slice(0,40),tries:Math.max(0,Math.min(9,+e.n||0))}; } }); }
    s.hint=Math.max(0,+o.h||0); s.model=Math.max(0,+o.m||0);
    function rr(x){ var r=newResp(); if(!x) return r; r.route=x.r==="speak"?"speak":"text"; r.text=String(x.t||"").slice(0,420); (x.k||[]).forEach(function(k){ if(CK_KEYS.indexOf(k)>-1) r.ticks[k]=true; }); r.spoken=!!x.s; return r; }
    s.first=rr(o.a); s.second=rr(o.b);
    s.focus=(o.f||[]).filter(function(k){ return CK_KEYS.indexOf(k)>-1||k==="own"; }).slice(0,2);
    s.imp=(o.i||[]).filter(function(k){ return ["purpose","info","phrase","polite"].indexOf(k)>-1; });
    return s;
  }catch(e){ return null; }
}
var api=null, apiType=null;
function probe(w){ try{ if(w.API_1484_11) return {a:w.API_1484_11,t:"2004"}; }catch(e){} try{ if(w.API) return {a:w.API,t:"1.2"}; }catch(e){} return null; }
function findAPI(){
  var w=window, n=0, f=null;
  try{ while(w && n<10){ f=probe(w); if(f) return f; var p=null; try{ p=w.parent; }catch(e){ break; } if(!p||p===w) break; w=p; n++; } }catch(e){}
  try{ var o=window.opener; n=0; while(o && !o.closed && n<10){ f=probe(o); if(f) return f; var q=null; try{ q=o.parent; }catch(e){ break; } if(!q||q===o) break; o=q; n++; } }catch(e){}
  return null;
}
function ensureAPI(){ if(api) return true; var f=findAPI(); if(f){ api=f.a; apiType=f.t; return true; } return false; }
function lget(k){ try{ var v=(apiType==="2004")?api.GetValue(k):api.LMSGetValue(k); return (v===undefined||v===null||v===false)?"":String(v); }catch(e){ return ""; } }
function lset(k,v){ try{ var r=apiType==="2004"?api.SetValue(k,v):api.LMSSetValue(k,v); return String(r)!=="false"; }catch(e){ return false; } }
function lcommit(){ try{ var r=apiType==="2004"?api.Commit(""):api.LMSCommit(""); return String(r)!=="false"; }catch(e){ return false; } }
function lmsAlreadyDone(){
  if(apiType==="2004"){ var c=lget("cmi.completion_status"), s=lget("cmi.success_status"); return c==="completed"||s==="passed"; }
  var l=lget("cmi.core.lesson_status"); return l==="completed"||l==="passed";
}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    var str=serialise();
    try{ localStorage.setItem(KEY,str); }catch(e){}
    try{ if(ensureAPI() && str.length<3800){ lset("cmi.suspend_data",str); lcommit(); } }catch(e){}
  },250);
}
function loadSaved(){
  var str="";
  try{ if(ensureAPI()) str=lget("cmi.suspend_data"); }catch(e){}
  var s=str?restore(str):null;
  if(!s){ try{ s=restore(localStorage.getItem(KEY)||""); }catch(e){ s=null; } }
  if(s) state=s;
  try{ completionSent = localStorage.getItem(KEY+"_done")==="1"; }catch(e){}
}
function activityCompleted(){
  if(completionSent) return true;
  var ok=true;
  if(ensureAPI()){
    if(!lmsAlreadyDone()){
      var set = apiType==="2004" ? lset("cmi.completion_status","completed") : lset("cmi.core.lesson_status","completed");
      var com = lcommit();
      var back = apiType==="2004" ? lget("cmi.completion_status") : lget("cmi.core.lesson_status");
      ok = set && com && (back===""||back==="completed");
    }
  }
  try{ localStorage.setItem(KEY+"_done","1"); }catch(e){}
  if(ok){ completionSent=true; console.log("W13D3 Review Improve Retry completed"); }
  return ok;
}

/* ================= RECORDER (optional, local only) ================= */
var recorders=[];
function Recorder(root){
  var stream=null, mr=null, chunks=[], url=null, valid=false, audio=null;
  var bRec=root.querySelector("[data-act=rec]"), bStop=root.querySelector("[data-act=stop]"), bPlay=root.querySelector("[data-act=play]"), bAgain=root.querySelector("[data-act=again]"), st=root.querySelector(".rec-status");
  function set(key, busy){
    st.setAttribute("data-i18n",key); st.textContent=t(key);
    bRec.disabled = !!busy || valid || key==="rec_recording";
    bStop.disabled = key!=="rec_recording";
    bPlay.disabled = !valid;
    bAgain.disabled = !(valid || key==="rec_empty" || key==="rec_fail" || key==="rec_denied" || key==="rec_nodevice");
  }
  function release(){ if(stream){ try{ stream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){} stream=null; } }
  function revoke(){ if(url){ try{ URL.revokeObjectURL(url); }catch(e){} url=null; } if(audio){ try{ audio.pause(); }catch(e){} audio=null; } }
  function start(){
    revoke(); valid=false;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof window.MediaRecorder==="undefined"){ set("rec_unsupported"); return; }
    set("rec_requesting", true);
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream=s; chunks=[];
      try{ mr=new MediaRecorder(s); }catch(e){ release(); set("rec_fail"); return; }
      mr.ondataavailable=function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mr.onerror=function(){ release(); valid=false; set("rec_fail"); };
      mr.onstop=function(){
        release();
        var blob=new Blob(chunks,{type:(mr&&mr.mimeType)||"audio/webm"});
        if(!blob.size){ valid=false; set("rec_empty"); say(t("rec_empty")); return; }
        url=URL.createObjectURL(blob); valid=true; set("rec_ready"); say(t("rec_ready"));
      };
      try{ mr.start(); set("rec_recording"); say(t("rec_recording")); }catch(e){ release(); set("rec_fail"); }
    }).catch(function(err){
      var n=err&&err.name;
      set(n==="NotAllowedError"||n==="SecurityError"?"rec_denied": (n==="NotFoundError"||n==="OverconstrainedError"||n==="DevicesNotFoundError")?"rec_nodevice":"rec_fail");
    });
  }
  function stop(){ try{ if(mr && mr.state==="recording") mr.stop(); }catch(e){ release(); set("rec_fail"); } }
  function play(){
    if(!valid||!url) return;
    try{
      if(audio){ audio.pause(); }
      audio=new Audio(url);
      audio.onended=function(){ set("rec_ready"); };
      var pr=audio.play(); set("rec_playing");
      if(pr && pr.catch) pr.catch(function(){ set("rec_playfail"); });
    }catch(e){ set("rec_playfail"); }
  }
  function again(){ revoke(); valid=false; start(); }
  bRec.addEventListener("click",start); bStop.addEventListener("click",stop); bPlay.addEventListener("click",play); bAgain.addEventListener("click",again);
  var api_={ halt:function(){ try{ if(mr && mr.state==="recording") mr.stop(); }catch(e){} release(); if(audio){ try{audio.pause();}catch(e){} } },
             reset:function(){ api_.halt(); revoke(); valid=false; set("rec_idle"); },
             destroy:function(){ api_.halt(); revoke(); } };
  set("rec_idle");
  recorders.push(api_);
  return api_;
}
function haltRecorders(){ recorders.forEach(function(r){ r.halt(); }); }
window.addEventListener("pagehide",function(){ recorders.forEach(function(r){ r.destroy(); }); });
window.addEventListener("beforeunload",function(){ recorders.forEach(function(r){ r.destroy(); }); });

      h("button",{type:"button",class:"btn ghost small","data-act":"stop","data-i18n":"rec_stop"}),
      h("button",{type:"button",class:"btn ghost small","data-act":"play","data-i18n":"rec_play"}),
      h("button",{type:"button",class:"btn ghost small","data-act":"again","data-i18n":"rec_again"})
    ]),
    h("p",{class:"rec-status",role:"status","aria-live":"polite"})
  ]);
  var tickSet=h("fieldset",{},[ h("legend",{"data-i18n":"tick_legend"}) ]);
  CK_KEYS.forEach(function(k){
    var cb=h("input",{type:"checkbox",id:P0+"-tk-"+k,"data-k":k});
    cb.addEventListener("change",function(){ resp.ticks[k]=cb.checked; onChange("speak"); });
    tickSet.appendChild(h("label",{class:"choice",for:P0+"-tk-"+k},[cb,h("span",{"data-i18n":"ck_"+k})]));
  });
  var spoken=h("input",{type:"checkbox",id:P0+"-spoken"});
  spoken.addEventListener("change",function(){ resp.spoken=spoken.checked; onChange("speak"); });
  var speakPanel=h("div",{class:"panel",id:P0+"-speak",hidden:true},[
    recRoot, tickSet,
    h("label",{class:"choice",for:P0+"-spoken"},[spoken,h("span",{"data-i18n":"spoken_confirm"})])
  ]);
  var fb=h("p",{class:"fb",id:P0+"-fb",role:"status"});
  function radio(val,key){
    var r=h("input",{type:"radio",name:"route-"+P0,value:val});
    r.addEventListener("change",function(){
      if(r.checked){ resp.route=val; showRoute(); onChange(val); }
    });
    return h("label",{class:"choice"},[r,h("span",{"data-i18n":key})]);
  }
  var rt=radio("text","route_text"), rs=radio("speak","route_speak");
  var routeSet=h("fieldset",{},[ h("legend",{"data-i18n":"route_legend"}), rt, rs ]);
  host.appendChild(routeSet); host.appendChild(textPanel); host.appendChild(speakPanel); host.appendChild(fb);
  var rec=Recorder(recRoot);
  ta.addEventListener("input",function(){ resp.text=ta.value; onChange("text"); });
  function showRoute(){
    textPanel.hidden = resp.route!=="text"; speakPanel.hidden = resp.route!=="speak";
    if(resp.route!=="speak") rec.halt();
    rt.querySelector("input").checked = resp.route==="text"; rs.querySelector("input").checked = resp.route==="speak";
  }
  function sync(){
    ta.value=resp.text||"";
    CK_KEYS.forEach(function(k){ $(P0+"-tk-"+k).checked=!!resp.ticks[k]; });
    spoken.checked=!!resp.spoken;
    showRoute();
  }
  tryUI[P0]={sync:sync, fb:fb, rec:rec, ta:ta};
  sync();
}

/* ================= SCREEN 2 ITEMS ================= */
var ITEMS=[
  {id:"u",type:"sel",task:"t1",img:"understand",alt:"alt_u",exp:"understand",ok:"fb_u",ans:"fba_u",hints:["h_u1","h_u2"]},
  {id:"ins",type:"sel",task:"t1",img:"instructions",alt:"alt_ins",exp:"instructions",ok:"fb_ins",ans:"fba_ins",hints:["h_ins1","h_ins2"]},
  {id:"ex",type:"sel",task:"t1",img:"example",alt:"alt_ex",exp:"example",ok:"fb_ex",ans:"fba_ex",hints:["h_ex1","h_ex2"]},
  {id:"b1",type:"txt",task:"t2",pre:"Could you",post:"it again?",exp:/^(explain|repeat)$/,ok:"fb_b1",ans:"fba_b1",hints:["h_b11","h_b12"]},
  {id:"b2",type:"txt",task:"t2",pre:"Could you give me an",post:"?",exp:/^example$/,ok:"fb_b2",ans:"fba_b2",hints:["h_b21","h_b22"]},
  {id:"b3",type:"txt",task:"t2",pre:"Where should I",post:"my answer?",exp:/^submit$/,ok:"fb_b3",ans:"fba_b3",hints:["h_b31","h_b32"]},
  {id:"r1",type:"rad",task:"t3",sit:"sit_r1",opts:[P.time,P.w,P.sub],exp:P.w,ok:"fb_r1",ans:"fba_r1",hints:["h_r11","h_r12"]},
  {id:"r2",type:"rad",task:"t3",sit:"sit_r2",opts:[P.rep,P.time,P.w],exp:P.time,ok:"fb_r2",ans:"fba_r2",hints:["h_r21","h_r22"]}
];
var SEL_WORDS=["understand","explain","example","repeat","question","instructions"];
function evalItem(it,val){
  if(it.type==="txt") return it.exp.test(normAns(val));
  return val===it.exp;
}
function itemFeedback(it, fb){
  var rc=state.rec[it.id];
  if(!rc||!rc.tries){ clearFb(fb); return; }
  if(evalItem(it,rc.val)) setFb(fb,it.ok,"ok");
  else if(rc.tries>=2) setFb(fb,it.ans,"help");
  else setFb(fb,"fb_no","help");
}
function answered(it,val){
  var rc=state.rec[it.id]||(state.rec[it.id]={val:"",tries:0});
  rc.val=val; rc.tries=Math.min(9,rc.tries+1);
  save(); updateGates();
}
function buildItems(){
  ["t1","t2","t3"].forEach(function(id){ var c=$(id); while(c.children.length>1) c.removeChild(c.lastChild); });
  ITEMS.forEach(function(it){
    var host=$(it.task);
    var fb=h("p",{class:"fb",role:"status","aria-live":"polite"});
    var hintBox=h("div",{});
    var level=0;
    var hintBtn=h("button",{type:"button",class:"btn ghost small","data-i18n":"hint_btn",on:{click:function(){
      if(level>=2) return;
      var k=it.hints[level]; level++;
      hintBox.appendChild(h("p",{class:"hint","data-i18n":k,text:t(k)}));
      state.hint++; save();
      if(level>=2) hintBtn.disabled=true; else hintBtn.setAttribute("data-i18n","hint_more");
      applyLang();
    }}});
    var body, control;
    var rc=state.rec[it.id];
    if(it.type==="sel"){
      var sel=h("select",{id:"i-"+it.id,"aria-labelledby":"lbl-"+it.id},[ h("option",{value:"","data-i18n":"choose"}) ]);
      SEL_WORDS.forEach(function(w){ sel.appendChild(h("option",{value:w,"data-w":w,"data-gl":WORDS[w]})); });
      if(rc&&rc.val) sel.value=rc.val;
      sel.addEventListener("change",function(){ if(!sel.value){ return; } answered(it,sel.value); itemFeedback(it,fb); applyLang(); });
      body=h("div",{class:"body"},[ h("p",{id:"lbl-"+it.id,style:"margin:0 0 8px;font-weight:700","data-i18n":"pick_word"}), sel, fb, hintBox, h("div",{class:"actions",style:"margin-top:8px"},[hintBtn]) ]);
      host.appendChild(h("div",{class:"item"},[ h("img",{src:IMG[it.img],alt:t(it.alt),"data-alt":it.alt}), body ]));
    } else if(it.type==="txt"){
      var inp=h("input",{type:"text",id:"i-"+it.id,autocomplete:"off",autocapitalize:"off",spellcheck:"false","aria-label":it.pre+" … "+it.post});
      if(rc&&rc.val) inp.value=rc.val;
      var chk=h("button",{type:"button",class:"btn small","data-i18n":"check",on:{click:function(){ if(!inp.value.trim()) return; answered(it,inp.value); itemFeedback(it,fb); applyLang(); }}});
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); chk.click(); } });
      body=h("div",{class:"body"},[ h("div",{class:"line"},[ h("span",{text:it.pre}), inp, h("span",{text:it.post}), chk ]), fb, hintBox, h("div",{class:"actions",style:"margin-top:8px"},[hintBtn]) ]);
      host.appendChild(h("div",{class:"item"},[ body ]));
    } else {
      var fs=h("fieldset",{},[ h("legend",{"data-i18n":it.sit}) ]);
      it.opts.forEach(function(o){
        var r=h("input",{type:"radio",name:"i-"+it.id,value:o});
        if(rc&&rc.val===o) r.checked=true;
        r.addEventListener("change",function(){ if(r.checked){ answered(it,o); itemFeedback(it,fb); applyLang(); } });
        fs.appendChild(h("label",{class:"choice"},[ r, h("span",{},[ h("span",{text:o}), h("span",{class:"gloss",lang:"fr",text:GL[o]}) ]) ]));
      });
      body=h("div",{class:"body"},[ fs, fb, hintBox, h("div",{class:"actions",style:"margin-top:8px"},[hintBtn]) ]);
      host.appendChild(h("div",{class:"item"},[ body ]));
    }
    itemFeedback(it,fb);
  });
}
S("pick_word","Which word is this?","Quel est ce mot ?");

/* ================= SCREEN 4 / 5 / 6 RENDER ================= */
function respPanel(r, host){
  if(r.route==="speak"){
    host.appendChild(h("p",{class:"quote","data-i18n":"spoken_note"}));
  } else {
    host.appendChild(h("p",{class:"quote",text:r.text}));
  }
}
function checkList(c, host, keys){
  var ul=h("ul",{class:"checklist"});
  (keys||CORE).forEach(function(k){
    ul.appendChild(h("li",{},[ h("span",{class:"mk","aria-hidden":"true",text:c[k]?"✓":"–"}), h("span",{"data-i18n":"ck_"+k}), h("span",{class:"sr-only","data-i18n":c[k]?"included":"notyet",text:" "}) ]));
  });
  host.appendChild(ul);
}
function renderS4(){
  var host=$("s4body"); host.textContent="";
  if(!respValid(state.first)) return;
  var c=checksOf(state.first);
  var c1=h("div",{class:"card cream"},[ h("h3",{"data-i18n":"your_first"}) ]);
  respPanel(state.first,c1);
  host.appendChild(c1);
  var good=h("div",{class:"card green"},[ h("h3",{"data-i18n":"good_h"}) ]);
  var gk=CK_KEYS.filter(function(k){ return c[k]; });
  if(gk.length){ checkList(c,good,gk); } else { good.appendChild(h("p",{style:"margin:0","data-i18n":"good_none"})); }
  host.appendChild(good);
  var opts=focusOptions(c);
  var fs=h("fieldset",{class:"card yellow",id:"focusSet"},[ h("legend",{"data-i18n":"improve_h"}) ]);
  if(opts[0]==="own"||c.problem&&c.request&&c.nextstep&&c.polite){ fs.appendChild(h("p",{"data-i18n":"all_good"})); }
  opts.forEach(function(k){
    var cb=h("input",{type:"checkbox",value:k,id:"fo-"+k});
    cb.checked = state.focus.indexOf(k)>-1;
    cb.addEventListener("change",function(){
      state.focus = opts.filter(function(o){ return $("fo-"+o).checked; });
      revalidate(); save(); updateGates(); updateSecondFb();
    });
    fs.appendChild(h("label",{class:"choice",for:"fo-"+k},[ cb, h("span",{},[ h("strong",{"data-i18n":"f_"+k}), h("br"), h("span",{"data-i18n":"fh_"+k}) ]) ]));
  });
  host.appendChild(fs);
  var bank=h("div",{class:"card"},[ h("h3",{"data-i18n":"bank_h"}) ]);
  var ul=h("ul",{class:"bank"});
  [P.q,P.ins,P.w,P.ex,P.exp,P.rep,P.sub,P.next,P.time,P.thanks].forEach(function(ph){
    ul.appendChild(h("li",{},[ h("span",{text:ph}), h("span",{class:"gloss",lang:"fr",text:GL[ph]}) ]));
  });
  bank.appendChild(ul);
  host.appendChild(bank);
  var modelBox=h("div",{class:"card yellow",hidden:true},[ h("p",{style:"margin:0 0 6px",text:I.model_txt[0]}), h("p",{class:"help",style:"margin:0","data-i18n":"model_note"}) ]);
  var mBtn=h("button",{type:"button",class:"btn ghost","aria-expanded":"false","data-i18n":"show_ex",on:{click:function(){
    var open=modelBox.hidden; modelBox.hidden=!open; mBtn.setAttribute("aria-expanded",open?"true":"false");
    mBtn.setAttribute("data-i18n",open?"hide_ex":"show_ex"); if(open){ state.model++; save(); } applyLang();
  }}});
  host.appendChild(h("div",{class:"actions",style:"margin:0 0 12px"},[mBtn]));
  host.appendChild(modelBox);
  applyLang();
}
function renderS5(){
  var f=$("s5first"); f.textContent="";
  f.appendChild(h("h3",{"data-i18n":"first_ro"}));
  respPanel(state.first,f);
  var fo=$("s5focus"); fo.textContent="";
  fo.appendChild(h("p",{style:"margin:0 0 6px;font-weight:700","data-i18n":"you_chose"}));
  var ul=h("ul",{class:"bank"});
  state.focus.forEach(function(k){
    var li=h("li",{},[ h("strong",{"data-i18n":"f_"+k}) ]);
    if(FOCUS_PHRASE[k]){ li.appendChild(document.createTextNode(" — ")); li.appendChild(h("span",{text:FOCUS_PHRASE[k]})); li.appendChild(h("span",{class:"gloss",lang:"fr",text:GL[FOCUS_PHRASE[k]]})); }
    ul.appendChild(li);
  });
  fo.appendChild(ul);
  tryUI.b.sync();
  updateSecondFb();
  applyLang();
}
function updateSecondFb(){
  if(!tryUI.b) return;
  var fb=tryUI.b.fb, r=state.second;
  if(current!==4){ return; }
  if(r.route==="speak"){
    if(!r.spoken||!CK_KEYS.some(function(k){return r.ticks[k];})){ setFb(fb,"sec_spoken","help"); return; }
  } else if(words(r.text)<3){ setFb(fb,"sec_short","help"); return; }
  else if(state.first.route==="text" && norm(r.text)===norm(state.first.text)){ setFb(fb,"sec_same","help"); return; }
  if(secondValid()){ setFb(fb,"sec_ok","ok"); return; }
  var k=state.focus.filter(function(x){ return x!=="own"; })[0];
  if(k){
    fb.className="fb help-fb"; fb.setAttribute("data-i18n","sec_focus"); fb.textContent=t("sec_focus")+" "+FOCUS_PHRASE[k];
    if(lang==="fr") fb.setAttribute("lang","fr"); else fb.removeAttribute("lang");
    fb.setAttribute("data-phrase",FOCUS_PHRASE[k]);
  } else { setFb(fb,"sec_focus_own","help"); }
}
function renderS6(){
  var host=$("s6body"); host.textContent="";
  var c1=checksOf(state.first), c2=checksOf(state.second);
  var wrap=h("div",{class:"two"});
  [["first_t",state.first,c1],["second_t",state.second,c2]].forEach(function(x){
    var card=h("div",{class:"card"},[ h("h3",{"data-i18n":x[0]}) ]);
    respPanel(x[1],card);
    var ul=h("ul",{class:"checklist"});
    CORE.forEach(function(k){
      ul.appendChild(h("li",{},[ h("span",{class:"mk","aria-hidden":"true",text:x[2][k]?"✓":"–"}), h("span",{"data-i18n":"ck_"+k}), h("span",{class:"sr-only"},[" — ", h("span",{"data-i18n":x[2][k]?"included":"notyet"})]) ]));
    });
    card.appendChild(ul);
    wrap.appendChild(card);
  });
  host.appendChild(wrap);
  var newly=CK_KEYS.filter(function(k){ return !c1[k] && c2[k]; });
  var sum=$("summary"); sum.textContent="";
  if(newly.length){
    sum.appendChild(h("p",{style:"margin:0 0 6px;font-weight:700","data-i18n":"sum_pre"}));
    var ul2=h("ul",{class:"bank",style:"margin:0"});
    newly.forEach(function(k){ ul2.appendChild(h("li",{"data-i18n":"sm_"+k})); });
    sum.appendChild(ul2);
  } else { sum.appendChild(h("p",{style:"margin:0","data-i18n":"sum_changed"})); }
  document.querySelectorAll("input[name=imp]").forEach(function(cb){ cb.checked = state.imp.indexOf(cb.value)>-1; });
  applyLang();
}

/* ================= NAVIGATION & GATES ================= */
var NAMES=["s1","s2","s3","s4","s5","s6","s7"];
function updateGates(){
  var attempted=ITEMS.every(function(it){ return recAttempted(it.id); });
  var firstOk=respValid(state.first);
  $("b1").disabled=!state.goal; $("h1").hidden=!!state.goal;
  $("b2").disabled=!attempted; $("h2").hidden=attempted;
  $("b3").disabled=!firstOk; $("h3").hidden=firstOk;
  if(tryUI.a){ if(firstOk) setFb(tryUI.a.fb,"first_ok","ok"); else clearFb(tryUI.a.fb); }
  var f=state.focus.length>0 && focusStillValid();
  $("b4").disabled=!f; $("h4").hidden=f;
  var sv=secondValid();
  $("b5").disabled=!sv; $("h5").hidden=sv;
  var imp=state.imp.length>0 && sv;
  $("b6").disabled=!imp; $("h6").hidden=imp;
  doneBtn.disabled = !(current===6 && allValid());
}
function go(n){
  haltRecorders();
  current=n;
  NAMES.forEach(function(id,i){ $(id).hidden = i!==n; });
  if(n===3) renderS4();
  if(n===4) renderS5();
  if(n===5) renderS6();
  applyLang(); updateGates();
  var hd=$("h-"+NAMES[n]); hd.focus({preventScroll:true});
  window.scrollTo(0,0);
  say(hd.textContent);
}
function onFirstChange(){
  state.focus=[]; state.imp=[]; revalidate(); save(); updateGates();
}
function onSecondChange(){
  state.imp=[]; revalidate(); save(); updateGates(); updateSecondFb();
}

/* ================= WIRING ================= */
function syncGoal(){
  document.querySelectorAll("input[name=goal]").forEach(function(r){ r.checked = r.value===state.goal; });
  var fb=$("goalFb");
  if(state.goal==="g1") setFb(fb,"g_ok","ok"); else if(state.goal) setFb(fb,"g_other","help"); else clearFb(fb);
}
function syncAll(){
  syncGoal();
  buildItems();
  var a=$("tryA"), b=$("tryB");
  recorders.forEach(function(r){ r.destroy(); }); recorders=[]; tryUI={};
  a.textContent=""; b.textContent="";
  buildTry("a",a,state.first,onFirstChange);
  buildTry("b",b,state.second,onSecondChange);
  document.querySelectorAll("input[name=imp]").forEach(function(cb){ cb.checked=state.imp.indexOf(cb.value)>-1; });
  applyLang();
}
document.querySelectorAll("input[name=goal]").forEach(function(r){
  r.addEventListener("change",function(){ if(r.checked){ state.goal=r.value; syncGoal(); applyLang(); save(); updateGates(); } });
});
document.querySelectorAll("input[name=imp]").forEach(function(cb){
  cb.addEventListener("change",function(){
    state.imp=Array.prototype.slice.call(document.querySelectorAll("input[name=imp]:checked")).map(function(x){ return x.value; });
    save(); updateGates();
  });
});
$("b1").addEventListener("click",function(){ if(state.goal) go(1); });
$("b2").addEventListener("click",function(){ go(2); });
$("b3").addEventListener("click",function(){ if(respValid(state.first)) go(3); });
$("b4").addEventListener("click",function(){ if(state.focus.length) go(4); });
$("b5").addEventListener("click",function(){ if(secondValid()) go(5); });
$("b6").addEventListener("click",function(){ if(state.imp.length) go(6); });
$("copyBtn").addEventListener("click",function(){
  state.second.route="text"; state.second.text=state.first.route==="text"?state.first.text:"";
  tryUI.b.sync(); onSecondChange(); tryUI.b.ta.focus();
});
$("langBtn").addEventListener("click",function(){
  lang = lang==="fr" ? "en" : "fr";
  applyLang();
  if(current===3) renderS4();
  if(current===4) renderS5();
  if(current===5) renderS6();
  syncGoal(); if(tryUI.a && respValid(state.first)) setFb(tryUI.a.fb,"first_ok","ok");
  applyLang();
  say(lang==="fr"?"Français":"English");
});
function showDone(){
  var fb=$("doneFb"); setFb(fb,"done_fb","ok");
  doneBtn.setAttribute("data-i18n","done_ok");
  doneBtn.classList.add("ok");
  doneBtn.setAttribute("data-suffix"," ✓");
  doneBtn.textContent=t("done_ok")+" ✓";
}
doneBtn.addEventListener("click",function(){
  if(doneBtn.disabled) return;
  activityCompleted();
  showDone();
  say(t("done_fb"));
});
$("tryAgainBtn").addEventListener("click",function(){
  haltRecorders();
  state=defaultState();
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ if(ensureAPI()){ lset("cmi.suspend_data",""); lcommit(); } }catch(e){}
  doneBtn.classList.remove("ok");
  doneBtn.setAttribute("data-i18n","done");
  doneBtn.removeAttribute("data-suffix");
  doneBtn.textContent=t("done");
  clearFb($("doneFb"));
  doneBtn.disabled=true;
  syncAll();
  go(0);
});

/* ================= INIT ================= */
loadSaved();
syncAll();
current=0;
NAMES.forEach(function(id,i){ $(id).hidden = i!==0; });
applyLang();
updateGates();
})();
</script>
