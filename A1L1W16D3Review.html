<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress review and next learning steps — Review, Improve and Retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --line:#767674;
  --white:#FFFFFF;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  background:var(--pazapa-grey-light);
  color:var(--pazapa-grey-dark);
  line-height:1.55;
  font-size:1rem;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;margin:0;}
.app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
header.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 20px;border-bottom:4px solid var(--pazapa-blue);
}
.brand{font-size:.85rem;font-weight:700;margin:0;}
.brand span{font-weight:400;}
main{padding:22px 20px 40px;flex:1;}
.screen{display:none;}
.screen.active{display:block;}
.screen-title{font-size:1.45rem;margin:0 0 8px;}
.screen-title:focus{outline:none;}
.lead{margin:0 0 18px;font-size:1.02rem;}
button,select,textarea,input{font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);}
button{touch-action:manipulation;cursor:pointer;}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.choice:focus-within{
  outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 5px var(--white);
}
.btn{
  min-height:48px;min-width:48px;padding:12px 24px;border-radius:12px;font-weight:700;
  border:2px solid var(--pazapa-grey-dark);
}
.btn-primary{background:var(--pazapa-blue);}
.btn-primary:hover:not(:disabled){background:#2fa9c2;}
.btn-secondary{background:var(--white);}
.btn-secondary:hover:not(:disabled){background:var(--blue-tint);}
.btn:disabled{background:var(--pazapa-grey-light);color:#595957;border-color:#9a9a98;cursor:not-allowed;}
.btn-small{padding:8px 16px;font-weight:600;}
.lang-btn{min-height:48px;padding:8px 16px;border-radius:12px;border:2px solid var(--pazapa-grey-dark);background:var(--white);font-weight:600;}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center;}
.card{background:var(--blue-tint);border-radius:var(--radius);padding:16px;margin:0 0 16px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.plain{background:var(--white);border:2px solid var(--pazapa-grey-light);}
.card h3{font-size:1.05rem;margin-bottom:10px;}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin-bottom:8px;}
.choice-list{display:flex;flex-direction:column;gap:10px;}
.choice{
  display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border-radius:12px;
  border:2px solid var(--line);background:var(--white);cursor:pointer;
}
.choice input{width:24px;height:24px;flex:none;margin:0;accent-color:#1f6f80;}
.choice.selected{border-color:var(--pazapa-grey-dark);background:var(--blue-tint);font-weight:600;}
.choice.disabled{opacity:.6;cursor:not-allowed;}
.tag{display:inline-block;background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:10px;margin-left:8px;}
.feedback{margin:8px 0 0;font-size:.95rem;min-height:1.3em;}
.dot{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  margin-right:8px;font-weight:800;font-size:.8rem;vertical-align:middle;color:var(--pazapa-grey-dark);
}
.dot.ok{background:var(--pazapa-green);}
.dot.warn{background:var(--pazapa-yellow);}
.dot.info{background:var(--pazapa-blue);}
select.sel{min-height:48px;border-radius:10px;border:2px solid var(--line);padding:6px 10px;background:var(--white);max-width:100%;}
textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:12px;padding:12px;resize:vertical;line-height:1.5;}
.readonly{background:var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;min-height:48px;}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.row .pic{width:56px;height:75px;object-fit:contain;border-radius:8px;background:#FDF3E7;flex:none;}
.row .word{font-weight:700;min-width:96px;}
.row .gloss{font-weight:400;font-size:.88rem;display:block;}
.hint-box{margin-top:10px;}
.hint-list{margin:10px 0 0;padding:0;list-style:none;}
.hint-list li{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);padding:8px 12px;border-radius:8px;margin-bottom:8px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
.chip{min-height:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--line);background:var(--white);text-align:left;}
.chip small{display:block;font-size:.8rem;}
.hero{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:0 0 18px;}
.hero figure{margin:0;background:var(--blue-tint);border-radius:var(--radius);padding:10px;text-align:center;}
.hero figure.after{background:var(--green-tint);}
.hero img{width:100%;max-width:150px;height:200px;object-fit:contain;}
.hero figcaption{font-weight:700;margin-top:4px;}
.hero .arrow{font-size:2rem;font-weight:700;}
.compare{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;}
@media (min-width:700px){.compare{grid-template-columns:1fr 1fr;}}
.compare .pane{border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;}
.compare .before{background:var(--blue-tint);}
.compare .after{background:var(--green-tint);}
.compare img{width:56px;height:75px;object-fit:contain;}
.pane-head{display:flex;gap:10px;align-items:center;}
.pane-head h3{font-size:1.05rem;}
.pane p{margin:0;white-space:pre-wrap;word-wrap:break-word;background:var(--white);border-radius:10px;padding:10px 12px;}
.rec-box{border:2px dashed var(--line);border-radius:12px;padding:12px;margin:12px 0;}
.rec-status{min-height:1.4em;margin:8px 0 0;font-size:.92rem;}
.model{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:8px;padding:12px;margin:10px 0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.finish{background:var(--green-tint);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.finish p{margin:0 0 8px;}
.finish .big{font-size:1.3rem;font-weight:700;}
.note{font-size:.88rem;margin:6px 0 0;}
.build-preview{background:var(--white);border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:10px 12px;min-height:48px;}
.hidden{display:none !important;}
@media (max-width:520px){
  .hero{grid-template-columns:1fr;}
  .hero .arrow{transform:rotate(90deg);justify-self:center;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="brand">Pazapa English Programme for Adults <span>· Week 16 · Lesson 3</span></p>
    <button type="button" class="lang-btn" id="langBtn">Voir en français</button>
  </header>

  <main id="main">

    <!-- SCREEN 1 -->
    <section class="screen active" id="screen1" data-screen="1" aria-labelledby="h1">
      <h2 class="screen-title" id="h1" tabindex="-1" data-i18n="s1.h">Look back</h2>
      <div class="hero" aria-hidden="false">
        <figure><img id="heroBefore" alt="A woman holding two recording cards at a table"><figcaption data-i18n="hero.before">Beginning</figcaption></figure>
        <div class="arrow" aria-hidden="true">→</div>
        <figure class="after"><img id="heroAfter" alt="A woman ticking boxes on a wall calendar"><figcaption data-i18n="hero.after">Now</figcaption></figure>
      </div>
      <p class="lead" data-i18n="s1.welcome"></p>
      <fieldset>
        <legend data-i18n="s1.lead"></legend>
        <div class="choice-list" id="goalChoices"></div>
      </fieldset>
      <p class="feedback" id="fb1" aria-live="polite"></p>
      <p data-i18n="s1.how"></p>
      <div class="actions"><button type="button" class="btn btn-primary" id="startBtn" data-i18n="btn.start" disabled>Start my review</button></div>
    </section>

    <!-- SCREEN 2 -->
    <section class="screen" id="screen2" data-screen="2" aria-labelledby="h2">
      <h2 class="screen-title" id="h2" tabindex="-1" data-i18n="s2.h">Quick recall</h2>
      <p class="lead" data-i18n="s2.lead"></p>
      <div id="recallBox"></div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="continue2" data-i18n="btn.continue" disabled>Continue</button>
        <button type="button" class="btn btn-secondary" id="retry2" data-i18n="btn.tryagain">Try again</button>
      </div>
    </section>

    <!-- SCREEN 3 -->
    <section class="screen" id="screen3" data-screen="3" aria-labelledby="h3">
      <h2 class="screen-title" id="h3" tabindex="-1" data-i18n="s3.h">First try</h2>
      <div class="card">
        <p style="margin:0 0 8px" data-i18n="s3.situation"></p>
        <p style="margin:0 0 8px"><strong data-i18n="s3.purpose"></strong></p>
        <p style="margin:0" data-i18n="s3.fiction"></p>
      </div>
      <fieldset>
        <legend data-i18n="s3.route"></legend>
        <div class="choice-list" id="routeChoices"></div>
      </fieldset>
      <div id="typePanel">
        <label for="firstText" style="font-weight:700;display:block;margin-bottom:6px" data-i18n="s3.typeLabel"></label>
        <textarea id="firstText" maxlength="400" lang="en-GB"></textarea>
      </div>
      <div id="buildPanel" class="hidden">
        <div id="buildRows"></div>
        <p style="font-weight:700;margin:6px 0" data-i18n="s3.preview"></p>
        <div class="build-preview" id="buildPreview" lang="en-GB"></div>
      </div>
      <div class="rec-box" id="rec1">
        <p style="margin:0 0 8px;font-weight:700" data-i18n="s3.rec"></p>
        <div class="row" style="margin-bottom:0">
          <button type="button" class="btn btn-secondary btn-small" data-rec="record" data-i18n="rec.record">Record</button>
          <button type="button" class="btn btn-secondary btn-small" data-rec="stop" data-i18n="rec.stop" disabled>Stop</button>
          <button type="button" class="btn btn-secondary btn-small" data-rec="play" data-i18n="rec.play" disabled>Hear my recording</button>
          <button type="button" class="btn btn-secondary btn-small" data-rec="again" data-i18n="btn.tryagain" disabled>Try again</button>
        </div>
        <p class="rec-status" data-rec="status" aria-live="polite"></p>
      </div>
      <p class="feedback" id="fb3" aria-live="polite"></p>
      <div class="actions"><button type="button" class="btn btn-primary" id="review3" data-i18n="btn.review1" disabled>Review my first try</button></div>
    </section>

    <!-- SCREEN 4 -->
    <section class="screen" id="screen4" data-screen="4" aria-labelledby="h4">
      <h2 class="screen-title" id="h4" tabindex="-1" data-i18n="s4.h">Before and after</h2>
      <div class="card">
        <h3 data-i18n="s4.before"></h3>
        <div class="readonly" id="firstView" lang="en-GB"></div>
        <p class="note" data-i18n="s4.keep"></p>
      </div>
      <div class="card green">
        <h3 data-i18n="s4.works"></h3>
        <ul id="worksList" style="margin:0;padding-left:20px"></ul>
      </div>
      <fieldset>
        <legend data-i18n="s4.choose"></legend>
        <div class="choice-list" id="focusChoices"></div>
      </fieldset>
      <div class="hint-box">
        <button type="button" class="btn btn-secondary btn-small" id="hint4" data-i18n="hint.btn">Need a hint?</button>
        <ul class="hint-list" id="hint4List" aria-live="polite"></ul>
      </div>
      <div class="card yellow" style="margin-top:14px">
        <h3 data-i18n="s4.bank"></h3>
        <ul id="bankList" style="margin:0;padding-left:20px" lang="en-GB"></ul>
      </div>
      <button type="button" class="btn btn-secondary btn-small" id="exampleBtn" aria-expanded="false" data-i18n="s4.example">Show an example</button>
      <div class="model hidden" id="exampleBox">
        <p style="margin:0 0 6px" lang="en-GB" id="exampleText"></p>
        <p class="note" data-i18n="s4.exampleNote"></p>
      </div>
      <div class="actions"><button type="button" class="btn btn-primary" id="make5" data-i18n="btn.second" disabled>Make my second try</button></div>
    </section>

    <!-- SCREEN 5 -->
    <section class="screen" id="screen5" data-screen="5" aria-labelledby="h5">
      <h2 class="screen-title" id="h5" tabindex="-1" data-i18n="s5.h">Second try</h2>
      <p class="lead" data-i18n="s5.lead"></p>
      <div class="card">
        <h3 data-i18n="s5.first"></h3>
        <div class="readonly" id="firstView5" lang="en-GB"></div>
      </div>
      <div class="chips" id="chips5" role="group" aria-labelledby="chipsLabel" lang="en-GB"></div>
      <p id="chipsLabel" class="sr-only" data-i18n="s5.add"></p>
      <label for="secondText" style="font-weight:700;display:block;margin-bottom:6px" data-i18n="s5.second"></label>
      <textarea id="secondText" maxlength="400" lang="en-GB"></textarea>
      <div class="row" style="margin-top:10px"><button type="button" class="btn btn-secondary btn-small" id="copyFirst" data-i18n="s5.copy">Copy my first try to edit</button></div>
      <p class="feedback" id="fb5" aria-live="polite"></p>
      <div class="rec-box" id="rec2">
        <p style="margin:0 0 8px;font-weight:700" data-i18n="s5.rec"></p>
        <div class="row" style="margin-bottom:0">
          <button type="button" class="btn btn-secondary btn-small" data-rec="record" data-i18n="rec.record">Record</button>
          <button type="button" class="btn btn-secondary btn-small" data-rec="stop" data-i18n="rec.stop" disabled>Stop</button>
          <button type="button" class="btn btn-secondary btn-small" data-rec="play" data-i18n="rec.play" disabled>Hear my recording</button>
          <button type="button" class="btn btn-secondary btn-small" data-rec="again" data-i18n="btn.tryagain" disabled>Try again</button>
        </div>
        <p class="rec-status" data-rec="status" aria-live="polite"></p>
        <label class="choice" style="margin-top:10px"><input type="checkbox" id="spokenChk"><span data-i18n="s5.spoken"></span></label>
      </div>
      <div class="actions"><button type="button" class="btn btn-primary" id="compare5" data-i18n="btn.compare" disabled>Compare my tries</button></div>
    </section>

    <!-- SCREEN 6 -->
    <section class="screen" id="screen6" data-screen="6" aria-labelledby="h6">
      <h2 class="screen-title" id="h6" tabindex="-1" data-i18n="s6.h">Notice the progress</h2>
      <div class="compare">
        <div class="pane before">
          <div class="pane-head"><img id="cmpImgB" alt=""><h3 data-i18n="s6.before">Before</h3></div>
          <p id="cmpFirst" lang="en-GB"></p>
        </div>
        <div class="pane after">
          <div class="pane-head"><img id="cmpImgA" alt=""><h3 data-i18n="s6.after">After</h3></div>
          <p id="cmpSecond" lang="en-GB"></p>
        </div>
      </div>
      <fieldset>
        <legend data-i18n="s6.q"></legend>
        <div class="choice-list" id="reflectChoices"></div>
      </fieldset>
      <div class="card green"><p style="margin:0" id="summary" aria-live="polite"></p><p class="note" data-i18n="sum.note"></p></div>
      <div class="actions"><button type="button" class="btn btn-primary" id="finish6" data-i18n="btn.finish" disabled>Finish review</button></div>
    </section>

    <!-- SCREEN 7 -->
    <section class="screen" id="screen7" data-screen="7" aria-labelledby="h7">
      <h2 class="screen-title" id="h7" tabindex="-1" data-i18n="s7.h">Lesson complete</h2>
      <div class="finish">
        <p class="big" data-i18n="s7.done">Review complete.</p>
        <p data-i18n="s7.msg"></p>
      </div>
      <div class="card yellow">
        <h3 data-i18n="s7.week"></h3>
        <p style="margin:0" data-i18n="s7.weekText"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="doneBtn" data-i18n="btn.done">Done</button>
        <button type="button" class="btn btn-secondary" id="retryAll" data-i18n="btn.tryagain">Try again</button>
      </div>
      <p class="feedback" id="doneStatus" aria-live="polite"></p>
    </section>

  </main>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>

/* Meaning parts: PROGRESS (can/could/now/beginning/improved), IMPROVE (want to improve...),

var RX = {
  progress:/\b(i could|i can|now i|at the beginning|at first|i have improved|i improved|more confident|better)\b/,
  improve:/\b(want to improve|need to improve|improve my|need to practi[sc]e|get better at)\b/,
  plan:/\b(i will practi[sc]e|my next goal is|my next step is|next goal|next step|my goal|i will|twice a week|once a week|three times a week|every day|each day|every week)\b/,
  phrase:/\b(at the beginning i could|now i can|i want to improve|my next goal is|i will practi[sc]e|i feel more confident|my next step is)\b/,
  polite:/\b(thank you|thanks|please|kind regards|best wishes)\b/
};
function analyze(text){
  var t=loose(text);
  var progress=RX.progress.test(t), improve=RX.improve.test(t), plan=RX.plan.test(t);
  return {purpose:progress, info:(improve&&plan), phrase:RX.phrase.test(t), polite:RX.polite.test(t)};
}

    lmsSet(lms,key,"completed");
    lmsCommit(lms);
    var back=lmsGet(lms,key);

      completionSent=true;try{localStorage.setItem(KEY_DONE,"1");}catch(e){}

    }
  }catch(e){}

  return false;
}

/* ---------- Optional recording (local only) ---------- */
function createRecorder(root){
  var bRec=root.querySelector('[data-rec="record"]'),bStop=root.querySelector('[data-rec="stop"]'),
      bPlay=root.querySelector('[data-rec="play"]'),bAgain=root.querySelector('[data-rec="again"]'),
      status=root.querySelector('[data-rec="status"]');
  var stream=null,mr=null,chunks=[],url=null,hasAudio=false,player=null,statusKey="",mime="";
  var supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  function setStatus(key){statusKey=key;status.textContent=key?T(key):"";}
  function buttons(recording){
    bRec.disabled=recording||hasAudio;
    bStop.disabled=!recording;
    bPlay.disabled=!hasAudio||recording;
    bAgain.disabled=recording||!hasAudio;
  }
  function releaseStream(){
    if(stream){try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){}stream=null;}
  }
  function revoke(){
    if(player){try{player.pause();}catch(e){}player=null;}
    if(url){try{URL.revokeObjectURL(url);}catch(e){}url=null;}
  }
  function pickMime(){
    var cands=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
    for(var i=0;i<cands.length;i++){try{if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(cands[i]))return cands[i];}catch(e){}}
    return "";
  }
  async function start(){
    if(!supported){setStatus("rec.unsupported");buttons(false);return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      stream=null;
      var n=e&&e.name;
      if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError")setStatus("rec.denied");
      else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError")setStatus("rec.missing");
      else setStatus("rec.fail");
      buttons(false);return;
    }
    try{
      mime=pickMime();
      mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
      chunks=[];
      mr.ondataavailable=function(ev){if(ev.data&&ev.data.size>0)chunks.push(ev.data);};
      mr.onerror=function(){releaseStream();setStatus("rec.fail");hasAudio=false;buttons(false);};
      mr.onstop=finish;
      mr.start();
      setStatus("rec.recording");buttons(true);
      announce(T("rec.recording"));
    }catch(e){
      releaseStream();mr=null;setStatus("rec.fail");buttons(false);
    }
  }
  function finish(){
    releaseStream();
    var blob=null;
    try{blob=new Blob(chunks,{type:(mr&&mr.mimeType)||mime||"audio/webm"});}catch(e){blob=null;}
    chunks=[];
    if(!blob||blob.size<200){hasAudio=false;revoke();setStatus("rec.empty");buttons(false);return;}
    revoke();
    url=URL.createObjectURL(blob);
    hasAudio=true;
    setStatus("rec.ready");buttons(false);
    if(root.id==="rec2"&&!state.second.spoken){
      state.second.spoken=true;$("spokenChk").checked=true;
      state.compared=false;state.reflect=[];refreshGates();save();
    }
  }
  function stop(){
    if(mr&&mr.state!=="inactive"){try{mr.stop();setStatus("rec.stopped");}catch(e){releaseStream();setStatus("rec.fail");buttons(false);}}
    else{releaseStream();buttons(false);}
  }
  function play(){
    if(!hasAudio||!url)return;
    if(player){try{player.pause();}catch(e){}}
    player=new Audio(url);
    setStatus("rec.playing");
    player.onended=function(){setStatus("rec.ready");};
    player.onerror=function(){setStatus("rec.fail");};
    var pr=player.play();
    if(pr&&pr.catch)pr.catch(function(){setStatus("rec.fail");});
  }
  function again(){
    revoke();hasAudio=false;chunks=[];setStatus("");buttons(false);
    if(root.id==="rec2"){state.second.spoken=false;$("spokenChk").checked=false;state.compared=false;state.reflect=[];refreshGates();save();}
  }
  function reset(){
    try{if(mr&&mr.state!=="inactive"){mr.onstop=null;mr.stop();}}catch(e){}
    releaseStream();revoke();hasAudio=false;chunks=[];mr=null;setStatus("");buttons(false);
  }
  bRec.addEventListener("click",function(){start();});
  bStop.addEventListener("click",stop);
  bPlay.addEventListener("click",play);
  bAgain.addEventListener("click",again);
  buttons(false);
  return {reset:reset,destroy:function(){reset();},refreshText:function(){status.textContent=statusKey?T(statusKey):"";}};
}
recorders.r1=createRecorder($("rec1"));
recorders.r2=createRecorder($("rec2"));
window.addEventListener("pagehide",function(){Object.keys(recorders).forEach(function(k){recorders[k].destroy();});});
window.addEventListener("beforeunload",function(){Object.keys(recorders).forEach(function(k){recorders[k].destroy();});});

/* ---------- Init ---------- */
(function init(){
  $("heroBefore").src=IMG.beginning;$("heroBefore").alt=ALT.beginning;
  $("heroAfter").src=IMG.now;$("heroAfter").alt=ALT.now;
  try{completionSent=(localStorage.getItem(KEY_DONE)==="1");}catch(e){completionSent=false;}
  var saved=load();
  if(saved){
    state=saved;lang=state.lang;
    if(state.goal)sel1="a";
    $("firstText").value=state.first.text;
    $("secondText").value=state.second.text;
  }
  applyLang();
  /* revalidate restored progress against current rules */
  var target=saved?Math.min(state.screen,reach()):1;
  /* after restore, a screen past 6 needs a valid comparison and reflection */
  current=target;
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
  $("screen"+target).classList.add("active");
  renderScreen(target);
  refreshGates();
})();
})();
</script>
