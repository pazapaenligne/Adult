<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparing accommodation — Listening Mission</title>
<style>
  :root{
    --blue:#36BBD6;
    --blue-tint:#EAF9FC;
    --green:#C9D646;
    --green-tint:#F5FAE3;
    --yellow:#FCC104;
    --yellow-tint:#FFF6DA;
    --red:#E6352B;
    --grey:#EBEBEB;
    --dark:#2E2E2D;
    --muted:#5A5A58;
    --white:#FFFFFF;
    --cream:#FEFCF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button,[role="button"],summary{touch-action:manipulation;}
  body{
    font-family:"Open Sans",Arial,sans-serif;
    background:var(--grey);
    color:var(--dark);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Filson Soft","Open Sans",Arial,sans-serif;
    font-weight:800;
    margin:0 0 12px 0;
    color:var(--dark);
    line-height:1.25;
  }
  h1{font-size:1.7rem;}
  h2{font-size:1.4rem;}
  h3{font-size:1.1rem;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }
  :focus-visible{outline:3px solid var(--dark); outline-offset:2px;}
  .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
  header.topbar{
    background:var(--blue);
    color:var(--dark);
    padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .lesson-tag{font-size:0.9rem;font-weight:700;}
  .top-right{display:flex;align-items:center;gap:10px;}
  .logo-wrap{background:var(--white);border-radius:8px;padding:4px 10px;display:flex;align-items:center;}
  .logo-wrap img{height:26px;width:auto;display:block;}
  .fr-toggle{
    font-family:inherit;font-size:0.95rem;font-weight:700;
    min-height:48px;min-width:48px;padding:8px 16px;
    border-radius:10px;border:2px solid var(--dark);
    background:var(--white);color:var(--dark);cursor:pointer;
  }
  .fr-toggle[aria-pressed="true"]{background:var(--yellow);}
  .progress-region{padding:14px 20px 8px;background:var(--white);border-bottom:1px solid var(--grey);}
  .progress-label{font-size:0.9rem;font-weight:700;margin-bottom:6px;}
  .progress-track{height:10px;background:var(--grey);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .3s ease;width:0;}
  main{flex:1;padding:22px 20px 30px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .eyebrow{font-weight:700;font-size:0.9rem;margin:0 0 4px;color:var(--muted);}
  .hero-image{width:100%;max-width:380px;display:block;margin:0 auto 16px;border-radius:12px;height:auto;}
  .instructions{background:var(--blue-tint);border:1px solid #CDEFF5;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:1.05rem;font-weight:600;}
  .note{background:var(--yellow-tint);border:1px solid #F5E4B0;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:0.95rem;}
  .fr{display:none;font-style:italic;font-weight:400;color:var(--muted);font-size:0.92em;}
  body.fr-on .fr{display:block;}
  body.fr-on .fr.inline{display:inline;}
  button .fr{color:inherit;font-size:0.82em;}

  /* audio player */
  .player{background:var(--cream);border:2px solid var(--grey);border-radius:12px;padding:12px 14px;margin:0 0 14px;}
  .player-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .player-status{font-size:0.9rem;color:var(--muted);margin-top:8px;}
  .btn{
    font-family:inherit;font-size:1rem;font-weight:700;border-radius:10px;padding:10px 22px;
    border:2px solid transparent;cursor:pointer;min-height:48px;min-width:48px;line-height:1.2;
  }
  .btn-primary{background:var(--blue);color:var(--dark);}
  .btn-primary:hover:not(:disabled){background:#2AA9C4;}
  .btn-ghost{background:var(--white);color:var(--dark);border-color:var(--dark);}
  .btn-ghost:hover:not(:disabled){background:var(--grey);}
  .btn-help{background:var(--yellow);color:var(--dark);}
  .btn-done{background:var(--green);color:var(--dark);}
  .btn:disabled{background:var(--grey);color:#6B6B69;border-color:transparent;cursor:not-allowed;}
  .btn .fr{margin-top:2px;}

  /* transcript */
  details.transcript{background:#FFF9E8;border:1px solid #F5E4B0;border-radius:12px;padding:0;margin:0 0 16px;}
  details.transcript summary{cursor:pointer;font-weight:700;padding:12px 16px;min-height:48px;display:flex;flex-direction:column;justify-content:center;}
  .transcript-body{padding:0 16px 14px;}
  .transcript-body p{margin:0 0 8px;}
  .speaker{font-weight:700;}

  /* choices */
  fieldset{border:0;margin:0;padding:0;min-width:0;}
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:0 0 14px;}
  .tile{
    background:var(--white);border:2px solid var(--grey);border-radius:12px;padding:10px;text-align:center;
    cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;color:var(--dark);min-height:48px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .tile:hover:not(:disabled){border-color:var(--blue);}
  .tile:disabled{opacity:0.6;cursor:not-allowed;}
  .tile .pic{width:100%;aspect-ratio:3/4;background:var(--cream);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .tile .pic img,.tile .pic svg{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block;}
  .tile.small .pic{aspect-ratio:4/5;max-width:140px;}
  .tile[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--blue);}
  .tile.ok{border-color:var(--green);background:var(--green-tint);box-shadow:inset 0 0 0 2px var(--green);}
  .tile .mark{display:none;font-size:0.9rem;}
  .tile[aria-pressed="true"] .mark{display:inline;}
  .q{border:1px solid var(--grey);border-radius:12px;padding:14px;margin:0 0 14px;}
  .q-top{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .q-top img{width:84px;aspect-ratio:3/4;object-fit:contain;background:var(--cream);border-radius:8px;flex:0 0 auto;}
  .q-title{font-weight:700;font-size:1.05rem;margin:0;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    background:var(--white);border:2px solid var(--grey);border-radius:10px;padding:12px 16px;text-align:left;cursor:pointer;
    font-family:inherit;font-size:1.02rem;color:var(--dark);min-height:48px;
  }
  .opt:hover:not(:disabled){border-color:var(--blue);}
  .opt:disabled{opacity:0.6;cursor:not-allowed;}
  .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--blue);font-weight:700;}
  .opt.ok{border-color:var(--green);background:var(--green-tint);box-shadow:inset 0 0 0 2px var(--green);}

  /* ordering */
  ol.order{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:12px;}
  ol.order li{
    display:flex;gap:12px;align-items:center;background:var(--white);border:2px solid var(--grey);border-radius:12px;padding:10px 12px;
  }
  ol.order li.sel{border-color:var(--blue);background:var(--blue-tint);}
  ol.order li.ok{border-color:var(--green);background:var(--green-tint);}
  ol.order li.drag-over{border-style:dashed;border-color:var(--dark);}
  ol.order li.dragging{opacity:0.5;}
  ol.order img{width:64px;aspect-ratio:3/4;object-fit:contain;background:var(--cream);border-radius:8px;flex:0 0 auto;}
  .grip{font-size:1.4rem;color:var(--muted);cursor:grab;user-select:none;flex:0 0 auto;width:20px;text-align:center;}
  .order-text{flex:1;font-weight:600;}
  .order-text .pos{display:block;font-size:0.85rem;color:var(--muted);font-weight:700;}
  .move-btns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .move-btns .btn{padding:6px 12px;font-size:0.9rem;min-height:48px;}

  /* feedback + actions */
  .feedback{margin:0 0 12px;padding:10px 14px;border-radius:8px;font-weight:700;display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:var(--green-tint);border:1px solid var(--green);}
  .feedback.retry{background:var(--yellow-tint);border:1px solid var(--yellow);}
  .feedback.shown{background:var(--blue-tint);border:1px solid var(--blue);}
  .feedback .fr{font-weight:400;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;}
  .good .dot{background:var(--green);}
  .retry .dot{background:var(--yellow);}
  .shown .dot{background:var(--blue);}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;margin-top:20px;}
  .actions .btn-primary.next{margin-left:auto;}
  .final-card{text-align:center;padding:22px 8px;}
  .final-card .hero-image{max-width:300px;}
  .final-card .actions{justify-content:center;}
  .big-check{width:70px;height:70px;margin:0 auto 14px;display:block;}
  .step-continuity{font-size:1rem;color:var(--muted);margin:6px 0 14px;}
  footer.mission-footer{text-align:center;padding:12px;font-size:0.8rem;color:var(--muted);}
  .sr-only,#live-region{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media (max-width:480px){
    main{padding:18px 16px 26px;}
    .tile-grid{grid-template-columns:repeat(2,1fr);}
    .actions .btn{flex:1 1 140px;}
    .actions .btn-primary.next{margin-left:0;}
  }
</style>
</head>

/* ===================== LMS (silent; no learner-facing messages) ===================== */
function findAPI(win, name){
  var n=0;
  while(win && n<12){
    try{ if(win[name]) return win[name]; }catch(e){}
    try{ if(win.parent && win.parent!==win){ win = win.parent; } else { break; } }catch(e){ break; }
    n++;
  }
  return null;
}
function discoverAPI(){
  var found = {v12:null,v2004:null}, w, wins=[window];
  try{ if(window.opener) wins.push(window.opener); }catch(e){}
  for(var i=0;i<wins.length;i++){
    w = wins[i];
    if(!found.v2004) found.v2004 = findAPI(w,"API_1484_11");
    if(!found.v12) found.v12 = findAPI(w,"API");
  }
  return found;
}
function activityCompleted(){
  if(completionSent || state.lmsDone) return;
  var api = discoverAPI();
  if(!api.v2004 && !api.v12){ return; }   // no LMS yet: progress stays in localStorage, retried after later interaction
  completionSent = true;
  var sent = false;
  try{
    if(api.v2004){
      api.v2004.Initialize("");
      var cs = api.v2004.GetValue("cmi.completion_status");
      if(cs!=="completed"){ api.v2004.SetValue("cmi.completion_status","completed"); api.v2004.Commit(""); }
      sent = true;
    } else if(api.v12){
      api.v12.LMSInitialize("");
      var ls = api.v12.LMSGetValue("cmi.core.lesson_status");
      if(ls!=="completed" && ls!=="passed"){ api.v12.LMSSetValue("cmi.core.lesson_status","completed"); api.v12.LMSCommit(""); }
      sent = true;
    }
  }catch(e){ try{ console.error("LMS completion error", e); }catch(x){} }
  if(sent){ state.lmsDone = true; save(); try{ console.log("W10D2 Listening Mission completed"); }catch(e){} }
  else { completionSent = false; }
}

var audio = null, audioScreen = null, isPlaying = false;
function stopAudio(){
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  if(audio){ try{ audio.pause(); audio.currentTime = 0; }catch(e){} }
  isPlaying = false; syncPlayers();
}
function playAudio(id, restart){
  if(!hasAudio) return;
  if(!audio){
    audio = new Audio(); audio.preload = "auto"; audio.src = AUDIO_FILES.main;
    audio.addEventListener("ended", function(){
      isPlaying=false; if(audioScreen){ played[audioScreen]=true; applyScreen(audioScreen); }
      syncPlayers(TXT.stEnd);
    });
    audio.addEventListener("pause", function(){ if(!audio.ended){ isPlaying=false; syncPlayers(TXT.stPause); } });
    audio.addEventListener("play", function(){ isPlaying=true; syncPlayers(TXT.stPlay); });
    audio.addEventListener("error", function(){ isPlaying=false; try{ console.error("Audio loading error", audio.error&&audio.error.code); }catch(e){}
      // never trap the learner: if the recording cannot load, unlock the tasks and show the script
      IDS.forEach(function(k){ played[k]=true; }); var tr=$$("details.transcript"); tr.forEach(function(d){ d.open=true; });
      IDS.forEach(function(k){ applyScreen(k); }); syncPlayers(TXT.audioErr); });
  }
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  if(audioScreen!==id){ try{ audio.pause(); audio.currentTime=0; }catch(e){} }
  audioScreen = id;
  if(restart){ try{ audio.currentTime = 0; }catch(e){} }
  var p = audio.play();
  if(p && typeof p.catch==="function"){ p.catch(function(err){ isPlaying=false; try{ console.error("Audio playback failed", err); }catch(e){} syncPlayers(TXT.audioErr); }); }
}
function togglePlay(id){
  if(isPlaying && audioScreen===id){ audio.pause(); return; }
  playAudio(id,false);
}
function syncPlayers(msg){
  $$(".player").forEach(function(p){
    var id = p.getAttribute("data-for");
    var btn = $(".play-btn",p);
    var on = hasAudio && isPlaying && audioScreen===id;
    btn.setAttribute("aria-pressed", on ? "true":"false");
    btn.innerHTML = bi(on ? TXT.pause : TXT.play);
    btn.setAttribute("aria-label", on ? "Pause audio" : "Play audio");
    var st = $(".player-status",p);
    if(!hasAudio){ st.innerHTML = bi(TXT.noAudio); }
    else if(audioScreen===id && msg){ st.innerHTML = bi(msg); }
    else if(!(audioScreen===id)){ st.innerHTML = bi(played[id] ? TXT.stEnd : TXT.listenFirst); }
  });
}

function initOrder(){
  var saved = state.st.s4.sel;
  var ids = CONTENT.s4.items.map(function(i){ return i.id; });
  if(saved && saved.length===3){ order4 = saved.slice(); }
  else { do{ order4 = shuffle(ids); }while(same(order4, ANSWERS.s4)); state.st.s4.sel = order4.slice(); }
  renderOrder();
}
function itemById(id){ return CONTENT.s4.items.filter(function(i){ return i.id===id; })[0]; }
function renderOrder(focusId, focusDir){
  var ol = document.getElementById("order-list");
  var st = state.st.s4;
  var ok = (st.status==="ok"||st.status==="shown");
  ol.innerHTML = order4.map(function(id,idx){
    var it = itemById(id);
    return '<li draggable="true" data-id="'+id+'" class="'+(selectedCard===id?'sel ':'')+(ok?'ok':'')+'">'+
      '<span class="grip" aria-hidden="true">⋮⋮</span>'+

      '<span class="move-btns">'+
        '<button type="button" class="btn btn-ghost mv-up" aria-label="Move up: '+esc(it.en)+'"'+(idx===0?' disabled':'')+'>▲ '+bi(TXT.up)+'</button>'+
        '<button type="button" class="btn btn-ghost mv-down" aria-label="Move down: '+esc(it.en)+'"'+(idx===2?' disabled':'')+'>▼ '+bi(TXT.down)+'</button>'+
      '</span></li>';
  }).join("");

    var li = $('li[data-id="'+focusId+'"]',ol);
    if(li){
      var b = $(focusDir==="up"?".mv-up":".mv-down",li);
      if(b && !b.disabled){ b.focus(); } else { var o = $(focusDir==="up"?".mv-down":".mv-up",li); if(o && !o.disabled) o.focus(); }
    }
  }
  var fs = $("#s4 fieldset.choices");

function moveCard(id,dir){
  if(needPlay("s4")) return;
  var i = order4.indexOf(id), j = dir==="up" ? i-1 : i+1;
  if(i<0 || j<0 || j>2) return;
  var t = order4[i]; order4[i]=order4[j]; order4[j]=t;
  selectedCard = id;
  edited("s4", order4.slice());
  renderOrder(id,dir);
  announce("Card moved to position "+(j+1)+" of 3.");
}
function needPlay(id){ return hasAudio && !played[id]; }

function edited(id, sel){
  var st = state.st[id];
  st.sel = sel;
  if(st.status==="ok" || st.status==="shown" || st.status==="wrong"){ st.status = "new"; }
  save(); applyScreen(id);
}

function isComplete(id){
  var st = state.st[id];
  if(id==="s1") return !!st.sel;
  if(id==="s2") return st.sel.length>0;
  if(id==="s3") return CONTENT.s3.qs.every(function(q){ return st.sel[q.id]; });
  return true;
}
function isCorrect(id){
  var st = state.st[id];
  if(id==="s1") return st.sel===ANSWERS.s1;
  if(id==="s2"){ var a = ANSWERS.s2.slice().sort(), b = st.sel.slice().sort(); return same(a,b); }
  if(id==="s3") return CONTENT.s3.qs.every(function(q){ return st.sel[q.id]===ANSWERS.s3[q.id]; });
  return same(st.sel, ANSWERS.s4);
}
function setFeedback(root, kind, pair){
  var fb = $(".feedback",root);
  if(!kind){ fb.className="feedback"; fb.innerHTML=""; return; }
  fb.className = "feedback show "+kind;
  fb.innerHTML = '<span class="dot" aria-hidden="true"></span>'+bi(pair);
}
function applyScreen(id){
  var root = document.getElementById(id), st = state.st[id], c = CONTENT[id];
  if(!root) return;
  var locked = needPlay(id);
  var good = (st.status==="ok" || st.status==="shown");
  // selections
  if(id==="s1"||id==="s2"){
    $$(".tile",root).forEach(function(t){
      var on = id==="s1" ? st.sel===t.getAttribute("data-id") : st.sel.indexOf(t.getAttribute("data-id"))>-1;
      t.setAttribute("aria-pressed", on?"true":"false");
      t.classList.toggle("ok", good && on);
    });
  }
  if(id==="s3"){
    $$(".opt",root).forEach(function(o){
      var on = st.sel[o.getAttribute("data-q")]===o.getAttribute("data-id");
      o.setAttribute("aria-pressed", on?"true":"false");
      o.classList.toggle("ok", good && on);
    });
  }
  if(id==="s4"){
    $$("#order-list li").forEach(function(li){ li.classList.toggle("ok", good); });
  }
  var fs = $("fieldset.choices",root); if(fs) fs.disabled = locked;
  var check = $(".check-btn",root), next = $(".next-btn",root), show = $(".show-btn",root);
  check.disabled = locked || !isComplete(id);
  next.disabled = !good;
  show.hidden = !(st.att>=2 && !good);
  // feedback
  if(locked){ setFeedback(root,"retry",TXT.listenFirst); }
  else if(st.status==="ok"){ setFeedback(root,"good",TXT.good); }
  else if(st.status==="shown"){ setFeedback(root,"shown",TXT.shown); }
  else if(st.status==="wrong"){ setFeedback(root,"retry",c.hint||TXT.retryGeneric); }
  else { setFeedback(root,null); }
  syncPlayers();
}
function check(id){
  var st = state.st[id], root = document.getElementById(id);
  if(!isComplete(id)){ setFeedback(root,"retry", id==="s3"?TXT.chooseAll:TXT.choose); return; }
  if(isCorrect(id)){ st.status="ok"; announce("Correct."); }
  else { st.status="wrong"; st.att++; announce("Not yet. Try again."); }
  save(); applyScreen(id);
}
function showMe(id){
  var st = state.st[id];
  if(id==="s1") st.sel = ANSWERS.s1;
  if(id==="s2") st.sel = ANSWERS.s2.slice();
  if(id==="s3") st.sel = JSON.parse(JSON.stringify(ANSWERS.s3));
  if(id==="s4"){ order4 = ANSWERS.s4.slice(); st.sel = order4.slice(); renderOrder(); }
  st.status = "shown"; save(); applyScreen(id); announce("Answer shown.");
}
function tryAgain(id){
  var st = state.st[id];
  st.att = 0; st.status = "new";
  if(id==="s1"){ st.sel=null; reshuffle("#s1 .tile-grid"," .tile"); }
  if(id==="s2"){ st.sel=[]; reshuffle("#s2 .tile-grid"); }
  if(id==="s3"){ st.sel={}; $$("#s3 .options").forEach(function(box){ var bs=$$(".opt",box); shuffle(bs).forEach(function(b){ box.appendChild(b); }); }); }
  if(id==="s4"){ var ids = CONTENT.s4.items.map(function(i){return i.id;}); do{ order4 = shuffle(ids); }while(same(order4, ANSWERS.s4)); st.sel = order4.slice(); selectedCard=null; renderOrder(); }
  save(); applyScreen(id);
}
function reshuffle(sel){
  var box = $(sel); if(!box) return;
  shuffle($$(".tile",box)).forEach(function(t){ box.appendChild(t); });
}

/* ===================== NAVIGATION ===================== */
var labels = ["Listen for the situation","Listen for key words","Listen for details","Put the message in order","Completion"];
function showScreen(n, focus){
  stopAudio();
  state.screen = n; save();
  $$(".screen").forEach(function(s,i){ s.classList.toggle("active", i===n); });
  document.getElementById("progress-label").textContent = "Screen "+(n+1)+" of 5 — "+labels[n];
  var pct = Math.round(n/4*100);
  document.getElementById("progress-fill").style.width = pct+"%";
  document.getElementById("progress-outer").setAttribute("aria-valuenow", pct);
  if(n<4){ applyScreen(IDS[n]); }
  if(n===4){ updateDone(); }
  if(focus!==false){
    var h = $(".screen.active h1, .screen.active h2");
    if(h){ h.setAttribute("tabindex","-1"); h.focus(); }
    window.scrollTo({top:0, behavior: reduced()?"auto":"smooth"});
  }
}
function allDone(){ return IDS.every(function(id){ var s=state.st[id].status; return s==="ok"||s==="shown"; }); }
function updateDone(){
  if(state.completed && allDone()){ doneBtn.disabled = true; doneBtn.innerHTML = bi(TXT.doneOk); return; }
  doneBtn.disabled = !allDone();
  doneBtn.innerHTML = bi(TXT.done);
}
function pressDone(){
  if(!allDone()) return;
  state.completed = true; save();
  activityCompleted();
  doneBtn.disabled = true;
  doneBtn.innerHTML = bi(TXT.doneOk);
  announce("Completed.");
}
function restartAll(){
  stopAudio();
  var keepLms = state.lmsDone;
  state = { screen:0, completed:false, lmsDone:keepLms, st:freshStates() };
  played = { s1:!hasAudio, s2:!hasAudio, s3:!hasAudio, s4:!hasAudio };
  selectedCard = null;
  save();
  build();
  applyFr();
  showScreen(0);
  announce("Activity restarted.");
}

/* ===================== WIRING ===================== */
function wire(){
  IDS.forEach(function(id,i){
    var root = document.getElementById(id);
    $(".play-btn",root).addEventListener("click", function(){ togglePlay(id); });
    $(".restart-btn",root).addEventListener("click", function(){ playAudio(id,true); });
    $(".check-btn",root).addEventListener("click", function(){ check(id); });
    $(".again-btn",root).addEventListener("click", function(){ tryAgain(id); });
    $(".show-btn",root).addEventListener("click", function(){ showMe(id); });
    $(".next-btn",root).addEventListener("click", function(){ showScreen(i+1); });
  });
  // screen 1 single choice
  $$("#s1 .tile").forEach(function(t){ t.addEventListener("click", function(){ if(needPlay("s1")) return; edited("s1", t.getAttribute("data-id")); }); });
  // screen 2 multi
  $$("#s2 .tile").forEach(function(t){ t.addEventListener("click", function(){
    if(needPlay("s2")) return;
    var id = t.getAttribute("data-id"), cur = state.st.s2.sel.slice(), k = cur.indexOf(id);
    if(k>-1) cur.splice(k,1); else cur.push(id);
    edited("s2", cur);
  }); });
  // screen 3
  $$("#s3 .opt").forEach(function(o){ o.addEventListener("click", function(){
    if(needPlay("s3")) return;
    var sel = JSON.parse(JSON.stringify(state.st.s3.sel)); sel[o.getAttribute("data-q")] = o.getAttribute("data-id");
    edited("s3", sel);
  }); });
  // screen 4 (delegated: survives re-render)
  var ol = document.getElementById("order-list"), dragId = null;
  ol.addEventListener("click", function(e){
    var li = e.target.closest("li"); if(!li) return;
    var id = li.getAttribute("data-id");
    if(e.target.closest(".mv-up")){ moveCard(id,"up"); return; }
    if(e.target.closest(".mv-down")){ moveCard(id,"down"); return; }
    selectedCard = id; $$("li",ol).forEach(function(x){ x.classList.toggle("sel", x===li); });
  });
  ol.addEventListener("dragstart", function(e){
    if(needPlay("s4")){ e.preventDefault(); return; }
    var li = e.target.closest("li"); if(!li) return;
    dragId = li.getAttribute("data-id"); li.classList.add("dragging");
    try{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", dragId); }catch(x){}
  });
  ol.addEventListener("dragover", function(e){ if(!dragId) return; e.preventDefault(); var li=e.target.closest("li"); $$("li",ol).forEach(function(x){ x.classList.toggle("drag-over", x===li && li.getAttribute("data-id")!==dragId); }); });
  ol.addEventListener("dragend", function(){ dragId=null; $$("li",ol).forEach(function(x){ x.classList.remove("dragging","drag-over"); }); });
  ol.addEventListener("drop", function(e){
    e.preventDefault();
    var li = e.target.closest("li"); if(!li||!dragId) return;
    var to = order4.indexOf(li.getAttribute("data-id")), from = order4.indexOf(dragId);
    if(from<0||to<0||from===to){ dragId=null; return; }
    order4.splice(to,0,order4.splice(from,1)[0]);
    selectedCard = dragId; dragId=null;
    edited("s4", order4.slice()); renderOrder();
  });
  doneBtn.addEventListener("click", pressDone);
  document.getElementById("again-all-btn").addEventListener("click", restartAll);
}

/* ===================== FRENCH ===================== */
var frOn = false;
function applyFr(){
  document.body.classList.toggle("fr-on", frOn);
  var b = document.getElementById("fr-toggle");
  b.setAttribute("aria-pressed", frOn?"true":"false");
  b.textContent = frOn ? TXT.frLabelOn : TXT.frLabelOff;
  b.setAttribute("aria-label", frOn ? "Hide French translation" : "Show French translation");
}
try{ frOn = localStorage.getItem("pazapa_W10D2_fr")==="1"; }catch(e){}
document.getElementById("fr-toggle").addEventListener("click", function(){
  frOn = !frOn; applyFr();
  try{ localStorage.setItem("pazapa_W10D2_fr", frOn?"1":"0"); }catch(e){}
  announce(frOn ? "French translation on." : "French translation off.");
});

/* ===================== START ===================== */
build();
applyFr();
// restore saved progress
(function(){
  var n = state.screen;
  // never jump past a screen that is not resolved
  for(var i=0;i<Math.min(n,4);i++){ var s=state.st[IDS[i]].status; if(s!=="ok"&&s!=="shown"){ n=i; break; } }
  if(n===4 && !allDone()){ n = 0; }
  // restore selection display for resolved screens
  IDS.forEach(function(id){ applyScreen(id); });
  showScreen(n, false);
})();
// keep trying LMS discovery after later interaction if Done was pressed but no LMS was found yet
document.addEventListener("click", function(){
  if(state.completed && !state.lmsDone){ activityCompleted(); }
});

})();
</script>
