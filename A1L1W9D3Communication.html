<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission — Transport and getting to your destination</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF3C4;
  --white:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Open Sans",Arial,sans-serif;background:var(--white);color:var(--pazapa-grey-dark);line-height:1.5;font-size:1rem;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 8px 0;line-height:1.25;}
h2{font-size:1.45rem;}
h3{font-size:1.08rem;}
.app{max-width:760px;margin:0 auto;padding:14px 16px 40px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--pazapa-blue);padding:8px 0 12px;margin-bottom:16px;}
.brand{font-weight:700;font-size:.95rem;}
.stepchip{background:var(--pazapa-grey-light);border-radius:999px;padding:6px 14px;font-size:.92rem;}
.dots{display:flex;gap:6px;margin:-6px 0 16px;}
.dots span{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
.dots span.done{background:var(--pazapa-blue);}
.dots span.cur{background:var(--pazapa-yellow);}
.screen{outline:none;}
.card{background:var(--blue-tint);border-radius:16px;padding:18px;margin-bottom:14px;}
.card.green{background:var(--green-tint);border:2px solid var(--pazapa-green);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:var(--white);border:2px solid var(--pazapa-blue);}
.lead{font-size:1.08rem;margin:0 0 12px;}
.sub{margin:0 0 12px;}
.pic{display:block;width:100%;max-width:280px;height:auto;max-height:340px;object-fit:contain;margin:0 auto 14px;border-radius:12px;background:#FDF7F2;}
.four{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:1fr;gap:10px;}
.four li{background:var(--white);border:2px solid var(--pazapa-blue);border-radius:12px;padding:10px 14px;}
.four b{display:block;font-size:.85rem;text-transform:none;letter-spacing:.2px;}
.goal{background:var(--green-tint);border:2px solid var(--pazapa-green);border-radius:12px;padding:12px 14px;margin:0 0 12px;}
.tip{background:var(--yellow-tint);border-radius:12px;padding:10px 14px;margin:0 0 12px;}
fieldset{border:2px solid var(--pazapa-blue);border-radius:12px;margin:0 0 14px;padding:10px 14px 12px;background:var(--white);}
legend{font-weight:700;padding:0 6px;}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 8px;border-radius:10px;cursor:pointer;touch-action:manipulation;}
.opt:hover{background:var(--blue-tint);}
.opt input{width:24px;height:24px;flex:none;accent-color:#1B6E7E;margin:0;}
.opt.good{background:var(--green-tint);}
.opt.bad{background:var(--yellow-tint);}
.badge{font-size:.85rem;font-weight:700;margin-left:auto;padding-left:8px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border:2px solid var(--pazapa-blue);border-radius:999px;background:var(--white);cursor:pointer;touch-action:manipulation;font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);}
.chip input{position:absolute;opacity:0;width:1px;height:1px;}
.chip:has(input:checked){background:var(--pazapa-blue);}
.chip:has(input:focus-visible){outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
button.chip:hover{background:var(--blue-tint);}
.btn{font-family:inherit;font-weight:700;font-size:1rem;min-height:48px;min-width:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;}
.btn.alt{background:var(--white);}
.btn.help{background:var(--pazapa-yellow);border-color:var(--pazapa-yellow);}
.btn.go{background:var(--pazapa-green);border-color:var(--pazapa-green);}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#5d5d5a;cursor:not-allowed;}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0;align-items:center;}
.row.end{justify-content:flex-end;}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
.status{min-height:24px;font-weight:700;margin:8px 0 0;}
.status.ok{color:#2E2E2D;}
.chat{display:flex;flex-direction:column;gap:8px;margin:0 0 12px;}
.bubble{border-radius:14px;padding:10px 14px;max-width:92%;}
.bubble.them{background:var(--pazapa-grey-light);align-self:flex-start;}
.bubble.me{background:var(--green-tint);border:2px solid var(--pazapa-green);align-self:flex-end;}
.who{display:block;font-size:.8rem;font-weight:700;}
.reply{display:block;width:100%;text-align:left;font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);background:var(--white);border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px 14px;margin:0 0 8px;min-height:48px;cursor:pointer;touch-action:manipulation;}
.reply:hover{background:var(--blue-tint);}
.reply.wrong{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.tabs{display:flex;gap:8px;margin:0 0 12px;}
.tabs .btn{flex:1;}
.tabs .btn[aria-pressed="true"]{background:var(--pazapa-blue);}
.tabs .btn[aria-pressed="false"]{background:var(--white);}
textarea{width:100%;min-height:120px;font-family:inherit;font-size:1rem;border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px;color:var(--pazapa-grey-dark);resize:vertical;}
.count{font-size:.9rem;margin:4px 0 8px;}
.plan{background:var(--white);border:2px dashed var(--pazapa-blue);border-radius:12px;padding:12px 14px;margin:0 0 12px;}
.checks .opt{align-items:flex-start;}
.checks small{display:block;}
.res li{margin:4px 0;}
.hidden{display:none !important;}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (min-width:600px){.four{grid-template-columns:1fr 1fr;}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Pazapa English Programme for Adults</div>
    <div class="stepchip" id="stepChip">Screen 1 of 6</div>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <main id="stage" class="screen"></main>
  <div id="live" class="sr" role="status" aria-live="polite"></div>
</div>

/* ---------- State (text and choices only; never audio) ---------- */
function fresh(){
  return {v:1,screen:1,sel:[],trayOK:false,
    plan:{open:"",req:[],close:"",dest:"",fare:"",time:""},
    turns:0,text:"",speakAloud:false,mode:"type",
    checks:[false,false,false,false],attempts:0,help:0,checkedSig:"",finished:false};
}
var S = fresh();
var RT = {recorded:false,order:{cards:null,turns:{}},showModel:false,lastResult:null,done:false};

function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}
function $(id){return document.getElementById(id);}
function announce(m){var l=$("live");l.textContent="";setTimeout(function(){l.textContent=m;},30);}

/* ---------- LMS (silent) ---------- */
var LMS = {api:null,ver:null,ready:false,locked:false};
var completionSent = false;

function scanFor(win){
  var n=0;
  while(win && n<12){
    try{
      if(win.API_1484_11){return {api:win.API_1484_11,ver:"2004"};}
      if(win.API){return {api:win.API,ver:"1.2"};}
    }catch(e){}
    try{
      if(win.parent && win.parent!==win){win=win.parent;}else{break;}
    }catch(e2){break;}
    n++;
  }
  return null;
}
function discoverLMS(){
  if(LMS.api){return true;}
  var r=scanFor(window);
  if(!r){try{if(window.opener){r=scanFor(window.opener);}}catch(e){}}
  if(!r){return false;}
  LMS.api=r.api;LMS.ver=r.ver;
  try{
    if(LMS.ver==="2004"){LMS.api.Initialize("");}else{LMS.api.LMSInitialize("");}
  }catch(e){}
  LMS.ready=true;
  return true;
}
function lmsGet(k){try{return LMS.ver==="2004"?LMS.api.GetValue(k):LMS.api.LMSGetValue(k);}catch(e){return "";}}
function lmsSet(k,v){try{return String(LMS.ver==="2004"?LMS.api.SetValue(k,v):LMS.api.LMSSetValue(k,v))==="true";}catch(e){return false;}}
function lmsCommit(){try{return String(LMS.ver==="2004"?LMS.api.Commit(""):LMS.api.LMSCommit(""))==="true";}catch(e){return false;}}
function lmsStatus(){
  if(!LMS.ready){return "";}
  if(LMS.ver==="2004"){
    var c=lmsGet("cmi.completion_status"),s=lmsGet("cmi.success_status");
    return (s==="passed")?"passed":c;
  }
  return lmsGet("cmi.core.lesson_status");
}
function suspendKey(){return LMS.ver==="2004"?"cmi.suspend_data":"cmi.suspend_data";}
function compact(){
  return JSON.stringify({v:1,s:S.screen,a:S.sel,t:S.trayOK?1:0,p:S.plan,n:S.turns,x:S.text,q:S.speakAloud?1:0,m:S.mode,c:S.checks,k:S.attempts,h:S.help,g:S.checkedSig,f:S.finished?1:0});
}
function saveProgress(){
  var data=compact();
  try{localStorage.setItem(STORE_KEY,data);}catch(e){}
  if(!LMS.ready){discoverLMS();}
  if(LMS.ready && data.length<3500){lmsSet(suspendKey(),data);lmsCommit();}
}
function loadProgress(){
  var raw=null;
  if(!LMS.ready){discoverLMS();}
  if(LMS.ready){raw=lmsGet(suspendKey());}
  if(!raw){try{raw=localStorage.getItem(STORE_KEY);}catch(e){}}
  if(!raw||raw.length>8000){return;}
  var o;
  try{o=JSON.parse(raw);}catch(e){return;}
  if(!o||o.v!==1){return;}
  var f=fresh();
  f.screen=Math.max(1,Math.min(6,parseInt(o.s,10)||1));
  f.sel=(o.a||[]).filter(function(x){return CARD_IDS.indexOf(x)>-1;});
  f.trayOK=!!o.t;
  var p=o.p||{};
  f.plan.open=OPENERS.indexOf(p.open)>-1?p.open:"";
  f.plan.close=CLOSERS.indexOf(p.close)>-1?p.close:"";
  f.plan.req=(p.req||[]).filter(function(x){return USEFUL.indexOf(x)>-1;});
  f.plan.dest=DEST.indexOf(p.dest)>-1?p.dest:"";
  f.plan.fare=FARES.indexOf(p.fare)>-1?p.fare:"";
  f.plan.time=TIMES.indexOf(p.time)>-1?p.time:"";
  f.turns=Math.max(0,Math.min(3,parseInt(o.n,10)||0));
  f.text=String(o.x||"").slice(0,MAX_CHARS);
  f.speakAloud=!!o.q;
  f.mode=o.m==="speak"?"speak":"type";
  f.checks=(o.c&&o.c.length===4)?o.c.map(function(b){return !!b;}):[false,false,false,false];
  f.attempts=Math.max(0,Math.min(9,parseInt(o.k,10)||0));
  f.help=Math.max(0,parseInt(o.h,10)||0);
  f.checkedSig=String(o.g||"");
  S=f;
  revalidate();
}
function trayValid(sel){
  if(sel.length<3||sel.length>4){return false;}
  for(var i=0;i<sel.length;i++){if(USEFUL.indexOf(sel[i])<0){return false;}}
  for(var j=0;j<REQUIRED_TRAY.length;j++){if(sel.indexOf(REQUIRED_TRAY[j])<0){return false;}}
  return true;
}
function planValid(){
  var p=S.plan;
  if(!p.open||!p.close||!p.dest||!p.fare||!p.time||!p.req.length){return false;}
  for(var i=0;i<p.req.length;i++){if(S.sel.indexOf(p.req[i])<0){return false;}}
  return true;
}
function producedResponse(){return S.text.trim().length>0||RT.recorded||S.speakAloud;}
function revalidate(){
  S.trayOK=trayValid(S.sel);
  var s=S.screen;
  if(s>=3&&!S.trayOK){s=2;}
  if(s>=4&&!planValid()){s=3;}
  if(s>=5&&!(S.turns>=3&&producedResponse())){s=4;}
  if(s>=6&&!missionReady()){s=5;}
  S.screen=s;
}
function activityCompleted(){
  if(completionSent){return;}
  if(!LMS.ready){discoverLMS();}
  if(LMS.ready){
    var st=lmsStatus();
    if(st==="completed"||st==="passed"){completionSent=true;LMS.locked=true;console.log("W09D3 Communication Mission completed");return;}
    var ok;
    if(LMS.ver==="2004"){ok=lmsSet("cmi.completion_status","completed");}
    else{ok=lmsSet("cmi.core.lesson_status","completed");}
    var c=lmsCommit();
    var v=lmsStatus();
    if((ok&&c)||v==="completed"||v==="passed"){completionSent=true;LMS.locked=true;}
  }else{
    try{localStorage.setItem(STORE_KEY+"_completed","1");}catch(e){}
    completionSent=true;
  }
  console.log("W09D3 Communication Mission completed");
}
window.activityCompleted=activityCompleted;

/* ---------- Text checking (deterministic, documented groups) ---------- */
function norm(s){
  return String(s||"").normalize("NFKC").toLowerCase().replace(/[‘’ʼ`]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"");
}
/* A part is "found" when ANY listed pattern matches. Many wordings are accepted. */
var GROUPS = {
  purpose:[/\btake me\b/,/\bdrive me\b/,/\bgo to\b/,/\bthis address\b/,/\bthe address\b/,/\bhotel\b/,/\bpalm road\b/,/\bmy destination\b/,/\bdestination\b/],
  info:[/\bhow much\b/,/\bfare\b/,/\bjourney\b/,/\briyals?\b/,/\bhow long\b/,/\bminutes?\b/,/\bsuitcase\b/,/\bluggage\b/,/\bstop here\b/,/\bstop\b/],
  lesson:[/take me to this address/,/take me to/,/how much is the journey/,/how much is/,/how long does it take/,/how long/,/stop here/,/help me with my suitcase/,/help me with my/,/right bus/],
  polite:[/\bthank(s| you)?\b/,/\bplease\b/,/\bappreciate\b/]
};
function has(g,t){for(var i=0;i<GROUPS[g].length;i++){if(GROUPS[g][i].test(t)){return true;}}return false;}
function checkText(raw){
  var t=norm(raw);
  return {purpose:has("purpose",t),info:has("info",t),lesson:has("lesson",t),polite:has("polite",t)};
}
function sig(){return norm(S.text);}
function typedReady(){
  if(S.text.trim().length===0){return false;}
  if(S.checkedSig!==sig()){return false;}
  var r=checkText(S.text);
  return (r.purpose&&r.info)||S.attempts>=2;
}
function missionReady(){
  var all=S.checks.every(function(b){return b;});
  if(!all){return false;}
  var produced=RT.recorded||S.speakAloud;
  return produced||typedReady();
}

/* ---------- Recorder ---------- */
var Rec={st:"idle",stream:null,mr:null,chunks:[],url:null,audio:null,token:0,el:{}};
function recMime(){
  if(!window.MediaRecorder||typeof MediaRecorder.isTypeSupported!=="function"){return "";}
  var c=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"];
  for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported(c[i])){return c[i];}}
  return "";
}
function stopTracks(){if(Rec.stream){try{Rec.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}Rec.stream=null;}}
function dropAudio(){
  if(Rec.audio){try{Rec.audio.pause();Rec.audio.removeAttribute("src");Rec.audio.load();}catch(e){}}
  if(Rec.url){try{URL.revokeObjectURL(Rec.url);}catch(e){}Rec.url=null;}
}
function recDiscard(){
  Rec.token++;
  if(Rec.mr&&Rec.mr.state!=="inactive"){try{Rec.mr.stop();}catch(e){}}
  Rec.mr=null;stopTracks();dropAudio();Rec.chunks=[];Rec.st="idle";RT.recorded=false;
}
function recMsg(err){
  var n=err&&err.name?err.name:"";
  if(n==="NotAllowedError"||n==="PermissionDeniedError"||n==="SecurityError"){return "The microphone was not allowed. You can type your message or speak aloud without recording.";}
  if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError"){return "No microphone was found. You can type your message or speak aloud without recording.";}
  if(n==="NotReadableError"||n==="TrackStartError"){return "The microphone could not be used right now. You can type your message or speak aloud without recording.";}
  return "Recording did not work this time. You can try again, type your message, or speak aloud without recording.";
}
function recUI(msg){
  var e=Rec.el;if(!e.rec){return;}
  var recording=Rec.st==="recording",starting=Rec.st==="starting";
  var playing=Rec.audio&&!Rec.audio.paused&&!Rec.audio.ended&&Rec.url;
  e.rec.disabled=recording||starting||!!playing||Rec.unsupported;
  e.stop.disabled=!recording;
  e.hear.disabled=!(RT.recorded&&Rec.url)||recording||starting;
  e.hear.textContent=playing?"Pause recording":"Hear my recording";
  e.again.disabled=!(RT.recorded||recording)||starting;
  e.rec.textContent="Record my voice";
  if(msg){e.status.textContent=msg;announce(msg);}
}
function recStart(){
  if(Rec.st==="starting"||Rec.st==="recording"){return;}
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    Rec.unsupported=true;recUI("Recording is not available in this browser. You can type your message or speak aloud without recording.");return;
  }
  if(Rec.audio){try{Rec.audio.pause();}catch(e){}}
  var tk=++Rec.token;
  Rec.st="starting";recUI("Asking for the microphone…");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(tk!==Rec.token){stream.getTracks().forEach(function(t){t.stop();});return;}
    dropAudio();RT.recorded=false;Rec.chunks=[];Rec.stream=stream;
    var mt=recMime(),mr;
    try{mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);}
    catch(e){stopTracks();Rec.st="idle";recUI(recMsg(e));return;}
    Rec.mr=mr;
    mr.ondataavailable=function(ev){if(tk===Rec.token&&ev.data&&ev.data.size>0){Rec.chunks.push(ev.data);}};
    mr.onerror=function(){if(tk!==Rec.token){return;}stopTracks();Rec.st="idle";Rec.mr=null;recUI("Recording stopped. You can try again, type your message, or speak aloud without recording.");};
    mr.onstop=function(){
      stopTracks();
      if(tk!==Rec.token){return;}
      var type=mr.mimeType||mt||"audio/webm";
      var blob=new Blob(Rec.chunks,{type:type});
      Rec.chunks=[];Rec.mr=null;Rec.st="idle";
      if(!blob.size){RT.recorded=false;recUI("The recording was empty. Please try again, or type your message.");updateReview();return;}
      dropAudio();
      Rec.url=URL.createObjectURL(blob);
      if(!Rec.audio){Rec.audio=new Audio();Rec.audio.onended=function(){recUI();};Rec.audio.onpause=function(){recUI();};Rec.audio.onplay=function(){recUI();};}
      Rec.audio.src=Rec.url;
      RT.recorded=true;
      recUI("Recording stopped. Your recording is ready to hear.");
      updateReview();
    };
    try{mr.start();}catch(e2){stopTracks();Rec.st="idle";recUI(recMsg(e2));return;}
    Rec.st="recording";recUI("Recording. Speak now, then press Stop.");
  }).catch(function(err){
    if(tk!==Rec.token){return;}
    Rec.st="idle";recUI(recMsg(err));
  });
}
function recStop(){
  if(Rec.st!=="recording"||!Rec.mr){return;}
  Rec.st="stopping";
  try{if(Rec.mr.state!=="inactive"){Rec.mr.stop();}}catch(e){stopTracks();Rec.st="idle";}
  recUI();
}
function recHear(){
  if(!RT.recorded||!Rec.url||!Rec.audio||Rec.st==="recording"){return;}
  if(!Rec.audio.paused&&!Rec.audio.ended){Rec.audio.pause();return;}
  var p=Rec.audio.play();if(p&&p.catch){p.catch(function(){recUI("The recording could not be played. Please record again.");});}
  recUI();
}
function recAgain(){
  recDiscard();recUI("Your recording was removed. Press Record my voice to try again.");updateReview();
}
window.addEventListener("pagehide",function(){recDiscard();});

/* ---------- Rendering helpers ---------- */
function setHTML(html){$("stage").innerHTML=html;}
function focusHeading(){var h=document.getElementById("hd");if(h){h.focus();}}
function chrome(){
  $("stepChip").textContent="Screen "+S.screen+" of "+TOTAL;
  var d=$("dots");d.innerHTML="";
  for(var i=1;i<=TOTAL;i++){var s=document.createElement("span");s.className=i<S.screen?"done":(i===S.screen?"cur":"");d.appendChild(s);}
}
function go(n){
  if(Rec.st==="recording"){recStop();}
  S.screen=n;saveProgress();render();focusHeading();window.scrollTo(0,0);
}
function render(){
  chrome();
  [r1,r2,r3,r4,r5,r6][S.screen-1]();
}
function planText(){
  var p=S.plan,out=[];
  if(p.open){out.push(p.open);}
  PLAN_ORDER.forEach(function(id){
    if(p.req.indexOf(id)>-1){out.push(PH[id]);if(id==="take"&&p.dest){out.push("The address is "+p.dest+".");}}
  });
  if(p.close){out.push(p.close);}
  return out.join(" ");
}

          b.classList.add("wrong");
          var m="That does not help here. Choose the reply for your goal.";
          $("st4").textContent=m;announce(m);
        }
      };
    });
  }
  $("try4").onclick=function(){
    S.turns=0;RT.order.turns={};saveProgress();drawTurns();updateReview();
  };
}

/* ---------- Screen 5 ---------- */
var CHECK_ITEMS=[
  ["Clear purpose","I asked the driver to take me to my address."],
  ["Key information","I asked about the fare or the time, or gave one instruction."],
  ["Useful lesson language","I used a phrase from this lesson."],
  ["Polite ending","I said Thank you or Please."]
];
function r5(){
  var h='<section class="card"><h2 id="hd" tabindex="-1">Check your message</h2>'+
  '<p class="lead">Read or hear your message. Does it work for the driver?</p>';
  var hasText=S.text.trim().length>0;
  h+='<div id="p5text"><label for="msg5"><strong>Your typed message</strong></label>'+
  '<textarea id="msg5" maxlength="'+MAX_CHARS+'" aria-describedby="cnt5"></textarea>'+
  '<div class="count" id="cnt5" aria-live="polite"></div>'+
  '<div class="row" style="margin-top:0"><button type="button" class="btn" id="chk5">Check my message</button></div>'+
  '<div id="res5" class="card green hidden" aria-live="polite"></div>'+
  '<div id="bank5" class="card yellow hidden"></div></div>';
  var note=[];
  if(RT.recorded){note.push("You made a recording.");}
  if(S.speakAloud){note.push("You practised speaking aloud.");}
  if(note.length){h+='<p class="tip">'+note.join(" ")+' Use the check below to think about your message.</p>';}
  h+='<fieldset class="checks"><legend>My self-check</legend>';
  CHECK_ITEMS.forEach(function(c,i){
    h+='<label class="opt"><input type="checkbox" data-i="'+i+'"'+(S.checks[i]?' checked':'')+'><span><strong>'+c[0]+'</strong><small>'+c[1]+'</small></span></label>';
  });
  h+='</fieldset><p class="status" id="st5" aria-live="polite"></p>'+
  '<div class="row"><button type="button" class="btn alt" id="try5">Try again</button>'+
  '<button type="button" class="btn go" id="fin5" disabled>Finish mission</button></div></section>';
  setHTML(h);
  var m5=$("msg5");m5.value=S.text;
  function cnt(){$("cnt5").textContent=m5.value.length+" / "+MAX_CHARS+" characters";}
  cnt();
  function fin(){
    $("fin5").disabled=!missionReady();
    var st=$("st5");
    if(missionReady()){st.textContent="Your mission is ready to finish.";}
    else{
      var all=S.checks.every(function(b){return b;});
      if(S.text.trim()&&!typedReady()&&!(RT.recorded||S.speakAloud)){st.textContent="Press Check my message, then tick the four boxes.";}
      else if(!all){st.textContent="Tick the four boxes when each one is true for your message.";}
      else{st.textContent="";}
    }
  }
  m5.oninput=function(){S.text=m5.value;S.checkedSig="";RT.lastResult=null;$("res5").classList.add("hidden");cnt();saveProgress();fin();};
  function showResult(){
    var r=checkText(S.text),box=$("res5");
    var lead,good,next;
    if(!S.text.trim()){box.classList.remove("hidden");box.innerHTML="<p style='margin:0'>Type a message to use the check. Or tick your self-check below if you recorded or spoke aloud.</p>";return;}
    if(r.purpose&&r.info){lead="Your message achieves its purpose. Your request is clear.";}
    else if(r.purpose){lead="Your request is clear.";}
    else{lead="Your message is a good start.";}
    good=r.purpose?"Good: you say where you want to go.":(r.info?"Good: you ask for useful information.":"Good: you wrote a message.");
    var missing=[];
    if(!r.purpose){missing.push("Add where you want to go, for example: Could you take me to this address?");}
    if(!r.info){missing.push("Add the fare or the time so the driver has the full information, for example: How much is the journey?");}
    if(r.purpose&&r.info&&!r.lesson){missing.push("You can use a phrase from this lesson, for example: How long does it take?");}
    if(r.purpose&&r.info&&!r.polite){missing.push("You can add a polite ending, for example: Thank you for your help.");}
    next=missing.length?missing[0]:"Your message has everything the driver needs.";
    box.classList.remove("hidden");
    box.innerHTML="";
    var p1=document.createElement("p");p1.style.margin="0 0 6px";p1.textContent=lead;box.appendChild(p1);
    var p2=document.createElement("p");p2.style.margin="0 0 6px";p2.textContent=good;box.appendChild(p2);
    var ul=document.createElement("ul");ul.className="res";
    [["Purpose",r.purpose],["Key information",r.info],["Lesson language",r.lesson],["Polite ending",r.polite]].forEach(function(x){
      var li=document.createElement("li");li.textContent=x[0]+": "+(x[1]?"found":"not found yet");ul.appendChild(li);
    });
    box.appendChild(ul);
    var p3=document.createElement("p");p3.style.margin="6px 0 0";p3.textContent="Next step: "+next;box.appendChild(p3);
    announce(lead+" "+next);
  }
  function showHelp(){
    var bank=$("bank5");
    if(S.attempts>=2){
      bank.classList.remove("hidden");bank.innerHTML="<h3>Phrase bank</h3>";
      var ul=document.createElement("ul");
      [PH.take,PH.fare,PH.time,PH.stop,"Thank you for your help."].forEach(function(t){var li=document.createElement("li");li.textContent=t;ul.appendChild(li);});
      bank.appendChild(ul);
      if(S.attempts>=3){
        var b=document.createElement("button");b.type="button";b.className="btn help";b.textContent="Show example";
        var ex=document.createElement("p");ex.className="hidden";ex.textContent="Hello. Could you take me to this address? How much is the journey? Thank you for your help.";
        b.onclick=function(){var s=ex.classList.contains("hidden");ex.classList.toggle("hidden",!s);b.textContent=s?"Hide example":"Show example";if(s){S.help++;saveProgress();}};
        bank.appendChild(b);bank.appendChild(ex);
      }
    }else{bank.classList.add("hidden");}
  }
  $("chk5").onclick=function(){
    var r=checkText(S.text);
    S.checkedSig=sig();
    if(S.text.trim()&&!(r.purpose&&r.info)){S.attempts=Math.min(9,S.attempts+1);}
    showResult();showHelp();saveProgress();fin();
  };
  document.querySelectorAll('.checks input').forEach(function(c){c.onchange=function(){S.checks[parseInt(c.getAttribute("data-i"),10)]=c.checked;saveProgress();fin();};});
  $("try5").onclick=function(){
    S.checks=[false,false,false,false];S.checkedSig="";S.attempts=0;RT.lastResult=null;saveProgress();r5();focusHeading();
  };
  $("fin5").onclick=function(){if(missionReady()){S.finished=true;go(6);}};
  if(S.checkedSig&&S.checkedSig===sig()){showResult();showHelp();}
  fin();
}

/* ---------- Screen 6 ---------- */
function r6(){
  setHTML(
  '<section class="card green">'+
  '<h2 id="hd" tabindex="-1">Communication Mission complete.</h2>'+
  '<img class="pic" src="'+IMG.suitcase+'" alt="A woman and a taxi driver lift a suitcase from the taxi.">'+
  '<p class="lead">You communicated about transport and getting to your destination.</p>'+
  '<p class="sub">Next, you will review, improve and retry.</p>'+
  '<div class="row"><button type="button" class="btn go" id="doneBtn" disabled>Done</button>'+
  '<button type="button" class="btn alt" id="again6">Try again</button></div>'+
  '</section>');
  var doneBtn=$("doneBtn");
  doneBtn.disabled=!missionReady();
  doneBtn.onclick=function(){
    if(doneBtn.disabled){return;}
    activityCompleted();
    RT.done=true;
    doneBtn.textContent="Done ✓";
    doneBtn.setAttribute("aria-pressed","true");
    announce("Done.");
  };
  $("again6").onclick=fullReset;
  if(RT.done){doneBtn.textContent="Done ✓";}
}
function fullReset(){
  recDiscard();
  S=fresh();
  RT.order={cards:null,turns:{}};RT.done=false;RT.lastResult=null;
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
  saveProgress();
  render();focusHeading();window.scrollTo(0,0);
  announce("Mission restarted.");
}

/* ---------- Start ---------- */
discoverLMS();
loadProgress();
render();
})();
</script>
