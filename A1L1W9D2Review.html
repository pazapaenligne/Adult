<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrival and Basic Questions - Review, Improve and Retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --white:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  background:var(--pazapa-grey-light);
  color:var(--pazapa-grey-dark);
  line-height:1.55;
  font-size:1rem;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;margin:0;}
button,select,textarea,input{font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);touch-action:manipulation;}
.app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}

/* header: boarding-pass strip */
.top{background:var(--pazapa-blue);padding:14px 20px 16px;color:var(--pazapa-grey-dark);}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.brand{margin:0;font-weight:700;font-size:.9rem;}
#langBtn{min-height:48px;min-width:48px;padding:8px 18px;border-radius:24px;border:2px solid var(--pazapa-grey-dark);background:var(--white);font-weight:700;cursor:pointer;}
#langBtn[aria-pressed="true"]{background:var(--pazapa-grey-dark);color:var(--white);}
.eyebrow{margin:10px 0 2px;font-size:.85rem;font-weight:600;}
h1{font-size:1.5rem;line-height:1.2;}
.progress{display:flex;align-items:center;gap:10px;margin-top:12px;}
.track{flex:1;height:10px;background:rgba(255,255,255,.6);border-radius:8px;overflow:hidden;}
.fill{height:100%;background:var(--pazapa-grey-dark);border-radius:8px;transition:width .3s ease;}
.plabel{font-size:.85rem;font-weight:600;white-space:nowrap;}
@media (prefers-reduced-motion:reduce){.fill{transition:none;}*{scroll-behavior:auto !important;}}

main{flex:1;padding:22px 20px 28px;}
main:focus{outline:none;}
.screen-title{font-size:1.3rem;margin:0 0 6px;}
.screen-title:focus{outline:none;}
.lead{margin:0 0 16px;}
.stamp{display:inline-block;border:2px dashed var(--pazapa-grey-dark);border-radius:8px;padding:2px 10px;font-size:.8rem;font-weight:700;margin:0 0 10px;background:var(--yellow-tint);}
.card{background:var(--blue-tint);border-radius:14px;padding:16px;margin:0 0 16px;border:0;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:var(--white);border:2px solid var(--pazapa-blue);}
.card h3{font-size:1.05rem;margin:0 0 10px;}
fieldset{border:0;margin:0;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin:0 0 8px;}
fieldset.card legend{float:left;width:100%;}
fieldset.card legend + *{clear:both;}
.polaroids{display:flex;gap:14px;justify-content:center;margin:0 0 18px;flex-wrap:wrap;}
.polaroid{background:var(--white);padding:6px 6px 8px;border-radius:6px;box-shadow:0 1px 4px rgba(46,46,45,.25);width:140px;text-align:center;font-size:.85rem;font-weight:600;}
.polaroid img{width:100%;height:auto;display:block;border-radius:3px;margin-bottom:4px;}
.polaroid:nth-child(odd){transform:rotate(-2deg);}
.polaroid:nth-child(even){transform:rotate(2deg);}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{min-height:48px;padding:12px 16px;border-radius:10px;border:2px solid var(--pazapa-blue);background:var(--white);text-align:left;cursor:pointer;}
.opt:hover{background:var(--blue-tint);}
.opt[aria-pressed="true"]{background:var(--blue-tint);font-weight:700;}
.opt.ok{border-color:var(--pazapa-green);background:var(--green-tint);font-weight:700;}
.opt.try{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 6px var(--white);}
.fb{margin:8px 0 0;font-size:.95rem;min-height:1.3em;}
.fb.ok::before{content:"\2713  ";font-weight:700;}
.fb.try::before{content:"\2192  ";font-weight:700;}
.fb.try{background:var(--yellow-tint);border-left:4px solid var(--pazapa-yellow);padding:6px 10px;border-radius:6px;}
.fb.ok{background:var(--green-tint);border-left:4px solid var(--pazapa-green);padding:6px 10px;border-radius:6px;}
.fb:empty{display:none;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.pgrid{grid-template-columns:1fr;}}
.pitem{background:var(--white);border-radius:10px;padding:8px;}
.pitem img{width:96px;height:auto;display:block;margin:0 auto 6px;border-radius:4px;}
select.sel{min-height:48px;max-width:100%;border-radius:8px;border:2px solid var(--pazapa-blue);padding:6px 10px;background:var(--white);}
.pitem select.sel{width:100%;}
.sentence{margin:0 0 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.hintbtn{min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid var(--pazapa-yellow);background:var(--yellow-tint);font-weight:600;cursor:pointer;margin-top:10px;}
.hintbox{background:var(--yellow-tint);border-left:4px solid var(--pazapa-yellow);padding:8px 12px;border-radius:6px;margin-top:10px;font-size:.95rem;}
.hintbox p{margin:0 0 4px;}
.situation{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
.situation .polaroid{transform:none;flex:0 0 auto;}
.say{background:var(--white);border-left:4px solid var(--pazapa-blue);padding:8px 12px;border-radius:6px;margin:6px 0;}
.say p{margin:2px 0;}
textarea.ans{width:100%;min-height:120px;border:2px solid var(--pazapa-blue);border-radius:10px;padding:10px 12px;resize:vertical;background:var(--white);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--pazapa-blue);background:var(--white);cursor:pointer;text-align:left;}
.chip small{display:block;font-size:.78rem;opacity:.85;}
.chip[aria-pressed="true"]{background:var(--blue-tint);font-weight:700;}
.linkbtn{min-height:48px;padding:6px 10px;background:none;border:0;text-decoration:underline;cursor:pointer;font-weight:600;}
.btn-sec,.btn-pri{min-height:48px;padding:10px 22px;border-radius:10px;font-weight:700;cursor:pointer;}
.btn-pri{background:var(--pazapa-blue);border:2px solid var(--pazapa-blue);}
.btn-pri:disabled{background:#BFE6EF;border-color:#BFE6EF;color:#5b5b59;cursor:not-allowed;}
.btn-pri.finished{background:var(--pazapa-green);border-color:var(--pazapa-green);}
.btn-sec{background:var(--white);border:2px solid var(--pazapa-blue);}
.btn-sec:disabled{opacity:.5;cursor:not-allowed;}
.rec{margin-top:10px;background:var(--white);border:2px dashed var(--pazapa-blue);border-radius:10px;padding:12px;}
.rec h4{margin:0 0 6px;font-size:1rem;}
.rec-btns{display:flex;flex-wrap:wrap;gap:8px;}
.rec-status{margin:8px 0 0;font-size:.92rem;}
.rec-confirm{margin-top:10px;}
.chk{display:flex;align-items:center;gap:8px;min-height:48px;}
.chk input{width:24px;height:24px;flex:0 0 auto;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
@media (max-width:560px){.cmp{grid-template-columns:1fr;}}
.cmp .card{margin:0;}
.cmp q{display:block;font-style:normal;margin:4px 0;}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag{background:var(--white);border:1px solid var(--pazapa-blue);border-radius:14px;padding:2px 10px;font-size:.82rem;}
ul.plain{margin:6px 0 0;padding-left:20px;}
.actions{padding:14px 20px;border-top:1px solid var(--pazapa-grey-light);display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;}
.actions [hidden]{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.done-hero{text-align:center;}
.done-hero img{width:150px;height:auto;border-radius:6px;margin:6px auto 12px;display:block;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <p class="brand">Pazapa English Programme for Adults</p>
      <button type="button" id="langBtn" aria-pressed="false">Fran&ccedil;ais</button>
    </div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="mainTitle"></h1>
    <div class="progress">
      <div class="track" aria-hidden="true"><div class="fill" id="fill" style="width:0%"></div></div>
      <span class="plabel" id="plabel"></span>
    </div>
  </header>
  <main id="stage"></main>
  <nav class="actions" id="actions" aria-label="Activity buttons">
    <button type="button" class="btn-pri" id="nextBtn"></button>
    <button type="button" class="btn-sec" id="retryBtn" hidden></button>
    <button type="button" class="btn-pri" id="doneBtn" hidden></button>
  </nav>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>

/* ================= Phrase checking (documented, deterministic) =================
   Meaning parts are detected with simple pattern groups on normalised text
   (lower case, curly apostrophes straightened, spaces collapsed):
   document    : passport | document(s)
   destination : travelling/going/flying/coming to ... | destination | a Gulf place name
   length      : number + day(s)/night(s)/week(s)/month(s) | a week | weekend
   stay        : staying at/in/with ... | hotel | address
   purpose     : visiting | here for ... | for work/business/study/holiday | family
   polite      : please | thank you | thanks | here you are | excuse me | may I
   These rules cannot understand every possible answer, so a learner can always
   confirm a clear answer in their own words. */
function norm(s){
  return String(s||"").normalize("NFKC").replace(/[‘’ʼ`]/g,"'").replace(/\s+/g," ").trim().toLowerCase();
}
function stripEnd(s){return s.replace(/[.!?,;:\s]+$/,"");}
var RX={
 document:/\b(passports?|documents?)\b/,
 destination:/\b(travell?ing|going|flying|coming|travel|fly)\s+to\s+\w+|\bdestination\b|\b(doha|dubai|abu dhabi|muscat|riyadh|jeddah|kuwait|manama|bahrain|qatar|oman|saudi|uae|sharjah|dammam|medina|mecca)\b/,
 length:/\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fourteen|a)\s+(days?|nights?|weeks?|months?)\b|\bfor\s+a\s+(week|weekend|month)\b|\bweekend\b/,
 stay:/\b(staying|stay|stayed)\s+(at|in|with)\s+\w+|\bhotel\b|\baddress\b/,
 purpose:/\b(visiting|visit)\b|\bhere\s+for\b|\bfor\s+(work|business|study|studies|holiday|vacation)\b|\bfamily\b/,
 polite:/\b(please|thank you|thanks|here you are|excuse me|may i)\b/
};
function detect(text){
  var n=norm(text),p={};
  PARTS.forEach(function(k){p[k]=RX[k].test(n);});
  return p;
}
function wc(s){var n=norm(s);return n?n.split(" ").length:0;}

/* ================= State ================= */
var KEY="pazapa_A1_W09D2_step7_v1";
var DONEKEY="pazapa_A1_W09D2_step7_done";
var doneBtn=document.getElementById("doneBtn");
doneBtn.disabled=true;
var completionSent=false;

var state,shuf;
function att(){return {text:"",sd:false,sp:{}};}
function freshState(){
  return {screen:0,fr:false,intro:"",rc:{},rh:{a:0,b:0,c:0},first:att(),focus:[],sup:0,second:att(),anyway:false,checked:false,refl:[],tried2:0,usedHint:false};
}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function makeShuffles(){
  shuf={intro:shuffle(INTRO.map(function(x){return x.id;})),a:{},b:{},c:{},refl:shuffle(REFL.map(function(x){return x.id;})),focus:shuffle(PARTS)};
  var wordsA=RA.map(function(x){return x.ans;});
  RA.forEach(function(x){shuf.a[x.id]=shuffle(wordsA);});
  RB.forEach(function(x){shuf.b[x.id]=shuffle(x.opts);});
  RC.forEach(function(x){shuf.c[x.id]=shuffle(x.opts);});
}
function find(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}

/* ================= Storage + LMS (silent) ================= */
var lms={api:null,ver:null,inited:false};
function findAPI(w){
  var n=0;
  while(w&&n<12){
    try{ if(w.API_1484_11) return {api:w.API_1484_11,ver:"2004"}; }catch(e){}
    try{ if(w.API) return {api:w.API,ver:"1.2"}; }catch(e){}
    try{ if(w.parent&&w.parent!==w){w=w.parent;}else{break;} }catch(e){break;}
    n++;
  }
  return null;
}
function discover(){
  if(lms.api) return true;
  var r=null;
  try{r=findAPI(window);}catch(e){}
  if(!r){try{ if(window.opener&&!window.opener.closed) r=findAPI(window.opener); }catch(e){}}
  if(r){lms.api=r.api;lms.ver=r.ver;}
  return !!lms.api;
}
function sKey(){return lms.ver==="2004"?"cmi.completion_status":"cmi.core.lesson_status";}
function lGet(k){try{return lms.ver==="2004"?lms.api.GetValue(k):lms.api.LMSGetValue(k);}catch(e){return "";}}
function lSet(k,v){try{var r=lms.ver==="2004"?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v);return String(r)!=="false";}catch(e){return false;}}
function lCommit(){try{var r=lms.ver==="2004"?lms.api.Commit(""):lms.api.LMSCommit("");return String(r)!=="false";}catch(e){return false;}}
function lReady(){
  if(!discover()) return false;
  try{
    lGet(sKey());
    var code=lms.ver==="2004"?String(lms.api.GetLastError()):String(lms.api.LMSGetLastError());
    if(!lms.inited&&((lms.ver==="2004"&&code==="122")||(lms.ver==="1.2"&&code==="301"))){
      if(lms.ver==="2004"){lms.api.Initialize("");}else{lms.api.LMSInitialize("");}
      lms.inited=true;
    }
  }catch(e){}
  return true;
}
function compact(){
  function tx(s){return String(s||"").slice(0,280);}
  return {pz:"W09D2R",v:1,s:state.screen,fr:state.fr?1:0,i:state.intro,rc:state.rc,rh:state.rh,
    f:{t:tx(state.first.text),sd:state.first.sd?1:0},fo:state.focus,su:state.sup,
    x:{t:tx(state.second.text),sd:state.second.sd?1:0},an:state.anyway?1:0,ck:state.checked?1:0,rf:state.refl,uh:state.usedHint?1:0};
}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,250);
}
function saveNow(){
  var str="";
  try{str=JSON.stringify(compact());}catch(e){return;}
  if(str.length>3400) return;
  var wrote=false;
  if(discover()||lReady()){
    lReady();
    wrote=lSet("cmi.suspend_data",str);
    if(wrote){
      var cur=String(lGet(sKey())||"").toLowerCase();
      if(cur==="not attempted"||cur==="unknown"||cur===""){ if(lms.ver==="1.2"||cur==="unknown"){lSet(sKey(),"incomplete");} }
      lCommit();
    }
  }
  if(!wrote){try{localStorage.setItem(KEY,str);}catch(e){}}
}
function loadSaved(){
  var raw="";
  if(discover()){lReady();try{raw=String(lGet("cmi.suspend_data")||"");}catch(e){raw="";}}
  if(!raw){try{raw=localStorage.getItem(KEY)||"";}catch(e){raw="";}}
  if(!raw||raw.length>4000) return null;
  var d=null;
  try{d=JSON.parse(raw);}catch(e){return null;}
  if(!d||d.pz!=="W09D2R"||d.v!==1) return null;
  return d;
}
function restore(d){
  var s=freshState();
  function str(x,max){return typeof x==="string"?x.slice(0,max):"";}
  s.screen=(typeof d.s==="number"&&d.s>=0&&d.s<SCREENS.length)?Math.floor(d.s):0;
  s.fr=d.fr===1;
  s.intro=find(INTRO,str(d.i,4))?d.i:"";
  s.rc={};
  if(d.rc&&typeof d.rc==="object"){Object.keys(d.rc).forEach(function(k){if(/^[abc]\d$/.test(k)&&typeof d.rc[k]==="string"){s.rc[k]=d.rc[k].slice(0,60);}});}
  if(d.rh&&typeof d.rh==="object"){["a","b","c"].forEach(function(k){var n=Number(d.rh[k]);s.rh[k]=(n>=0&&n<=2)?n:0;});}
  if(d.f){s.first.text=str(d.f.t,280);s.first.sd=d.f.sd===1;}
  s.focus=Array.isArray(d.fo)?d.fo.filter(function(p){return PARTS.indexOf(p)>-1;}).slice(0,2):[];
  s.sup=(d.su>=0&&d.su<=3)?d.su:0;
  if(d.x){s.second.text=str(d.x.t,280);s.second.sd=d.x.sd===1;}
  s.anyway=d.an===1;
  s.checked=d.ck===1;
  s.refl=Array.isArray(d.rf)?d.rf.filter(function(p){return !!find(REFL,p);}):[];
  s.usedHint=d.uh===1;
  return s;
}

/* ---- completion (called only when Done is pressed) ---- */
function sendCompletion(){
  if(completionSent) return true;
  var ok=false;
  if(discover()){
    lReady();
    var cur=String(lGet(sKey())||"").toLowerCase();
    if(cur==="completed"||cur==="passed"){ok=true;}
    else{
      var a=lSet(sKey(),"completed");
      var b=lCommit();
      var v=String(lGet(sKey())||"").toLowerCase();
      ok=a&&b&&(v==="completed"||v==="passed"||v==="");
    }
  }else{
    ok=true;
  }
  try{localStorage.setItem(DONEKEY,"1");}catch(e){}
  if(ok){completionSent=true;}
  return ok;
}
function activityCompleted(){
  var ok=sendCompletion();
  if(!ok){ok=sendCompletion();}
  if(!ok){completionSent=true;}
  try{console.log("W09D2 Review Improve Retry completed");}catch(e){}
}

/* ================= Validation ================= */
function spokenAny(a){return Object.keys(a.sp).some(function(k){return a.sp[k];});}
function validAttempt(a){return wc(a.text)>=2||spokenAny(a);}
function partsOf(a){
  var p=detect(a.text);
  Object.keys(a.sp).forEach(function(k){if(a.sp[k]) p[k]=true;});
  return p;
}
function allAnswered(){
  var ids=RA.concat(RB,RC).map(function(x){return x.id;});
  return ids.every(function(id){return !!state.rc[id];});
}
function canLeave(i){
  switch(i){
    case 0:return !!state.intro;
    case 1:return allAnswered();
    case 2:return validAttempt(state.first);
    case 3:return state.focus.length>=1;
    case 4:return state.checked&&validAttempt(state.second);
    case 5:return state.refl.length>=1;
    default:return true;
  }
}
function canClick(i){
  if(i===4) return validAttempt(state.second);
  return canLeave(i);
}
function allDone(){for(var i=0;i<6;i++){if(!canLeave(i)) return false;}return true;}
function sameText(){return norm(stripEnd(state.first.text))===norm(stripEnd(state.second.text));}
function evalSecond(){
  var p1=partsOf(state.first),p2=partsOf(state.second);
  var changed=spokenAny(state.second)||!sameText();
  var met=state.focus.filter(function(f){return p2[f]&&(!p1[f]||changed);});
  return {changed:changed,met:met,ok:changed&&met.length>=1};
}

/* ================= Recording (optional, local only) ================= */
var recs={};
function R(slot){if(!recs[slot]){recs[slot]={state:"idle",url:null,has:false,key:"",stream:null,mr:null,chunks:[],audio:null};}return recs[slot];}
function recSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function recRevoke(r){if(r.url){try{URL.revokeObjectURL(r.url);}catch(e){}r.url=null;}if(r.audio){try{r.audio.pause();}catch(e){}r.audio=null;}}
function recRelease(r){if(r.stream){try{r.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}r.stream=null;}}
function recFail(slot,key){var r=R(slot);recRelease(r);r.state="error";r.key=key;r.has=false;recUI(slot);}
function recStart(slot){
  var r=R(slot);
  if(r.state==="recording") return;
  if(!recSupported()){recFail(slot,"unsupported");return;}
  recRevoke(r);r.has=false;
  var p;
  try{p=navigator.mediaDevices.getUserMedia({audio:true});}catch(e){recFail(slot,"fail");return;}
  p.then(function(stream){
    r.stream=stream;r.chunks=[];
    var mr;
    try{mr=new MediaRecorder(stream);}catch(e){recFail(slot,"unsupported");return;}
    r.mr=mr;
    mr.ondataavailable=function(e){if(e.data&&e.data.size){r.chunks.push(e.data);}};
    mr.onerror=function(){recFail(slot,"fail");};
    mr.onstop=function(){
      recRelease(r);
      var blob=null;
      try{blob=new Blob(r.chunks,{type:(mr.mimeType||"audio/webm")});}catch(e){blob=null;}
      r.chunks=[];
      if(!blob||!blob.size){r.state="error";r.key="empty";r.has=false;}
      else{r.url=URL.createObjectURL(blob);r.has=true;r.state="ready";r.key="";}
      recUI(slot);
      announce(r.has?T("Recording ready.","Enregistrement prêt."):T("Nothing was recorded.","Rien n'a été enregistré."));
    };
    try{mr.start();}catch(e){recFail(slot,"fail");return;}
    r.state="recording";r.key="";recUI(slot);
    announce(T("Recording started.","Enregistrement commencé."));
  }).catch(function(e){
    var n=e&&e.name?e.name:"";
    if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError") recFail(slot,"denied");
    else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") recFail(slot,"missing");
    else recFail(slot,"fail");
  });
}
function recStop(slot){var r=R(slot);if(r.mr&&r.state==="recording"){try{r.mr.stop();}catch(e){recFail(slot,"fail");}}}
function recPlay(slot){
  var r=R(slot);
  if(!r.has||!r.url) return;
  try{
    if(r.audio){r.audio.pause();}
    r.audio=new Audio(r.url);
    var pr=r.audio.play();
    if(pr&&pr.catch){pr.catch(function(){recFail(slot,"fail");});}
  }catch(e){recFail(slot,"fail");}
}
function recStopAll(){
  Object.keys(recs).forEach(function(k){var r=recs[k];if(r.state==="recording"&&r.mr){try{r.mr.onstop=function(){recRelease(r);r.state="idle";r.has=false;};r.mr.stop();}catch(e){recRelease(r);r.state="idle";}}if(r.audio){try{r.audio.pause();}catch(e){}}});
}
function recClear(){Object.keys(recs).forEach(function(k){var r=recs[k];recRelease(r);recRevoke(r);});recs={};}
function recMsg(r){
  switch(r.state){
    case "recording":return T("Recording. Press Stop when you finish.","Enregistrement en cours. Appuyez sur Stop quand vous avez fini.");
    case "ready":return T("Recording ready. Press Hear my recording.","Enregistrement prêt. Appuyez sur Écouter mon enregistrement.");
    case "error":
      if(r.key==="denied") return T("The microphone was not allowed. You can type or tap phrases instead.","Le microphone n'a pas été autorisé. Vous pouvez écrire ou toucher des expressions.");
      if(r.key==="missing") return T("No microphone was found. You can type or tap phrases instead.","Aucun microphone trouvé. Vous pouvez écrire ou toucher des expressions.");
      if(r.key==="unsupported") return T("Recording does not work in this browser. You can type or tap phrases instead.","L'enregistrement ne fonctionne pas dans ce navigateur. Vous pouvez écrire ou toucher des expressions.");
      if(r.key==="empty") return T("Nothing was recorded. Press Record to try again.","Rien n'a été enregistré. Appuyez sur Enregistrer pour réessayer.");
      return T("Recording did not work this time. You can try again or type your answer.","L'enregistrement n'a pas fonctionné. Vous pouvez réessayer ou écrire votre réponse.");
    default:return T("Optional: press Record, say your answer, then press Stop.","Facultatif : appuyez sur Enregistrer, dites votre réponse, puis appuyez sur Stop.");
  }
}
function recHTML(slot){
  var a=slot==="first"?state.first:state.second;
  var ticks=PARTS.map(function(p){
    return '<label class="chk"><input type="checkbox" data-tick="'+slot+'" value="'+p+'"'+(a.sp[p]?" checked":"")+'> '+esc(T(PLABEL[p][0],PLABEL[p][1]))+'</label>';
  }).join("");
  return '<div class="rec" data-rec="'+slot+'">'+
    '<h4>'+T("Say it aloud (optional)","Dites-le à voix haute (facultatif)")+'</h4>'+
    '<div class="rec-btns">'+
      '<button type="button" class="btn-sec" data-ra="start" data-slot="'+slot+'">'+T("Record","Enregistrer")+'</button>'+
      '<button type="button" class="btn-sec" data-ra="stop" data-slot="'+slot+'">'+T("Stop","Stop")+'</button>'+
      '<button type="button" class="btn-sec" data-ra="play" data-slot="'+slot+'">'+T("Hear my recording","Écouter mon enregistrement")+'</button>'+
      '<button type="button" class="btn-sec" data-ra="again" data-slot="'+slot+'">'+T("Record again","Enregistrer à nouveau")+'</button>'+
    '</div>'+
    '<p class="rec-status" role="status" data-status="'+slot+'"></p>'+
    '<fieldset class="rec-confirm" data-confirm="'+slot+'" hidden><legend>'+T("Which ideas did you say aloud?","Quelles idées avez-vous dites à voix haute ?")+'</legend>'+ticks+'</fieldset>'+
  '</div>';
}
function recUI(slot){
  var box=document.querySelector('[data-rec="'+slot+'"]');
  if(!box) return;
  var r=R(slot);
  var q=function(a){return box.querySelector('[data-ra="'+a+'"]');};
  q("start").hidden=!(r.state==="idle"||r.state==="error");
  q("stop").hidden=r.state!=="recording";
  q("play").hidden=!r.has;q("play").disabled=!r.has;
  q("again").hidden=!r.has;
  box.querySelector('[data-status="'+slot+'"]').textContent=recMsg(r);
  box.querySelector('[data-confirm="'+slot+'"]').hidden=!r.has;
}

function hintBlock(t){
  var n=state.rh[t],list=HINTS[t];
  var shown="";
  for(var i=0;i<n;i++){shown+='<p>'+esc(T(list[i][0],list[i][1]))+'</p>';}
  var box=n>0?'<div class="hintbox" role="note">'+shown+'</div>':"";
  var btn=n<list.length?'<button type="button" class="hintbtn" data-hint="'+t+'">'+(n===0?T("Need a hint?","Besoin d'un indice ?"):T("Another small cue","Un autre petit indice"))+'</button>':"";
  return box+btn;
}
function optLabel(w){return FR&&MEAN[w]?w+" ("+MEAN[w][2]+")":w;}

  if(kind==="a"){
    if(v===item.ans) return fbHTML("ok",esc(T("That's right. ","Exact. "))+EN(item.ans)+esc(": "+T(MEAN[item.ans][0],MEAN[item.ans][1])+"."));

  }
  if(kind==="b"){
    if(item.ans.indexOf(v)>-1) return fbHTML("ok",esc(T(item.ok[0],item.ok[1])));
    return fbHTML("try",esc(T("Try again: read the whole sentence and choose the word that fits.","Réessayez : lisez toute la phrase et choisissez le mot qui convient.")));

  if(item.ans.indexOf(v)>-1) return fbHTML("ok",esc(T("That works. It answers the question.","Ça marche. Cela répond à la question.")));

  return '<h2 class="screen-title" tabindex="-1">'+T("First try","Premier essai")+'</h2>'+
  '<div class="card"><div class="situation"><div class="polaroid">'+img("desk")+'</div><div style="flex:1;min-width:200px">'+
  '<p style="margin:0 0 6px"><strong>'+T("You are at the arrival desk.","Vous êtes au comptoir d'arrivée.")+'</strong></p>'+
  '<div class="say"><p>'+EN("May I see your passport?")+'</p><p>'+EN("What is your destination?")+'</p><p>'+EN("How long are you staying?")+'</p></div>'+
  (FR?'<p style="margin:4px 0 0;font-size:.9rem">Puis-je voir votre passeport ? Quelle est votre destination ? Combien de temps restez-vous ?</p>':"")+
  '</div></div>'+
  '<p style="margin:10px 0 0"><strong>'+T("Key purpose:","Objectif :")+'</strong> '+T("show your document and give clear arrival information.","montrez votre document et donnez des informations d'arrivée claires.")+'</p></div>'+
  '<div class="card white"><label for="firstText"><strong>'+T("Type your answer (1 to 4 short sentences)","Écrivez votre réponse (1 à 4 phrases courtes)")+'</strong></label>'+
  '<textarea class="ans" id="firstText" data-field="first" maxlength="280" lang="en-GB" autocomplete="off">'+esc(state.first.text)+'</textarea>'+
  '<p style="margin:8px 0 0">'+T("Or tap phrases to build your answer. Any answer is fine. Use the lesson phrases or your own words.","Ou touchez des expressions pour construire votre réponse. Toute réponse est acceptée. Utilisez les expressions de la leçon ou vos propres mots.")+'</p>'+
  phraseChips("first")+
  '<button type="button" class="linkbtn" data-clear="first">'+T("Clear my answer","Effacer ma réponse")+'</button>'+
  recHTML("first")+'</div>';
}

function screenFix(){
  var p=partsOf(state.first);
  var have=PARTS.filter(function(k){return p[k];});
  var missing=["document","destination","length","stay","purpose","polite"].filter(function(k){return !p[k];});
  var strengths=have.length?'<ul class="plain">'+have.map(function(k){return '<li>'+esc(T(STRENGTH[k][0],STRENGTH[k][1]))+'</li>';}).join("")+'</ul>':
    '<p style="margin:0">'+T("You answered the officer. That is the first step.","Vous avez répondu à l'agent. C'est la première étape.")+'</p>';
  var sug=missing.length?T(ADD[missing[0]][0],ADD[missing[0]][1]):T("Your first try already has the main ideas. You can make one thing clearer.","Votre premier essai contient déjà les idées principales. Vous pouvez rendre une chose plus claire.");
  var focus=shuf.focus.map(function(k){
    return '<label class="chk"><input type="checkbox" data-focus value="'+k+'"'+(state.focus.indexOf(k)>-1?" checked":"")+'> '+esc(T(FOCUSLBL[k][0],FOCUSLBL[k][1]))+(p[k]?' <span class="tag">'+esc(T("already in your try","déjà dans votre essai"))+'</span>':"")+'</label>';
  }).join("");
  var sup="";
  if(state.sup>=1) sup+='<div class="hintbox"><p>'+esc(T("Hint: the officer asks for three things: your document, your destination and how long you stay.","Indice : l'agent demande trois choses : votre document, votre destination et la durée de votre séjour."))+'</p></div>';
  if(state.sup>=2) sup+='<div class="card white" style="margin-top:10px"><h3>'+T("Phrase bank","Banque d'expressions")+'</h3><ul class="plain">'+PHRASES.map(function(x){return '<li>'+EN(x.en)+(FR?' <small>('+esc(x.fr)+')</small>':"")+'</li>';}).join("")+'</ul></div>';
  if(state.sup>=3) sup+='<div class="card green" style="margin-top:10px"><h3>'+T("Example","Exemple")+'</h3><p style="margin:0">'+EN(MODEL.en)+'</p>'+(FR?'<p style="margin:4px 0 0;font-size:.9rem">'+esc(MODEL.fr)+'</p>':"")+'</div>';
  var lbl=["Need a hint?","Show the phrase bank","Show an example"];
  var lblfr=["Besoin d'un indice ?","Afficher la banque d'expressions","Afficher un exemple"];
  var supBtn=state.sup<3?'<button type="button" class="hintbtn" data-sup>'+esc(T(lbl[state.sup],lblfr[state.sup]))+'</button>':"";
  var firstShow=state.first.text?'<q lang="en-GB">'+esc(state.first.text)+'</q>':'<q>'+esc(T("(You answered aloud.)","(Vous avez répondu à voix haute.)"))+'</q>';
  return '<h2 class="screen-title" tabindex="-1">'+T("Fix one thing","Améliorer une chose")+'</h2>'+
  '<div class="card white"><h3>'+T("Your first try","Votre premier essai")+'</h3><p style="margin:0">'+firstShow+'</p></div>'+
  '<div class="card green"><h3>'+T("What already works","Ce qui fonctionne déjà")+'</h3>'+strengths+'</div>'+
  '<div class="card yellow"><h3>'+T("One thing to add","Une chose à ajouter")+'</h3><p style="margin:0">'+esc(sug)+'</p></div>'+
  '<fieldset class="card"><legend>'+T("Choose one or two things to improve","Choisissez une ou deux choses à améliorer")+'</legend>'+focus+
  '<p class="fb" id="focusNote" aria-live="polite" style="min-height:0"></p></fieldset>'+
  '<div>'+supBtn+sup+'</div>'+
  '<p style="margin-top:12px">'+T("Your answer stays as you wrote it. You will make a new second try next.","Votre réponse reste telle que vous l'avez écrite. Vous ferez ensuite un deuxième essai.")+'</p>';
}

function screenSecond(){
  var first=state.first.text?'<q lang="en-GB">'+esc(state.first.text)+'</q>':'<q>'+esc(T("(You answered aloud.)","(Vous avez répondu à voix haute.)"))+'</q>';
  var chosen=state.focus.map(function(k){return esc(T(FOCUSLBL[k][0],FOCUSLBL[k][1]));}).join(", ");
  var fbmsg="";
  if(state.tried2>0&&!state.checked){
    var e=evalSecond();
    var k=state.focus[0];
    fbmsg='<p class="fb try" aria-live="polite">'+esc(!e.changed?T("Make this a new version of your answer. Try again with this phrase: ","Faites une nouvelle version de votre réponse. Réessayez avec cette expression : ")+T(ADD[k][0],ADD[k][1]):T("Try again with this phrase: ","Réessayez avec cette expression : ")+T(ADD[k][0],ADD[k][1]))+'</p>'+
      (e.changed?'<p style="margin:6px 0 0">'+T("If you used your own words and your answer is clear, you can compare anyway.","Si vous avez utilisé vos propres mots et que votre réponse est claire, vous pouvez comparer quand même.")+'</p><button type="button" class="btn-sec" data-anyway>'+T("Compare anyway","Comparer quand même")+'</button>':"");
  }
  return '<h2 class="screen-title" tabindex="-1">'+T("Second try","Deuxième essai")+'</h2>'+
  '<div class="card white"><h3>'+T("My first try","Mon premier essai")+'</h3><p style="margin:0">'+first+'</p></div>'+
  '<p class="lead"><strong>'+T("You chose:","Vous avez choisi :")+'</strong> '+chosen+'</p>'+
  '<div class="card white"><label for="secondText"><strong>'+T("My second try","Mon deuxième essai")+'</strong></label>'+
  '<textarea class="ans" id="secondText" data-field="second" maxlength="280" lang="en-GB" autocomplete="off">'+esc(state.second.text)+'</textarea>'+
  '<button type="button" class="linkbtn" data-copy>'+T("Copy my first try here to change it","Copier mon premier essai ici pour le modifier")+'</button>'+
  '<p style="margin:6px 0 0">'+T("Tap a phrase to add it:","Touchez une expression pour l'ajouter :")+'</p>'+
  phraseChips("second")+recHTML("second")+'<div id="fb2">'+fbmsg+'</div></div>';
}

function tagsFor(a){
  var p=partsOf(a);
  var ks=PARTS.filter(function(k){return p[k];});
  return ks.length?'<div class="tagrow">'+ks.map(function(k){return '<span class="tag">'+esc(T(PLABEL[k][0],PLABEL[k][1]))+'</span>';}).join("")+'</div>':"";
}
function screenProgress(){
  var p1=partsOf(state.first),p2=partsOf(state.second);
  var gained=PARTS.filter(function(k){return p2[k]&&!p1[k];});
  var changed=spokenAny(state.second)||!sameText();
  var summary;
  if(gained.length){
    summary=T("Your second try is clearer because it now includes: ","Votre deuxième essai est plus clair parce qu'il inclut maintenant : ")+gained.map(function(k){return T(PLABEL[k][0],PLABEL[k][1]);}).join(", ")+".";
  }else if(changed){
    summary=T("Your second try is a new version, and your ideas are still clear.","Votre deuxième essai est une nouvelle version, et vos idées restent claires.");
  }else{
    summary=T("You tried again. Well done.","Vous avez réessayé. Bravo.");
  }
  var s1=state.first.text?'<q lang="en-GB">'+esc(state.first.text)+'</q>':'<q>'+esc(T("(Spoken answer)","(Réponse orale)"))+'</q>';
  var s2=state.second.text?'<q lang="en-GB">'+esc(state.second.text)+'</q>':'<q>'+esc(T("(Spoken answer)","(Réponse orale)"))+'</q>';
  var ropts=shuf.refl.map(function(id){
    var it=find(REFL,id);
    return '<label class="chk"><input type="checkbox" data-refl value="'+id+'"'+(state.refl.indexOf(id)>-1?" checked":"")+'> '+esc(T(it.en,it.fr))+'</label>';
  }).join("");
  return '<h2 class="screen-title" tabindex="-1">'+T("Notice the progress","Remarquez vos progrès")+'</h2>'+
  '<div class="cmp"><div class="card"><h3>'+T("First try","Premier essai")+'</h3>'+s1+tagsFor(state.first)+'</div>'+
  '<div class="card green"><h3>'+T("Second try","Deuxième essai")+'</h3>'+s2+tagsFor(state.second)+'</div></div>'+
  '<div class="card white"><p style="margin:0"><strong>'+esc(summary)+'</strong></p></div>'+
  '<fieldset class="card"><legend>'+T("What improved? Choose all that fit.","Qu'est-ce qui s'est amélioré ? Choisissez tout ce qui convient.")+'</legend>'+ropts+'</fieldset>';
}
function screenComplete(){
  return '<div class="done-hero"><h2 class="screen-title" tabindex="-1">'+T("Review complete.","Révision terminée.")+'</h2>'+img("stay")+'</div>'+
  '<div class="card green"><p style="margin:0">'+T("You reviewed and improved your English for arrival and basic questions.","Vous avez révisé et amélioré votre anglais pour l'arrivée et les questions de base.")+'</p></div>'+
  '<div class="card"><h3>'+T("Use it this week","À utiliser cette semaine")+'</h3><p style="margin:0">'+T("Say three answers aloud to yourself: where you are going, where you are staying, and how long you stay.","Dites trois réponses à voix haute pour vous-même : où vous allez, où vous séjournez et combien de temps vous restez.")+'</p></div>';
}

/* ================= Render + navigation ================= */
var NEXTLBL=[["Start my review","Commencer ma révision"],["Continue","Continuer"],["Review my first try","Revoir mon premier essai"],["Make my second try","Faire mon deuxième essai"],["Compare my tries","Comparer mes essais"],["Finish review","Terminer la révision"]];
function updateChrome(){
  document.getElementById("eyebrow").textContent=T("Week 9 · Lesson 2 · Review, improve and retry","Semaine 9 · Leçon 2 · Réviser, améliorer et réessayer");
  document.getElementById("mainTitle").textContent=T("Arrival and basic questions","Arrivée et questions de base");
  document.getElementById("plabel").textContent=T("Part "+(state.screen+1)+" of 7","Partie "+(state.screen+1)+" sur 7");
  document.getElementById("fill").style.width=Math.round(((state.screen+1)/7)*100)+"%";
  var lb=document.getElementById("langBtn");
  lb.textContent=FR?"English":"Français";
  lb.setAttribute("aria-pressed",FR?"true":"false");
  lb.setAttribute("aria-label",FR?"Switch to English":"Passer en français");
  lb.setAttribute("lang",FR?"en-GB":"fr");
  retryBtn.textContent=T("Try again","Recommencer");
  if(!completionSent){doneBtn.textContent=T("Done","Terminé");}else{doneBtn.textContent=T("Done","Terminé")+" ✓";}
  stage.setAttribute("lang",FR?"fr":"en-GB");
}
function updateNav(){
  var s=state.screen;
  var last=s===SCREENS.length-1;
  nextBtn.hidden=last;
  retryBtn.hidden=!last;
  doneBtn.hidden=!last;
  if(!last){
    nextBtn.textContent=T(NEXTLBL[s][0],NEXTLBL[s][1]);
    nextBtn.disabled=!canClick(s);
  }
  if(last){
    if(completionSent){doneBtn.disabled=true;doneBtn.classList.add("finished");}
    else{doneBtn.disabled=!allDone();doneBtn.classList.remove("finished");}
  }else{
    if(!completionSent){doneBtn.disabled=true;}
  }
}
function render(){
  var html="";
  switch(SCREENS[state.screen]){
    case "look":html=screenLook();break;
    case "recall":html=screenRecall();break;
    case "first":html=screenFirst();break;
    case "fix":html=screenFix();break;
    case "second":html=screenSecond();break;
    case "progress":html=screenProgress();break;
    default:html=screenComplete();
  }
  stage.innerHTML=html;
  updateChrome();
  updateNav();
  ["first","second"].forEach(function(s){recUI(s);});
}
function focusHeading(){
  var h=stage.querySelector(".screen-title");
  if(h){h.focus({preventScroll:true});}
  window.scrollTo(0,0);
}
function go(n){
  recStopAll();
  state.screen=n;
  render();
  focusHeading();
  announce(T("Part "+(n+1)+" of 7","Partie "+(n+1)+" sur 7"));
  save();
}

nextBtn.addEventListener("click",function(){
  var s=state.screen;
  if(!canClick(s)) return;
  if(s===4){
    state.tried2++;
    var e=evalSecond();
    if(e.ok||state.anyway){state.checked=true;go(5);}
    else{state.checked=false;render();var f=stage.querySelector("#fb2 .fb");if(f){announce(f.textContent);}save();}
    return;
  }
  go(s+1);
});
retryBtn.addEventListener("click",function(){resetAll();});
doneBtn.addEventListener("click",function(){
  if(doneBtn.disabled||completionSent) return;
  if(SCREENS[state.screen]!=="complete"||!allDone()) return;
  doneBtn.disabled=true;
  activityCompleted();
  doneBtn.classList.add("finished");
  updateChrome();
  announce(T("Done.","Terminé."));
});
document.getElementById("langBtn").addEventListener("click",function(){
  FR=!FR;state.fr=FR;
  render();
  document.getElementById("langBtn").focus();
  announce(FR?"Français":"English");
  save();
});

function resetAll(){
  recStopAll();recClear();
  try{localStorage.removeItem(KEY);}catch(e){}
  var fr=FR;
  state=freshState();state.fr=fr;
  makeShuffles();
  state.screen=0;
  if(!completionSent){doneBtn.disabled=true;}
  render();focusHeading();
  announce(T("Starting again.","On recommence."));
  save();
}

/* ---- delegated events ---- */
stage.addEventListener("click",function(ev){
  var t=ev.target.closest("button");
  if(!t) return;
  if(t.hasAttribute("data-intro")){state.intro=t.getAttribute("data-intro");render();var b=stage.querySelector('[data-intro="'+state.intro+'"]');if(b)b.focus();save();return;}
  if(t.hasAttribute("data-rcc")){state.rc[t.getAttribute("data-rcc")]=t.getAttribute("data-val");var id=t.getAttribute("data-rcc"),v=t.getAttribute("data-val");render();var nb=stage.querySelectorAll('[data-rcc="'+id+'"]');for(var i=0;i<nb.length;i++){if(nb[i].getAttribute("data-val")===v){nb[i].focus();}}save();return;}
  if(t.hasAttribute("data-hint")){var k=t.getAttribute("data-hint");if(state.rh[k]<HINTS[k].length){state.rh[k]++;state.usedHint=true;}render();var hb=stage.querySelector('[data-hint="'+k+'"]');if(hb)hb.focus();save();return;}
  if(t.hasAttribute("data-sup")){if(state.sup<3){state.sup++;state.usedHint=true;}render();var sb=stage.querySelector("[data-sup]");if(sb)sb.focus();save();return;}
  if(t.hasAttribute("data-chip")){
    var tgt=t.getAttribute("data-target");
    var ph=PHRASES[Number(t.getAttribute("data-chip"))].en;
    var a=tgt==="first"?state.first:state.second;
    if(norm(a.text).indexOf(norm(ph))===-1&&(a.text.length+ph.length+1)<=280){a.text=(a.text?a.text+" ":"")+ph;}
    var ta=stage.querySelector('[data-field="'+tgt+'"]');if(ta){ta.value=a.text;}
    afterEdit(tgt);return;
  }
  if(t.hasAttribute("data-clear")){var c=t.getAttribute("data-clear");(c==="first"?state.first:state.second).text="";var ta2=stage.querySelector('[data-field="'+c+'"]');if(ta2){ta2.value="";ta2.focus();}afterEdit(c);return;}
  if(t.hasAttribute("data-copy")){state.second.text=state.first.text;var ta3=stage.querySelector('[data-field="second"]');if(ta3){ta3.value=state.second.text;ta3.focus();}afterEdit("second");return;}
  if(t.hasAttribute("data-anyway")){state.anyway=true;state.checked=true;state.tried2++;go(5);return;}
  if(t.hasAttribute("data-ra")){
    var slot=t.getAttribute("data-slot"),act=t.getAttribute("data-ra");
    if(act==="start"||act==="again"){recStart(slot);}
    else if(act==="stop"){recStop(slot);}
    else if(act==="play"){recPlay(slot);}
    return;
  }
});
function afterEdit(which){
  if(which==="first"){state.focus=[];state.checked=false;state.sup=Math.min(state.sup,0);}
  else{state.checked=false;state.anyway=false;state.refl=[];}
  updateNav();save();
}
stage.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.hasAttribute&&t.hasAttribute("data-field")){
    var f=t.getAttribute("data-field");
    (f==="first"?state.first:state.second).text=t.value.slice(0,280);
    afterEdit(f);
  }
});
stage.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.hasAttribute("data-rc")){
    var id=t.getAttribute("data-rc");
    if(t.value){state.rc[id]=t.value;}else{delete state.rc[id];}
    var scroll=window.pageYOffset;
    render();
    var sel=document.getElementById("rc-"+id);if(sel){sel.focus({preventScroll:true});}
    window.scrollTo(0,scroll);
    save();return;
  }
  if(t.hasAttribute("data-tick")){
    var slot=t.getAttribute("data-tick");
    var a=slot==="first"?state.first:state.second;
    a.sp[t.value]=t.checked;
    a.sd=spokenAny(a);
    afterEdit(slot);return;
  }
  if(t.hasAttribute("data-focus")){
    var v=t.value;
    var i=state.focus.indexOf(v);
    if(t.checked&&i===-1){state.focus.push(v);if(state.focus.length>2){state.focus.shift();}}
    if(!t.checked&&i>-1){state.focus.splice(i,1);}
    state.checked=false;
    var boxes=stage.querySelectorAll("[data-focus]");
    for(var j=0;j<boxes.length;j++){boxes[j].checked=state.focus.indexOf(boxes[j].value)>-1;}
    var note=document.getElementById("focusNote");
    if(note){note.textContent=state.focus.length===2?T("You can choose up to two things.","Vous pouvez choisir jusqu'à deux choses."):"";note.style.minHeight="0";}
    updateNav();save();return;
  }
  if(t.hasAttribute("data-refl")){
    var r=t.value,k=state.refl.indexOf(r);
    if(t.checked&&k===-1){state.refl.push(r);}
    if(!t.checked&&k>-1){state.refl.splice(k,1);}
    updateNav();save();return;
  }
});

window.addEventListener("pagehide",function(){
  try{saveNow();}catch(e){}
  recClear();
});

/* ================= Init ================= */
(function init(){
  makeShuffles();
  state=freshState();
  var d=loadSaved();
  if(d){
    state=restore(d);
    FR=state.fr;
    /* revalidate: never trust a saved screen beyond what the saved answers support */
    var max=state.screen;
    for(var i=0;i<state.screen;i++){if(!canLeave(i)){max=i;break;}}
    state.screen=max;
    if(!canLeave(4)){state.checked=false;}
  }
  render();
})();
})();
</script>
</body>
</html>
