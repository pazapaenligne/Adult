<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Useful English - Reading, listening, and writing check</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#D7F1F7;
  --green-tint:#F4F7DA;
  --yellow-tint:#FEF3CD;
  --muted:#5c5c5b;
  --radius:14px;
  --ring:3px solid #2E2E2D;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:"Open Sans",Arial,sans-serif;
  font-size:17px;
  line-height:1.5;
  color:var(--pazapa-grey-dark);
  background:#fff;
}
h1,h2,h3,legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;}
h1{font-size:1.55rem;line-height:1.2;margin:2px 0 0;font-weight:800;}
h2{font-size:1.4rem;line-height:1.25;margin:0 0 6px;font-weight:800;}
h2:focus{outline:none;}
h3{font-size:1.1rem;margin:0 0 6px;font-weight:800;}
p{margin:0 0 10px;}
.app{max-width:820px;margin:0 auto;padding:0 16px 48px;}
.accent{height:8px;background:var(--pazapa-blue);position:relative;}
.accent::after{content:"";position:absolute;right:16px;top:0;width:28px;height:8px;background:var(--pazapa-red);}
.topbar{padding:14px 0 10px;}
.brandline{font-size:.8rem;font-weight:700;letter-spacing:.02em;margin-bottom:4px;}
.titlerow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
.eyebrow{font-size:.85rem;margin:0;}
.seg{display:flex;gap:6px;margin-top:12px;}
.seg span{flex:1;height:10px;border-radius:99px;background:var(--pazapa-grey-light);}
.seg span.on{background:var(--pazapa-blue);}
.seglabel{font-size:.85rem;font-weight:700;margin:6px 0 0;}
.screen[hidden]{display:none;}
.screen{padding-top:10px;}
.lede{margin-bottom:14px;}

/* fr */
.fr{display:none;font-style:italic;font-weight:400;font-size:.92em;color:var(--muted);}
body.fr-on .fr{display:block;}
body.fr-on .btn .fr{color:inherit;font-size:.85em;}
legend .fr{font-family:"Open Sans",Arial,sans-serif;}

/* buttons */
.btn{
  font-family:inherit;font-size:1rem;font-weight:700;color:var(--pazapa-grey-dark);
  background:#fff;border:2px solid var(--pazapa-grey-dark);border-radius:999px;
  min-height:48px;min-width:48px;padding:8px 22px;cursor:pointer;touch-action:manipulation;
  line-height:1.2;
}
.btn.primary{background:var(--pazapa-blue);border-color:var(--pazapa-blue);}
.btn.ghost{background:#fff;border-color:var(--pazapa-grey-dark);}
.btn.help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.btn:disabled,.btn[aria-disabled="true"].primary{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:var(--muted);cursor:not-allowed;}
.btn:focus-visible,.chunk:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt input:focus-visible+span,.chip input:focus-visible+span{outline:var(--ring);outline-offset:3px;}
.navrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center;}
.navrow .spacer{flex:1;}
.lang{font-size:.9rem;padding:6px 16px;min-height:48px;}
.lang[aria-pressed="true"]{background:var(--blue-tint);border-color:var(--pazapa-blue);}

/* strips (screen 1) */
.strip{display:flex;gap:14px;align-items:stretch;border-radius:var(--radius);background:var(--blue-tint);margin-bottom:12px;overflow:hidden;}
.strip:nth-child(even){background:var(--green-tint);}
.strip .pic{flex:0 0 132px;background:#FFF9EF;display:flex;align-items:center;justify-content:center;padding:6px;}
.strip .pic img{width:100%;height:auto;max-height:120px;object-fit:contain;display:block;}
.strip .txt{padding:10px 14px 10px 0;flex:1;min-width:0;}
.ctx{font-size:.8rem;font-weight:700;margin:0 0 2px;}
.sent{font-size:1.15rem;font-weight:700;margin:0 0 4px;overflow-wrap:anywhere;}
.var{background:var(--yellow-tint);border-bottom:3px dashed var(--pazapa-grey-dark);padding:0 4px;border-radius:4px;}
.vtag{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--pazapa-grey-dark);border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:middle;background:#fff;white-space:nowrap;}
.obs{font-size:.92rem;margin:0;}
.callout{background:var(--yellow-tint);border-radius:var(--radius);padding:12px 16px;margin-top:6px;}
.callout p:last-child{margin-bottom:0;}

/* items */
fieldset.item{border:0;margin:0 0 14px;padding:14px 16px;background:#fff;border-radius:var(--radius);border:2px solid var(--pazapa-grey-light);border-left:8px solid var(--pazapa-blue);min-width:0;}
fieldset.item.is-ok{background:var(--green-tint);border-left-color:var(--pazapa-green);}
legend{font-weight:800;padding:0 6px;font-size:1.02rem;max-width:100%;}
.slot{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--blue-tint);border:2px dashed var(--pazapa-blue);border-radius:10px;padding:8px;margin:6px 0 10px;}
.slot-empty{font-size:.9rem;color:var(--muted);}
.bank{display:flex;flex-wrap:wrap;gap:8px;background:var(--pazapa-grey-light);border-radius:10px;padding:8px;min-height:60px;}
.chunk{font-family:inherit;font-size:1rem;font-weight:700;min-height:48px;padding:8px 14px;border-radius:10px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;}
.chunk.placed{background:var(--pazapa-blue);border-color:var(--pazapa-blue);}
.chunk.locked{background:var(--green-tint);border-color:var(--pazapa-green);cursor:default;}
.pw{display:inline-flex;align-items:center;gap:3px;}
.mv{font-family:inherit;font-size:1.1rem;font-weight:800;width:48px;height:48px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);background:#fff;cursor:pointer;touch-action:manipulation;padding:0;}
.mv[aria-disabled="true"]{opacity:.35;cursor:default;}
.mv:focus-visible{outline:var(--ring);outline-offset:2px;}
.status{margin:10px 0 0;font-weight:700;font-size:.95rem;display:flex;gap:8px;align-items:flex-start;}
.status[hidden]{display:none;}
.status .ico{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;}
.status.ok .ico{background:var(--pazapa-green);}
.status.retry .ico{background:var(--pazapa-yellow);}
.status.info .ico{background:var(--blue-tint);border:2px solid var(--pazapa-blue);}
.status .body{flex:1;min-width:0;}
.sugg{margin-top:8px;background:var(--yellow-tint);border-radius:10px;padding:8px 12px;font-size:.92rem;}
.sugg b{display:block;font-size:.8rem;}
.showme{margin-top:8px;}
.summary{font-weight:700;margin:6px 0 0;min-height:24px;}

/* gaps */
.bankbox{background:var(--pazapa-grey-light);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;}
.bankbox .lab{font-weight:800;font-size:.9rem;margin:0 0 6px;}
.bankbox .words{display:flex;flex-wrap:wrap;gap:8px;}
.chunk.used{background:var(--blue-tint);}
.gapline{font-size:1.1rem;font-weight:700;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
input.gap{font:inherit;font-weight:700;width:9em;max-width:100%;min-height:48px;border:2px solid var(--pazapa-grey-dark);border-radius:10px;padding:6px 10px;background:#fff;color:var(--pazapa-grey-dark);}
input.gap[readonly]{background:var(--green-tint);}

/* choose */
.sitrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.sitrow img{width:120px;max-height:100px;object-fit:contain;background:#FFF9EF;border-radius:10px;padding:4px;}
.sitrow .q{flex:1;min-width:200px;font-weight:700;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt,.chip{display:block;position:relative;}
.opt input,.chip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;left:0;top:0;}
.opt span.lbl{display:block;min-height:48px;padding:10px 14px;border:2px solid var(--pazapa-blue);border-radius:10px;background:#fff;font-weight:700;}
.opt input:checked+span.lbl{background:var(--pazapa-blue);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip span.lbl{display:block;min-height:48px;padding:10px 16px;border:2px solid var(--pazapa-blue);border-radius:999px;background:#fff;font-weight:700;}
.chip input:checked+span.lbl{background:var(--pazapa-blue);}

/* screen 5 parts */
.part{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;}
.part > h3{display:flex;gap:10px;align-items:flex-start;}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--pazapa-blue);display:inline-flex;align-items:center;justify-content:center;font-weight:800;}
.introrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.introrow img{width:150px;max-height:130px;object-fit:contain;background:#FFF9EF;border-radius:var(--radius);padding:4px;}
.introrow div{flex:1;min-width:220px;}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--pazapa-grey-light);}
.mrow:last-of-type{border-bottom:0;}
.mrow label{font-weight:700;}
select{font:inherit;min-height:48px;border:2px solid var(--pazapa-grey-dark);border-radius:10px;padding:6px 10px;background:#fff;color:var(--pazapa-grey-dark);width:100%;max-width:460px;}
.rowflag{font-size:.9rem;font-weight:700;}
textarea{font:inherit;width:100%;min-height:110px;border:2px solid var(--pazapa-grey-dark);border-radius:10px;padding:10px;resize:vertical;color:var(--pazapa-grey-dark);background:#fff;}
textarea[readonly]{background:var(--green-tint);}
.inserts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.model{background:var(--blue-tint);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:700;}
.model[hidden]{display:none;}

.confirm{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;margin-top:14px;}
.confirm[hidden]{display:none;}
.finalpic{width:100%;max-width:300px;display:block;margin:0 auto 14px;border-radius:var(--radius);background:#FFF9EF;padding:6px;}
.donenote{font-weight:700;margin-top:10px;min-height:24px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (max-width:520px){
  .strip{flex-direction:column;}
  .strip .pic{flex:0 0 auto;padding:6px;}
  .strip .pic img{max-height:130px;}
  .strip .txt{padding:0 14px 12px;}
  body{font-size:16px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="brandline">Pazapa English Programme for Adults</div>
    <div class="titlerow">
      <div>
        <p class="eyebrow">Week 8 &middot; Lesson 2 &middot; Reading, listening, and writing check</p>
        <h1>Build Useful English</h1>

    </div>
    <div class="seg" id="seg" aria-hidden="true"></div>
    <p class="seglabel" id="segLabel" role="status">Screen 1 of 6</p>
  </header>
  <main id="stage"></main>
  <div id="live" class="sr-only" aria-live="polite" role="status"></div>
</div>

function el(tag, props, kids){
  var e = document.createElement(tag), k, v;
  if(props){
    for(k in props){
      v = props[k];
      if(v === false || v == null) continue;
      if(k === "class") e.className = v;
      else if(k === "text") e.textContent = v;
      else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
      else if(v === true) e.setAttribute(k, "");
      else e.setAttribute(k, v);
    }
  }
  (kids || []).forEach(function(c){
    if(c == null) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}
function bi(en, fr, tag, cls){
  var w = el(tag || "span", cls ? {class:cls} : null);
  w.appendChild(document.createTextNode(en));
  if(fr) w.appendChild(el("span", {class:"fr", lang:"fr"}, [fr]));
  return w;
}
function shuffle(a){
  var r = a.slice(), i, j, t;
  for(i = r.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
function norm(s){
  return String(s == null ? "" : s).normalize("NFKC")
    .replace(/[‘’ʼ`´]/g, "'")
    .replace(/\s+/g, " ").trim().toLowerCase();
}

function sentenceCount(raw){
  return norm(raw).split(/[.!?]+/).map(function(s){return s.trim();}).filter(Boolean).length;

function suggestFix(raw){
  var t = String(raw).replace(/\s+/g, " ").trim();
  if(!t) return "";
  var parts = t.match(/[^.!?]+[.!?]*/g) || [t];
  return parts.map(function(p){
    p = p.trim();
    if(!p) return "";
    p = p.charAt(0).toUpperCase() + p.slice(1);

  }).filter(Boolean).join(" ");

    case "order": return Array.isArray(v) && v.length === d.cfg.chunks.length;
    case "gap": return typeof v === "string" && v.trim() !== "";
    case "choose": return typeof v === "string" && v !== "";
    case "chip": return typeof v === "string" && v !== "";
    case "match":
      if(!v || typeof v !== "object") return false;
      return CONFIG.match.every(function(m){ return typeof v[m.id] === "string" && v[m.id] !== ""; });
    case "message": return typeof v === "string" && v.trim() !== "";
  }
  return false;
}
/* returns {ok, ...} */
function grade(id){
  var d = DEFS[id], v = it(id).v, r;
  switch(d.type){
    case "order":
      var good = d.cfg.answers.some(function(a){ return a.length === v.length && a.every(function(x,i){ return x === v[i]; }); });
      if(good) return {ok:true};
      var ans = d.cfg.answers[0], i = 0;
      while(i < v.length && v[i] === ans[i]) i++;
      var where = i === 0 ? 0 : (i >= v.length - 1 ? 2 : 1);
      return {ok:false, hint:[
        ["Check which part comes first.","Vérifiez quelle partie vient en premier."],
        ["Check the middle part.","Vérifiez la partie du milieu."],
        ["Check the last part.","Vérifiez la dernière partie."]][where]};
    case "gap":
      return d.cfg.ok.indexOf(normGap(v)) !== -1 ? {ok:true} : {ok:false, hint:d.cfg.hint};
    case "choose":
      var opt = d.cfg.opts.filter(function(o){ return o.id === v; })[0];
      return opt && opt.ok ? {ok:true} : {ok:false, hint:d.cfg.hint};
    case "chip":
      return v === d.cfg.ok ? {ok:true} : {ok:false, hint:["Look at the clue again.","Regardez encore l’indice."]};
    case "match":
      var bad = [];
      CONFIG.match.forEach(function(m){ if(v[m.id] !== m.phrase) bad.push(m.id); });
      return bad.length ? {ok:false, bad:bad, hint:["Check the rows marked.","Vérifiez les lignes marquées."]} : {ok:true};
    case "message":
      var t = norm(v), miss = [];
      if(!RE_TIME.test(t)) miss.push(0);
      if(!RE_REQ.test(t)) miss.push(1);
      var tooLong = sentenceCount(v) > 2;
      return {ok: miss.length === 0 && !tooLong, miss:miss, tooLong:tooLong};
  }
  return {ok:false};
}

    case "gap": return d.cfg.shown;
    case "choose": return d.cfg.opts.filter(function(o){return o.ok;})[0].id;

/* ---------------------------------------------------------------
   Persistence (lesson platform API + local storage)
---------------------------------------------------------------- */
var lmsApi = null, lmsVer = null, lmsReady = false;
let completionSent = false;
var uiDone = false;
var terminated = false;

function findApi(win){
  var n = 0;
  try{
    while(win && n < 12){
      try{ if(win.API_1484_11) return {api:win.API_1484_11, v:"2004"}; }catch(e1){}
      try{ if(win.API) return {api:win.API, v:"1.2"}; }catch(e2){}
      if(win.parent && win.parent !== win) win = win.parent; else break;
      n++;
    }
  }catch(e){}
  return null;
}
function detectApi(){
  if(lmsApi || terminated) return lmsApi;
  var f = findApi(window);
  if(!f){ try{ if(window.opener && window.opener !== window) f = findApi(window.opener); }catch(e){} }
  if(f){
    lmsApi = f.api; lmsVer = f.v;
    try{
      var r = lmsVer === "2004" ? lmsApi.Initialize("") : lmsApi.LMSInitialize("");
      var err = lmsVer === "2004" ? lmsApi.GetLastError() : lmsApi.LMSGetLastError();
      lmsReady = (r === "true" || r === true || String(err) === "103" || String(err) === "0");
    }catch(e){ lmsReady = false; }
  }
  return lmsApi;
}
function lget(k){ try{ return lmsVer === "2004" ? lmsApi.GetValue(k) : lmsApi.LMSGetValue(k); }catch(e){ return ""; } }
function lset(k, v){ try{ var r = lmsVer === "2004" ? lmsApi.SetValue(k, v) : lmsApi.LMSSetValue(k, v); return r === "true" || r === true; }catch(e){ return false; } }
function lcommit(){ try{ var r = lmsVer === "2004" ? lmsApi.Commit("") : lmsApi.LMSCommit(""); return r === "true" || r === true; }catch(e){ return false; } }
function lmsAlreadyDone(){
  if(!lmsApi || !lmsReady) return false;
  var a = lmsVer === "2004" ? lget("cmi.completion_status") : lget("cmi.core.lesson_status");
  var b = lmsVer === "2004" ? lget("cmi.success_status") : "";
  return a === "completed" || a === "passed" || b === "passed";
}
function buildSnapshot(){
  var items = {};
  Object.keys(S.items).forEach(function(id){
    var x = S.items[id];
    if(x.v == null && x.a === 0 && x.st === "u") return;
    items[id] = [x.v, x.a, x.st];
  });
  return {v:SCHEMA, s:S.screen, f:S.fr ? 1 : 0, d:S.done ? 1 : 0, i:items};
}
function saveProgress(){
  var json;
  try{ json = JSON.stringify(buildSnapshot()); }catch(e){ return; }
  try{ window.localStorage.setItem(STORE_KEY, json); }catch(e){}
  detectApi();
  if(lmsApi && lmsReady && !terminated){
    var limit = lmsVer === "2004" ? 60000 : 4000;
    if(json.length < limit){ lset("cmi.suspend_data", json); lcommit(); }
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProgress, 250);
}
function loadRaw(){
  var raw = null;
  detectApi();
  if(lmsApi && lmsReady){
    var sd = lget("cmi.suspend_data");
    if(sd){ try{ raw = JSON.parse(sd); }catch(e){ raw = null; } }
  }
  if(!raw){
    try{ var l = window.localStorage.getItem(STORE_KEY); if(l) raw = JSON.parse(l); }catch(e){ raw = null; }
  }
  return raw;
}
function clearSaved(){
  try{ window.localStorage.removeItem(STORE_KEY); }catch(e){}
  if(lmsApi && lmsReady && !terminated){ lset("cmi.suspend_data", ""); lcommit(); }
}

/* Validate and apply a stored snapshot against the current answer data */
function restore(raw){
  if(!raw || typeof raw !== "object" || raw.v !== SCHEMA) return;
  var items = raw.i && typeof raw.i === "object" ? raw.i : {};
  Object.keys(DEFS).forEach(function(id){
    var a = items[id]; if(!Array.isArray(a)) return;
    var d = DEFS[id], v = a[0], att = a[1], st = a[2];
    att = (typeof att === "number" && att >= 0 && att < 50) ? Math.floor(att) : 0;
    var okv = false, nv = null;
    switch(d.type){
      case "order":
        if(Array.isArray(v) && v.length <= d.cfg.chunks.length){
          var seen = {}; okv = v.every(function(x){ var g = typeof x === "number" && x >= 0 && x < d.cfg.chunks.length && !seen[x]; seen[x] = true; return g; });
          if(okv) nv = v.slice();
        } break;
      case "gap": if(typeof v === "string" && v.length < 40){ okv = true; nv = v; } break;
      case "choose": if(typeof v === "string" && d.cfg.opts.some(function(o){return o.id === v;})){ okv = true; nv = v; } break;
      case "chip": if(typeof v === "string" && d.cfg.chips.indexOf(v) !== -1){ okv = true; nv = v; } break;
      case "match":
        if(v && typeof v === "object"){
          nv = {}; okv = true;
          CONFIG.match.forEach(function(m){ var x = v[m.id]; if(typeof x === "string" && CONFIG.phrases[x]) nv[m.id] = x; });
        } break;
      case "message": if(typeof v === "string" && v.length <= CONFIG.message.max){ okv = true; nv = v; } break;
    }
    if(!okv) return;
    var item = it(id);
    item.v = nv; item.a = att;
    if(st === "r" && att >= 2){
      item.st = "r"; item.v = revealValue(id) && d.type !== "message" ? revealValue(id) : nv;
    } else if((st === "c" || st === "w") && isComplete(id)){
      item.st = grade(id).ok ? "c" : "u";
    } else item.st = "u";
  });
  S.fr = raw.f === 1;
  var reach = 1;
  for(var n = 2; n <= 5; n++){ if(screenValid(n)) reach = n + 1; else break; }
  var want = typeof raw.s === "number" ? Math.floor(raw.s) : 1;
  S.screen = Math.max(1, Math.min(want, reach, TOTAL));
  S.done = raw.d === 1 && allValid();
}

/* Completion */
function activityCompleted(){
  if(completionSent) return true;
  var api = detectApi(), ok = true;
  if(api && lmsReady && !terminated){
    ok = false;
    try{
      if(lmsAlreadyDone()){ ok = true; }
      else {
        if(lmsVer === "2004"){ lset("cmi.completion_status", "completed"); }
        else { lset("cmi.core.lesson_status", "completed"); }
        var c = lcommit();
        var back = lmsVer === "2004" ? lget("cmi.completion_status") : lget("cmi.core.lesson_status");
        ok = c && (back === "completed" || back === "passed" || back === "");
      }
    }catch(e){ ok = false; }
  }
  if(ok){ completionSent = true; }
  try{ window.localStorage.setItem(STORE_KEY + "_done", "1"); }catch(e){}
  try{ console.log("W08D2 Build Useful English completed"); }catch(e){}
  return ok;
}
function endSession(){
  if(terminated) return;
  saveProgress();
  if(uiDone && !completionSent) activityCompleted();
  if(lmsApi && lmsReady){
    try{ lcommit(); if(lmsVer === "2004") lmsApi.Terminate(""); else lmsApi.LMSFinish(""); }catch(e){}
    terminated = true;
  }
}

  CONFIG.build.forEach(function(cfg, idx){ sec.appendChild(orderItem(cfg, idx)); });
  var sum = el("p", {class:"summary", id:"sum2"});
  sec.appendChild(sum);
  sec.appendChild(navRow(2, true));

}
function orderItem(cfg, idx){
  var id = cfg.id, item = it(id);
  if(!bankOrder[id]){
    var base = cfg.chunks.map(function(x, i){ return i; }), tries = 0, o;
    do{ o = shuffle(base); tries++; }while(tries < 20 && o.join() === cfg.answers[0].join());
    bankOrder[id] = o;
  }
  var fs = el("fieldset", {class:"item"});
  var leg = el("legend"); leg.appendChild(document.createTextNode((idx + 1) + ". " + cfg.clue[0]));
  leg.appendChild(el("span", {class:"fr", lang:"fr"}, [cfg.clue[1]]));
  fs.appendChild(leg);
  var slot = el("div", {class:"slot"});
  var bank = el("div", {class:"bank"});
  var status = statusLine();
  var show = showMeBtn(id);
  fs.appendChild(slot); fs.appendChild(bank); fs.appendChild(status); fs.appendChild(show);
  UI[id] = {root:fs, status:status, show:show};
  var focusAfter = null;

  function draw(){
    var placed = Array.isArray(item.v) ? item.v : [];
    var locked = item.st === "r";
    slot.innerHTML = ""; bank.innerHTML = "";
    if(!placed.length){
      slot.appendChild(bi("Tap the parts below.", "Touchez les parties ci-dessous.", "span", "slot-empty"));
    }
    placed.forEach(function(ci, pos){
      var txt = cfg.chunks[ci];
      if(locked){
        slot.appendChild(el("span", {class:"chunk locked"}, [txt]));
        return;
      }
      var left = el("button", {type:"button", class:"mv", "data-f":"l" + pos, "aria-label":"Move " + txt + " left", "aria-disabled":String(pos === 0),
        onclick:function(){ if(pos > 0) move(pos, -1); }}, ["←"]);
      var chunk = el("button", {type:"button", class:"chunk placed", "data-f":"p" + pos, "aria-label":"Remove " + txt + ", position " + (pos + 1) + " of " + placed.length,
        onclick:function(){ remove(pos); }}, [txt]);
      var right = el("button", {type:"button", class:"mv", "data-f":"r" + pos, "aria-label":"Move " + txt + " right", "aria-disabled":String(pos === placed.length - 1),
        onclick:function(){ if(pos < placed.length - 1) move(pos, 1); }}, ["→"]);
      slot.appendChild(el("span", {class:"pw"}, [left, chunk, right]));
    });
    if(!locked){
      bankOrder[id].forEach(function(ci){
        if(placed.indexOf(ci) !== -1) return;
        bank.appendChild(el("button", {type:"button", class:"chunk", "data-f":"b" + ci, onclick:function(){ add(ci); }}, [cfg.chunks[ci]]));
      });
      if(!bank.children.length) bank.appendChild(bi("All parts are placed.", "Toutes les parties sont placées.", "span", "slot-empty"));
    } else {
      bank.appendChild(bi("This sentence was shown for you.", "Cette phrase vous a été montrée.", "span", "slot-empty"));
    }
    if(focusAfter){ var f = fs.querySelector('[data-f="' + focusAfter + '"]'); if(f) f.focus(); focusAfter = null; }
  }
  function add(ci){
    if(item.st === "r") return;
    if(!Array.isArray(item.v)) item.v = [];
    item.v.push(ci);
    focusAfter = "p" + (item.v.length - 1);
    changed(id); draw();
    announce(cfg.chunks[ci] + " added at position " + item.v.length + " of " + cfg.chunks.length + ".");
  }
  function remove(pos){
    var ci = item.v.splice(pos, 1)[0];
    focusAfter = "b" + ci;
    changed(id); draw();
    announce(cfg.chunks[ci] + " removed.");
  }
  function move(pos, dir){
    var np = pos + dir, t = item.v[pos];
    item.v[pos] = item.v[np]; item.v[np] = t;
    focusAfter = (dir < 0 ? "l" : "r") + np;
    changed(id); draw();
    announce(cfg.chunks[t] + " moved to position " + (np + 1) + " of " + item.v.length + ".");
  }
  UI[id].redraw = draw;
  draw();
  if(item.st === "c"){ setStatus(id, "ok", "Correct. That is a clear sentence.", "Correct. La phrase est claire."); }
  if(item.st === "r"){ setStatus(id, "info", "Shown for you: " + cfg.chunks.join(" "), "Voici la réponse."); }
  return fs;
}

/* Screen 3 */
function screen3(sec){
  sec.appendChild(heading(3, "Complete the useful English", "Complétez l’anglais utile"));
  sec.appendChild(bi("Type a word or tap a word from the bank. Use the clue.",
    "Écrivez un mot ou touchez un mot de la liste. Utilisez l’indice.", "p", "lede"));
  if(!gapBankOrder.length) gapBankOrder = shuffle(CONFIG.gapBank);
  var bankBox = el("div", {class:"bankbox"});
  bankBox.appendChild(bi("Word bank", "Liste de mots", "p", "lab"));
  var words = el("div", {class:"words", role:"group", "aria-label":"Word bank"});
  bankBox.appendChild(words);
  sec.appendChild(bankBox);
  var inputs = {}, lastGap = null;

  function refreshBank(){
    var used = {};
    CONFIG.gaps.forEach(function(g){ used[normGap(it(g.id).v)] = true; });
    words.querySelectorAll("button").forEach(function(b){
      var w = b.getAttribute("data-w");
      var isUsed = !!used[w];
      b.classList.toggle("used", isUsed);
      var sr = b.querySelector(".sr-only");
      if(sr) sr.textContent = isUsed ? " (used)" : "";
    });
  }
  gapBankOrder.forEach(function(w){
    var b = el("button", {type:"button", class:"chunk", "data-w":w, onclick:function(){
      var target = lastGap && it(lastGap).st !== "r" ? lastGap : null;
      if(!target){
        target = CONFIG.gaps.map(function(g){return g.id;}).filter(function(id){ return it(id).st !== "r" && !String(it(id).v || "").trim(); })[0];
      }
      if(!target){
        target = CONFIG.gaps.map(function(g){return g.id;}).filter(function(id){ return it(id).st !== "r" && it(id).st !== "c"; })[0];
      }
      if(!target){ announce("All gaps are complete."); return; }
      it(target).v = w; inputs[target].value = w;
      changed(target); refreshBank();
      announce(w + " placed in gap " + (CONFIG.gaps.map(function(g){return g.id;}).indexOf(target) + 1) + ".");
    }}, [w, el("span", {class:"sr-only"})]);
    words.appendChild(b);
  });

  CONFIG.gaps.forEach(function(cfg, idx){
    var id = cfg.id, item = it(id);
    var fs = el("fieldset", {class:"item"});
    var leg = el("legend"); leg.appendChild(document.createTextNode((idx + 1) + ". " + cfg.clue[0]));
    leg.appendChild(el("span", {class:"fr", lang:"fr"}, [cfg.clue[1]]));
    fs.appendChild(leg);
    var inp = el("input", {type:"text", class:"gap", id:"gap-" + id, "aria-label":"Gap " + (idx + 1), autocomplete:"off", autocapitalize:"none",
      autocorrect:"off", spellcheck:"false", maxlength:"20", value:typeof item.v === "string" ? item.v : ""});
    if(item.st === "r") inp.setAttribute("readonly", "");
    inp.addEventListener("input", function(){ item.v = inp.value; changed(id); refreshBank(); });
    inp.addEventListener("focus", function(){ lastGap = id; });
    inputs[id] = inp;
    var line = el("p", {class:"gapline"}, [cfg.pre, inp, cfg.post]);
    var status = statusLine(), show = showMeBtn(id);
    fs.appendChild(line); fs.appendChild(status); fs.appendChild(show);
    UI[id] = {root:fs, status:status, show:show, redraw:function(){
      inp.value = typeof item.v === "string" ? item.v : "";
      if(item.st === "r") inp.setAttribute("readonly", ""); else inp.removeAttribute("readonly");
      refreshBank();
    }};
    sec.appendChild(fs);
    if(item.st === "c") setStatus(id, "ok", "Correct.", "Correct.");
    if(item.st === "r") setStatus(id, "info", "Shown for you: “" + cfg.shown + "”.", "Voici la réponse.");
  });
  refreshBank();
  sec.appendChild(el("p", {class:"summary", id:"sum3"}));
  sec.appendChild(navRow(3, true));
  refreshNav(3);
}

function screen5(sec){

  if(!matchRowOrder.length) matchRowOrder = shuffle(CONFIG.match.map(function(m){ return m.id; }));
  if(!phraseOrder.length) phraseOrder = shuffle(Object.keys(CONFIG.phrases));
  var item1 = it("p1");

    sel.appendChild(el("option", {value:""}, ["Choose a phrase"]));

      if(item1.v[mid] === pk) op.selected = true;
      sel.appendChild(op);
    });
    if(item1.st === "r") sel.disabled = true;
    sel.addEventListener("change", function(){

    var lab = el("label", {for:"sel-" + mid}); lab.appendChild(document.createTextNode(m.meaning[0])); lab.appendChild(el("span", {class:"fr", lang:"fr"}, [m.meaning[1]]));

    flagRows([]);
  }};
  sec.appendChild(p1);
  flagRowsImpl = function(bad){
    CONFIG.match.forEach(function(m){
      var f = rowFlags[m.id]; f.textContent = "";
      if(bad && bad.indexOf(m.id) !== -1) f.textContent = "! Check this one.";
    });

  /* Part 2: details */
  var p2 = el("div", {class:"part"});

    fs.appendChild(leg);

      holder.appendChild(radioGroup("d-" + id, opts, item.v, item.st === "r", function(val){
