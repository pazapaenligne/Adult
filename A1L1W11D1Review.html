<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs and abilities — Review, Improve and Retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --muted:#4a4a48;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:"Open Sans",Arial,sans-serif;color:var(--pazapa-grey-dark);background:var(--pazapa-grey-light);line-height:1.55;font-size:1rem;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0;line-height:1.25;}
.app{max-width:820px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--pazapa-grey-light);}
.brand{font-weight:700;font-size:.95rem;}
.brand::before{content:"";display:inline-block;width:14px;height:14px;background:var(--pazapa-blue);border-radius:3px;margin-right:8px;vertical-align:-2px;}
.lang-btn{min-height:48px;min-width:48px;padding:8px 16px;border-radius:12px;border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;}
.lang-btn[aria-pressed="true"]{background:var(--pazapa-yellow);}
.partbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--blue-tint);font-size:.9rem;font-weight:700;}
.dots{display:flex;gap:6px;}
.dots i{display:block;width:18px;height:8px;border-radius:2px;background:#fff;border:1px solid var(--pazapa-grey-dark);}
.dots i.on{background:var(--pazapa-blue);}
.dots i.now{background:var(--pazapa-grey-dark);}
main{flex:1;padding:22px 20px 28px;}
main:focus{outline:none;}
.screen[hidden]{display:none;}
.screen h2{font-size:1.5rem;margin-bottom:8px;}
.screen h2:focus{outline:none;}
.lead{margin:0 0 16px;font-size:1.05rem;}
.fr{display:none;font-style:italic;color:var(--muted);font-weight:400;font-size:.92em;margin-top:2px;}
body.fr-on .fr{display:block;}
.btn .fr{color:inherit;font-size:.8em;font-weight:600;}
.hero{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:18px;}
@media(min-width:700px){.hero{grid-template-columns:1fr 1fr;align-items:start;}}
.film{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:var(--pazapa-grey-dark);border-radius:10px;}
.film figure{margin:0;background:#FBF6EE;border-radius:6px;padding:4px;text-align:center;}
.film img{width:100%;height:auto;aspect-ratio:358/475;object-fit:contain;display:block;}
.film figcaption{font-size:.72rem;font-weight:700;line-height:1.2;padding:2px 0 4px;}
.film .fr{font-size:.95em;margin-top:1px;}
.card{border:1px solid #d6d6d4;border-left:6px solid var(--pazapa-blue);border-radius:10px;padding:14px 16px;margin-bottom:16px;background:#fff;}
.card.good{border-left-color:var(--pazapa-green);background:var(--green-tint);}
.card.help{border-left-color:var(--pazapa-yellow);background:var(--yellow-tint);}
.card h3{font-size:1.08rem;margin-bottom:8px;}
.sub{font-size:1rem;margin-bottom:6px;}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin-bottom:8px;}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:10px 12px;margin-bottom:8px;border:2px solid var(--pazapa-grey-dark);border-radius:12px;background:#fff;cursor:pointer;touch-action:manipulation;}
.opt:hover{background:var(--blue-tint);}
.opt input{width:24px;height:24px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--pazapa-grey-dark);}
.opt.sel{background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--pazapa-blue);}
.opt .tag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:6px;background:var(--pazapa-yellow);font-size:.8rem;font-weight:700;}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:8px;border-left:6px solid transparent;font-size:.95rem;}
.fb:empty{display:none;}
.fb.ok{background:var(--green-tint);border-left-color:var(--pazapa-green);}
.fb.try{background:var(--yellow-tint);border-left-color:var(--pazapa-yellow);}
.fb b{font-weight:700;}
.btn{min-height:48px;min-width:48px;padding:10px 22px;border-radius:12px;border:2px solid var(--pazapa-grey-dark);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;text-align:center;}
.btn.sec{background:#fff;}
.btn.small{padding:8px 14px;}
.btn:disabled{background:#e2e2e0;color:#6b6b69;border-color:#b4b4b2;cursor:not-allowed;}
.btn[hidden]{display:none;}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 6px #fff;}
select,input[type=text],textarea{font:inherit;color:var(--pazapa-grey-dark);border:2px solid var(--pazapa-grey-dark);border-radius:10px;background:#fff;min-height:48px;padding:8px 12px;max-width:100%;}
textarea{width:100%;min-height:140px;resize:vertical;}
input[type=text]{width:9.5em;}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;}
.row label{font-weight:600;}
.meaning{font-weight:600;}
.sortrow{margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--pazapa-grey-dark);background:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation;}
.chip:hover{background:var(--blue-tint);}
.chip.static{cursor:default;border-style:solid;}
.sorter{display:flex;gap:8px;flex-wrap:wrap;}
.sorter .opt{margin:0;min-height:48px;}
.quote{margin:0 0 10px;padding:12px 14px;background:#FBF6EE;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;}
.cmp{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:700px){.cmp{grid-template-columns:1fr 1fr;}}
.cmp .card{margin:0;}
.situ{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.situ img{width:150px;height:auto;aspect-ratio:358/475;object-fit:contain;border-radius:8px;background:#FBF6EE;}
.situ .say{font-size:1.15rem;font-weight:700;margin:0 0 6px;}
.purpose{display:inline-block;padding:6px 12px;background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:6px;font-weight:700;}
.route{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.route .opt{margin:0;}
.hidden{display:none !important;}
.hintbox{margin-top:8px;}
.hintlist .fb{margin-top:8px;}
.build .row{margin-bottom:8px;}
.rec{border-top:1px dashed #9a9a98;padding-top:12px;margin-top:16px;}
.rec-status{min-height:1.5em;margin:6px 0 0;font-weight:600;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
footer.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #d6d6d4;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;align-items:center;}
.donenote{flex:1 1 100%;margin:0;text-align:right;font-weight:600;}
.donenote:empty{display:none;}
.big{font-size:1.2rem;font-weight:700;}
ul.plain{margin:0;padding-left:1.2rem;}
ul.plain li{margin-bottom:4px;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Pazapa English Programme for Adults</div>
    <button type="button" class="lang-btn" id="frBtn" aria-pressed="false">Français</button>
  </header>
  <div class="partbar"><span id="partLabel">Part 1 of 7</span><span class="dots" id="dots" aria-hidden="true"></span></div>

  <main id="main">
    <section class="screen" id="s1" aria-labelledby="h1"></section>
    <section class="screen" id="s2" aria-labelledby="h2" hidden></section>
    <section class="screen" id="s3" aria-labelledby="h3" hidden></section>
    <section class="screen" id="s4" aria-labelledby="h4" hidden></section>
    <section class="screen" id="s5" aria-labelledby="h5" hidden></section>
    <section class="screen" id="s6" aria-labelledby="h6" hidden></section>
    <section class="screen" id="s7" aria-labelledby="h7" hidden></section>
  </main>

  <div class="sr-only" id="live" role="status" aria-live="polite"></div>

  <footer class="nav">
    <p class="donenote" id="doneNote" role="status" aria-live="polite"></p>
    <button type="button" class="btn sec" id="tryBtn" hidden></button>
    <button type="button" class="btn" id="nextBtn"></button>
    <button type="button" class="btn" id="doneBtn" hidden></button>
  </footer>
</div>

/* ===== Deterministic checks =====
   Meaning parts (after normalising Unicode, spaces, case, apostrophes and end punctuation):
   job   : "I work as", "I am a/an", "I'm a/an", "my job is", or a lesson job word
   exp   : the word "experience"
   skill : "I can ...", "skills", "good at", "speak", "use a computer"
   goal  : "looking for work/a job" or "good at"
   polite: "thank you", "thanks", "please", "nice to meet you"
   Phrase groups: the six lesson phrases (any wording after the key phrase, fictional details accepted).
   These are simple word checks. They do not understand every possible English answer. */
var RE_JOB   = /\b(i work as|i am an?|i'm an?|my job is|teacher|assistant|driver|nurse|manager)\b/;
var RE_EXP   = /\bexperience\b/;
var RE_SKILL = /\bi can\b|\bskills?\b|\bgood at\b|\bspeak\b|\buse a computer\b/;
var RE_GOAL  = /\blooking for (work|a job)\b|\bgood at\b/;
var RE_POL   = /\b(thank you|thanks|nice to meet you|please)\b/;
var RE_PH = [ /\bi work as an? \w+/, /\bexperience with \w+/, /\bi can speak \w+/, /\bi can use a computer\b/, /\blooking for (work|a job)\b/, /\bgood at \w+/ ];

function analyse(raw){
  var t = norm(raw), a = {};
  a.jobPos = t.search(RE_JOB); a.expPos = t.search(RE_EXP); a.skillPos = t.search(RE_SKILL);
  a.job = a.jobPos>=0; a.exp = a.expPos>=0; a.skill = a.skillPos>=0;
  a.goal = RE_GOAL.test(t); a.polite = RE_POL.test(t);
  a.count = (a.job?1:0)+(a.exp?1:0)+(a.skill?1:0);
  var pos = [];
  if(a.job) pos.push(a.jobPos);
  if(a.exp) pos.push(a.expPos);
  if(a.skill) pos.push(a.skillPos);
  var ordered = pos.length>=2;
  for(var i=1;i<pos.length;i++){ if(pos[i]<=pos[i-1]) ordered = false; }
  a.ordered = ordered;
  a.hits = 0; for(var k=0;k<RE_PH.length;k++){ if(RE_PH[k].test(t)) a.hits++; }
  a.any = a.job||a.exp||a.skill||a.goal;
  return a;
}
var FOCUS_LABEL = {
  missing:T('Add missing information','Ajouter une information manquante'),
  order:T('Put the information in a clearer order','Mettre les informations dans un ordre plus clair'),

  phrase:T('Use words from the phrase bank.','Utilisez les mots de la banque de phrases.'),

};
function appliedFocus(a1, a2, focus){
  var out = [];
  focus.forEach(function(f){
    if(f==='missing' && a2.count>a1.count) out.push(f);
    else if(f==='order' && a2.ordered) out.push(f);
    else if(f==='phrase' && a2.hits>a1.hits) out.push(f);
    else if(f==='polite' && a2.polite && !a1.polite) out.push(f);
  });
  return out;
}
function supported(a1, a2){
  var s = [];
  if((a2.job||a2.goal) && (!(a1.job||a1.goal) || (a2.ordered && !a1.ordered))) s.push('purpose');
  if(a2.count>a1.count) s.push('complete');
  if(a2.hits>a1.hits) s.push('phrase');
  if(a2.polite && !a1.polite) s.push('polite');
  return s;
}

function vGoal(){ return S.goal==='A'; }

function vFirst(){ return typeof S.first==='string' && S.first.trim().length>=3; }
function vFocus(){ return S.focus.length>=1 && S.focus.length<=2; }
function vSecond(){
  if(!vFirst() || !S.second || !norm(S.second)) return false;
  if(norm(S.second)===norm(S.first)) return false;
  var det = appliedFocus(analyse(S.first), analyse(S.second), S.focus).length>0;
  return det || S.confirmFor===norm(S.second);
}

}

var lms = null;
function scan(win){
  var w = win, i = 0;
  while(w && i<12){
    try{ if(w.API_1484_11) return {v:'2004',api:w.API_1484_11}; }catch(e){}
    try{ if(w.API) return {v:'1.2',api:w.API}; }catch(e){}
    try{ if(w.parent && w.parent!==w){ w = w.parent; } else { break; } }catch(e){ break; }
    i++;
  }
  return null;
}
function findLMS(){
  var r = scan(window);
  if(!r){ try{ if(window.opener) r = scan(window.opener); }catch(e){} }
  return r;
}
function lmsInit(){
  if(lms) return true;
  var f = findLMS(); if(!f) return false;
  try{ if(f.v==='2004'){ f.api.Initialize(''); } else { f.api.LMSInitialize(''); } }catch(e){}
  lms = f; return true;
}
function lget(k){ try{ return String(lms.v==='2004' ? lms.api.GetValue(k) : lms.api.LMSGetValue(k)); }catch(e){ return ''; } }
function lset(k,v){ try{ var r = lms.v==='2004' ? lms.api.SetValue(k,v) : lms.api.LMSSetValue(k,v); return String(r)!=='false'; }catch(e){ return false; } }
function lcommit(){ try{ var r = lms.v==='2004' ? lms.api.Commit('') : lms.api.LMSCommit(''); return String(r)!=='false'; }catch(e){ return false; } }

  return lget('cmi.core.lesson_status');
}
function compactState(){
  return JSON.stringify({v:1, s:S.screen, g:S.goal, r:S.recall, h:S.hints, hu:S.hintUsed?1:0,
    d:S.draft.slice(0,500), f:S.first.slice(0,500), rt:S.route, fc:S.focus, m:S.modelUsed?1:0,
    sc:S.second.slice(0,500), cf:S.confirmFor.slice(0,500), im:S.improved, sp:S.spoke?1:0});
}
function str(x){ return (typeof x==='string') ? x.slice(0,500) : ''; }
function restore(raw){
  try{
    if(!raw || typeof raw!=='string' || raw.length>7000) return null;
    var o = JSON.parse(raw);
    if(!o || o.v!==1) return null;
    var s = fresh();
    s.screen = Math.max(1, Math.min(7, parseInt(o.s,10)||1));
    s.goal = (o.g==='A'||o.g==='B'||o.g==='C') ? o.g : '';
    if(o.r && typeof o.r==='object'){ ALL_IDS.forEach(function(id){ if(typeof o.r[id]==='string' && o.r[id]) s.recall[id]=o.r[id].slice(0,60); }); }
    if(o.h && typeof o.h==='object'){ ['t1','t2','t3'].forEach(function(k){ var n=parseInt(o.h[k],10)||0; s.hints[k]=Math.max(0,Math.min(HINTS[k].length,n)); }); }
    s.hintUsed = !!o.hu; s.draft = str(o.d); s.first = str(o.f);
    s.route = o.rt==='build' ? 'build' : 'type';
    s.focus = Array.isArray(o.fc) ? o.fc.filter(function(x,i,a){ return FOCUS_KEYS.indexOf(x)>=0 && a.indexOf(x)===i; }).slice(0,2) : [];
    s.modelUsed = !!o.m; s.second = str(o.sc); s.confirmFor = str(o.cf);
    s.improved = Array.isArray(o.im) ? o.im.filter(function(x,i,a){ return IMPROVE_KEYS.indexOf(x)>=0 && a.indexOf(x)===i; }) : [];
    s.spoke = !!o.sp;
    return s;
  }catch(e){ return null; }
}
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var data = compactState();
    try{ localStorage.setItem(STORE_KEY, data); }catch(e){}
    if(lmsInit()){ try{ lset('cmi.suspend_data', data.slice(0,3500)); lcommit(); }catch(e){} }
  }, 250);
}
function loadSaved(){
  var raw = '';
  if(lmsInit()){ raw = lget('cmi.suspend_data'); }
  var s = restore(raw);
  if(!s){ try{ s = restore(localStorage.getItem(STORE_KEY)); }catch(e){ s = null; } }
  return s;
}
function activityCompleted(){
  if(completionSent) return true;
  lmsInit();
  var ok = true;
  if(lms){
    var st = lmsStatus();
    if(st==='completed' || st==='passed'){ completionSent = true; try{ localStorage.setItem(DONE_KEY,'1'); }catch(e){} return true; }
    var tries = 0, good = false;
    while(tries<2 && !good){
      tries++;
      ok = lms.v==='2004' ? lset('cmi.completion_status','completed') : lset('cmi.core.lesson_status','completed');
      ok = lcommit() && ok;
      var after = lmsStatus();
      good = ok && (after==='completed' || after==='passed' || after==='');
    }
    ok = good;
  }
  try{ localStorage.setItem(DONE_KEY,'1'); }catch(e){}
  if(ok){ completionSent = true; try{ console.info(LOG_LABEL); }catch(e){} }
  return ok;
}

/* ===== Optional private recording (nothing is uploaded, stored or scored) ===== */
var recorders = [];
function cleanupRecorders(){ recorders.forEach(function(r){ try{ r.destroy(); }catch(e){} }); recorders = []; }
function Rec(el){
  var state='idle', stream=null, mr=null, chunks=[], url=null, audio=null, limit=null;
  var ok = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  el.innerHTML = '<h3 class="sub">'+T('Say it aloud (optional)','Dites-le à voix haute (facultatif)')+'</h3>'+
    '<div class="btnrow">'+
    '<button type="button" class="btn sec" data-a="rec">'+T('Record','Enregistrer')+'</button>'+
    '<button type="button" class="btn sec" data-a="stop" disabled>'+T('Stop','Arrêter')+'</button>'+
    '<button type="button" class="btn sec" data-a="play" disabled>'+T('Hear my recording','Écouter mon enregistrement')+'</button>'+
    '<button type="button" class="btn sec" data-a="again" disabled>'+T('Try again','Réessayer')+'</button></div>'+
    '<p class="rec-status" role="status" aria-live="polite"></p>';
  var bR=$('[data-a=rec]',el), bS=$('[data-a=stop]',el), bP=$('[data-a=play]',el), bA=$('[data-a=again]',el), st=$('.rec-status',el);
  function status(h){ st.innerHTML = h; }
  function ui(){
    bR.disabled = !ok || state==='recording' || state==='ready';
    bS.disabled = state!=='recording';
    bP.disabled = state!=='ready';
    bA.disabled = state!=='ready';
  }
  function releaseTracks(){ if(stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} stream = null; } }
  function dropUrl(){ if(url){ try{ URL.revokeObjectURL(url); }catch(e){} url = null; } if(audio){ try{ audio.pause(); }catch(e){} audio = null; } }
  function fail(kind){
    releaseTracks(); state='idle'; ui();
    var m = {
      denied:T('The microphone was not allowed. You can type your answer instead.','Le microphone n’est pas autorisé. Vous pouvez écrire votre réponse.'),
      missing:T('No microphone was found. You can type your answer instead.','Aucun microphone trouvé. Vous pouvez écrire votre réponse.'),
      empty:T('The recording was empty. Try again.','L’enregistrement était vide. Réessayez.'),
      other:T('Recording did not work. You can type your answer instead.','L’enregistrement n’a pas fonctionné. Vous pouvez écrire votre réponse.')
    };
    status(m[kind]||m.other);
  }
  function start(){
    dropUrl(); chunks = [];
    status(T('Asking for the microphone…','Demande d’accès au microphone…'));
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream = s;
      try{
        var types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'], mt = '';
        for(var i=0;i<types.length;i++){ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])){ mt = types[i]; break; } }
        mr = mt ? new MediaRecorder(stream,{mimeType:mt}) : new MediaRecorder(stream);
      }catch(e){ fail('other'); return; }
      mr.ondataavailable = function(ev){ if(ev.data && ev.data.size>0) chunks.push(ev.data); };
      mr.onerror = function(){ fail('other'); };
      mr.onstop = function(){
        releaseTracks(); clearTimeout(limit);
        var blob = new Blob(chunks, {type: (mr && mr.mimeType) || 'audio/webm'});
        if(!blob.size){ fail('empty'); return; }
        url = URL.createObjectURL(blob); state = 'ready'; ui();
        S.spoke = true; save();
        status(T('Recording stopped. Playback is ready.','Enregistrement arrêté. L’écoute est prête.'));
      };
      mr.start(); state = 'recording'; ui();
      status(T('Recording now. Press Stop when you finish.','Enregistrement en cours. Appuyez sur Arrêter quand vous avez fini.'));
      limit = setTimeout(function(){ if(state==='recording') stop(); }, 30000);
    }).catch(function(err){
      var n = err && err.name;
      if(n==='NotAllowedError' || n==='SecurityError' || n==='PermissionDeniedError') fail('denied');
      else if(n==='NotFoundError' || n==='DevicesNotFoundError' || n==='OverconstrainedError') fail('missing');
      else fail('other');
    });
  }
  function stop(){ try{ if(mr && mr.state!=='inactive') mr.stop(); }catch(e){ fail('other'); } }
  bR.addEventListener('click', function(){ if(ok && state==='idle') start(); });
  bS.addEventListener('click', stop);
  bP.addEventListener('click', function(){
    if(!url) return;
    try{
      if(audio){ audio.pause(); }
      audio = new Audio(url);
      audio.onended = function(){ status(T('Playback finished.','Écoute terminée.')); };
      audio.play().then(function(){ status(T('Playing your recording.','Lecture de votre enregistrement.')); }).catch(function(){ fail('other'); });
    }catch(e){ fail('other'); }
  });
  bA.addEventListener('click', function(){ dropUrl(); state='idle'; ui(); status(T('Ready. Press Record when you want to try again.','Prêt. Appuyez sur Enregistrer pour réessayer.')); });
  if(!ok){ status(T('Recording is not available in this browser. Type your answer instead.','L’enregistrement n’est pas disponible dans ce navigateur. Écrivez votre réponse.')); }
  ui();
  return { destroy:function(){ clearTimeout(limit); try{ if(mr && mr.state!=='inactive'){ mr.onstop = null; mr.stop(); } }catch(e){} releaseTracks(); dropUrl(); } };
}
function mountRec(root){ $$('[data-rec]', root).forEach(function(el){ recorders.push(Rec(el)); }); }

window.addEventListener('beforeunload', cleanupRecorders);

var NAV = {
  1:T('Start my review','Commencer ma révision'),
  2:T('Continue','Continuer'),
  3:T('Review my first try','Revoir ma première tentative'),
  4:T('Make my second try','Faire ma deuxième tentative'),
  5:T('Compare my tries','Comparer mes tentatives'),
  6:T('Finish review','Terminer la révision')
};
function canContinue(n){
  if(n===1) return vGoal();
  if(n===2) return vRecall();
  if(n===3) return S.draft.trim().length>=3;
  if(n===4) return vFocus();
  if(n===5) return vSecond();
  if(n===6) return vReflect();
  return false;
}
function updateNav(){
  var n = S.screen, next = $('#nextBtn'), tb = $('#tryBtn');
  tb.innerHTML = T('Try again','Réessayer');
  doneBtn.innerHTML = T('Done','Terminé');
  if(n===7){
    next.hidden = true; doneBtn.hidden = false; tb.hidden = false;
    doneBtn.disabled = doneUsed || !validAll();
  } else {
    next.hidden = false; doneBtn.hidden = true; tb.hidden = (n!==2);
    next.innerHTML = NAV[n]; next.disabled = !canContinue(n);
  }
  var dots = $$('#dots i');
  dots.forEach(function(d,i){ d.className = (i+1<n) ? 'on' : (i+1===n ? 'now' : ''); });
  $('#partLabel').innerHTML = T('Part '+n+' of 7','Partie '+n+' sur 7');
}
function goTo(n, focusHeading){
  n = Math.max(1, Math.min(7, n));
  for(var i=1;i<=7;i++){ $('#s'+i).hidden = (i!==n); }
  S.screen = n;
  if(n===4) enter4();
  if(n===5) enter5();
  if(n===6) enter6();
  if(n===7) enter7();
  if(n!==3 && n!==5) cleanupRecorders();
  $('#doneNote').innerHTML = '';
  updateNav(); save();
  window.scrollTo(0,0);
  if(focusHeading){ var h = $('#h'+n); if(h){ h.focus({preventScroll:true}); } }
  announce('Part '+n+' of 7.');
}
function next(){
  var n = S.screen;
  if(n>=7 || !canContinue(n)) return;
  if(n===3){ S.first = S.draft.trim(); }
  if(n===4){ /* focus is chosen */ }
  goTo(n+1, true);
}
function resetAll(){
  cleanupRecorders();
  S = fresh(); doneUsed = false; doneBtn.disabled = true;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  build1(); build2(); build3();
  goTo(1, true);
}

/* ===== Language (French support) ===== */
function setLang(on){
  document.body.classList.toggle('fr-on', on);
  var b = $('#frBtn'); b.setAttribute('aria-pressed', on?'true':'false');
  b.textContent = on ? 'English only' : 'Français';
  try{ localStorage.setItem(LANG_KEY, on?'1':'0'); }catch(e){}
}

/* ===== Init ===== */
function init(){
  var saved = loadSaved(); if(saved) S = saved;
  for(var i=0;i<7;i++){ $('#dots').appendChild(document.createElement('i')); }
  build1(); build2(); build3();
  bind2(); bind3(); bind5();
  $('#frBtn').addEventListener('click', function(){ var on = !document.body.classList.contains('fr-on'); setLang(on); announce(on?'French support on.':'French support off.'); });
  try{ if(localStorage.getItem(LANG_KEY)==='1') setLang(true); }catch(e){}
  $('#nextBtn').addEventListener('click', next);
  $('#tryBtn').addEventListener('click', function(){ if(S.screen===2) resetRecall(); else if(S.screen===7) resetAll(); });
  doneBtn.addEventListener('click', function(){
    if(doneBtn.disabled || doneUsed || S.screen!==7 || !validAll()) return;
    activityCompleted();
    doneUsed = true; doneBtn.disabled = true;
    $('#doneNote').innerHTML = T('Thank you. Your review is finished.','Merci. Votre révision est terminée.');
    announce('Done. Your review is finished.');
  });
  var start = Math.min(S.screen, maxScreen());
  if(start<1) start = 1;
  goTo(start, false);
}
init();
})();

</script>
</body>
</html>
