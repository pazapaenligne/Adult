<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission - Invitations and arrangements</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF6D6;
  --ink:#2E2E2D;
  --muted:#4d4e4a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Open Sans",Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.55;font-size:1rem;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 8px 0;line-height:1.25;}
h1{font-size:1.6rem;} h2{font-size:1.4rem;} h3{font-size:1.05rem;}
.app{max-width:760px;margin:0 auto;padding:14px 16px 48px 16px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0 12px 0;border-bottom:4px solid var(--pazapa-blue);margin-bottom:14px;}
.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:.95rem;}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.progress{font-size:.9rem;background:var(--pazapa-grey-light);border-radius:999px;padding:6px 14px;white-space:nowrap;}
.progress-track{display:flex;gap:6px;margin-bottom:16px;}
.progress-dot{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
.progress-dot.done{background:var(--pazapa-blue);}
.progress-dot.current{background:var(--pazapa-yellow);}
button{font-family:inherit;touch-action:manipulation;}
.lang-btn{min-height:48px;min-width:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--ink);font-weight:700;font-size:.95rem;cursor:pointer;}
.lang-btn[aria-pressed="true"]{background:var(--pazapa-blue);}
.screen{outline:none;}
.card{background:var(--blue-tint);border-radius:16px;padding:20px;margin-bottom:16px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.lead{font-size:1.1rem;margin:0 0 14px 0;}
.sub{color:var(--muted);font-size:.97rem;margin:0 0 12px 0;}
.illus{display:block;max-width:100%;width:190px;height:auto;max-height:240px;object-fit:contain;margin:0 auto 12px auto;}
.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.mission-item{background:#fff;border:2px solid var(--pazapa-blue);border-radius:14px;padding:12px 14px;}
.mission-item .k{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;color:var(--ink);display:block;margin-bottom:2px;}
.mission-item .k::before{content:"";display:inline-block;width:10px;height:10px;background:var(--pazapa-blue);border-radius:2px;margin-right:8px;}
.goal{background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:14px;padding:14px 16px;margin-top:6px;}
.goal strong{display:block;margin-bottom:4px;}
.phone{background:#fff;border:3px solid var(--pazapa-blue);border-radius:22px;padding:14px 16px;margin:0 0 14px 0;}
.phone .bubble{background:var(--pazapa-grey-light);border-radius:14px 14px 14px 4px;padding:10px 12px;margin:6px 0;}
.phone .who{font-weight:700;font-size:.9rem;}
.phrase-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
button.phrase{text-align:left;background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:10px 12px;min-height:56px;cursor:pointer;color:var(--ink);font-size:1rem;}
button.phrase:hover{background:var(--blue-tint);}
button.phrase[aria-pressed="true"]{background:var(--blue-tint);border-width:4px;padding:8px 10px;}
button.phrase.right{border-color:#3e7d17;background:var(--green-tint);}
button.phrase.wrong{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
button.phrase[disabled]{cursor:default;}
.fr{display:block;font-size:.88rem;color:var(--muted);font-style:italic;margin-top:2px;}
.tag{display:inline-block;font-size:.78rem;font-weight:700;margin-top:4px;}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dot-y{background:var(--pazapa-yellow);} .dot-g{background:#3e7d17;}
.feedback{min-height:24px;font-weight:700;margin:8px 0;}
.panel{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;margin:10px 0;}
.panel.help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
fieldset{border:2px solid var(--pazapa-blue);border-radius:14px;margin:12px 0;padding:10px 14px 14px 14px;background:#fff;}
legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;padding:0 8px;}
label{font-weight:700;font-size:.93rem;display:block;margin-bottom:4px;}
select,textarea{font-family:inherit;font-size:1rem;width:100%;padding:10px;border-radius:10px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--ink);min-height:48px;}
textarea{min-height:120px;resize:vertical;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px 0;}
button.chip{min-height:48px;padding:8px 14px;border-radius:999px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--ink);cursor:pointer;font-size:.97rem;}
button.chip[aria-pressed="true"]{background:var(--pazapa-blue);font-weight:700;}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
button.tray-item{min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--pazapa-green);background:var(--green-tint);color:var(--ink);cursor:pointer;text-align:left;font-size:.97rem;}
button.starter{min-height:48px;padding:8px 14px;border-radius:12px;border:2px dashed var(--pazapa-blue);background:#fff;color:var(--ink);cursor:pointer;font-size:.97rem;}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0;}
button.btn{min-height:48px;padding:10px 20px;border-radius:999px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;}
button.btn.main{background:var(--pazapa-blue);}
button.btn.rec.active{background:var(--pazapa-green);border-color:var(--pazapa-green);}
button.btn[disabled]{opacity:.45;cursor:not-allowed;}
button.btn.done-state{background:var(--pazapa-green);border-color:var(--pazapa-green);}
.mode-switch{display:flex;gap:8px;margin:8px 0 12px 0;}
.mode-switch button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;}
.mode-switch button[aria-pressed="true"]{background:var(--pazapa-blue);}
.status{font-size:.93rem;color:var(--muted);margin:6px 0;}
.count{font-size:.88rem;color:var(--muted);text-align:right;}
audio{width:100%;margin-top:10px;}
.checks{list-style:none;margin:10px 0;padding:0;}
.checks li{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:8px 12px;margin-bottom:8px;}
.checks label{display:flex;gap:12px;align-items:flex-start;font-weight:700;margin:0;min-height:48px;padding:6px 0;cursor:pointer;}
.checks input[type=checkbox]{width:28px;height:28px;flex:0 0 28px;margin-top:2px;accent-color:#2E2E2D;}
.checks .eg{display:block;font-weight:400;color:var(--muted);font-size:.93rem;}
.meaning{list-style:none;margin:6px 0;padding:0;}
.meaning li{padding:4px 0;}
.nav-row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px;margin-top:20px;}
button.nav{min-height:48px;padding:12px 26px;border-radius:999px;border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;}
button.nav[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6c68;cursor:not-allowed;}
button.nav.alt{background:#fff;}
button.nav.alt[disabled]{background:#fff;border-color:var(--pazapa-grey-light);}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (max-width:560px){.mission-grid,.phrase-grid{grid-template-columns:1fr;}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="brand">Pazapa English Programme for Adults</div>
    <div class="top-right">
      <button type="button" class="lang-btn" id="langBtn" aria-pressed="false">Français</button>
      <div class="progress" id="progressLabel"></div>
    </div>
  </div>
  <div class="progress-track" id="progressTrack" aria-hidden="true"></div>
  <main id="screen" class="screen" tabindex="-1"></main>
  <div class="feedback" id="liveRegion" role="status" aria-live="polite"></div>
  <div class="nav-row" id="navRow"></div>
</div>

var GROUPS = {
  thanks:[/\bthank(s| you)?\b/],
  notAvailable:[/not available/, /unavailable/, /\bbusy\b/, /not free/, /(can ?not|can't|cant|can not|won't) (come|make it|join)/, /\bsorry\b/],

function normalise(s){
  var x = String(s||"");
  try{ x = x.normalize("NFKC"); }catch(e){}
  x = x.replace(/[‘’ʼ`´]/g,"'").toLowerCase();
  x = x.replace(/\s+/g," ").trim();
  x = x.replace(/[.!?,;:]+$/,"");
  return x;
}
function meaningCheck(text){
  var n = normalise(text), res = {};
  Object.keys(GROUPS).forEach(function(g){
    res[g] = GROUPS[g].some(function(re){ return re.test(n); });
  });
  return res;
}

var lms = {api:null, ver:null, ready:false, locked:false};
function findAPIin(win){
  var tries = 0;
  while(win && tries < 12){
    try{
      if(win.API_1484_11) return {api:win.API_1484_11, ver:"2004"};
      if(win.API) return {api:win.API, ver:"1.2"};
    }catch(e){}
    var next = null;
    try{ next = (win.parent && win.parent !== win) ? win.parent : null; }catch(e2){ next = null; }
    win = next; tries++;
  }
  return null;
}
function discoverLMS(){
  if(lms.api) return true;
  var found = null;
  try{ found = findAPIin(window); }catch(e){}
  if(!found){ try{ if(window.opener && !window.opener.closed){ found = findAPIin(window.opener); } }catch(e2){} }
  if(found){
    lms.api = found.api; lms.ver = found.ver;
    try{
      var r = lms.ver==="2004" ? lms.api.Initialize("") : lms.api.LMSInitialize("");
      lms.ready = (r===true || r==="true" || r==="1");
      if(!lms.ready){ lms.ready = true; }  /* some LMSs are already initialised */
    }catch(e3){ lms.api = null; lms.ready=false; return false; }
    return true;
  }
  return false;
}
function lmsGet(key){ try{ return lms.ver==="2004" ? lms.api.GetValue(key) : lms.api.LMSGetValue(key); }catch(e){ return ""; } }
function lmsSet(key,val){ try{ return lms.ver==="2004" ? lms.api.SetValue(key,val) : lms.api.LMSSetValue(key,val); }catch(e){ return "false"; } }
function lmsCommit(){ try{ return lms.ver==="2004" ? lms.api.Commit("") : lms.api.LMSCommit(""); }catch(e){ return "false"; } }

function compactState(){
  return JSON.stringify({v:1, s:state.screen, sel:state.sel, ck:state.checked?1:0, ca:state.checkAttempts,
    pl:state.plan, m:state.mode, r:state.resp, sp:state.spoke?1:0, c:state.chk.map(function(b){return b?1:0;}),
    rs:state.reviewedSig, a:state.attempts, h:state.help, mo:state.model, l:lang});
}
function saveProgress(){
  var data = compactState();
  try{ localStorage.setItem(STORAGE_KEY, data); }catch(e){}
  if(discoverLMS() && lms.api){
    if(data.length > 3800){ data = JSON.stringify({v:1,s:state.screen,sel:state.sel,ck:state.checked?1:0,pl:state.plan,r:state.resp.slice(0,250)}); }
    lmsSet("cmi.suspend_data", data);
    lmsCommit();
  }
}
function loadProgress(){
  var raw = null;
  if(discoverLMS() && lms.api){ raw = lmsGet("cmi.suspend_data"); }
  if(!raw){ try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){} }
  if(!raw) return;
  var d;
  try{ d = JSON.parse(raw); }catch(e){ return; }
  if(!d || d.v !== 1 || typeof d !== "object") return;
  var s = freshState();
  try{
    if(Array.isArray(d.sel)){ s.sel = d.sel.filter(function(id){ return !!phraseById(id); }).slice(0,3); }
    s.checked = d.ck===1; s.checkAttempts = +d.ca||0;
    if(d.pl && typeof d.pl==="object"){
      ["open","key","close","greet","day","time"].forEach(function(k){ if(typeof d.pl[k]==="string") s.plan[k]=d.pl[k].slice(0,40); });
    }
    s.mode = d.m==="speak" ? "speak" : "type";
    if(typeof d.r==="string") s.resp = d.r.slice(0,MAX_CHARS);
    s.spoke = d.sp===1;
    if(Array.isArray(d.c)){ s.chk = [0,1,2,3].map(function(i){ return d.c[i]===1; }); }
    if(typeof d.rs==="string") s.reviewedSig = d.rs.slice(0,600);
    s.attempts = +d.a||0; s.help = +d.h||0; s.model = +d.mo||0;
    s.screen = Math.min(Math.max(+d.s||1,1),TOTAL_SCREENS);
    if(d.l==="fr") lang="fr";
  }catch(e2){ return; }
  /* a restored "checked" must match the stored picks */
  var good = s.sel.filter(function(id){ var p=phraseById(id); return p&&p.ok; });
  if(s.checked && good.length!==3){ s.checked=false; }
  /* spoke flag is only a private choice, safe to keep; recordings are never restored */
  state = s;
  /* revalidate against current requirements rather than trusting saved flags */
  var allowed = maxAllowedScreen();
  if(state.screen > allowed) state.screen = allowed;
}

/* Completion: read status, never downgrade, set -> commit -> verify -> lock */
function activityCompleted(){
  if(lms.locked) return true;
  var ok = false;
  if(discoverLMS() && lms.api){
    var cur12 = "", cur04c = "", cur04s = "";
    if(lms.ver==="2004"){ cur04c = String(lmsGet("cmi.completion_status")||""); cur04s = String(lmsGet("cmi.success_status")||""); }
    else { cur12 = String(lmsGet("cmi.core.lesson_status")||""); }
    var already = (lms.ver==="2004") ? (cur04c==="completed" || cur04s==="passed") : (cur12==="completed" || cur12==="passed");
    if(!already){
      if(lms.ver==="2004"){ lmsSet("cmi.completion_status","completed"); }
      else { lmsSet("cmi.core.lesson_status","completed"); }
    }
    lmsCommit();
    var verify = (lms.ver==="2004") ? String(lmsGet("cmi.completion_status")||"") : String(lmsGet("cmi.core.lesson_status")||"");
    ok = already || verify==="completed" || verify==="passed" || verify==="";
    if(ok) lms.locked = true;
  } else {
    try{ localStorage.setItem(STORAGE_KEY+"_completed","1"); ok = true; }catch(e){ ok = true; }
  }
  try{ console.log(LOG_LABEL); }catch(e3){}
  return ok;
}

var recorder = null, recStream = null, chunks = [], recUrl = null, recTimer = null, recSeconds = 0, startPending = false;
var audioEl = null;

function pickMime(){
  var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  if(!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== "function") return "";
  for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return "";
}
function revokeUrl(){ if(recUrl){ try{ URL.revokeObjectURL(recUrl); }catch(e){} recUrl = null; } }
function releaseStream(){ if(recStream){ try{ recStream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){} recStream = null; } }
function clearTimer(){ if(recTimer){ clearInterval(recTimer); recTimer = null; } }
function stopPlayback(){ var a = document.getElementById("recPlayer"); if(a){ try{ a.pause(); }catch(e){} } }
function stopRecordingHard(){
  clearTimer();
  try{ if(recorder && recorder.state !== "inactive"){ recorder.onstop = null; recorder.stop(); } }catch(e){}
  releaseStream(); recorder = null; startPending = false;
}
function supportState(){
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return "unsupported";
  return "ok";
}
function setRec(stateName, msgKey){
  rt.recState = stateName; rt.msgKey = msgKey; updateSpeakUI();
}
function startRecording(){
  if(rt.recState==="recording" || startPending) return;
  if(supportState()!=="ok"){ setRec("error","recUnsup"); return; }
  stopPlayback();
  startPending = true;
  setRec("asking","recAsk");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    startPending = false;
    recStream = stream; chunks = [];
    var mime = pickMime();
    try{ recorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(e){ releaseStream(); setRec("error","recFail"); return; }
    var thisRecorder = recorder;
    recorder.ondataavailable = function(e){ if(e.data && e.data.size>0) chunks.push(e.data); };
    recorder.onstop = function(){
      clearTimer(); releaseStream();
      if(thisRecorder !== recorder) return;
      var type = thisRecorder.mimeType || mime || "audio/mp4";
      var blob = new Blob(chunks,{type:type});
      chunks = []; recorder = null;
      if(!blob.size){ rt.hasRecording=false; revokeUrl(); setRec("error","recEmpty"); return; }
      revokeUrl();
      recUrl = URL.createObjectURL(blob);
      rt.hasRecording = true;
      setRec("ready","recReady");
      afterOutputChange();
    };
    recorder.onerror = function(){
      clearTimer(); releaseStream(); recorder=null;
      setRec("error","recFail");
    };
    try{ recorder.start(); }catch(e2){ releaseStream(); recorder=null; setRec("error","recFail"); return; }
    rt.hasRecording = false; revokeUrl(); recSeconds = 0;
    setRec("recording","recGoing");
    recTimer = setInterval(function(){ recSeconds++; updateSpeakUI(); }, 1000);
  }).catch(function(err){
    startPending = false;
    var n = err && err.name ? err.name : "";
    if(n==="NotAllowedError" || n==="PermissionDeniedError" || n==="SecurityError") setRec("error","recDenied");
    else if(n==="NotFoundError" || n==="DevicesNotFoundError") setRec("error","recNoDev");
    else setRec("error","recFail");
  });
}
function stopRecording(){
  if(rt.recState!=="recording" || !recorder) return;
  try{ if(recorder.state!=="inactive") recorder.stop(); }catch(e){ releaseStream(); setRec("error","recFail"); }
}

function updateSpeakUI(){

/* ================= NAV ================= */
function buildNav(){
  var sc = state.screen, h = "";
  if(sc===1){ h = '<button type="button" class="nav" id="nextBtn">'+esc(t("cont"))+'</button>'; }
  else if(sc===2){ h = '<button type="button" class="nav" id="nextBtn">'+esc(t("cont"))+'</button>'; }
  else if(sc===3){ h = '<button type="button" class="nav" id="nextBtn">'+esc(t("cont"))+'</button>'; }
  else if(sc===4){ h = '<button type="button" class="nav" id="nextBtn">'+esc(t("review"))+'</button>'; }
  else if(sc===5){ h = '<button type="button" class="nav" id="nextBtn">'+esc(t("finish"))+'</button>'; }
  else {
    h = '<button type="button" class="nav alt" id="fullTryBtn">'+esc(t("tryAgain"))+'</button>'+
        '<button type="button" class="nav" id="doneBtn">'+esc(completionSent ? t("doneOk") : t("done"))+'</button>';
  }
  $nav.innerHTML = h;
  doneBtn = document.getElementById("doneBtn");
  if(doneBtn){
    doneBtn.disabled = true;
    doneBtn.disabled = !(sc===6 && reviewedValid());
    if(completionSent){ doneBtn.classList.add("done-state"); doneBtn.textContent = t("doneOk")+" ✓"; }
  }
  var next = document.getElementById("nextBtn");
  if(next){ next.addEventListener("click", onNext); }
  var ft = document.getElementById("fullTryBtn");
  if(ft){ ft.addEventListener("click", fullReset); }
  if(doneBtn){ doneBtn.addEventListener("click", onDone); }
  updateNextState();
}
function updateNextState(){
  var next = document.getElementById("nextBtn"); if(!next) return;
  var sc = state.screen, ok = true;
  if(sc===2) ok = state.checked;
  else if(sc===3) ok = planComplete();
  else if(sc===4) ok = produced() && rt.recState!=="recording" && rt.recState!=="asking";
  else if(sc===5) ok = reviewedValid();
  next.disabled = !ok;
}
function updateReviewBtn(){ if(state.screen===4) updateNextState(); }

function goTo(n, focus){
  state.screen = n;
  saveProgress();
  render(focus!==false);
}
function onNext(){
  var sc = state.screen;
  if(sc===1){ goTo(2); return; }
  if(sc===2 && state.checked){ goTo(3); return; }
  if(sc===3 && planComplete()){ goTo(4); return; }
  if(sc===4 && produced()){ stopPlayback(); runReview(); goTo(5); return; }
  if(sc===5 && reviewedValid()){ goTo(6); return; }
}
function onDone(){
  if(completionSent) return;
  if(state.screen!==6 || !reviewedValid()) return;
  var ok = activityCompleted();
  if(ok){
    completionSent = true;
    doneBtn.classList.add("done-state");
    doneBtn.textContent = t("doneOk")+" ✓";
    announce(t("doneNote"));
  }
}
function fullReset(){
  stopPlayback(); stopRecordingHard(); revokeUrl();
  rt = {recState:"idle", hasRecording:false, msgKey:"recIdle", notice:""};
  state = freshState();
  completionSent = false;
  reshuffle();
  saveProgress();
  announce("");
  render(true);
}

/* ================= WIRING ================= */
function afterOutputChange(){
  /* output/plan changes invalidate an earlier review until it is run again */
  saveProgress();
  updateNextState();
}
function wire(sc){
  if(sc===2){
    Array.prototype.forEach.call(document.querySelectorAll("[data-phrase]"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-phrase");
        var i = state.sel.indexOf(id);
        if(state.checked) return;
        if(i>-1){ state.sel.splice(i,1); }
        else if(state.sel.length<3){ state.sel.push(id); }
        else { document.getElementById("s2Fb").textContent = t("s2Lead"); }
        renderKeep();
      });
    });
    document.getElementById("checkBtn").addEventListener("click", function(){
      var fb = document.getElementById("s2Fb");
      if(state.checked) return;
      if(state.sel.length!==3){ fb.textContent = t("pick3"); announce(t("pick3")); return; }
      state.checkAttempts++;
      var good = state.sel.filter(function(id){ return phraseById(id).ok; }).length;
      if(good===3){ state.checked = true; saveProgress(); renderKeep(); document.getElementById("s2Fb").textContent = t("allRight"); announce(t("allRight")); updateNextState(); return; }
      if(state.checkAttempts>=2){
        state.sel = PHRASES.filter(function(p){return p.ok;}).map(function(p){return p.id;});
        state.checked = true; state.help++;
        saveProgress(); renderKeep(); document.getElementById("s2Fb").textContent = t("showUseful"); announce(t("showUseful")); updateNextState(); return;
      }
      saveProgress(); renderKeep();
      document.getElementById("s2Fb").textContent = t("someWrong"); announce(t("someWrong"));
    });
    document.getElementById("s2Try").addEventListener("click", function(){
      state.sel = []; state.checked = false; state.checkAttempts = 0;
      state.plan = {open:"",key:"",close:"",greet:state.plan.greet,day:state.plan.day,time:state.plan.time};
      reshuffle(); saveProgress(); render(false);
      document.getElementById("s2Fb").textContent = "";
    });
  }
  if(sc===3){
    Array.prototype.forEach.call(document.querySelectorAll("select[data-plan]"), function(s){
      s.addEventListener("change", function(){ state.plan[s.getAttribute("data-plan")] = s.value; afterOutputChange(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-chip]"), function(c){
      c.addEventListener("click", function(){
        var name = c.getAttribute("data-chip"), val = c.getAttribute("data-val");
        state.plan[name] = (state.plan[name]===val) ? "" : val;
        saveProgress();
        Array.prototype.forEach.call(document.querySelectorAll('[data-chip="'+name+'"]'), function(o){ o.setAttribute("aria-pressed", o.getAttribute("data-val")===state.plan[name] ? "true":"false"); });
      });
    });
    document.getElementById("exBtn").addEventListener("click", function(){
      state.example = !state.example;
      if(state.example) state.help++;
      document.getElementById("exPanel").hidden = !state.example;
      this.setAttribute("aria-expanded", state.example?"true":"false");
      this.textContent = t(state.example?"hideEx":"showEx");
      saveProgress();
    });
  }
  if(sc===4){ wire4(); }
  if(sc===5){ wire5(); }
}
function renderKeep(){
  var y = window.pageYOffset;
  var fb = document.getElementById("s2Fb") ? document.getElementById("s2Fb").textContent : "";
  var active = document.activeElement ? document.activeElement.getAttribute("data-phrase") : null;
  render(false);
  window.scrollTo(0,y);
  var f = document.getElementById("s2Fb"); if(f) f.textContent = fb;
  if(active){ var el = document.querySelector('[data-phrase="'+active+'"]'); if(el) el.focus(); }
}
function insertText(box, text){
  var cur = box.value;
  var sep = cur && !/\s$/.test(cur) ? " " : "";
  var add = text.replace(/ \.\.\.$/,"").replace(/\.\.\.$/,"");
  box.value = (cur + sep + add).slice(0, MAX_CHARS);
  box.dispatchEvent(new Event("input",{bubbles:true}));
  box.focus();
}
function wire4(){
  var box = document.getElementById("respBox");
  var count = document.getElementById("charCount");
  function upd(){ count.textContent = t("chars",{n:box.value.length,m:MAX_CHARS}); }
  upd();
  box.addEventListener("input", function(){ state.resp = box.value; upd(); afterOutputChange(); });
  var langWatcher = null;
  function setMode(m){
    state.mode = m;
    document.getElementById("modeSpeak").setAttribute("aria-pressed", m==="speak"?"true":"false");
    document.getElementById("modeType").setAttribute("aria-pressed", m==="type"?"true":"false");
    document.getElementById("speakPanel").hidden = (m!=="speak");
    document.getElementById("typePanel").hidden = (m!=="type");
    announce(m==="speak" ? t("speak") : t("type"));
    saveProgress();
  }
  document.getElementById("modeSpeak").addEventListener("click", function(){ setMode("speak"); });
  document.getElementById("modeType").addEventListener("click", function(){ setMode("type"); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-insert]"), function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-insert");
      /* text is added to the typed box, so the planned content stays shared between Speak and Type */
      insertText(box, en(id));
    });
  });
  document.getElementById("addPlanBtn").addEventListener("click", function(){ insertText(box, planSummaryText()); });
  document.getElementById("recBtn").addEventListener("click", startRecording);
  document.getElementById("stopBtn").addEventListener("click", stopRecording);
  document.getElementById("hearBtn").addEventListener("click", hearRecording);
  document.getElementById("retryRecBtn").addEventListener("click", tryAgainRecording);
  document.getElementById("speakAloudBtn").addEventListener("click", function(){
    state.spoke = !state.spoke; saveProgress(); updateSpeakUI();
    announce(state.spoke ? t("speakAloudDone") : "");
  });
  var player = document.getElementById("recPlayer");
  if(rt.hasRecording && recUrl){ player.src = recUrl; player.setAttribute("data-src", recUrl); player.style.display = "block"; }
  player.addEventListener("ended", function(){ if(rt.recState!=="recording"){ rt.msgKey="recReady"; updateSpeakUI(); } });
  /* never play and record at the same time */
  player.addEventListener("play", function(){ if(rt.recState==="recording"){ player.pause(); } });
  updateSpeakUI();
  updateNextState();
}
function wire5(){
  var fb = document.getElementById("fbArea");
  fb.innerHTML = feedbackHtml();
  wireFbExtras();
  var box = document.getElementById("respBox5");
  if(box){
    var cnt = document.getElementById("charCount5");
    var updc = function(){ cnt.textContent = t("chars",{n:box.value.length,m:MAX_CHARS}); };
    updc();
    box.addEventListener("input", function(){
      state.resp = box.value; updc();
      if(!reviewedValid()){ announce(t("changed")); }
      saveProgress(); updateNextState();
    });
    document.getElementById("checkAgainBtn").addEventListener("click", function(){
      if(!state.resp.trim()){ return; }
      runReview();
      fb.innerHTML = feedbackHtml(); wireFbExtras();
      updateNextState();
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-chk]"), function(c){
    c.addEventListener("change", function(){ state.chk[+c.getAttribute("data-chk")] = c.checked; saveProgress(); });
  });
  document.getElementById("improveBtn").addEventListener("click", function(){ goTo(4); });
}
function wireFbExtras(){
  var mb = document.getElementById("modelBtn");
  if(mb){
    mb.addEventListener("click", function(){
      state.model = state.model ? 0 : 1;
      if(state.model) state.help++;
      document.getElementById("modelBox").hidden = !state.model;
      mb.setAttribute("aria-expanded", state.model?"true":"false");
      saveProgress();
    });
  }
}

/* ================= LANGUAGE ================= */
document.getElementById("langBtn").addEventListener("click", function(){
  lang = (lang==="en") ? "fr" : "en";
  document.documentElement.setAttribute("data-ui-lang", lang);
  saveProgress();
  var y = window.pageYOffset;
  var respVal = document.getElementById("respBox") ? document.getElementById("respBox").value : null;
  render(false);
  if(respVal!==null && document.getElementById("respBox")){ document.getElementById("respBox").value = respVal; }
  window.scrollTo(0,y);
  document.getElementById("langBtn").focus();
});

/* ================= INIT ================= */
function init(){
  reshuffle();
  loadProgress();
  document.documentElement.setAttribute("data-ui-lang", lang);
  /* the Done button is never available at load */
  completionSent = false;
  render(false);
  var dbtn = document.getElementById("doneBtn"); if(dbtn){ dbtn.disabled = true; dbtn.disabled = !(state.screen===6 && reviewedValid()); }
}
init();

})();
</script>
</body>
