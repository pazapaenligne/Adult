<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W13D1 Listening Mission - Using an online learning platform</title>
<style>
:root{--pazapa-blue:#36BBD6;--pazapa-green:#C9D646;--pazapa-yellow:#FCC104;--pazapa-red:#E6352B;--pazapa-grey-light:#EBEBEB;--pazapa-grey-dark:#2E2E2D;
--blue-tint:#EAF8FB;--green-tint:#F4F7DC;--yellow-tint:#FFF3CC;--focus:#2E2E2D}
*{box-sizing:border-box}
body{margin:0;background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);font-family:"Open Sans",Arial,sans-serif;line-height:1.5;font-size:17px}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 10px;line-height:1.25}
button{font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);touch-action:manipulation;min-height:48px;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:780px;margin:0 auto;background:#fff;min-height:100vh}
.top{background:var(--pazapa-blue);color:var(--pazapa-grey-dark);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:.95rem}
.top .step{font-size:.9rem;font-weight:600}
.fr-toggle{background:#fff;border:2px solid var(--pazapa-grey-dark);border-radius:24px;padding:6px 16px;font-weight:700;min-width:48px}
.fr-toggle[aria-pressed="true"]{background:var(--pazapa-grey-dark);color:#fff}
.bar{height:8px;background:var(--pazapa-grey-light)}
.bar i{display:block;height:100%;background:var(--pazapa-green);width:0;transition:width .3s}
main{padding:22px 18px 36px}
section.screen{display:none}
section.screen.on{display:block}
h2:focus{outline:none}
.fr{display:none;color:#1D5F6E;font-size:.93em;font-style:italic;margin-top:2px}
body.fr-on .fr{display:block}
body.fr-on span.fr{display:inline-block;margin-left:6px}
.inst{background:var(--blue-tint);border-left:6px solid var(--pazapa-blue);border-radius:10px;padding:12px 16px;margin:0 0 16px;font-weight:600}
.hero{display:block;width:100%;max-width:300px;margin:0 auto 14px;border-radius:12px}
.player{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--pazapa-grey-light);border-radius:12px;padding:12px;margin:0 0 14px}
.btn{border:2px solid var(--pazapa-grey-dark);background:#fff;border-radius:10px;padding:10px 18px;font-weight:700}
.btn.main{background:var(--pazapa-blue);border-color:var(--pazapa-blue)}
.btn.main:hover:not(:disabled){background:#2AA9C4}
.btn.play{min-width:130px}
.btn.ghost{background:#fff}
.pending{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);border-radius:10px;padding:10px 14px;margin:0 0 14px;display:none;font-weight:600}
.script{background:#fff;border:2px dashed var(--pazapa-yellow);border-radius:12px;padding:12px 16px;margin:0 0 16px}
.script p{margin:0 0 6px}
.script b{color:#1D5F6E}
details.tr{border:2px solid var(--pazapa-grey-light);border-radius:10px;padding:4px 14px;margin:0 0 16px}
details.tr summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.tile{background:#fff;border:3px solid var(--pazapa-grey-light);border-radius:14px;padding:10px;text-align:center;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:48px}
.tile img,.tile svg{width:100%;max-width:170px;height:auto;border-radius:8px}
#g1 .tile img{width:100%;max-width:none;aspect-ratio:3/2;height:auto;object-fit:contain;background:#FBF5EA}
#g2 .tile img{width:100%;max-width:140px;aspect-ratio:3/4;height:auto;object-fit:contain;background:#FBF5EA}
.opt img{background:#FBF5EA}
.tile:hover:not(:disabled){border-color:var(--pazapa-blue)}
.tile[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--pazapa-blue);background:var(--blue-tint)}
.tile.ok,.opt.ok{border-color:var(--pazapa-green);background:var(--green-tint)}
.tile.no,.opt.no{background:var(--yellow-tint)}
.tile .dot,.opt .dot{display:none}
.tile.no .dot,.opt.no .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark)}
.tile.ok::after,.opt.ok::after{content:"\2713";font-weight:800}
.q{border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.q h3{font-size:1.05rem;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--pazapa-grey-light);border-radius:12px;padding:8px 12px;font-weight:600;width:100%}
.opt img{width:54px;height:72px;object-fit:contain;border-radius:6px;flex:none}
.opt .t{flex:1}
.order{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.order li{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--pazapa-grey-light);border-radius:12px;padding:10px 12px;cursor:grab}
.order li.sel{border-color:var(--pazapa-blue);background:var(--blue-tint)}
.order li.ok{border-color:var(--pazapa-green);background:var(--green-tint)}
.order li.no{background:var(--yellow-tint)}
.order li.drag{opacity:.55}
.order .num{width:34px;height:34px;border-radius:50%;background:var(--pazapa-blue);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.order .txt{flex:1;font-weight:600;cursor:pointer;min-height:48px;display:flex;flex-direction:column;justify-content:center;text-align:left;background:none;border:0;padding:0}
.mv{min-width:48px;padding:0 10px;background:#fff;border:2px solid var(--pazapa-grey-dark);border-radius:10px;font-weight:700}
.fb{display:none;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-weight:600}
.fb.show{display:block}
.fb.good{background:var(--green-tint);border:2px solid var(--pazapa-green)}
.fb.help{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow)}
.fb.info{background:var(--blue-tint);border:2px solid var(--pazapa-blue)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hidden{display:none!important}
.done-card{text-align:center;background:var(--green-tint);border-radius:16px;padding:24px 16px}
.done-card .tick{width:72px;height:72px;border-radius:50%;background:var(--pazapa-green);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800}
.done-card .actions{justify-content:center}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">Pazapa English Programme for Adults</span>
    <span class="step" id="stepLabel">Listening Mission</span>
    <button type="button" class="fr-toggle" id="frBtn" aria-pressed="false">Français</button>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  <main id="main"></main>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

var audioReady = !!AUDIO_FILES.main;
var audioEl = null, audioEnded = false;

function playAudio(key){
  var src = AUDIO_FILES[key];
  if(!src){ return; }
  if(!audioEl){
    audioEl = new Audio();
    audioEl.preload = "auto";
    audioEl.addEventListener("ended", function(){ audioEnded = true; state.heard = true; save(); refreshAudioUI(); applyGate(); });
    audioEl.addEventListener("play", refreshAudioUI);
    audioEl.addEventListener("error", function(){ if(window.console){ console.error("Audio loading error:", audioEl.error ? audioEl.error.code : "unknown"); } });
    audioEl.addEventListener("pause", refreshAudioUI);
  }
  if(audioEl.getAttribute("data-k") !== key){ audioEl.pause(); audioEl.src = src; audioEl.setAttribute("data-k", key); }
  var p = audioEl.play();
  if(p && p.catch){ p.catch(function(){ refreshAudioUI(); }); }
}
function togglePlay(){
  if(!audioReady){ return; }
  if(audioEl && !audioEl.paused){ audioEl.pause(); } else { playAudio("main"); }
}
function replayAudio(){
  if(!audioReady){ return; }
  if(audioEl){ audioEl.pause(); try{ audioEl.currentTime = 0; }catch(e){} }
  playAudio("main");
}
function restartAudio(){
  if(!audioReady || !audioEl){ return; }
  audioEl.pause(); try{ audioEl.currentTime = 0; }catch(e){}
  refreshAudioUI();
}
function refreshAudioUI(){
  var playing = !!(audioEl && !audioEl.paused);
  var btns = document.querySelectorAll(".js-play");
  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-pressed", playing ? "true":"false");
    btns[i].firstChild.textContent = playing ? "Pause" : "Play";
  }
}
if(!audioReady && window.console){ console.warn("W13D1 Listening Mission: audio recording not yet inserted (AUDIO_FILES.main is null)."); }

/* ============ STATE ============ */
function freshState(){
  return {screen:0, heard:false,
    s:{1:{att:0,sel:null,ok:false,rev:false},2:{att:0,sel:[],ok:false,rev:false},3:{att:0,sel:{},ok:false,rev:false},4:{att:0,sel:null,ok:false,rev:false}}};
}
var state = freshState();
var completionSent = false;
try{
  var raw = window.localStorage.getItem(CONFIG.storageKey);
  if(raw){ var o = JSON.parse(raw); if(o && o.state){ state = o.state; } completionSent = !!(o && o.completed); }
}catch(e){}
function save(){
  try{ window.localStorage.setItem(CONFIG.storageKey, JSON.stringify({state:state, completed:completionSent})); }catch(e){}
}

/* ============ LMS (silent - no learner-facing message) ============ */
var lmsApi = null, lmsKind = null;
function findApi(win){
  var tries = 0;
  while(win && tries < 12){
    try{
      if(win.API_1484_11){ return {api:win.API_1484_11, kind:"2004"}; }
      if(win.API){ return {api:win.API, kind:"1.2"}; }
    }catch(e){}
    try{
      if(win.parent && win.parent !== win){ win = win.parent; } else { break; }
    }catch(e){ break; }
    tries++;
  }
  try{
    if(window.opener){
      var w = window.opener;
      if(w.API_1484_11){ return {api:w.API_1484_11, kind:"2004"}; }
      if(w.API){ return {api:w.API, kind:"1.2"}; }
    }
  }catch(e){}
  return null;
}
function discoverLms(){
  if(lmsApi){ return; }
  var f = findApi(window);
  if(f){
    lmsApi = f.api; lmsKind = f.kind;
    try{ if(lmsKind === "2004"){ lmsApi.Initialize(""); } else { lmsApi.LMSInitialize(""); } }catch(e){}
  }
}
function activityCompleted(){
  if(completionSent){ return; }
  completionSent = true;
  save();
  discoverLms();
  if(lmsApi){
    try{
      if(lmsKind === "2004"){
        var cur = lmsApi.GetValue("cmi.completion_status");
        if(cur !== "completed"){ lmsApi.SetValue("cmi.completion_status","completed"); lmsApi.SetValue("cmi.success_status","passed"); lmsApi.Commit(""); }
      } else {
        var cur12 = lmsApi.LMSGetValue("cmi.core.lesson_status");
        if(cur12 !== "completed" && cur12 !== "passed"){ lmsApi.LMSSetValue("cmi.core.lesson_status","completed"); lmsApi.LMSCommit(""); }
      }
    }catch(e){}
  }
  if(window.console){ console.log(CONFIG.logLabel); }
}
document.addEventListener("click", function(){ discoverLms(); }, true);
discoverLms();

  return '<div class="player" role="group" aria-label="Audio player">'+
    '<button type="button" class="btn main play js-play" aria-pressed="false"'+(audioReady?'':' disabled')+'>Play</button>'+
    '<button type="button" class="btn js-replay"'+(audioReady?'':' disabled')+' aria-label="Replay from the start">Replay</button>'+
    '<button type="button" class="btn js-restart"'+(audioReady?'':' disabled')+'>Restart</button></div>'+
    '<div class="pending js-pending" role="note">Audio is coming soon. Read the script, then answer.'+fr("L'audio arrive bientôt. Lisez le texte, puis répondez.")+'</div>';
}
function transcriptHTML(){
  var h = '<details class="tr"'+(audioReady?'':' open')+'><summary>Audio support transcript'+fr("Transcription de l'audio",true)+'</summary><div>';
  CONFIG.scriptLines.forEach(function(l){ h += '<p><b>'+l.who+':</b> '+l.en+fr(l.fr)+'</p>'; });
  return h + '</div></details>';
}
function actionsHTML(n){
  return '<div class="fb" id="fb'+n+'" role="status"></div>'+
   '<div class="actions">'+
   '<button type="button" class="btn main" id="chk'+n+'">Check'+fr("Vérifier",true)+'</button>'+
   '<button type="button" class="btn ghost hidden" id="show'+n+'">Show me'+fr("Montre-moi",true)+'</button>'+
   '<button type="button" class="btn ghost" id="try'+n+'">Try again'+fr("Réessayer",true)+'</button>'+
   '<button type="button" class="btn main hidden" id="cont'+n+'">Continue'+fr("Continuer",true)+'</button></div>';
}

function build(){
  main.innerHTML = "";
  screens = [];
  var word = {
    login:["log in","se connecter"], password:["password","mot de passe"], course:["course","cours"],
    lesson:["lesson","leçon"], module:["module","module"], video:["video","vidéo"], submit:["submit","envoyer"], feedback:["feedback","commentaires"]
  };

  /* Screen 1 */
  var s1 = el("section","screen");
  s1.innerHTML = '<h2 tabindex="-1">Using an online learning platform'+fr("Utiliser une plateforme d'apprentissage en ligne")+'</h2>'+
    '<p class="inst">Listen once. What is the situation?'+fr("Écoutez une fois. Quelle est la situation ?")+'</p>'+
    playerHTML()+'<div class="grid" id="g1" role="group" aria-label="Situation choices"></div>'+transcriptHTML()+actionsHTML(1);
  screens.push(s1);

  /* Screen 2 */
  var s2 = el("section","screen");
  s2.innerHTML = '<h2 tabindex="-1">Key words'+fr("Mots clés")+'</h2>'+
    '<p class="inst">Listen again. Which words do you hear?'+fr("Écoutez encore. Quels mots entendez-vous ?")+'</p>'+
    playerHTML()+'<div class="grid" id="g2" role="group" aria-label="Word choices"></div>'+actionsHTML(2);
  screens.push(s2);

  /* Screen 3 */
  var s3 = el("section","screen");
  s3.innerHTML = '<h2 tabindex="-1">Details'+fr("Détails")+'</h2>'+
    '<p class="inst">Listen again. Choose the correct details.'+fr("Écoutez encore. Choisissez les bons détails.")+'</p>'+
    playerHTML()+'<div id="g3"></div>'+actionsHTML(3);
  screens.push(s3);

  /* Screen 4 */
  var s4 = el("section","screen");
  s4.innerHTML = '<h2 tabindex="-1">Put the message in order'+fr("Mettez le message dans l'ordre")+'</h2>'+
    '<p class="inst">Listen once more. Put the three parts in order.'+fr("Écoutez encore une fois. Mettez les trois parties dans l'ordre.")+'</p>'+
    playerHTML()+'<ol class="order" id="g4"></ol>'+
    '<p class="sr" id="orderHelp">Use the Move up and Move down buttons, or drag the cards.</p>'+actionsHTML(4);
  screens.push(s4);

  /* Screen 5 */
  var s5 = el("section","screen");
  s5.innerHTML = '<div class="done-card"><div class="tick" aria-hidden="true">✓</div>'+
    '<h2 tabindex="-1">Listening Mission complete.'+fr("Mission d'écoute terminée.")+'</h2>'+
    '<p>You listened for key information about using an online learning platform.'+fr("Vous avez écouté les informations clés sur l'utilisation d'une plateforme d'apprentissage en ligne.")+'</p>'+
    '<p>Next, you will practise pronunciation.'+fr("Ensuite, vous allez travailler la prononciation.")+'</p>'+
    '<div class="actions"><button type="button" class="btn main" id="doneBtn">Done'+fr("Terminé",true)+'</button>'+
    '<button type="button" class="btn ghost" id="tryAll">Try again'+fr("Réessayer",true)+'</button></div></div>';
  screens.push(s5);
  screens.forEach(function(s){ main.appendChild(s); });

  /* --- Screen 1 tiles --- */
  var sit = [
    {id:"learn", img:'<img src="'+IMG.login+'" alt="A woman using a laptop at a desk">', en:"Using an online learning platform", fr:"Utiliser une plateforme en ligne"},
    {id:"doc", img:'<img src="'+IMG.doctor+'" alt="A woman talking to a doctor in a clinic">', en:"At the doctor", fr:"Chez le médecin"},
    {id:"shop", img:'<img src="'+IMG.shop+'" alt="A woman shopping for food in a supermarket">', en:"Shopping for food", fr:"Faire les courses"},
    {id:"bank", img:'<img src="'+IMG.bank+'" alt="Two women talking at a bank counter">', en:"At the bank", fr:"À la banque"}
  ];
  var g1 = $("g1");
  shuffle(sit).forEach(function(o){
    var b = el("button","tile", o.img+'<span>'+o.en+'</span>'+fr(o.fr)+'<span class="dot" aria-hidden="true"></span>');
    b.type = "button"; b.setAttribute("aria-pressed","false"); b.setAttribute("data-i", o.id);
    b.addEventListener("click", function(){ if(state.s[1].ok){ invalidate(1); } state.s[1].sel = o.id; save(); paint(1); });
    g1.appendChild(b);
  });

  /* --- Screen 2 tiles --- */
  var ids2 = ["login","password","video","feedback","course","lesson"];
  var g2 = $("g2");
  shuffle(ids2).forEach(function(k){
    var b = el("button","tile", '<img src="'+IMG[k]+'" alt="">'+'<span>'+word[k][0]+'</span>'+fr(word[k][1])+'<span class="dot" aria-hidden="true"></span>');
    b.type = "button"; b.setAttribute("aria-pressed","false"); b.setAttribute("data-i", k);
    b.addEventListener("click", function(){
      if(state.s[2].ok){ invalidate(2); }
      var a = state.s[2].sel, p = a.indexOf(k);
      if(p<0){ a.push(k); } else { a.splice(p,1); }
      save(); paint(2);
    });
    g2.appendChild(b);
  });

  /* --- Screen 3 questions --- */
  var qs = [
    {id:"q1", en:"Which module does Support say?", fr:"Quel module le support indique-t-il ?", pic:"module",
      o:[{id:"m1",en:"Module 1",fr:"Module 1"},{id:"m2",en:"Module 2",fr:"Module 2"},{id:"m3",en:"Module 3",fr:"Module 3"}]},
    {id:"q2", en:"What is Amina's problem?", fr:"Quel est le problème d'Amina ?", pic:"video",
      o:[{id:"cantvideo",en:"She can't open the video.",fr:"Elle n'arrive pas à ouvrir la vidéo."},{id:"cantlogin",en:"She can't log in.",fr:"Elle n'arrive pas à se connecter."},{id:"cantlesson",en:"She can't find the lesson.",fr:"Elle ne trouve pas la leçon."}]},
    {id:"q3", en:"What should Amina submit?", fr:"Que doit envoyer Amina ?", pic:"submit",
      o:[{id:"assign",en:"Her assignment",fr:"Son devoir"},{id:"pass",en:"Her password",fr:"Son mot de passe"},{id:"vid",en:"Her video",fr:"Sa vidéo"}]}
  ];
  var g3 = $("g3");
  qs.forEach(function(q){
    var box = el("div","q");
    box.setAttribute("role","group"); box.setAttribute("aria-label", q.en);
    box.appendChild(el("h3",null,q.en+fr(q.fr)));
    var list = el("div","opts");
    shuffle(q.o).forEach(function(o){
      var b = el("button","opt", '<img src="'+IMG[q.pic]+'" alt=""><span class="t">'+o.en+fr(o.fr)+'</span><span class="dot" aria-hidden="true"></span>');
      b.type = "button"; b.setAttribute("aria-pressed","false"); b.setAttribute("data-q", q.id); b.setAttribute("data-i", o.id);
      b.addEventListener("click", function(){ if(state.s[3].ok){ invalidate(3); } state.s[3].sel[q.id] = o.id; save(); paint(3); });
      list.appendChild(b);
    });
    box.appendChild(list); g3.appendChild(box);
  });

  /* --- Screen 4 cards --- */
  var cards = {
    c1:{en:"Log in with your email and password.", fr:"Connectez-vous avec votre e-mail et votre mot de passe."},
    c2:{en:"Open Module 2 and watch the video.", fr:"Ouvrez le module 2 et regardez la vidéo."},
    c3:{en:"Submit your assignment.", fr:"Envoyez votre devoir."}
  };
  state.cards = cards; /* text only; order lives in state.s[4].sel */
  if(!state.s[4].sel || state.s[4].sel.length !== 3){
    var o4; do{ o4 = shuffle(["c1","c2","c3"]); }while(o4.join() === "c1,c2,c3");
    state.s[4].sel = o4;
  }
  bindOrder(cards);

  /* buttons */
  var all = document.querySelectorAll(".js-play"); for(var i=0;i<all.length;i++){ all[i].addEventListener("click", togglePlay); }
  all = document.querySelectorAll(".js-replay"); for(i=0;i<all.length;i++){ all[i].addEventListener("click", replayAudio); }
  all = document.querySelectorAll(".js-restart"); for(i=0;i<all.length;i++){ all[i].addEventListener("click", restartAudio); }
  all = document.querySelectorAll(".js-pending"); for(i=0;i<all.length;i++){ all[i].style.display = audioReady ? "none" : "block"; }

  for(var n=1;n<=4;n++){ (function(n){
    $("chk"+n).addEventListener("click", function(){ check(n); });
    $("show"+n).addEventListener("click", function(){ reveal(n); });
    $("try"+n).addEventListener("click", function(){ resetScreen(n); });
    $("cont"+n).addEventListener("click", function(){ goto(n); });
  })(n); }
  $("doneBtn").disabled = true;
  $("doneBtn").addEventListener("click", onDone);
  $("tryAll").addEventListener("click", tryAll);
}

/* ---- ordering ---- */
var selCard = null;
function bindOrder(cards){
  var ol = $("g4"); ol.innerHTML = "";
  var ord = state.s[4].sel;
  ord.forEach(function(id, idx){
    var li = el("li", selCard === id ? "sel":"");
    li.setAttribute("data-i", id); li.draggable = true;
    li.innerHTML = '<span class="num" aria-hidden="true">'+(idx+1)+'</span>'+
      '<button type="button" class="txt"><span>'+cards[id].en+'</span>'+fr(cards[id].fr)+'</button>'+
      '<button type="button" class="mv up" aria-label="Move up: '+cards[id].en+'"'+(idx===0?' disabled':'')+'>↑ Up</button>'+
      '<button type="button" class="mv dn" aria-label="Move down: '+cards[id].en+'"'+(idx===ord.length-1?' disabled':'')+'>↓ Down</button>';
    li.querySelector(".txt").addEventListener("click", function(){ selCard = (selCard === id ? null : id); bindOrder(cards); });
    li.querySelector(".up").addEventListener("click", function(){ moveCard(idx, idx-1, cards, "up", id); });
    li.querySelector(".dn").addEventListener("click", function(){ moveCard(idx, idx+1, cards, "down", id); });
    li.addEventListener("dragstart", function(e){ li.classList.add("drag"); try{ e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; }catch(x){} dragId = id; });
    li.addEventListener("dragend", function(){ li.classList.remove("drag"); });
    li.addEventListener("dragover", function(e){ e.preventDefault(); });
    li.addEventListener("drop", function(e){
      e.preventDefault();
      if(!dragId || dragId === id){ return; }
      var from = ord.indexOf(dragId), to = ord.indexOf(id);
      moveCard(from, to, cards, null, dragId);
    });
    ol.appendChild(li);
  });
  paintOrderStatus();
}
var dragId = null;
function moveCard(from, to, cards, dir, id){
  var ord = state.s[4].sel;
  if(to < 0 || to >= ord.length){ return; }
  if(state.s[4].ok){ invalidate(4); }
  ord.splice(to, 0, ord.splice(from, 1)[0]);
  save(); selCard = id; bindOrder(cards);
  announce(cards[id].en + " is now number " + (to+1));
  var li = document.querySelector('#g4 li[data-i="'+id+'"]');
  if(li){ var b = li.querySelector(dir === "down" ? ".dn" : ".up"); if(!b || b.disabled){ b = li.querySelector(".txt"); } if(b){ b.focus(); } }
}
function paintOrderStatus(){
  var s = state.s[4], items = document.querySelectorAll("#g4 li");
  for(var i=0;i<items.length;i++){ items[i].classList.remove("ok","no"); }
  if(s.ok || s.rev){ for(i=0;i<items.length;i++){ items[i].classList.add("ok"); } }
  else if(s.checkedWrong){
    var ord = s.sel;
    for(i=0;i<items.length;i++){ items[i].classList.add(ord[i] === CONFIG.answers.s4[i] ? "ok":"no"); }
  }
}

/* ============ PLAY GATE ============ */
function gateOpen(){ return !audioReady || state.heard; }
function applyGate(){
  var g = gateOpen();
  var tiles = document.querySelectorAll("#g1 .tile");
  for(var i=0;i<tiles.length;i++){ tiles[i].disabled = !g; }
  $("chk1").disabled = !g;
  var fb = $("fb1");
  if(!g && state.screen===0 && !state.s[1].ok){ fb.className = "fb info show"; fb.textContent = "Press Play and listen to the end first."; }
  else if(g && fb.classList.contains("info")){ fb.className = "fb"; fb.textContent = ""; }
}

/* ============ PAINT / CHECK ============ */
function paint(n){
  var s = state.s[n], i;
  if(n === 1){
    var t = document.querySelectorAll("#g1 .tile");
    for(i=0;i<t.length;i++){ var id=t[i].getAttribute("data-i"); t[i].setAttribute("aria-pressed", s.sel===id?"true":"false"); t[i].classList.remove("ok","no"); if(s.ok||s.rev){ if(id===CONFIG.answers.s1){ t[i].classList.add("ok"); } } else if(s.wrong && s.sel===id){ t[i].classList.add("no"); } }
  }
  if(n === 2){
    t = document.querySelectorAll("#g2 .tile");
    for(i=0;i<t.length;i++){ id=t[i].getAttribute("data-i"); var on = s.sel.indexOf(id)>=0; t[i].setAttribute("aria-pressed", on?"true":"false"); t[i].classList.remove("ok","no");
      if(s.ok||s.rev){ if(CONFIG.answers.s2.indexOf(id)>=0){ t[i].classList.add("ok"); } }
      else if(s.wrong){ if(on && CONFIG.answers.s2.indexOf(id)<0){ t[i].classList.add("no"); } } }
  }
  if(n === 3){
    t = document.querySelectorAll("#g3 .opt");
    for(i=0;i<t.length;i++){ var q=t[i].getAttribute("data-q"); id=t[i].getAttribute("data-i"); var chosen = s.sel[q]===id; t[i].setAttribute("aria-pressed", chosen?"true":"false"); t[i].classList.remove("ok","no");
      if(s.ok||s.rev){ if(CONFIG.answers.s3[q]===id){ t[i].classList.add("ok"); } }
      else if(s.wrong && chosen && CONFIG.answers.s3[q]!==id){ t[i].classList.add("no"); } }
  }
  if(n === 4){ bindOrder(state.cards); }
  var ctl = {chk:$("chk"+n), cont:$("cont"+n), show:$("show"+n)};
  var done = s.ok || s.rev;
  ctl.cont.classList.toggle("hidden", !done);
  ctl.chk.classList.toggle("hidden", done);
  ctl.show.classList.toggle("hidden", done || s.att < CONFIG.maxAttemptsBeforeShow);
  if(n === 1){ applyGate(); }
}
function setFb(n, kind, text){ var f = $("fb"+n); f.className = "fb show "+kind; f.textContent = text; announce(text); }
function invalidate(n){
  var s = state.s[n]; s.ok = false; s.rev = false; s.wrong = false; s.checkedWrong = false;
  var f = $("fb"+n); f.className = "fb"; f.textContent = "";
  if(n === 4){ var o=s.sel; }
  save();
}
function isCorrect(n){
  var s = state.s[n], a = CONFIG.answers;
  if(n===1){ return s.sel === a.s1; }
  if(n===2){ return sameSet(s.sel, a.s2); }
  if(n===3){ return ["q1","q2","q3"].every(function(q){ return s.sel[q] === a.s3[q]; }); }
  if(n===4){ return s.sel.join() === a.s4.join(); }
}
function hasAnswer(n){
  var s = state.s[n];
  if(n===1){ return !!s.sel; }
  if(n===2){ return s.sel.length > 0; }
  if(n===3){ return ["q1","q2","q3"].every(function(q){ return !!s.sel[q]; }); }
  return true;
}
var hints = {
  1:"Not yet. Listen again. Think about the course, the module and the video.",
  2:"Not yet. Listen again for the words: log in, password, video, feedback.",
  3:"Some answers are not right yet. Listen again and try again.",
  4:"Not yet. Listen again. What happens first, next and last?"
};
function check(n){
  var s = state.s[n];
  if(n===1 && !gateOpen()){ applyGate(); return; }
  if(!hasAnswer(n)){ setFb(n, "help", n===3 ? "Please answer all three questions." : "Please choose an answer first."); return; }
  s.att++;
  if(isCorrect(n)){ s.ok = true; s.wrong = false; s.checkedWrong = false; setFb(n, "good", "Well done! That is correct."); }
  else { s.wrong = true; s.checkedWrong = true; setFb(n, "help", hints[n] + (s.att >= CONFIG.maxAttemptsBeforeShow ? " You can also press Show me." : "")); }
  save(); paint(n);
  if(s.ok){ $("cont"+n).focus(); }
}
function reveal(n){
  var s = state.s[n], a = CONFIG.answers;
  s.rev = true; s.ok = false; s.wrong = false; s.checkedWrong = false;
  if(n===1){ s.sel = a.s1; }
  if(n===2){ s.sel = a.s2.slice(); }
  if(n===3){ s.sel = {q1:a.s3.q1,q2:a.s3.q2,q3:a.s3.q3}; }
  if(n===4){ s.sel = a.s4.slice(); }
  setFb(n, "info", "Here are the answers. You can listen again and try this screen later.");
  save(); paint(n); $("cont"+n).focus();
}
function resetScreen(n){
  var keepAtt = 0;
  var s = state.s[n];
  s.att = keepAtt; s.ok = false; s.rev = false; s.wrong = false; s.checkedWrong = false;
  if(n===1){ s.sel = null; }
  if(n===2){ s.sel = []; }
  if(n===3){ s.sel = {}; }
  if(n===4){ var o4; do{ o4 = shuffle(["c1","c2","c3"]); }while(o4.join()==="c1,c2,c3"); s.sel = o4; selCard = null; }
  var f = $("fb"+n); f.className = "fb"; f.textContent = "";
  /* reshuffle choices */
  var host = n===1 ? $("g1") : n===2 ? $("g2") : null;
  if(host){ var kids = shuffle(Array.prototype.slice.call(host.children)); kids.forEach(function(k){ host.appendChild(k); }); }
  if(n===3){ var qs = document.querySelectorAll("#g3 .opts"); for(var i=0;i<qs.length;i++){ var k2 = shuffle(Array.prototype.slice.call(qs[i].children)); k2.forEach(function(k){ qs[i].appendChild(k); }); } }
  save(); paint(n); announce("This screen has been reset.");
}

/* ============ NAVIGATION ============ */
function show(idx){
  state.screen = idx;
  for(var i=0;i<screens.length;i++){ screens[i].classList.toggle("on", i===idx); }
  $("barFill").style.width = (idx/4*100) + "%";
  $("stepLabel").textContent = idx < 4 ? "Listening Mission • " + (idx+1) + " of 4" : "Listening Mission";
  for(var n=1;n<=4;n++){ paint(n); }
  $("doneBtn").disabled = (idx !== 4) || !allResolved();
  save();
  var h = screens[idx].querySelector("h2"); if(h){ h.focus(); }
  window.scrollTo(0,0);
}
function goto(n){ show(n); }
function allResolved(){ for(var n=1;n<=4;n++){ if(!(state.s[n].ok || state.s[n].rev)){ return false; } } return true; }

function onDone(){
  activityCompleted();
  var b = $("doneBtn");
  b.innerHTML = "Done ✓";
  announce("Listening Mission complete.");
}
function tryAll(){
  var keep = completionSent;
  state = freshState();
  selCard = null;
  save();
  build();
  audioEnded = false;
  if(audioEl){ audioEl.pause(); try{ audioEl.currentTime = 0; }catch(e){} }
  refreshAudioUI();
  show(0);
  announce("Listening Mission restarted.");
}

/* ============ INIT ============ */
build();
if(state.screen === 4 && !allResolved()){ state.screen = 0; }
if(state.screen > 0 && state.screen < 4){ /* only allow resume on a screen whose predecessors are resolved */
  for(var k=1;k<=state.screen;k++){ if(!(state.s[k].ok||state.s[k].rev)){ state.screen = k-1; break; } }
}
show(state.screen);
if(completionSent && state.screen===4){ $("doneBtn").innerHTML = "Done ✓"; }
refreshAudioUI();

var frOn = false;
try{ frOn = window.localStorage.getItem("pazapa_fr") === "1"; }catch(e){}
function setFr(v){
  frOn = v; document.body.classList.toggle("fr-on", v);
  var b = $("frBtn"); b.setAttribute("aria-pressed", v ? "true":"false");
  b.textContent = v ? "English only" : "Français";
  try{ window.localStorage.setItem("pazapa_fr", v ? "1":"0"); }catch(e){}
}
$("frBtn").addEventListener("click", function(){ setFr(!frOn); });
setFr(frOn);
})();
</script>
</body>
</html>
