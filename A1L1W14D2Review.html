<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technical problems — Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --white:#FFFFFF;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  background:var(--pazapa-grey-light);
  color:var(--pazapa-grey-dark);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;margin:0;}
.app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
.accent{display:flex;height:8px;}
.accent span{flex:1;}
.accent .a1{background:var(--pazapa-blue);flex:6;}
.accent .a2{background:var(--pazapa-green);flex:2;}
.accent .a3{background:var(--pazapa-yellow);flex:2;}
.accent .a4{background:var(--pazapa-red);flex:.4;}
header.app-header{padding:14px 20px 12px;border-bottom:1px solid var(--pazapa-grey-light);}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.brand{font-size:.85rem;font-weight:700;}
.eyebrow{margin:0;font-size:.85rem;}
h1{font-size:1.3rem;margin:4px 0 10px;}
.lang-btn{min-height:48px;min-width:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);font-weight:700;font-size:.95rem;cursor:pointer;touch-action:manipulation;font-family:inherit;}
.lang-btn:hover{background:var(--blue-tint);}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-track{flex:1;height:10px;background:var(--pazapa-grey-light);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:var(--pazapa-blue);border-radius:8px;transition:width .3s ease;}
.progress-label{font-size:.85rem;white-space:nowrap;}
main{flex:1;padding:20px 20px 28px;}
h2.screen-title{font-size:1.2rem;margin-bottom:6px;}
h2.screen-title:focus{outline:none;}
p.screen-intro{margin:0 0 16px;}
.illustration{display:block;max-width:100%;height:auto;margin:0 auto 16px;border-radius:var(--radius);background:var(--yellow-tint);}
.illustration.big{width:230px;}
.illustration.small{width:130px;}
.card{background:var(--blue-tint);border-radius:var(--radius);padding:16px;margin-bottom:16px;border-left:6px solid var(--pazapa-blue);}
.card.green{background:var(--green-tint);border-left-color:var(--pazapa-green);}
.card.yellow{background:var(--yellow-tint);border-left-color:var(--pazapa-yellow);}
.card.plain{background:var(--white);border:2px solid var(--pazapa-grey-light);border-left:6px solid var(--pazapa-blue);}
.card h3{font-size:1rem;margin-bottom:8px;}
.card p{margin:0 0 8px;}
.card p:last-child{margin-bottom:0;}
fieldset{border:0;margin:0;padding:0;min-width:0;}
legend{padding:0;font-weight:700;margin-bottom:8px;font-family:"Filson Soft","Open Sans",Arial,sans-serif;}
button,select,input,textarea{font-family:inherit;}
.option-list{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border-radius:10px;border:2px solid var(--pazapa-blue);background:var(--white);cursor:pointer;touch-action:manipulation;font-size:1rem;}
.opt:hover{background:var(--blue-tint);}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--pazapa-grey-dark);}
.opt.sel{background:var(--blue-tint);font-weight:700;}
.opt.ok{border-color:var(--pazapa-green);background:var(--green-tint);font-weight:700;}
.opt.try{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
.opt .tag{margin-left:auto;font-size:.8rem;font-weight:700;background:var(--pazapa-yellow);padding:2px 8px;border-radius:10px;white-space:nowrap;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0;}
.row label.lab{flex:1 1 150px;}
select,input[type=text],textarea{min-height:48px;border-radius:8px;border:2px solid var(--pazapa-blue);padding:8px 10px;font-size:1rem;background:var(--white);color:var(--pazapa-grey-dark);max-width:100%;}
select{flex:1 1 170px;}
input[type=text]{flex:1 1 170px;}
textarea{width:100%;min-height:120px;resize:vertical;}
.try-box{border-color:var(--pazapa-yellow)!important;background:var(--yellow-tint);}
.ok-box{border-color:var(--pazapa-green)!important;}
.fb{margin:8px 0 0;font-size:.95rem;}
.fb .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;border:2px solid var(--pazapa-grey-dark);}
.fb .dot.ok{background:var(--pazapa-green);}
.fb .dot.try{background:var(--pazapa-yellow);}
.btn{min-height:48px;padding:10px 20px;border-radius:10px;border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-size:1rem;font-weight:700;cursor:pointer;touch-action:manipulation;}
.btn:hover:not(:disabled){filter:brightness(.95);}
.btn:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6b69;cursor:not-allowed;}
.btn.secondary{background:var(--white);}
.btn.secondary:disabled{background:var(--white);border-color:var(--pazapa-grey-light);}
.btn.help{background:var(--pazapa-yellow);border-color:var(--pazapa-yellow);}
.btn.small{min-height:48px;padding:8px 14px;font-size:.95rem;}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);font-size:.95rem;cursor:pointer;touch-action:manipulation;text-align:left;}
.chip:hover{background:var(--blue-tint);}
.bank{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.bank .gloss{display:block;font-size:.85rem;color:#4a4a48;}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.tabs .opt{flex:1 1 140px;justify-content:center;}
.hint-box{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);padding:10px 12px;border-radius:10px;margin:10px 0;}
.hint-box p{margin:0 0 6px;}
.hint-box p:last-child{margin:0;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.cmp{grid-template-columns:1fr;}}
.cmp .card{margin:0;}
.cmp blockquote{margin:0;padding:10px;background:var(--white);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;}
.checks{list-style:none;margin:0;padding:0;}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--pazapa-grey-light);}
.checks li:last-child{border-bottom:0;}
.badge{flex:none;min-width:70px;text-align:center;font-size:.8rem;font-weight:700;padding:3px 8px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);}
.badge.have{background:var(--pazapa-green);}
.badge.add{background:var(--pazapa-yellow);}
.rec{background:var(--white);border:2px dashed var(--pazapa-blue);border-radius:10px;padding:12px;margin-top:12px;}
.rec .row{margin:6px 0;}
.rec audio{width:100%;margin-top:6px;}
.rec-status{font-weight:700;margin:6px 0;}
details.example{margin:10px 0;}
details.example summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700;}
details.example blockquote{margin:6px 0 0;padding:10px;background:var(--white);border-radius:8px;}
nav.app-nav{padding:14px 20px;border-top:1px solid var(--pazapa-grey-light);display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;}
nav .need{flex:1 1 200px;font-size:.9rem;margin:0;}
.final-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.final-actions[hidden],#carryBtn[hidden]{display:none!important;}
.done-note{margin:12px 0 0;font-weight:700;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.progress-fill{transition:none;}*{scroll-behavior:auto!important;animation:none!important;}}
</style>
</head>
<body>
<div class="app">
  <div class="accent" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span></div>
  <header class="app-header">
    <div class="top-row">
      <span class="brand">Pazapa English Programme for Adults</span>
      <button type="button" class="lang-btn" id="langBtn" aria-label="Voir en français"></button>
    </div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="pageTitle"></h1>
    <div class="progress-wrap">
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <span class="progress-label" id="progressLabel"></span>
    </div>
  </header>
  <main id="mainContent"></main>
  <div aria-live="polite" class="sr-only" id="liveRegion"></div>
  <nav class="app-nav" id="appNav">
    <p class="need" id="needMsg"></p>
    <button type="button" class="btn" id="carryBtn"></button>
    <div class="final-actions" id="finalActions" hidden>
      <button type="button" class="btn secondary" id="tryAgainBtn"></button>
      <button type="button" class="btn" id="doneBtn"></button>
    </div>
  </nav>
</div>

/* ============ TEXT HELPERS & CHECKS ============ */
function norm(s){
  return String(s||"").normalize("NFKC").replace(/[‘’ʼ`´]/g,"'").replace(/[“”]/g,'"')
    .toLowerCase().replace(/\s+/g," ").replace(/[.!?\s]+$/,"").trim();
}
function wc(s){var n=norm(s);return n?n.split(" ").length:0;}
function composed(b){
  var parts=[];
  if(b.p)parts.push(PH[b.p].en); if(b.r)parts.push(PH[b.r].en); if(b.c)parts.push(PH[b.c].en);
  if(b.e)parts.push(PH.thanks.en);
  return parts.join(" ");
}
function attemptText(which){
  var a=state[which];
  return (a.mode==="build"?composed(a.build):a.text).trim();
}
var RX={
  dev:/(microphone|\bmic\b|camera|screen|link|password|video|internet|connection|sound|audio)/,
  prob:/(isn't working|is not working|aren't working|not working|doesn't work|does not work|can't|cannot|can not|keeps stopping|keep stopping|forgot|stopping|stops|problem|no sound)/,
  req:/((could|can|would) you[^.?!]*\b(help|send|check|share|reset|open|fix)\b|\bneed (some )?help\b|\bhelp me\b|please (help|send|check))/,
  chk:/((can|could) you (hear|see|open)[^.?!]*\bnow\b|can you (hear|see) me|can you open it|does it work now|is it working now|is it ok now)/,
  end:/(thank you|thanks|thank u)/
};
function groups(text){
  var n=norm(text);
  return {problem:RX.dev.test(n)&&RX.prob.test(n),request:RX.req.test(n),check:RX.chk.test(n),ending:RX.end.test(n)};
}
var FOCUS=["problem","request","check","ending"];
function focusApplied(){
  if(!state.focus.length)return false;
  var g=groups(attemptText("second"));
  return state.focus.every(function(f){return g[f];});
}
function recallDone(){
  var r=state.recall;
  return {a:r.shown.a||(r.ok.a&&checkA()),b:r.shown.b||(r.ok.b&&checkB()),c:r.shown.c||(r.ok.c&&checkC())};
}
function checkA(){var a=state.recall.a;return a[0]==="microphone"&&a[1]==="link"&&a[2]==="password";}
function checkB(){
  var b=state.recall.b.map(norm);
  return ["microphone","camera","screen","internet connection","connection","mic"].indexOf(b[0])>-1 && b[1]==="video";
}
function checkC(){var c=state.recall.c;return c[0]==="hear"&&c[1]==="send";}
function validate(){
  var rd=recallDone();
  var recallOk=rd.a&&rd.b&&rd.c;
  var goalOk=state.goal==="b";
  var firstOk=state.first.locked&&wc(state.first.lockedText)>=3;
  var focusOk=state.focus.length>=1&&state.focus.length<=2;
  var s=attemptText("second");
  var distinct=wc(s)>=3&&norm(s)!==norm(state.first.lockedText);
  var secondOk=focusOk&&(state.second.spoken||(distinct&&(focusApplied()||state.second.own)));
  var reflectOk=state.improved.length>=1;
  return {goalOk:goalOk,recallOk:recallOk,firstOk:firstOk,focusOk:focusOk,secondOk:secondOk,reflectOk:reflectOk,
    all:goalOk&&recallOk&&firstOk&&focusOk&&secondOk&&reflectOk};
}
function maxScreen(){
  var v=validate();
  if(!v.goalOk)return 1;
  if(!v.recallOk)return 2;
  if(!v.firstOk)return 3;
  if(!v.focusOk)return 4;
  if(!v.secondOk)return 5;
  if(!v.reflectOk)return 6;
  return 7;
}

function findAPI(w){
  var n=0;

    try{ if(w.API_1484_11)return {v:"2004",api:w.API_1484_11}; if(w.API)return {v:"1.2",api:w.API}; }catch(e){return null;}
    try{ if(w.parent&&w.parent!==w){w=w.parent;}else{break;} }catch(e){break;}
  }
  return null;
}
function getLMS(){
  if(lms)return lms;
  var f=null;
  try{f=findAPI(window);}catch(e){}
  if(!f){try{if(window.opener)f=findAPI(window.opener);}catch(e){}}
  if(f){
    try{ if(f.v==="2004")f.api.Initialize(""); else f.api.LMSInitialize(""); }catch(e){}
    lms=f;
  }
  return lms;
}

function lset(el,v){var l=getLMS();if(!l)return false;try{var r=l.v==="2004"?l.api.SetValue(el,v):l.api.LMSSetValue(el,v);return String(r)!=="false";}catch(e){return false;}}

function compact(){

  return JSON.stringify({v:1,s:state.screen,g:state.goal,
    r:{a:state.recall.a,b:state.recall.b.map(cap),c:state.recall.c,h:state.recall.hints,x:state.recall.shown,k:state.recall.ok},
    f:{m:state.first.mode,t:cap(state.first.text),b:state.first.build,l:state.first.locked,lt:cap(state.first.lockedText)},
    fo:state.focus,mu:state.modelUsed,
    sc:{m:state.second.mode,t:cap(state.second.text),b:state.second.build,sp:state.second.spoken,o:state.second.own},
    im:state.improved});

function expand(raw){
  var o=JSON.parse(raw); if(!o||o.v!==1)return null;
  var s=fresh(), ok=function(a,n){return Array.isArray(a)&&a.length===n;};
  s.screen=Math.min(7,Math.max(1,parseInt(o.s,10)||1));
  s.goal=(o.g==="a"||o.g==="b"||o.g==="c")?o.g:"";
  if(o.r){ if(ok(o.r.a,3))s.recall.a=o.r.a.map(String); if(ok(o.r.b,2))s.recall.b=o.r.b.map(String); if(ok(o.r.c,2))s.recall.c=o.r.c.map(String);
    if(o.r.h)s.recall.hints={a:+o.r.h.a||0,b:+o.r.h.b||0,c:+o.r.h.c||0};
    if(o.r.x)s.recall.shown={a:!!o.r.x.a,b:!!o.r.x.b,c:!!o.r.x.c}; if(o.r.k)s.recall.ok={a:!!o.r.k.a,b:!!o.r.k.b,c:!!o.r.k.c}; }
  if(o.f){ s.first.mode=o.f.m==="build"?"build":"type"; s.first.text=String(o.f.t||"").slice(0,400); s.first.build=cleanBuild(o.f.b); s.first.locked=!!o.f.l; s.first.lockedText=String(o.f.lt||"").slice(0,400); }
  s.focus=Array.isArray(o.fo)?o.fo.filter(function(x){return FOCUS.indexOf(x)>-1;}).slice(0,2):[];
  s.modelUsed=!!o.mu;
  if(o.sc){ s.second.mode=o.sc.m==="build"?"build":"type"; s.second.text=String(o.sc.t||"").slice(0,400); s.second.build=cleanBuild(o.sc.b); s.second.spoken=!!o.sc.sp; s.second.own=!!o.sc.o; }
  var okI=["purpose","info","phrase","end","not"];
  s.improved=Array.isArray(o.im)?o.im.filter(function(x){return okI.indexOf(x)>-1;}):[];
  return s;
}
function cleanBuild(b){
  b=b||{}; var ok=function(v,l){return l.indexOf(v)>-1?v:"";};
  return {p:ok(b.p,BUILD_P),r:ok(b.r,BUILD_R),c:ok(b.c,BUILD_C),e:!!b.e};
}

function load(){
  var raw="";

  if(!raw||raw.length>4000){try{raw=localStorage.getItem(KEY)||"";}catch(e){raw="";}}

  try{var s=expand(raw); if(s)state=s;}catch(e){ try{localStorage.removeItem(KEY);}catch(x){} }
  try{var L=localStorage.getItem(LKEY); if(L==="fr"||L==="en")lang=L;}catch(e){}
}
function activityCompleted(){
  if(completionSent)return true;
  var l=getLMS(), ok=true;
  if(l){
    var st=lmsStatus();

    else{

    }
  } else {

/* ============ RECORDING (optional, local only) ============ */
function stopStream(r){
  if(r.stream){try{r.stream.getTracks().forEach(function(tr){tr.stop();});}catch(e){} r.stream=null;}
}
function revoke(r){ if(r.url){try{URL.revokeObjectURL(r.url);}catch(e){} r.url=null;} }
function supported(){
  return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&typeof window.MediaRecorder!=="undefined");
}
function updateRec(which){
  var box=$("rec-"+which); if(!box)return;
  var r=rec[which], s=r.status, msg="";
  if(s==="idle")msg=t("recIdle"); else if(s==="asking")msg=t("recAsk"); else if(s==="recording")msg=t("recOn"); else if(s==="ready")msg=t("recReady");
  else if(s==="error")msg=t(r.err);
  var h='<p class="rec-status" role="status">'+esc(msg)+'</p><div class="row">';
  var canRec=(s==="idle"||s==="ready"||s==="error");
  h+='<button type="button" class="btn small" data-act="rec" data-w="'+which+'" id="recBtn-'+which+'" '+(canRec?"":"disabled")+'>'+(s==="ready"?t("againBtn"):t("recBtn"))+'</button>';
  h+='<button type="button" class="btn small secondary" data-act="stop" data-w="'+which+'" id="stopBtn-'+which+'" '+(s==="recording"?"":"disabled")+'>'+t("stopBtn")+'</button>';
  h+='</div>';
  if(s==="ready"&&r.url){h+='<p style="margin:6px 0 0"><strong>'+t("hearLbl")+'</strong></p><audio controls src="'+r.url+'" aria-label="'+esc(t("hearLbl"))+'"></audio>';}
  box.innerHTML=h;
}
function startRec(which){
  var r=rec[which];
  if(!supported()){r.status="error";r.err="recUnsup";updateRec(which);announce(t("recUnsup"));return;}
  revoke(r); stopStream(r); r.chunks=[]; r.status="asking"; updateRec(which);
  var p;
  try{p=navigator.mediaDevices.getUserMedia({audio:true});}catch(e){r.status="error";r.err="recFail";updateRec(which);return;}
  p.then(function(stream){
    r.stream=stream;
    var mr;
    try{mr=new MediaRecorder(stream);}catch(e){stopStream(r);r.status="error";r.err="recUnsup";updateRec(which);return;}
    r.mr=mr;
    mr.ondataavailable=function(ev){if(ev.data&&ev.data.size>0)r.chunks.push(ev.data);};
    mr.onerror=function(){stopStream(r);r.status="error";r.err="recFail";updateRec(which);};
    mr.onstop=function(){
      stopStream(r);
      var blob=new Blob(r.chunks,{type:(mr.mimeType||"audio/webm")});
      r.chunks=[];
      if(!blob.size){r.status="error";r.err="recEmpty";}
      else{r.url=URL.createObjectURL(blob);r.status="ready";}
      updateRec(which);
      announce(t(r.status==="ready"?"recReady":r.err));
    };
    try{mr.start();r.status="recording";}catch(e){stopStream(r);r.status="error";r.err="recFail";}
    updateRec(which); announce(t(r.status==="recording"?"recOn":"recFail"));
  }).catch(function(err){
    var nm=err&&err.name;
    r.status="error";
    if(nm==="NotAllowedError"||nm==="SecurityError"||nm==="PermissionDeniedError")r.err="recDenied";
    else if(nm==="NotFoundError"||nm==="OverconstrainedError"||nm==="DevicesNotFoundError")r.err="recNoDev";
    else r.err="recFail";
    updateRec(which); announce(t(r.err));
  });
}
function stopRec(which){
  var r=rec[which];
  try{if(r.mr&&r.mr.state==="recording")r.mr.stop();else{stopStream(r);r.status="idle";updateRec(which);}}catch(e){stopStream(r);r.status="error";r.err="recFail";updateRec(which);}
}
function cleanupRec(){["first","second"].forEach(function(w){var r=rec[w];try{if(r.mr&&r.mr.state==="recording"){r.mr.onstop=null;r.mr.stop();}}catch(e){} stopStream(r);revoke(r);rec[w]=blankRec();});}
window.addEventListener("pagehide",cleanupRec);
window.addEventListener("beforeunload",cleanupRec);

/* ============ EVENTS ============ */
function setFb(k,type,keys){ui.fb[k]=keys;ui.fbType[k]=type;}

main.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b)return;
  var act=b.getAttribute("data-act"), k=b.getAttribute("data-k"), w=b.getAttribute("data-w");
  if(act==="hint"){state.recall.hints[k]=Math.min(2,state.recall.hints[k]+1);save();render();var nb=$("hint-"+k)||$("show-"+k);if(nb)nb.focus();announce(t("hintWord",{n:state.recall.hints[k]}));}
  else if(act==="show"){
    state.recall.shown[k]=true;
    if(k==="a")state.recall.a=["microphone","link","password"];
    if(k==="b")state.recall.b=["microphone","video"];
    if(k==="c")state.recall.c=["hear","send"];
    setFb(k,"ok",["shownMsg","ok"+k.toUpperCase()]);
    save();render();announce(fbText(k));
  }
  else if(act==="check"){
    var ok=k==="a"?checkA():k==="b"?checkB():checkC();
    var filled=k==="a"?state.recall.a.every(Boolean):k==="b"?state.recall.b.every(function(x){return x.trim();}):state.recall.c.every(Boolean);
    state.recall.ok[k]=!!ok;
    if(ok)setFb(k,"ok",["ok"+k.toUpperCase()]);
    else setFb(k,"try",["try"+k.toUpperCase()]);
    save();render();announce(fbText(k));
  }
  else if(act==="copyFirst"){state.second.text=state.first.lockedText;state.second.own=false;state.improved=[];save();render();var ta=$("second-text");if(ta)ta.focus();}
  else if(act==="addPhrase"){
    state.second.mode="type";
    var cur=state.second.text.trim();
    state.second.text=(cur?cur+" ":"")+PH[k].en;
    state.second.text=state.second.text.slice(0,400);
    state.improved=[];
    save();render();announce(PH[k].en);
  }
  else if(act==="rec"){startRec(w);}
  else if(act==="stop"){stopRec(w);}
});

main.addEventListener("input",function(e){
  var f=e.target.getAttribute&&e.target.getAttribute("data-field"); if(!f)return;
  if(f==="first-text"){state.first.text=e.target.value;save();updateNav();}
  else if(f==="second-text"){state.second.text=e.target.value;state.improved=[];save();updateCheckPanel();updateNav();}
  else if(f==="b0"||f==="b1"){state.recall.b[+f.charAt(1)]=e.target.value;save();}
});

main.addEventListener("change",function(e){
  var el=e.target, name=el.name, f=el.getAttribute("data-field");
  if(name==="goal"){
    state.goal=el.value;
    if(el.value==="b")setFb("goal","ok",["s1ok"]); else setFb("goal","try",["s1try"]);
    save();render();announce(fbText("goal"));return;
  }
  if(f&&/^a[0-2]$/.test(f)){state.recall.a[+f.charAt(1)]=el.value;ui.fb.a=null;save();return;}
  if(name==="c0"||name==="c1"){state.recall[("c")][+name.charAt(1)]=el.value;ui.fb.c=null;save();render();return;}
  if(/^mode-(first|second)$/.test(name)){
    var wh=name.split("-")[1]; state[wh].mode=el.value; if(wh==="second"){state.improved=[];} save();render();return;
  }
  if(f&&/^(first|second)-b-[prc]$/.test(f)){
    var p=f.split("-"); state[p[0]].build[p[2]]=el.value; if(p[0]==="second")state.improved=[]; save();render();return;
  }
  if(name==="first-e"||name==="second-e"){
    var w2=name.split("-")[0]; state[w2].build.e=el.checked; if(w2==="second")state.improved=[]; save();render();return;
  }
  if(name==="focus"){
    var arr=state.focus.slice(), v=el.value, i=arr.indexOf(v);
    if(el.checked&&i<0){arr.push(v);if(arr.length>2)arr.shift();}
    if(!el.checked&&i>-1)arr.splice(i,1);
    state.focus=arr; state.improved=[]; save();render();return;
  }
  if(name==="spoken"){
    state.second.spoken=el.checked&&state.focus.length>0;
    if(el.checked&&!state.focus.length){announce(t("spokenNeed"));}
    state.improved=[]; save();render();
    if(el.checked&&!state.focus.length){var sn=document.createElement("p");sn.className="fb";sn.textContent=t("spokenNeed");var sc=$("spokenChk");if(sc)sc.closest(".card").appendChild(sn);}
    return;
  }
  if(name==="improved"){
    var im=state.improved.slice(), val=el.value, j=im.indexOf(val);
    if(el.checked){ if(val==="not")im=["not"]; else {im=im.filter(function(x){return x!=="not";}); if(j<0)im.push(val);} }
    else if(j>-1)im.splice(j,1);
    state.improved=im; save();render();return;
  }
});
main.addEventListener("toggle",function(e){
  if(e.target&&e.target.id==="exampleBox"&&e.target.open&&!state.modelUsed){state.modelUsed=true;save();}
},true);

carry.addEventListener("click",function(){
  var n=state.screen, v=validate();
  if(!canGo(n,v))return;
  if(n===3&&!state.first.locked){state.first.locked=true;state.first.lockedText=attemptText("first");}
  if(n===3&&state.first.locked&&norm(state.first.lockedText)!==norm(attemptText("first"))){state.first.lockedText=attemptText("first");}
  go(n+1);
});

$("langBtn").addEventListener("click",function(){
  lang=(lang==="en")?"fr":"en";
  try{localStorage.setItem(LKEY,lang);}catch(e){}
  render();
  $("langBtn").focus();
  announce(lang==="fr"?"Français":"English");
});

tryBtn.addEventListener("click",function(){
  cleanupRec();
  state=fresh(); ui=freshUI();
  try{localStorage.removeItem(KEY);}catch(e){}
  if(getLMS()){lset("cmi.suspend_data","");lcommit();}
  doneBtn.disabled=true;
  render({focusHeading:true});
  announce(t("step",{n:1}));
});

doneBtn.addEventListener("click",function(){
  if(doneBtn.disabled)return;
  var v=validate();
  if(state.screen!==7||!v.all)return;
  activityCompleted();
  ui.doneNote=true;
  var dn=$("doneNote"); if(dn)dn.textContent=t("doneOk");
  announce(t("doneOk"));
});

/* ============ INIT ============ */
load();
state.screen=Math.min(state.screen,maxScreen());
/* a restored first attempt must still match the saved text */
if(state.screen<=3){ /* first try not yet locked on screens before review */ }
render({focusHeading:false});
setTimeout(function(){getLMS();},800); /* re-detect LMS after load */
})();
</script>
