<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedules and availability — Build Useful English</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#D7F1F7;
  --green-tint:#F4F7DA;
  --yellow-tint:#FEF3CD;
  --white:#FFFFFF;
  --focus:3px solid #2E2E2D;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--white);color:var(--pazapa-grey-dark);
  font-family:"Open Sans",Arial,sans-serif;font-size:17px;line-height:1.5;max-width:100%;overflow-x:hidden;}
h1,h2,h3,legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;line-height:1.25;margin:0 0 8px 0;text-transform:none;}
h1{font-size:22px;}
h2{font-size:24px;}
h2:focus{outline:none;}
p{margin:0 0 10px 0;}
.app{max-width:860px;margin:0 auto;padding:14px 16px 48px 16px;}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:4px solid var(--pazapa-blue);}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.logo{display:block;width:120px;height:auto;}
.eyebrow{font-size:13px;font-weight:700;margin:0;overflow-wrap:anywhere;}
.prog{margin:14px 0 18px 0;}
.segs{display:flex;gap:6px;}
.seg{flex:1 1 0;height:10px;border-radius:6px;background:var(--pazapa-grey-light);}
.seg.done{background:var(--pazapa-blue);}
.seg.now{background:var(--pazapa-grey-dark);}
.prog-label{font-size:13px;font-weight:700;margin:6px 0 0 0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.fr{display:none;}
.fr-on .fr{display:block;margin-top:2px;font-style:italic;font-weight:400;}
.fr-on button .fr{font-size:.85em;}

/* buttons */
button{font-family:inherit;font-size:16px;font-weight:700;color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;
  min-height:48px;min-width:48px;padding:10px 20px;border-radius:12px;border:2px solid var(--pazapa-grey-dark);background:var(--white);}
button:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-within{outline:var(--focus);outline-offset:2px;}
button.primary{background:var(--pazapa-blue);}
button.primary:disabled{background:var(--pazapa-grey-light);color:#5a5a59;border-color:var(--pazapa-grey-light);cursor:not-allowed;}
button.help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
button.ghost{border-color:var(--pazapa-grey-light);}
button[aria-pressed="true"].tog{background:var(--pazapa-grey-dark);color:var(--white);}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;justify-content:flex-end;}
.nav .left{margin-right:auto;}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}

.screen{display:none;}
.screen.active{display:block;}
.lead{font-size:17px;margin-bottom:14px;}

/* screen 1 strips */
.strips{display:flex;flex-direction:column;gap:12px;margin:12px 0;}
.strip{display:flex;gap:14px;align-items:stretch;border:2px solid var(--pazapa-grey-light);border-left:10px solid var(--pazapa-blue);border-radius:14px;padding:10px 12px;background:var(--white);}
.strip:nth-child(even){border-left-color:var(--pazapa-green);}
.strip:nth-child(3n){border-left-color:var(--pazapa-yellow);}
.pic{flex:0 0 96px;display:flex;align-items:center;justify-content:center;background:#FFF8EA;border-radius:10px;padding:4px;}
.pic img{display:block;width:100%;height:auto;max-height:128px;object-fit:contain;}
.strip-body{flex:1 1 200px;min-width:0;}
.ctx{font-size:13px;font-weight:800;margin:0 0 4px 0;}
.sent{font-size:20px;font-weight:800;margin:0 0 4px 0;overflow-wrap:anywhere;}
.swap{display:inline-block;border-bottom:3px dotted var(--pazapa-grey-dark);background:var(--yellow-tint);padding:0 4px;border-radius:4px 4px 0 0;}
.swap-t{display:inline-block;font-size:11px;font-weight:800;margin-left:4px;vertical-align:middle;border:1px solid var(--pazapa-grey-dark);border-radius:8px;padding:0 5px;background:var(--white);}
.note{font-size:15px;margin:0;}
.note b{font-weight:800;}
.legend-box{background:var(--blue-tint);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:15px;}

/* item cards */
.item{border:2px solid var(--pazapa-grey-light);border-radius:14px;padding:12px 14px 14px 14px;margin:0 0 14px 0;background:var(--white);min-width:0;}
.item legend{font-size:17px;padding:0 6px;display:flex;gap:10px;align-items:flex-start;}
.num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--pazapa-blue);font-size:15px;}
.q{display:block;min-width:0;overflow-wrap:anywhere;}
.item.ok{border-color:var(--pazapa-green);background:var(--green-tint);}
.item.retry{border-color:var(--pazapa-yellow);background:#FFFBEB;}
.line{list-style:none;margin:8px 0;padding:8px;display:flex;flex-wrap:wrap;gap:8px;min-height:62px;border:2px dashed var(--pazapa-blue);border-radius:12px;background:var(--blue-tint);}
.line li{margin:0;}
.line li.ph{align-self:center;font-size:14px;padding:0 6px;}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-radius:12px;background:var(--pazapa-grey-light);min-height:62px;}
.chunk{background:var(--white);border:2px solid var(--pazapa-blue);padding:10px 16px;font-size:17px;}
.chunk.placed{background:var(--pazapa-blue);}
.chunk.sel{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
.fb{margin-top:10px;font-weight:700;font-size:15px;}
.fb .msg{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 12px;}
.fb .msg.ok{background:var(--green-tint);border:2px solid var(--pazapa-green);}
.fb .msg.retry{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);}
.fb .msg.info{background:var(--blue-tint);border:2px solid var(--pazapa-blue);}
.fb .ic{flex:0 0 auto;font-weight:800;}
.fb ul{margin:6px 0 0 0;padding-left:0;list-style:none;font-weight:600;}
.fb li{margin:2px 0;}
.sug{font-weight:600;margin-top:6px;font-size:15px;}
.screen-fb{margin-top:8px;font-weight:700;min-height:24px;}

/* gaps */
.bankbox{border:2px solid var(--pazapa-yellow);background:var(--yellow-tint);border-radius:14px;padding:10px 14px;margin-bottom:14px;}
.bankbox .bank{background:transparent;padding:4px 0;min-height:0;}
.wordchip{background:var(--white);border:2px solid var(--pazapa-grey-dark);}
.gaprow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.gap-pic{flex:0 0 76px;background:#FFF8EA;border-radius:10px;padding:3px;}
.gap-pic img{display:block;width:100%;height:auto;max-height:100px;object-fit:contain;}
.gap-main{flex:1 1 220px;min-width:0;}
.clue{font-size:14px;font-weight:700;margin:0 0 4px 0;}
.gapsent{font-size:20px;font-weight:700;margin:0;overflow-wrap:anywhere;}
input[type=text]{font-family:inherit;font-size:18px;font-weight:700;min-height:48px;width:150px;max-width:100%;padding:6px 10px;border:2px solid var(--pazapa-grey-dark);border-radius:10px;background:var(--white);color:var(--pazapa-grey-dark);}
input.wide{width:100%;}

/* choices */
.sit{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
.sit .pic{flex:0 0 84px;}
.sit-main{flex:1 1 240px;min-width:0;}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:48px;padding:10px 12px;border:2px solid var(--pazapa-blue);border-radius:12px;background:var(--white);cursor:pointer;touch-action:manipulation;}
.opt input{width:24px;height:24px;margin:2px 0 0 0;flex:0 0 auto;accent-color:#2E2E2D;}
.opt .ot{flex:1 1 auto;min-width:0;font-weight:700;}
.opt.ok{background:var(--green-tint);border-color:var(--pazapa-green);}
.opt.retry{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.opt .tag{font-size:13px;font-weight:800;}

/* application */
.task-sit{background:var(--blue-tint);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
.task-sit .pic{flex:0 0 84px;background:var(--white);}
.task-sit .tx{flex:1 1 240px;min-width:0;}
.choices-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
.radiochip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 14px;border:2px solid var(--pazapa-blue);border-radius:12px;background:var(--white);cursor:pointer;font-weight:700;touch-action:manipulation;}
.radiochip input{width:22px;height:22px;accent-color:#2E2E2D;margin:0;}
.radiochip.on{background:var(--blue-tint);border-color:var(--pazapa-grey-dark);}
.starter{font-size:19px;font-weight:800;margin:4px 0 6px 0;}
.preview{background:var(--white);border:2px solid var(--pazapa-grey-dark);border-radius:12px;padding:10px 14px;font-weight:700;font-size:18px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;}
.preview .lab{display:block;font-size:12px;font-weight:800;margin-bottom:2px;}

/* completion */
.final{background:var(--green-tint);border:2px solid var(--pazapa-green);border-radius:16px;padding:18px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.final .pic{flex:0 0 130px;background:#FFF8EA;}
.final .tx{flex:1 1 240px;min-width:0;}
.final .big{font-size:20px;font-weight:800;}
.confirm{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);border-radius:14px;padding:14px 16px;margin-top:12px;}
.confirm p{font-weight:700;}
.done-note{font-weight:700;min-height:24px;margin-top:10px;}

@media (max-width:480px){
  html,body{font-size:16px;}
  .pic{flex-basis:76px;}
  .strip{padding:8px 10px;}
  .sent{font-size:18px;}
  .gapsent{font-size:18px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <img class="logo" id="logo" alt="Pazapa">
      <div>
        <p class="eyebrow">Schedules and availability</p>
        <h1>Build Useful English</h1>
      </div>
    </div>
    <button type="button" class="tog" id="frBtn" aria-pressed="false" aria-label="Show French translation">Français</button>
  </header>
  <nav class="prog" aria-label="Progress">
    <div class="segs" id="segs"></div>
    <p class="prog-label" id="progLabel">Screen 1 of 6</p>
  </nav>
  <div class="sr-only" id="live" aria-live="polite" role="status"></div>
  <main id="main"></main>
</div>

/* ---------- helpers ---------- */
function h(tag, props){
  var e = document.createElement(tag);
  if(props){ Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v === null || v === undefined || v === false) return;
    if(k === 'class') e.className = v;
    else if(k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if(v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }); }
  for(var i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function append(e, c){
  if(c === null || c === undefined || c === false) return;
  if(Array.isArray(c)){ c.forEach(function(x){append(e,x);}); return; }
  e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
function fr(t){ return h('span',{'class':'fr',lang:'fr'},t); }
function bi(pair){ return [pair[0], fr(pair[1])]; }
function shuffle(a){
  var r = a.slice();
  for(var i = r.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function norm(s){
  return String(s == null ? '' : s).normalize('NFKC')
    .replace(/[‘’ʼ`´]/g,"'")
    .replace(/\s+/g,' ').trim().toLowerCase()
    .replace(/[.!?,;:]+$/,'').trim();
}
function announce(msg){
  var el = document.getElementById('live');
  el.textContent = '';
  window.setTimeout(function(){ el.textContent = msg; }, 40);
}
function same(a,b){ return a.length === b.length && a.every(function(x,i){return x === b[i];}); }
function focusFk(k){
  var f = document.querySelector('[data-fk="'+k+'"]');
  if(f) f.focus();
}
function msgBox(kind, icon, en, frText){
  return h('div',{'class':'msg '+kind},
    h('span',{'class':'ic','aria-hidden':'true'},icon),
    h('span',null,en, frText ? fr(frText) : null));
}

/* ---------- persistence (LMS or local, no visible messages) ---------- */
var LMS = {api:null, ver:null, inited:false};
function findAPIIn(win){
  var n = 0;
  while(win && n++ < 12){
    try{
      if(win.API_1484_11) return {api:win.API_1484_11, ver:'2004'};
      if(win.API) return {api:win.API, ver:'1.2'};
    }catch(e){}
    var p = null;
    try{ p = win.parent; }catch(e2){ p = null; }
    if(!p || p === win) break;
    win = p;
  }
  return null;
}
function detectLMS(){
  if(LMS.api) return true;
  var r = null;
  try{ r = findAPIIn(window); }catch(e){ r = null; }
  if(!r){ try{ if(window.opener && window.opener !== window) r = findAPIIn(window.opener); }catch(e2){ r = null; } }
  if(!r) return false;
  LMS.api = r.api; LMS.ver = r.ver;
  try{
    var ok = LMS.ver === '2004' ? String(LMS.api.Initialize('')) : String(LMS.api.LMSInitialize(''));
    LMS.inited = (ok === 'true');
    if(!LMS.inited){
      var code = LMS.ver === '2004' ? String(LMS.api.GetLastError()) : String(LMS.api.LMSGetLastError());
      LMS.inited = (code === '103' || code === '101' ? code === '103' : false);
    }
  }catch(e3){ LMS.inited = false; }
  if(!LMS.inited){ LMS.api = null; LMS.ver = null; return false; }
  return true;
}
function lmsGet(k){
  try{ var v = LMS.ver === '2004' ? LMS.api.GetValue(k) : LMS.api.LMSGetValue(k); return v == null ? null : String(v); }catch(e){ return null; }
}
function lmsSet(k,v){
  try{ var r = LMS.ver === '2004' ? LMS.api.SetValue(k,v) : LMS.api.LMSSetValue(k,v); return String(r) === 'true'; }catch(e){ return false; }
}
function lmsCommit(){
  try{ var r = LMS.ver === '2004' ? LMS.api.Commit('') : LMS.api.LMSCommit(''); return String(r) === 'true'; }catch(e){ return false; }
}
function lmsStatus(){
  if(LMS.ver === '2004'){
    var c = lmsGet('cmi.completion_status'); var s = lmsGet('cmi.success_status');
    if(c === null && s === null) return null;
    return (s === 'passed') ? 'passed' : c;
  }
  return lmsGet('cmi.core.lesson_status');
}
function isDoneStatus(s){ return s === 'completed' || s === 'passed'; }

function buildBlob(forLms){
  var o = S.ord.map(function(x){ return [x.seq.join(''), x.att, x.rev?1:0, x.st?1:0]; });
  var g = S.gap.map(function(x){ return [x.val.slice(0,24), x.att, x.rev?1:0, x.st?1:0]; });
  var c = S.cho.map(function(x){ return [x.sel, x.att, x.rev?1:0, x.st?1:0]; });
  var a = S.app;
  var blob = {v:VERSION, t:Date.now(), s:S.screen, f:S.fr?1:0, d:S.done?1:0, o:o, g:g, c:c,
    a:[a.s1, forLms ? a.s2.slice(0,80) : a.s2.slice(0,140), a.att[0], a.att[1], a.rev[0]?1:0, a.rev[1]?1:0, a.st[0]?1:0, a.st[1]?1:0]};
  return JSON.stringify(blob);
}
function saveProgress(){
  try{ window.localStorage.setItem(KEY, buildBlob(false)); }catch(e){}
  try{
    if(detectLMS()){
      var b = buildBlob(true);
      if(b.length > 3500) b = b.slice(0,0) || buildBlob(true).replace(/"a":\[.*?\]\}/,'"a":["","",0,0,0,0,0,0]}');
      if(b.length <= 3900){ lmsSet('cmi.suspend_data', b); }
      var st = lmsStatus();
      if(st === 'not attempted' || st === 'unknown' || st === '' || st === 'browsed' || st === null){
        if(LMS.ver === '2004') lmsSet('cmi.completion_status','incomplete');
        else if(st !== null) lmsSet('cmi.core.lesson_status','incomplete');
      }
      lmsCommit();
      if(S.done && !completionSent) submitCompletion();
    }
  }catch(e2){}
}
function readStored(){
  var best = null;
  function take(txt){
    if(!txt) return;
    try{
      var o = JSON.parse(txt);
      if(o && typeof o === 'object' && o.v === VERSION && typeof o.t === 'number'){
        if(!best || o.t > best.t) best = o;
      }
    }catch(e){}
  }
  try{ take(window.localStorage.getItem(KEY)); }catch(e){}
  try{ if(detectLMS()) take(lmsGet('cmi.suspend_data')); }catch(e2){}
  return best;
}
function clearStored(){
  try{ window.localStorage.removeItem(KEY); }catch(e){}
  try{ if(detectLMS()){ lmsSet('cmi.suspend_data',''); lmsCommit(); } }catch(e2){}
}

/* ---------- checking logic ---------- */
function evalOrd(i){
  var st = S.ord[i], it = CONFIG.ord[i];
  return it.valid.some(function(v){ return same(v, st.seq); });
}
function evalGap(i){
  var v = norm(S.gap[i].val);
  return CONFIG.gaps[i].ok.some(function(a){ return norm(a) === v; });
}
function evalCho(i){ return S.cho[i].sel === CONFIG.cho[i].ok; }
function analyseS2(txt){
  var t = norm(txt);
  var avail = /\b(i'?m|i am)\s+available\b/.test(t) || /\bi can work\b/.test(t);
  var time = /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|next week|morning|afternoon|evening)\b/.test(t) ||
             /\b(\d{1,2}([:.]\d{2})?|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/.test(t);
  var segs = String(txt||'').split(/[.!?]+/).map(function(x){return x.trim();}).filter(Boolean);
  var one = segs.length <= 1;
  return {avail:avail, time:time, one:one, any:t.length > 0};
}
function suggestS2(txt){
  var s = String(txt||'').normalize('NFKC').replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim();
  if(!s) return '';
  s = s.replace(/\bi\b/g,'I').replace(/\bim\b/gi,"I'm");
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if(!/[.!?]$/.test(s)) s += '.';
  return s;
}
function resolved(x){ return x.st === 1 || x.rev; }
function validScreen(n){
  if(n === 2) return S.ord.every(resolved);
  if(n === 3) return S.gap.every(resolved);
  if(n === 4) return S.cho.every(resolved);
  if(n === 5) return resolved({st:S.app.st[0],rev:S.app.rev[0]}) && resolved({st:S.app.st[1],rev:S.app.rev[1]});
  return true;
}
function allValid(){ return validScreen(2) && validScreen(3) && validScreen(4) && validScreen(5); }

/* ---------- navigation ---------- */
var main, screens = {};
function buildProgress(){
  var segs = document.getElementById('segs'); segs.textContent = '';
  for(var i = 1; i <= TOTAL; i++) segs.appendChild(h('div',{'class':'seg','data-seg':String(i)}));
}
function paintProgress(){
  var segs = document.querySelectorAll('.seg');
  Array.prototype.forEach.call(segs, function(s,i){
    var n = i + 1;
    s.className = 'seg' + (n < S.screen ? ' done' : (n === S.screen ? ' now' : ''));
  });
  document.getElementById('progLabel').textContent = 'Screen ' + S.screen + ' of ' + TOTAL;
}
function go(n, silent){
  if(n < 1 || n > TOTAL) return;
  for(var k = 1; k <= TOTAL; k++){
    var sc = screens[k];
    sc.classList.toggle('active', k === n);
    sc.setAttribute('aria-hidden', k === n ? 'false' : 'true');
  }
  S.screen = n;
  paintProgress();
  var hd = screens[n].querySelector('h2');
  if(hd){ hd.setAttribute('tabindex','-1'); hd.focus(); }
  if(!silent) announce('Screen ' + n + ' of ' + TOTAL + '. ' + (hd ? hd.textContent.replace(/\s+/g,' ') : ''));
  updateNav();
  window.scrollTo(0,0);
  saveProgress();
}
function updateNav(){
  [2,3,4,5].forEach(function(n){ if(contBtns[n]) contBtns[n].disabled = !validScreen(n); });
  updateDone();
}
function updateDone(){
  doneBtn.disabled = !(S.screen === 6 && allValid()) || (S.done && completionSent && false);
}

function chunkText(i,id){ var c = CONFIG.ord[i].chunks.filter(function(x){return x.id===id;})[0]; return c ? c.t : ''; }
function renderOrd(i, focusKey){
  var it = CONFIG.ord[i], st = S.ord[i], box = ordBoxes[i];
  box.textContent = '';
  box.className = 'item' + (st.st === 1 || st.rev ? ' ok' : (st.st === 2 ? ' retry' : ''));
  var locked = st.rev;
  box.appendChild(h('legend',null,h('span',{'class':'num','aria-hidden':'true'},String(i+1)),
    h('span',{'class':'q'},'Sentence '+(i+1)+': ',it.prompt[0],fr(it.prompt[1]))));
  var line = h('ol',{'class':'line','aria-label':'Your sentence '+(i+1)+', in order'});
  if(!st.seq.length) line.appendChild(h('li',{'class':'ph'},'Tap the chunks below.'));
  st.seq.forEach(function(id,p){
    var on = st.sel === p;
    line.appendChild(h('li',null,h('button',{type:'button','class':'chunk placed'+(on?' sel':''),'aria-pressed':on?'true':'false',
      'data-fk':'o'+i+'p'+p, disabled:locked,
      'aria-label':'Position '+(p+1)+' of '+st.seq.length+': '+chunkText(i,id)+'. Press to select it.',
      onclick:function(){
        st.sel = (st.sel === p) ? -1 : p;
        announce(st.sel === -1 ? 'Selection cleared.' : chunkText(i,id)+' selected. Position '+(p+1)+' of '+st.seq.length+'. Use Move left, Move right or Remove.');
        renderOrd(i,'o'+i+'p'+p);
      }}, chunkText(i,id))));
  });
  box.appendChild(line);
  if(st.sel > -1 && !locked){
    var p = st.sel;
    box.appendChild(h('div',{'class':'ctrl',role:'group','aria-label':'Change the selected chunk'},
      h('button',{type:'button','data-fk':'o'+i+'L',disabled:p===0,onclick:function(){ moveOrd(i,-1); }},'Move left',fr('Déplacer à gauche')),
      h('button',{type:'button','data-fk':'o'+i+'R',disabled:p===st.seq.length-1,onclick:function(){ moveOrd(i,1); }},'Move right',fr('Déplacer à droite')),
      h('button',{type:'button',onclick:function(){ removeOrd(i); }},'Remove',fr('Retirer'))));
  }
  var bankIds = SHUF.ord[i].filter(function(id){ return st.seq.indexOf(id) === -1; });
  var bank = h('div',{'class':'bank',role:'group','aria-label':'Chunks not yet placed'});
  bankIds.forEach(function(id){
    bank.appendChild(h('button',{type:'button','class':'chunk','data-fk':'o'+i+'b'+id,disabled:locked,
      'aria-label':'Add chunk: '+chunkText(i,id),
      onclick:function(){
        st.seq.push(id); st.sel = -1; invalidateOrd(i);
        announce('Placed: '+chunkText(i,id)+'. Position '+st.seq.length+' of '+it.chunks.length+'.');
        renderOrd(i, 'o'+i+'p'+(st.seq.length-1));
        updateNav(); saveProgress();
      }}, chunkText(i,id)));
  });
  if(!bankIds.length) bank.appendChild(h('span',{'class':'ph',style:'font-size:14px;padding:6px;'},'All chunks are placed.'));
  box.appendChild(bank);
  var fb = h('div',{'class':'fb'});
  paintOrdFb(i, fb);
  box.appendChild(fb);
  if(focusKey) focusFk(focusKey);
}
function invalidateOrd(i){
  var st = S.ord[i];
  if(st.st !== 0){ st.st = 0; }
}
function moveOrd(i,d){
  var st = S.ord[i], p = st.sel, q = p + d;
  if(q < 0 || q >= st.seq.length) return;
  var t = st.seq[p]; st.seq[p] = st.seq[q]; st.seq[q] = t;
  st.sel = q; invalidateOrd(i);
  announce(chunkText(i,st.seq[q])+' moved to position '+(q+1)+' of '+st.seq.length+'.');
  renderOrd(i,'o'+i+'p'+q); updateNav(); saveProgress();
}
function removeOrd(i){
  var st = S.ord[i], p = st.sel;
  var id = st.seq.splice(p,1)[0]; st.sel = -1; invalidateOrd(i);
  announce(chunkText(i,id)+' removed. '+st.seq.length+' chunks placed.');
  renderOrd(i,'o'+i+'b'+id); updateNav(); saveProgress();
}
function paintOrdFb(i, fb){
  var st = S.ord[i];
  fb.textContent = '';
  if(st.rev){
    fb.appendChild(msgBox('info','i','Shown. Read the sentence again and say it aloud.','Voici la phrase. Relisez-la et dites-la à voix haute.'));
    return;
  }
  if(st.st === 1){ fb.appendChild(msgBox('ok','✓','Correct. Well done.','Correct. Bravo.')); return; }
  if(st.st === 2){
    var ref = CONFIG.ord[i].valid[0], bad = 0;
    for(var k = 0; k < ref.length; k++){ if(st.seq[k] !== ref[k]){ bad = k + 1; break; } }
    fb.appendChild(msgBox('retry','↻','Not yet. Check place '+bad+'. Your chunks stay here, so change them and check again.',
      'Pas encore. Vérifiez la place '+bad+'. Vos blocs restent ici : changez-les et vérifiez encore.'));
    if(st.att >= 2){
      fb.appendChild(h('div',{'class':'btn-row'},h('button',{type:'button','class':'help',onclick:function(){ showOrd(i); }},'Show me',fr('Montrez-moi'))));
    }
  }
}
function showOrd(i){
  var st = S.ord[i];
  st.seq = CONFIG.ord[i].valid[0].slice(); st.sel = -1; st.rev = true; st.st = 0;
  announce('Answer shown for sentence '+(i+1)+'.');
  renderOrd(i); updateNav(); saveProgress();
}
function checkOrd(){
  var ok = 0, review = 0, incomplete = 0;
  S.ord.forEach(function(st,i){
    if(st.rev){ ok++; return; }
    if(st.seq.length < CONFIG.ord[i].chunks.length){ incomplete++; st.st = 0; }
    else if(evalOrd(i)){ st.st = 1; ok++; }
    else { st.st = 2; st.att++; review++; }
    renderOrd(i);
  });
  var fbEl = screens[2].querySelector('.screen-fb');
  fbEl.textContent = '';
  if(incomplete) fbEl.appendChild(msgBox('info','i','Add all the chunks first for '+incomplete+' sentence'+(incomplete>1?'s':'')+'.','Ajoutez d’abord tous les blocs.'));
  announce(ok+' of '+S.ord.length+' correct.'+(review?' '+review+' to review.':'')+(incomplete?' '+incomplete+' not finished.':''));
  updateNav(); saveProgress();
}
function resetOrd(){
  S.ord = CONFIG.ord.map(function(){return {seq:[],sel:-1,att:0,rev:false,st:0};});
  SHUF.ord = CONFIG.ord.map(function(it){ return shuffle(it.chunks.map(function(c){return c.id;})); });
  screens[2].querySelector('.screen-fb').textContent = '';
  CONFIG.ord.forEach(function(it,i){ renderOrd(i); });
  announce('Screen reset. Start again.');
  updateNav(); saveProgress();
}

function onGapInput(i){

}

}

    h('p',null,'Start this activity again? Your answers on this activity will be cleared.',fr('Recommencer cette activité ? Vos réponses seront effacées.')),
    h('div',{'class':'btn-row'},
      h('button',{type:'button','class':'primary',id:'confirmYes',onclick:function(){ confirmPanel.style.display='none'; resetAll(); }},'Yes, start again',fr('Oui, recommencer')),
      h('button',{type:'button',onclick:function(){ confirmPanel.style.display='none'; document.getElementById('tryAll').focus(); }},'Cancel',fr('Annuler'))));
  sec.append(confirmPanel);
  doneBtn = h('button',{type:'button','class':'primary',id:'doneBtn',onclick:activityCompleted},'Done',fr('Terminé'));
  doneBtn.disabled = true;
  sec.append(h('div',{'class':'nav'},
    h('button',{type:'button','class':'left ghost',id:'tryAll',onclick:function(){
      confirmPanel.style.display = 'block'; document.getElementById('confirmYes').focus();
    }},'Try again',fr('Recommencer')),
    doneBtn));
}
function submitCompletion(){
  if(completionSent) return true;
  if(!detectLMS()) return false;
  var cur = lmsStatus();
  if(isDoneStatus(cur)){ completionSent = true; return true; }
  var ok = LMS.ver === '2004' ? lmsSet('cmi.completion_status','completed') : lmsSet('cmi.core.lesson_status','completed');
  if(ok) ok = lmsCommit();
  if(ok){
    var after = lmsStatus();
    if(after === null || isDoneStatus(after)){ completionSent = true; return true; }
  }
  return false;
}
function paintDone(){
  if(S.done){
    doneBtn.textContent = '';
    doneBtn.appendChild(document.createTextNode('Done ✓'));
    doneBtn.appendChild(fr('Terminé ✓'));
    doneNote.textContent = '';
    doneNote.appendChild(document.createTextNode('Well done. This activity is complete.'));
    doneNote.appendChild(fr('Bravo. Cette activité est terminée.'));
  } else {
    doneBtn.textContent = '';
    doneBtn.appendChild(document.createTextNode('Done'));
    doneBtn.appendChild(fr('Terminé'));
    doneNote.textContent = '';
  }
}
function activityCompleted(){
  if(doneBtn.disabled) return;
  if(!allValid()) return;
  S.done = true;
  paintDone();
  try{ submitCompletion(); }catch(e){}
  try{ console.log('W11D3 Build Useful English completed'); }catch(e2){}
  announce('Activity complete. Well done.');
  saveProgress();
  updateDone();
}
function resetAll(){
  var keepFr = S.fr;
  S = freshState(keepFr);
  activeGap = 0;
  SHUF.ord = CONFIG.ord.map(function(it){ return shuffle(it.chunks.map(function(c){return c.id;})); });
  SHUF.cho = CONFIG.cho.map(function(c){ return shuffle(c.opts.map(function(o){return o.id;})); });
  CONFIG.ord.forEach(function(it,i){ renderOrd(i); });
  gapInputs.forEach(function(inp,i){ inp.value = ''; inp.disabled = false; paintGap(i); });
  CONFIG.cho.forEach(function(c,i){ renderCho(i); });
  appRefs.model.textContent = '';
  paintApp();
  ['2','3','4','5'].forEach(function(n){ var f = screens[n].querySelector('.screen-fb'); if(f) f.textContent = ''; });
  clearStored();
  paintDone();
  go(1);
  announce('Activity reset. Start again.');
}

/* ---------- French toggle ---------- */
function setFr(on, silent){
  S.fr = !!on;
  document.body.classList.toggle('fr-on', S.fr);
  var b = document.getElementById('frBtn');
  b.setAttribute('aria-pressed', S.fr ? 'true' : 'false');
  b.setAttribute('aria-label', S.fr ? 'Hide French translation' : 'Show French translation');
  if(!silent) announce(S.fr ? 'French translation shown.' : 'French translation hidden.');
}

/* ---------- restore (always revalidated against CONFIG) ---------- */
function clampN(n){ n = Math.floor(Number(n)); return (isFinite(n) && n >= 0) ? Math.min(n, 9) : 0; }
function restore(o){
  if(!o) return;
  var ok;
  try{
    if(Array.isArray(o.o)) CONFIG.ord.forEach(function(it,i){
      var r = o.o[i]; if(!Array.isArray(r)) return;
      var ids = it.chunks.map(function(c){return c.id;});
      var seq = String(r[0] || '').split('').filter(function(ch,k,arr){ return ids.indexOf(ch) > -1 && arr.indexOf(ch) === k; });
      var st = S.ord[i]; st.seq = seq; st.att = clampN(r[1]); st.rev = (r[2] === 1 && st.att >= 2);
      if(st.rev){ st.seq = it.valid[0].slice(); }
      else if(r[3] === 1 && seq.length === ids.length){ st.st = evalOrd(i) ? 1 : 2; }
    });
    if(Array.isArray(o.g)) CONFIG.gaps.forEach(function(g,i){
      var r = o.g[i]; if(!Array.isArray(r)) return;
      var st = S.gap[i]; st.val = String(r[0] || '').slice(0,24); st.att = clampN(r[1]); st.rev = (r[2] === 1 && st.att >= 2);
      if(st.rev){ st.val = g.ok[0]; }
      else if(r[3] === 1 && norm(st.val)){ st.st = evalGap(i) ? 1 : 2; }
    });
    if(Array.isArray(o.c)) CONFIG.cho.forEach(function(c,i){
      var r = o.c[i]; if(!Array.isArray(r)) return;
      var valid = c.opts.some(function(x){return x.id === r[0];});
      var st = S.cho[i]; st.att = clampN(r[1]); st.rev = (r[2] === 1 && st.att >= 2);
      if(st.rev){ st.sel = c.ok; }
      else if(valid){ st.sel = r[0]; if(r[3] === 1) st.st = evalCho(i) ? 1 : 2; }
    });
    if(Array.isArray(o.a)){
      var a = o.a, A = S.app;
      A.att = [clampN(a[2]), clampN(a[3])];
      A.rev = [a[4] === 1 && A.att[0] >= 2, a[5] === 1 && A.att[1] >= 2];
      var d = CONFIG.app.details.some(function(x){return x.id === a[0];});
      A.s1 = d ? a[0] : '';
      A.s2 = String(a[1] || '').slice(0,140);
      if(A.rev[0]) A.s1 = CONFIG.app.details[0].id;
      if(A.rev[1]) A.s2 = CONFIG.app.model[0];
      if(!A.rev[0] && a[6] === 1 && A.s1) A.st[0] = 1;
      if(!A.rev[1] && a[7] === 1 && norm(A.s2)){
        var r2 = analyseS2(A.s2); A.st[1] = (r2.avail && r2.time && r2.one) ? 1 : 2;
      }
    }
    S.fr = (o.f === 1);
    /* furthest screen the learner has genuinely earned */
    var max = 1;
    if(true) max = 2;
    if(validScreen(2)) max = 3; else max = 2;
    if(max >= 3 && validScreen(3)) max = 4; else if(max >= 3) max = 3;
    if(max >= 4 && validScreen(4)) max = 5; else if(max >= 4) max = 4;
    if(max >= 5 && validScreen(5)) max = 6; else if(max >= 5) max = 5;
    var want = (typeof o.s === 'number' && o.s >= 1 && o.s <= TOTAL) ? Math.floor(o.s) : 1;
    S.screen = Math.min(want, max);
    S.done = (o.d === 1) && S.screen === 6 && allValid();
    ok = true;
  }catch(e){ ok = false; }
  if(!ok){ S = freshState(false); }
}

/* ---------- boot ---------- */
function boot(){
  document.getElementById('logo').src = IMG.logo;
  main = document.getElementById('main');
  buildProgress();
  for(var n = 1; n <= TOTAL; n++){
    var sec = h('section',{'class':'screen',id:'screen'+n,'aria-hidden':'true'});
    screens[n] = sec; main.appendChild(sec);
  }
  SHUF.ord = CONFIG.ord.map(function(it){ return shuffle(it.chunks.map(function(c){return c.id;})); });
  SHUF.cho = CONFIG.cho.map(function(c){ return shuffle(c.opts.map(function(o){return o.id;})); });
  var stored = readStored();
  if(stored) restore(stored);
  buildScreen1(screens[1]);
  buildScreen2(screens[2]);
  buildScreen3(screens[3]);
  buildScreen4(screens[4]);
  buildScreen5(screens[5]);
  buildScreen6(screens[6]);
  gapInputs.forEach(function(inp,i){ inp.value = S.gap[i].val; paintGap(i); });
  CONFIG.cho.forEach(function(c,i){ renderCho(i); });
  doneBtn.disabled = true;
  if(S.done) completionSent = false;
  paintDone();
  document.getElementById('frBtn').addEventListener('click', function(){ setFr(!S.fr); saveProgress(); });
  setFr(S.fr, true);
  screens[S.screen].classList.add('active');
  screens[S.screen].setAttribute('aria-hidden','false');
  paintProgress();
  updateNav();
  window.addEventListener('beforeunload', function(){ try{ if(LMS.api) lmsCommit(); }catch(e){} });
}
boot();

if(typeof module !== 'undefined'){ module.exports = {CONFIG:CONFIG}; }
})();
</script>
