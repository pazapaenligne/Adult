<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communication Mission - Understanding school messages</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF6D6;
  --white:#fff;
  --focus:#2E2E2D;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Open Sans",Arial,sans-serif;color:var(--pazapa-grey-dark);background:#fff;line-height:1.5;font-size:1rem}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;margin:0 0 8px;line-height:1.25}
h2{font-size:1.45rem}
h2:focus{outline:none}
h3{font-size:1.05rem}
p{margin:0 0 10px}
.app{max-width:780px;margin:0 auto;padding:12px 16px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--pazapa-blue);padding:8px 0 10px;margin-bottom:12px}
.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;font-size:1rem}
.brand small{display:block;font-family:"Open Sans",Arial,sans-serif;font-weight:400;font-size:.85rem}
.tools{display:flex;align-items:center;gap:10px}
.stepnote{background:var(--pazapa-grey-light);border-radius:999px;padding:6px 14px;font-size:.9rem;white-space:nowrap}
button{font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);touch-action:manipulation;min-height:48px;cursor:pointer}
button[disabled]{cursor:not-allowed}
.lang{background:#fff;border:2px solid var(--pazapa-blue);border-radius:999px;padding:6px 16px;font-weight:700;min-width:48px}
.btn{background:var(--pazapa-blue);border:2px solid var(--pazapa-blue);border-radius:999px;padding:10px 26px;font-weight:700;min-width:48px}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6b68}
.btn.green{background:var(--pazapa-green);border-color:var(--pazapa-green)}
.btn.ghost{background:#fff;border:2px solid var(--pazapa-blue)}
.btn.help{background:var(--pazapa-yellow);border-color:var(--pazapa-yellow)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
section.screen{display:block}
section.screen[hidden]{display:none}
.card{background:var(--blue-tint);border-radius:16px;padding:18px;margin-bottom:16px}
.card.green{background:var(--green-tint)}
.card.yellow{background:var(--yellow-tint)}
.lead{font-size:1.1rem}
.illus{display:block;width:100%;max-width:230px;height:auto;max-height:300px;object-fit:contain;margin:0 auto 12px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:#fff;border:2px solid var(--pazapa-blue);border-radius:14px;padding:12px 14px}
.mcard .k{font-weight:700;color:var(--pazapa-blue-dark);font-size:.9rem}
.goal{background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:14px;padding:14px 16px;margin-top:14px}
/* notice (information card) */
.notice{background:#fff;border:2px dashed var(--pazapa-grey-dark);border-radius:12px;padding:14px 16px;position:relative}
.notice .tag{display:inline-block;background:var(--pazapa-yellow);font-weight:700;padding:2px 10px;border-radius:6px;font-size:.85rem;margin-bottom:8px}
.notice dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.notice dt{font-weight:700}
.notice dd{margin:0}
.fr-gloss{display:block;font-style:italic;font-size:.88rem;color:#4a4a47}
.chat{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:16px 16px 16px 4px;padding:12px 14px;margin:12px 0}
.chat .who{font-weight:700;font-size:.9rem;color:var(--pazapa-blue-dark)}
.cards{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}}
.pcard{background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
.pcard[aria-pressed="true"]{background:var(--blue-tint);border-width:4px;padding:10px 12px}
.pcard .mark{font-weight:700;font-size:.85rem;display:block;min-height:1.2em}
.pcard.flag{background:var(--yellow-tint);border-color:var(--pazapa-yellow)}
.pcard.good{background:var(--green-tint);border-color:var(--pazapa-green)}
.status{min-height:28px;font-weight:700;margin-top:6px}
.status.ok::before{content:"\2713  "}
.status.retry::before{content:"!  "}
.status.retry{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);padding:6px 10px;border-radius:6px}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:#fff;border:2px solid var(--pazapa-blue);border-radius:999px;padding:8px 16px;min-height:48px}
.chip.det{border-style:dashed}
.field{margin:12px 0}
label,legend{font-weight:700}
textarea{width:100%;font-family:inherit;font-size:1rem;padding:10px 12px;border:2px solid var(--pazapa-blue);border-radius:10px;color:var(--pazapa-grey-dark);resize:vertical;min-height:84px}
textarea.small{min-height:60px}
.count{font-size:.9rem;margin-top:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.seg button{background:#fff;border:2px solid var(--pazapa-blue);border-radius:999px;padding:8px 18px}
.seg button[aria-pressed="true"]{background:var(--pazapa-blue);font-weight:700}
fieldset{border:2px solid var(--pazapa-grey-light);border-radius:12px;margin:0 0 12px;padding:10px 14px}
fieldset.sec{border-color:var(--pazapa-blue)}
.chk label{display:flex;gap:12px;align-items:flex-start;font-weight:400;min-height:48px;padding:4px 0}
.chk input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:#1B7E92}
.chk .ex{display:block;font-size:.9rem;font-style:italic}
.panel{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:8px;padding:12px 14px;margin:12px 0}
.panel.ok{background:var(--green-tint);border-left-color:var(--pazapa-green)}
.panel ul{margin:6px 0 0;padding-left:20px}
.parts{list-style:none;padding:0;margin:6px 0}
.parts li{padding:3px 0}
.rec{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.rec button{background:#fff;border:2px solid var(--pazapa-blue);border-radius:999px;padding:8px 18px;font-weight:700}
.rec button.go{background:var(--pazapa-blue)}
.rec button[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6b68}
.script{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:10px;padding:10px 12px;white-space:pre-wrap;min-height:60px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:480px){.grid4{grid-template-columns:1fr}.btn{width:100%}.actions{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Pazapa English Programme for Adults<small data-i="brandSub"></small></div>
    <div class="tools">
      <span class="stepnote" id="stepNote"></span>
      <button type="button" class="lang" id="langBtn" aria-live="polite"></button>
    </div>
  </div>
  <div class="sr" id="announcer" role="status" aria-live="polite"></div>

  <!-- SCREEN 1 -->
  <section class="screen" id="s1" aria-labelledby="h1_">
    <h2 id="h1_" tabindex="-1" data-i="s1Title"></h2>
    <div class="card">
      <img class="illus" data-img="notice" alt="" role="presentation">
      <p class="lead" data-i="s1Lead"></p>
      <div class="grid4">
        <div class="mcard"><span class="k" data-i="who"></span><br><span data-i="whoV"></span></div>
        <div class="mcard"><span class="k" data-i="where"></span><br><span data-i="whereV"></span></div>
        <div class="mcard"><span class="k" data-i="purpose"></span><br><span data-i="purposeV"></span></div>
        <div class="mcard"><span class="k" data-i="need"></span><br><span data-i="needV"></span></div>
      </div>
      <div class="goal"><strong data-i="goalK"></strong> <span data-i="goalV"></span></div>
      <p style="margin-top:12px" data-i="invented"></p>
    </div>
    <div class="actions"><button type="button" class="btn" id="go1" data-i="continue"></button></div>
  </section>

  <!-- SCREEN 2 -->
  <section class="screen" id="s2" aria-labelledby="h2_" hidden>
    <h2 id="h2_" tabindex="-1" data-i="s2Title"></h2>
    <p class="lead" data-i="s2Lead"></p>
    <div class="cards" id="phraseCards" role="group" aria-labelledby="h2_"></div>
    <div class="status" id="s2Status" role="status" aria-live="polite"></div>
    <div class="card green" id="trayBox" hidden>
      <h3 data-i="trayTitle"></h3>
      <div class="tray" id="trayList"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="check2" data-i="check"></button>
      <button type="button" class="btn green" id="go2" data-i="continue" hidden></button>
    </div>
  </section>

  <!-- SCREEN 3 -->
  <section class="screen" id="s3" aria-labelledby="h3_" hidden>
    <h2 id="h3_" tabindex="-1" data-i="s3Title"></h2>
    <p data-i="s3Lead"></p>
    <div class="notice" id="notice3"></div>
    <div class="chat"><span class="who">Amina</span><br><span data-i="friendMsg"></span><span class="fr-gloss" id="friendGloss3"></span></div>
    <fieldset class="sec">
      <legend data-i="addTo"></legend>
      <div class="seg" id="secSeg" role="group"></div>
      <p data-i="tapTray"></p>
      <div class="tray" id="planTray" aria-label=""></div>
      <p><strong data-i="detailChips"></strong></p>
      <div class="tray" id="planChips"></div>
    </fieldset>
    <div class="field"><label for="p0" data-i="plan0"></label><textarea id="p0" class="small" maxlength="120"></textarea></div>
    <div class="field"><label for="p1" data-i="plan1"></label><textarea id="p1" class="small" maxlength="120"></textarea></div>
    <div class="field"><label for="p2" data-i="plan2"></label><textarea id="p2" class="small" maxlength="120"></textarea></div>
    <button type="button" class="btn help" id="exBtn" aria-expanded="false" aria-controls="exBox" data-i="showEx"></button>
    <div class="panel" id="exBox" hidden>
      <strong data-i="exTitle"></strong>
      <p style="margin-top:6px"><span data-i="exOpen"></span><br><span data-i="exKey"></span><br><span data-i="exClose"></span></p>
    </div>
    <div class="actions"><button type="button" class="btn" id="go3" data-i="continue"></button></div>
  </section>

  <!-- SCREEN 4 -->
  <section class="screen" id="s4" aria-labelledby="h4_" hidden>
    <h2 id="h4_" tabindex="-1" data-i="s4Title"></h2>
    <img class="illus" data-img="dialog" alt="" role="presentation">
    <div class="notice" id="notice4"></div>
    <div class="chat"><span class="who">Amina</span><br><span data-i="friendMsg"></span><span class="fr-gloss" id="friendGloss4"></span></div>
    <p class="lead" data-i="s4Lead"></p>
    <div class="seg" role="group" id="modeSeg" aria-label=""></div>

    <div id="typePane">
      <p><strong data-i="starters"></strong></p>
      <div class="tray" id="starters"></div>
      <p><strong data-i="detailChips"></strong></p>
      <div class="tray" id="chips4"></div>
      <div class="field">
        <label for="resp" data-i="yourReply"></label>
        <textarea id="resp" maxlength="250" aria-describedby="count4"></textarea>
        <div class="count" id="count4"></div>
      </div>
      <div class="panel" id="bankBox" hidden>
        <strong data-i="bankTitle"></strong>
        <div class="tray" id="bankList"></div>
        <button type="button" class="btn help" id="modelBtn" data-i="showModel" hidden></button>
        <p id="modelText" style="margin-top:10px" hidden></p>
      </div>
    </div>

    <div id="speakPane" hidden>
      <p data-i="speakLead"></p>
      <div class="script" id="script4" aria-live="off"></div>
      <div class="rec" role="group" id="recGroup" aria-label="">
        <button type="button" class="go" id="recBtn"></button>
        <button type="button" id="stopBtn" disabled></button>
        <button type="button" id="hearBtn" disabled></button>
        <button type="button" id="againBtn" disabled></button>
      </div>
      <div class="status" id="recStatus" role="status" aria-live="polite"></div>
      <audio id="player" playsinline></audio>
      <div class="rec"><button type="button" id="aloudBtn" aria-pressed="false"></button></div>
      <div class="status" id="aloudStatus" role="status" aria-live="polite"></div>
    </div>

    <div class="actions"><button type="button" class="btn" id="go4" disabled data-i="review"></button></div>
    <div class="status" id="s4Hint"></div>
  </section>

  <!-- SCREEN 5 -->
  <section class="screen" id="s5" aria-labelledby="h5_" hidden>
    <h2 id="h5_" tabindex="-1" data-i="s5Title"></h2>
    <img class="illus" data-img="form" alt="" role="presentation">
    <div class="panel ok" id="fbPanel" role="status" aria-live="polite"></div>
    <div class="card" id="partsBox" hidden>
      <h3 data-i="partsTitle"></h3>
      <ul class="parts" id="partsList"></ul>
    </div>
    <div class="field" id="editBox">
      <label for="resp5" data-i="improveLabel"></label>
      <textarea id="resp5" maxlength="250" aria-describedby="count5"></textarea>
      <div class="count" id="count5"></div>
      <div class="actions" style="margin-top:10px">
        <button type="button" class="btn ghost" id="again5" data-i="checkAgain"></button>
      </div>
    </div>
    <div class="actions" id="backRecBox" hidden><button type="button" class="btn ghost" id="backRec" data-i="backToRec"></button></div>
    <div class="panel" id="bank5" hidden>
      <strong data-i="bankTitle"></strong>
      <div class="tray" id="bankList5"></div>
    </div>
    <fieldset class="chk" id="selfCheck">
      <legend data-i="selfTitle"></legend>
      <p data-i="selfNote"></p>
      <div id="selfItems"></div>
    </fieldset>
    <div class="status" id="s5Hint" role="status" aria-live="polite"></div>
    <div class="actions"><button type="button" class="btn" id="finishBtn" disabled data-i="finish"></button></div>
  </section>

  <!-- SCREEN 6 -->
  <section class="screen" id="s6" aria-labelledby="h6_" hidden>
    <h2 id="h6_" tabindex="-1" data-i="s6Title"></h2>
    <div class="card green">
      <img class="illus" data-img="deadline" alt="" role="presentation">
      <p class="lead" data-i="s6Line"></p>
      <p data-i="s6Next"></p>
    </div>
    <div class="status ok" id="doneStatus" role="status" aria-live="polite" hidden></div>
    <div class="actions">
      <button type="button" class="btn green" id="doneBtn" data-i="done"></button>
      <button type="button" class="btn ghost" id="tryAgainBtn" data-i="tryAgain"></button>
    </div>
  </section>
</div>

/* ================= LMS / PERSISTENCE ================= */
var LMS = {api:null, ver:null};
function findApi(win, name){
  var n=0;
  while(win && n<10){
    try{ if(win[name]) return win[name]; }catch(e){}
    var p=null; try{ p = (win.parent && win.parent!==win)? win.parent : null; }catch(e2){ p=null; }
    win=p; n++;
  }
  return null;
}
function detectLms(){
  if(LMS.api) return LMS;
  var wins=[window]; try{ if(window.opener) wins.push(window.opener); }catch(e){}
  for(var i=0;i<wins.length;i++){
    var a2=findApi(wins[i],"API_1484_11"); if(a2){LMS.api=a2;LMS.ver="2004";return LMS;}
    var a1=findApi(wins[i],"API"); if(a1){LMS.api=a1;LMS.ver="1.2";return LMS;}
  }
  return LMS;
}
function lmsGet(el){ try{ return LMS.ver==="2004"? LMS.api.GetValue(el) : LMS.api.LMSGetValue(el); }catch(e){ return ""; } }
function lmsSet(el,v){ try{ var r = LMS.ver==="2004"? LMS.api.SetValue(el,v) : LMS.api.LMSSetValue(el,v); return String(r)!=="false"; }catch(e){ return false; } }
function lmsCommit(){ try{ var r = LMS.ver==="2004"? LMS.api.Commit("") : LMS.api.LMSCommit(""); return String(r)!=="false"; }catch(e){ return false; } }
function lmsStatus(){
  if(!LMS.api) return "";
  if(LMS.ver==="2004"){ var c=lmsGet("cmi.completion_status"), s=lmsGet("cmi.success_status"); return (s==="passed")?"passed":c; }
  return lmsGet("cmi.core.lesson_status");
}
var saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,350); }
function compact(){
  return JSON.stringify({v:1,scr:state.scr,lang:state.lang,mode:state.mode,sel:state.sel,tray:state.tray,p2:state.p2,p2d:state.p2done?1:0,plan:state.plan,resp:state.resp,chk:state.chk.map(function(b){return b?1:0}),att:state.att,bank:state.bank?1:0,model:state.model?1:0,val:state.val?1:0,spk:state.spk?1:0});
}
function saveNow(){
  var data=compact();
  detectLms();
  var stored=false;
  if(LMS.api && data.length<3800){
    try{
      var el = LMS.ver==="2004"? "cmi.suspend_data":"cmi.suspend_data";
      stored = lmsSet(el,data) && lmsCommit();
    }catch(e){stored=false;}
  }
  try{ localStorage.setItem(KEY,data); }catch(e2){}
}
function loadSaved(){
  var raw=null; detectLms();
  if(LMS.api){ var r=lmsGet("cmi.suspend_data"); if(r && r.charAt(0)==="{") raw=r; }
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(!raw || raw.length>6000) return;
  var o; try{ o=JSON.parse(raw); }catch(e2){ return; }
  if(!o || o.v!==1) return;
  var s=fresh();
  s.lang = o.lang==="fr"?"fr":"en";
  s.mode = o.mode==="speak"?"speak":"type";
  var ids=PHRASES.map(function(p){return p.id});
  s.sel = (o.sel||[]).filter(function(x){return ids.indexOf(x)>-1});
  s.tray = (o.tray||[]).filter(function(x){var p=phrase(x);return p&&p.ok});
  s.p2 = Math.min(3, +o.p2||0); s.p2done = !!o.p2d && s.tray.length>=3;
  s.plan = [0,1,2].map(function(i){return String((o.plan||[])[i]||"").slice(0,120)});
  s.resp = String(o.resp||"").slice(0,250);
  s.chk = [0,1,2,3].map(function(i){return !!(o.chk||[])[i]});
  s.att = Math.min(9,+o.att||0); s.bank=!!o.bank; s.model=!!o.model; s.spk=!!o.spk;
  var scr = Math.max(1,Math.min(6,+o.scr||1));
  // revalidate against current requirements (do not trust stale booleans)
  if(scr>=3 && !s.p2done) scr=2;
  var prod = s.resp.trim().length>=8 || s.spk;
  if(scr>=5 && !prod) scr=4;
  s.val = !!o.val && prod;
  if(scr===6 && !(s.val && s.chk.every(Boolean))) scr = 5;
  s.scr = scr;
  state = s;
}
function activityCompleted(){
  if(completionSent) return true;
  detectLms();
  var ok=false;
  if(LMS.api){
    var cur=lmsStatus();
    if(cur==="completed"||cur==="passed"){ ok=true; }
    else{
      for(var i=0;i<2 && !ok;i++){
        if(LMS.ver==="2004") lmsSet("cmi.completion_status","completed"); else lmsSet("cmi.core.lesson_status","completed");
        lmsCommit();
        var chk=lmsStatus(); ok = (chk==="completed"||chk==="passed"||chk==="");
      }
    }
  }
  try{ localStorage.setItem(KEY_DONE,"1"); }catch(e){}
  completionSent = true;
  console.log("W12D1 Communication Mission completed");
  return true;
}

function renderPhrases(){
  var box=$("phraseCards"); box.innerHTML="";
  var checked = state.p2>0;
  order.forEach(function(id){
    var p=phrase(id);
    var b=document.createElement("button"); b.type="button"; b.className="pcard";
    b.setAttribute("aria-pressed", state.sel.indexOf(id)>-1?"true":"false");
    var mark=document.createElement("span"); mark.className="mark";
    var picked = state.sel.indexOf(id)>-1;
    if(checked && lastChecked){
      if(!p.ok && lastChecked.flag.indexOf(id)>-1){ b.classList.add("flag"); mark.textContent="! "+t("notNeeded"); }
      else if(p.ok && picked){ b.classList.add("good"); mark.textContent="✓ "+t("useful"); }
    }
    b.appendChild(mark);
    var s=document.createElement("span"); s.textContent=p.en; b.appendChild(s);
    if(state.lang==="fr"){ var g=document.createElement("span"); g.className="fr-gloss"; g.textContent=p.fr; b.appendChild(g); }
    b.addEventListener("click",function(){
      var i=state.sel.indexOf(id); if(i>-1) state.sel.splice(i,1); else state.sel.push(id);
      lastChecked=null; state.p2done=false; $("go2").hidden=true; setStatus("s2Status",null);
      renderPhrases(); save();
    });
    box.appendChild(b);
  });
}
var lastChecked=null;
function setStatus(id,key,cls){
  var el=$(id); if(!el) return; runtime.msgs[id]=key?{k:key,c:cls}:null;
  el.className="status"+(cls?" "+cls:""); el.textContent=key?t(key):"";

  var box=$("trayBox"); box.hidden = !(state.p2done);

function check2(){
  state.p2++;
  var usefulPicked = state.sel.filter(function(id){return phrase(id).ok});
  var flag = state.sel.filter(function(id){return !phrase(id).ok});
  lastChecked={flag:flag};
  var enough = usefulPicked.length>=3, clean = flag.length===0;
  if(enough && clean){
    state.tray = usefulPicked.slice(); state.p2done=true; setStatus("s2Status","s2Ok","ok");
  } else if(state.p2>=2){
    state.tray = PHRASES.filter(function(p){return p.ok}).map(function(p){return p.id}); state.p2done=true; setStatus("s2Status","s2Auto","ok");
  } else {
    state.p2done=false; setStatus("s2Status", !clean?"s2Flag":"s2Fewer","retry");
  }
  $("go2").hidden=!state.p2done; renderPhrases(); renderTray(); save();
  if(state.p2done) $("go2").focus();
}

/* --- screen 4 --- */
function insertResp(txt){
  var ta=$("resp"); var v=ta.value; var nv=(v&&!/\s$/.test(v)?v+" ":v)+txt;
  if(nv.length>250) nv=nv.slice(0,250);
  ta.value=nv; onResp(nv); ta.focus();
}
function renderS4Chips(){
  var s=$("starters"); s.innerHTML="";
  STARTERS.forEach(function(x){ s.appendChild(makeBtn(x,"chip",function(){insertResp(x);})); });
  var c=$("chips4"); c.innerHTML="";
  CHIPS4.forEach(function(x){ c.appendChild(makeBtn(x,"chip det",function(){insertResp(x);})); });
  var b=$("bankList"); b.innerHTML="";
  PHRASES.filter(function(p){return p.ok}).forEach(function(p){ b.appendChild(makeBtn(p.en,"chip",function(){insertResp(p.en);},state.lang==="fr"?p.fr:"")); });
  var b5=$("bankList5"); b5.innerHTML="";
  PHRASES.filter(function(p){return p.ok}).forEach(function(p){ b5.appendChild(makeBtn(p.en,"chip",function(){insertResp5(p.en);},state.lang==="fr"?p.fr:"")); });
}
function insertResp5(txt){ var ta=$("resp5"); var v=ta.value; var nv=(v&&!/\s$/.test(v)?v+" ":v)+txt; if(nv.length>250) nv=nv.slice(0,250); ta.value=nv; onResp(nv); ta.focus(); }
function renderMode(){
  var seg=$("modeSeg"); seg.innerHTML="";
  [["type","modeType"],["speak","modeSpeak"]].forEach(function(m){
    var b=makeBtn(t(m[1]),"",function(){ setMode(m[0]); });
    b.setAttribute("aria-pressed",state.mode===m[0]?"true":"false"); seg.appendChild(b);
  });
  $("typePane").hidden = state.mode!=="type";
  $("speakPane").hidden = state.mode!=="speak";
  $("script4").textContent = state.resp.trim()? state.resp : t("scriptEmpty");
}
function setMode(m){
  if(runtime.recording) stopRecording();
  stopPlayback();
  state.mode=m; renderMode(); save();
  announce(m==="type"?t("modeType"):t("modeSpeak"));
}
function counter(el,n){ el.textContent = n>=230? t("countNear",{n:n}) : t("count",{n:n}); }
function productionDone(){ return state.resp.trim().length>=8 || runtime.rec || state.spk; }
function updateGo4(){
  var ok=productionDone(); $("go4").disabled=!ok;
  $("s4Hint").className="status"; $("s4Hint").textContent = ok? "" : t("needAnswer");
}
function invalidate(){
  if(state.val){ state.val=false; if(state.scr===5){ $("s5Hint").className="status retry"; $("s5Hint").textContent=t("changed"); } }
  updateFinish();
}
function onResp(v){
  state.resp=v.slice(0,250);
  $("resp").value=state.resp; $("resp5").value=state.resp;
  counter($("count4"),state.resp.length); counter($("count5"),state.resp.length);
  $("script4").textContent = state.resp.trim()? state.resp : t("scriptEmpty");
  invalidate(); updateGo4(); save();
}

/* --- recording --- */
var mr=null, stream=null, chunks=[], blobUrl=null, recStart=false;
function setRecUi(){
  $("recBtn").disabled = runtime.recording || recStart;
  $("stopBtn").disabled = !runtime.recording;
  $("hearBtn").disabled = !runtime.rec || runtime.recording;
  $("againBtn").disabled = !(runtime.rec) || runtime.recording;
  $("hearBtn").textContent = runtime.playing? t("hearStop") : t("hear");
  $("aloudBtn").setAttribute("aria-pressed",state.spk?"true":"false");
  $("aloudStatus").textContent = state.spk? t("aloudDone"):"";
  $("backRecBox").hidden = !(runtime.rec && !state.resp.trim());
  if(runtime.msgs.recStatus) setStatus("recStatus",runtime.msgs.recStatus.k,runtime.msgs.recStatus.c);
}
function mimeType(){
  if(!window.MediaRecorder||typeof MediaRecorder.isTypeSupported!=="function") return "";
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return "";
}
function releaseStream(){ if(stream){ try{ stream.getTracks().forEach(function(tr){tr.stop();}); }catch(e){} stream=null; } }
function clearRecording(){
  stopPlayback(); var p=$("player"); try{ p.removeAttribute("src"); p.load(); }catch(e){}
  if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl=null; }
  runtime.rec=false; chunks=[];
}
function recError(key){ recStart=false; runtime.recording=false; releaseStream(); setStatus("recStatus",key,"retry"); setRecUi(); updateGo4(); }
function startRecording(){
  if(runtime.recording||recStart) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ setStatus("recStatus","errUnsup","retry"); return; }
  stopPlayback(); clearRecording(); recStart=true; setStatus("recStatus","recAsk"); setRecUi();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    stream=s; chunks=[]; var mt=mimeType();
    try{ mr = mt? new MediaRecorder(s,{mimeType:mt}) : new MediaRecorder(s); }catch(e){ recError("errUnsup"); return; }
    mr.ondataavailable=function(e){ if(e.data && e.data.size>0) chunks.push(e.data); };
    mr.onerror=function(){ recError("errFail"); };
    mr.onstop=function(){
      releaseStream(); runtime.recording=false; recStart=false;
      var blob=new Blob(chunks,{type:(mr&&mr.mimeType)||mt||"audio/mp4"});
      if(!blob.size){ runtime.rec=false; setStatus("recStatus","errEmpty","retry"); setRecUi(); updateGo4(); return; }
      if(blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl=URL.createObjectURL(blob); $("player").src=blobUrl; runtime.rec=true;
      setStatus("recStatus","recReady","ok"); setRecUi(); updateGo4(); invalidate(); announce(t("recReady"));
    };
    try{ mr.start(); }catch(e2){ recError("errFail"); return; }
    runtime.recording=true; recStart=false; setStatus("recStatus","recOn"); setRecUi(); announce(t("recOn"));
  }).catch(function(err){
    var n=err&&err.name;
    if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError") recError("errDenied");
    else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") recError("errNone");
    else recError("errFail");
  });
}
function stopRecording(){
  if(!runtime.recording||!mr) return;
  try{ if(mr.state!=="inactive") mr.stop(); }catch(e){ recError("errFail"); return; }
  releaseStream(); runtime.recording=false; setRecUi();
}
function stopPlayback(){ var p=$("player"); try{p.pause();}catch(e){} runtime.playing=false; if($("hearBtn")) $("hearBtn").textContent=t("hear"); }
function hear(){
  if(runtime.recording||!runtime.rec) return;
  var p=$("player");
  if(runtime.playing){ stopPlayback(); setStatus("recStatus","recReady","ok"); return; }
  p.currentTime=0; var pr=p.play(); runtime.playing=true; setStatus("recStatus","recPlay"); setRecUi();
  if(pr&&pr.catch) pr.catch(function(){ runtime.playing=false; setStatus("recStatus","errFail","retry"); setRecUi(); });
}

/* --- check (screen 5) --- */
function norm(s){ return String(s||"").normalize("NFKC").replace(/[‘’ʼ]/g,"'").toLowerCase().replace(/\s+/g," ").trim(); }
function analyse(text){
  var n=norm(text);
  var words=n.replace(/[^a-z0-9?' ]/g," ");
  return {
    trip:/\bmonday\b/.test(words),
    lunch:/\blunch\b/.test(words),
    form:/\bthursday\b/.test(words),
    q: n.indexOf("?")>-1 || /\b(where|what time|when|which)\b.*\b(should|do|does|is|can|are)\b/.test(words),
    wrongDay:/\b(tuesday|friday|wednesday)\b/.test(words),
    thanks:/\b(thank you|thanks)\b/.test(words)
  };
}
function renderSelf(){
  var box=$("selfItems"); box.innerHTML="";
  t("self").forEach(function(row,i){
    var lab=document.createElement("label");
    var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!state.chk[i]; cb.id="sc"+i;
    cb.addEventListener("change",function(){state.chk[i]=cb.checked;updateFinish();save();});
    var sp=document.createElement("span"); var st=document.createElement("strong"); st.textContent=row[0]; sp.appendChild(st);
    sp.appendChild(document.createElement("br")); sp.appendChild(document.createTextNode(row[1]));
    var ex=document.createElement("span"); ex.className="ex"; ex.textContent=row[2]; sp.appendChild(ex);
    lab.appendChild(cb); lab.appendChild(sp); box.appendChild(lab);
  });
}
function evaluate(){
  var text=state.resp.trim(); var panel=$("fbPanel");
  var hasText = text.length>=8;
  $("partsBox").hidden=!hasText; $("editBox").hidden=false;
  var incomplete=false;
  if(hasText){
    var r=analyse(text); runtime.last=r;
    var keys=["trip","lunch","form","q"]; var names={trip:"pTrip",lunch:"pLunch",form:"pForm",q:"pQ"};
    var list=$("partsList"); list.innerHTML="";
    keys.forEach(function(k){ var li=document.createElement("li"); li.textContent=(r[k]? "✓ "+t("found") : "+ "+t("add"))+": "+t(names[k]); list.appendChild(li); });
    var missing=keys.filter(function(k){return !r[k]}); incomplete=missing.length>0;
    var win=keys.filter(function(k){return r[k]})[0];
    var html='<strong>'+esc(incomplete?t("fbStart"):t("fbGood"))+'</strong>';
    html+='<ul>';
    if(win) html+='<li>'+esc(t("fbWin_"+win))+'</li>';
    html+='<li>'+esc(incomplete? t("fbNext_"+missing[0]) : t("fbNextDone"))+'</li>';
    if(r.wrongDay) html+='<li>'+esc(t("fbDay"))+'</li>';
    else if(!incomplete && !r.thanks) html+='<li>'+esc(t("fbThanks"))+'</li>';
    html+='</ul>';
    panel.innerHTML=html; panel.className="panel"+(incomplete?"":" ok");
  } else {
    panel.innerHTML='<strong>'+esc(t("fbNoText"))+'</strong>'; panel.className="panel ok"; $("partsList").innerHTML="";
  }
  if(incomplete){ state.att++; }
  state.bank = state.att>=2 && incomplete ? true : state.bank;
  state.model = state.att>=3 && incomplete ? true : state.model;
  $("bank5").hidden = !(hasText && state.bank);
  $("bankBox").hidden = !state.bank; $("modelBtn").hidden = !state.model;
  $("backRecBox").hidden = !(runtime.rec && !hasText);
  $("editBox").hidden = false;
  state.val = true; $("s5Hint").textContent=""; $("s5Hint").className="status";
  updateFinish(); save();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function updateFinish(){
  var ok = state.val && state.chk.every(Boolean) && productionDone();
  $("finishBtn").disabled=!ok;
  if(state.scr===5 && state.val && !state.chk.every(Boolean)){ $("s5Hint").className="status"; $("s5Hint").textContent=t("s5Need"); }
  else if(state.scr===5 && state.val){ $("s5Hint").className="status"; $("s5Hint").textContent=""; }
}

/* ================= NAVIGATION ================= */
function show(n){
  for(var i=1;i<=6;i++){ $("s"+i).hidden = (i!==n); }
  state.scr=n; $("stepNote").textContent=t("stepNote",{n:n});
  if(n!==4){ if(runtime.recording) stopRecording(); stopPlayback(); }
  if(n===2){ renderPhrases(); renderTray(); $("go2").hidden=!state.p2done; }
  if(n===3){ renderSeg(); renderPlanTray(); [0,1,2].forEach(function(i){ $("p"+i).value=state.plan[i]; }); }
  if(n===4){
    renderS4Chips(); renderMode();
    if(!state.resp.trim()){ var pre=state.plan.map(function(x){return x.trim()}).filter(Boolean).join(" "); if(pre) onResp(pre); }
    $("resp").value=state.resp; counter($("count4"),state.resp.length);
    $("bankBox").hidden=!state.bank; $("modelBtn").hidden=!state.model;
    setStatus("recStatus",runtime.rec?"recReady":"recIdle"); setRecUi(); updateGo4();
  }
  if(n===5){
    renderSelf(); renderS4Chips(); $("resp5").value=state.resp; counter($("count5"),state.resp.length);
    evaluate();
  }
  if(n===6){
    $("doneBtn").disabled=false; $("doneStatus").hidden=true; $("doneStatus").textContent="";
  } else { $("doneBtn").disabled=true; }
  var h=$("s"+n).querySelector("h2"); if(h) h.focus();
  window.scrollTo(0,0); save();
}
function resetAll(){
  if(runtime.recording) stopRecording(); clearRecording(); releaseStream();
  var lang=state.lang; state=fresh(); state.lang=lang;
  order=shuffle(PHRASES.map(function(p){return p.id})); lastChecked=null; runtime.exOpen=false; runtime.msgs={};
  ["p0","p1","p2","resp","resp5"].forEach(function(id){$(id).value="";});
  $("exBox").hidden=true; $("modelText").hidden=true;
  setStatus("s2Status",null); try{ localStorage.removeItem(KEY); }catch(e){}
  applyStatic(); show(1);
}

/* ================= EVENTS ================= */
$("go1").addEventListener("click",function(){show(2);});
$("check2").addEventListener("click",check2);
$("go2").addEventListener("click",function(){ if(state.p2done) show(3); });
$("go3").addEventListener("click",function(){show(4);});
$("go4").addEventListener("click",function(){ if(productionDone()) show(5); });
$("again5").addEventListener("click",function(){ evaluate(); });
$("backRec").addEventListener("click",function(){ show(4); });
$("finishBtn").addEventListener("click",function(){ if(state.val && state.chk.every(Boolean)) show(6); });
$("doneBtn").addEventListener("click",function(){
  if($("doneBtn").disabled || state.scr!==6) return;
  activityCompleted();
  var d=$("doneStatus"); d.hidden=false; d.textContent=t("doneMsg");
});
$("tryAgainBtn").addEventListener("click",resetAll);
$("langBtn").addEventListener("click",function(){
  state.lang = state.lang==="en"?"fr":"en"; applyStatic(); refreshStatuses();
  renderPhrases(); renderTray(); renderSeg(); renderPlanTray(); renderS4Chips(); renderMode(); renderSelf();
  counter($("count4"),state.resp.length); counter($("count5"),state.resp.length);
  if(state.scr===4){ setRecUi(); updateGo4(); } if(state.scr===5){ evaluateKeep(); }
  $("modelText").textContent=t("modelText"); $("modelBtn").textContent=t("showModel");
  announce(state.lang==="fr"?"Français":"English"); save();
});
function evaluateKeep(){ var a=state.att,v=state.val; evaluate(); state.att=a; state.val=v; updateFinish(); }
[0,1,2].forEach(function(i){ $("p"+i).addEventListener("input",function(){ state.plan[i]=this.value; invalidate(); save(); }); });
$("resp").addEventListener("input",function(){ onResp(this.value); });
$("resp5").addEventListener("input",function(){ onResp(this.value); });
$("exBtn").addEventListener("click",function(){
  runtime.exOpen=!runtime.exOpen; $("exBox").hidden=!runtime.exOpen;
  this.setAttribute("aria-expanded",runtime.exOpen?"true":"false"); this.textContent=runtime.exOpen?t("hideEx"):t("showEx");
});
$("modelBtn").addEventListener("click",function(){ var m=$("modelText"); m.textContent=t("modelText"); m.hidden=!m.hidden; });
$("recBtn").addEventListener("click",startRecording);
$("stopBtn").addEventListener("click",stopRecording);
$("hearBtn").addEventListener("click",hear);
$("againBtn").addEventListener("click",function(){ if(runtime.recording) return; clearRecording(); setStatus("recStatus","recIdle"); setRecUi(); updateGo4(); invalidate(); startRecording(); });
$("aloudBtn").addEventListener("click",function(){ state.spk=!state.spk; setRecUi(); updateGo4(); invalidate(); save(); });
$("player").addEventListener("ended",function(){ runtime.playing=false; setStatus("recStatus","recPlayEnd"); setRecUi(); });
window.addEventListener("beforeunload",function(){ releaseStream(); if(blobUrl) URL.revokeObjectURL(blobUrl); saveNow(); });
window.addEventListener("pagehide",function(){ releaseStream(); if(blobUrl) URL.revokeObjectURL(blobUrl); });

/* ================= INIT ================= */
var doneBtn = $("doneBtn");
doneBtn.disabled = true;
loadSaved();
runtime.msgs.recStatus={k:"recIdle"};
applyStatic();
$("resp").value=state.resp; $("resp5").value=state.resp;
$("modelText").textContent=t("modelText"); $("modelBtn").textContent=t("showModel");
show(state.scr);
if(state.scr===1) {}
})();
</script>
