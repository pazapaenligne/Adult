<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs and abilities – Listening Mission</title>
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;
    --blue-tint:#EAF8FB;
    --green-tint:#F4F7D9;
    --yellow-tint:#FFF3C2;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Open Sans",Arial,sans-serif;
    background:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;touch-action:manipulation;}
  h1,h2,h3{
    font-family:"Filson Soft","Open Sans",Arial,sans-serif;
    font-weight:800;
    margin:0 0 12px 0;
    line-height:1.25;
    color:var(--pazapa-grey-dark);
  }
  h1{font-size:1.9rem;}
  h2{font-size:1.5rem;}
  h3{font-size:1.1rem;}
  h1:focus,h2:focus{outline:none;}
  .app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
  header.topbar{
    background:var(--pazapa-blue);
    padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .logo-wrap{background:var(--white);border-radius:8px;padding:4px 12px;display:flex;align-items:center;}
  .logo-wrap img{height:30px;width:auto;display:block;}
  .lesson-tag{font-size:.9rem;font-weight:700;color:var(--pazapa-grey-dark);}
  .progress-region{
    padding:12px 20px 10px;border-bottom:1px solid var(--pazapa-grey-light);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .progress-main{flex:1 1 220px;min-width:180px;}
  .progress-label{font-size:.9rem;font-weight:700;margin-bottom:6px;}
  .progress-track{height:10px;background:var(--pazapa-grey-light);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;width:0;background:var(--pazapa-green);border-radius:6px;transition:width .3s ease;}
  .lang-btn{
    min-height:48px;min-width:48px;padding:8px 18px;border-radius:10px;
    border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);
    font-weight:700;font-size:1rem;cursor:pointer;
  }
  .lang-btn[aria-pressed="true"]{background:var(--pazapa-blue);}
  main{flex:1;padding:22px 20px 30px;}
  .screen[hidden]{display:none;}
  .eyebrow{font-weight:700;font-size:.9rem;margin:0 0 4px;}
  .instructions{
    background:var(--blue-tint);border:1px solid #BFE9F2;border-radius:12px;
    padding:14px 16px;margin:0 0 16px;font-size:1.05rem;font-weight:600;
  }
  .fr{display:none;}
  body.fr-on .fr{display:block;font-weight:400;font-style:italic;font-size:.92em;margin-top:2px;}
  /* player */
  .player{
    background:var(--white);border:2px solid var(--pazapa-grey-light);border-radius:12px;
    padding:14px 16px;margin:0 0 16px;
  }
  .player-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .pbtn{
    min-height:48px;min-width:48px;padding:8px 20px;border-radius:10px;
    border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);
    font-weight:700;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .pbtn.alt{background:var(--white);}
  .pbtn:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6B6B69;cursor:not-allowed;}
  .pbtn svg{width:18px;height:18px;display:block;fill:currentColor;}
  .audio-status{font-size:.9rem;margin:10px 0 0;font-weight:600;}
  .audio-missing{background:var(--yellow-tint);border:1px solid var(--pazapa-yellow);border-radius:8px;padding:8px 12px;margin:10px 0 0;font-size:.92rem;font-weight:600;}
  .transcript{margin-top:12px;border:1px solid #F0DC92;background:#FFFBEA;border-radius:10px;padding:0;}
  .unused{
    min-height:48px;padding:12px 14px;cursor:pointer;font-weight:700;display:flex;align-items:center;
  }
  .transcript .tbody{padding:0 14px 12px;}
  .tline{margin:0 0 8px;}
  .tline .sp{font-weight:700;}
  /* choices */
  .choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:0 0 16px;}
  .choice{
    background:var(--white);border:3px solid var(--pazapa-grey-light);border-radius:12px;
    padding:10px 8px 12px;text-align:center;cursor:pointer;color:var(--pazapa-grey-dark);
    font-size:1.05rem;font-weight:700;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .choice .pic{width:100%;height:130px;object-fit:contain;background:#FFF8EE;border-radius:8px;display:block;}
  .choice.small .pic{height:96px;}
  .choice:hover:not(:disabled){border-color:var(--pazapa-blue);}
  .choice:disabled{opacity:.55;cursor:not-allowed;}
  .choice.picked{border-color:var(--pazapa-blue);background:var(--blue-tint);}
  .choice.picked::after,.choice.match::after,.choice.nudge::after{
    font-size:.85rem;font-weight:700;
  }
  .choice.picked::after{content:"Selected";}
  .choice.match{border-color:var(--pazapa-green);background:var(--green-tint);}
  .choice.match::after{content:"Correct";}
  .choice.nudge{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
  .choice.nudge::after{content:"Check this one";}
  .choice .fr{font-size:.88rem;}
  .qblock{margin:0 0 18px;padding:0;border:0;}
  .qblock legend{font-weight:700;font-size:1.05rem;margin-bottom:8px;padding:0;}
  .opt-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
  .opt-row .choice{flex-direction:column;}
  .opt-row .choice.small .pic{height:84px;}
  /* ordering */
  .order-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px;}
  .order-item{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--white);border:3px solid var(--pazapa-grey-light);border-radius:12px;padding:10px 12px;
  }
  .order-item .num{
    width:34px;height:34px;border-radius:50%;background:var(--pazapa-blue);color:var(--pazapa-grey-dark);
    font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 34px;
  }
  .order-item .otext{flex:1 1 180px;font-weight:600;cursor:grab;min-height:48px;display:flex;flex-direction:column;justify-content:center;}
  .order-item .moves{display:flex;gap:8px;}
  .mv{
    min-height:48px;min-width:48px;padding:6px 12px;border-radius:10px;border:2px solid var(--pazapa-blue);
    background:var(--white);color:var(--pazapa-grey-dark);font-weight:700;cursor:pointer;font-size:.95rem;
  }
  .mv:disabled{border-color:var(--pazapa-grey-light);color:#6B6B69;cursor:not-allowed;}
  .order-item.picked{border-color:var(--pazapa-blue);background:var(--blue-tint);}
  .order-item.match{border-color:var(--pazapa-green);background:var(--green-tint);}
  .order-item.nudge{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
  .order-item:focus-within{border-color:var(--pazapa-blue);}
  .order-item.dragging{opacity:.5;}
  .order-item.over{border-style:dashed;border-color:var(--pazapa-blue);}
  /* feedback + nav */
  .feedback{margin:0 0 14px;padding:10px 14px;border-radius:8px;font-weight:600;display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:var(--green-tint);border:1px solid var(--pazapa-green);}
  .feedback.retry{background:var(--yellow-tint);border:1px solid var(--pazapa-yellow);}
  .nav-row{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px;}
  .btn{
    font-size:1rem;font-weight:700;border-radius:10px;padding:10px 24px;border:2px solid var(--pazapa-blue);
    cursor:pointer;min-height:48px;min-width:48px;color:var(--pazapa-grey-dark);
  }
  .btn-primary{background:var(--pazapa-blue);}
  .btn-ghost{background:var(--white);}
  .btn-help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
  .btn:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6B6B69;cursor:not-allowed;}
  .btn.done-ok:disabled{background:var(--pazapa-green);border-color:var(--pazapa-green);color:var(--pazapa-grey-dark);cursor:default;}
  .btn[hidden]{display:none;}
  .btn .fr,.pbtn .fr,.lang-btn .fr{font-size:.8rem;margin-top:0;}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px;box-shadow:0 0 0 6px var(--white);}
  .final-card{text-align:center;padding:24px 10px;}
  .final-card .tick{width:72px;height:72px;margin:0 auto 14px;display:block;}
  .final-card p{margin:0 0 8px;font-size:1.05rem;}
  .done-note{font-weight:700;margin-top:12px;}
  .final-card .nav-row{justify-content:center;}
  .sr-only,#live-region{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @media (max-width:480px){
    h1{font-size:1.6rem;} main{padding:18px 16px 26px;}
    .choice-grid{grid-template-columns:1fr 1fr;gap:10px;}
    .nav-row .btn{flex:1 1 140px;}
  }
</style>
</head>

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const T = (en,fr)=>`<span class="en">${en}</span><span class="fr" lang="fr">${fr}</span>`;
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function sameSet(a,b){return a.length===b.length && a.every(x=>b.includes(x));}
function sameList(a,b){return a.length===b.length && a.every((x,i)=>x===b[i]);}
function announce(msg){const l=$('#live-region');l.textContent='';setTimeout(()=>{l.textContent=msg;},30);}

const NSCREENS = 5; /* 0-3 tasks, 4 completion */
function freshScreen(i){
  const s={sel:null,attempts:0,ok:false,revealed:false,wrong:false,heard:false,order:[]};
  if(i===0){s.sel=null;s.order=shuffle(CONFIG.s1.options.map(o=>o.id));}
  if(i===1){s.sel=[];s.order=shuffle(CONFIG.s2.options.map(o=>o.id));}
  if(i===2){s.sel={};s.order={};CONFIG.s3.questions.forEach(q=>{s.order[q.id]=shuffle(q.options.map(o=>o.id));});}
  if(i===3){s.sel=null;s.order=freshOrder();}
  return s;
}
function freshOrder(){let o;do{o=shuffle(CONFIG.s4.cards.map(c=>c.id));}while(sameList(o,CONFIG.answers.s4));return o;}
function freshState(){return {screen:0,s:[0,1,2,3].map(freshScreen),lang:false};}
let state, lmsDone=false;
function load(){
  try{
    const raw=localStorage.getItem(CONFIG.storageKey);
    if(raw){const d=JSON.parse(raw);
      if(d && Array.isArray(d.s) && d.s.length===4 && typeof d.screen==='number'){state=d;}
      lmsDone=!!(d&&d.lmsDone);
    }
  }catch(e){}
  if(!state) state=freshState();
  /* a stored position on the completion screen is only valid if all tasks are resolved */
  if(state.screen>=4 && !allResolved()) state.screen=firstOpen();
}
function save(){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(Object.assign({},state,{lmsDone:lmsDone})));}catch(e){}}
function resolved(i){const s=state.s[i];return s.ok||s.revealed;}
function allResolved(){return [0,1,2,3].every(resolved);}
function firstOpen(){for(let i=0;i<4;i++) if(!resolved(i)) return i;return 3;}
const audioMissing = !CONFIG.AUDIO_FILES.main;

/* ================= AUDIO ENGINE (one source at a time) ================= */
let currentAudio=null, playing=false;
function stopAudio(){
  if(currentAudio){try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){} currentAudio=null;}
  if(window.speechSynthesis){try{window.speechSynthesis.cancel();}catch(e){}}
  playing=false; syncAudio();
}
function playAudio(src){
  if(!src){console.error('Missing audio source.');return;}
  stopAudio();
  const a=new Audio(); a.preload='auto'; a.src=src; currentAudio=a;
  a.addEventListener('play',()=>{if(currentAudio===a){playing=true;syncAudio();}});
  a.addEventListener('pause',()=>{if(currentAudio===a){playing=false;syncAudio();}});
  a.addEventListener('ended',()=>{if(currentAudio===a){currentAudio=null;playing=false;markHeard();syncAudio();}});
  a.addEventListener('error',()=>{console.error('Audio loading error:',a.error?a.error.code:'unknown');if(currentAudio===a){currentAudio=null;playing=false;syncAudio();}});
  const pr=a.play(); if(pr&&typeof pr.catch==='function') pr.catch(err=>{console.error('Audio playback failed:',err);});
}
function markHeard(){
  if(state.screen===0 && !state.s[0].heard){state.s[0].heard=true;save();refresh(0);announce('Audio finished. You can choose now.');}
}
/* Play / Pause button: pause and resume the same recording, or start it from the beginning */
function togglePlay(){
  if(audioMissing) return;
  if(currentAudio && !currentAudio.ended){
    if(currentAudio.paused){const pr=currentAudio.play(); if(pr&&pr.catch) pr.catch(err=>console.error('Audio playback failed:',err));}
    else currentAudio.pause();
  } else playAudio(CONFIG.AUDIO_FILES.main);
}
function restartAudio(){ if(!audioMissing) playAudio(CONFIG.AUDIO_FILES.main); }
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_RESTART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>';
function syncAudio(){
  $$('.js-play').forEach(b=>{
    b.setAttribute('aria-pressed',playing?'true':'false');
    b.setAttribute('aria-label',playing?'Pause audio':'Play audio');
    b.innerHTML=(playing?ICON_PAUSE:ICON_PLAY)+T(playing?'Pause':'Play',playing?'Pause':'Écouter');
  });
  $$('.js-status').forEach(el=>{el.textContent=audioMissing?'':(playing?'Playing…':'');});
}
function playerHTML(){
  return `<div class="player">
    <div class="player-row">
      <button type="button" class="pbtn js-play" ${audioMissing?'disabled':''} aria-pressed="false" aria-label="Play audio">${ICON_PLAY}${T('Play','Écouter')}</button>
      <button type="button" class="pbtn alt js-restart" ${audioMissing?'disabled':''} aria-label="Restart audio">${ICON_RESTART}${T('Restart','Recommencer')}</button>
    </div>
    <p class="audio-status js-status" aria-hidden="true"></p>
    ${audioMissing?`<div class="audio-missing" role="note">${T('Audio is not added yet. Press Show transcript to read the script.','L’audio n’est pas encore ajouté. Appuyez sur Afficher la transcription pour lire le texte.')}</div>`:''}
    <button type="button" class="btn btn-ghost js-tbtn" aria-expanded="false" style="margin-top:12px">${T('Show transcript','Afficher la transcription')}</button>
    <div class="transcript js-tbox" role="region" aria-label="Audio support transcript" hidden>
      <div class="tbody">${CONFIG.script.map(l=>`<p class="tline"><span class="sp">${l.sp}:</span> <span class="en">${l.en}</span><span class="fr" lang="fr">${l.fr}</span></p>`).join('')}</div>
    </div>
  </div>`;
}

};

  <div class="nav-row">
    <button type="button" class="btn btn-help" id="show${i}" hidden>${T('Show me','Montrer')}</button>

    <button type="button" class="btn btn-primary" id="cont${i}" disabled>${T('Continue','Continuer')}</button>
  </div>`;

function headHTML(i,title,eyebrow){
  return `<p class="eyebrow">${eyebrow}</p><h${i===0?1:2} id="t${i}" tabindex="-1">${title}</h${i===0?1:2}>
    <div class="instructions">${T(INSTR[i].en,INSTR[i].fr)}</div>${playerHTML()}`;
}
function choiceBtn(o,extra=''){
  return `<button type="button" class="choice ${extra}" role="%ROLE%" aria-checked="false" data-id="${o.id}">
    ${o.img?`<img class="pic" src="${IMG[o.img]}" alt="">`:''}<span class="lab">${T(o.en,o.fr)}</span></button>`.replace('%ROLE%',extra.includes('multi')?'checkbox':'radio');
}
function build(i){
  const sec=$(`#screen${i}`)||document.createElement('section');
  sec.className='screen';sec.id=`screen${i}`;sec.hidden=(i!==state.screen);
  const s=state.s[i];
  if(i===0){
    sec.setAttribute('aria-labelledby','t0');
    sec.innerHTML=headHTML(0,'Jobs and abilities','Listening Mission')+
      `<p class="audio-status" id="gate0"></p>
      <div class="choice-grid" role="radiogroup" aria-label="Situation">${s.order.map(id=>choiceBtn(CONFIG.s1.options.find(o=>o.id===id))).join('')}</div>`+navHTML(0);
  }
  if(i===1){
    sec.setAttribute('aria-labelledby','t1');
    sec.innerHTML=headHTML(1,'Listen for key words','Task 2 of 4')+
      `<div class="choice-grid" role="group" aria-label="Words">${s.order.map(id=>choiceBtn(CONFIG.s2.options.find(o=>o.id===id),'small multi')).join('')}</div>`+navHTML(1);
  }
  if(i===2){
    sec.setAttribute('aria-labelledby','t2');
    sec.innerHTML=headHTML(2,'Listen for details','Task 3 of 4')+
      CONFIG.s3.questions.map((q,n)=>`<fieldset class="qblock" data-q="${q.id}"><legend>${n+1}. ${T(q.en,q.fr)}</legend>
        <div class="opt-row" role="radiogroup" aria-label="Question ${n+1}">${s.order[q.id].map(id=>choiceBtn(q.options.find(o=>o.id===id),'small')).join('')}</div></fieldset>`).join('')+navHTML(2);
  }
  if(i===3){
    sec.setAttribute('aria-labelledby','t3');
    sec.innerHTML=headHTML(3,'Put the message in order','Task 4 of 4')+
      `<ol class="order-list" id="olist" aria-label="Three parts"></ol>`+navHTML(3);
  }
  if(!sec.parentNode) main.appendChild(sec);
  wire(i);
  refresh(i);
}
function buildFinal(){
  const sec=document.createElement('section');
  sec.className='screen';sec.id='screen4';sec.hidden=(state.screen!==4);sec.setAttribute('aria-labelledby','t4');
  sec.innerHTML=`<div class="final-card">
    <svg class="tick" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#C9D646"/><path d="M20 37l11 11 21-23" fill="none" stroke="#2E2E2D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2 id="t4" tabindex="-1">${T('Listening Mission complete.','Mission d’écoute terminée.')}</h2>
    <p>${T('You listened for key information about jobs and abilities.','Vous avez écouté des informations importantes sur les métiers et les compétences.')}</p>
    <p>${T('Next, you will practise pronunciation.','Ensuite, vous allez travailler la prononciation.')}</p>
    <p class="done-note" id="done-note" hidden>${T('Done. You can go to the next activity.','Terminé. Vous pouvez passer à l’activité suivante.')}</p>
    <div class="nav-row">
      <button type="button" class="btn btn-ghost" id="tryAll">${T('Try again','Réessayer')}</button>
      <button type="button" class="btn btn-primary" id="doneBtn">${T('Done','Terminé')}</button>
    </div></div>`;
  main.appendChild(sec);
}

/* ---- wiring ---- */
function wire(i){
  const sec=$(`#screen${i}`);
  $('.js-play',sec).addEventListener('click',togglePlay);
  $('.js-restart',sec).addEventListener('click',restartAudio);
  $('.js-tbtn',sec).addEventListener('click',()=>{
    const bx=$('.js-tbox',sec),btn=$('.js-tbtn',sec),show=bx.hidden;
    bx.hidden=!show;btn.setAttribute('aria-expanded',show?'true':'false');
    btn.innerHTML=show?T('Hide transcript','Masquer la transcription'):T('Show transcript','Afficher la transcription');
  });
  $(`#check${i}`).addEventListener('click',()=>check(i));
  $(`#cont${i}`).addEventListener('click',()=>goTo(i+1));
  $(`#retry${i}`).addEventListener('click',()=>retryScreen(i));
  $(`#show${i}`).addEventListener('click',()=>showMe(i));
  if(i===0){
    $$('.choice',sec).forEach(b=>b.addEventListener('click',()=>{ if(!choicesOpen()) return; changed(0); state.s[0].sel=b.dataset.id; afterChange(0);}));
  }
  if(i===1){
    $$('.choice',sec).forEach(b=>b.addEventListener('click',()=>{
      changed(1); const s=state.s[1]; const id=b.dataset.id;
      s.sel=s.sel.includes(id)?s.sel.filter(x=>x!==id):s.sel.concat(id); afterChange(1);}));
  }
  if(i===2){
    $$('.qblock',sec).forEach(fs=>$$('.choice',fs).forEach(b=>b.addEventListener('click',()=>{
      changed(2); state.s[2].sel[fs.dataset.q]=b.dataset.id; afterChange(2);})));
  }
}
function choicesOpen(){return audioMissing||state.s[0].heard;}
/* any edit invalidates an earlier check */
function changed(i){const s=state.s[i];s.ok=false;s.revealed=false;s.wrong=false;}
function afterChange(i){save();refresh(i);}

/* ---- checking ---- */
function isCorrect(i){
  const s=state.s[i],A=CONFIG.answers;
  if(i===0) return s.sel===A.s1;
  if(i===1) return sameSet(s.sel,A.s2);
  if(i===2) return CONFIG.s3.questions.every(q=>s.sel[q.id]===A.s3[q.id]);
  if(i===3) return sameList(s.order,A.s4);
}
function canCheck(i){
  const s=state.s[i];
  if(i===0) return !!s.sel && choicesOpen();
  if(i===1) return s.sel.length>0;
  if(i===2) return CONFIG.s3.questions.every(q=>!!s.sel[q.id]);
  return true;
}
function check(i){
  const s=state.s[i]; if(!canCheck(i)) return;
  if(isCorrect(i)){s.ok=true;s.wrong=false;announce('Correct.');}
  else{s.ok=false;s.wrong=true;s.attempts++;announce('Not yet. Listen again.');}
  save();refresh(i);
}
function showMe(i){
  const s=state.s[i],A=CONFIG.answers;
  if(i===0) s.sel=A.s1;
  if(i===1) s.sel=A.s2.slice();
  if(i===2) s.sel=Object.assign({},A.s3);
  if(i===3) s.order=A.s4.slice();
  s.revealed=true;s.ok=false;s.wrong=false;
  save();refresh(i);announce('The answer is shown.');
}
function retryScreen(i){
  const old=state.s[i],n=freshScreen(i);
  n.attempts=old.attempts;n.heard=old.heard;
  state.s[i]=n;save();
  build(i);
  const t=$(`#t${i}`); if(t) t.focus();
  announce('This task is reset.');
}

/* ---- marking choices after a check ---- */
function setMark(el,cls){el.classList.remove('picked','match','nudge');if(cls)el.classList.add(cls);}
function refresh(i){
  const sec=$(`#screen${i}`); if(!sec) return;
  const s=state.s[i],A=CONFIG.answers;
  const checkedNow=s.ok||s.wrong, shown=s.revealed;
  let enabled=true;
  if(i===0){
    enabled=choicesOpen();
    $('#gate0').textContent=enabled?'':'Press Play. The choices open when the audio ends.';
  }
  if(i===0){
    $$('.choice',sec).forEach(b=>{
      const id=b.dataset.id,sel=s.sel===id;
      b.disabled=!enabled;b.setAttribute('aria-checked',sel?'true':'false');
      let c=sel?'picked':null;
      if(sel&&(s.ok||shown)) c='match'; else if(sel&&s.wrong) c='nudge';
      setMark(b,c);
    });
  }
  if(i===1){
    $$('.choice',sec).forEach(b=>{
      const id=b.dataset.id,sel=s.sel.includes(id),good=A.s2.includes(id);
      b.setAttribute('aria-checked',sel?'true':'false');
      let c=sel?'picked':null;
      if(sel&&(s.ok||shown)) c='match'; else if(sel&&s.wrong&&!good) c='nudge'; else if(sel&&s.wrong&&good) c='match';
      setMark(b,c);
    });
  }
  if(i===2){
    CONFIG.s3.questions.forEach(q=>{
      const fs=$(`.qblock[data-q="${q.id}"]`,sec);
      $$('.choice',fs).forEach(b=>{
        const sel=s.sel[q.id]===b.dataset.id,good=A.s3[q.id]===b.dataset.id;
        b.setAttribute('aria-checked',sel?'true':'false');
        let c=sel?'picked':null;
        if(sel&&(s.ok||shown||(s.wrong&&good))) c='match'; else if(sel&&s.wrong) c='nudge';
        setMark(b,c);
      });
    });
  }
  if(i===3) renderOrder(sec);
  /* feedback */
  const fb=$(`#fb${i}`);
  if(s.ok){fb.className='feedback show good';fb.innerHTML=T(GOOD.en,GOOD.fr);}
  else if(s.revealed){fb.className='feedback show retry';fb.innerHTML=T(SHOWN.en,SHOWN.fr);}
  else if(s.wrong){fb.className='feedback show retry';fb.innerHTML=T(HINTS[i].en,HINTS[i].fr);}
  else{fb.className='feedback';fb.innerHTML='';}
  /* buttons */
  const res=resolved(i);
  $(`#check${i}`).disabled=!canCheck(i)||res;
  $(`#cont${i}`).disabled=!res;
  $(`#retry${i}`).hidden=!s.wrong;
  $(`#show${i}`).hidden=!(s.attempts>=2&&!res);
  updateProgress();
}
function renderOrder(sec){
  const s=state.s[3],list=$('#olist',sec),A=CONFIG.answers.s4;
  list.innerHTML='';
  s.order.forEach((id,idx)=>{
    const c=CONFIG.s4.cards.find(x=>x.id===id);
    const li=document.createElement('li');
    let cls='order-item';
    if(s.ok||s.revealed) cls+=' match';
    else if(s.wrong) cls+=(A[idx]===id?' match':' nudge');
    li.className=cls;li.draggable=true;li.dataset.id=id;
    li.innerHTML=`<span class="num" aria-hidden="true">${idx+1}</span>
      <span class="otext">${T(c.en,c.fr)}</span>
      <span class="moves">
        <button type="button" class="mv" data-dir="-1" ${idx===0?'disabled':''} aria-label="Move up: ${c.en}">${T('Move up','Monter')}</button>
        <button type="button" class="mv" data-dir="1" ${idx===s.order.length-1?'disabled':''} aria-label="Move down: ${c.en}">${T('Move down','Descendre')}</button>
      </span>`;
    list.appendChild(li);
  });
  $$('.mv',list).forEach(b=>b.addEventListener('click',()=>{
    const li=b.closest('li'),id=li.dataset.id,dir=+b.dataset.dir;
    moveItem(id,dir);
    const nl=$(`#olist li[data-id="${id}"] .mv[data-dir="${dir}"]`)||$(`#olist li[data-id="${id}"] .mv:not(:disabled)`);
    if(nl) nl.focus();
  }));
  /* drag and drop */
  let dragId=null;
  $$('li',list).forEach(li=>{
    li.addEventListener('dragstart',e=>{dragId=li.dataset.id;li.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(x){}});
    li.addEventListener('dragend',()=>{li.classList.remove('dragging');$$('li',list).forEach(x=>x.classList.remove('over'));});
    li.addEventListener('dragover',e=>{e.preventDefault();li.classList.add('over');});
    li.addEventListener('dragleave',()=>li.classList.remove('over'));
    li.addEventListener('drop',e=>{
      e.preventDefault();li.classList.remove('over');
      if(!dragId||dragId===li.dataset.id) return;
      const o=state.s[3].order.slice(),from=o.indexOf(dragId),to=o.indexOf(li.dataset.id);
      o.splice(from,1);o.splice(to,0,dragId);
      changed(3);state.s[3].order=o;afterChange(3);announce('Moved.');
    });
  });
}
function moveItem(id,dir){
  const o=state.s[3].order.slice(),i=o.indexOf(id),j=i+dir;
  if(j<0||j>=o.length) return;
  [o[i],o[j]]=[o[j],o[i]];
  changed(3);state.s[3].order=o;afterChange(3);
  announce(`Moved to position ${j+1}.`);
}

/* ---- navigation ---- */
function goTo(n){
  if(n>4) return;
  if(n===4 && !allResolved()) return;
  stopAudio();
  state.screen=n;save();
  $$('.screen',main).forEach(sc=>sc.hidden=(sc.id!==`screen${n}`));
  if(n===4) syncDone();
  updateProgress();
  const t=$(`#t${n}`); if(t){t.focus();}
  window.scrollTo({top:0,behavior:'auto'});
}
function updateProgress(){
  const n=state.screen,lab=$('#progress-label');
  const done=[0,1,2,3].filter(resolved).length;
  lab.textContent=n>=4?'Complete':`Task ${n+1} of 4`;
  const pct=n>=4?100:Math.round(done/4*100);
  $('#progress-fill').style.width=pct+'%';
  $('#progress-bar').setAttribute('aria-valuenow',n>=4?4:done);
}

/* ================= LMS COMPLETION (silent) ================= */
function findAPI(win,name){
  let w=win,tries=0;
  while(w&&tries<12){
    try{ if(w[name]) return w[name]; }catch(e){}
    try{ if(w.parent&&w.parent!==w){w=w.parent;} else break; }catch(e){break;}
    tries++;
  }
  return null;
}
function discoverAPI(){
  let a=findAPI(window,'API_1484_11'); if(a) return {v:'2004',api:a};
  a=findAPI(window,'API'); if(a) return {v:'1.2',api:a};
  try{ if(window.opener){ a=findAPI(window.opener,'API_1484_11'); if(a) return {v:'2004',api:a}; a=findAPI(window.opener,'API'); if(a) return {v:'1.2',api:a}; } }catch(e){}
  return null;
}
let completionSent=false;
function sendCompletion(){
  if(completionSent) return true;
  const f=discoverAPI(); if(!f) return false;
  try{
    if(f.v==='2004'){
      f.api.Initialize('');
      const cur=f.api.GetValue('cmi.completion_status');
      if(cur!=='completed'){f.api.SetValue('cmi.completion_status','completed');}
      f.api.Commit('');
    }else{
      f.api.LMSInitialize('');
      const cur=f.api.LMSGetValue('cmi.core.lesson_status');
      if(cur!=='completed'&&cur!=='passed'){f.api.LMSSetValue('cmi.core.lesson_status','completed');}
      f.api.LMSCommit('');
    }
    completionSent=true;return true;
  }catch(e){return false;}
}
function activityCompleted(){
  if(!allResolved()) return;
  lmsDone=true;save();
  sendCompletion();
  console.log(CONFIG.logLabel);
}
/* keep trying API discovery after later interaction if completion is still unsent */
document.addEventListener('pointerdown',()=>{ if(lmsDone&&!completionSent) sendCompletion(); },{passive:true});

/* ================= DONE / TRY AGAIN (end screen) ================= */
const doneBtn=()=>$('#doneBtn');
function syncDone(){
  const b=doneBtn(); if(!b) return;
  const ready=allResolved();
  if(lmsDone){
    b.disabled=true;b.classList.add('done-ok');b.innerHTML='Done &#10003;';
    $('#done-note').hidden=false;
  }else{
    b.disabled=!ready;b.classList.remove('done-ok');b.innerHTML=T('Done','Terminé');
    $('#done-note').hidden=true;
  }
}
function onDone(){
  if(!allResolved()||lmsDone) return;
  activityCompleted();
  syncDone();
  announce('Done.');
}
function tryAllAgain(){
  stopAudio();
  const keepLang=state.lang;
  state=freshState();state.lang=keepLang;
  playedToEnd=false;
  save();
  main.innerHTML='';
  [0,1,2,3].forEach(build);buildFinal();wireFinal();
  goTo(0);announce('Listening Mission restarted.');
}
function wireFinal(){
  doneBtn().disabled=true;
  doneBtn().addEventListener('click',onDone);
  $('#tryAll').addEventListener('click',tryAllAgain);
}

/* ================= FRENCH TOGGLE ================= */
function applyLang(){
  document.body.classList.toggle('fr-on',!!state.lang);
  const b=$('#lang-btn');
  b.setAttribute('aria-pressed',state.lang?'true':'false');
  b.setAttribute('aria-label',state.lang?'Hide French translation':'Show French translation');
}
$('#lang-btn').addEventListener('click',()=>{state.lang=!state.lang;save();applyLang();announce(state.lang?'French shown.':'French hidden.');});

/* ================= INIT ================= */
load();
[0,1,2,3].forEach(build);
buildFinal();
wireFinal();
$$('.screen',main).forEach(sc=>sc.hidden=(sc.id!==`screen${state.screen}`));
applyLang();syncAudio();syncDone();updateProgress();
if(lmsDone&&!completionSent) sendCompletion();
if(audioMissing) console.warn('W11D1 Listening Mission: no audio inserted. Add the approved recording to CONFIG.AUDIO_FILES.main.');
</script>
</body>
</html>
