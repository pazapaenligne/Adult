<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporting household problems — Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --white:#FFFFFF;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  background:var(--pazapa-grey-light);
  color:var(--pazapa-grey-dark);
  line-height:1.55;
  font-size:1rem;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;margin:0;line-height:1.25;}
.shell{max-width:780px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
.topbar{background:var(--pazapa-blue);color:var(--pazapa-grey-dark);padding:14px 18px 16px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.eyebrow{font-size:.85rem;font-weight:700;margin:0 0 2px;}
.topbar h1{font-size:1.3rem;}
.topbar .sub{margin:2px 0 0;font-size:.95rem;}
.lang-btn{min-height:48px;min-width:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-grey-dark);background:var(--white);color:var(--pazapa-grey-dark);font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;white-space:nowrap;}
.part-label{margin:10px 0 0;font-size:.85rem;font-weight:700;}
main{flex:1;padding:22px 18px 34px;}
.screen-title{font-size:1.4rem;margin:0 0 8px;}
.screen-title:focus{outline:none;}
.intro{margin:0 0 16px;}
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-bottom:18px;}
.hero .pic{background:var(--green-tint);border-radius:var(--radius);padding:8px;}
@media (max-width:480px){.hero{grid-template-columns:1fr;}.hero .pic{max-width:200px;}}
img.pic-img{display:block;width:100%;height:auto;max-height:260px;object-fit:contain;border-radius:12px;}
.card{background:var(--blue-tint);border-radius:var(--radius);padding:16px;margin:0 0 16px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.plain{background:var(--white);border:2px solid var(--pazapa-grey-light);}
.card h3{font-size:1.05rem;margin:0 0 10px;}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin:0 0 8px;}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;margin:0 0 8px;background:var(--white);border:2px solid var(--pazapa-blue);border-radius:12px;cursor:pointer;touch-action:manipulation;}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--pazapa-grey-dark);}
.opt.on{background:var(--green-tint);border-color:var(--pazapa-green);}
label.field{display:block;font-weight:700;margin:0 0 6px;}
select,input[type=text],textarea{font:inherit;color:var(--pazapa-grey-dark);background:var(--white);border:2px solid var(--pazapa-blue);border-radius:10px;padding:10px 12px;min-height:48px;max-width:100%;touch-action:manipulation;}
select{width:100%;}
textarea{width:100%;min-height:120px;resize:vertical;}
input[type=text]{min-width:130px;width:170px;}
.btn{min-height:48px;min-width:48px;padding:12px 22px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;border:2px solid var(--pazapa-grey-dark);}
.btn-primary{background:var(--pazapa-blue);color:var(--pazapa-grey-dark);}
.btn-secondary{background:var(--white);color:var(--pazapa-grey-dark);border-color:var(--pazapa-blue);}
.btn-help{background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);border-color:var(--pazapa-grey-dark);}
.btn:disabled{background:var(--pazapa-grey-light);color:#5c5c5a;border:2px dashed #8a8a88;cursor:not-allowed;}
.btn-small{padding:8px 14px;}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:center;}
.fb{margin:8px 0 0;font-size:.95rem;min-height:1.2em;}
.fb .dot{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;margin-right:8px;font-weight:800;font-size:.85rem;vertical-align:middle;color:var(--pazapa-grey-dark);}
.fb .dot.ok{background:var(--pazapa-green);}
.fb .dot.warn{background:var(--pazapa-yellow);}
.hintbox{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:10px;padding:10px 14px;margin:10px 0 0;}
.hintrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;}
.thumb{width:64px;height:84px;object-fit:contain;border-radius:8px;background:var(--white);}
.match-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--pazapa-grey-light);}
.match-row .word{font-weight:700;min-width:130px;}
.match-row .sel{flex:1 1 200px;}
.match-row .fb{flex-basis:100%;margin:0;}
.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px;font-size:1.02rem;}
.quote{background:var(--white);border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;margin:0 0 8px;white-space:pre-wrap;word-wrap:break-word;}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 12px;border-radius:12px;margin-bottom:8px;}
.tag.before{background:var(--pazapa-grey-light);}
.tag.after{background:var(--pazapa-green);}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
@media (max-width:620px){.compare{grid-template-columns:1fr;}}
.compare .card{margin:0;}
.ticklist{list-style:none;margin:0 0 6px;padding:0;}
.ticklist li{padding:6px 0 6px 34px;position:relative;}
.ticklist li:before{content:"✓";position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--pazapa-green);text-align:center;font-weight:800;line-height:24px;font-size:.85rem;}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px;padding:0;list-style:none;}
.bank li{background:var(--white);border:2px solid var(--pazapa-blue);border-radius:20px;padding:8px 14px;}
.bank button{background:var(--white);border:2px solid var(--pazapa-blue);border-radius:24px;padding:8px 14px;min-height:48px;font:inherit;cursor:pointer;touch-action:manipulation;color:var(--pazapa-grey-dark);}
.rec{background:var(--white);border:2px dashed var(--pazapa-blue);border-radius:12px;padding:12px;margin:10px 0;}
.rec .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
.finish-line{margin-top:14px;font-weight:700;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.small{font-size:.88rem;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important;}}
</style>
</head>

<div class="shell">
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <p class="eyebrow">Pazapa English Programme for Adults</p>
        <h1 id="pageTitle">Reporting household problems</h1>
        <p class="sub" id="pageSub">Review, improve and retry</p>
      </div>
      <button type="button" class="lang-btn" id="langBtn"></button>
    </div>
    <p class="part-label" id="partLabel"></p>
  </header>
  <main id="main"></main>
</div>
<div class="sr-only" id="live" aria-live="polite" role="status"></div>

/* ===== Helpers ===== */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s||"").normalize("NFKC").replace(/[‘’ʼ`´]/g,"'").replace(/\s+/g," ").trim().toLowerCase();}
function normLoose(s){return norm(s).replace(/[.!?,;:\s]+$/,"").replace(/^the\s+/,"");}
function h(tag,attrs){
  var e=document.createElement(tag);
  attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v===null||v===undefined||v===false)return;
    if(k==="class")e.className=v;
    else if(k==="text")e.textContent=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(k==="value"||k==="checked"||k==="disabled"||k==="selected")e[k]=v;
    else e.setAttribute(k,v===true?"":v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids=arguments[i];
    if(!Array.isArray(kids))kids=[kids];
    kids.forEach(function(c){
      if(c===null||c===undefined||c===false)return;
      e.appendChild(typeof c==="string"?document.createTextNode(c):c);
    });
  }
  return e;
}

/* ===== Checking ===== */
function analyse(text){
  var n=norm(text);
  var r={problem:RX.problem.test(n),request:RX.request.test(n),time:RX.time.test(n),polite:RX.polite.test(n)};
  var c=0;LESSON_FRAGMENTS.forEach(function(f){if(n.indexOf(f)!==-1)c++;});
  r.phrases=c;
  return r;
}
function attemptText(a){
  if(a.route==="write")return (a.text||"").trim();
  if(a.route==="build")return PART_KEYS.map(function(k){return a.build[k];}).filter(Boolean).join(" ");
  return "";
}
function attemptParts(a){
  if(a.route==="speak"){return {problem:!!a.parts.problem,request:!!a.parts.request,time:!!a.parts.time,polite:!!a.parts.polite,phrases:0};}
  return analyse(attemptText(a));
}
function attemptValid(a){
  if(a.route==="speak")return !!a.spoken;
  return attemptText(a).length>=3;
}
function recallComplete(){
  var r=state.recall,ok=true;
  WORD_KEYS.forEach(function(k){if(!r.match[k])ok=false;});
  if(!(r.fillChecked&&r.f1.trim()&&r.f2.trim()))ok=false;
  if(!r.r1||!r.r2)ok=false;
  return ok;
}

function allowedScreen(){
  if(state.goalChoice!=="g1")return 1;

var memStore=null;
function compact(){
  function att(a){return {r:a.route,t:(a.text||"").slice(0,400),b:a.build,s:a.spoken?1:0,p:a.parts};}
  return JSON.stringify({v:1,s:state.screen,l:state.lang,g:state.goalChoice,rc:state.recall,f:att(state.first),fl:state.firstLocked?1:0,fo:state.focus,h4:state.hint4,m:state.model?1:0,s2:att(state.second),st:state.secondTouched?1:0,im:state.improved});

function sanitizeAttempt(raw){
  var a=freshAttempt();
  if(!raw||typeof raw!=="object")return a;
  if(raw.r==="write"||raw.r==="build"||raw.r==="speak")a.route=raw.r;
  if(typeof raw.t==="string")a.text=raw.t.slice(0,400);
  if(raw.b&&typeof raw.b==="object")PART_KEYS.forEach(function(k){if(typeof raw.b[k]==="string"&&(raw.b[k]===""||PHRASES[k].indexOf(raw.b[k])!==-1))a.build[k]=raw.b[k];});
  a.spoken=raw.s===1;
  if(raw.p&&typeof raw.p==="object")PART_KEYS.forEach(function(k){a.parts[k]=raw.p[k]===true;});
  return a;
}
function restore(str){
  try{
    var raw=JSON.parse(str);
    if(!raw||raw.v!==1||typeof raw!=="object")return false;
    var s=freshState(raw.l==="fr"?"fr":"en");
    if(raw.g==="g1"||raw.g==="g2"||raw.g==="g3")s.goalChoice=raw.g;
    var rc=raw.rc;
    if(rc&&typeof rc==="object"){
      if(rc.match&&typeof rc.match==="object")WORD_KEYS.forEach(function(k){if(typeof rc.match[k]==="string"&&MEANINGS[rc.match[k]])s.recall.match[k]=rc.match[k];});
      if(typeof rc.f1==="string")s.recall.f1=rc.f1.slice(0,60);
      if(typeof rc.f2==="string")s.recall.f2=rc.f2.slice(0,60);
      s.recall.fillChecked=rc.fillChecked===true;
      if(["a","b","c"].indexOf(rc.r1)!==-1)s.recall.r1=rc.r1;
      if(["a","b","c"].indexOf(rc.r2)!==-1)s.recall.r2=rc.r2;
      if(rc.hints&&typeof rc.hints==="object")["match","fill","reply"].forEach(function(k){var n=parseInt(rc.hints[k],10);if(n>=0&&n<=2)s.recall.hints[k]=n;});
    }
    s.first=sanitizeAttempt(raw.f);
    s.firstLocked=raw.fl===1;
    if(Array.isArray(raw.fo))s.focus=raw.fo.filter(function(k){return PART_KEYS.indexOf(k)!==-1;}).slice(0,2);
    var h4=parseInt(raw.h4,10);s.hint4=(h4>=0&&h4<=4)?h4:0;
    s.model=raw.m===1;
    s.second=sanitizeAttempt(raw.s2);
    s.secondTouched=raw.st===1;
    if(Array.isArray(raw.im))s.improved=raw.im.filter(function(k){return ["purpose","info","phrase","polite"].indexOf(k)!==-1;});
    state=s;
    var sc=parseInt(raw.s,10);
    var allowed=allowedScreen();
    state.screen=Math.max(1,Math.min(isNaN(sc)?1:sc,allowed));
    return true;
  }catch(e){return false;}
}

/* ===== LMS (SCORM 1.2 and 2004), guarded ===== */
var lmsCache=null;
function probe(w){
  try{if(w.API_1484_11)return {api:w.API_1484_11,v:"2004"};}catch(e){}
  try{if(w.API)return {api:w.API,v:"1.2"};}catch(e){}
  return null;
}
function findApi(){
  var w=window,i,f;
  for(i=0;i<12&&w;i++){
    f=probe(w);if(f)return f;
    try{if(w.parent&&w.parent!==w){w=w.parent;}else break;}catch(e){break;}
  }
  try{
    var o=window.opener;
    for(i=0;i<8&&o;i++){
      f=probe(o);if(f)return f;
      try{o=(o.parent&&o.parent!==o)?o.parent:o.opener;}catch(e){break;}
    }
  }catch(e){}
  return null;
}
function getLms(){
  if(lmsCache)return lmsCache;
  var f=findApi();
  if(f){
    try{if(f.v==="2004")f.api.Initialize("");else f.api.LMSInitialize("");}catch(e){}
    lmsCache=f;
  }
  return lmsCache;
}
function lmsGet(l,k){try{return l.v==="2004"?String(l.api.GetValue(k)):String(l.api.LMSGetValue(k));}catch(e){return "";}}
function lmsSet(l,k,v){try{return l.v==="2004"?l.api.SetValue(k,v):l.api.LMSSetValue(k,v);}catch(e){return "false";}}
function lmsCommit(l){try{return l.v==="2004"?l.api.Commit(""):l.api.LMSCommit("");}catch(e){return "false";}}
function lmsStatus(l){
  if(l.v==="2004"){
    var c=lmsGet(l,"cmi.completion_status"),s=lmsGet(l,"cmi.success_status");
    if(c==="completed"||s==="passed")return "completed";
    return c;
  }
  var st=lmsGet(l,"cmi.core.lesson_status");
  return (st==="completed"||st==="passed")?"completed":st;
}

var saveTimer=null;
function saveNow(){
  var s=compact();
  try{localStorage.setItem(STORE_KEY,s);}catch(e){memStore=s;}
  var l=getLms();
  if(l&&s.length<3800){
    lmsSet(l,l.v==="2004"?"cmi.suspend_data":"cmi.suspend_data",s);
    lmsSet(l,l.v==="2004"?"cmi.location":"cmi.core.lesson_location",String(state.screen));
    lmsCommit(l);
  }
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500);}
function saveImmediate(){clearTimeout(saveTimer);saveNow();}

var doneBtn=h("button",{type:"button",class:"btn btn-primary",id:"doneBtn"});
doneBtn.disabled=true;
var completionSent=false;

function activityCompleted(){
  if(completionSent)return true;
  var ok=false,l=getLms();
  if(l){
    var st=lmsStatus(l);
    if(st==="completed"){ok=true;}
    else{
      for(var t=0;t<2&&!ok;t++){
        if(l.v==="2004"){lmsSet(l,"cmi.completion_status","completed");}
        else{lmsSet(l,"cmi.core.lesson_status","completed");}
        lmsCommit(l);
        ok=(lmsStatus(l)==="completed");
      }
    }
  }else{
    try{localStorage.setItem(STORE_KEY+"_completed","1");}catch(e){}
    ok=true;
  }
  if(ok){completionSent=true;try{console.log(LOG_LABEL);}catch(e){}}
  return ok;
}

/* ===== Recording (local only) ===== */
function newRec(){return {stream:null,mr:null,chunks:[],url:null,status:"idle",err:"",host:null};}
var rec={first:newRec(),second:newRec()};
function stopTracks(r){
  try{if(r.stream){r.stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});}}catch(e){}
  r.stream=null;
}
function clearUrl(r){if(r.url){try{URL.revokeObjectURL(r.url);}catch(e){}r.url=null;}}
function releaseRec(slot){
  var r=rec[slot];
  try{if(r.mr&&r.mr.state!=="inactive"){r.mr.onstop=null;r.mr.stop();}}catch(e){}
  r.mr=null;r.chunks=[];
  stopTracks(r);clearUrl(r);
  r.status="idle";r.err="";
}
function releaseAll(){releaseRec("first");releaseRec("second");}
window.addEventListener("pagehide",releaseAll);
window.addEventListener("beforeunload",releaseAll);

function recMsg(code){
  return {
    unsupported:L("Recording is not available in this browser. Use writing or building instead, or say your message aloud and tick the box.","L’enregistrement n’est pas disponible dans ce navigateur. Utilisez l’écriture ou la construction, ou dites votre message à voix haute et cochez la case."),
    denied:L("The microphone is blocked. You can allow it in your browser settings, or use writing or building instead.","Le microphone est bloqué. Vous pouvez l’autoriser dans les réglages du navigateur, ou utiliser l’écriture ou la construction."),
    nodevice:L("No microphone was found. Use writing or building instead, or say your message aloud and tick the box.","Aucun microphone n’a été trouvé. Utilisez l’écriture ou la construction, ou dites votre message à voix haute et cochez la case."),
    empty:L("No sound was recorded. Try again, or use writing or building.","Aucun son n’a été enregistré. Essayez encore, ou utilisez l’écriture ou la construction."),
    unexpected:L("Recording did not work this time. You can try again, or use writing or building.","L’enregistrement n’a pas fonctionné cette fois. Vous pouvez réessayer, ou utiliser l’écriture ou la construction.")
  }[code];
}
function classifyErr(err){
  var n=err&&err.name;
  if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError")return "denied";
  if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError")return "nodevice";
  return "unexpected";
}
function paintRec(slot){
  var r=rec[slot];
  if(!r.host)return;
  var c=buildRecUI(slot);
  r.host.replaceChildren(c);
}
function startRec(slot){
  var r=rec[slot];
  releaseRec(slot);
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||typeof window.MediaRecorder==="undefined"){
    r.status="error";r.err="unsupported";paintRec(slot);return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    r.stream=stream;
    try{
      var mr=new MediaRecorder(stream);
      r.mr=mr;r.chunks=[];
      mr.ondataavailable=function(e){if(e.data&&e.data.size>0)r.chunks.push(e.data);};
      mr.onstop=function(){
        stopTracks(r);
        var blob=new Blob(r.chunks,{type:(mr.mimeType||"audio/webm")});
        r.chunks=[];
        if(!blob.size){r.status="error";r.err="empty";}
        else{clearUrl(r);r.url=URL.createObjectURL(blob);r.status="ready";r.err="";}
        paintRec(slot);
      };
      mr.onerror=function(){stopTracks(r);r.status="error";r.err="unexpected";paintRec(slot);};
      mr.start();
      r.status="recording";r.err="";
      paintRec(slot);
    }catch(e){stopTracks(r);r.status="error";r.err="unexpected";paintRec(slot);}
  }).catch(function(err){
    stopTracks(r);r.status="error";r.err=classifyErr(err);paintRec(slot);
  });
}
function stopRec(slot){
  var r=rec[slot];
  try{if(r.mr&&r.mr.state!=="inactive")r.mr.stop();else{r.status="idle";paintRec(slot);}}catch(e){r.status="error";r.err="unexpected";stopTracks(r);paintRec(slot);}
}
function playRec(slot){
  var r=rec[slot];
  if(!r.url)return;
  try{var a=new Audio(r.url);var p=a.play();if(p&&p.catch)p.catch(function(){r.status="error";r.err="unexpected";paintRec(slot);});}
  catch(e){r.status="error";r.err="unexpected";paintRec(slot);}
}
function buildRecUI(slot){
  var r=rec[slot];
  var statusText="";
  if(r.status==="idle")statusText=L("Not recording.","Pas d’enregistrement.");
  else if(r.status==="recording")statusText=L("Recording now. Press Stop when you finish.","Enregistrement en cours. Appuyez sur Arrêter quand vous avez fini.");
  else if(r.status==="ready")statusText=L("Recording stopped. You can listen to it now.","Enregistrement arrêté. Vous pouvez l’écouter.");
  else statusText=recMsg(r.err);
  var rowKids=[
    h("button",{type:"button",class:"btn btn-secondary btn-small",disabled:r.status==="recording",onclick:function(){startRec(slot);}},r.status==="ready"?L("Record again","Réenregistrer"):L("Record","Enregistrer")),
    h("button",{type:"button",class:"btn btn-secondary btn-small",disabled:r.status!=="recording",onclick:function(){stopRec(slot);}},L("Stop","Arrêter")),
    h("button",{type:"button",class:"btn btn-secondary btn-small",disabled:!(r.status==="ready"&&r.url),onclick:function(){playRec(slot);}},L("Hear my recording","Écouter mon enregistrement")),
    h("button",{type:"button",class:"btn btn-secondary btn-small",disabled:r.status==="idle",onclick:function(){releaseRec(slot);paintRec(slot);}},L("Try again","Réessayer"))
  ];
  return h("div",{},
    h("p",{class:"small",style:"margin:0 0 4px"},L("Optional. Recording starts only when you press Record. Your recording stays on this device and disappears when you refresh the page.","Facultatif. L’enregistrement commence seulement quand vous appuyez sur Enregistrer. Il reste sur cet appareil et disparaît quand vous actualisez la page.")),
    h("div",{class:"row"},rowKids),
    h("p",{class:"fb",role:"status","aria-live":"polite"},(r.status==="error"?h("span",{class:"dot warn","aria-hidden":"true"},"!"):null),statusText)
  );
}
function recorderBlock(slot){
  var host=h("div",{class:"rec"});
  rec[slot].host=host;
  host.appendChild(buildRecUI(slot));
  return host;
}

    opts.map(function(o){
      var cb=h("input",{type:"checkbox",checked:state.improved.indexOf(o[0])!==-1,onchange:function(){
        if(cb.checked){if(state.improved.indexOf(o[0])===-1)state.improved.push(o[0]);}
        else state.improved=state.improved.filter(function(x){return x!==o[0];});
        cb.parentNode.className="opt"+(cb.checked?" on":"");
        save();ctl.update();
      }});
      return h("label",{class:"opt"+(state.improved.indexOf(o[0])!==-1?" on":"")},cb,h("span",{},o[1]));
    }),note);
  ctl.update=function(){
    finish.disabled=state.improved.length<1;
    note.textContent=state.improved.length<1?L("Choose at least one.","Choisissez au moins une réponse."):"";
  };
  return h("section",{},titleEl(L("Notice the progress","Remarquez vos progrès")),
    h("div",{class:"compare"},
      h("div",{class:"card plain"},h("span",{class:"tag before"},L("Before","Avant")),attemptSummaryNode(state.first)),
      h("div",{class:"card green"},h("span",{class:"tag after"},L("After","Après")),attemptSummaryNode(state.second))),
    h("div",{class:"card yellow"},h("p",{style:"margin:0 0 6px;font-weight:700"},summary),
      h("p",{class:"small",style:"margin:0"},L("This summary uses simple checks for the lesson phrases. It cannot understand every possible English answer, so your own choice below matters most.","Ce résumé utilise de simples vérifications des phrases du cours. Il ne peut pas comprendre toutes les réponses possibles en anglais, donc votre propre choix ci-dessous compte le plus."))),
    optBox,
    h("div",{class:"actions"},finish));
}

/* ===== Screen 7: Lesson complete ===== */
function s7(){
  var line=h("p",{class:"finish-line",role:"status","aria-live":"polite"});
  doneBtn.textContent=L("Done","Terminé");
  doneBtn.disabled=!(state.screen===7&&allowedScreen()>=7);
  doneBtn.onclick=function(){
    if(doneBtn.disabled)return;
    activityCompleted();
    doneBtn.disabled=true;
    finishedShown=true;
    line.textContent=L("You have finished this activity. You can close this page.","Vous avez terminé cette activité. Vous pouvez fermer cette page.");
  };
  if(finishedShown){doneBtn.disabled=true;line.textContent=L("You have finished this activity. You can close this page.","Vous avez terminé cette activité. Vous pouvez fermer cette page.");}
  var again=h("button",{type:"button",class:"btn btn-secondary",onclick:function(){
    releaseAll();
    state=freshState(state.lang);orders=freshOrders();
    finishedShown=false;doneBtn.disabled=true;
    saveImmediate();
    render(true);
  }},L("Try again","Réessayer"));
  return h("section",{},
    h("div",{class:"hero"},h("div",{class:"pic"},pic("available",L("A woman pointing at a clock to show a time.","Une femme montre une horloge pour indiquer une heure."))),
      h("div",{},titleEl(L("Review complete.","Révision terminée.")),
        h("p",{class:"intro",style:"font-weight:700"},L("You reviewed and improved your English for reporting household problems.","Vous avez révisé et amélioré votre anglais pour signaler des problèmes domestiques.")))),
    h("div",{class:"card green"},h("h3",{},L("Use it this week","À utiliser cette semaine")),
      h("p",{style:"margin:0"},L("Practise one fictional maintenance call from beginning to end. Say the problem, ask for help and give your available time.","Entraînez-vous à un appel de maintenance fictif du début à la fin. Dites le problème, demandez de l’aide et donnez votre heure de disponibilité."))),
    h("div",{class:"actions"},again,doneBtn),line);
}
var finishedShown=false;

/* ===== Init ===== */
(function init(){
  var loaded=false;
  var l=getLms();
  if(l){
    var sd=lmsGet(l,"cmi.suspend_data");
    if(sd&&sd.charAt(0)==="{")loaded=restore(sd);
  }
  if(!loaded){
    try{var ls=localStorage.getItem(STORE_KEY);if(ls)loaded=restore(ls);}catch(e){}
  }
  if(!loaded&&memStore)restore(memStore);
  state.screen=Math.max(1,Math.min(state.screen,allowedScreen()));
  doneBtn.disabled=true;
  render(false);
})();

/* Re-detect the LMS after later interaction if it was not found at start */
document.addEventListener("click",function(){if(!lmsCache){getLms();}},true);
})();
</script>
</body>
