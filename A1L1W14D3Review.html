<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online discussions - Review, improve and retry</title>
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;
    --blue-tint:#EAF8FB;
    --green-tint:#F6F9E7;
    --yellow-tint:#FFF6DE;
    --line:#6E6E6C;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Open Sans",Arial,sans-serif;
    font-size:1rem;
    line-height:1.55;
    color:var(--pazapa-grey-dark);
    background:var(--pazapa-grey-light);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,legend,.brand-name{font-family:"Filson Soft","Open Sans",Arial,sans-serif;}
  .shell{max-width:820px;margin:0 auto;padding:12px 12px 32px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:8px 4px 10px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;}
  .mark{display:inline-block;width:14px;height:14px;background:var(--pazapa-red);flex:none;}
  .brand-name{font-size:1rem;}
  .titleband{
    background:var(--pazapa-blue);
    color:var(--pazapa-grey-dark);
    border-radius:16px 16px 0 0;
    padding:16px 20px 14px;
  }
  .titleband h1{margin:0;font-size:1.5rem;line-height:1.2;}
  .titleband .sub{display:block;font-size:1.05rem;font-weight:400;margin-top:2px;}
  .where{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:0.95rem;}
  .phase{
    background:var(--pazapa-grey-dark);color:#fff;border-radius:999px;
    padding:2px 12px;font-weight:700;font-size:0.9rem;
  }
  .dots{display:inline-flex;gap:6px;}
  .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--pazapa-grey-dark);background:transparent;}
  .dot.on{background:var(--pazapa-grey-dark);}
  main{
    background:var(--white);
    border-radius:0 0 16px 16px;
    padding:22px 20px 26px;
    min-height:420px;
  }
  .screen h2{font-size:1.4rem;line-height:1.25;margin:0 0 8px;}
  .screen h2:focus{outline:none;}
  .screen h3{font-size:1.1rem;margin:0 0 8px;}
  p{margin:0 0 12px;}
  .split{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;margin-bottom:12px;}
  .illu{display:block;width:100%;max-width:220px;height:auto;margin:0 auto;border-radius:14px;}
  .illu.small{max-width:150px;}
  @media (max-width:640px){
    .split{grid-template-columns:1fr;}
    main{padding:18px 14px 22px;}
  }
  ol.route{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:10px 0 0;padding:0;counter-reset:r;}
  ol.route li{
    counter-increment:r;
    background:var(--blue-tint);border-radius:999px;padding:4px 14px;font-weight:600;
  }
  ol.route li::before{content:counter(r) ". ";}
  fieldset{border:0;margin:0 0 16px;padding:0;min-width:0;}
  legend{font-weight:700;font-size:1.05rem;padding:0;margin-bottom:8px;}
  .choice{
    display:flex;align-items:center;gap:12px;
    min-height:48px;padding:10px 14px;margin:0 0 10px;
    border:2px solid var(--line);border-radius:12px;background:var(--white);
    cursor:pointer;touch-action:manipulation;
  }
  .choice input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--pazapa-grey-dark);}
  .choice:hover{background:var(--blue-tint);}
  .choice:has(input:checked){background:var(--blue-tint);border-color:var(--pazapa-grey-dark);}
  .choice input:checked + .ctext{font-weight:700;}
  .choice.is-off{opacity:.6;cursor:not-allowed;}
  .tag{
    display:inline-block;margin-left:8px;padding:0 10px;border-radius:999px;
    background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);font-size:0.85rem;font-weight:700;
  }
  .fb{
    margin:0 0 12px;padding:10px 12px;border-left:6px solid transparent;border-radius:8px;
    font-size:0.98rem;
  }
  .fb:empty{display:none;}
  .fb.ok{background:var(--green-tint);border-left-color:var(--pazapa-green);}
  .fb.warn{background:var(--yellow-tint);border-left-color:var(--pazapa-yellow);}
  .task{
    border:2px solid var(--pazapa-grey-light);border-radius:14px;padding:14px 14px 4px;margin-bottom:16px;
  }
  .task > h3{margin-bottom:10px;}
  .pic-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .pic-row .illu{max-width:130px;margin:0;}
  .pic-row fieldset{flex:1 1 220px;}
  .hintbox{background:var(--yellow-tint);border-radius:12px;padding:10px 14px;margin:0 0 12px;}
  .hintbox ol{margin:0;padding-left:20px;}
  .hintbox li{margin:4px 0;}
  .btn{
    font-family:inherit;font-size:1rem;font-weight:700;
    min-height:48px;min-width:48px;padding:0 22px;border-radius:12px;
    border:2px solid var(--pazapa-grey-dark);color:var(--pazapa-grey-dark);
    background:var(--white);cursor:pointer;touch-action:manipulation;
  }
  .btn.primary{background:var(--pazapa-blue);}
  .btn.hint{background:var(--yellow-tint);border-color:var(--pazapa-grey-dark);}
  .btn:hover:not(:disabled){filter:brightness(0.96);}
  .btn:disabled{
    background:var(--pazapa-grey-light);color:#575755;border-color:#8A8A88;cursor:not-allowed;
  }
  .btn.done-ok{background:var(--pazapa-green);}
  .chip{
    font-family:inherit;font-size:1rem;min-height:48px;padding:6px 16px;border-radius:999px;
    border:2px solid var(--line);background:var(--white);color:var(--pazapa-grey-dark);
    cursor:pointer;touch-action:manipulation;text-align:left;
  }
  .chip:hover{background:var(--blue-tint);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;
    box-shadow:0 0 0 6px var(--pazapa-yellow);
  }
  .choice:has(input:focus-visible){box-shadow:0 0 0 3px var(--pazapa-yellow);}
  .choice input:focus-visible{box-shadow:none;}
  textarea{
    width:100%;min-height:120px;font-family:inherit;font-size:1rem;line-height:1.5;
    padding:10px 12px;border:2px solid var(--line);border-radius:10px;color:var(--pazapa-grey-dark);
    resize:vertical;
  }
  label.lbl{display:block;font-weight:700;margin-bottom:6px;}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
  .need{font-size:0.92rem;margin:10px 0 0;}
  .panel{border-radius:14px;padding:14px 16px;margin:0 0 16px;}
  .panel.blue{background:var(--blue-tint);}
  .panel.green{background:var(--green-tint);}
  .panel.yellow{background:var(--yellow-tint);}
  .panel.grey{background:var(--pazapa-grey-light);}
  .quote{font-weight:600;}
  .readonly{white-space:pre-wrap;word-wrap:break-word;margin:0;background:var(--white);border:2px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:56px;}
  .strengths{list-style:none;margin:0 0 8px;padding:0;}
  .strengths li{padding:4px 0 4px 26px;position:relative;}
  .strengths li::before{content:"\2713";position:absolute;left:2px;font-weight:700;}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:640px){.cmp{grid-template-columns:1fr;}}
  .bank-group{margin:0 0 10px;}
  .bank-group b{display:block;margin-bottom:4px;}
  .bank-group ul{margin:0;padding-left:20px;}
  .rec-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px;}
  .rec-status{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--pazapa-grey-light);}
  .rec-status.warn{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .tick{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 0 12px;cursor:pointer;}
  .tick input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--pazapa-grey-dark);}
  .found{display:block;font-size:0.88rem;font-weight:600;margin-top:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important;}}
</style>
</head>

}

/* ============ LMS (SCORM 1.2 / 2004), silent ============ */
var lms = {api:null, ver:"", init:false, ended:false};
function findApiFrom(win){
  var hops = 0;
  while (win && hops < 12){
    try { if (win.API_1484_11) return {api:win.API_1484_11, ver:"2004"}; } catch(e){}
    try { if (win.API) return {api:win.API, ver:"1.2"}; } catch(e){}
    var next = null;
    try { next = (win.parent && win.parent !== win) ? win.parent : null; } catch(e){ next = null; }
    if (!next) break;
    win = next; hops++;
  }
  return null;
}
function ensureApi(){
  if (lms.api && lms.init) return true;
  var found = null;
  try { found = findApiFrom(window); } catch(e){}
  if (!found){ try { if (window.opener) found = findApiFrom(window.opener); } catch(e){} }
  if (!found) return false;
  try {
    var ok;
    if (found.ver === "2004") ok = found.api.Initialize("");
    else ok = found.api.LMSInitialize("");
    lms.api = found.api; lms.ver = found.ver; lms.init = true;
    return true;
  } catch(e){ return false; }
}
function lmsGet(k){
  try { return String(lms.ver === "2004" ? lms.api.GetValue(k) : lms.api.LMSGetValue(k)); } catch(e){ return ""; }
}
function lmsSet(k, v){
  try { var r = (lms.ver === "2004") ? lms.api.SetValue(k, v) : lms.api.LMSSetValue(k, v); return String(r) !== "false"; } catch(e){ return false; }
}
function lmsCommit(){
  try { var r = (lms.ver === "2004") ? lms.api.Commit("") : lms.api.LMSCommit(""); return String(r) !== "false"; } catch(e){ return false; }
}
function lmsAlreadyDone(){
  if (!lms.api) return false;
  if (lms.ver === "2004"){
    var c = lmsGet("cmi.completion_status"), s = lmsGet("cmi.success_status");
    return c === "completed" || s === "passed";
  }
  var ls = lmsGet("cmi.core.lesson_status");
  return ls === "completed" || ls === "passed";
}
function lmsSaveProgress(data){
  if (!ensureApi()) return;
  lmsSet("cmi.suspend_data", data);
  lmsCommit();
}
function lmsLoadProgress(){
  if (!ensureApi()) return "";
  var d = lmsGet("cmi.suspend_data");
  return (d && d !== "undefined") ? d : "";
}
function activityCompleted(){
  if (completionSent) return true;
  if (!(state.screen === 7 && maxScreen() === 7)) return false;
  var ok = false;
  if (ensureApi()){
    if (lmsAlreadyDone()){
      ok = true;                       /* never downgrade completed or passed */
    } else {
      var key = (lms.ver === "2004") ? "cmi.completion_status" : "cmi.core.lesson_status";
      var set = lmsSet(key, "completed");
      var committed = lmsCommit();
      var back = lmsGet(key);
      ok = set && committed && (back === "completed" || back === "passed" || back === "");
    }
  } else {
    ok = true;                         /* standalone use */
  }
  lsSet(DONE_KEY, "1");
  if (ok){
    completionSent = true;
    try { console.log("W14D3 Review Improve Retry completed"); } catch(e){}
  }
  return ok;
}
function lmsTerminate(){
  if (!lms.api || !lms.init || lms.ended) return;
  try { lmsCommit(); if (lms.ver === "2004") lms.api.Terminate(""); else lms.api.LMSFinish(""); lms.ended = true; } catch(e){}
}

/* ============ optional recorder (audio stays in memory only) ============ */
var recorders = [];
function recSupported(){
  return !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function" && typeof window.MediaRecorder !== "undefined");
}
function pickMime(){
  var c = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  try { for (var i = 0; i < c.length; i++){ if (window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } } catch(e){}
  return "";
}
function Recorder(host){
  var self = this;
  this.host = host; this.state = "idle"; this.err = ""; this.url = "";
  this.stream = null; this.mr = null; this.chunks = []; this.audio = null; this.timer = null; this.mime = "";
  host.textContent = "";
  var row = el("div", {"class":"rec-row"});
  this.bStart = el("button", {type:"button","class":"btn primary"});
  this.bStop  = el("button", {type:"button","class":"btn secondary"});
  this.bPlay  = el("button", {type:"button","class":"btn secondary"});
  this.bAgain = el("button", {type:"button","class":"btn secondary"});
  this.bStart.setAttribute("data-i18n","rec.start"); this.bStop.setAttribute("data-i18n","rec.stop");
  this.bPlay.setAttribute("data-i18n","rec.play");   this.bAgain.setAttribute("data-i18n","rec.again");
  [this.bStart,this.bStop,this.bPlay,this.bAgain].forEach(function(b){ row.appendChild(b); });
  this.status = el("p", {"class":"rec-status", role:"status", "aria-live":"polite"});
  host.appendChild(row); host.appendChild(this.status);
  this.bStart.addEventListener("click", function(){ self.start(); });
  this.bStop.addEventListener("click", function(){ self.stop(); });
  this.bPlay.addEventListener("click", function(){ self.play(); });
  this.bAgain.addEventListener("click", function(){ self.discard(); });
  recorders.push(this);
  translateIn(host);
  this.render();
}
Recorder.prototype.render = function(){
  var s = this.state;
  var keys = {idle:"rec.idle", requesting:"rec.requesting", recording:"rec.recording", ready:"rec.ready", playing:"rec.playing", played:"rec.played"};
  var key = (s === "error") ? this.err : keys[s];
  this.status.textContent = t(key);
  this.status.className = "rec-status" + (s === "error" ? " warn" : "");
  var busy = (s === "requesting" || s === "recording");
  this.bStart.disabled = busy || s === "playing";
  this.bStop.disabled = s !== "recording";
  this.bPlay.disabled = !(this.url && (s === "ready" || s === "played"));
  this.bAgain.disabled = (s === "idle" || busy);
};
Recorder.prototype.setState = function(s, err){ this.state = s; this.err = err || ""; this.render(); };
Recorder.prototype.releaseTracks = function(){
  try { if (this.stream) this.stream.getTracks().forEach(function(tr){ try { tr.stop(); } catch(e){} }); } catch(e){}
  this.stream = null;
};
Recorder.prototype.revoke = function(){
  if (this.audio){ try { this.audio.pause(); } catch(e){} this.audio = null; }
  if (this.url){ try { URL.revokeObjectURL(this.url); } catch(e){} this.url = ""; }
};
Recorder.prototype.discard = function(){
  this.stopQuiet(); this.revoke(); this.chunks = []; this.setState("idle");
};
Recorder.prototype.stopQuiet = function(){
  clearTimeout(this.timer);
  try { if (this.mr && this.mr.state !== "inactive"){ this.mr.onstop = null; this.mr.stop(); } } catch(e){}
  this.mr = null; this.releaseTracks();
};
Recorder.prototype.destroy = function(){ this.stopQuiet(); this.revoke(); };
Recorder.prototype.start = function(){
  var self = this;
  if (!recSupported()){ this.setState("error", "rec.err.unsupported"); return; }
  this.revoke(); this.chunks = [];
  this.setState("requesting");
  var p;
  try { p = navigator.mediaDevices.getUserMedia({audio:true}); } catch(e){ this.setState("error", "rec.err.fail"); return; }
  p.then(function(stream){
    self.stream = stream;
    try {
      self.mime = pickMime();
      self.mr = self.mime ? new window.MediaRecorder(stream, {mimeType:self.mime}) : new window.MediaRecorder(stream);
    } catch(e){ self.releaseTracks(); self.setState("error", "rec.err.fail"); return; }
    self.mr.ondataavailable = function(ev){ if (ev.data && ev.data.size > 0) self.chunks.push(ev.data); };
    self.mr.onerror = function(){ self.stopQuiet(); self.setState("error", "rec.err.fail"); };
    self.mr.onstop = function(){
      self.releaseTracks();
      var type = self.mime || (self.chunks[0] && self.chunks[0].type) || "audio/webm";
      var blob = new Blob(self.chunks, {type:type});
      if (!blob.size){ self.setState("error", "rec.err.empty"); return; }
      try { self.url = URL.createObjectURL(blob); } catch(e){ self.setState("error", "rec.err.fail"); return; }

    };
    try { self.mr.start(); } catch(e){ self.stopQuiet(); self.setState("error", "rec.err.fail"); return; }
    self.setState("recording");

    var n = e && e.name;
    if (n === "NotAllowedError" || n === "SecurityError" || n === "PermissionDeniedError") self.setState("error", "rec.err.denied");

};
Recorder.prototype.stop = function(){

Recorder.prototype.play = function(){
  var self = this;
  if (!this.url) return;
  try {
    if (this.audio){ this.audio.pause(); }
    this.audio = new Audio(this.url);
    this.audio.onended = function(){ self.setState("played"); };
    this.setState("playing");

};

  order.forEach(function(k){ PHRASES[k].forEach(function(p){ if (!seen[p]){ seen[p] = 1; list.push(p); } }); });
  buildChips($("sChips"), list, $("sText"));
  applySRoute();
  updateSCheck(!!state.sText.trim()); updateCompareBtn();
}
function applySRoute(){
  var speak = state.sMode === "speak";
  $("sWritePanel").hidden = speak;
  $("sSpeakPanel").hidden = !speak;
  if (!speak && rec2) rec2.stopQuiet();
}
function updateSCheck(show){
  var box = $("sCheck");
  var tx = $("sText").value;
  if (!show){ if (!tx.trim()){ setFb(box, "", t("chk.empty")); box.className = "fb"; } return; }
  if (!state.focus.length) return;
  var f = state.first;
  if (!tx.trim()){ setFb(box, "", t("chk.empty")); return; }
  if (f.m === "write" && core(tx) === core(f.t)){ setFb(box, "warn", t("chk.same")); return; }
  var sf = analyze(tx);
  var missing = state.focus.filter(function(k){ return !sf[k]; });
  if (missing.length){ setFb(box, "warn", t("chk.try", {p: FOCUS_PHRASE[missing[0]]})); return; }
  setFb(box, "ok", t("chk.ok", {x: listJoin(state.focus.map(function(k){ return t("featn."+k); }))}));
}
function updateCompareBtn(){
  var ok = secondOk();
  $("compareBtn").disabled = !ok;
  $("compareNeed").hidden = ok;
}

/* --- screen 6 --- */
function detectImproved(){
  var f = state.first;
  var out = {purpose:false, info:false, phrase:false, polite:false};
  if (state.sMode !== "write") return out;
  var sf = analyze(state.sText);
  var ff = f.m === "write" ? analyze(f.t) : {response:false,opinion:false,question:false,closing:false};
  out.purpose = sf.response && !ff.response;
  out.info = (sf.opinion && !ff.opinion) || (sf.question && !ff.question);
  out.polite = sf.closing && !ff.closing;
  var pf = f.m === "write" ? phrasesUsed(f.t) : [];
  out.phrase = phrasesUsed(state.sText).some(function(i){ return pf.indexOf(i) < 0; });
  return out;
}
function newlyPresent(){
  var f = state.first;
  var sf = analyze(state.sText);
  var ff = f.m === "write" ? analyze(f.t) : {response:false,opinion:false,question:false,closing:false};
  return FEATS.filter(function(k){ return sf[k] && !ff[k]; });
}
function renderS6(){
  var f = state.first;
  $("s6First").textContent = f.m === "speak" ? t("s6.spokenCard") : f.t;
  $("s6First").setAttribute("lang", f.m === "speak" ? (lang === "fr" ? "fr" : "en-GB") : "en-GB");
  $("s6Second").textContent = state.sMode === "speak" ? t("s6.spokenCard") : state.sText;
  $("s6Second").setAttribute("lang", state.sMode === "speak" ? (lang === "fr" ? "fr" : "en-GB") : "en-GB");
  var msg;
  if (state.sMode === "speak") msg = t("s6.sumSpoken");
  else if (f.m === "speak"){
    var have = FEATS.filter(function(k){ return analyze(state.sText)[k]; });
    msg = have.length ? t("s6.sumWrote", {x: listJoin(have.map(function(k){ return t("featn."+k); }))}) : t("s6.sumSame");
  } else {
    var nw = newlyPresent();
    msg = nw.length ? t("s6.sum", {x: listJoin(nw.map(function(k){ return t("featn."+k); }))}) : t("s6.sumSame");
  }
  setFb($("s6Summary"), "ok", "✓ " + msg);
  var det = detectImproved();
  var host = $("improvedHost"); host.textContent = "";
  IMPROVED_KEYS.forEach(function(k){
    var lab = el("label", {"class":"choice"});
    var inp = el("input", {type:"checkbox", value:k});
    inp.checked = state.improved.indexOf(k) > -1;
    var sp = el("span", {"class":"ctext"}, t("s6.o."+k));
    if (det[k]){ sp.appendChild(el("span", {"class":"found"}, t("s6.found"))); }
    lab.appendChild(inp); lab.appendChild(sp);
    inp.addEventListener("change", function(){
      state.improved = IMPROVED_KEYS.filter(function(x){ var b = host.querySelector('input[value="'+x+'"]'); return b && b.checked; });
      updateFinishBtn(); save();
    });
    host.appendChild(lab);
  });
  updateFinishBtn();
}
function updateFinishBtn(){
  var ok = reflectOk() && secondOk();
  $("finishBtn").disabled = !ok;
  $("finishNeed").hidden = ok;
}

/* --- screen 7 --- */
function updateDone(){
  var allowed = state.screen === 7 && maxScreen() === 7;
  var b = $("doneBtn");
  if (doneShown){
    b.disabled = true; b.classList.add("done-ok"); b.textContent = t("s7.doneOk");
  } else {
    b.classList.remove("done-ok"); b.textContent = t("s7.done");
    b.disabled = !allowed;
  }
}

/* ============ navigation ============ */
var screenIds = ["s1","s2","s3","s4","s5","s6","s7"];
function renderScreen(n){
  if (n === 1) renderGoal();
  if (n === 2) renderRecall();
  if (n === 3) renderS3();
  if (n === 4) renderS4();
  if (n === 5) renderS5();
  if (n === 6) renderS6();
  if (n === 7) updateDone();
}
function go(n, moveFocus){
  var cap = maxScreen();
  if (n > cap) n = cap;
  if (n < 1) n = 1;
  recorders.forEach(function(r){ r.stopQuiet(); if (r.state === "recording" || r.state === "requesting") r.setState("idle"); });
  state.screen = n;
  screenIds.forEach(function(id, i){ $(id).hidden = (i + 1 !== n); });
  Array.prototype.forEach.call(DOTS.children, function(d, i){ d.classList.toggle("on", i < n); });
  $("phaseChip").textContent = t("phase." + n);
  $("screenCount").textContent = t("screenOf", {n:n});
  renderScreen(n);
  translateIn($(screenIds[n-1]));
  updateDone();
  save(true);
  if (moveFocus){
    var h = $("h-s" + n);
    if (h){ try { h.focus({preventScroll:true}); } catch(e){ h.focus(); } }
    try { window.scrollTo(0, 0); } catch(e){}
    announce(h ? h.textContent : "");
  }
}

/* ============ language ============ */
function applyLang(){
  document.documentElement.setAttribute("lang", lang === "fr" ? "fr" : "en-GB");
  document.title = t("title") + " - " + t("sub");
  var b = $("langBtn");
  b.textContent = t("langBtn");
  b.setAttribute("aria-label", t("langAria"));
  b.setAttribute("lang", lang === "fr" ? "en" : "fr");
  translateIn(document);
  $("phaseChip").textContent = t("phase." + state.screen);
  $("screenCount").textContent = t("screenOf", {n:state.screen});
  recorders.forEach(function(r){ r.render(); });
  renderScreen(state.screen);
  translateIn($(screenIds[state.screen-1]));
  updateDone();
}
$("langBtn").addEventListener("click", function(){
  lang = (lang === "en") ? "fr" : "en";
  lsSet(LANG_KEY, lang);
  applyLang();
  announce(lang === "fr" ? "Français" : "English");
});

/* ============ events ============ */
$("startBtn").addEventListener("click", function(){ if (goalOk()) go(2, true); });
$("goalAgain").addEventListener("click", function(){
  state.goal = ""; goalOrder = shuffle(["a","b","c"]); renderGoal(); save(true);
  var i = $("goalHost").querySelector("input"); if (i) i.focus();
});
$("recallAgain").addEventListener("click", function(){
  state.recall = {}; state.hints = [0,0,0];
  newOrders(); renderRecall(); save(true);
  announce(t("s2.h"));
  var f = $("fs-a1"); if (f){ var i = f.querySelector("input"); if (i) i.focus(); }
});
$("recallNext").addEventListener("click", function(){ if (recallOk()) go(3, true); });

$("fRouteWrite").addEventListener("change", function(){ state.fMode = "write"; applyFRoute(); updateS3Btn(); save(); });
$("fRouteSpeak").addEventListener("change", function(){ state.fMode = "speak"; applyFRoute(); updateS3Btn(); save(); });
$("fText").addEventListener("input", function(){ state.fText = this.value; updateFLong(); updateS3Btn(); save(); });
$("fClear").addEventListener("click", function(){ $("fText").value = ""; state.fText = ""; updateFLong(); updateS3Btn(); save(); $("fText").focus(); });
$("fSpoken").addEventListener("change", function(){ state.fSpoken = this.checked; updateS3Btn(); save(); });
$("reviewBtn").addEventListener("click", function(){
  var snap = currentFirst();
  if (!firstAttemptOk(snap)) return;
  var prev = state.first;
  if (!prev || prev.m !== snap.m || prev.t !== snap.t || prev.sp !== snap.sp) invalidateFromFirst();
  state.first = snap;
  go(4, true);
});

$("s4HintBtn").addEventListener("click", function(){
  if (state.s4Hint < 2){ state.s4Hint++; renderS4Hint(); save(); announce($("s4HintList").lastChild.textContent); }
});
$("s4ExBtn").addEventListener("click", function(){
  state.model = !state.model;
  $("s4Example").hidden = !state.model;
  this.textContent = state.model ? t("s4.exHide") : t("s4.ex");
  save();
});
$("makeBtn").addEventListener("click", function(){ if (focusOk()) go(5, true); });

$("sRouteWrite").addEventListener("change", function(){ state.sMode = "write"; applySRoute(); updateCompareBtn(); updateSCheck(true); save(); });
$("sRouteSpeak").addEventListener("change", function(){ state.sMode = "speak"; applySRoute(); updateCompareBtn(); save(); });
function onSecondChanged(announceCheck){
  state.sText = $("sText").value;
  state.improved = [];
  updateCompareBtn();
  if (announceCheck) updateSCheck(true);
  save();
}
$("sText").addEventListener("input", function(){ onSecondChanged(false); });
$("sText").addEventListener("change", function(){ onSecondChanged(true); });
$("sCopy").addEventListener("click", function(){
  var f = state.first;
  if (f && f.m === "write"){ $("sText").value = f.t; onSecondChanged(true); }
  $("sText").focus();
});
$("sSpoken").addEventListener("change", function(){ state.sSpoken = this.checked; state.improved = []; updateCompareBtn(); save(); });
$("compareBtn").addEventListener("click", function(){ if (secondOk()) go(6, true); });
$("finishBtn").addEventListener("click", function(){ if (reflectOk() && secondOk()) go(7, true); });

$("doneBtn").addEventListener("click", function(){
  if (this.disabled) return;
  if (!(state.screen === 7 && maxScreen() === 7)) return;
  activityCompleted();
  doneShown = true;
  updateDone();
  announce(t("s7.h"));
});
$("againBtn").addEventListener("click", function(){
  cleanupRecorders();
  state = freshState();
  doneShown = false;
  newOrders();
  lsDel(KEY);
  $("fText").value = ""; $("sText").value = "";
  if (rec1) rec1.discard(); if (rec2) rec2.discard();
  lmsSaveProgress(pack());
  go(1, true);
});

/* ============ cleanup on leave ============ */
window.addEventListener("pagehide", function(){ cleanupRecorders(); save(true); lmsTerminate(); });
window.addEventListener("beforeunload", function(){ cleanupRecorders(); });

/* ============ init ============ */
(function init(){
  var savedLang = lsGet(LANG_KEY);
  if (savedLang === "fr" || savedLang === "en") lang = savedLang;
  newOrders();
  rec1 = new Recorder($("rec1"));
  rec2 = new Recorder($("rec2"));
  var lmsData = lmsLoadProgress();
  if (lsGet(DONE_KEY) === "1" && (!lms.api || lmsAlreadyDone())) completionSent = true;
  var loaded = unpack(lmsData) || unpack(lsGet(KEY));
  if (loaded) state = loaded;
  state.screen = Math.min(state.screen, maxScreen());
  // keep the typed text areas in step with restored state
  $("fText").value = state.fText; $("sText").value = state.sText;
  applyLang();
  go(state.screen, false);
})();

})();
</script>
</body>
</html>
