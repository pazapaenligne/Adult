<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Understanding school messages - Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --red-tint:#FDEBE9;
  --ink:#2E2E2D;
  --radius:16px;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  font-size:1rem;
  line-height:1.55;
  color:var(--ink);
  background:var(--pazapa-grey-light);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;line-height:1.25;margin:0 0 10px;}
h1{font-size:1.55rem;}
h2{font-size:1.4rem;}
h3{font-size:1.1rem;}
p{margin:0 0 12px;}
.app{max-width:860px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column;}
.topband{height:12px;background:var(--pazapa-blue);}
.topband::after{content:"";display:block;width:84px;height:12px;background:var(--pazapa-red);}
header.top{padding:18px 20px 12px;}
.kicker{font-size:.9rem;font-weight:700;margin:0 0 4px;}
.sub{margin:0 0 12px;font-weight:600;}
.head-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;}
.progress{display:flex;align-items:center;gap:10px;flex:1 1 220px;}
.bar{flex:1;height:12px;background:var(--pazapa-grey-light);border-radius:8px;overflow:hidden;}
.bar>div{height:100%;background:var(--pazapa-blue);width:0;transition:width .3s ease;}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none;}*{scroll-behavior:auto !important;}}
.ptext{font-size:.9rem;white-space:nowrap;margin:0;}
main{flex:1;padding:8px 20px 28px;}
.screen{display:block;}
.fr{display:none;}
body.fr-on .fr{display:block;margin-top:3px;padding-left:10px;border-left:4px solid var(--pazapa-yellow);font-size:.92em;font-weight:500;}
body.fr-on .btn .fr{border-left:0;padding-left:0;font-size:.85em;margin-top:0;}
body.fr-on legend .fr{display:block;}
.btn{
  min-height:48px;min-width:48px;padding:11px 22px;border-radius:12px;
  font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;
  touch-action:manipulation;border:2px solid var(--pazapa-blue);color:var(--ink);background:#fff;
  text-align:center;
}
.btn.primary{background:var(--pazapa-blue);border-color:var(--pazapa-blue);color:var(--ink);}
.btn.secondary{background:#fff;border-color:var(--pazapa-grey-dark);}
.btn:disabled{background:var(--pazapa-grey-light);border-color:#BDBDBB;color:#5A5A58;cursor:not-allowed;}
.btn.small{min-height:48px;padding:8px 16px;font-weight:600;}
.btn:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 5px #fff;
}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center;background:var(--yellow-tint);border-radius:22px;padding:20px;margin:8px 0 18px;}
@media (max-width:640px){.hero{grid-template-columns:1fr;}}
.lead{font-size:1.05rem;}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tile{margin:0;border-radius:14px;padding:6px 4px;text-align:center;font-size:.78rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;}
.tile img{width:100%;height:84px;object-fit:contain;display:block;}
.t0{background:var(--blue-tint);}.t1{background:var(--green-tint);}.t2{background:#fff;}.t3{background:var(--red-tint);}
fieldset.group{border:2px solid var(--pazapa-grey-light);border-radius:var(--radius);padding:12px 14px 14px;margin:14px 0;min-width:0;}
legend{font-weight:700;padding:0 6px;}
.opt{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:10px 12px;margin:8px 0;border:2px solid var(--pazapa-blue);border-radius:12px;background:#fff;cursor:pointer;touch-action:manipulation;}
.opt input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--pazapa-grey-dark);}
.opt.on{background:var(--blue-tint);border-width:3px;padding:9px 11px;}
.status{display:flex;gap:8px;align-items:flex-start;margin:8px 0;min-height:1.5em;}
.status:empty{display:none;}
.status.ok{background:var(--green-tint);border-left:6px solid var(--pazapa-green);padding:8px 10px;border-radius:8px;}
.status.try{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);padding:8px 10px;border-radius:8px;}
.status.info{background:var(--blue-tint);border-left:6px solid var(--pazapa-blue);padding:8px 10px;border-radius:8px;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-weight:800;flex:none;background:#fff;border:2px solid var(--pazapa-grey-dark);font-size:.85rem;}
.card{background:var(--blue-tint);border-radius:var(--radius);padding:14px 16px;margin:14px 0;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.task{border:2px solid var(--pazapa-grey-light);border-radius:var(--radius);padding:14px 16px;margin:14px 0;}
.rowline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0;}
.rowline label,.rowline .wd{font-weight:700;min-width:110px;}
select{min-height:48px;border:2px solid var(--pazapa-blue);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:1rem;background:#fff;color:var(--ink);max-width:100%;}
.hintbox{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:8px;padding:8px 12px;margin:8px 0;}
.hintbox:empty{display:none;}
.hintbox p{margin:4px 0;}
textarea{width:100%;min-height:130px;border:2px solid var(--pazapa-grey-dark);border-radius:12px;padding:12px;font-family:inherit;font-size:1rem;line-height:1.5;color:var(--ink);background:#fff;resize:vertical;}
textarea[readonly]{background:var(--pazapa-grey-light);}
.lbl{display:block;font-weight:700;margin:12px 0 6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-blue);background:#fff;font-family:inherit;font-size:1rem;cursor:pointer;touch-action:manipulation;color:var(--ink);}
.notice-wrap{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:center;margin:12px 0;}
@media (max-width:520px){.notice-wrap{grid-template-columns:1fr;}}
.notice{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;}
.notice dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;}
.notice dt{font-weight:700;}.notice dd{margin:0;}
.notice-title{color:var(--pazapa-red);font-weight:800;margin:0 0 4px;}
.notice-img{width:100%;max-height:200px;object-fit:contain;border-radius:12px;background:var(--yellow-tint);}
.mine{background:var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;margin:8px 0;white-space:pre-wrap;word-break:break-word;}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.compare{grid-template-columns:1fr;}}
.compare .card{margin:0;}
ul.plain{margin:6px 0 10px;padding-left:22px;}
ul.plain li{margin:4px 0;}
.navbar{padding:14px 20px 22px;border-top:2px solid var(--pazapa-grey-light);}
.final{display:flex;flex-wrap:wrap;gap:12px;}
.done-msg{margin-top:12px;}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.frbtn{min-height:48px;}
</style>
</head>
<body>
<div class="app">
  <div class="topband" aria-hidden="true"></div>
  <header class="top">
    <p class="kicker">Pazapa English Programme for Adults</p>
    <h1>Understanding school messages</h1>
    <p class="sub"><span class="en">Review, improve and retry</span><span class="fr" lang="fr">Réviser, améliorer et réessayer</span></p>
    <div class="head-row">
      <div class="progress">
        <div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" id="bar"><div id="barFill"></div></div>
        <p class="ptext" id="ptext"></p>
      </div>
      <button type="button" class="btn secondary frbtn" id="frBtn" aria-pressed="false"><span id="frBtnText">Voir en français</span></button>
    </div>
  </header>

  <main id="main">
    <section class="screen" id="s0" data-i="0" aria-labelledby="h-0"></section>
    <section class="screen" id="s1" data-i="1" aria-labelledby="h-1" hidden></section>
    <section class="screen" id="s2" data-i="2" aria-labelledby="h-2" hidden></section>
    <section class="screen" id="s3" data-i="3" aria-labelledby="h-3" hidden></section>
    <section class="screen" id="s4" data-i="4" aria-labelledby="h-4" hidden></section>
    <section class="screen" id="s5" data-i="5" aria-labelledby="h-5" hidden></section>
    <section class="screen" id="s6" data-i="6" aria-labelledby="h-6" hidden></section>
  </main>

  <div class="navbar" role="group" aria-label="Activity buttons">
    <button type="button" class="btn primary" id="nextBtn"></button>
    <div class="final" id="finalRow" hidden>
      <button type="button" class="btn secondary" id="tryAllBtn"><span class="en">Try again</span><span class="fr" lang="fr">Réessayer</span></button>
      <button type="button" class="btn primary" id="doneBtn" disabled><span class="en">Done</span><span class="fr" lang="fr">Terminé</span></button>
    </div>
    <p class="status done-msg" id="doneMsg" role="status"></p>
  </div>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
function bi(en, fr){ return '<span class="en">' + en + '</span><span class="fr" lang="fr">' + fr + '</span>'; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){
  return String(s || '').normalize('NFKC').replace(/[‘’ʼ`´]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim().toLowerCase();
}
function normCmp(s){ return norm(s).replace(/[.!?,;:\s]+$/, ''); }
function wc(s){ var n = norm(s); return n ? n.split(' ').length : 0; }
function shuffle(a){
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
function hash(s){ var h = 5381; for (var i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }
function announce(msg){ var l = $('live'); l.textContent = ''; setTimeout(function(){ l.textContent = msg; }, 30); }
function setStatus(el, kind, en, fr){
  if (!el) return;
  if (!kind){ el.className = 'status'; el.innerHTML = ''; return; }
  el.className = 'status ' + kind;
  var mark = kind === 'ok' ? '✓' : (kind === 'try' ? '!' : 'i');
  el.innerHTML = '<span class="badge" aria-hidden="true">' + mark + '</span><span>' + bi(en, fr) + '</span>';
}
function joinList(items, andWord){
  if (items.length <= 1) return items.join('');
  return items.slice(0, -1).join(', ') + ' ' + andWord + ' ' + items[items.length - 1];
}

var DAYS = '(monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|next week)';
function features(t){
  var s = norm(t), f = {};
  f.purpose = /\b(school trip|trip|meeting|absent|absence|permission|homework|uniform|form|notice|message)\b/.test(s);
  f.day = new RegExp('\\b' + DAYS + '\\b').test(s);
  f.bring = /\b(lunch|packed lunch|uniform|homework|bag|snack|water|food|pencil|book)\b/.test(s);
  f.deadline = new RegExp('\\bdeadline\\b|\\bby\\s+(the\\s+)?' + DAYS + '\\b|\\bbefore\\s+' + DAYS + '\\b|\\bby\\s+the\\s+end\\b').test(s);
  f.question = /\?/.test(s) || /\b(what time|where should|where is|when is|when does|who should|can i|could i|how do i)\b/.test(s);
  f.polite = /\b(thank you|thanks|many thanks|kind regards|regards|best wishes|sincerely)\b/.test(s);
  f.info = (f.day ? 1 : 0) + (f.bring ? 1 : 0) + (f.deadline ? 1 : 0);
  return f;
}
function suggestionList(f){
  var out = [];
  if (!f.purpose) out.push({key:'purpose', def:IMP.purpose});
  if (f.info < 3){
    var d = !f.deadline ? IMP.info_deadline : (!f.bring ? IMP.info_bring : IMP.info_day);
    out.push({key:'info', def:d});
  }
  if (!f.question) out.push({key:'phrase', def:IMP.phrase});
  if (!f.polite) out.push({key:'polite', def:IMP.polite});
  out = out.slice(0, 2);
  if (!out.length) out = [{key:'phrase', def:IMP.phrase},{key:'polite', def:IMP.polite}];
  return out;
}
function improved(key, f1, f2){
  if (key === 'purpose') return f2.purpose;
  if (key === 'info') return f2.info > f1.info || f2.info === 3;
  if (key === 'phrase') return f2.question;
  if (key === 'polite') return f2.polite;
  return false;
}

function str(v, n){ return typeof v === 'string' ? v.slice(0, n) : ''; }
function arrOf(v, allowed){ return Array.isArray(v) ? v.filter(function(x, i, a){ return allowed.indexOf(x) > -1 && a.indexOf(x) === i; }) : []; }
function restore(raw){
  try{
    var o = JSON.parse(raw);
    if (!o || o.v !== VERSION) return;
    var s = freshState();
    s.screen = Math.max(0, Math.min(LAST - 1, parseInt(o.screen, 10) || 0));
    s.fr = !!o.fr;
    s.goal = str(o.goal, 4);
    if (o.rc && typeof o.rc === 'object'){ Object.keys(s.rc).forEach(function(k){ s.rc[k] = str(o.rc[k], 80); }); }
    if (o.hints && typeof o.hints === 'object'){ ['a','b','c'].forEach(function(k){ s.hints[k] = Math.max(0, Math.min(2, parseInt(o.hints[k], 10) || 0)); }); }
    s.first = str(o.first, 350);
    s.second = str(o.second, 350);
    if (o.pairs && typeof o.pairs === 'object'){ ['p1','p2'].forEach(function(k){ var v = o.pairs[k]; s.pairs[k] = (v === 'good' || v === 'basic') ? v : ''; }); }
    s.improve = arrOf(o.improve, IMP_KEYS).slice(0, 2);
    s.improveH = str(o.improveH, 12);
    s.reflect = arrOf(o.reflect, IMP_KEYS);
    s.reflectH = str(o.reflectH, 12);
    s.model = !!o.model;
    s.spoken = !!o.spoken;

  }catch(e){}
}
function reflHash(){ return hash(normCmp(state.first) + '|' + normCmp(state.second) + '|' + state.improve.join(',')); }
function revalidate(){
  if (state.improveH !== hash(normCmp(state.first))){ state.improve = []; state.improveH = ''; }
  if (state.reflectH !== reflHash()){ state.reflect = []; state.reflectH = ''; }
}

/* ---------------- validation ---------------- */
function recallOk(){
  return A_ROWS.every(function(r){ return state.rc[r.k] === r.m; }) &&
    B_ROWS.every(function(r){ return state.rc[r.k] === r.ans; }) &&
    state.rc.c === C_TASK.ans;
}
function secondCheck(){
  var f1 = features(state.first), f2 = features(state.second);
  var distinct = normCmp(state.first) !== normCmp(state.second);
  var good = state.improve.filter(function(k){ return improved(k, f1, f2); });
  return {f1:f1, f2:f2, distinct:distinct, good:good, valid: distinct && wc(state.second) >= 2 && good.length >= 1};
}
function stepValid(i){
  switch(i){
    case 0: return state.goal === 'g';
    case 1: return recallOk();
    case 2: return wc(state.first) >= 2;
    case 3: return state.pairs.p1 === 'good' && state.pairs.p2 === 'good' && state.improve.length >= 1 && state.improveH === hash(normCmp(state.first));
    case 4: return secondCheck().valid;
    case 5: return state.reflect.length >= 1 && state.reflectH === reflHash();
    default: return false;
  }
}
function allValid(){ for (var i = 0; i <= 5; i++){ if (!stepValid(i)) return false; } return true; }
function reachable(){ for (var i = 0; i <= 5; i++){ if (!stepValid(i)) return i; } return 6; }

/* ---------------- LMS (silent) ---------------- */
var LMS = (function(){
  var api = null, ver = '', finished = false;
  function looksLike(o, v){ try{ return !!o && (v === '2004' ? typeof o.Initialize === 'function' : typeof o.LMSInitialize === 'function'); }catch(e){ return false; } }
  function scan(start){
    var w = start, n = 0;
    while (w && n < 10){
      try{ if (looksLike(w.API_1484_11, '2004')) return {a:w.API_1484_11, v:'2004'}; }catch(e){}
      try{ if (looksLike(w.API, '1.2')) return {a:w.API, v:'1.2'}; }catch(e){}
      var p = null;
      try{ p = w.parent; }catch(e){ p = null; }
      if (!p || p === w) break;
      w = p; n++;
    }
    return null;
  }
  function discover(){
    if (api) return true;
    var r = scan(window);
    if (!r){ try{ if (window.opener && !window.opener.closed) r = scan(window.opener); }catch(e){} }
    if (!r) return false;
    api = r.a; ver = r.v;
    try{ if (ver === '2004') api.Initialize(''); else api.LMSInitialize(''); }catch(e){}
    return true;
  }
  function get(k){ try{ return String(ver === '2004' ? api.GetValue(k) : api.LMSGetValue(k)); }catch(e){ return ''; } }
  function set(k, v){ try{ return String(ver === '2004' ? api.SetValue(k, v) : api.LMSSetValue(k, v)) !== 'false'; }catch(e){ return false; } }
  function commit(){ try{ return String(ver === '2004' ? api.Commit('') : api.LMSCommit('')) !== 'false'; }catch(e){ return false; } }
  function statusDone(){
    var s = ver === '2004' ? get('cmi.completion_status') : get('cmi.core.lesson_status');
    if (s === 'completed' || s === 'passed') return true;
    return ver === '2004' && get('cmi.success_status') === 'passed';
  }
  function localDone(){ try{ return localStorage.getItem(KEY + '_done') === '1'; }catch(e){ return false; } }
  return {
    discover: discover,
    isDone: function(){ return discover() ? statusDone() : localDone(); },
    readSuspend: function(){ return discover() ? get('cmi.suspend_data') : ''; },
    writeSuspend: function(s){ if (!discover()) return false; var ok = set('cmi.suspend_data', s); commit(); return ok; },
    complete: function(){
      if (!discover()){ try{ localStorage.setItem(KEY + '_done', '1'); }catch(e){} return true; }
      if (statusDone()) return true;               /* never downgrade or rewrite */
      for (var t = 0; t < 2; t++){
        set(ver === '2004' ? 'cmi.completion_status' : 'cmi.core.lesson_status', 'completed');
        commit();
        if (statusDone()) return true;
      }
      return false;
    },
    finish: function(){
      if (!api || finished) return;
      finished = true;
      try{ if (ver === '2004') api.Terminate(''); else api.LMSFinish(''); }catch(e){}
    }
  };
})();

function activityCompleted(){
  if (completionSent) return true;
  var ok = false;
  try{ ok = LMS.complete(); }catch(e){ ok = false; }
  if (ok){ completionSent = true; console.log('W12D1 Review Improve Retry completed'); }
  return ok;
}

/* ---------------- saving ---------------- */
var saveT = null;
function serialize(){
  var s = JSON.parse(JSON.stringify(state));
  s.screen = Math.min(s.screen, LAST - 1);
  var out = JSON.stringify(s);
  if (out.length > 3800){ s.first = s.first.slice(0, 200); s.second = s.second.slice(0, 200); out = JSON.stringify(s); }
  return out.length > 3800 ? '' : out;
}
function flush(){
  var out = serialize();
  if (!out) return;
  try{
    if (LMS.discover()){ LMS.writeSuspend(out); }
    else { localStorage.setItem(KEY, out); }
  }catch(e){}
}
function save(){ clearTimeout(saveT); saveT = setTimeout(flush, 350); }

/* ---------------- optional recorder (local only) ---------------- */
var recorders = [];
function destroyRecorders(){ recorders.forEach(function(r){ r.destroy(); }); recorders = []; }
function makeRecorder(host, legendEn, legendFr){
  host.innerHTML =
    '<fieldset class="group"><legend>' + bi(legendEn, legendFr) + '</legend>' +
    '<div class="row">' +
    '<button type="button" class="btn secondary" data-a="rec">' + bi('Record','Enregistrer') + '</button>' +
    '<button type="button" class="btn secondary" data-a="stop" disabled>' + bi('Stop','Arrêter') + '</button>' +
    '<button type="button" class="btn secondary" data-a="play" disabled>' + bi('Hear my recording','Écouter mon enregistrement') + '</button>' +
    '<button type="button" class="btn secondary" data-a="again" disabled>' + bi('Try again','Réessayer') + '</button>' +
    '</div><div class="status" role="status" data-a="msg"></div></fieldset>';
  function q(a){ return host.querySelector('[data-a="' + a + '"]'); }
  var recB = q('rec'), stopB = q('stop'), playB = q('play'), againB = q('again'), msgEl = q('msg');
  var supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof window.MediaRecorder !== 'undefined');
  var stream = null, mr = null, chunks = [], url = null, audio = null, timer = null, st = 'idle', dead = false;
  function msg(kind, en, fr){ setStatus(msgEl, kind, en, fr); }
  function buttons(){
    recB.disabled = !supported || st === 'recording' || st === 'starting';
    stopB.disabled = st !== 'recording';
    playB.disabled = !url || st === 'recording' || st === 'starting';
    againB.disabled = (!url && st !== 'recording') || st === 'starting';
  }
  function stopTracks(){ if (stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} stream = null; } }
  function clearAudio(){
    if (audio){ try{ audio.pause(); }catch(e){} audio = null; }
    if (url){ try{ URL.revokeObjectURL(url); }catch(e){} url = null; }
  }
  function pickType(){
    var list = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    for (var i = 0; i < list.length; i++){ try{ if (MediaRecorder.isTypeSupported(list[i])) return list[i]; }catch(e){} }
    return '';
  }
  function failMsg(err){
    var n = err && err.name ? err.name : '';
    if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError')
      msg('info','The microphone is blocked. You can type or build your message instead.',"Le microphone est bloqué. Vous pouvez écrire ou construire votre message.");
    else if (n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError')
      msg('info','No microphone was found. You can type or build your message instead.',"Aucun microphone trouvé. Vous pouvez écrire ou construire votre message.");
    else
      msg('info','Recording did not work. You can type or build your message instead.',"L'enregistrement n'a pas marché. Vous pouvez écrire ou construire votre message.");
  }
  function finish(){
    stopTracks();
    var type = (mr && mr.mimeType) || 'audio/webm';
    var blob = new Blob(chunks, {type:type});
    chunks = []; mr = null;
    if (dead) return;
    if (blob.size < 500){ st = 'idle'; msg('info','Nothing was recorded. Press Record to try again.',"Rien n'a été enregistré. Appuyez sur Record pour réessayer."); buttons(); return; }
    url = URL.createObjectURL(blob);
    st = 'ready';
    msg('ok','Recording ready. Press Hear my recording.',"Enregistrement prêt. Appuyez sur Hear my recording.");
    state.spoken = true; save();
    buttons();
  }
  function start(){
    if (!supported || st === 'recording' || st === 'starting') return;
    clearAudio(); st = 'starting'; buttons();
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      if (dead){ s.getTracks().forEach(function(t){ t.stop(); }); return; }
      stream = s;
      try{
        var type = pickType();
        mr = type ? new MediaRecorder(stream, {mimeType:type}) : new MediaRecorder(stream);
        chunks = [];
        mr.ondataavailable = function(e){ if (e.data && e.data.size > 0) chunks.push(e.data); };
        mr.onstop = finish;
        mr.onerror = function(){ stopTracks(); st = 'idle'; failMsg(null); buttons(); };
        mr.start();
        st = 'recording';
        msg('info','Recording. Press Stop when you finish.',"Enregistrement en cours. Appuyez sur Stop quand vous avez fini.");
        timer = setTimeout(function(){ if (st === 'recording') stop(); }, 30000);
      }catch(e){ stopTracks(); st = 'idle'; failMsg(e); }
      buttons();
    }).catch(function(err){ st = 'idle'; failMsg(err); buttons(); });
  }
  function stop(){
    clearTimeout(timer);
    if (mr && st === 'recording'){
      st = 'stopping';
      try{ mr.stop(); }catch(e){ stopTracks(); st = 'idle'; failMsg(e); }
      buttons();
    }
  }
  function play(){
    if (!url) return;
    try{
      if (audio){ audio.pause(); }
      audio = new Audio(url);
      audio.onended = function(){ msg('info','Playback finished.',"Lecture terminée."); };
      var p = audio.play();
      msg('info','Playing your recording.',"Lecture de votre enregistrement.");
      if (p && p.catch) p.catch(function(){ msg('info','Playback did not work. Try again.',"La lecture n'a pas marché. Réessayez."); });
    }catch(e){ msg('info','Playback did not work. Try again.',"La lecture n'a pas marché. Réessayez."); }
  }
  function again(){
    clearTimeout(timer);
    if (mr && st === 'recording'){ try{ mr.onstop = null; mr.stop(); }catch(e){} mr = null; }
    stopTracks(); clearAudio(); chunks = []; st = 'idle';
    msg('info','Press Record, then say your message.',"Appuyez sur Record, puis dites votre message.");
    buttons();
  }
  recB.addEventListener('click', start);
  stopB.addEventListener('click', stop);
  playB.addEventListener('click', play);
  againB.addEventListener('click', again);
  if (!supported) msg('info','Recording is not available in this browser. You can type or build your message instead.',"L'enregistrement n'est pas disponible dans ce navigateur. Vous pouvez écrire ou construire votre message.");
  else msg('info','Press Record, then say your message.',"Appuyez sur Record, puis dites votre message.");
  buttons();
  var api = {destroy:function(){
    dead = true; clearTimeout(timer);
    if (mr){ try{ mr.onstop = null; if (mr.state !== 'inactive') mr.stop(); }catch(e){} mr = null; }
    stopTracks(); clearAudio();
  }};
  recorders.push(api);
  return api;
}

    var c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = b;
    c.addEventListener('click', function(){
      ta.value = (ta.value.trim() + ' ' + b).trim().slice(0, 350);
      state.first = ta.value; revalidate(); refreshNav(); save();
      announce('Added: ' + b);
    });
    chips.appendChild(c);
  });
  $('clear1').addEventListener('click', function(){ ta.value = ''; state.first = ''; revalidate(); refreshNav(); save(); ta.focus(); });
}

/* ----- Screen 4: choose, improve, retry ----- */
function buildS3(){
  var f1 = features(state.first);
  var did = [];
  if (f1.purpose) did.push(['You made your purpose clear.','Votre but est clair.']);
  if (f1.day) did.push(['You gave the day.','Vous avez donné le jour.']);
  if (f1.bring) did.push(['You said what to bring.','Vous avez dit quoi apporter.']);
  if (f1.deadline) did.push(['You gave the deadline.','Vous avez donné la date limite.']);
  if (f1.question) did.push(['You asked a clear question.','Vous avez posé une question claire.']);
  if (f1.polite) did.push(['You ended politely.','Vous avez terminé poliment.']);
  if (!did.length) did.push(['You wrote a message. That is a good start.',"Vous avez écrit un message. C'est un bon début."]);

  var h = '<h2 id="h-3" tabindex="-1">' + bi('Choose, improve, retry','Choisir, améliorer, réessayer') + '</h2>' +
    '<div class="card green"><h3>' + bi('Your first try already does this well','Votre premier essai réussit déjà ceci') + '</h3><ul class="plain">' +
    did.map(function(d){ return '<li>' + bi(d[0], d[1]) + '</li>'; }).join('') + '</ul><div class="mine" id="firstShow3"></div></div>';

  PAIRS.forEach(function(p){
    h += '<fieldset class="group"><legend>' + bi(p.qEn, p.qFr) + '</legend><div id="pair-' + p.id + '"></div><div class="status" id="pfb-' + p.id + '" role="status"></div></fieldset>';
  });

  var sug = suggestionList(f1);
  h += '<fieldset class="group"><legend>' + bi('Choose one or two things to improve','Choisissez une ou deux choses à améliorer') + '</legend><div id="impOpts"></div><div class="status" id="impFb" role="status"></div></fieldset>';

  h += '<div class="card yellow"><h3>' + bi('Lesson phrases','Phrases de la leçon') + '</h3><ul class="plain">' +
    PHRASE_BANK.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
    '<div class="row"><button type="button" class="btn secondary small" id="modelBtn" aria-expanded="false" aria-controls="modelBox">' + bi('Show an example','Voir un exemple') + '</button></div>' +
    '<div id="modelBox" hidden><p class="mine" style="margin:0">' + esc(MODEL_TEXT) + '</p><p style="margin:6px 0 0">' + bi('This is an example. Use your own details.',"C'est un exemple. Utilisez vos propres détails.") + '</p></div></div>' +
    '<div class="row"><button type="button" class="btn secondary" id="choiceReset">' + bi('Try again','Réessayer') + '</button></div>';
  S[3].innerHTML = h;
  $('firstShow3').textContent = state.first;

  PAIRS.forEach(function(p){
    var box = $('pair-' + p.id);
    shuffle(p.opts).forEach(function(o){ box.appendChild(optLabel('radio','pair-' + p.id, o.id, esc(o.t), state.pairs[p.id] === o.id)); });
    function show(){
      var v = state.pairs[p.id];
      if (v === 'good') setStatus($('pfb-' + p.id), 'ok', p.okEn, p.okFr);
      else if (v === 'basic') setStatus($('pfb-' + p.id), 'try', p.tryEn, p.tryFr);
      else setStatus($('pfb-' + p.id), '');
    }
    show();
    box.addEventListener('change', function(e){ state.pairs[p.id] = e.target.value; markOn(box); show(); refreshNav(); save(); });
  });

  var imp = $('impOpts');
  sug.forEach(function(sg){
    var html = '<strong>' + bi(sg.def.cat[0], sg.def.cat[1]) + '</strong><br>' + bi(esc(sg.def.en), esc(sg.def.fr));
    imp.appendChild(optLabel('checkbox','imp', sg.key, html, state.improve.indexOf(sg.key) > -1));
  });
  imp.addEventListener('change', function(e){
    var checked = Array.prototype.slice.call(imp.querySelectorAll('input:checked')).map(function(i){ return i.value; });
    if (checked.length > 2){ e.target.checked = false; checked = checked.filter(function(v){ return v !== e.target.value; }); setStatus($('impFb'),'info','Choose one or two things.','Choisissez une ou deux choses.'); }
    else setStatus($('impFb'), '');
    markOn(imp);
    state.improve = checked; state.improveH = checked.length ? hash(normCmp(state.first)) : '';
    revalidate(); refreshNav(); save();
  });
  if (state.improve.length) state.improveH = hash(normCmp(state.first));

  $('modelBtn').addEventListener('click', function(){
    var box = $('modelBox'), open = box.hidden;
    box.hidden = !open; this.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open){ state.model = true; save(); }
  });
  $('choiceReset').addEventListener('click', function(){
    state.pairs = {p1:'',p2:''}; state.improve = []; state.improveH = ''; revalidate();
    buildS3(); refreshNav(); save();
  });
}

/* ----- Screen 5: second try ----- */
function buildS4(){
  var sug = suggestionList(features(state.first));
  var chosen = state.improve.map(function(k){
    var s = sug.filter(function(x){ return x.key === k; })[0];
    return s ? s.def : null;
  }).filter(Boolean);
  var h = '<h2 id="h-4" tabindex="-1">' + bi('Your second try','Votre deuxième essai') + '</h2>' +
    '<h3>' + bi('Your first try','Votre premier essai') + '</h3><div class="mine" id="firstShow4" aria-label="Your first try"></div>' +
    '<div class="card yellow"><h3>' + bi('Your improvement','Votre amélioration') + '</h3><ul class="plain">' +
    chosen.map(function(d){ return '<li>' + bi(esc(d.en), esc(d.fr)) + '</li>'; }).join('') + '</ul>' +
    '<p style="margin:0">' + bi('Make your message clearer. Use at least one improvement.','Rendez votre message plus clair. Utilisez au moins une amélioration.') + '</p></div>' +
    '<fieldset class="group"><legend>' + bi('Tap a lesson phrase to add it','Touchez une phrase de la leçon pour l\'ajouter') + '</legend><div class="chips" id="chips2"></div></fieldset>' +
    '<label class="lbl" for="secondText">' + bi('Your second try','Votre deuxième essai') + '</label>' +
    '<textarea id="secondText" maxlength="350" autocomplete="off"></textarea>' +
    '<div class="status" id="secondFb" role="status"></div>' +
    '<div class="row"><button type="button" class="btn secondary" id="copy1">' + bi('Copy my first try here','Copier mon premier essai ici') + '</button>' +
    '<button type="button" class="btn secondary" id="again2">' + bi('Try again','Réessayer') + '</button></div>' +
    '<div id="rec2"></div>';
  S[4].innerHTML = h;
  $('firstShow4').textContent = state.first;
  var ta = $('secondText'); ta.value = state.second;
  function upd(){
    state.second = ta.value; revalidate();
    var c = secondCheck(), fb = $('secondFb');
    if (wc(state.second) < 2) setStatus(fb, 'info', 'Write your second try. Use at least one improvement.', 'Écrivez votre deuxième essai. Utilisez au moins une amélioration.');
    else if (!c.distinct) setStatus(fb, 'info', 'Change your message to make a second try.', 'Changez votre message pour faire un deuxième essai.');
    else if (!c.good.length){
      var k = state.improve.filter(function(x){ return !improved(x, c.f1, c.f2); })[0];
      var def = (sug.filter(function(x){ return x.key === k; })[0] || {def:IMP.phrase}).def;
      setStatus(fb, 'try', 'Try again with this phrase: ' + esc(def.phrase), 'Essayez avec cette phrase : ' + esc(def.phrase));
    } else setStatus(fb, 'ok', 'You used your improvement. You can compare your tries.', 'Vous avez utilisé votre amélioration. Vous pouvez comparer vos essais.');
    refreshNav(); save();
  }
  ta.addEventListener('input', upd);
  shuffle(PHRASE_BANK).forEach(function(p){
    var c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = p;
    c.addEventListener('click', function(){ ta.value = (ta.value.trim() + ' ' + p).trim().slice(0, 350); upd(); announce('Added: ' + p); });
    $('chips2').appendChild(c);
  });
  var thank = document.createElement('button'); thank.type = 'button'; thank.className = 'chip'; thank.textContent = 'Thank you.';
  thank.addEventListener('click', function(){ ta.value = (ta.value.trim() + ' Thank you.').trim().slice(0, 350); upd(); announce('Added: Thank you.'); });
  $('chips2').appendChild(thank);
  $('copy1').addEventListener('click', function(){ ta.value = state.first; upd(); ta.focus(); });
  $('again2').addEventListener('click', function(){ ta.value = ''; upd(); ta.focus(); });
  makeRecorder($('rec2'), 'Optional: say your second try aloud', 'Facultatif : dites votre deuxième essai à voix haute');
  if (state.second) upd();
}

/* ----- Screen 6: notice the progress ----- */
function buildS5(){
  var c = secondCheck();
  var diffKeys = ['purpose','day','bring','deadline','question','polite'].filter(function(k){ return c.f2[k] && !c.f1[k]; });
  var summary;
  if (diffKeys.length){
    var en = joinList(diffKeys.map(function(k){ return DIFF_LABELS[k][0]; }), 'and');
    var fr = joinList(diffKeys.map(function(k){ return DIFF_LABELS[k][1]; }), 'et');
    summary = bi('Your second try is clearer because it now includes ' + en + '.', "Votre deuxième essai est plus clair parce qu'il contient maintenant : " + fr + '.');
  } else {
    summary = bi('You made a new version of your message. Well done for trying again.', "Vous avez fait une nouvelle version de votre message. Bravo d'avoir réessayé.");
  }
  var h = '<h2 id="h-5" tabindex="-1">' + bi('Notice your progress','Remarquez vos progrès') + '</h2>' +
    '<div class="compare"><div class="card"><h3>' + bi('First try','Premier essai') + '</h3><div class="mine" id="cmp1" style="background:#fff"></div></div>' +
    '<div class="card green"><h3>' + bi('Second try','Deuxième essai') + '</h3><div class="mine" id="cmp2" style="background:#fff"></div></div></div>' +
    '<div class="status ok" role="status"><span class="badge" aria-hidden="true">✓</span><span>' + summary + '</span></div>' +
    '<fieldset class="group"><legend>' + bi('What improved? Choose at least one.',"Qu'est-ce qui s'est amélioré ? Choisissez au moins une réponse.") + '</legend><div id="refOpts"></div></fieldset>';
  S[5].innerHTML = h;
  $('cmp1').textContent = state.first; $('cmp2').textContent = state.second;
  var box = $('refOpts');
  var labels = {purpose:['Clearer purpose','Un but plus clair'], info:['More complete information','Des informations plus complètes'], phrase:['A useful phrase','Une phrase utile'], polite:['A polite ending','Une fin polie']};
  IMP_KEYS.forEach(function(k){ box.appendChild(optLabel('checkbox','ref', k, bi(labels[k][0], labels[k][1]), state.reflect.indexOf(k) > -1)); });
  box.addEventListener('change', function(){
    state.reflect = Array.prototype.slice.call(box.querySelectorAll('input:checked')).map(function(i){ return i.value; });
    state.reflectH = state.reflect.length ? reflHash() : '';
    markOn(box); refreshNav(); save();
  });
}

/* ----- Screen 7: complete ----- */
function buildS6(){
  S[6].innerHTML =
    '<div class="card green"><h2 id="h-6" tabindex="-1">' + bi('Review complete.','Révision terminée.') + '</h2>' +
    '<p style="margin:0">' + bi('You reviewed and improved your English for understanding school messages.',"Vous avez révisé et amélioré votre anglais pour comprendre les messages de l'école.") + '</p></div>' +
    '<div class="card yellow"><h3>' + bi('Use it this week','Utilisez-le cette semaine') + '</h3>' +
    '<p style="margin:0">' + bi('Find one school message or notice. Say the day, the item and the deadline aloud.',"Trouvez un message ou un avis de l'école. Dites à voix haute le jour, l'objet à apporter et la date limite.") + '</p></div>';
}

/* ---------------- navigation ---------------- */
function refreshNav(){
  var nb = $('nextBtn');
  if (cur <= 5){ nb.disabled = !stepValid(cur); }
  var onLast = cur === LAST;
  doneBtn.disabled = !(onLast && allValid());
}
function setNextLabel(){
  var nb = $('nextBtn');
  if (cur <= 5){ nb.innerHTML = bi(NAVLABELS[cur][0], NAVLABELS[cur][1]); }
}
function showScreen(i, focus){
  destroyRecorders();
  cur = i; state.screen = i;
  if (i === 2) makeRecorder($('rec1'), 'Optional: say your message aloud', 'Facultatif : dites votre message à voix haute');
  if (i === 3) buildS3();
  if (i === 4) buildS4();
  if (i === 5) buildS5();
  S.forEach(function(s, idx){ s.hidden = idx !== i; });
  var last = i === LAST;
  $('nextBtn').hidden = last;
  $('finalRow').hidden = !last;
  setNextLabel();
  $('barFill').style.width = Math.round(((i + 1) / 7) * 100) + '%';
  $('bar').setAttribute('aria-valuenow', String(i + 1));
  $('ptext').textContent = (i + 1) + ' of 7';
  refreshNav();
  if (focus !== false){
    window.scrollTo(0, 0);
    var h = $('h-' + i); if (h){ h.setAttribute('tabindex', '-1'); h.focus({preventScroll:true}); }
  }
  save();
}

$('nextBtn').addEventListener('click', function(){
  if (cur <= 5 && stepValid(cur)){
    showScreen(cur + 1);
  }
});

/* language toggle */
function applyLang(){
  document.body.classList.toggle('fr-on', !!state.fr);
  $('frBtn').setAttribute('aria-pressed', state.fr ? 'true' : 'false');
  $('frBtnText').textContent = state.fr ? 'English only' : 'Voir en français';
}
$('frBtn').addEventListener('click', function(){ state.fr = !state.fr; applyLang(); save(); });

/* done and try again */
$('doneBtn').addEventListener('click', function(){
  if (cur !== LAST || !allValid()) return;
  var ok = activityCompleted();
  setStatus($('doneMsg'), 'ok', 'Done. You can close this page.', 'Terminé. Vous pouvez fermer cette page.');
  if (ok) doneBtn.disabled = true;
});
function resetAll(){
  destroyRecorders();
  var fr = state.fr;
  state = freshState(); state.fr = fr;
  buildS0(); buildS1(); buildS2(); buildS6();
  S[1].removeEventListener('change', onRecallChange);
  S[1].addEventListener('change', onRecallChange);
  setStatus($('doneMsg'), '');
  doneBtn.disabled = true;
  applyLang();
  showScreen(0);
  announce('Activity restarted.');
}
$('tryAllBtn').addEventListener('click', resetAll);

/* ---------------- init ---------------- */
(function init(){
  var raw = '';
  try{ raw = LMS.readSuspend() || ''; }catch(e){ raw = ''; }
  if (!raw){ try{ raw = localStorage.getItem(KEY) || ''; }catch(e){ raw = ''; } }
  if (raw) restore(raw);
  revalidate();
  try{ if (LMS.isDone()) completionSent = true; }catch(e){}
  buildS0(); buildS1(); buildS2(); buildS6();
  applyLang();
  var start = Math.min(state.screen, reachable(), LAST - 1);
  /* never restore audio, never restore directly onto the final screen */
  showScreen(start, false);
  $('h-' + start).setAttribute('tabindex', '-1');
})();

function cleanup(){
  destroyRecorders();
  clearTimeout(saveT); flush();
}
window.addEventListener('pagehide', function(){ cleanup(); LMS.finish(); });
window.addEventListener('beforeunload', function(){ destroyRecorders(); });
})();
</script>
</body>
