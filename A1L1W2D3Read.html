<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission — Making Arrangements</title>
<style>
  :root{
    --blue:#36BBD6;
    --green:#C9D646;
    --yellow:#FCC104;
    --red:#E6352B;
    --grey:#EBEBEB;
    --ink:#2E2E2D;
    --blue-tint:#EAF8FB;
    --green-tint:#F7FAEC;
    --white:#FFFFFF;
    --focus:#1B4F5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    background:var(--white);
    color:var(--ink);
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:"Arial Black","Segoe UI",sans-serif;
    font-weight:900;
    letter-spacing:0.2px;
    margin:0 0 8px 0;
    text-transform:none;
  }
  .app{
    max-width:720px;
    margin:0 auto;
    padding:16px 16px 48px 16px;
  }
  .top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 0 14px 0;
    border-bottom:4px solid var(--blue);
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-logo{
    height:38px;
    width:auto;
    display:block;
  }
  .brand-sub{
    font-family:"Arial Black","Segoe UI",sans-serif;
    font-weight:900;
    font-size:0.95rem;
    color:var(--ink);
  }
  .progress{
    font-size:0.95rem;
    color:var(--ink);
    background:var(--grey);
    border-radius:999px;
    padding:6px 14px;
    white-space:nowrap;
  }
  .progress-track{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .progress-dot{
    flex:1;
    height:8px;
    border-radius:4px;
    background:var(--grey);
  }
  .progress-dot.done{background:var(--blue);}
  .progress-dot.current{background:var(--yellow);}
  .screen{
    outline:none;
  }
  .card{
    background:var(--blue-tint);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .card.green{background:var(--green-tint);}
  .lead{
    font-size:1.15rem;
    margin-bottom:14px;
  }
  .sub{
    color:#55564f;
    font-size:0.98rem;
    margin-bottom:14px;
  }
  .illustration{
    width:100%;
    max-width:280px;
    display:block;
    margin:0 auto 16px auto;
    border-radius:14px;
  }
  table.cal{
    width:100%;
    border-collapse:collapse;
    background:var(--white);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:6px;
  }
  table.cal th, table.cal td{
    text-align:left;
    padding:10px 8px;
    border-bottom:1px solid var(--grey);
    font-size:0.95rem;
  }
  table.cal th{
    background:var(--blue);
    color:var(--white);
    font-weight:700;
  }
  .status-available{color:#3e7d17;font-weight:700;}
  .status-busy{color:var(--red);font-weight:700;}
  .choice-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:14px 0;
  }
  button.choice{
    font-family:inherit;
    font-size:1rem;
    text-align:left;
    background:var(--white);
    border:2px solid var(--blue);
    color:var(--ink);
    border-radius:12px;
    padding:14px 16px;
    min-height:44px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  button.choice:hover{background:var(--blue-tint);}
  button.choice.selected-correct{
    border-color:#3e7d17;
    background:var(--green-tint);
  }
  button.choice.selected-wrong{
    border-color:var(--yellow);
    background:#FFF8E1;
  }
  button.choice[disabled]{cursor:default;}
  button.choice{touch-action:manipulation;}
  .dot{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:8px;
    vertical-align:middle;
  }
  .dot-yellow{background:var(--yellow);}
  .dot-green{background:#3e7d17;}
  .feedback{
    min-height:24px;
    font-weight:700;
    margin-top:6px;
  }
  .feedback.ok{color:#2f6110;}
  .feedback.retry{color:#8a6400;}
  .field-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:14px 0;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
    min-width:140px;
  }
  label{font-weight:700;font-size:0.92rem;}
  select, input[type="text"]{
    font-family:inherit;
    font-size:1rem;
    padding:10px 10px;
    border-radius:10px;
    border:2px solid var(--blue);
    min-height:44px;
    background:var(--white);
    color:var(--ink);
  }
  .sentence-preview{
    background:var(--white);
    border:2px dashed var(--blue);
    border-radius:12px;
    padding:14px;
    font-size:1.1rem;
    margin-top:10px;
  }
  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:22px;
  }
  button.nav{
    font-family:inherit;
    font-weight:700;
    font-size:1rem;
    padding:12px 22px;
    border-radius:999px;
    min-height:44px;
    cursor:pointer;
    border:2px solid var(--blue);
    touch-action:manipulation;
  }
  button.nav.back{
    background:var(--white);
    color:var(--blue);
  }
  button.nav.back[disabled]{
    opacity:0.4;
    cursor:not-allowed;
  }
  button.nav.forward{
    background:var(--blue);
    color:var(--white);
    margin-left:auto;
  }
  button.nav.forward[disabled]{
    background:var(--grey);
    border-color:var(--grey);
    color:#8a8a86;
    cursor:not-allowed;
  }
  button.nav.done{
    background:var(--yellow);
    border-color:var(--yellow);
    color:var(--ink);
  }
  .speak-box{
    background:var(--green-tint);
    border:3px solid var(--green);
    border-radius:14px;
    padding:18px 20px;
    margin-top:18px;
    box-shadow:0 2px 0 rgba(0,0,0,0.04);
  }
  .speak-box h3{
    font-size:1.1rem;
    color:var(--ink);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .speak-box h3::before{
    content:"🎙";
    font-size:1.2rem;
  }
  .speak-box .speak-prompt{
    font-size:1.05rem;
    margin-bottom:12px;
  }
  .speak-box .speak-encourage{
    font-size:0.95rem;
    font-style:italic;
    color:#3e5200;
    margin-bottom:10px;
  }
  .speak-controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  button.pill{
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    padding:12px 18px;
    border-radius:999px;
    border:2px solid var(--green);
    background:var(--white);
    color:#3e5200;
    min-height:48px;
    cursor:pointer;
    touch-action:manipulation;
  }
  button.pill.active{
    background:var(--green);
    color:var(--ink);
  }
  .speak-status{
    font-size:0.9rem;
    color:#55564f;
  }
  .speak-player{
    border-radius:10px;
    outline:none;
  }
  .mission-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .mission-card{
    background:var(--white);
    border:2px solid var(--blue);
    border-radius:14px;
    padding:16px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    min-height:44px;
    touch-action:manipulation;
  }
  .mission-card h3{
    color:var(--blue);
    font-size:1.05rem;
    margin-bottom:4px;
  }
  .mission-card p{
    margin:0;
    color:#55564f;
    font-size:0.95rem;
  }
  .mission-card:hover{background:var(--blue-tint);}
  .mission-card.chosen{
    border-color:#3e7d17;
    background:var(--green-tint);
  }
  .checklist{
    list-style:none;
    padding:0;
    margin:14px 0;
  }
  .checklist li{
    padding:8px 0;
    border-bottom:1px solid var(--grey);
  }
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;border:0;
  }
  button.change-mission{
    display:inline-block;
    margin-top:4px;
    color:var(--blue);
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    background:none;
    border:none;
    -webkit-appearance:none;
    appearance:none;
    font-size:0.95rem;
    font-family:inherit;
    padding:6px 2px;
    min-height:44px;
    touch-action:manipulation;
  }
  :focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
  }
  @media (max-width:420px){
    .lead{font-size:1.05rem;}
    button.nav{padding:12px 16px;}
  }
</style>
</head>

  /* ---------- SCORM 1.2 / SCORM 2004 wrapper ---------- */
  /* Finds the LMS API in the current window or an ancestor/opener window, talks to
     whichever SCORM version is actually present, and fails silently and safely when
     no LMS is available (so the activity works standalone, e.g. opened directly in
     a browser). Every call into the LMS is wrapped so a broken or absent API can
     never throw or block the activity. */
  var LMS = (function(){
    var api = null, version = null; // version: "1.2" or "2004"
    var initialized = false, terminated = false;
    var completionAlreadyReported = false;

    function safeCall(fn, fallback){
      try{ return fn(); }catch(e){ return fallback; }
    }

    function climb(win){
      var w = win, steps = 0;
      while(w && steps <= 10){
        try{
          if(w.API_1484_11) return {v:"2004", api:w.API_1484_11};
          if(w.API) return {v:"1.2", api:w.API};
        }catch(eCrossOrigin){
          return null; // cross-origin frame: stop climbing this chain, never throw
        }
        if(w.parent && w.parent !== w){ w = w.parent; steps++; } else { break; }
      }
      return null;
    }

    function discover(){
      if(api) return true;
      var found = null;
      try{ found = climb(window); }catch(e1){ found = null; }
      if(!found){
        try{ if(window.opener){ found = climb(window.opener); } }catch(e2){ found = null; }
      }
      if(found){ api = found.api; version = found.v; return true; }
      return false;
    }

    function init(){
      if(initialized) return true; // never re-initialize
      if(!discover()) return false;
      var result = "";
      try{
        result = (version === "1.2") ? api.LMSInitialize("") : api.Initialize("");
      }catch(eInit){ result = ""; }
      // Some LMS implementations return a boolean, some the string "true"/"false".
      initialized = (result === true || result === "true");
      if(!initialized) return false;

      try{
        var raw = (version === "1.2") ?
          safeCall(function(){ return api.LMSGetValue("cmi.core.lesson_status"); }, "") :
          safeCall(function(){ return api.GetValue("cmi.completion_status"); }, "");
        var status = String(raw || "").toLowerCase();
        if(status === "completed" || status === "passed"){
          completionAlreadyReported = true;
        } else if(status === "" || status === "not attempted" || status === "not_attempted" || status === "unknown"){
          if(version === "1.2"){
            safeCall(function(){ api.LMSSetValue("cmi.core.lesson_status","incomplete"); });
          } else {
            safeCall(function(){ api.SetValue("cmi.completion_status","incomplete"); });
            safeCall(function(){ api.SetValue("cmi.success_status","unknown"); });
          }
          commit();
        }
      }catch(eStatus){ /* leave LMS status untouched on any unexpected error */ }
      return true;
    }

    function commit(){
      if(!initialized) return;
      try{ if(version === "1.2"){ api.LMSCommit(""); } else { api.Commit(""); } }catch(eCommit){ /* ignore */ }
    }

    function setCompleted(){
      if(!initialized) return;
      if(completionAlreadyReported){ commit(); return; } // never downgrade an existing completed/passed status
      try{
        if(version === "1.2"){
          api.LMSSetValue("cmi.core.lesson_status","completed");
        } else {
          // Completion-based activity: report completion only, never a score or "passed".
          api.SetValue("cmi.completion_status","completed");
        }
        completionAlreadyReported = true;
        commit();
      }catch(eComplete){ /* ignore — activity still works locally */ }
    }

    function saveSuspendData(jsonStr, screenIndex){
      if(!initialized) return false;
      try{
        if(version === "1.2"){
          api.LMSSetValue("cmi.suspend_data", jsonStr);
          api.LMSSetValue("cmi.core.lesson_location", String(screenIndex));
          api.LMSSetValue("cmi.core.exit","suspend");
        } else {
          api.SetValue("cmi.suspend_data", jsonStr);
          api.SetValue("cmi.location", String(screenIndex));
          api.SetValue("cmi.exit","suspend");
        }
        commit();
        return true;
      }catch(eSave){ return false; }
    }

    function loadSuspendData(){
      if(!initialized) return "";
      try{
        return (version === "1.2" ? api.LMSGetValue("cmi.suspend_data") : api.GetValue("cmi.suspend_data")) || "";
      }catch(eLoad){ return ""; }
    }

    function terminate(){
      if(!initialized || terminated) return;
      terminated = true; // prevents a second LMSFinish/Terminate if both pagehide and beforeunload fire
      try{ if(version === "1.2"){ api.LMSFinish(""); } else { api.Terminate(""); } }catch(eTerm){ /* ignore */ }
    }

      commit: commit,
      setCompleted: setCompleted,
      isAlreadyCompleted: function(){ return completionAlreadyReported; },
      saveSuspendData: saveSuspendData,
      loadSuspendData: loadSuspendData,
      terminate: terminate,
      hasAPI: function(){ return !!api; },
      isInitialized: function(){ return initialized; }
    };

  var STEP_LABELS = ["Choose a mission","Check the calendars","Ask","Respond to a conflict","Negotiate","Confirm","Well done"];

  /* ---------- State ---------- */
  var state = {
    history: [0],           // stack of screen indices visited (0 = mission select)
    mission: null,          // mission key
    answered: {},           // per-screen correct flag
    confirmDay: "",
    confirmTime: "",
    completionFired: false
  };

  /* ---------- Progress persistence (SCORM suspend_data, or localStorage standalone) ---------- */
  var LOCAL_PROGRESS_KEY = "pazapa_a1l1w2d6_communication_mission_v1";

  function buildStateSnapshot(){
    return {
      v: 1,
      history: state.history.slice(0, 50),
      mission: state.mission,
      answered: state.answered,
      confirmDay: state.confirmDay,
      confirmTime: state.confirmTime,
      completionFired: state.completionFired
    };
  }

  function saveProgress(){
    var json = "";
    try{ json = JSON.stringify(buildStateSnapshot()); }catch(eStringify){ return; }
    if(LMS.hasAPI() && LMS.isInitialized()){
      LMS.saveSuspendData(json, current());
    } else {
      // Local fallback only — never used when a real LMS session is active, so it can
      // never overwrite valid LMS data.
      try{ window.localStorage.setItem(LOCAL_PROGRESS_KEY, json); }catch(eStorage){ /* storage unavailable, ignore */ }
    }
  }

  function isValidScreenIndex(n){
    return typeof n === "number" && isFinite(n) && n >= 0 && n <= 6;
  }

  function sanitizeRestoredState(data){
    if(!data || typeof data !== "object") return null;
    if(!Array.isArray(data.history) || data.history.length === 0 || !data.history.every(isValidScreenIndex)){
      return null; // corrupted or impossible screen — ignore the whole save rather than guess
    }
    var out = { history: data.history.slice(0, 50) };
    if(typeof data.mission === "string" && Object.prototype.hasOwnProperty.call(MISSIONS, data.mission)){
      out.mission = data.mission;
    } else {
      out.mission = null;
    }
    var needsMission = out.history.some(function(i){ return i >= 1; });
    if(needsMission && !out.mission) return null; // unknown mission for a mission screen — reject
    out.answered = (data.answered && typeof data.answered === "object" && !Array.isArray(data.answered)) ? data.answered : {};
    out.confirmDay = typeof data.confirmDay === "string" ? data.confirmDay : "";
    out.confirmTime = typeof data.confirmTime === "string" ? data.confirmTime : "";
    out.completionFired = !!data.completionFired;
    return out;
  }

  function restoreProgress(){
    var raw = "";
    if(LMS.hasAPI() && LMS.isInitialized()){
      raw = LMS.loadSuspendData();
    }
    if(!raw){
      try{ raw = window.localStorage.getItem(LOCAL_PROGRESS_KEY) || ""; }catch(eRead){ raw = ""; }
    }
    var restored = false;
    if(raw){
      var parsed = null;
      try{ parsed = JSON.parse(raw); }catch(eParse){ parsed = null; }
      var safe = sanitizeRestoredState(parsed);
      if(safe){
        state.history = safe.history;
        state.mission = safe.mission;
        state.answered = safe.answered;
        state.confirmDay = safe.confirmDay;
        state.confirmTime = safe.confirmTime;
        state.completionFired = safe.completionFired;
        restored = true;
      }
      // corrupted/incompatible data: silently ignored, state stays at its defaults
    }
    // If the LMS already reports completion, that status always wins and is never downgraded,
    // even if the suspend data above was missing or incomplete.
    if(LMS.isAlreadyCompleted()){
      state.completionFired = true;
    }
    return restored;
  }

  function current(){ return state.history[state.history.length-1]; }

  function goTo(screenIndex){
    state.history.push(screenIndex);
    render();
  }

  function goBack(){
    if(state.history.length > 1){
      state.history.pop();
      // stepping back out of a mission returns to mission choice
      if(current() === 0){ state.mission = null; }
      render();
    }
  }

  function chooseMission(key){
    state.mission = key;
    state.answered = {};
    state.confirmDay = "";
    state.confirmTime = "";
    goTo(1);
  }

  function announce(msg, ok){
    var live = document.getElementById("liveRegion");
    live.className = "feedback " + (ok ? "ok" : "retry");
    live.textContent = msg;
  }

  /* ---------- Speaking widget ---------- */
  // Only one recording session exists at a time (one speak widget is visible per
  // screen). Tracking it here — rather than in per-widget closures — lets navigation,
  // retry, mission-change, and page unload all clean it up completely: the microphone
  // track is stopped, the timer is cleared, and the blob URL is revoked.
  var speakSession = { mediaRecorder:null, stream:null, currentUrl:null, timerId:null, seconds:0 };

  function clearSpeakSession(){
    try{
      if(speakSession.timerId){ clearInterval(speakSession.timerId); }
    }catch(eTimer){ /* ignore */ }
    speakSession.timerId = null;
    try{
      if(speakSession.mediaRecorder && speakSession.mediaRecorder.state !== "inactive"){
        speakSession.mediaRecorder.stop();
      }
    }catch(eStop){ /* ignore */ }
    speakSession.mediaRecorder = null;
    try{
      if(speakSession.stream){
        speakSession.stream.getTracks().forEach(function(t){ t.stop(); });
      }
    }catch(eTracks){ /* ignore */ }
    speakSession.stream = null;
    try{
      if(speakSession.currentUrl){ URL.revokeObjectURL(speakSession.currentUrl); }
    }catch(eUrl){ /* ignore */ }
    speakSession.currentUrl = null;
    speakSession.seconds = 0;
  }

  function stopAnyActiveRecording(){
    clearSpeakSession();
  }

  var ENCOURAGEMENT = [
    "Speaking out loud helps the words stick. Give it a try.",
    "You already know this language — trust yourself and speak clearly.",
    "Every time you practise, the next conversation gets easier.",
    "There is no wrong way to try. Just speak at your own pace."
  ];

  function speakWidgetHtml(key, prompt){
    var line = ENCOURAGEMENT[Math.abs(hashKey(key)) % ENCOURAGEMENT.length];
    return '' +
      '<div class="speak-box">' +
        '<h3>Practice saying it</h3>' +
        '<p class="speak-encourage">'+line+'</p>' +
        '<p class="speak-prompt">"' + prompt + '"</p>' +
        '<div class="speak-controls">' +
          '<button type="button" class="pill" id="recBtn-'+key+'">Start recording</button>' +
          '<button type="button" class="pill" id="saidBtn-'+key+'">I said it aloud</button>' +
        '</div>' +
        '<audio class="speak-player" id="player-'+key+'" controls playsinline style="display:none;width:100%;margin-top:12px;"></audio>' +
        '<p class="speak-status" id="speakStatus-'+key+'" role="status" aria-live="polite">This is optional and never scored. Skip it any time and Carry on.</p>' +
      '</div>';
  }

  function hashKey(key){
    var s = String(key), h = 0;
    for(var i=0;i<s.length;i++){ h = ((h<<5) - h) + s.charCodeAt(i); h |= 0; }
    return h;
  }

  function pickRecorderMimeType(){
    var candidates = [
      "audio/mp4",
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus"
    ];
    if(!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== "function"){
      return ""; // let the browser pick its default
    }
    for(var i=0;i<candidates.length;i++){
      if(MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return "";
  }

  function wireSpeakWidget(key){
    var recBtn = document.getElementById("recBtn-"+key);
    var saidBtn = document.getElementById("saidBtn-"+key);
    var status = document.getElementById("speakStatus-"+key);
    var player = document.getElementById("player-"+key);
    if(!recBtn) return;

    if(!window.isSecureContext){
      recBtn.disabled = true;
      status.textContent = "Recording needs a secure (https) connection on this device. Use \"I said it aloud\" instead.";
    } else if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      recBtn.disabled = true;
      status.textContent = "Recording is not available on this device or browser. Use \"I said it aloud\" instead.";
    }

    function resetButton(){
      recBtn.textContent = "Start recording";
      recBtn.classList.remove("active");
    }

    recBtn.addEventListener("click", function(){
      if(recBtn.textContent === "Start recording"){
        clearSpeakSession(); // guarantee no simultaneous or orphaned recording remains
        status.textContent = "Asking for microphone permission...";
        navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
          speakSession.stream = s;
          var chunks = [];
          var mimeType = pickRecorderMimeType();
          try{
            speakSession.mediaRecorder = mimeType ? new MediaRecorder(s, {mimeType:mimeType}) : new MediaRecorder(s);
          }catch(errRec){
            status.textContent = "This device could not start recording. Use \"I said it aloud\" instead.";
            clearSpeakSession();
            resetButton();
            return;
          }
          speakSession.mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size > 0) chunks.push(e.data); };
          speakSession.mediaRecorder.onstop = function(){
            if(speakSession.timerId){ clearInterval(speakSession.timerId); speakSession.timerId = null; }
            if(speakSession.currentUrl){ URL.revokeObjectURL(speakSession.currentUrl); speakSession.currentUrl = null; }
            var mrMime = (speakSession.mediaRecorder && speakSession.mediaRecorder.mimeType) || "audio/mp4";
            var blob = new Blob(chunks, {type: mrMime});
            var url = URL.createObjectURL(blob);
            speakSession.currentUrl = url;
            player.src = url;
            player.style.display = "block";
            status.textContent = "Recording ready. Press play to listen to yourself.";
            if(speakSession.stream){ speakSession.stream.getTracks().forEach(function(t){ t.stop(); }); speakSession.stream = null; }
            speakSession.mediaRecorder = null;
            resetButton();
          };
          speakSession.mediaRecorder.onerror = function(){
            status.textContent = "Recording stopped unexpectedly. Try again or use \"I said it aloud\".";
            clearSpeakSession();
            resetButton();
          };
          speakSession.mediaRecorder.start();
          recBtn.textContent = "Stop recording";
          recBtn.classList.add("active");
          player.style.display = "none";
          speakSession.seconds = 0;
          status.textContent = "Recording... 0:00";
          speakSession.timerId = setInterval(function(){
            speakSession.seconds++;
            var m = Math.floor(speakSession.seconds/60), s = speakSession.seconds%60;
            status.textContent = "Recording... " + m + ":" + (s<10?"0":"") + s;
          }, 1000);
        }).catch(function(err){
          var name = err && err.name;
          if(name === "NotAllowedError" || name === "PermissionDeniedError"){
            status.textContent = "Microphone access was not given. Use \"I said it aloud\" instead.";
          } else if(name === "NotFoundError" || name === "DevicesNotFoundError"){
            status.textContent = "No microphone was found on this device. Use \"I said it aloud\" instead.";
          } else if(name === "NotReadableError" || name === "TrackStartError"){
            status.textContent = "The microphone is already in use or unavailable. Use \"I said it aloud\" instead.";
          } else if(name === "SecurityError"){
            status.textContent = "Recording is blocked on this page. Use \"I said it aloud\" instead.";
          } else if(name === "AbortError"){
            status.textContent = "Recording could not start. Use \"I said it aloud\" instead.";
          } else {
            status.textContent = "An unexpected recording error happened. Use \"I said it aloud\" instead.";
          }
        });
      } else {
        if(speakSession.mediaRecorder && speakSession.mediaRecorder.state !== "inactive"){
          speakSession.mediaRecorder.stop();
        }
        resetButton();
      }
    });

    saidBtn.addEventListener("click", function(){
      saidBtn.classList.add("active");
      status.textContent = "Thank you — noted that you said it aloud.";
    });
  }

  /* ---------- Screen renderers ---------- */

  function renderMissionSelect(){
    var html = '<div class="card">' +
      '<h1>Communication Mission</h1>' +
      '<p class="lead">Choose a mission. You will make a real arrangement in English.</p>' +
      '<div class="mission-grid">';
    Object.keys(MISSIONS).forEach(function(key){
      var m = MISSIONS[key];
      html += '<button type="button" class="mission-card" data-mission="'+key+'">' +
        '<h3>'+m.title+'</h3><p>'+m.goal+'</p></button>';
    });
    html += '</div></div>';
    document.getElementById("screen").innerHTML = html;

    var cards = document.querySelectorAll(".mission-card");
    cards.forEach(function(c){
      c.addEventListener("click", function(){
        chooseMission(c.getAttribute("data-mission"));
      });
    });
  }

  function renderCalendar(m){
    var rows = m.calendar.map(function(r){
      var youText = r.you === "available" ? ("available" + (r.youTime ? " at " + r.youTime : "")) : "busy";
      var partnerText = r.partner === "available" ? ("available" + (r.partnerTime ? " at " + r.partnerTime : "")) : "busy";
      return '<tr><td>'+r.day+'</td>' +
        '<td class="status-'+r.you+'">'+youText+'</td>' +
        '<td class="status-'+r.partner+'">'+partnerText+'</td></tr>';
    }).join("");

    var html = '<div class="card">' +
      '<h2>Check the calendars</h2>' +
      '<p class="sub">Your mission: <strong>'+m.title+'</strong> with '+m.partnerName+', '+m.partnerRole+'.</p>' +
      '<img class="illustration" src="'+IMG_CAL+'" alt="A woman checking a wall calendar and clock.">' +
      '<table class="cal"><caption class="sr-only">Availability calendar for '+m.title+'</caption>' +
      '<thead><tr><th scope="col">Day</th><th scope="col">You</th><th scope="col">'+m.partnerName+'</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table>' +
      '<p class="sub">Look for a day when you are both available. You will need it soon.</p>' +
      '<button type="button" class="change-mission" id="changeMission1">Choose a different mission</button>' +
      '</div>';
    document.getElementById("screen").innerHTML = html;
    document.getElementById("changeMission1").addEventListener("click", function(){
      state.history = [0];
      state.mission = null;
      state.answered = {};
      state.confirmDay = "";
      state.confirmTime = "";
      render();
      announce("Choose a different mission.", true);
    });
    state.answered[1] = true; // reading screen, no gate
  }

  function renderMultiChoiceScreen(opts){
    // opts: {screenKey, heading, subLead, options, correctFeedback, retryFeedback, speakPrompt}
    var html = '<div class="card">' +
      '<h2>'+opts.heading+'</h2>' +
      (opts.subLead ? '<p class="lead">'+opts.subLead+'</p>' : '') +
      '<div class="choice-list" id="choiceList" role="group" aria-label="Answer choices">';
    opts.options.forEach(function(o, idx){
      html += '<button type="button" class="choice" data-idx="'+idx+'" aria-pressed="false">'+o.text+'</button>';
    });
    html += '</div>';
    if(opts.speakPrompt){
      html += speakWidgetHtml(opts.screenKey, opts.speakPrompt);
    }
    html += '</div>';
    document.getElementById("screen").innerHTML = html;
    if(opts.speakPrompt){ wireSpeakWidget(opts.screenKey); }

    var buttons = document.querySelectorAll("#choiceList .choice");
    buttons.forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        var choice = opts.options[idx];
        buttons.forEach(function(b){ b.setAttribute("aria-pressed","false"); });
        btn.setAttribute("aria-pressed","true");
        if(choice.correct){
          buttons.forEach(function(b){ b.disabled = true; });
          btn.classList.add("selected-correct");
          announce((opts.correctFeedback || "That's right.") + " Correct answer.", true);
          state.answered[opts.screenKey] = true;
          updateForwardButton();
          saveProgress();
        } else {
          btn.classList.remove("selected-correct");
          btn.classList.add("selected-wrong");
          announce((opts.retryFeedback || "Not quite. Try another answer.") + " Try again.", false);
        }
      });
    });
  }

  function renderAsk(m){
    renderMultiChoiceScreen({
      screenKey: 2,
      heading: "Ask about a day",
      subLead: "You want to arrange your " + m.purpose + ". Ask " + m.partnerName + " a question with a day in it.",
      options: m.askOptions,
      correctFeedback: "Good question — that names a day clearly.",
      retryFeedback: "Choose the question that asks about " + m.askDay + ".",
      speakPrompt: "Are you available on " + m.askDay + "?"
    });
  }

  function renderConflict(m){
    renderMultiChoiceScreen({
      screenKey: 3,
      heading: "Respond to a conflict",
      subLead: m.partnerName + " says: \u201c" + m.conflictLine + "\u201d Choose a respectful reply that suggests another day.",
      options: m.conflictOptions,
      correctFeedback: "Polite and clear — well done.",
      retryFeedback: "Choose the polite reply that suggests " + m.negotiateDay + ".",
      speakPrompt: m.conflictOptions.filter(function(o){return o.correct;})[0].text
    });
  }

  function renderNegotiate(m){
    renderMultiChoiceScreen({
      screenKey: 4,
      heading: "Negotiate once",
      subLead: m.partnerName + " says: \u201c" + m.negotiatePartnerLine + "\u201d Choose your reply.",
      options: m.negotiateOptions,
      correctFeedback: "You agreed on a time that works for both of you.",
      retryFeedback: "Check your calendar — does that time really work for you?",
      speakPrompt: "Yes, that works for me."
    });
  }

  function renderConfirm(m){
    var dayOpts = m.dayOptions.map(function(d){ return '<option value="'+d+'">'+d+'</option>'; }).join("");
    var timeOpts = m.timeOptions.map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join("");
    var html = '<div class="card">' +
      '<h2>Confirm the arrangement</h2>' +
      '<p class="lead">Complete the confirmation message to '+m.partnerName+'.</p>' +
      '<div class="field-row">' +
        '<div class="field"><label for="daySelect">Day</label>' +
        '<select id="daySelect"><option value="">Choose a day</option>'+dayOpts+'</select></div>' +
        '<div class="field"><label for="timeSelect">Time</label>' +
        '<select id="timeSelect"><option value="">Choose a time</option>'+timeOpts+'</select></div>' +
      '</div>' +
      '<div class="sentence-preview" id="sentencePreview">Great. '+m.purpose+' on ____ at ____. See you then.</div>' +
      '<div class="feedback" id="confirmFeedback"></div>' +
      speakWidgetHtml(5, "Great. " + m.purpose + " on " + m.correctDay + " at " + m.correctTime + ". See you then.") +
      '</div>';
    document.getElementById("screen").innerHTML = html;
    wireSpeakWidget(5);

    var daySelect = document.getElementById("daySelect");
    var timeSelect = document.getElementById("timeSelect");
    var preview = document.getElementById("sentencePreview");
    var feedback = document.getElementById("confirmFeedback");

    // Restore a previously chosen day/time (e.g. after a refresh) if they are still valid options
    if(state.confirmDay && m.dayOptions.indexOf(state.confirmDay) !== -1){ daySelect.value = state.confirmDay; }
    if(state.confirmTime && m.timeOptions.indexOf(state.confirmTime) !== -1){ timeSelect.value = state.confirmTime; }

    function updatePreview(){
      var d = daySelect.value || "____";
      var t = timeSelect.value || "____";
      preview.textContent = "Great. " + m.purpose + " on " + d + " at " + t + ". See you then.";
      state.confirmDay = daySelect.value || "";
      state.confirmTime = timeSelect.value || "";
      if(daySelect.value && timeSelect.value){
        if(daySelect.value === m.correctDay && timeSelect.value === m.correctTime){
          feedback.className = "feedback ok";
          feedback.textContent = "Perfect. That matches what you both agreed.";
          state.answered[5] = true;
          updateForwardButton();
        } else {
          feedback.className = "feedback retry";
          feedback.textContent = "Check the day and time you agreed on together.";
          state.answered[5] = false;
          updateForwardButton();
        }
      }
      saveProgress();
    }
    daySelect.addEventListener("change", updatePreview);
    timeSelect.addEventListener("change", updatePreview);

    if(daySelect.value && timeSelect.value){ updatePreview(); }
  }

  function renderOutcome(m){
    var html = '<div class="card green">' +
      '<h2>Mission complete</h2>' +
      '<img class="illustration" src="'+IMG_READ+'" alt="A woman relaxing at home with a cup of tea, her plan settled.">' +
      '<p class="lead">Great. '+m.purpose+' on '+m.correctDay+' at '+m.correctTime+'. See you then.</p>' +
      '<p class="sub">You asked about a day, handled a conflict, negotiated once and confirmed a real arrangement in English.</p>' +
      '<ul class="checklist">' +
        '<li>Asked about availability</li>' +
        '<li>Responded politely to a conflict</li>' +
        '<li>Negotiated a time that worked for both people</li>' +
        '<li>Confirmed the arrangement</li>' +
      '</ul>' +
      '<p class="sub" id="completionNote">'+(state.completionFired ? "This step is complete." : "Click Done to finish this step.")+'</p>' +
      '<div class="nav-row" style="margin-top:10px;">' +
        '<button type="button" class="nav back" id="retryMissionBtn">Retry this mission</button>' +
        '<button type="button" class="nav back" id="tryAgainBtn">Choose a different mission</button>' +
      '</div>' +
      '</div>';
    document.getElementById("screen").innerHTML = html;
    state.answered[6] = true;
    updateForwardButton();
    document.getElementById("retryMissionBtn").addEventListener("click", function(){
      // Note: state.completionFired is intentionally NOT reset here. Once completion has
      // been reported to the LMS it must never be downgraded, even on a fresh attempt.
      var keepMission = state.mission;
      state.history = [0, 1];
      state.mission = keepMission;
      state.answered = {};
      state.confirmDay = "";
      state.confirmTime = "";
      render();
      announce("Restarting this mission.", true);
    });
    document.getElementById("tryAgainBtn").addEventListener("click", function(){
      // Note: state.completionFired is intentionally NOT reset here — same reason as above.
      state.history = [0];
      state.mission = null;
      state.answered = {};
      state.confirmDay = "";
      state.confirmTime = "";
      render();
      announce("Choose a different mission.", true);
    });
  }

  /* ---------- Render dispatcher ---------- */
  function render(){
    stopAnyActiveRecording();
    var idx = current();
    var m = state.mission ? MISSIONS[state.mission] : null;
    var live = document.getElementById("liveRegion");
    live.textContent = "";
    live.className = "feedback";

    if(idx === 0 || !m){
      renderMissionSelect();
    } else if(idx === 1){
      renderCalendar(m);
    } else if(idx === 2){
      renderAsk(m);
    } else if(idx === 3){
      renderConflict(m);
    } else if(idx === 4){
      renderNegotiate(m);
    } else if(idx === 5){
      renderConfirm(m);
    } else if(idx === 6){
      renderOutcome(m);
      // Reaching this screen must NOT report completion by itself — completion is only
      // ever reported from the explicit Done click in the forwardBtn handler below.
    }

    document.getElementById("progressLabel").textContent = "Step " + (idx+1) + " of " + STEP_LABELS.length + ": " + STEP_LABELS[idx];
    var track = document.getElementById("progressTrack");
    track.innerHTML = "";
    for(var i=0;i<STEP_LABELS.length;i++){
      var dot = document.createElement("div");
      dot.className = "progress-dot" + (i<idx?" done":"") + (i===idx?" current":"");
      track.appendChild(dot);
    }
    document.getElementById("screen").focus();
    document.getElementById("backBtn").disabled = (state.history.length <= 1);
    updateForwardButton();
    saveProgress();
  }

  function screenRequiresAnswer(idx){
    return idx >= 2 && idx <= 5;
  }

  function updateForwardButton(){
    var idx = current();
    var fwd = document.getElementById("forwardBtn");
    if(idx === 6){
      fwd.textContent = state.completionFired ? "Done \u2713" : "Done";
      fwd.className = "nav done";
      fwd.disabled = state.completionFired;
      return;
    }
    fwd.textContent = "Carry on";
    fwd.className = "nav forward";
    if(screenRequiresAnswer(idx)){
      fwd.disabled = !state.answered[idx];
    } else {
      fwd.disabled = false;
    }
  }

  function fireCompletion(){
    // Guarded so that only the FIRST valid Done click can ever report completion,
    // commit it, update the message, and lock the button. Every later call (a stray
    // click, a re-render, restoring an already-completed session) is a safe no-op.
    if(state.completionFired) return;
    state.completionFired = true;

    LMS.setCompleted();

    var note = document.getElementById("completionNote");
    if(note){
      note.textContent = "This step is complete.";
    }
    announce("This step is complete.", true);
    updateForwardButton();
    saveProgress();
  }

  /* ---------- Navigation buttons ---------- */
  document.getElementById("backBtn").addEventListener("click", goBack);
  document.getElementById("forwardBtn").addEventListener("click", function(){
    var idx = current();
    if(idx === 6){
      if(!state.completionFired){ fireCompletion(); }
      return;
    }
    if(screenRequiresAnswer(idx) && !state.answered[idx]) return;
    goTo(idx+1);
  });

  /* ---------- Boot: SCORM discovery, progress restore, lifecycle ---------- */
  (function attemptLmsInit(retriesLeft){
    if(LMS.init()) return;
    if(retriesLeft > 0){ setTimeout(function(){ attemptLmsInit(retriesLeft-1); }, 300); }
  })(5);

  var restoredProgress = restoreProgress();
  render();
  if(restoredProgress){
    announce("Your previous progress has been restored.", true);
  }

  function handleUnload(){
    try{ saveProgress(); }catch(eSave){ /* ignore */ }
    try{ LMS.commit(); }catch(eCommit){ /* ignore */ }
    try{ stopAnyActiveRecording(); }catch(eRec){ /* ignore */ }
    try{ LMS.terminate(); }catch(eTerm){ /* ignore */ }
  }
  window.addEventListener("pagehide", handleUnload);
  window.addEventListener("beforeunload", handleUnload);
})();
</script>
</body>
</html>
