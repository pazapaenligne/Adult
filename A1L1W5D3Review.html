<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping for clothes - Review, Improve and Retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6; --pazapa-blue-20:#D7F1F7; --pazapa-blue-40:#AFE4EF;
  --pazapa-green:#C9D646; --pazapa-green-20:#F4F7DA; --pazapa-green-40:#E9EFB5;
  --pazapa-yellow:#FCC104; --pazapa-yellow-20:#FEF3CD; --pazapa-yellow-40:#FDE69A;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB; --pazapa-grey-dark:#2E2E2D; --pazapa-grey-80:#575757;
  --font-head:"Filson Soft","Open Sans",Arial,sans-serif;
  --font-body:"Open Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--pazapa-grey-dark);font-family:var(--font-body);font-size:1.0625rem;line-height:1.55}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:#fff;color:var(--pazapa-grey-dark);padding:10px 14px;border:2px solid var(--pazapa-grey-dark);border-radius:8px;z-index:10}
.skip:focus{top:8px}
.band{height:12px;background:var(--pazapa-blue)}
.top{max-width:920px;margin:0 auto;padding:16px 18px 6px}
.brand{margin:0;font-weight:700;font-size:.95rem;color:var(--pazapa-grey-80)}
.subtitle{margin:2px 0 0;font-family:var(--font-head);font-weight:800;font-size:1.25rem}
.progress{max-width:920px;margin:0 auto;padding:6px 18px 0}
.progress p{margin:0 0 6px;font-size:.9rem;font-weight:600;color:var(--pazapa-grey-80)}
.bar{height:8px;background:var(--pazapa-grey-light);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pazapa-blue);transition:width .25s ease}
main{max-width:920px;margin:0 auto;padding:12px 18px 60px}
[hidden]{display:none !important}
.screen[hidden]{display:none}
h2{font-family:var(--font-head);font-weight:800;font-size:1.75rem;line-height:1.2;margin:14px 0 10px;text-transform:none}
h3{font-family:var(--font-head);font-weight:800;font-size:1.2rem;line-height:1.25;margin:0 0 8px;text-transform:none}
h2:focus{outline:none}
p{margin:0 0 10px}
.lead{font-size:1.125rem}
.card{background:var(--pazapa-blue-20);border-radius:16px;padding:18px;margin:14px 0}
.card.green{background:var(--pazapa-green-20)}
.card.yellow{background:var(--pazapa-yellow-20)}
.card.grey{background:var(--pazapa-grey-light)}
.card.white{background:#fff;border:2px solid var(--pazapa-grey-light)}
.two{display:grid;gap:18px;align-items:center}
@media(min-width:720px){.two{grid-template-columns:1.1fr 1fr}.two.rev{grid-template-columns:1fr 1.1fr}}
figure{margin:0}
figure img,.frame img{display:block;width:100%;height:auto;max-height:280px;object-fit:contain;border-radius:12px}
.frame{background:var(--pazapa-yellow-20);border-radius:16px;padding:12px}
figcaption{font-size:.9rem;color:var(--pazapa-grey-80);margin-top:6px}
fieldset{border:0;margin:0 0 12px;padding:0;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:8px}
.opt{display:flex;gap:12px;align-items:center;min-height:52px;margin:8px 0;padding:10px 14px;background:#fff;border:2px solid var(--pazapa-grey-dark);border-radius:12px;cursor:pointer;touch-action:manipulation}
.opt input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--pazapa-grey-dark)}
.opt:has(input:checked){background:var(--pazapa-blue-40)}
.opt:focus-within{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px}
.btn{font-family:var(--font-body);font-size:1rem;font-weight:700;min-height:48px;min-width:48px;padding:11px 22px;border-radius:12px;border:2px solid var(--pazapa-grey-dark);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation}
.btn.secondary{background:#fff}
.btn.small{padding:8px 16px}
.btn:disabled{background:var(--pazapa-grey-light);color:var(--pazapa-grey-80);border-color:var(--pazapa-grey-80);cursor:not-allowed}
.btn:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible,.chip:focus-visible,.slot:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:center}
.chip{font-family:var(--font-body);font-size:1rem;font-weight:600;min-height:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--pazapa-blue)}
.chip.used{display:none}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;padding:10px;background:#fff;border-radius:12px;min-height:68px;border:2px dashed var(--pazapa-grey-80)}
.pic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:10px 0}
.pic{background:#fff;border-radius:12px;padding:8px;border:2px solid var(--pazapa-grey-light)}
.pic img{display:block;width:100%;height:120px;object-fit:contain;border-radius:8px;background:var(--pazapa-yellow-20)}
.qimg{display:block;width:100%;max-width:220px;height:auto;border-radius:12px;margin:0 0 10px;background:var(--pazapa-yellow-20)}
.purpose{margin:0;padding:10px;min-height:64px;border-radius:8px;background:var(--pazapa-yellow-20);font-weight:600}
.strip{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;padding:0}
.strip li{padding:6px 14px;border-radius:20px;background:var(--pazapa-yellow-40);font-weight:700}
.slot{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;margin-top:8px;padding:6px 8px;border:2px dashed var(--pazapa-grey-dark);border-radius:10px;background:var(--pazapa-blue-20);color:var(--pazapa-grey-dark);font-family:var(--font-body);font-size:.95rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.slot.filled{border-style:solid;background:#fff}
.slot.over{background:var(--pazapa-blue-40)}
.dot{display:inline-block;flex:0 0 14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--pazapa-grey-dark)}
.dot.ok{background:var(--pazapa-green)}
.dot.try{background:var(--pazapa-yellow)}
.dot.info{background:var(--pazapa-blue)}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--pazapa-grey-light);font-size:.98rem;display:flex;gap:8px;align-items:flex-start}
.fb[hidden]{display:none}
.fb .dot{margin-top:5px}
.fb.ok{background:var(--pazapa-green-20)}
.fb.try{background:var(--pazapa-yellow-20)}
.fb.info{background:var(--pazapa-blue-20)}
.hint{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cue{flex:1 1 220px;margin:0;padding:8px 12px;background:var(--pazapa-yellow-20);border-radius:10px;font-size:.98rem}
.cue[hidden]{display:none}
.sent{margin:10px 0;line-height:2.6}
.sent input{width:9.5em;min-height:48px;padding:6px 10px;font-family:var(--font-body);font-size:1rem;border:2px solid var(--pazapa-grey-dark);border-radius:10px;background:#fff;color:var(--pazapa-grey-dark)}
.row{margin:6px 0 14px}
textarea{width:100%;min-height:120px;padding:12px;font-family:var(--font-body);font-size:1rem;line-height:1.5;border:2px solid var(--pazapa-grey-dark);border-radius:12px;background:#fff;color:var(--pazapa-grey-dark);resize:vertical}
label.block{display:block;font-weight:700;margin-bottom:6px}
.readonly{padding:12px 14px;background:var(--pazapa-grey-light);border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
ol.built{margin:8px 0;padding:0;list-style:none;counter-reset:b}
ol.built li{counter-increment:b;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0;padding:8px 12px;background:#fff;border:2px solid var(--pazapa-grey-dark);border-radius:12px}
ol.built li span::before{content:counter(b) ". ";font-weight:700}
ol.built:empty::before{content:"Tap phrases above to build your answer.";display:block;padding:8px 12px;color:var(--pazapa-grey-80)}
details{margin:12px 0;background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:0 14px}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;touch-action:manipulation}
details[open] summary{margin-bottom:6px}
.rec-btns{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.rec-status{margin:6px 0 12px;font-size:.95rem}
.checks{list-style:none;margin:8px 0;padding:0}
.checks li{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:10px 12px;background:#fff;border-radius:10px}
.checks li .dot{margin-top:5px}
.cmp{display:grid;gap:14px;margin:12px 0}
@media(min-width:720px){.cmp{grid-template-columns:1fr 1fr}}
.tag{display:inline-flex;gap:6px;align-items:center;margin:4px 6px 0 0;padding:4px 10px;background:var(--pazapa-green-40);border-radius:14px;font-size:.92rem;font-weight:600}
.big{font-family:var(--font-head);font-weight:800;font-size:1.6rem}
.status{font-weight:700}
noscript p{padding:16px;background:var(--pazapa-yellow-20);border-radius:12px;max-width:920px;margin:16px auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- Deterministic checks ---------- */
const RE_DETAIL = /\b(size|larger|smaller|small|medium|large|colour|color|black|cost|price|much)\b/;

  const buy = RE_BUY.test(t);
  const polite = /\b(excuse me|please|thank you|thanks|sorry)\b/.test(t);
  const seq = /\b(first|then|next|finally)\b/.test(t);
  const iN = t.search(RE_NEED), iD = t.search(RE_DETAIL), iB = t.search(RE_BUY);
  const order = (need && detail && buy && iN < iD && iD < iB) || (seq && need && (detail || buy));

      busy: 'The microphone is being used by another app. Close it and try again, or type your answer instead.',
      empty: 'The recording was empty. Press Try again and speak after you press Record.',
      unsupported: 'Recording is not available in this browser. You can type your answer instead.',

  }
  function place(slotId, chipId) {
    Object.keys(state.a).forEach(k => { if (state.a[k] === chipId) delete state.a[k]; });
    state.a[slotId] = chipId; sel = null;
    const it = RECALL_A.find(x => x.id === slotId);

  shuffle(RECALL_A.map(x => x.id)).forEach(id => {
    const b = h('button', { type: 'button', class: 'chip', draggable: 'true', 'aria-pressed': 'false' }, wordOf(id));
    b.addEventListener('click', () => { sel = sel === id ? null : id; refreshA(); });
    b.addEventListener('dragstart', e => { try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch (x) { /* ignore */ } sel = id; });
    chipEls[id] = b; bank.append(b);
  });
  shuffle(RECALL_A.map(x => x.id)).forEach(id => {
    const it = RECALL_A.find(x => x.id === id);
    const slot = h('button', { type: 'button', class: 'slot' });
    slot.addEventListener('click', () => {

    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });

      e.preventDefault(); slot.classList.remove('over');
      let cid = sel;
      try { cid = e.dataTransfer.getData('text/plain') || sel; } catch (x) { /* ignore */ }
      if (cid && RECALL_A.some(x => x.id === cid)) place(id, cid);
    });
    slotEls[id] = slot;
    grid.append(h('div', { class: 'pic' }, h('img', { src: IMG[id], alt: it.alt }), slot));
  });

  /* Task 2: fill in the blanks */
  const inputs = [], bFbs = [];
  const sents = h('div', { class: 'sent' });
  function checkB(i, quiet) {
    const it = B_ITEMS[i], v = inputs[i].value;
    if (!normAns(v)) { if (!quiet) setFb(bFbs[i], 'info', 'Type a word to check it.'); return; }
    if (matchB(it, v)) setFb(bFbs[i], 'ok', 'Yes. ' + it.why);

  }
  B_ITEMS.forEach((it, i) => {
    const inp = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', 'aria-label': 'Missing word ' + (i + 1), value: state.b[i] || '' });
    inp.addEventListener('input', () => { state.b[i] = inp.value.slice(0, 30); gate(); saveSoon(); });
    inp.addEventListener('change', () => { checkB(i); announce(bFbs[i].textContent); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkB(i); announce(bFbs[i].textContent); } });
    const fbx = h('div', { class: 'fb', hidden: true });
    inputs.push(inp); bFbs.push(fbx);
    sents.append(h('div', { class: 'row' }, h('span', { text: (i + 1) + '. ' + it.pre }), inp, h('span', { text: it.post }), fbx));
  });
  const checkAll = h('button', { type: 'button', class: 'btn secondary small', onclick: () => { for (let i = 0; i < 3; i++) checkB(i); gate(); announce(bOk() ? 'All three words are right.' : 'Check the yellow messages and try again.'); } }, 'Check my words');
  const bHints = B_HINTS.map(t => t.replace('__BANK__', shuffle(B_BANK).join(' - ')));
  B_ITEMS.forEach((it, i) => { if (state.b[i]) checkB(i, true); });

  /* Task 3: choose the useful reply */
  const cWrap = h('div', null);
  C_ITEMS.forEach((it, i) => {
    const fbx = h('div', { class: 'fb', hidden: true });
    const fs = h('fieldset', null, h('legend', { text: it.q }));
    if (it.img && IMG[it.img]) fs.append(h('img', { class: 'qimg', src: IMG[it.img], alt: it.imgAlt || '' }));
    shuffle(it.opts).forEach(o => {
      const r = h('input', { type: 'radio', name: 'c' + i, value: o });
      if (state.c[i] === o) r.checked = true;
      r.addEventListener('change', () => {
        state.c[i] = o;
        if (o === it.ok) setFb(fbx, 'ok', 'Yes. ' + it.why); else setFb(fbx, 'try', 'Try again with this cue: ' + it.cue);
        gate(); saveSoon(); announce(fbx.textContent);
      });
      fs.append(h('label', { class: 'opt' }, r, h('span', { text: o })));
    });
    if (state.c[i]) setFb(fbx, state.c[i] === it.ok ? 'ok' : 'try', state.c[i] === it.ok ? 'Yes. ' + it.why : 'Try again with this cue: ' + it.cue);
    cWrap.append(fs, fbx);
  });

  const again = h('button', { type: 'button', class: 'btn secondary', onclick: () => {
    state.a = {}; state.b = ['', '', '']; state.c = [null, null]; state.hints = { a: 0, b: 0, c: 0 };
    saveSoon(); buildS2(); $('#s2 h2').focus({ preventScroll: true }); announce('This screen is reset.');
  } }, 'Try again');
  cont.addEventListener('click', () => goTo(3));

  host.append(
    h('h2', { id: 'h2b', text: 'Quick recall' }),
    h('p', { class: 'lead', text: 'Try each task first. Use a hint only if you need it. You can change any answer.' }),
    h('div', { class: 'card' },
      h('h3', { text: '1. Match the words to the pictures' }),
      h('p', { text: 'Drag a word onto a picture. Or tap a word, then tap a picture.' }),
      bank, grid, aFb, hintBlock('a', A_HINTS)),
    h('div', { class: 'card green' },
      h('h3', { text: '2. Complete the phrases' }),
      h('p', { text: 'Type the missing word.' }),

    h('div', { class: 'card yellow' },
      h('h3', { text: '3. Choose what to say' }),

/* ---------- SCREEN 3: First try ---------- */

}
function buildS3() {

  buildPanel.append(h('p', { text: 'Tap phrases in the order you want to say them.' }), tiles, h('p', { class: 'status', text: 'My answer' }), builtList, clearBuilt);

        h('figcaption', { text: 'In the shop: choose a shirt and talk to the assistant.' })),
    h('div', { class: 'card yellow' },
      h('h3', { text: 'The situation' }),

/* ---------- SCREEN 4: Real-life checklist ---------- */

  } }, 'Try again');

/* ---------- SCREEN 6: Notice the progress ---------- */

  if (textOnly) {
    if ((f2.need && !f1.need) || (f2.order && !f1.order)) ev.push({ k: 'purpose', label: 'a clearer purpose' });

  doneBtn = h('button', { type: 'button', class: 'btn', id: 'doneBtn' }, 'Done');
  doneBtn.disabled = true;
  doneBtn.addEventListener('click', () => activityCompleted());
  const again = h('button', { type: 'button', class: 'btn secondary', onclick: () => fullReset() }, 'Try again');
  host.append(
    h('div', { class: 'two' },
      h('div', null,
        h('h2', { id: 'h7b', text: 'Review complete.' }),
        h('p', { class: 'big', text: 'You reviewed and improved your English for shopping for clothes.' })),
      h('div', { class: 'frame' }, h('img', { src: IMG.medium, alt: 'Three shirts in small, medium and large sizes.' }))),
    h('div', { class: 'card green' }, h('h3', { text: 'Use it this week' }),
      h('p', { text: 'Look at clothes in a shop or online. Say two phrases aloud: "How much does it cost?" and "Do you have it in black?" You can use made-up items.' })),
    h('div', { class: 'actions' }, doneBtn, again, status)
  );
  updateDone();
}
function updateDone() {
  if (!doneBtn) return;
  const st = $('#doneStatus');
  if (completionSent) { doneBtn.disabled = true; if (st) st.textContent = 'Completed.'; return; }
  doneBtn.disabled = !(state.screen === 7 && reachable() === 7);
}
function fullReset() {
  stopAllRecorders();
  state = freshState();
  store.remove(CONFIG.storageKey);
  goTo(1);
  announce('The review is reset. You are at the start.');
}

/* ---------- Completion (silent: no message is shown to the learner) ---------- */
function activityCompleted() {
  if (completionSent) return;
  if (state.screen !== 7 || reachable() !== 7) return;
  const res = LMS.complete();
  lmsPending = res.api && !res.ok;
  completionSent = true;
  store.set(CONFIG.storageKey + '.done', '1');
  if (CONFIG.moodleOrigin && window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type: 'pazapa-activity-completed', activity: CONFIG.activityId }, CONFIG.moodleOrigin); } catch (e) { /* ignore */ }
  }
  console.log(CONFIG.completionLog);
  updateDone();
  announce('Completed.');
}

const BUILDERS = { 1: buildS1, 2: buildS2, 3: buildS3, 4: buildS4, 5: buildS5, 6: buildS6, 7: buildS7 };

/* ---------- Start ---------- */
function retryPending() {
  if (lmsPending) { const r = LMS.complete(); if (r.ok) lmsPending = false; }
}
function onExit() {
  stopAllRecorders();
  try { saveProgress(); } catch (e) { /* ignore */ }
  try { retryPending(); LMS.finish(); } catch (e) { /* ignore */ }
}
window.addEventListener('pagehide', onExit);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { stopAllRecorders(); try { saveProgress(); } catch (e) { /* ignore */ } } });
document.addEventListener('click', () => { if (!LMS.api) LMS.detect(); }, { passive: true });

function init() {
  LMS.init();
  loadProgress();
  completionSent = false;
  goTo(state.screen);
  if (doneBtn) doneBtn.disabled = true;
  updateDone();
}
init();

})();
</script>
