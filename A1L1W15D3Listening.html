<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W15D3 Listening Mission – Asking for a solution</title>
<style>
:root{
  --pazapa-blue:#36BBD6; --pazapa-green:#C9D646; --pazapa-yellow:#FCC104; --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB; --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#E6F6FA; --green-tint:#F4F7D9; --yellow-tint:#FFF3CD;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html,body{margin:0;padding:0;background:#fff;color:var(--pazapa-grey-dark);
  font-family:'Open Sans',Arial,sans-serif;font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%;}
h1,h2,h3{font-family:'Filson Soft','Open Sans',Arial,sans-serif;color:var(--pazapa-grey-dark);margin:0 0 .4em;text-transform:none;line-height:1.25;}
h1{font-size:1.7rem;} h2{font-size:1.25rem;}
.app-header{background:var(--pazapa-blue);color:var(--pazapa-grey-dark);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.app-header .brand{font-family:'Filson Soft','Open Sans',Arial,sans-serif;font-weight:700;font-size:1.05rem;}
main{max-width:780px;margin:0 auto;padding:24px 20px 64px;}
.screen{display:none;} .screen.active{display:block;animation:fadein .25s ease-in;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.screen.active{animation:none;} *{transition:none!important;}}
.stepper{font-size:.9rem;font-weight:600;margin:0 0 6px;color:#4a4a49;}
.stepper .bar{display:inline-block;vertical-align:middle;width:120px;height:8px;border-radius:4px;background:var(--pazapa-grey-light);margin-left:10px;overflow:hidden;}
.stepper .bar i{display:block;height:100%;background:var(--pazapa-blue);}
h1:focus{outline:none;}
.instruction{font-size:1.15rem;font-weight:600;margin:6px 0 12px;}
.fr{display:none;font-style:italic;font-weight:400;color:#4a4a49;font-size:.95em;margin-top:2px;}
body.fr-on .fr{display:block;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:10px 22px;
  font:600 1rem 'Open Sans',Arial,sans-serif;border-radius:999px;border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);
  cursor:pointer;touch-action:manipulation;}
.btn:hover{background:var(--pazapa-grey-light);}
.btn:focus-visible,.choice:focus-visible,.ocard:focus-visible,.link-btn:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px;box-shadow:0 0 0 6px #fff;}
.btn-primary{background:var(--pazapa-blue);border-color:var(--pazapa-grey-dark);}
.btn-primary:hover{background:#2aa9c3;}
.btn-help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.btn-help:hover{background:#ffe9a3;}
.btn-done{background:var(--pazapa-green);}
.btn-done:hover{background:#b9c63a;}
.btn:disabled{background:var(--pazapa-grey-light);border-color:#bdbdbd;color:#6b6b6a;cursor:not-allowed;}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
.panel{background:var(--pazapa-grey-light);border-radius:16px;padding:16px 18px;margin:12px 0;}
.audio-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.audio-row .btn[aria-pressed="true"]{background:var(--pazapa-blue);}
.audio-note{font-size:.9rem;margin:10px 0 0;min-height:1.2em;}
.audio-note.missing{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);padding:8px 12px;border-radius:8px;font-weight:600;}
.link-btn{background:none;border:0;padding:10px 0;min-height:48px;font:600 .95rem 'Open Sans',Arial,sans-serif;color:var(--pazapa-grey-dark);text-decoration:underline;cursor:pointer;touch-action:manipulation;}
.transcript{background:#fff;border:2px dashed #bdbdbd;border-radius:12px;padding:10px 14px;margin-top:6px;}
.transcript p{margin:.35em 0;} .transcript b{font-weight:700;}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:10px;}
.choices.three{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
.choice{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-height:64px;
  border:3px solid #cfcfcf;background:#fff;border-radius:16px;padding:12px;text-align:center;cursor:pointer;touch-action:manipulation;
  font:inherit;color:inherit;}
.choice:hover:not(:disabled){border-color:var(--pazapa-grey-dark);}
.choice img{width:100%;max-width:150px;aspect-ratio:1/1;object-fit:contain;background:#FCF6EE;border-radius:10px;display:block;}
.choice .lab{font-weight:700;font-size:1.05rem;line-height:1.3;}
.choice .fr{margin-top:0;}
.choice[aria-pressed="true"]{border-color:var(--pazapa-grey-dark);background:var(--blue-tint);}
.choice[aria-pressed="true"]::after{content:"\2713";position:absolute;top:6px;right:10px;font-weight:900;font-size:1.1rem;}
.choice.right{border-color:#7f8a14;background:var(--green-tint);}
.choice:disabled{opacity:.55;cursor:not-allowed;}
.qblock{margin:18px 0 6px;} .qblock h2{font-size:1.1rem;}
.gate-note{font-size:.92rem;font-weight:600;margin:10px 0 0;}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;min-height:0;}
.feedback:empty{display:none;}
.feedback.good{background:var(--green-tint);border-left:6px solid var(--pazapa-green);}
.feedback.help{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;}
.dot.y{background:var(--pazapa-yellow);} .dot.g{background:var(--pazapa-green);}
ol.order{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;}
.ocard{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:3px solid #cfcfcf;border-radius:16px;padding:12px 14px;cursor:grab;touch-action:manipulation;}
.ocard.sel{border-color:var(--pazapa-grey-dark);background:var(--blue-tint);}
.ocard.dragging{opacity:.5;} .ocard.over{border-style:dashed;border-color:var(--pazapa-grey-dark);}
.ocard.right{border-color:#7f8a14;background:var(--green-tint);}
.ocard .num{flex:0 0 36px;height:36px;border-radius:50%;background:var(--pazapa-grey-dark);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;}
.ocard .txt{flex:1 1 200px;font-weight:600;}
.ocard .mv{display:flex;gap:8px;}
.ocard .mv .btn{padding:6px 14px;min-height:48px;font-size:.95rem;}
.done-msg{margin-top:16px;font-weight:600;min-height:1.4em;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.complete-box{background:var(--green-tint);border-left:8px solid var(--pazapa-green);border-radius:16px;padding:18px 20px;margin:12px 0;}
.accent{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--pazapa-red);margin-bottom:10px;}
@media (max-width:420px){main{padding:16px 12px 48px;} h1{font-size:1.4rem;} .choices,.choices.three{grid-template-columns:repeat(2,1fr);} .btn{padding:10px 16px;}}
@media (min-width:768px){main{padding:32px 32px 72px;}}
</style>
</head>

</header>

/* ============================================================
   STATE
   ============================================================ */
var doneBtn = null;               /* created with the completion screen */
var completionSent = false;       /* set true only by activityCompleted() */
var lmsReported = false;          /* the LMS has already been told (or was already complete) */
var STATE;

function freshState(){
  return {
    screen:"s1", completed:false,
    s:{
      s1:{ sel:[],   attempts:0, checked:false, revealed:false, ok:false, heard:false },
      s2:{ sel:[],   attempts:0, checked:false, revealed:false, ok:false, heard:false },
      s3:{ sel:{},   attempts:0, checked:false, revealed:false, ok:false, heard:false },
      s4:{ sel:[],   attempts:0, checked:false, revealed:false, ok:false, heard:false }
    }
  };
}
STATE = freshState();
var fr = false;
var order4 = [];                  /* current order of the s4 cards */
var selectedCard = null;

function save(){
  try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify({ STATE:STATE, order4:order4, fr:fr, lmsReported:lmsReported })); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(CONFIG.storageKey);
    if(!raw || raw.length > 20000) return;
    var d = JSON.parse(raw);
    if(!d || !d.STATE || !d.STATE.s || SCREENS.indexOf(d.STATE.screen) === -1) return;
    var f = freshState();
    ["s1","s2","s3","s4"].forEach(function(k){
      var a = d.STATE.s[k]; if(!a) return;
      f.s[k].sel = (k === "s3") ? ((a.sel && typeof a.sel === "object" && !Array.isArray(a.sel)) ? a.sel : {}) : (Array.isArray(a.sel) ? a.sel : []);
      f.s[k].attempts = Math.min(+a.attempts || 0, 99);
      f.s[k].checked = !!a.checked; f.s[k].revealed = !!a.revealed; f.s[k].ok = !!a.ok; f.s[k].heard = !!a.heard;
    });
    f.screen = d.STATE.screen; f.completed = !!d.STATE.completed;
    var allOk = SCREENS.slice(0,4).every(function(k){ return f.s[k].ok; });
    if(f.screen === "done" && !allOk) f.screen = "s1";
    if(f.completed && !allOk) f.completed = false;
    STATE = f;
    if(Array.isArray(d.order4) && d.order4.length === 3 && d.order4.slice().sort().join() === "o1,o2,o3") order4 = d.order4;
    fr = !!d.fr; lmsReported = !!d.lmsReported;
    if(STATE.completed) completionSent = true;
  }catch(e){}
}

/* ============================================================
   HELPERS
   ============================================================ */
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function bi(pair){ return '<span class="en">' + pair[0] + '</span><span class="fr" lang="fr">' + pair[1] + '</span>'; }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function announce(t){ var l = $("#live"); l.textContent = ""; setTimeout(function(){ l.textContent = t; }, 30); }
function sameSet(a, b){ return a.length === b.length && a.slice().sort().join("|") === b.slice().sort().join("|"); }

/* ============================================================
   AUDIO ENGINE – one source, no autoplay, normal speed only
   ============================================================ */
var audio = null;
var audioMode = "pending";        /* pending | ready | missing */
var playing = false;

function initAudio(){
  var src = CONFIG.audioFiles.listening;
  if(!src){ audioMode = "missing"; return; }
  try{
    audio = new Audio();
    audio.preload = "metadata";
    audio.playbackRate = 1;
    audio.addEventListener("loadedmetadata", function(){ audioMode = "ready"; refreshAll(); });
    audio.addEventListener("canplay", function(){ if(audioMode === "pending"){ audioMode = "ready"; refreshAll(); } });
    audio.addEventListener("error", function(){ audioMode = "missing"; playing = false; refreshAll(); });
    audio.addEventListener("play", function(){ playing = true; syncAudioUI(); });
    audio.addEventListener("pause", function(){ playing = false; syncAudioUI(); });
    audio.addEventListener("ended", function(){
      playing = false;
      var k = STATE.screen;
      if(STATE.s[k]){ STATE.s[k].heard = true; save(); }
      announce(MSG.ended[0]); refreshAll();
    });
    audio.src = src;
  }catch(e){ audioMode = "missing"; }
}
function playAudio(){
  if(audioMode !== "ready" || !audio) return;
  audio.playbackRate = 1;
  var p = audio.play();
  if(p && p.catch) p.catch(function(){ playing = false; syncAudioUI(); });
}
function pauseAudio(){ if(audio && playing) audio.pause(); }
function restartAudio(){ if(audioMode !== "ready" || !audio) return; audio.currentTime = 0; playAudio(); }
function stopAudio(){ if(audio){ try{ audio.pause(); audio.currentTime = 0; }catch(e){} } playing = false; }

function gateOpen(k){ return audioMode === "missing" || STATE.s[k].heard; }

function syncAudioUI(){
  $$(".screen.active .audio-row").forEach(function(row){
    var ready = audioMode === "ready";
    var p = $(".b-play", row), q = $(".b-pause", row), r = $(".b-restart", row);
    p.disabled = !ready; q.disabled = !ready || !playing; r.disabled = !ready;
    p.setAttribute("aria-pressed", playing ? "true" : "false");
    q.setAttribute("aria-pressed", (ready && !playing && audio && audio.currentTime > 0 && !audio.ended) ? "true" : "false");
  });
  $$(".screen.active .audio-note").forEach(function(n){
    if(audioMode === "missing"){ n.className = "audio-note missing"; n.innerHTML = bi(MSG.missing); }
    else if(audioMode === "pending"){ n.className = "audio-note"; n.innerHTML = bi(MSG.loading); }
    else { n.className = "audio-note"; n.innerHTML = ""; }
  });
}

/* ============================================================
   BUILD SCREENS
   ============================================================ */
function audioBlock(k){
  return '<div class="panel"><div class="audio-row" role="group" aria-label="Audio controls">' +
    '<button type="button" class="btn b-play" aria-pressed="false" aria-label="Play the audio">▶ Play</button>' +
    '<button type="button" class="btn b-pause" aria-pressed="false" aria-label="Pause the audio">⏸ Pause</button>' +
    '<button type="button" class="btn b-restart" aria-label="Restart the audio from the beginning">↻ Restart</button></div>' +
    '<p class="audio-note" role="status"></p>' +
    '<button type="button" class="link-btn b-tr" aria-expanded="false" aria-controls="tr-' + k + '">Audio support transcript</button>' +
    '<div class="transcript" id="tr-' + k + '" hidden>' + transcriptHTML() + '</div></div>';
}
function transcriptHTML(){
  return CONFIG.script.map(function(l){
    return '<p><b>' + l.who + ':</b> ' + l.en + '<span class="fr" lang="fr">' + l.fr + '</span></p>';
  }).join("");
}
function shell(k, n, inner){
  var t = TEXT[k];
  return '<section class="screen" id="screen-' + k + '" aria-labelledby="h-' + k + '">' +
    '<p class="stepper">Screen ' + n + ' of 4<span class="bar" aria-hidden="true"><i style="width:' + (n*25) + '%"></i></span></p>' +
    '<h1 id="h-' + k + '" tabindex="-1">' + bi(t.h) + '</h1>' +
    '<p class="instruction">' + bi(t.i) + '</p>' +
    audioBlock(k) + '<p class="gate-note" id="gate-' + k + '"></p>' + inner +
    '<div class="feedback" id="fb-' + k + '"></div>' +
    '<div class="btn-row">' +
      '<button type="button" class="btn btn-primary b-check" disabled>Check</button>' +
      '<button type="button" class="btn b-retry">Try again</button>' +
      '<button type="button" class="btn btn-help b-show" hidden>Show me</button>' +
      '<button type="button" class="btn btn-primary b-next" hidden>Continue</button>' +
    '</div></section>';
}
function choiceHTML(o, group){
  return '<button type="button" class="choice" data-group="' + group + '" data-id="' + o.id + '" aria-pressed="false">' +
    (o.img ? '<img data-img="' + o.img + '" alt="' + o.alt + '">' : '') +
    '<span class="lab">' + o.en + '</span><span class="fr" lang="fr">' + o.fr + '</span></button>';
}
function buildAll(){
  var h = "";
  h += shell("s1", 1, '<div class="choices three" id="grid-s1" role="group" aria-label="Choose the situation"></div>');
  h += shell("s2", 2, '<div class="choices" id="grid-s2" role="group" aria-label="Choose the words you hear"></div>');
  h += shell("s3", 3, '<div id="grid-s3"></div>');
  h += shell("s4", 4, '<ol class="order" id="grid-s4" aria-label="Three parts. Put them in order."></ol>');
  h += '<section class="screen" id="screen-done" aria-labelledby="h-done">' +
    '<span class="accent" aria-hidden="true"></span>' +
    '<h1 id="h-done" tabindex="-1">Listening Mission complete.<span class="fr" lang="fr">Mission d\'écoute terminée.</span></h1>' +
    '<div class="complete-box"><p style="margin:0 0 .5em;font-weight:600">You listened for key information about asking for a solution.' +
    '<span class="fr" lang="fr">Vous avez écouté les informations clés pour demander une solution.</span></p>' +
    '<p style="margin:0">Next, you will practise pronunciation.<span class="fr" lang="fr">Ensuite, vous allez pratiquer la prononciation.</span></p></div>' +
    '<div class="btn-row"><button type="button" class="btn btn-done" id="doneBtn">Done</button>' +
    '<button type="button" class="btn" id="againBtn">Try again</button></div>' +
    '<p class="done-msg" id="doneMsg" role="status" aria-live="polite"></p></section>';
  $("#main").innerHTML = h;
  doneBtn = $("#doneBtn");
  doneBtn.disabled = true;
  renderChoices();
  wire();
}
function setImages(){
  $$("img[data-img]").forEach(function(im){ var k = im.getAttribute("data-img"); if(IMAGES[k] && im.getAttribute("src") !== IMAGES[k]) im.src = IMAGES[k]; });
}
function renderChoices(){
  $("#grid-s1").innerHTML = shuffle(S1_OPTIONS).map(function(o){ return choiceHTML(o, "s1"); }).join("");
  $("#grid-s2").innerHTML = shuffle(S2_OPTIONS).map(function(o){ return choiceHTML(o, "s2"); }).join("");
  $("#grid-s3").innerHTML = S3_QUESTIONS.map(function(q, i){
    return '<div class="qblock" role="group" aria-labelledby="ql-' + q.id + '"><h2 id="ql-' + q.id + '">' + (i+1) + '. ' + q.en +
      '<span class="fr" lang="fr">' + q.fr + '</span></h2><div class="choices three">' +
      shuffle(q.opts).map(function(o){ return choiceHTML(o, q.id); }).join("") + '</div></div>';
  }).join("");
  if(order4.length !== 3){
    var o;
    do{ o = shuffle(S4_CARDS.map(function(c){ return c.id; })); }while(o.join() === CONFIG.answers.s4.join());
    order4 = o;
  }
  renderOrder();
  setImages();
}
function cardById(id){ return S4_CARDS.filter(function(c){ return c.id === id; })[0]; }
function renderOrder(focusSel){
  var ol = $("#grid-s4");
  ol.innerHTML = order4.map(function(id, i){
    var c = cardById(id);
    return '<li class="ocard' + (selectedCard === id ? " sel" : "") + '" draggable="true" tabindex="0" data-id="' + id + '" aria-label="Part ' + (i+1) + ' of 3: ' + c.en + '">' +
      '<span class="num" aria-hidden="true">' + (i+1) + '</span>' +
      '<span class="txt">' + c.en + '<span class="fr" lang="fr">' + c.fr + '</span></span>' +
      '<span class="mv"><button type="button" class="btn b-up" aria-label="Move up: ' + c.en + '"' + (i === 0 ? " disabled" : "") + '>↑ Move up</button>' +
      '<button type="button" class="btn b-down" aria-label="Move down: ' + c.en + '"' + (i === 2 ? " disabled" : "") + '>↓ Move down</button></span></li>';
  }).join("");
  if(focusSel){ var t = $(focusSel, ol); if(t && !t.disabled) t.focus(); else { var li = $('li[data-id="' + selectedCard + '"]', ol); if(li) li.focus(); } }
}

/* ============================================================
   REFRESH UI FROM STATE
   ============================================================ */
function refreshAll(){
  var k = STATE.screen;
  SCREENS.forEach(function(s){ var el = $("#screen-" + s); if(el) el.classList.toggle("active", s === k); });
  document.body.classList.toggle("fr-on", fr);
  var fb = $("#frBtn"); fb.setAttribute("aria-pressed", fr ? "true" : "false"); fb.textContent = fr ? "Back to English" : "Traduire en français"; fb.lang = fr ? "en-GB" : "fr";
  AUDIO_SCREENS.forEach(refreshScreen);
  if(audioMode === "missing"){ $$(".b-tr").forEach(function(b){ var p = $("#" + b.getAttribute("aria-controls")); p.hidden = false; b.setAttribute("aria-expanded","true"); }); }
  syncAudioUI();
  var dn = $("#doneMsg");
  var allOk = AUDIO_SCREENS.every(function(s){ return STATE.s[s].ok; });
  if(k === "done"){
    doneBtn.disabled = !allOk;
    dn.innerHTML = (completionSent && STATE.completed) ? bi(["Done. Well done!","Terminé. Bravo !"]) : "";
  } else { doneBtn.disabled = true; }
}
function refreshScreen(k){
  var st = STATE.s[k], el = $("#screen-" + k);
  if(!el) return;
  var open = gateOpen(k);
  var gate = $("#gate-" + k);
  gate.innerHTML = open ? "" : bi(MSG.listenFirst);
  /* choices */
  $$(".choice", el).forEach(function(b){
    var g = b.getAttribute("data-group"), id = b.getAttribute("data-id");
    var on = (k === "s3") ? (st.sel[g] === id) : (st.sel.indexOf(id) !== -1);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.disabled = !open;
    b.classList.toggle("right", on && st.ok && !st.revealed);
  });
  if(k === "s4"){
    $$(".ocard", el).forEach(function(c){ c.classList.toggle("right", st.ok && !st.revealed); });
    $$(".ocard", el).forEach(function(c){
      var i = order4.indexOf(c.getAttribute("data-id"));
      $(".b-up", c).disabled = !open || i === 0;
      $(".b-down", c).disabled = !open || i === 2;
    });
    $$(".ocard", el).forEach(function(c){ c.setAttribute("draggable", open ? "true" : "false"); });
  }
  var ready = (k === "s3") ? S3_QUESTIONS.every(function(q){ return st.sel[q.id]; }) : (k === "s4" ? true : st.sel.length > 0);
  var check = $(".b-check", el);
  check.disabled = !open || !ready || st.ok;
  $(".b-retry", el).hidden = !(st.attempts > 0 || (k !== "s4" && (k === "s3" ? Object.keys(st.sel).length : st.sel.length)));
  $(".b-show", el).hidden = !(st.attempts >= CONFIG.maxAttemptsBeforeShowMe && !st.ok);
  $(".b-next", el).hidden = !st.ok;
}

/* ============================================================
   CHECKING
   ============================================================ */
function isCorrect(k){
  var st = STATE.s[k], a = CONFIG.answers[k];
  if(k === "s1" || k === "s2") return sameSet(st.sel, a);
  if(k === "s3") return S3_QUESTIONS.every(function(q){ return st.sel[q.id] === a[q.id]; });
  return order4.join() === a.join();
}
function setFeedback(k, kind, pair){
  var f = $("#fb-" + k);
  f.className = "feedback " + kind;
  f.innerHTML = '<span class="dot ' + (kind === "good" ? "g" : "y") + '" aria-hidden="true"></span>' + bi(pair);
  announce(pair[0]);
}
function clearFeedback(k){ var f = $("#fb-" + k); f.className = "feedback"; f.innerHTML = ""; }
function invalidate(k){
  var st = STATE.s[k];
  if(st.ok || st.checked){ st.ok = false; st.checked = false; st.revealed = false; }
  clearFeedback(k);
}
function doCheck(k){
  var st = STATE.s[k];
  if(!gateOpen(k)) return;
  var ready = (k === "s3") ? S3_QUESTIONS.every(function(q){ return st.sel[q.id]; }) : (k === "s4" ? true : st.sel.length > 0);
  if(!ready){ setFeedback(k, "help", k === "s3" ? MSG.chooseAll : MSG.choose); return; }
  st.checked = true;
  if(isCorrect(k)){ st.ok = true; st.revealed = false; setFeedback(k, "good", MSG.good); }
  else { st.ok = false; st.attempts++; setFeedback(k, "help", HINT[k]); }
  save(); refreshAll();
  if(st.ok) $(".b-next", $("#screen-" + k)).focus();
}
function doShow(k){
  var st = STATE.s[k], a = CONFIG.answers[k];
  if(k === "s1" || k === "s2") st.sel = a.slice();
  else if(k === "s3") st.sel = JSON.parse(JSON.stringify(a));
  else order4 = a.slice();
  st.ok = true; st.checked = true; st.revealed = true;
  if(k === "s4") renderOrder();
  setFeedback(k, "good", MSG.shown);
  save(); refreshAll();
  $(".b-next", $("#screen-" + k)).focus();
}
function doRetry(k){
  var st = STATE.s[k];
  st.sel = (k === "s3") ? {} : []; st.ok = false; st.checked = false; st.revealed = false;
  clearFeedback(k);
  if(k === "s4"){ var o; do{ o = shuffle(S4_CARDS.map(function(c){ return c.id; })); }while(o.join() === CONFIG.answers.s4.join()); order4 = o; selectedCard = null; renderOrder(); }
  else {
    /* reshuffle the choices on every Try again */
    var grid = $("#grid-" + k);
    if(k === "s1") grid.innerHTML = shuffle(S1_OPTIONS).map(function(o){ return choiceHTML(o, "s1"); }).join("");
    if(k === "s2") grid.innerHTML = shuffle(S2_OPTIONS).map(function(o){ return choiceHTML(o, "s2"); }).join("");
    if(k === "s3") renderChoices();
    setImages();
  }
  save(); refreshAll();
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function go(k){
  stopAudio();
  STATE.screen = k;
  save(); refreshAll();
  var h = $("#h-" + k); if(h){ h.focus(); }
  window.scrollTo(0, 0);
  announce((TEXT[k] ? TEXT[k].h[0] : "Listening Mission complete."));
}

/* ============================================================
   EVENTS
   ============================================================ */
function wire(){
  var main = $("#main");
  main.addEventListener("click", function(e){
    tryApi();
    var t = e.target.closest("button, li.ocard");
    if(!t) return;
    var scr = t.closest(".screen"); var k = scr ? scr.id.replace("screen-","") : null;

    if(t.classList.contains("b-play")) return playAudio();
    if(t.classList.contains("b-pause")) return pauseAudio();
    if(t.classList.contains("b-restart")) return restartAudio();
    if(t.classList.contains("b-tr")){
      var p = $("#" + t.getAttribute("aria-controls")); var show = p.hidden;
      p.hidden = !show; t.setAttribute("aria-expanded", show ? "true" : "false"); return;
    }
    if(t.classList.contains("choice")){
      if(t.disabled) return;
      var g = t.getAttribute("data-group"), id = t.getAttribute("data-id"), st = STATE.s[k];
      invalidate(k);
      if(k === "s2"){ var i = st.sel.indexOf(id); if(i === -1) st.sel.push(id); else st.sel.splice(i,1); }
      else if(k === "s1"){ st.sel = [id]; }
      else { st.sel[g] = id; }
      save(); refreshAll(); return;
    }
    if(t.classList.contains("b-check")) return doCheck(k);
    if(t.classList.contains("b-show")) return doShow(k);
    if(t.classList.contains("b-retry")) return doRetry(k);
    if(t.classList.contains("b-next")){ return go(SCREENS[SCREENS.indexOf(k) + 1]); }
    if(t.classList.contains("b-up") || t.classList.contains("b-down")){
      var li = t.closest("li"); moveCard(li.getAttribute("data-id"), t.classList.contains("b-up") ? -1 : 1, t.classList.contains("b-up") ? ".b-up" : ".b-down"); return;
    }
    if(t.classList.contains("ocard")){ selectedCard = t.getAttribute("data-id"); $$(".ocard").forEach(function(c){ c.classList.toggle("sel", c === t); }); return; }
    if(t.id === "doneBtn") return activityCompleted();
    if(t.id === "againBtn") return fullReset();
  });
  main.addEventListener("keydown", function(e){
    var li = e.target.closest && e.target.closest("li.ocard");
    if(li && e.target === li && (e.key === "ArrowUp" || e.key === "ArrowDown")){
      e.preventDefault(); moveCard(li.getAttribute("data-id"), e.key === "ArrowUp" ? -1 : 1, null);
    }
  });
  /* drag and drop */
  var dragId = null;
  main.addEventListener("dragstart", function(e){
    var li = e.target.closest && e.target.closest("li.ocard"); if(!li || !gateOpen("s4")){ e.preventDefault(); return; }
    dragId = li.getAttribute("data-id"); li.classList.add("dragging");
    try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); }catch(x){}
  });
  main.addEventListener("dragover", function(e){
    var li = e.target.closest && e.target.closest("li.ocard"); if(!li || !dragId) return;
    e.preventDefault(); $$(".ocard").forEach(function(c){ c.classList.toggle("over", c === li && c.getAttribute("data-id") !== dragId); });
  });
  main.addEventListener("drop", function(e){
    var li = e.target.closest && e.target.closest("li.ocard"); if(!li || !dragId) return;
    e.preventDefault();
    var to = order4.indexOf(li.getAttribute("data-id")), from = order4.indexOf(dragId);
    if(from !== to){ invalidate("s4"); order4.splice(from,1); order4.splice(to,0,dragId); selectedCard = dragId; save(); renderOrder(); refreshAll(); }
    dragId = null;
  });
  main.addEventListener("dragend", function(){ dragId = null; $$(".ocard").forEach(function(c){ c.classList.remove("dragging","over"); }); });

  $("#frBtn").addEventListener("click", function(){ fr = !fr; save(); refreshAll(); tryApi(); });
}
function moveCard(id, dir, btnSel){
  var i = order4.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j > 2 || !gateOpen("s4")) return;
  invalidate("s4");
  var t = order4[i]; order4[i] = order4[j]; order4[j] = t;
  selectedCard = id; save();
  renderOrder(btnSel);
  refreshAll();
  var li = $('li[data-id="' + id + '"]'); if(li) announce("Moved to position " + (j+1) + " of 3.");
}

/* ============================================================
   COMPLETION (idempotent; never downgrades an LMS status)
   ============================================================ */
function activityCompleted(){
  var allOk = AUDIO_SCREENS.every(function(s){ return STATE.s[s].ok; });
  if(!allOk) return;
  if(completionSent){ $("#doneMsg").innerHTML = bi(["Done. Well done!","Terminé. Bravo !"]); return; }
  completionSent = true;
  STATE.completed = true;
  save();
  console.log(CONFIG.logLabel);
  reportToLms();
  $("#doneMsg").innerHTML = bi(["Done. Well done!","Terminé. Bravo !"]);
  announce("Done. Well done!");
}
function fullReset(){
  stopAudio();
  var keepCompleted = completionSent;
  STATE = freshState();
  completionSent = keepCompleted;      /* an earlier completion is never withdrawn or re-sent */
  order4 = []; selectedCard = null;
  renderChoices(); AUDIO_SCREENS.forEach(clearFeedback);
  /* progress restarts, completion status is kept */
  STATE.completed = false;
  save(); go("s1");
}

/* ============================================================
   SCORM 1.2 / 2004 (silent – nothing is shown to the learner)
   ============================================================ */
var api = null, apiVersion = null, apiTried = 0;
function findApi(win){
  var seen = [], found = null;
  function look(w, depth){
    if(!w || found || depth > 10 || seen.indexOf(w) !== -1) return;
    seen.push(w);
    try{ if(w.API){ found = { a:w.API, v:"1.2" }; return; } }catch(e){}
    try{ if(w.API_1484_11){ found = { a:w.API_1484_11, v:"2004" }; return; } }catch(e){}
    var p = null, o = null;
    try{ p = w.parent; }catch(e){}
    if(p && p !== w) look(p, depth + 1);
    try{ o = w.opener; }catch(e){}
    if(!found && o && o !== w) look(o, depth + 1);
  }
  look(win, 0);
  return found;
}
function tryApi(){
  if(api || apiTried > 20) return;
  apiTried++;
  try{
    var f = findApi(window); if(!f) return;
    var ok = (f.v === "1.2") ? f.a.LMSInitialize("") : f.a.Initialize("");
    if(ok === true || ok === "true"){
      api = f.a; apiVersion = f.v;
      var st = (apiVersion === "1.2") ? api.LMSGetValue("cmi.core.lesson_status") : api.GetValue("cmi.completion_status");
      if(st === "completed" || st === "passed"){ lmsReported = true; }
      if(STATE.completed && !lmsReported) reportToLms();
    }
  }catch(e){ api = null; }
}
function reportToLms(){
  if(lmsReported || !STATE.completed) return;
  tryApi();
  if(!api) return;
  try{
    if(apiVersion === "1.2"){ api.LMSSetValue("cmi.core.lesson_status","completed"); api.LMSCommit(""); }
    else { api.SetValue("cmi.completion_status","completed"); api.SetValue("cmi.success_status","passed"); api.Commit(""); }
    lmsReported = true; save();
  }catch(e){}
}

/* ============================================================
   INIT
   ============================================================ */
load();
buildAll();
initAudio();
tryApi();
/* restore selection highlights and screen */
refreshAll();
if(STATE.screen !== "s1"){ var h0 = $("#h-" + STATE.screen); if(h0) h0.setAttribute("tabindex","-1"); }
window.addEventListener("beforeunload", function(){ try{ if(api && lmsReported){ (apiVersion === "1.2") ? api.LMSCommit("") : api.Commit(""); } }catch(e){} });
})();
</script>
