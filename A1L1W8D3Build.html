<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical speaking check and feedback - Step 4: Build Useful English</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#D7F1F7;
  --green-tint:#F4F7DA;
  --yellow-tint:#FEF3CD;
  --cream:#FFF8EE;
  --white:#FFFFFF;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  color:var(--pazapa-grey-dark);
  background:var(--white);
  font-size:16px;line-height:1.5;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;line-height:1.25;margin:0 0 8px 0;}
h1{font-size:21px;}
h2{font-size:24px;}
h3{font-size:17px;}
p{margin:0 0 10px 0;}
.app{max-width:820px;margin:0 auto;padding:16px 16px 48px 16px;}

/* French support */
.fr{display:none;}
body.fr-on .fr{display:block;font-size:.92em;font-style:italic;margin-top:2px;font-weight:400;}
body.fr-on button .fr,body.fr-on .tag .fr,body.fr-on .num .fr{display:inline;margin:0;}
body.fr-on button .fr::before{content:" \00b7 ";font-style:normal;}
body.fr-on .en{display:inline;}
.en{display:inline;}
.blockfr .en{display:block;}

/* Top bar */
.top-bar{border-bottom:4px solid var(--pazapa-blue);padding-bottom:10px;margin-bottom:18px;}
.brandline{font-size:12px;font-weight:700;letter-spacing:.03em;margin-bottom:4px;}
.top-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;}
.eyebrow{font-size:13px;font-weight:700;}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-track{width:110px;height:10px;background:var(--pazapa-grey-light);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--pazapa-blue);width:16.6%;transition:width .3s ease;}
.progress-label{font-size:12px;font-weight:700;white-space:nowrap;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

/* Buttons */
button{
  font-family:inherit;font-size:16px;font-weight:700;color:var(--pazapa-grey-dark);
  background:var(--white);border:2px solid var(--pazapa-grey-dark);border-radius:999px;
  min-height:48px;min-width:48px;padding:10px 22px;cursor:pointer;touch-action:manipulation;
}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px;box-shadow:0 0 0 6px var(--white);}
button.primary{background:var(--pazapa-blue);border-color:var(--pazapa-blue);}
button.primary:hover{filter:brightness(.95);}
button.primary:disabled,button:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6a6a69;cursor:not-allowed;}
button.ghost{background:var(--white);}
button.help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
button.langbtn[aria-pressed="true"]{background:var(--pazapa-grey-dark);color:var(--white);}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}

/* Screens */
.screen{display:none;}
.screen.active{display:block;}
.lead{font-size:17px;}
.statusline{margin-top:14px;font-weight:700;min-height:26px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
ul.items,ol.items{list-style:none;margin:0;padding:0;display:grid;gap:16px;}

/* Screen 1: pattern strips */
.goal-box{background:var(--blue-tint);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;}
.goal-box .label{font-size:13px;font-weight:700;}
.goal-box .goal-text{font-size:18px;font-weight:800;}
.strip{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;border:2px solid var(--pazapa-grey-light);border-left:10px solid var(--pazapa-blue);border-radius:var(--radius);padding:12px;background:var(--white);}
.strip:nth-child(even){border-left-color:var(--pazapa-green);}
.strip:nth-child(3){border-left-color:var(--pazapa-yellow);}
.pic{background:var(--cream);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pic img{width:100%;height:auto;max-height:150px;object-fit:contain;display:block;}
.tag{display:inline-block;font-size:12px;font-weight:800;background:var(--blue-tint);border-radius:999px;padding:2px 12px;margin-bottom:6px;}
.phrase{font-size:21px;font-weight:800;margin:0;}
.swap{border-bottom:3px dashed var(--pazapa-grey-dark);background:var(--yellow-tint);padding:0 6px;border-radius:6px 6px 0 0;}
.change{font-size:14px;margin:4px 0 0 0;}
.observe{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 18px;margin-top:18px;font-weight:700;}
@media (max-width:560px){.strip{grid-template-columns:1fr;}.pic img{max-height:170px;}}

/* Item cards (screens 2-5) */
.item{border:2px solid var(--pazapa-grey-light);border-radius:var(--radius);padding:14px;background:var(--white);}
.item.ok{border-color:var(--pazapa-green);background:var(--green-tint);}
.item.retry{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
.item.shown{border-color:var(--pazapa-blue);background:var(--blue-tint);}
.itemhead{display:grid;grid-template-columns:44px 96px 1fr;gap:12px;align-items:center;margin-bottom:10px;}
.itemhead .pic img{max-height:80px;}
.num{width:40px;height:40px;border-radius:50%;background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-weight:800;display:flex;align-items:center;justify-content:center;}
.ctx{font-weight:700;margin:0;}
@media (max-width:480px){.itemhead{grid-template-columns:40px 1fr;}.itemhead .pic{grid-column:1 / -1;order:3;}.itemhead .pic img{max-height:120px;}}
.fb{margin-top:10px;font-weight:700;}
.fb .icon{display:inline-block;min-width:22px;font-weight:800;}
.fb .modeltext{font-weight:400;}
.fbrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}

/* Build the sentences */
.answer-line{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;background:var(--blue-tint);border:2px dashed var(--pazapa-blue);border-radius:12px;align-items:center;}
.answer-line .placeholder{font-size:14px;margin:0;}
.bank-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;background:var(--pazapa-grey-light);border-radius:12px;min-height:60px;}
.chunk{background:var(--white);border-color:var(--pazapa-blue);}
.chunk:hover{background:var(--blue-tint);}
.placedgroup{display:inline-flex;align-items:center;gap:4px;background:var(--pazapa-blue);border-radius:999px;padding:2px;}
.placedgroup .chunk{border-color:var(--pazapa-blue);background:var(--pazapa-blue);padding:8px 14px;}
.placedgroup .mv{background:var(--white);border:2px solid var(--pazapa-grey-dark);padding:0;width:48px;}
.sentence-so-far{font-size:13px;margin:6px 0 0 0;}

/* Complete: gaps + word bank in two columns */
.cols{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start;}
@media (max-width:640px){.cols{grid-template-columns:1fr;}}
.bankcard{border:2px solid var(--pazapa-yellow);background:var(--yellow-tint);border-radius:var(--radius);padding:14px;position:sticky;top:8px;}
@media (max-width:640px){.bankcard{position:static;order:-1;}}
.bankwords{display:flex;flex-wrap:wrap;gap:8px;}
.bankwords button{background:var(--white);border-color:var(--pazapa-grey-dark);}
.gapline{font-size:19px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;}
.gapline input{font-family:inherit;font-size:18px;font-weight:700;min-height:48px;width:160px;max-width:100%;border:2px solid var(--pazapa-grey-dark);border-radius:10px;padding:6px 10px;color:var(--pazapa-grey-dark);background:var(--white);}
.gapline input.active{border-color:var(--pazapa-blue);box-shadow:0 0 0 4px var(--blue-tint);}
.cluebox{font-size:15px;margin:0 0 4px 0;}

/* Choose the best response */
fieldset{border:0;margin:0;padding:0;min-width:0;}
legend{padding:0;font-weight:800;font-size:17px;margin-bottom:8px;}
.optlist{display:grid;gap:10px;margin-top:8px;}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;border:2px solid var(--pazapa-blue);border-radius:12px;padding:10px 14px;background:var(--white);cursor:pointer;font-weight:700;}
.opt:hover{background:var(--blue-tint);}
.opt input{width:24px;height:24px;margin:0;flex:0 0 auto;accent-color:var(--pazapa-grey-dark);}
.opt.picked{background:var(--blue-tint);}
.opt:focus-within{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px;}

/* Application */
.part{border:2px solid var(--pazapa-grey-light);border-left:10px solid var(--pazapa-blue);border-radius:var(--radius);padding:14px;background:var(--white);}
.part.ok{border-color:var(--pazapa-green);background:var(--green-tint);}
.part.retry{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
.part.shown{border-color:var(--pazapa-blue);background:var(--blue-tint);}
.parthead{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
.mistake{background:var(--pazapa-grey-light);border-radius:10px;padding:10px 14px;font-weight:800;font-size:19px;display:inline-block;margin:4px 0 8px 0;}
.mistake .bad{text-decoration:underline wavy;text-underline-offset:4px;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0;}
.row label{font-weight:700;}
.row input[type=text],.row select{font-family:inherit;font-size:17px;font-weight:700;min-height:48px;border:2px solid var(--pazapa-grey-dark);border-radius:10px;padding:6px 10px;color:var(--pazapa-grey-dark);background:var(--white);max-width:100%;}
.chip{background:var(--white);border-color:var(--pazapa-blue);padding:8px 16px;}
.preview{font-size:19px;font-weight:800;background:var(--blue-tint);border-radius:10px;padding:12px 16px;margin:10px 0;}
.modelbox{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:8px;padding:10px 14px;margin-top:10px;font-weight:700;}

/* Completion */
.recap{background:var(--blue-tint);border-radius:var(--radius);padding:18px;margin:14px 0;}
.recap .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.recap .pic img{max-height:110px;}
.recap ul{margin:6px 0 0 0;padding-left:20px;}
.confirm-panel{background:var(--yellow-tint);border-radius:var(--radius);padding:16px 18px;margin-top:14px;}
.confirm-panel p{font-weight:700;margin:0 0 10px 0;}
.donenote{margin-top:12px;font-weight:700;min-height:24px;}
</style>
</head>

</div>

  runtime.s3bank = shuffle(CFG.s3.bank.map(function(w,i){ return i; }));
  runtime.s4order = CFG.s4.map(function(cfg){ return shuffle(cfg.opts.map(function(o,i){ return i; })); });
  runtime.s5p1order = shuffle(CFG.s5.p1.opts.map(function(o,i){ return i; }));
  runtime.activeGap = 0;
  runtime.p3help = false;
}

/* ---------- correctness ---------- */
function s2Text(i){ var cfg=CFG.s2[i]; return S.s2[i].r.map(function(ix){ return cfg.chunks[ix]; }).join(' '); }
function s2Correct(i){
  var cfg=CFG.s2[i];
  if(S.s2[i].r.length !== cfg.chunks.length) return false;
  var t = norm(s2Text(i));
  return cfg.valid.some(function(v){ return norm(v) === t; });
}
function s2FirstBad(i){
  var cfg=CFG.s2[i], mine = S.s2[i].r.map(function(ix){ return cfg.chunks[ix]; }), best = 99;
  cfg.valid.forEach(function(v){
    var vt = norm(v), pos = 0, k;
    for(k=0;k<mine.length;k++){ var prefix = norm(mine.slice(0,k+1).join(' ')); if(vt.indexOf(prefix) === 0){ pos = k+1; } else { break; } }
    var bad = pos + 1; if(bad < best) best = bad;
  });
  return Math.min(best, cfg.chunks.length);
}
function s3Correct(i){ var v = norm(S.s3[i].r); return CFG.s3.items[i].answers.some(function(a){ return norm(a) === v; }); }
function s4Correct(i){ var r=S.s4[i].r; return r !== null && CFG.s4[i].opts[r] && CFG.s4[i].opts[r].ok === 1; }
function p1Correct(){ var r=S.s5.p1.r; return r !== null && CFG.s5.p1.opts[r] && CFG.s5.p1.opts[r].ok === 1; }
function p2Correct(){ return S.s5.p2.r === CFG.s5.p2.right; }
function nameOk(n){ return /^[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ' \-]{0,23}$/.test(String(n||'').trim()); }
function dayOk(d){ return CFG.s5.p3.days.indexOf(d) !== -1; }
function p3Correct(){ var r=S.s5.p3.r; return nameOk(r.name) && dayOk(r.day); }

function itemsOf(k){
  if(k==='s5') return [ {it:S.s5.p1, ok:p1Correct}, {it:S.s5.p2, ok:p2Correct}, {it:S.s5.p3, ok:p3Correct} ];
  var list = S[k], fn = {s2:s2Correct, s3:s3Correct, s4:s4Correct}[k];
  return list.map(function(it,i){ return {it:it, ok:function(){ return fn(i); }}; });
}
function itemDone(o){ return !!o.it.x || (!!o.it.c && o.ok()); }
function screenValid(n){
  if(n === 1) return true;
  if(n === 6) return screenValid(2) && screenValid(3) && screenValid(4) && screenValid(5);
  var k = 's' + n;
  return itemsOf(k).every(itemDone);
}
function itemState(o){
  if(o.it.x) return 'shown';
  if(!o.it.c) return 'none';
  return o.ok() ? 'ok' : 'retry';
}

/* ---------- persistence ---------- */
function compactState(){
  return {
    v:STATE_VERSION, s:S.screen, d:S.d,
    a:S.s2.map(function(it){ return [it.r, it.a, it.x, it.c]; }),
    b:S.s3.map(function(it){ return [it.r, it.a, it.x, it.c]; }),
    c:S.s4.map(function(it){ return [it.r, it.a, it.x, it.c]; }),
    e:[ [S.s5.p1.r, S.s5.p1.a, S.s5.p1.x, S.s5.p1.c], [S.s5.p2.r, S.s5.p2.a, S.s5.p2.x, S.s5.p2.c], [[S.s5.p3.r.name, S.s5.p3.r.day], S.s5.p3.a, S.s5.p3.x, S.s5.p3.c] ]
  };
}
function loadCompact(raw){
  var st = freshState();
  if(!raw || typeof raw !== 'object' || raw.v !== STATE_VERSION) return st;
  function num(n, max){ n = Math.floor(Number(n)); return (isFinite(n) && n >= 0) ? Math.min(n, max) : 0; }
  function flag(f){ return f ? 1 : 0; }
  function fill(target, src, cleanR){
    if(!Array.isArray(src)) return;
    for(var i=0;i<target.length;i++){
      var row = src[i]; if(!Array.isArray(row)) continue;
      target[i].r = cleanR(row[0], i); target[i].a = num(row[1], 9); target[i].x = flag(row[2]); target[i].c = flag(row[3]);
    }
  }
  fill(st.s2, raw.a, function(r,i){
    var cfg = CFG.s2[i], seen = {}, out = [];
    if(!Array.isArray(r)) return [];
    r.forEach(function(ix){ if(typeof ix==='number' && ix>=0 && ix<cfg.chunks.length && !seen[ix]){ seen[ix]=1; out.push(ix); } });
    return out;
  });
  fill(st.s3, raw.b, function(r){ return (typeof r === 'string') ? r.slice(0,30) : ''; });
  fill(st.s4, raw.c, function(r,i){ return (typeof r === 'number' && r>=0 && r<CFG.s4[i].opts.length) ? Math.floor(r) : null; });
  if(Array.isArray(raw.e)){
    var tmp = [st.s5.p1, st.s5.p2, st.s5.p3];
    [0,1,2].forEach(function(i){
      var row = raw.e[i]; if(!Array.isArray(row)) return;
      var r = row[0];
      if(i === 0) r = (typeof r==='number' && r>=0 && r<CFG.s5.p1.opts.length) ? Math.floor(r) : null;
      if(i === 1) r = (CFG.s5.p2.opts.indexOf(r) !== -1) ? r : null;
      if(i === 2){
        r = Array.isArray(r) ? {name:String(r[0]||'').slice(0,24), day:dayOk(r[1]) ? r[1] : ''} : {name:'',day:''};
      }
      tmp[i].r = r; tmp[i].a = num(row[1], 9); tmp[i].x = flag(row[2]); tmp[i].c = flag(row[3]);
    });
  }
  /* revalidate against the current answer configuration: only keep "checked" where it still holds */
  ['s2','s3','s4'].forEach(function(k){
    var fn = {s2:s2Correct, s3:s3Correct, s4:s4Correct}[k];
    var prev = S; S = st;
    st[k].forEach(function(it,i){ if(it.c && !it.x && !fn(i)){ /* a wrong check stays as it was */ } });
    S = prev;
  });
  st.s = null;
  st.screen = 1; st.d = flag(raw.d);
  var saved = (typeof raw.s === 'number') ? Math.floor(raw.s) : 1;
  var prevS = S; S = st;
  var reach = 1;
  for(var n=2;n<=5;n++){ if(screenValid(n)){ reach = n; } else { break; } }
  var maxScreen = (reach === 5 || (reach>=2 && screenValid(2) && screenValid(3) && screenValid(4) && screenValid(5))) ? 6 : reach;
  /* reach is the last valid screen in a row; learner may sit on the next one */
  var firstInvalid = 0;
  for(var m=2;m<=5;m++){ if(!screenValid(m)){ firstInvalid = m; break; } }
  maxScreen = firstInvalid === 0 ? 6 : firstInvalid;
  if(!(saved >= 1 && saved <= TOTAL)) saved = 1;
  st.screen = Math.min(saved, maxScreen);
  if(st.d && maxScreen !== 6){ st.d = 0; }
  S = prevS;
  return st;
}

/* ---------- LMS (silent) ---------- */
var lms = { api:null, ver:null, locked:false, inited:false };
function probe(win, name){
  var hops = 0;
  while(win && hops < 12){
    try{ if(win[name]) return win[name]; }catch(e){ return null; }
    var p = null;
    try{ p = win.parent; }catch(e2){ return null; }
    if(!p || p === win) break;
    win = p; hops++;
  }
  return null;
}
function detectApi(){
  if(lms.locked) return;
  var wins = [window];
  try{ if(window.opener && !window.opener.closed) wins.push(window.opener); }catch(e){}
  for(var i=0;i<wins.length;i++){
    var a = probe(wins[i], 'API_1484_11');
    if(a){ lms.api = a; lms.ver = '2004'; lms.locked = true; return; }
    a = probe(wins[i], 'API');
    if(a){ lms.api = a; lms.ver = '1.2'; lms.locked = true; return; }
  }
}
function lmsCall(name, a, b){
  try{ if(!lms.api || typeof lms.api[name] !== 'function') return ''; return (b === undefined) ? lms.api[name](a) : lms.api[name](a, b); }catch(e){ return ''; }
}
function lmsInit(){
  if(!lms.api || lms.inited) return;
  lms.inited = true;
  lmsCall(lms.ver === '2004' ? 'Initialize' : 'LMSInitialize', '');
}
function lmsGet(el){ return String(lmsCall(lms.ver === '2004' ? 'GetValue' : 'LMSGetValue', el) || ''); }
function lmsSet(el, v){ return String(lmsCall(lms.ver === '2004' ? 'SetValue' : 'LMSSetValue', el, v)) === 'true'; }
function lmsCommit(){ return String(lmsCall(lms.ver === '2004' ? 'Commit' : 'LMSCommit', '')) === 'true'; }
function lmsStatus(){
  if(!lms.api) return '';
  return lms.ver === '2004' ? lmsGet('cmi.completion_status') : lmsGet('cmi.core.lesson_status');
}
function saveProgress(){
  var json;
  try{ json = JSON.stringify(compactState()); }catch(e){ return; }
  try{ window.localStorage.setItem(STORE_KEY, json); }catch(e2){}
  detectApi();
  if(lms.api && json.length < 3500){
    lmsInit();
    lmsSet(lms.ver === '2004' ? 'cmi.suspend_data' : 'cmi.suspend_data', json);
    lmsCommit();
  }
}
function loadProgress(){
  var raw = null;
  detectApi();
  if(lms.api){
    lmsInit();
    try{ var sd = lmsGet('cmi.suspend_data'); if(sd) raw = JSON.parse(sd); }catch(e){ raw = null; }
  }
  if(!raw){
    try{ var ls = window.localStorage.getItem(STORE_KEY); if(ls) raw = JSON.parse(ls); }catch(e2){ raw = null; }
  }
  return loadCompact(raw);
}
function clearProgress(){
  try{ window.localStorage.removeItem(STORE_KEY); }catch(e){}
  detectApi();
  if(lms.api){ lmsInit(); lmsSet('cmi.suspend_data', ''); lmsCommit(); }
}
function submitCompletion(){
  detectApi();
  if(!lms.api){ return true; }
  lmsInit();
  var current = lmsStatus();
  if(current === 'completed' || current === 'passed'){ return true; } /* never downgrade */
  var ok;
  if(lms.ver === '2004'){ ok = lmsSet('cmi.completion_status', 'completed'); }
  else { ok = lmsSet('cmi.core.lesson_status', 'completed'); }
  var committed = lmsCommit();
  var after = lmsStatus();
  return (ok && committed) || after === 'completed' || after === 'passed';
}
function activityCompleted(){
  if(runtime.completionSent) return;
  if(!screenValid(6)) return;
  var ok = submitCompletion();
  S.d = 1;
  saveProgress();
  if(ok){ runtime.completionSent = true; }
  try{ console.log('W08D3 Build Useful English completed'); }catch(e){}
}

  h += '<p class="lead">' + T('Read each situation. Choose the most useful thing to say.','Lisez chaque situation. Choisissez la phrase la plus utile.') + '</p>';
  h += '<ol class="items" id="s4list"></ol>' + screenButtons(4, true);
  $('screen4').innerHTML = h;
}
function optionsHtml(name, opts, order, current, locked, fk){
  var h = '<div class="optlist">';
  order.forEach(function(oi){
    var id = name + '-' + oi;
    h += '<label class="opt' + (current === oi ? ' picked' : '') + '" for="' + id + '"><input type="radio" id="' + id + '" name="' + name + '" value="' + oi + '" data-fk="' + fk + '-' + oi + '"' + (current === oi ? ' checked' : '') + (locked ? ' disabled' : '') + '><span>' + esc(opts[oi].t) + '</span></label>';
  });
  return h + '</div>';
}
function renderS4(){
  var h = '';
  CFG.s4.forEach(function(cfg,i){
    var it = S.s4[i], st = itemState({it:it, ok:function(){ return s4Correct(i); }});
    h += '<li class="item ' + (st==='none'?'':st) + '" id="s4i' + i + '">';
    h += '<fieldset><legend><span class="num" style="display:inline-flex;margin-right:10px" aria-hidden="true">' + (i+1) + '</span>' + T(cfg.q[0], cfg.q[1]) + '</legend>';
    h += pic(cfg.img);
    h += optionsHtml('q' + i, cfg.opts, runtime.s4order[i], it.r, !!it.x, 's4-' + i);
    h += '</fieldset>';
    var msg = '';
    var goodText = cfg.opts.filter(function(o){ return o.ok; })[0].t;
    if(it.x){ msg = modelBlock(goodText) + '<br><span class="modeltext">' + T(cfg.why[0], cfg.why[1]) + '</span>'; }
    else if(st === 'ok'){ msg = T('Correct. ','Correct. ') + '<span class="modeltext">' + T(cfg.why[0], cfg.why[1]) + '</span>'; }
    else if(st === 'retry'){ msg = T('Not this one. ','Pas celle-ci. ') + '<span class="modeltext">' + T(cfg.hint[0], cfg.hint[1]) + '</span>'; }
    h += '<div class="fb fbrow" id="s4f' + i + '">' + fbHtml(st, msg);
    if(st === 'retry' && it.a >= 2 && !it.x){ h += showMeBtn('s4', i); }
    h += '</div></li>';
  });
  $('s4list').innerHTML = h;
  updateScreenUi(4);
  finishFocus();
}

/* ---------- SCREEN 5 ---------- */

  h += '<div class="items" id="s5list"></div>' + screenButtons(5, true);
  $('screen5').innerHTML = h;
}
function partHead(n, en, fr){ return '<div class="parthead"><span class="num" aria-hidden="true">' + n + '</span><h3 style="margin:0">' + T(en, fr) + '</h3></div>'; }
function partCls(st){ return 'part' + (st === 'none' ? '' : ' ' + st); }
function renderS5(){
  var c = CFG.s5, p = S.s5, h = '';
  /* part 1 */
  var st1 = itemState({it:p.p1, ok:p1Correct});
  h += '<div class="' + partCls(st1) + '" id="s5p1"><fieldset>' + partHead(1, 'Choose the useful question', 'Choisissez la question utile');
  h += optionsHtml('p1', c.p1.opts, runtime.s5p1order, p.p1.r, !!p.p1.x, 's5-p1');
  h += '</fieldset>';

  var good1 = c.p1.opts.filter(function(o){ return o.ok; })[0].t;

  h += '<div class="fb fbrow" id="s5f1">' + fbHtml(st1, m1);

  var m2 = '';
  if(p.p2.x){ m2 = modelBlock(c.p2.model); }
  else if(st2 === 'ok'){ m2 = T('Correct. ','Correct. ') + '<span class="modeltext">' + esc(c.p2.model) + '</span>'; }
  else if(st2 === 'retry'){ m2 = T('Not yet. Think about a day: Monday, Friday. Which small word do we use?','Pas encore. Pensez à un jour : lundi, vendredi. Quel petit mot utilise-t-on ?'); }
  h += '<div class="fb fbrow" id="s5f2">' + fbHtml(st2, m2);
  if(st2 === 'retry' && p.p2.a >= 2 && !p.p2.x){ h += showMeBtn('s5', 2); }
  h += '</div></div>';

  var st3 = itemState({it:p.p3, ok:p3Correct});
  var r3 = p.p3.r;
  h += '<div class="' + partCls(st3) + '" id="s5p3">' + partHead(3, 'Now write your own two sentences', 'Maintenant, écrivez vos deux phrases');
  h += '<p class="cluebox">' + T('Use any name you like. Choose a day.','Utilisez le prénom de votre choix. Choisissez un jour.') + '</p>';

  h += '<div class="row" role="group" aria-label="Name ideas">';
  c.p3.names.forEach(function(n){ h += '<button type="button" class="chip" data-act="pname" data-w="' + n + '" data-fk="s5-p3-n' + n + '"' + (p.p3.x?' disabled':'') + '>' + n + '</button>'; });
  h += '</div>';
  h += '<div class="row"><label for="p3day">' + T('Can we meet on','Can we meet on') + '</label><select id="p3day" data-fk="s5-p3-day"' + (p.p3.x?' disabled':'') + '><option value="">' + '—' + '</option>';
  c.p3.days.forEach(function(d){ h += '<option value="' + d + '"' + (r3.day === d ? ' selected' : '') + '>' + d + '</option>'; });
  h += '</select><span aria-hidden="true">?</span></div>';
  h += '<div class="preview">' + esc('Hello, my name is ' + (r3.name.trim() || '___') + '. Can we meet on ' + (r3.day || '___') + '?') + '</div>';
  var m3 = '';
  if(p.p3.x){ m3 = modelBlock('Hello, my name is ' + c.p3.modelName + '. Can we meet on ' + c.p3.modelDay + '?'); }
  else if(st3 === 'ok'){ m3 = T('Correct. You said who you are and chose a day.','Correct. Vous avez dit qui vous êtes et choisi un jour.'); }

  }
  h += '<div class="fb fbrow" id="s5f3">' + fbHtml(st3, m3);
  if(st3 === 'retry' && p.p3.a >= 2 && !p.p3.x){ h += showMeBtn('s5', 3); }
  if(!p.p3.x){ h += '<button class="help" type="button" data-act="p3help">' + T('Need help?','Besoin d’aide ?') + '</button>'; }
  h += '</div>';
  if(runtime.p3help && !p.p3.x){
    h += '<div class="modelbox">' + T('Model: ','Modèle : ') + esc('Hello, my name is ' + c.p3.modelName + '. Can we meet on ' + c.p3.modelDay + '?') + '</div>';
  }
  h += '</div>';
  $('s5list').innerHTML = h;
  updateScreenUi(5);
  finishFocus();
}

}
function refreshDone(){
  var btn = $('doneBtn'); if(!btn) return;
  var ready = (S.screen === 6) && screenValid(6);
  if(runtime.completionSent){
    btn.disabled = true; btn.innerHTML = T('Done ✓','Terminé ✓');
    $('doneNote').innerHTML = T('Well done! You have completed this activity.','Bravo ! Vous avez terminé cette activité.');
  } else {
    btn.disabled = !ready; btn.innerHTML = BTN.done;
    $('doneNote').innerHTML = '';
  }
}
function onDone(){
  if(runtime.completionSent) return;
  if(!(S.screen === 6 && screenValid(6))) return;
  activityCompleted();
  refreshDone();
  /* if the LMS did not confirm yet, the learner still sees success and can press again */
  var btn = $('doneBtn');
  if(!runtime.completionSent){
    btn.disabled = false; btn.innerHTML = BTN.done;
    $('doneNote').innerHTML = T('Well done! You have completed this activity.','Bravo ! Vous avez terminé cette activité.');
  }
  announce('Activity completed.');
}

/* ---------- navigation ---------- */
function goTo(n){
  if(n < 1 || n > TOTAL) return;
  if(n >= 3 && !screenValid(n-1)) return;
  if(n === 6 && !screenValid(6)) return;
  var cur = $('screen' + S.screen); if(cur){ cur.classList.remove('active'); }
  S.screen = n;
  var nxt = $('screen' + n); nxt.classList.add('active');
  $('progressFill').style.width = (n / TOTAL * 100) + '%';
  $('progressLabel').textContent = 'Screen ' + n + ' of ' + TOTAL;
  var pw = $('progressWrap'); pw.setAttribute('aria-valuenow', String(n)); pw.setAttribute('aria-valuetext', 'Screen ' + n + ' of ' + TOTAL);
  if(n === 2) renderS2();
  if(n === 3) renderS3();
  if(n === 4) renderS4();
  if(n === 5) renderS5();
  if(n === 6) refreshDone();
  var hd = nxt.querySelector('h2'); if(hd){ hd.setAttribute('tabindex','-1'); hd.focus(); }
  window.scrollTo(0, 0);
  announce('Screen ' + n + ' of ' + TOTAL + '. ' + (hd ? hd.textContent.split('·')[0] : ''));
  saveProgress();
}

/* ---------- checking ---------- */
function checkScreen(n){
  var k = 's' + n, items = itemsOf(k), anyEmpty = false, wrong = 0, right = 0;
  items.forEach(function(o, idx){
    if(o.it.x){ right++; return; }
    var empty = false;
    if(k === 's2') empty = S.s2[idx].r.length < CFG.s2[idx].chunks.length;
    if(k === 's3') empty = norm(S.s3[idx].r) === '';
    if(k === 's4') empty = S.s4[idx].r === null;
    if(k === 's5'){
      if(idx === 0) empty = S.s5.p1.r === null;
      if(idx === 1) empty = S.s5.p2.r === null;
      if(idx === 2) empty = (String(S.s5.p3.r.name).trim() === '' && S.s5.p3.r.day === '');
    }
    if(empty){ anyEmpty = true; o.it.c = 0; return; }
    o.it.c = 1;
    if(o.ok()){ right++; } else { o.it.a += 1; wrong++; }
  });
  saveProgress();
  render(n);
  var stat = $('stat' + n);
  if(anyEmpty && stat){
    var extra = '<span class="icon" aria-hidden="true">!</span>' + T('Finish every item first, then press Check.','Terminez chaque exercice d’abord, puis appuyez sur Vérifier.');
    if(stat.innerHTML.indexOf('icon') === -1 || !itemsOf(k).every(itemDone)){ stat.innerHTML = extra; }
  }
  var total = items.length;
  announce(wrong === 0 && !anyEmpty ? 'All ' + total + ' correct. You can continue.' : (anyEmpty ? 'Some items are not finished.' : right + ' of ' + total + ' correct. Check the marked parts and try again.'));
}
function render(n){ if(n===2) renderS2(); if(n===3) renderS3(); if(n===4) renderS4(); if(n===5) renderS5(); }
function resetScreen(n){
  var k = 's' + n;
  if(k === 's2'){ S.s2 = CFG.s2.map(function(){ return mk([]); }); runtime.s2bank = CFG.s2.map(function(cfg){ var idx=cfg.chunks.map(function(c,i){return i;}); var sh=shuffle(idx),t=0; while(sh.join(',')===idx.join(',')&&t<10){sh=shuffle(idx);t++;} return sh; }); }
  if(k === 's3'){ S.s3 = CFG.s3.items.map(function(){ return mk(''); }); runtime.s3bank = shuffle(CFG.s3.bank.map(function(w,i){ return i; })); runtime.activeGap = 0; }
  if(k === 's4'){ S.s4 = CFG.s4.map(function(){ return mk(null); }); runtime.s4order = CFG.s4.map(function(cfg){ return shuffle(cfg.opts.map(function(o,i){ return i; })); }); }
  if(k === 's5'){ S.s5 = { p1:mk(null), p2:mk(null), p3:mk({name:'',day:''}) }; runtime.s5p1order = shuffle(CFG.s5.p1.opts.map(function(o,i){ return i; })); runtime.p3help = false; }
  S.d = 0;
  saveProgress();
  render(n);
  announce('This screen has been reset.');
}
function resetAll(){
  S = freshState();
  runtime.completionSent = false;
  initRuntime();
  clearProgress();
  buildS2Shell(); buildS3Shell(); buildS4Shell(); buildS5Shell(); buildS6();
  applyLang(document.body.classList.contains('fr-on'));
  var cur = $('screen' + S.screen);
  Array.prototype.forEach.call(document.querySelectorAll('.screen'), function(s){ s.classList.remove('active'); });
  S.screen = 0;
  goTo(1);
  announce('The activity has started again.');
}

/* ---------- events ---------- */
function onClick(e){
  var t = e.target; var b = t.closest ? t.closest('[data-act]') : null;
  if(!b) return;
  var act = b.getAttribute('data-act');
  var scr = b.closest ? b.closest('.screen') : null;
  var n = scr ? parseInt(scr.id.replace('screen',''), 10) : 0;
  var i = parseInt(b.getAttribute('data-i'), 10);
  if(act === 'next'){ if(n === 1){ goTo(2); } else if(screenValid(n)){ goTo(n+1); } return; }
  if(act === 'check'){ checkScreen(n); return; }
  if(act === 'reset'){ resetScreen(n); return; }
  if(act === 'add'){
    var it = S.s2[i]; if(!touch(it)) return;
    var ix = parseInt(b.getAttribute('data-ix'), 10);
    if(it.r.indexOf(ix) === -1){ it.r.push(ix); }
    runtime.focusKey = 's2-' + i + '-c' + (it.r.length - 1);
    saveProgress(); renderS2();
    announce('Added ' + CFG.s2[i].chunks[ix] + ', position ' + it.r.length + ' of ' + CFG.s2[i].chunks.length + '.');
    return;
  }
  if(act === 'rem'){
    var it2 = S.s2[i]; if(!touch(it2)) return;
    var pos = parseInt(b.getAttribute('data-pos'), 10);
    var removed = CFG.s2[i].chunks[it2.r[pos]];
    var ixr = it2.r.splice(pos, 1)[0];
    runtime.focusKey = 's2-' + i + '-b' + ixr;
    saveProgress(); renderS2();
    announce('Removed ' + removed + '.');
    return;
  }
  if(act === 'mvl' || act === 'mvr'){
    var it3 = S.s2[i]; if(!touch(it3)) return;
    var p = parseInt(b.getAttribute('data-pos'), 10), q = act === 'mvl' ? p - 1 : p + 1;
    if(q < 0 || q >= it3.r.length) return;
    var tmp = it3.r[p]; it3.r[p] = it3.r[q]; it3.r[q] = tmp;
    runtime.focusKey = 's2-' + i + '-' + (act === 'mvl' ? 'l' : 'r') + q;
    saveProgress(); renderS2();
    var el = document.querySelector('[data-fk="' + 's2-' + i + '-' + (act === 'mvl' ? 'l' : 'r') + q + '"]');
    if(el && el.disabled){ var alt = document.querySelector('[data-fk="s2-' + i + '-c' + q + '"]'); if(alt) alt.focus(); }
    announce(CFG.s2[i].chunks[it3.r[q]] + ' is now position ' + (q+1) + ' of ' + it3.r.length + '.');
    return;
  }
  if(act === 'word'){
    var w = b.getAttribute('data-w');
    var g = runtime.activeGap;
    if(S.s3[g].x){
      for(var k2=0;k2<S.s3.length;k2++){ if(!S.s3[k2].x){ g = k2; break; } }
    }
    var it4 = S.s3[g]; if(!touch(it4)) return;
    it4.r = w;
    var nextEmpty = -1;
    for(var m=1;m<=S.s3.length;m++){ var cand=(g+m)%S.s3.length; if(!S.s3[cand].x && norm(S.s3[cand].r) === ''){ nextEmpty = cand; break; } }
    runtime.activeGap = nextEmpty === -1 ? g : nextEmpty;
    runtime.focusKey = 's3-' + runtime.activeGap;
    saveProgress(); renderS3();
    announce('Word ' + w + ' placed in gap ' + (g+1) + '.');
    return;
  }
  if(act === 'show'){
    var scrKey = b.getAttribute('data-scr');
    var target = null;
    if(scrKey === 's2'){ target = S.s2[i]; target.r = CFG.s2[i].valid[0].split(' ').length ? (function(){ var cfg=CFG.s2[i]; var want = norm(cfg.valid[0]); var order = []; var used = {}; var parts = cfg.chunks; var perm = permute(parts.map(function(c,x){return x;})).filter(function(pm){ return norm(pm.map(function(z){return parts[z];}).join(' ')) === want; })[0]; return perm || []; })() : []; }
    if(scrKey === 's3'){ target = S.s3[i]; target.r = CFG.s3.items[i].answers[0]; }
    if(scrKey === 's4'){ target = S.s4[i]; target.r = CFG.s4[i].opts.map(function(o){ return o.ok; }).indexOf(1); }
    if(scrKey === 's5'){
      if(i === 1){ target = S.s5.p1; target.r = CFG.s5.p1.opts.map(function(o){ return o.ok; }).indexOf(1); }
      if(i === 2){ target = S.s5.p2; target.r = CFG.s5.p2.right; }
      if(i === 3){ target = S.s5.p3; target.r = {name:CFG.s5.p3.modelName, day:CFG.s5.p3.modelDay}; }
    }
    if(target){ target.x = 1; target.c = 1; }
    saveProgress(); render(parseInt(scrKey.replace('s',''), 10));
    announce('Model answer shown.');
    return;
  }
  if(act === 'prep'){
    var pit = S.s5.p2; if(!touch(pit)) return;
    pit.r = b.getAttribute('data-w');
    runtime.focusKey = 's5-p2-' + pit.r;
    saveProgress(); renderS5();
    announce('You chose ' + pit.r + '.');
    return;
  }
  if(act === 'pname'){
    var nit = S.s5.p3; if(!touch(nit)) return;
    nit.r.name = b.getAttribute('data-w');
    runtime.focusKey = 's5-p3-name';
    saveProgress(); renderS5();
    return;
  }
  if(act === 'p3help'){
    runtime.p3help = true; renderS5();
    announce('A model is shown below.');
    return;
  }
}
function permute(arr){
  if(arr.length <= 1) return [arr];
  var out = [];
  arr.forEach(function(x,i){ var rest = arr.slice(0,i).concat(arr.slice(i+1)); permute(rest).forEach(function(p){ out.push([x].concat(p)); }); });
  return out;
}
function onChange(e){
  var t = e.target;
  if(t.type === 'radio'){
    var nm = t.name, val = parseInt(t.value, 10);
    if(nm.charAt(0) === 'q'){
      var qi = parseInt(nm.slice(1), 10), it = S.s4[qi]; if(!touch(it)) return;
      it.r = val; runtime.focusKey = 's4-' + qi + '-' + val; saveProgress(); renderS4();
    } else if(nm === 'p1'){
      var it2 = S.s5.p1; if(!touch(it2)) return;
      it2.r = val; runtime.focusKey = 's5-p1-' + val; saveProgress(); renderS5();
    }
    return;
  }
  if(t.id === 'p3day'){
    var it3 = S.s5.p3; if(!touch(it3)) return;
    it3.r.day = t.value; runtime.focusKey = 's5-p3-day'; saveProgress(); renderS5();
  }
}
function onInput(e){
  var t = e.target;
  if(t.id && t.id.indexOf('gap') === 0){
    var gi = parseInt(t.getAttribute('data-i'), 10), it = S.s3[gi];
    if(it.x) return;
    it.c = 0; it.r = t.value; runtime.activeGap = gi;
    var s3i = $('s3i' + gi); if(s3i){ s3i.className = 'item'; }
    var f = $('s3f' + gi); if(f){ f.innerHTML = ''; }
    updateScreenUi(3);
    saveProgress();
    return;
  }
  if(t.id === 'p3name'){
    var it2 = S.s5.p3; if(it2.x) return;
    it2.c = 0; it2.r.name = t.value;
    var prev = document.querySelector('#s5p3 .preview');
    if(prev){ prev.textContent = 'Hello, my name is ' + (it2.r.name.trim() || '___') + '. Can we meet on ' + (it2.r.day || '___') + '?'; }
    var p3 = $('s5p3'); if(p3){ p3.className = 'part'; }
    var f3 = $('s5f3'); if(f3){ f3.innerHTML = '<button class="help" type="button" data-act="p3help">' + T('Need help?','Besoin d’aide ?') + '</button>'; }
    updateScreenUi(5);
    saveProgress();
  }
}
function onFocusIn(e){
  var t = e.target;
  if(t.id && t.id.indexOf('gap') === 0){
    var gi = parseInt(t.getAttribute('data-i'), 10);
    if(runtime.activeGap !== gi){
      runtime.activeGap = gi;
      Array.prototype.forEach.call(document.querySelectorAll('.gapline input'), function(inp){ inp.classList.remove('active'); });
      t.classList.add('active');
      var hint = $('bankHint'); if(hint){ hint.innerHTML = T('Choose a gap, then tap a word. Gap selected: ' + (gi+1) + '.','Choisissez un trou, puis touchez un mot. Trou sélectionné : ' + (gi+1) + '.'); }
    }
  }
}
function onKeydown(e){
  var t = e.target;
  if(e.key === 'Enter' && t.tagName === 'INPUT' && t.type === 'text'){ e.preventDefault(); }
}

/* ---------- French toggle ---------- */
function applyLang(on){
  document.body.classList.toggle('fr-on', !!on);
  var btn = $('langBtn');
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  btn.innerHTML = on ? '✓ Français' : 'Français';
  btn.setAttribute('aria-label', on ? 'Hide French translation' : 'Show French translation');
}
$('langBtn').addEventListener('click', function(){
  var on = !document.body.classList.contains('fr-on');
  applyLang(on);
  try{ window.localStorage.setItem(LANG_KEY, on ? '1' : '0'); }catch(e){}
  announce(on ? 'French translation shown.' : 'French translation hidden.');
});

/* ---------- boot ---------- */
buildS1(); buildS2Shell(); buildS3Shell(); buildS4Shell(); buildS5Shell(); buildS6();
document.getElementById('app').addEventListener('click', onClick);
document.getElementById('app').addEventListener('change', onChange);
document.getElementById('app').addEventListener('input', onInput);
document.getElementById('app').addEventListener('focusin', onFocusIn);
document.getElementById('app').addEventListener('keydown', onKeydown);

var langOn = false;
try{ langOn = window.localStorage.getItem(LANG_KEY) === '1'; }catch(e){}
applyLang(langOn);

var restored = loadProgress();
S = restored;
runtime.completionSent = false;
var startScreen = S.screen;
S.screen = 1;
if(startScreen > 1){ goTo(startScreen); }
else {
  $('progressFill').style.width = (100/TOTAL) + '%';
}
if(S.d && startScreen === 6 && screenValid(6)){
  /* completion was already submitted earlier; keep Done available only for a retry */
  refreshDone();
}

/* test hook (harmless in the browser) */
if(typeof window !== 'undefined'){ window.__pazapaTest = { S:function(){ return S; }, CFG:CFG }; }
})();
</script>
</body>
</html>
