<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explaining a problem - Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F6F9E7;
  --yellow-tint:#FFF6DE;
  --white:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  background:var(--pazapa-grey-light);
  color:var(--pazapa-grey-dark);
  line-height:1.55;
  font-size:1rem;
}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;margin:0;}
.app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
.top{padding:14px 20px 12px;border-top:8px solid var(--pazapa-blue);border-bottom:1px solid var(--pazapa-grey-light);}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.brand{font-weight:700;font-size:.85rem;color:var(--pazapa-grey-dark);}
.top h1{font-size:1.4rem;margin:6px 0 2px;}
.part{margin:0;font-size:.85rem;}
.lang{min-height:48px;min-width:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;}
main{flex:1;padding:22px 20px 28px;}
.screen[hidden]{display:none;}
.screen h2{font-size:1.25rem;margin-bottom:8px;}
.lead{margin:0 0 16px;}
.pic{display:block;width:100%;max-width:260px;height:auto;margin:0 auto 16px;border-radius:14px;background:var(--blue-tint);}
.pic.small{max-width:200px;}
.card{background:var(--blue-tint);border-radius:14px;padding:16px;margin:0 0 16px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:var(--white);border:2px solid var(--pazapa-grey-light);}
.card h3{font-size:1.02rem;margin-bottom:8px;}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0;}
legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;padding:0;margin-bottom:8px;}
.choice{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;margin:0 0 10px;border:2px solid var(--pazapa-blue);border-radius:10px;background:var(--white);cursor:pointer;touch-action:manipulation;}
.choice input{width:22px;height:22px;flex:none;accent-color:var(--pazapa-blue);}
.choice.on{background:var(--blue-tint);font-weight:700;}
.choice.have{border-style:dashed;border-color:var(--pazapa-grey-dark);}
.tagnote{font-size:.8rem;font-weight:700;margin-left:auto;padding:2px 8px;border-radius:10px;background:var(--yellow-tint);border:1px solid var(--pazapa-yellow);}
.opts{display:flex;flex-direction:column;gap:10px;}
button{font-family:inherit;touch-action:manipulation;}
.opt{min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);font-size:1rem;text-align:left;cursor:pointer;}
.opt:hover{background:var(--blue-tint);}
.opt.ok{border-color:var(--pazapa-green);background:var(--green-tint);font-weight:700;}
.opt.no{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
.opt[disabled]{cursor:default;}
.btn{min-height:48px;padding:10px 24px;border-radius:10px;border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-size:1rem;font-weight:700;cursor:pointer;}
.btn.sec{background:var(--white);}
.btn.small{padding:8px 16px;font-size:.95rem;}
.btn:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#5c5c5a;cursor:not-allowed;}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px;}
.fb{margin:10px 0 0;min-height:1.4em;font-size:.95rem;}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;border:2px solid var(--pazapa-grey-dark);}
.dot.ok{background:var(--pazapa-green);}
.dot.try{background:var(--pazapa-yellow);}
.hintbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);}
textarea{width:100%;min-height:120px;padding:12px;border:2px solid var(--pazapa-blue);border-radius:10px;font:inherit;color:var(--pazapa-grey-dark);resize:vertical;}
select{min-height:48px;padding:8px 10px;border:2px solid var(--pazapa-blue);border-radius:10px;font:inherit;background:var(--white);color:var(--pazapa-grey-dark);width:100%;}
label.lbl{display:block;font-weight:700;margin:0 0 6px;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.grid3{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px;}
@media(min-width:640px){.grid3{grid-template-columns:1fr 1fr 1fr;}.cmp{grid-template-columns:1fr 1fr !important;}}
.cmp{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px;}
.readonly{white-space:pre-wrap;word-wrap:break-word;min-height:56px;padding:12px;background:var(--white);border:2px dashed var(--pazapa-grey-dark);border-radius:10px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none;}
.tag{padding:4px 12px;border-radius:16px;font-size:.88rem;font-weight:700;border:2px solid var(--pazapa-grey-dark);background:var(--white);}
.tag.has{background:var(--green-tint);border-color:var(--pazapa-green);}
.tag.miss{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.phr{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--pazapa-blue);background:var(--white);font-size:.95rem;cursor:pointer;text-align:left;color:var(--pazapa-grey-dark);}
.phr .fr{display:block;font-size:.8rem;font-style:italic;}
.phrs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.phrline{padding:8px 12px;background:var(--white);border-radius:10px;border:1px solid var(--pazapa-grey-light);}
.phrline .fr{display:block;font-size:.85rem;font-style:italic;}
nav.bar{padding:14px 20px;border-top:1px solid var(--pazapa-grey-light);display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.rec .st{margin:8px 0 0;font-size:.92rem;}
.note{font-size:.9rem;margin:6px 0 0;}
.done-msg{margin-top:14px;font-weight:700;}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important;transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brandrow">
      <span class="brand">Pazapa English Programme for Adults</span>
      <button type="button" class="lang" id="langBtn"></button>
    </div>
    <h1 data-i18n="title"></h1>
    <p class="part" id="partLabel"></p>
  </header>

  <main id="main">

    <!-- SCREEN 1: LOOK BACK -->
    <section class="screen" id="s0" aria-labelledby="h0">
      <h2 id="h0" tabindex="-1" data-i18n="s1_h"></h2>
      <img class="pic" data-img="scene_desk" data-i18n-alt="alt_desk" alt="">
      <p class="lead" data-i18n="s1_lead"></p>
      <fieldset>
        <legend data-i18n="s1_leg"></legend>
        <div id="goalBox"></div>
        <p class="fb" id="goalFb"></p>
      </fieldset>
      <div class="card yellow"><p style="margin:0" data-i18n="s1_how"></p></div>
    </section>

    <!-- SCREEN 2: QUICK RECALL -->
    <section class="screen" id="s1" aria-labelledby="h1" hidden>
      <h2 id="h1" tabindex="-1" data-i18n="s2_h"></h2>
      <p class="lead" data-i18n="s2_lead"></p>
      <div id="recallBox"></div>
      <div class="row"><button type="button" class="btn sec" id="recallAgain" data-i18n="tryAgain"></button></div>
    </section>

    <!-- SCREEN 3: FIRST TRY -->
    <section class="screen" id="s2" aria-labelledby="h2" hidden>
      <h2 id="h2" tabindex="-1" data-i18n="s3_h"></h2>
      <img class="pic small" data-img="scene_msg" data-i18n-alt="alt_msg" alt="">
      <div class="card">
        <h3 data-i18n="s3_sit_h"></h3>
        <p style="margin:0 0 6px" data-i18n="s3_sit"></p>
        <p style="margin:0 0 6px"><strong data-i18n="s3_purpose"></strong></p>
        <p style="margin:0" data-i18n="s3_fict"></p>
      </div>
      <label class="lbl" for="first" data-i18n="s3_label"></label>
      <textarea id="first" maxlength="400" data-i18n-ph="s3_ph" aria-describedby="firstNote"></textarea>
      <p class="note" id="firstNote" data-i18n="s3_min"></p>
      <div class="row" style="margin:8px 0 16px"><button type="button" class="btn sec small" id="firstClear" data-i18n="s3_clear"></button></div>

      <fieldset class="card white">
        <legend data-i18n="s3_build"></legend>
        <div class="grid3">
          <div><label class="lbl" for="bProb" data-i18n="part_problem"></label><select id="bProb"></select></div>
          <div><label class="lbl" for="bDet" data-i18n="part_detail"></label><select id="bDet"></select></div>
          <div><label class="lbl" for="bReq" data-i18n="part_request"></label><select id="bReq"></select></div>
        </div>
        <button type="button" class="btn sec small" id="bAdd" data-i18n="s3_add"></button>
      </fieldset>

      <fieldset class="card white rec" id="recFirst">
        <legend data-i18n="rec_leg"></legend>
        <div class="row">
          <button type="button" class="btn sec small" data-act="rec" data-i18n="rec_record"></button>
          <button type="button" class="btn sec small" data-act="stop" data-i18n="rec_stop"></button>
          <button type="button" class="btn sec small" data-act="play" data-i18n="rec_play"></button>
          <button type="button" class="btn sec small" data-act="again" data-i18n="rec_again"></button>
        </div>
        <p class="st" role="status" aria-live="polite" data-st></p>
      </fieldset>
    </section>

    <!-- SCREEN 4: FIX ONE THING -->
    <section class="screen" id="s3" aria-labelledby="h3" hidden>
      <h2 id="h3" tabindex="-1" data-i18n="s4_h"></h2>
      <div class="card">
        <h3 data-i18n="s4_first"></h3>
        <div class="readonly" id="fixFirst"></div>
      </div>
      <div class="card green">
        <h3 data-i18n="s4_good"></h3>
        <p style="margin:0" id="goodText"></p>
        <ul class="tags" id="goodTags"></ul>
      </div>
      <fieldset>
        <legend data-i18n="s4_choose"></legend>
        <div id="focusBox"></div>
      </fieldset>
      <div id="helpBox"></div>
    </section>

    <!-- SCREEN 5: SECOND TRY -->
    <section class="screen" id="s4" aria-labelledby="h4" hidden>
      <h2 id="h4" tabindex="-1" data-i18n="s5_h"></h2>
      <div class="card">
        <h3 data-i18n="s5_first"></h3>
        <div class="readonly" id="secFirst"></div>
      </div>
      <div class="card yellow"><p style="margin:0" id="s5_focus"></p></div>
      <div id="s5_phr" class="phrs" role="group"></div>
      <label class="lbl" for="second" data-i18n="s5_label"></label>
      <textarea id="second" maxlength="400" data-i18n-ph="s5_ph"></textarea>
      <div class="row" style="margin:8px 0 12px"><button type="button" class="btn sec small" id="copyFirst" data-i18n="s5_copy"></button></div>
      <div id="ownBox" hidden><label class="choice"><input type="checkbox" id="ownChk"><span data-i18n="s5_own"></span></label></div>
      <p class="fb" id="s5Fb" role="status" aria-live="polite"></p>

      <fieldset class="card white rec" id="recSecond">
        <legend data-i18n="rec_leg"></legend>
        <div class="row">
          <button type="button" class="btn sec small" data-act="rec" data-i18n="rec_record"></button>
          <button type="button" class="btn sec small" data-act="stop" data-i18n="rec_stop"></button>
          <button type="button" class="btn sec small" data-act="play" data-i18n="rec_play"></button>
          <button type="button" class="btn sec small" data-act="again" data-i18n="rec_again"></button>
        </div>
        <p class="st" role="status" aria-live="polite" data-st></p>
      </fieldset>
    </section>

    <!-- SCREEN 6: NOTICE THE PROGRESS -->
    <section class="screen" id="s5" aria-labelledby="h5" hidden>
      <h2 id="h5" tabindex="-1" data-i18n="s6_h"></h2>
      <div class="cmp">
        <div class="card">
          <h3 data-i18n="s6_first"></h3>
          <div class="readonly" id="cmpFirst"></div>
          <ul class="tags" id="cmpFirstTags"></ul>
        </div>
        <div class="card green">
          <h3 data-i18n="s6_second"></h3>
          <div class="readonly" id="cmpSecond"></div>
          <ul class="tags" id="cmpSecondTags"></ul>
        </div>
      </div>
      <p class="lead" id="summary"></p>
      <fieldset>
        <legend data-i18n="s6_choose"></legend>
        <div id="improveBox"></div>
      </fieldset>
    </section>

    <!-- SCREEN 7: COMPLETE -->
    <section class="screen" id="s6" aria-labelledby="h6" hidden>
      <h2 id="h6" tabindex="-1" data-i18n="s7_h"></h2>
      <img class="pic small" data-img="help" data-i18n-alt="alt_help" alt="">
      <p class="lead" data-i18n="s7_lead"></p>
      <div class="card green">
        <h3 data-i18n="s7_use_h"></h3>
        <p style="margin:0" data-i18n="s7_use"></p>
      </div>
      <div class="row">
        <button type="button" class="btn" id="doneBtn" data-i18n="done"></button>
        <button type="button" class="btn sec" id="againBtn" data-i18n="tryAgain"></button>
      </div>
      <p class="done-msg" id="doneMsg" role="status" aria-live="polite"></p>
    </section>

  </main>

  <nav class="bar" id="bar">
    <button type="button" class="btn" id="nextBtn"></button>
  </nav>
  <div class="sr" role="status" aria-live="polite" id="live"></div>
</div>

function frOf(en){ for(var i=0;i<PHR.length;i++){ if(PHR[i][0]===en) return PHR[i][1]; } return ""; }
var BANK={
 problem:["My order hasn't arrived.","I received the wrong item.","I lost my bag yesterday.","The bill is incorrect."],

var IMPROVE_LABEL={purpose:"imp_purpose",info:"imp_info",phrase:"imp_phrase",polite:"imp_polite2"};

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function t(k,v){
  var e=S[k]; if(!e) return k;
  var s=e[state&&state.lang==="fr"?1:0];
  if(v){ for(var x in v){ s=s.replace("{"+x+"}",v[x]); } }
  return s;
}
function mk(tag,cls,text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e;}
function announce(msg){var l=$("live"); l.textContent=""; window.setTimeout(function(){l.textContent=msg;},30);}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=r[i];r[i]=r[j];r[j]=x;}return r;}
function norm(s){return String(s||"").normalize("NFKC").replace(/[‘’ʼ`]/g,"'").replace(/\s+/g," ").trim();}
function low(s){return norm(s).toLowerCase();}
function stripEnd(s){return low(s).replace(/[.!?,;:\s]+$/,"");}
function sameText(a,b){return stripEnd(a)===stripEnd(b);}
function words(s){var n=norm(s); return n? n.split(" ").length : 0;}

/* Deterministic meaning-part check. These are simple phrase groups, not a full understanding of English. */
function analyse(text){
  var s=low(text);
  var noThanks=s.replace(/thank(s| you)( very much)?( for (your|the) help)?/g," ");
  var sentences=s.split(/[.!?]+/).map(function(x){return x.trim();}).filter(Boolean);
  var last=sentences.length?sentences[sentences.length-1]:"";
  return {
    problem:/\b(order|delivery|parcel|package|bag|bill|item|wrong|lost|late|broken|arrive|arrived|incorrect|missing|hasn't|has not|have not|haven't|didn't|did not)\b/.test(s),
    detail:/\b(yesterday|today|tomorrow|tonight|monday|tuesday|wednesday|thursday|friday|saturday|sunday|morning|afternoon|evening|due|ago|week|night|blue|red|green|black|white|brown|small|big|number)\b|\d/.test(s),
    request:/\b(could you|can you|would you|will you|i need|need some help|need help|help me|check|please help|i would like|i'd like)\b/.test(noThanks),
    polite:/\b(please|thank you|thanks)\b/.test(last)
  };
}
function missingParts(an){return PARTS.filter(function(p){return !an[p];});}

/* ---------- state ---------- */
var state=fresh();
var orders={};
var lastWrong={};
var completionSent=false;
var recorders={};

function fresh(lang){
  return {v:VER,cur:0,lang:lang||"en",goal:"",r:{1:0,2:0,3:0},h:{1:0,2:0,3:0},first:"",locked:false,focus:"",hint:false,model:false,second:"",own:false,failed:0,checked:false,improved:[],spoken:false};
}
function sanitise(o){
  if(!o||typeof o!=="object"||o.v!==VER) return null;
  var s=fresh(o.lang==="fr"?"fr":"en");
  function str(x){return typeof x==="string"?x.slice(0,400):"";}
  s.cur=Math.max(0,Math.min(6,parseInt(o.cur,10)||0));
  s.goal=(o.goal==="A"||o.goal==="B"||o.goal==="C")?o.goal:"";
  [1,2,3].forEach(function(i){
    s.r[i]=(o.r&&o.r[i]===1)?1:0;
    s.h[i]=Math.max(0,Math.min(3,parseInt(o.h&&o.h[i],10)||0));
  });
  s.first=str(o.first); s.locked=!!o.locked;
  s.focus=PARTS.indexOf(o.focus)>=0?o.focus:"";
  s.hint=!!o.hint; s.model=!!o.model;
  s.second=str(o.second); s.own=!!o.own;
  s.failed=Math.max(0,Math.min(9,parseInt(o.failed,10)||0));
  s.checked=!!o.checked;
  s.improved=Array.isArray(o.improved)?o.improved.filter(function(k){return IMPROVE_KEYS.indexOf(k)>=0;}):[];
  s.spoken=!!o.spoken;
  return s;
}

/* Validation: which is the furthest screen the saved answers justify? */
function firstOK(){return words(state.first)>=3;}
function secondOK(){
  if(words(state.second)<3||sameText(state.second,state.first)||!state.focus) return false;
  if(analyse(state.second)[state.focus]) return true;
  return !!state.own;
}
function furthest(){
  if(state.goal!=="A") return 0;
  if(!(state.r[1]&&state.r[2]&&state.r[3])) return 1;
  if(!(state.locked&&firstOK())) return 2;
  if(!state.focus) return 3;
  if(!(state.checked&&secondOK())) return 4;
  if(!state.improved.length) return 5;
  return 6;
}

/* ---------- saving (text and choices only, never audio) ---------- */
var lms={api:null,ver:null};
function findAPI(win){
  var n=0;
  while(win&&n<12){
    try{
      if(win.API_1484_11) return {api:win.API_1484_11,ver:"2004"};
      if(win.API) return {api:win.API,ver:"1.2"};
    }catch(e){}
    try{ if(win.parent&&win.parent!==win) win=win.parent; else break; }catch(e2){break;}
    n++;
  }
  return null;
}
function discover(){
  if(lms.api) return true;
  var f=findAPI(window);
  if(!f){ try{ if(window.opener) f=findAPI(window.opener); }catch(e){} }
  if(!f) return false;
  lms.api=f.api; lms.ver=f.ver;
  try{ if(lms.ver==="2004") lms.api.Initialize(""); else lms.api.LMSInitialize(""); }catch(e2){}
  return true;
}
function lget(el){try{return String(lms.ver==="2004"?lms.api.GetValue(el):lms.api.LMSGetValue(el));}catch(e){return "";}}
function lset(el,v){try{return String(lms.ver==="2004"?lms.api.SetValue(el,v):lms.api.LMSSetValue(el,v))==="true";}catch(e){return false;}}
function lcommit(){try{return String(lms.ver==="2004"?lms.api.Commit(""):lms.api.LMSCommit(""))==="true";}catch(e){return false;}}
function statusEl(){return lms.ver==="2004"?"cmi.completion_status":"cmi.core.lesson_status";}

var saveTimer=null;
function save(){
  var str;
  try{ str=JSON.stringify(state); }catch(e){ return; }
  try{ localStorage.setItem(KEY,str); }catch(e2){}
  if(saveTimer) window.clearTimeout(saveTimer);
  saveTimer=window.setTimeout(function(){
    if(str.length>3000) return;
    if(!discover()) return;
    var st=lget(statusEl()).toLowerCase();
    if(st===""||st==="not attempted"||st==="unknown"){ lset(statusEl(),"incomplete"); }
    lset("cmi.suspend_data",str);
    lcommit();
  },500);
}
function loadSaved(){
  var raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw && discover()){ raw=lget("cmi.suspend_data"); }
  if(!raw) return null;
  try{ return sanitise(JSON.parse(raw)); }catch(e2){ return null; }
}

/* Completion: only when Done is pressed. Reads existing status first and never downgrades it. */
function activityCompleted(){
  if(completionSent) return true;
  var ok=false;
  if(discover()){
    var cur=lget(statusEl()).toLowerCase();
    var passed=(lms.ver==="2004"&&lget("cmi.success_status").toLowerCase()==="passed");
    if(cur==="completed"||cur==="passed"||passed){ ok=true; }
    else{
      var s=lset(statusEl(),"completed");
      var c=lcommit();
      var v=lget(statusEl()).toLowerCase();
      ok=s&&c&&(v==="completed"||v==="passed"||v==="");
    }
  }else{
    try{ localStorage.setItem(KEY+"_done","1"); }catch(e){}
    ok=true;
  }
  if(ok){ completionSent=true; console.log("W15D2 Review Improve Retry completed"); }
  return ok;
}

  document.documentElement.lang=state.lang==="fr"?"fr":"en-GB";
  document.title=state.lang==="fr"?"Expliquer un problème - Réviser, améliorer et réessayer":"Explaining a problem - Review, improve and retry";

/* ---------- navigation ---------- */
var NEXT_KEYS=["start","cont","s3_review","s4_next","s5_compare","s6_finish",null];
function show(n){
  var i;
  for(i=0;i<7;i++){ var sec=$("s"+i); if(i===n) sec.removeAttribute("hidden"); else sec.setAttribute("hidden",""); }
  state.cur=n;
  $("partLabel").textContent=t("part",{n:n+1});
  if(n===0) renderGoal();
  if(n===1) renderRecall();
  if(n===2) updateFirstUI();
  if(n===3) renderFix();
  if(n===4) renderSecond();
  if(n===5) renderCompare();
  updateNav();
  updateDone();
  var h=$("h"+n);
  window.scrollTo(0,0);
  if(h) h.focus({preventScroll:true});
  save();
}
function nextEnabled(){
  var n=state.cur;
  if(n===0) return state.goal==="A";
  if(n===1) return !!(state.r[1]&&state.r[2]&&state.r[3]);
  if(n===2) return firstOK();
  if(n===3) return !!state.focus;
  if(n===4) return words(state.second)>=3;
  if(n===5) return state.improved.length>0;
  return false;
}
function updateNav(){
  var bar=$("bar"), btn=$("nextBtn");
  if(state.cur===6){ bar.style.display="none"; return; }
  bar.style.display="";
  btn.textContent=t(NEXT_KEYS[state.cur]);
  btn.disabled=!nextEnabled();
}
function updateDone(){
  $("doneBtn").disabled=!(state.cur===6&&furthest()===6);
}
$("nextBtn").addEventListener("click",function(){
  var n=state.cur;
  if(n===2){
    if(!firstOK()) return;
    state.first=$("first").value; state.locked=true;
    show(3); return;
  }
  if(n===4){ compareTries(); return; }
  if(!nextEnabled()) return;
  show(n+1);
});

/* ---------- screen 1 ---------- */
function renderGoal(){
  var box=$("goalBox"); box.textContent="";
  if(!orders.goal) orders.goal=shuffle(["A","B","C"]);
  orders.goal.forEach(function(k){
    var lab=mk("label","choice"+(state.goal===k?" on":""));
    var inp=document.createElement("input"); inp.type="radio"; inp.name="goal"; inp.value=k; inp.checked=(state.goal===k);
    var sp=mk("span",null,t("goal"+k)); sp.setAttribute("lang",state.lang==="fr"?"fr":"en-GB");
    lab.appendChild(inp); lab.appendChild(sp);
    inp.addEventListener("change",function(){
      state.goal=k;
      if(furthest()<state.cur) show(Math.max(0,furthest()));
      goalFb(); renderGoal(); updateNav(); save();
      var again=box.querySelector('input[value="'+k+'"]'); if(again) again.focus();
    });
    box.appendChild(lab);
  });
  goalFb();
}
function goalFb(){
  var fb=$("goalFb");
  if(!state.goal){ fb.textContent=""; return; }
  var ok=state.goal==="A";
  fb.textContent="";
  var d=mk("span","dot "+(ok?"ok":"try")); d.setAttribute("aria-hidden","true");
  fb.appendChild(d); fb.appendChild(document.createTextNode(t(ok?"goal_ok":"goal_no")));
  announce(t(ok?"goal_ok":"goal_no"));
}

/* ---------- screen 2: quick recall ---------- */
var TASKS=[
 {id:1,p:"t1_p",img:"broken",opts:["broken","lost","late"],ans:"broken",hints:["t1_h1","t1_h2","t1_h3"],ok:"t1_ok"},
 {id:2,p:"t2_p",sentence:"My ______ hasn't arrived.",opts:["order","bill","late"],ans:"order",hints:["t2_h1","t2_h2","t2_h3"],ok:"t2_ok"},
 {id:3,p:"t3_p",opts:["I received the wrong item.","I lost my bag yesterday.","The bill is incorrect."],ans:"I received the wrong item.",hints:["t3_h1","t3_h2","t3_h3"],ok:"t3_ok"}
];
function renderRecall(){
  var box=$("recallBox"); box.textContent="";
  TASKS.forEach(function(task){
    if(!orders["t"+task.id]) orders["t"+task.id]=shuffle(task.opts);
    var card=mk("div","card"); card.id="task"+task.id;
    var h=mk("h3",null,t(task.p)); card.appendChild(h);
    if(task.img){ var im=document.createElement("img"); im.className="pic small"; im.src=IMG[task.img]; im.alt=t("alt_broken"); card.appendChild(im); }
    if(task.sentence){ var sp=mk("p",null,task.sentence); sp.setAttribute("lang","en-GB"); sp.style.fontWeight="700"; card.appendChild(sp); }
    var list=mk("div","opts"); list.setAttribute("role","group"); list.setAttribute("aria-label",t(task.p));
    orders["t"+task.id].forEach(function(o){
      var b=mk("button","opt",o); b.type="button"; b.setAttribute("lang","en-GB"); b.setAttribute("data-val",o);
      b.addEventListener("click",function(){ answerTask(task,o); });
      list.appendChild(b);
    });
    card.appendChild(list);
    var hb=mk("button","btn sec small"); hb.type="button"; hb.id="hb"+task.id; hb.style.marginTop="10px";
    hb.addEventListener("click",function(){ if(state.h[task.id]<3){ state.h[task.id]++; updateTask(task); save(); } });
    card.appendChild(hb);
    var hx=mk("div",null); hx.id="hx"+task.id; card.appendChild(hx);
    var fb=mk("p","fb"); fb.id="fb"+task.id; card.appendChild(fb);
    box.appendChild(card);
    updateTask(task,true);
  });
}
function answerTask(task,val){
  if(state.r[task.id]) return;
  if(val===task.ans){ state.r[task.id]=1; lastWrong[task.id]=""; }
  else{ lastWrong[task.id]=val; }
  updateTask(task); save(); updateNav();
  announce(val===task.ans?t(task.ok):t("t_no"));
}
function updateTask(task,quiet){
  var card=$("task"+task.id); if(!card) return;
  var done=!!state.r[task.id];
  var btns=card.querySelectorAll(".opt");
  for(var i=0;i<btns.length;i++){
    var v=btns[i].getAttribute("data-val");
    btns[i].classList.remove("ok","no");
    btns[i].disabled=done;
    if(done&&v===task.ans) btns[i].classList.add("ok");
    else if(!done&&lastWrong[task.id]===v) btns[i].classList.add("no");
    btns[i].setAttribute("aria-pressed",(done&&v===task.ans)?"true":"false");
  }
  var hb=$("hb"+task.id), n=state.h[task.id];
  hb.textContent=n===0?t("hint"):(n<3?t("hint2"):t("hint_none"));
  hb.disabled=done||n>=3;
  var hx=$("hx"+task.id); hx.textContent="";
  if(n>0&&!done){ var hint=mk("div","hintbox",t(task.hints[n-1])); hx.appendChild(hint); }
  var fb=$("fb"+task.id); fb.textContent="";
  if(done){
    var d=mk("span","dot ok"); d.setAttribute("aria-hidden","true"); fb.appendChild(d); fb.appendChild(document.createTextNode(t(task.ok)));
  }else if(lastWrong[task.id]){
    var d2=mk("span","dot try"); d2.setAttribute("aria-hidden","true"); fb.appendChild(d2); fb.appendChild(document.createTextNode(t("t_no")));
  }
}
$("recallAgain").addEventListener("click",function(){
  state.r={1:0,2:0,3:0}; state.h={1:0,2:0,3:0}; lastWrong={};
  delete orders.t1; delete orders.t2; delete orders.t3;
  renderRecall(); updateNav(); save();
  var f=$("task1"); if(f){ announce(t("s2_h")); }
});

/* ---------- screen 3: first try ---------- */
var BUILD={
 bProb:["My order hasn't arrived.","I received the wrong item.","I lost my bag yesterday.","The bill is incorrect."],
 bDet:["It was due yesterday.","It was due today.","It is late."],
 bReq:["I need some help, please.","Could you check the delivery, please?","Could you help me, please?"]
};
function buildBuilder(){
  Object.keys(BUILD).forEach(function(id){
    var sel=$(id); var cur=sel.value; sel.textContent="";
    var o0=mk("option",null,t("s3_choose")); o0.value=""; sel.appendChild(o0);
    BUILD[id].forEach(function(p){ var o=mk("option",null,p); o.value=p; o.setAttribute("lang","en-GB"); sel.appendChild(o); });
    sel.value=cur;
  });
}
function updateFirstUI(){
  var ta=$("first");
  if(ta.value!==state.first && document.activeElement!==ta) ta.value=state.first;
  var ok=firstOK();
  $("firstNote").style.fontWeight=ok?"400":"700";
  if(state.cur===2) updateNav();
}
var typeTimer=null;
$("first").addEventListener("input",function(){
  state.first=this.value; state.locked=false;
  updateNav();
  if(typeTimer) window.clearTimeout(typeTimer);
  typeTimer=window.setTimeout(save,400);
});
$("firstClear").addEventListener("click",function(){
  $("first").value=""; state.first=""; state.locked=false; updateNav(); save(); $("first").focus();
});
$("bAdd").addEventListener("click",function(){
  var ta=$("first"), add=[];
  ["bProb","bDet","bReq"].forEach(function(id){ var v=$(id).value; if(v) add.push(v); $(id).value=""; });
  if(!add.length) return;
  var cur=ta.value.replace(/\s+$/,"");
  ta.value=(cur?cur+" ":"")+add.join(" ");
  state.first=ta.value; state.locked=false;
  updateNav(); save(); ta.focus();
});

/* ---------- screen 4: fix one thing ---------- */
function partTag(p,has){
  var li=mk("li","tag "+(has?"has":"miss"));
  li.textContent=(has?"✓ ":"○ ")+t("part_"+p)+" - "+t(has?"has":"missing");
  return li;
}
function renderFix(){
  $("fixFirst").textContent=state.first;
  var an=analyse(state.first);
  var good=PARTS.filter(function(p){return an[p];});
  var gt=$("goodText"); gt.textContent="";
  if(good.length){
    good.forEach(function(p){ var d=mk("div",null,t("good_"+p)); gt.appendChild(d); });
  }else{ gt.textContent=t("good_none"); }
  var tags=$("goodTags"); tags.textContent="";
  PARTS.forEach(function(p){ tags.appendChild(partTag(p,an[p])); });

  var miss=missingParts(an);
  var sugg=miss.slice(0,2);
  var box=$("focusBox"); box.textContent="";
  PARTS.forEach(function(p){
    var lab=mk("label","choice"+(state.focus===p?" on":"")+(an[p]?" have":""));
    var inp=document.createElement("input"); inp.type="radio"; inp.name="focus"; inp.value=p; inp.checked=(state.focus===p);
    lab.appendChild(inp); lab.appendChild(mk("span",null,t("imp_"+p)));
    if(sugg.indexOf(p)>=0) lab.appendChild(mk("span","tagnote",t("suggested")));
    else if(an[p]) lab.appendChild(mk("span","tagnote",t("already")));
    inp.addEventListener("change",function(){
      if(state.focus!==p){
        state.focus=p; state.hint=false; state.model=false;
        state.checked=false; state.improved=[]; state.own=false; state.failed=0;
      }
      var labs=box.querySelectorAll(".choice"); for(var i=0;i<labs.length;i++) labs[i].classList.remove("on");
      lab.classList.add("on");
      renderHelp(); updateNav(); updateDone(); save();
    });
    box.appendChild(lab);
  });
  renderHelp();
}
function renderHelp(){
  var box=$("helpBox"); box.textContent="";
  if(!state.focus){ box.appendChild(mk("p","note",t("s4_pick"))); return; }
  var f=state.focus;
  var card=mk("div","card yellow");
  card.appendChild(mk("h3",null,t("s4_phr")));
  var list=mk("div","phrs");
  BANK[f].forEach(function(p){
    var line=mk("div","phrline"); var en=mk("span",null,p); en.setAttribute("lang","en-GB"); line.appendChild(en);
    if(state.lang==="fr"){ line.appendChild(mk("span","fr",frOf(p))); }
    list.appendChild(line);
  });
  card.appendChild(list);
  var row=mk("div","row");
  var hb=mk("button","btn sec small",t("s4_hintBtn")); hb.type="button"; hb.disabled=state.hint;
  hb.addEventListener("click",function(){ state.hint=true; renderHelp(); save(); var x=$("hintText"); if(x) x.focus(); });
  var eb=mk("button","btn sec small",t("s4_exBtn")); eb.type="button"; eb.disabled=state.model;
  eb.addEventListener("click",function(){ state.model=true; renderHelp(); save(); var x=$("modelText"); if(x) x.focus(); });
  row.appendChild(hb); row.appendChild(eb); card.appendChild(row);
  if(state.hint){ var hx=mk("div","hintbox",t("hint_"+f)); hx.id="hintText"; hx.tabIndex=-1; card.appendChild(hx); }
  if(state.model){
    var mx=mk("div","hintbox"); mx.id="modelText"; mx.tabIndex=-1;
    mx.appendChild(mk("strong",null,t("s4_ex_h")));
    var mp=mk("div",null,MODEL); mp.setAttribute("lang","en-GB"); mx.appendChild(mp);
    card.appendChild(mx);
  }
  box.appendChild(card);
}

/* ---------- screen 5: second try ---------- */
function renderSecond(){
  $("secFirst").textContent=state.first;
  var f=state.focus;
  $("s5_focus").textContent=t("s5_focus")+(f?t("imp_"+f):"");
  var ph=$("s5_phr"); ph.textContent=""; ph.setAttribute("aria-label",t("s4_phr"));
  (f?BANK[f]:[]).forEach(function(p){
    var b=mk("button","phr"); b.type="button";
    var en=mk("span",null,p); en.setAttribute("lang","en-GB"); b.appendChild(en);
    if(state.lang==="fr") b.appendChild(mk("span","fr",frOf(p)));
    b.addEventListener("click",function(){
      var ta=$("second"); var cur=ta.value.replace(/\s+$/,"");
      ta.value=(cur?cur+" ":"")+p; secondChanged(); ta.focus();
    });
    ph.appendChild(b);
  });
  var ta=$("second"); if(ta.value!==state.second) ta.value=state.second;
  $("ownBox").hidden=!(state.failed>=1&&!sameText(state.second,state.first));
  $("ownChk").checked=state.own;
  $("s5Fb").textContent="";
  updateNav();
}
function secondChanged(){
  state.second=$("second").value;
  state.checked=false; state.improved=[];
  updateNav(); updateDone();
  if(typeTimer) window.clearTimeout(typeTimer);
  typeTimer=window.setTimeout(save,400);
}
$("second").addEventListener("input",secondChanged);
$("copyFirst").addEventListener("click",function(){
  $("second").value=state.first; secondChanged(); $("second").focus();
});
$("ownChk").addEventListener("change",function(){ state.own=this.checked; state.checked=false; save(); });
function fbLine(msg,ok){
  var fb=$("s5Fb"); fb.textContent="";
  var d=mk("span","dot "+(ok?"ok":"try")); d.setAttribute("aria-hidden","true");
  fb.appendChild(d); fb.appendChild(document.createTextNode(msg));
}
function compareTries(){
  var s2=$("second").value; state.second=s2;
  if(words(s2)<3){ fbLine(t("s5_short"),false); return; }
  if(sameText(s2,state.first)){ fbLine(t("s5_same"),false); return; }
  var an=analyse(s2);
  if(!an[state.focus]&&!state.own){
    state.failed++;
    $("ownBox").hidden=false;
    var ex=BANK[state.focus][0];
    fbLine(t("s5_try")+ex,false);
    save(); return;
  }
  state.checked=true; save();
  show(5);
}

/* ---------- screen 6: notice the progress ---------- */
function renderCompare(){
  $("cmpFirst").textContent=state.first;
  $("cmpSecond").textContent=state.second;
  var a1=analyse(state.first), a2=analyse(state.second);
  var t1=$("cmpFirstTags"), t2=$("cmpSecondTags"); t1.textContent=""; t2.textContent="";
  PARTS.forEach(function(p){ t1.appendChild(partTag(p,a1[p])); t2.appendChild(partTag(p,a2[p])); });
  var gained=PARTS.filter(function(p){return a2[p]&&!a1[p];});
  var sum=$("summary");
  if(PARTS.every(function(p){return a2[p];})&&gained.length){ sum.textContent=t("sum_all"); }
  else if(gained.length){ sum.textContent=t("sum_added")+gained.map(function(p){return t("part_"+p).toLowerCase();}).join(", ")+"."; }
  else{ sum.textContent=t("sum_other"); }
  var box=$("improveBox"); box.textContent="";
  IMPROVE_KEYS.forEach(function(k){
    var on=state.improved.indexOf(k)>=0;
    var lab=mk("label","choice"+(on?" on":""));
    var inp=document.createElement("input"); inp.type="checkbox"; inp.value=k; inp.checked=on;
    lab.appendChild(inp); lab.appendChild(mk("span",null,t(IMPROVE_LABEL[k])));
    inp.addEventListener("change",function(){
      var i=state.improved.indexOf(k);
      if(inp.checked&&i<0) state.improved.push(k);
      if(!inp.checked&&i>=0) state.improved.splice(i,1);
      lab.classList.toggle("on",inp.checked);
      updateNav(); updateDone(); save();
    });
    box.appendChild(lab);
  });
  updateNav();
}

/* ---------- screen 7: done and try again ---------- */
$("doneBtn").addEventListener("click",function(){
  if($("doneBtn").disabled) return;
  var ok=activityCompleted();
  var m=$("doneMsg"); m.textContent=t(ok?"done_ok":"done_retry");
  announce(m.textContent);
});
$("againBtn").addEventListener("click",function(){ resetAll(); });
function resetAll(){
  state=fresh(state.lang); orders={}; lastWrong={};
  $("first").value=""; $("second").value="";
  ["bProb","bDet","bReq"].forEach(function(id){$(id).value="";});
  $("doneMsg").textContent="";
  Object.keys(recorders).forEach(function(k){recorders[k].reset();});
  try{ localStorage.removeItem(KEY); }catch(e){}
  show(0); save();
}
$("langBtn").addEventListener("click",function(){
  state.lang=state.lang==="fr"?"en":"fr";
  applyLang(); save();
});

/* ---------- optional local recording ---------- */
function makeRecorder(root){
  var btn={}; var stEl=root.querySelector("[data-st]");
  ["rec","stop","play","again"].forEach(function(a){ btn[a]=root.querySelector('[data-act="'+a+'"]'); });
  var stream=null,mr=null,chunks=[],url=null,audio=null,mode="idle",key="rec_idle";
  function setStatus(k){ key=k; stEl.textContent=t(k); }
  function setMode(m){
    mode=m;
    btn.rec.disabled=(m==="recording");
    btn.stop.disabled=(m!=="recording");
    btn.play.disabled=(m!=="ready");
    btn.again.disabled=(m!=="ready"&&m!=="error");
  }
  function release(){ if(stream){ try{ stream.getTracks().forEach(function(tr){tr.stop();}); }catch(e){} stream=null; } }
  function dropUrl(){ if(audio){ try{audio.pause();}catch(e){} audio=null; } if(url){ try{URL.revokeObjectURL(url);}catch(e){} url=null; } }
  function fail(err){
    release();
    var n=err&&err.name;
    if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError") setStatus("rec_denied");
    else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") setStatus("rec_missing");
    else setStatus("rec_fail");
    setMode("error");
  }
  btn.rec.addEventListener("click",function(){
    dropUrl();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof window.MediaRecorder==="undefined"){
      setStatus("rec_unsupported"); setMode("error"); return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream=s; chunks=[];
      try{ mr=new MediaRecorder(s); }catch(e){ release(); setStatus("rec_unsupported"); setMode("error"); return; }
      mr.ondataavailable=function(ev){ if(ev.data&&ev.data.size) chunks.push(ev.data); };
      mr.onerror=function(ev){ fail(ev&&ev.error); };
      mr.onstop=function(){
        release();
        var blob=new Blob(chunks,{type:(mr&&mr.mimeType)||"audio/webm"});
        chunks=[];
        if(!blob.size){ setStatus("rec_empty"); setMode("idle"); return; }
        url=URL.createObjectURL(blob);
        setStatus("rec_ready"); setMode("ready");
        if(root.id==="recSecond"){ state.spoken=true; }
      };
      try{ mr.start(); setMode("recording"); setStatus("rec_recording"); }catch(e2){ fail(e2); }
    }).catch(fail);
  });
  btn.stop.addEventListener("click",function(){ try{ if(mr&&mr.state!=="inactive") mr.stop(); }catch(e){ fail(e); } });
  btn.play.addEventListener("click",function(){
    if(!url) return;
    try{
      if(audio){ audio.pause(); }
      audio=new Audio(url);
      audio.onended=function(){ setStatus("rec_ready"); };
      setStatus("rec_playing");
      var p=audio.play(); if(p&&p.catch) p.catch(function(){ setStatus("rec_fail"); });
    }catch(e){ setStatus("rec_fail"); }
  });
  btn.again.addEventListener("click",function(){ dropUrl(); release(); setStatus("rec_idle"); setMode("idle"); });
  var api={
    refresh:function(){ stEl.textContent=t(key); },
    reset:function(){ try{ if(mr&&mr.state!=="inactive") mr.stop(); }catch(e){} dropUrl(); release(); setStatus("rec_idle"); setMode("idle"); },
    free:function(){ dropUrl(); release(); }
  };
  setStatus("rec_idle"); setMode("idle");
  return api;
}
window.addEventListener("pagehide",function(){ Object.keys(recorders).forEach(function(k){recorders[k].free();}); });
window.addEventListener("beforeunload",function(){ Object.keys(recorders).forEach(function(k){recorders[k].free();}); });

/* ---------- init ---------- */
$("doneBtn").disabled=true;
setImages();
recorders.first=makeRecorder($("recFirst"));
recorders.second=makeRecorder($("recSecond"));
var saved=loadSaved();
if(saved){ state=saved; }
state.spoken=false;
buildBuilder();
var start=Math.min(state.cur,furthest());
state.cur=start;
$("first").value=state.first;
$("second").value=state.second;
if(start<3){ state.checked=false; }
applyLang();
show(start);
})();
