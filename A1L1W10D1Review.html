<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looking for accommodation — Review, Improve and Retry</title>
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;
    --blue-tint:#EAF8FB;
    --green-tint:#F6F9E7;
    --yellow-tint:#FFF6DE;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Open Sans", Arial, sans-serif;
    background:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;}
  body[data-lang="en"] .fr{display:none !important;}
  body[data-lang="fr"] .en{display:none !important;}
  .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
  header.app-header{padding:14px 20px 14px;border-top:8px solid var(--pazapa-blue);border-bottom:1px solid var(--pazapa-grey-light);}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .brand{font-weight:700;font-size:0.9rem;}
  .lang-btn{min-height:48px;min-width:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);font-size:0.95rem;font-weight:700;cursor:pointer;touch-action:manipulation;}
  .lang-btn[aria-pressed="true"]{background:var(--pazapa-blue);}
  .eyebrow{margin:0 0 2px;font-size:0.85rem;font-weight:600;}
  h1{font-size:1.3rem;margin:0 0 10px;}
  .progress-wrap{display:flex;align-items:center;gap:10px;}
  .progress-track{flex:1;height:10px;background:var(--pazapa-grey-light);border-radius:8px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--pazapa-blue);border-radius:8px;transition:width .3s ease;}
  .progress-label{font-size:0.82rem;white-space:nowrap;}
  @media (prefers-reduced-motion: reduce){.progress-fill{transition:none;} *{scroll-behavior:auto !important;animation:none !important;}}
  main{flex:1;padding:22px 20px 24px;}
  section.screen[hidden]{display:none;}
  h2.screen-title{font-size:1.2rem;margin:0 0 8px;}
  h2.screen-title:focus{outline:none;}
  h2.screen-title:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:3px;}
  p.lead{margin:0 0 16px;}
  .card{background:var(--blue-tint);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .card.green{background:var(--green-tint);}
  .card.yellow{background:var(--yellow-tint);}
  .card.white{background:var(--white);border:2px solid var(--pazapa-grey-light);}
  .card h3{margin:0 0 10px;font-size:1.02rem;}
  .goal-box{background:var(--green-tint);border-left:8px solid var(--pazapa-green);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;font-weight:600;}
  .hero{display:flex;gap:16px;align-items:center;background:var(--blue-tint);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
  .hero img{width:38%;max-width:200px;height:auto;object-fit:contain;border-radius:10px;flex:none;}
  .hero .hero-text{flex:1;}
  .scene{display:block;width:100%;max-width:200px;height:auto;object-fit:contain;margin:0 auto 14px;border-radius:10px;}
  @media (max-width:480px){.hero{flex-direction:column;}.hero img{width:60%;}}
  fieldset{border:0;margin:0;padding:0;min-width:0;}
  legend{font-weight:700;padding:0;margin-bottom:8px;}
  .option-list{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:12px 14px;border:2px solid var(--pazapa-blue);border-radius:10px;background:var(--white);cursor:pointer;touch-action:manipulation;}
  .opt:hover{background:var(--blue-tint);}
  .opt input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--pazapa-blue);}
  .opt.is-ok{border-color:var(--pazapa-green);background:var(--green-tint);}
  .opt.is-try{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
  .opt:focus-within{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
  .tag{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:12px;background:var(--pazapa-yellow);font-size:0.78rem;font-weight:700;}
  .fb{margin:8px 0 0;font-size:0.93rem;min-height:1.3em;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;}
  .dot.ok{background:var(--pazapa-green);border:2px solid var(--pazapa-grey-dark);}
  .dot.try{background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark);}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;}
  .row .w{font-weight:700;min-width:96px;}
  .row img.pic{width:56px;height:75px;object-fit:contain;border-radius:6px;background:var(--white);}
  select,input[type="text"],textarea{font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);border:2px solid var(--pazapa-blue);border-radius:10px;background:var(--white);}
  select{min-height:48px;padding:8px 10px;max-width:100%;}
  input[type="text"].blank{min-height:48px;padding:8px 12px;width:9.5em;}
  textarea{width:100%;min-height:130px;padding:12px;resize:vertical;line-height:1.5;}
  textarea[readonly]{background:var(--pazapa-grey-light);border-color:#9a9a98;}
  :focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
  button{font-family:inherit;touch-action:manipulation;}
  .btn-primary,.btn-secondary,.btn-help,.chip,.clear-link{min-height:48px;cursor:pointer;touch-action:manipulation;}
  .btn-primary{padding:12px 26px;border-radius:10px;border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-size:1rem;font-weight:700;}
  .btn-primary:disabled{background:var(--pazapa-grey-light);border-color:#bdbdbb;color:#5b5b59;cursor:not-allowed;}
  .btn-secondary{padding:12px 22px;border-radius:10px;border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);font-size:1rem;font-weight:700;}
  .btn-secondary:disabled{border-color:#bdbdbb;color:#6a6a68;cursor:not-allowed;}
  .btn-help{padding:10px 18px;border-radius:10px;border:2px solid var(--pazapa-yellow);background:var(--yellow-tint);color:var(--pazapa-grey-dark);font-size:0.95rem;font-weight:600;}
  .btn-help:disabled{opacity:.6;cursor:not-allowed;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
  .chip{padding:10px 14px;border-radius:24px;border:2px solid var(--pazapa-blue);background:var(--white);font-size:0.95rem;color:var(--pazapa-grey-dark);}
  .chip:hover{background:var(--blue-tint);}
  .clear-link{background:none;border:none;color:var(--pazapa-grey-dark);text-decoration:underline;font-size:0.92rem;padding:0 6px;}
  .cues{margin-top:10px;}
  .cue{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:0.93rem;}
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.compare-grid{grid-template-columns:1fr;}}
  .attempt{white-space:pre-wrap;word-wrap:break-word;background:var(--white);border:2px solid var(--pazapa-grey-light);border-radius:10px;padding:12px;min-height:60px;}
  .rec-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .rec-status{margin:6px 0 0;font-size:0.92rem;min-height:1.3em;}
  ul.plain{margin:6px 0 0;padding-left:20px;}
  ul.plain li{margin-bottom:4px;}
  details{margin-top:10px;}
  summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700;}
  .model{background:var(--green-tint);border-radius:10px;padding:12px;margin-top:6px;}
  nav.app-nav{padding:14px 20px 18px;border-top:1px solid var(--pazapa-grey-light);display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .nav-buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;}
  .nav-hint{font-size:0.88rem;margin:0;min-height:1.2em;text-align:right;}
  .done-status{font-weight:700;margin:0;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  [hidden]{display:none !important;}
</style>
</head>

function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }

}

           first:"", cmp:"", focus:[], focusFor:"", model:false, second:"", reflect:[], reflFor:"",

function sanitizeObj(o){ var r={}; if(o && typeof o==="object"){ Object.keys(o).slice(0,12).forEach(function(k){ if(typeof o[k]==="string") r[k]=o[k].slice(0,60); }); } return r; }
function sanitize(p){
  var f = fresh();
  if(!p || typeof p!=="object" || p.v!==1) return f;
  f.screen = (typeof p.screen==="number" && p.screen>=0 && p.screen<NSCREENS) ? Math.floor(p.screen) : 0;
  f.lang = (p.lang==="fr") ? "fr" : "en";
  f.goal = (p.goal==="a"||p.goal==="b"||p.goal==="c") ? p.goal : "";
  f.r1 = sanitizeObj(p.r1); f.r2 = sanitizeObj(p.r2); f.r3 = sanitizeObj(p.r3);
  ["t1","t2","t3","t4"].forEach(function(k){ var n=p.h && p.h[k]; f.h[k]=(typeof n==="number" && n>=0 && n<=3)?Math.floor(n):0; });
  f.first = typeof p.first==="string" ? p.first.slice(0,500) : "";
  f.cmp = (p.cmp==="a"||p.cmp==="b") ? p.cmp : "";
  var okF = ["purpose","complete","phrase","polite"];
  f.focus = Array.isArray(p.focus) ? p.focus.filter(function(x){ return okF.indexOf(x)>-1; }).slice(0,2) : [];
  f.focusFor = typeof p.focusFor==="string" ? p.focusFor.slice(0,20) : "";
  f.model = p.model===true;
  f.second = typeof p.second==="string" ? p.second.slice(0,500) : "";
  f.reflect = Array.isArray(p.reflect) ? p.reflect.filter(function(x){ return okF.indexOf(x)>-1; }).slice(0,4) : [];
  f.reflFor = typeof p.reflFor==="string" ? p.reflFor.slice(0,20) : "";
  f.spk1 = p.spk1===true; f.spk2 = p.spk2===true; f.done = p.done===true;
  return f;
}

/* ===================== LMS (SCORM 1.2 + 2004) ===================== */
var lms = null;
function scanFor(win, name){
  var hops = 0;
  while(win && hops<12){
    try{ if(win[name]) return win[name]; }catch(e){}
    var next=null;
    try{ if(win.parent && win.parent!==win) next=win.parent; }catch(e){ next=null; }
    if(!next) break;
    win = next; hops++;
  }
  return null;
}
function findAPI(name){
  var a = null;
  try{ a = scanFor(window, name); }catch(e){}
  if(!a){ try{ if(window.opener) a = scanFor(window.opener, name); }catch(e){} }
  return a;
}
function getLMS(){
  if(lms) return lms;
  var a;
  try{
    a = findAPI("API_1484_11");
    if(a && typeof a.Initialize==="function"){ a.Initialize(""); lms={ver:"2004",api:a}; return lms; }
    a = findAPI("API");
    if(a && typeof a.LMSInitialize==="function"){ a.LMSInitialize(""); lms={ver:"1.2",api:a}; return lms; }
  }catch(e){}
  return null;
}
function lmsGet(el){ try{ return lms.ver==="2004" ? lms.api.GetValue(el) : lms.api.LMSGetValue(el); }catch(e){ return ""; } }
function lmsSet(el,val){ try{ return lms.ver==="2004" ? lms.api.SetValue(el,val) : lms.api.LMSSetValue(el,val); }catch(e){ return "false"; } }
function lmsCommit(){ try{ return lms.ver==="2004" ? lms.api.Commit("") : lms.api.LMSCommit(""); }catch(e){ return "false"; } }
function statusEl(){ return lms.ver==="2004" ? "cmi.completion_status" : "cmi.core.lesson_status"; }

function compact(){
  var o = JSON.parse(JSON.stringify(S));
  var s = JSON.stringify(o);
  if(s.length>3500){ o.first=o.first.slice(0,400); o.second=o.second.slice(0,400); s=JSON.stringify(o); }
  return s;
}
var saveTimer=null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,350); }
function saveNow(){
  var s; try{ s = compact(); }catch(e){ return; }
  try{ localStorage.setItem(KEY, s); }catch(e){}
  var a = getLMS();
  if(a){
    try{
      if(lmsGet(statusEl())!=="completed" && lmsGet(statusEl())!=="passed" && a.ver==="1.2" && lmsGet("cmi.core.lesson_status")==="not attempted"){ lmsSet("cmi.core.lesson_status","incomplete"); }
      lmsSet("cmi.suspend_data", s); lmsCommit();
    }catch(e){}
  }
}
function loadSaved(){
  var raw=null;
  var a = getLMS();
  if(a){ try{ var sd=lmsGet("cmi.suspend_data"); if(sd && sd.charAt(0)==="{") raw=sd; }catch(e){} }
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

function activityCompleted(){
  if(completionSent) return true;
  var a = getLMS();
  if(!a){
    S.done = true;
    try{ localStorage.setItem(KEY, compact()); }catch(e){}
    completionSent = true;
    console.log("W10D1 Review Improve Retry completed");
    return true;
  }
  var cur = lmsGet(statusEl());
  if(cur==="completed" || cur==="passed"){ completionSent = true; S.done = true; return true; }
  lmsSet(statusEl(),"completed");
  var c = lmsCommit();
  var back = lmsGet(statusEl());
  var verified = (back==="completed") || (back==="" && (c==="true"||c===true));
  if(verified){
    completionSent = true; S.done = true;
    try{ localStorage.setItem(KEY, compact()); }catch(e){}
    console.log("W10D1 Review Improve Retry completed");
    return true;
  }
  return false;
}

/* ===================== LANGUAGE ANALYSIS (deterministic) ===================== */
var RX = {
  avail:/\bavailable\b/, rent:/\brent\b|\bprice\b|\bcost\b|how much/, bed:/\bbedrooms?\b|\brooms?\b/,
  furn:/\bfurnished\b|\bfurniture\b/, view:/\b(see|view|visit|viewing)\b|when can/, school:/\bschool\b|\bclose to\b|\bnear\b/,
  dep:/\bdeposit\b/
};
var RXTIME = /\bat\s+(\d{1,2}(:\d{2})?|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b|o'clock|\b(\d{1,2}:\d{2})\b|\b(morning|afternoon|evening)\b/;
var RXPOLITEOPEN = /\b(hello|hi|dear|excuse me|good morning|good afternoon|good evening)\b/;
var RXPOLITEEND = /\b(thank you|thanks|thank|please)\b/;
var PHR = [
  /is the apartment available/, /how much is the monthly rent/, /how many bedrooms/, /is it furnished/,
  /is it close to a school/, /when can i see it/, /include the deposit/, /thank you for the information/
];
function analyse(text){
  var n = norm(text), parts={}, count=0;
  Object.keys(RX).forEach(function(k){ parts[k]=RX[k].test(n); if(parts[k]) count++; });
  var ph=0; PHR.forEach(function(r){ if(r.test(n)) ph++; });
  return { n:n, parts:parts, count:count, core:(parts.avail?1:0)+(parts.rent?1:0), time:RXTIME.test(n),
           open:RXPOLITEOPEN.test(n), end:RXPOLITEEND.test(n), phrases:ph };
}
function strengths(text){
  var a = analyse(text), out=[];
  if(a.parts.avail) out.push(["You asked if the apartment is available.","Vous avez demandé si l'appartement est disponible."]);
  if(a.parts.rent) out.push(["You asked about the rent.","Vous avez posé une question sur le loyer."]);
  if(a.parts.bed) out.push(["You asked about bedrooms.","Vous avez posé une question sur les chambres."]);
  if(a.parts.furn) out.push(["You asked about furniture.","Vous avez posé une question sur les meubles."]);
  if(a.parts.view) out.push(["You asked about seeing the apartment.","Vous avez demandé à visiter l'appartement."]);
  if(a.parts.school) out.push(["You asked about the location.","Vous avez posé une question sur l'emplacement."]);
  if(a.parts.dep) out.push(["You mentioned the deposit.","Vous avez mentionné la caution."]);
  if(a.open) out.push(["You started politely.","Vous avez commencé poliment."]);
  if(a.end) out.push(["You ended politely.","Vous avez terminé poliment."]);
  if(!out.length) out.push(["You wrote a first message. That is a good start.","Vous avez écrit un premier message. C'est un bon début."]);
  return out.slice(0,4);
}
function suggest(text){
  var a = analyse(text), s=[];
  if(a.count===0) s.push("purpose");
  else if(a.core<2 || a.count<3) s.push("complete");
  if(a.parts.view && !a.time && s.indexOf("complete")<0) s.push("complete");
  if(!a.end) s.push("polite");
  if(a.phrases<2) s.push("phrase");
  var out=[]; s.forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
  return out.slice(0,2);
}
function improvedFlags(t1,t2){
  var a=analyse(t1), b=analyse(t2);
  return {
    purpose: b.core>a.core,
    complete: b.count>a.count || (b.time && !a.time),
    phrase: b.phrases>a.phrases,
    polite: b.end && !a.end
  };
}

function revalidate(){
  if(S.focusFor !== hash(S.first)){ S.focus=[]; S.focusFor=hash(S.first); }
  var f = hash(S.first+"|"+S.second+"|"+S.focus.join(","));
  if(S.reflFor !== f){ S.reflect=[]; S.reflFor=""; }

var recorders = [];
var allUrls = [];
function makeRecorder(host, onValid){
  var stream=null, rec=null, chunks=[], url=null, audio=null, recording=false;
  var supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  host.innerHTML =
    '<fieldset><legend>'+bi("Optional: say your message aloud","Facultatif : dites votre message à voix haute")+'</legend>'+
    '<div class="rec-row">'+
    '<button type="button" class="btn-secondary" data-r="rec">'+bi("Record","Enregistrer")+'</button>'+
    '<button type="button" class="btn-secondary" data-r="stop" disabled>'+bi("Stop","Arrêter")+'</button>'+
    '<button type="button" class="btn-secondary" data-r="play" disabled>'+bi("Hear my recording","Écouter mon enregistrement")+'</button>'+
    '<button type="button" class="btn-secondary" data-r="again" disabled>'+bi("Try again","Réessayer")+'</button>'+
    '</div><p class="rec-status" role="status"></p></fieldset>';
  var bRec=host.querySelector('[data-r="rec"]'), bStop=host.querySelector('[data-r="stop"]'),
      bPlay=host.querySelector('[data-r="play"]'), bAgain=host.querySelector('[data-r="again"]'),
      st=host.querySelector(".rec-status");
  function msg(en,fr){ st.innerHTML = bi(en,fr); }
  function releaseTracks(){ if(stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} stream=null; } }
  function revoke(){ if(url){ try{ URL.revokeObjectURL(url); }catch(e){} url=null; } if(audio){ try{ audio.pause(); }catch(e){} audio=null; } }
  function idle(){ bRec.disabled=!supported; bStop.disabled=true; bPlay.disabled=!url; bAgain.disabled=!url; recording=false; }
  if(!supported){ msg("Recording is not available in this browser. You can type or build your message instead.","L'enregistrement n'est pas disponible dans ce navigateur. Vous pouvez écrire ou construire votre message."); bRec.disabled=true; }
  function fail(err){
    releaseTracks(); recording=false;
    var n = err && err.name;
    if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError") msg("The microphone is not allowed. You can type or build your message instead.","Le microphone n'est pas autorisé. Vous pouvez écrire ou construire votre message.");
    else if(n==="NotFoundError"||n==="OverconstrainedError"||n==="DevicesNotFoundError") msg("No microphone was found. You can type or build your message instead.","Aucun microphone n'a été trouvé. Vous pouvez écrire ou construire votre message.");
    else msg("Recording did not work this time. You can try again or type your message.","L'enregistrement n'a pas fonctionné cette fois. Vous pouvez réessayer ou écrire votre message.");
    idle(); announce(st.textContent);
  }
  function start(){
    if(!supported) return;
    revoke(); chunks=[]; bPlay.disabled=true; bAgain.disabled=true;
    var p;
    try{ p = navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ fail(e); return; }
    p.then(function(s){
      stream=s;
      try{ rec = new MediaRecorder(s); }catch(e){ fail(e); return; }
      rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      rec.onerror = function(e){ fail(e && e.error ? e.error : e); };
      rec.onstop = function(){
        releaseTracks(); recording=false;
        var blob = new Blob(chunks, {type:(rec && rec.mimeType) || "audio/webm"});
        if(!blob.size){ msg("The recording is empty. Press Record and try again.","L'enregistrement est vide. Appuyez sur Enregistrer et réessayez."); idle(); announce(st.textContent); return; }
        url = URL.createObjectURL(blob); allUrls.push(url);
        idle(); msg("Recording stopped. You can hear it now.","Enregistrement arrêté. Vous pouvez l'écouter."); announce(st.textContent);
        if(onValid) onValid();
      };
      try{ rec.start(); }catch(e){ fail(e); return; }
      recording=true; bRec.disabled=true; bStop.disabled=false; bPlay.disabled=true; bAgain.disabled=true;
      msg("Recording now. Press Stop when you finish.","Enregistrement en cours. Appuyez sur Arrêter quand vous avez fini."); announce(st.textContent);
    }).catch(fail);
  }
  bRec.addEventListener("click", start);
  bAgain.addEventListener("click", start);
  bStop.addEventListener("click", function(){ if(rec && rec.state!=="inactive"){ try{ rec.stop(); }catch(e){ fail(e); } } });
  bPlay.addEventListener("click", function(){
    if(!url) return;
    try{
      if(audio){ audio.pause(); }
      audio = new Audio(url);
      var pr = audio.play(); if(pr && pr.catch) pr.catch(function(){ msg("The recording could not play. Try recording again.","L'enregistrement ne peut pas être lu. Essayez de l'enregistrer à nouveau."); });
      msg("Playing your recording.","Lecture de votre enregistrement.");
    }catch(e){ msg("The recording could not play. Try recording again.","L'enregistrement ne peut pas être lu. Essayez de l'enregistrer à nouveau."); }
  });
  var api = { reset:function(){ if(rec && rec.state==="recording"){ try{ rec.onstop=null; rec.stop(); }catch(e){} } releaseTracks(); revoke(); idle(); if(supported) st.innerHTML=""; } };
  recorders.push(api);
  idle();
  return api;
}
function stopAllRecorders(){ recorders.forEach(function(r){ r.reset(); }); }
window.addEventListener("pagehide", function(){ stopAllRecorders(); allUrls.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} }); });

  var box = $("cues_"+t); if(!box) return;
  var n = S.h[t]||0;
  box.innerHTML = CUES[t].slice(0,n).map(function(c){ return '<div class="cue">'+bi(c[0],c[1])+'</div>'; }).join("");
  var btn = document.querySelector('[data-hint="'+t+'"]');
  if(btn){ btn.disabled = n>=CUES[t].length; if(btn.disabled) btn.innerHTML = bi("No more hints","Plus d'indices"); }
  if(t==="t1"){ qa('[data-pic]').forEach(function(p){ p.hidden = n<1; }); }
}
function evalR1(id, quiet){
  var it = R1.filter(function(x){ return x.id===id; })[0]; var v = S.r1[id]; var fb = $("fb_r1_"+id);
  if(!v){ setFb(fb,false,null); return; }
  var ok = v===id;
  setFb(fb, ok, ok?it.okEn:"Try again with this word.", ok?it.okFr:"Réessayez avec ce mot.");
}
function evalR2(id, final){
  var it = R2.filter(function(x){ return x.id===id; })[0]; var v = norm(S.r2[id]); var fb = $("fb_r2_"+id);
  if(!v){ setFb(fb,false,null); return; }
  var ok = it.ans.indexOf(v)>-1;
  if(ok) setFb(fb,true,it.okEn,it.okFr);
  else if(final) setFb(fb,false,"Try again with this phrase.","Réessayez avec cette phrase.");
  else setFb(fb,false,null);
}
function evalR3(id){
  var q = R3.filter(function(x){ return x.id===id; })[0]; var v = S.r3[id]; var fb = $("fb_r3_"+id);
  qa('[data-r3o^="'+id+'_"]').forEach(function(l){ l.classList.remove("is-ok","is-try"); });
  if(!v){ setFb(fb,false,null); return; }
  var ok = v==="ok";
  var lab = document.querySelector('[data-r3o="'+id+'_'+v+'"]'); if(lab) lab.classList.add(ok?"is-ok":"is-try");
  setFb(fb, ok, ok?q.okEn:"Try again with this phrase.", ok?q.okFr:"Réessayez avec cette phrase.");
}
function strengthsRender(){
  var ul = $("strengthList"); if(!ul) return;
  ul.innerHTML = strengths(S.first).map(function(s){ return '<li>'+bi(s[0],s[1])+'</li>'; }).join("");
  var sug = suggest(S.first);
  qa('[data-sugg]').forEach(function(t){ t.hidden = sug.indexOf(t.getAttribute("data-sugg"))<0; });
}
function focusFb(){
  var fb=$("fb_focus"); var boxes = qa('input[name="focus"]');
  var n = S.focus.length;
  boxes.forEach(function(b){ b.disabled = (n>=2 && !b.checked); });
  if(n===0) setFb(fb,false,null);
  else setFb(fb,true,"Good choice. Now make your second try.","Bon choix. Faites maintenant votre deuxième essai.");
}
function chosenListRender(){
  var el=$("chosenList"); if(!el) return;
  el.innerHTML = S.focus.map(function(k){ return bi(LABELS[k].en,LABELS[k].fr); }).join(" &middot; ");
}
function summaryRender(){
  var box=$("summaryBox"); if(!box) return;
  var fl = improvedFlags(S.first, S.second);
  var ks = ["purpose","complete","phrase","polite"].filter(function(k){ return fl[k]; });
  var html;
  if(ks.length){
    html = '<p style="margin:0 0 6px"><strong>'+bi("Your second try is clearer because you:","Votre deuxième essai est plus clair parce que vous avez :")+'</strong></p><ul class="plain">'+
      ks.map(function(k){
        var m={purpose:["made your purpose clearer","clarifié votre objectif"],complete:["added more information","ajouté plus d'informations"],phrase:["used a phrase from the lesson","utilisé une phrase de la leçon"],polite:["added a polite ending","ajouté une formule de politesse finale"]}[k];
        return '<li>'+bi(m[0],m[1])+'</li>';
      }).join("")+'</ul>';
  } else {
    html = '<p style="margin:0">'+bi("You kept your first try and made a second one. Next time, try adding one phrase from the phrase bank.","Vous avez gardé votre premier essai et fait un deuxième essai. La prochaine fois, essayez d'ajouter une phrase de la banque de phrases.")+'</p>';
  }
  box.innerHTML = html;
}
function fillTexts(){
  var f=$("firstTa"), s=$("secondTa");
  if(f && f.value!==S.first) f.value=S.first;
  if(s && s.value!==S.second) s.value=S.second;
  $("firstRO").textContent = S.first;
  $("cmpFirst").textContent = S.first;
  $("cmpSecond").textContent = S.second;
}
function bindDynamic(){
  /* hints */
  qa("[data-hint]").forEach(function(b){
    b.addEventListener("click", function(){
      var t=b.getAttribute("data-hint");
      if(S.h[t] < CUES[t].length){ S.h[t]++; renderCues(t); announce(CUES[t][S.h[t]-1][0].replace(/<[^>]+>/g,"")); saveSoon(); }
    });
  });
  /* recall 1 */
  qa("[data-r1]").forEach(function(sel){
    sel.addEventListener("change", function(){ S.r1[sel.getAttribute("data-r1")] = sel.value; evalR1(sel.getAttribute("data-r1")); afterChange(); });
  });
  /* recall 2 */
  qa("[data-r2]").forEach(function(inp){
    var id = inp.getAttribute("data-r2");
    inp.addEventListener("input", function(){ S.r2[id]=inp.value; evalR2(id,false); afterChange(); });
    inp.addEventListener("change", function(){ S.r2[id]=inp.value; evalR2(id,true); afterChange(); });
  });
  /* recall 3 */
  R3.forEach(function(q){
    qa('input[name="r3_'+q.id+'"]').forEach(function(r){
      r.addEventListener("change", function(){ S.r3[q.id]=r.value; evalR3(q.id); afterChange(); });
    });
  });
  $("recallAgain").addEventListener("click", function(){
    S.r1={}; S.r2={}; S.r3={}; S.h.t1=0; S.h.t2=0; S.h.t3=0;
    newOrders(); build(); applyAll(); showScreen(1); announce("This screen was reset."); saveSoon();
  });
  /* text areas */
  $("firstTa").addEventListener("input", function(){ S.first=this.value; revalidate(); afterChange(); });
  $("secondTa").addEventListener("input", function(){ S.second=this.value; revalidate(); afterChange(); });
  $("copyFirst").addEventListener("click", function(){ var t=$("secondTa"); t.value=S.first; S.second=S.first; revalidate(); afterChange(); t.focus(); });
  qa("[data-add]").forEach(function(b){
    b.addEventListener("click", function(){
      var ta=$(b.getAttribute("data-add")); var p=b.getAttribute("data-p");
      var cur=ta.value; if(cur && !/\s$/.test(cur)) cur+=" ";
      ta.value=(cur+p).slice(0,500);
      ta.dispatchEvent(new Event("input",{bubbles:true}));
    });
  });
  qa("[data-clear]").forEach(function(b){
    b.addEventListener("click", function(){ var ta=$(b.getAttribute("data-clear")); ta.value=""; ta.dispatchEvent(new Event("input",{bubbles:true})); ta.focus(); });
  });
  /* compare + focus */
  qa('input[name="cmp"]').forEach(function(r){
    r.addEventListener("change", function(){
      S.cmp=r.value; var ok=r.value==="b";
      qa("[data-cmpo]").forEach(function(l){ l.classList.remove("is-ok","is-try"); });
      r.closest("label").classList.add(ok?"is-ok":"is-try");
      setFb($("fb_cmp"), ok, ok?"Yes. This message is clearer: it has a polite start, complete questions and a polite ending.":"Try again with the other message. Look for complete questions.",
                           ok?"Oui. Ce message est plus clair : il commence poliment, a des questions complètes et se termine poliment.":"Essayez avec l'autre message. Cherchez des questions complètes.");
      afterChange();
    });
  });
  qa('input[name="focus"]').forEach(function(c){
    c.addEventListener("change", function(){
      S.focus = qa('input[name="focus"]').filter(function(x){ return x.checked; }).map(function(x){ return x.value; }).slice(0,2);
      S.focusFor = hash(S.first);
      revalidate(); focusFb(); chosenListRender(); afterChange();
    });
  });
  $("modelBox").addEventListener("toggle", function(){ if($("modelBox").open){ S.model=true; saveSoon(); } });
  /* reflection */
  qa('input[name="refl"]').forEach(function(c){
    c.addEventListener("change", function(){
      S.reflect = qa('input[name="refl"]').filter(function(x){ return x.checked; }).map(function(x){ return x.value; });
      S.reflFor = hash(S.first+"|"+S.second+"|"+S.focus.join(","));
      afterChange();
    });
  });
  /* recorders */
  recorders.length = 0;
  makeRecorder($("rec1"), function(){ S.spk1=true; saveSoon(); });
  makeRecorder($("rec2"), function(){ S.spk2=true; saveSoon(); });
}

/* apply the saved state to the freshly built DOM */
function applyAll(){
  var g = document.querySelector('input[name="goal"][value="'+S.goal+'"]');
  if(g){ g.checked=true; var ok=S.goal==="a"; g.closest("label").classList.add(ok?"is-ok":"is-try");
    setFb($("fb_goal"), ok, ok?"Yes. This matches the lesson goal.":"Try again with a different sentence.", ok?"Oui. Cela correspond à l'objectif de la leçon.":"Essayez avec une autre phrase."); }
  R1.forEach(function(i){ var s=$("r1_"+i.id); if(S.r1[i.id]){ s.value=S.r1[i.id]; evalR1(i.id); } });
  R2.forEach(function(i){ var s=$("r2_"+i.id); if(S.r2[i.id]){ s.value=S.r2[i.id]; evalR2(i.id,true); } });
  R3.forEach(function(q){ if(S.r3[q.id]){ var r=document.querySelector('input[name="r3_'+q.id+'"][value="'+S.r3[q.id]+'"]'); if(r){ r.checked=true; evalR3(q.id); } } });
  ["t1","t2","t3","t4"].forEach(renderCues);
  fillTexts();
  if(S.cmp){ var c=document.querySelector('input[name="cmp"][value="'+S.cmp+'"]'); if(c){ c.checked=true; var okc=S.cmp==="b"; c.closest("label").classList.add(okc?"is-ok":"is-try");
    setFb($("fb_cmp"), okc, okc?"Yes. This message is clearer: it has a polite start, complete questions and a polite ending.":"Try again with the other message. Look for complete questions.",
      okc?"Oui. Ce message est plus clair : il commence poliment, a des questions complètes et se termine poliment.":"Essayez avec l'autre message. Cherchez des questions complètes."); } }
  S.focus.forEach(function(k){ var b=document.querySelector('input[name="focus"][value="'+k+'"]'); if(b) b.checked=true; });
  focusFb(); chosenListRender(); strengthsRender();
  S.reflect.forEach(function(k){ var b=document.querySelector('input[name="refl"][value="'+k+'"]'); if(b) b.checked=true; });
  if(S.model) $("modelBox").open=true;
  summaryRender();
  applyLang();
}

/* ===================== NAVIGATION ===================== */
var NEXT = [
  ["Start my review","Commencer ma révision"], ["Continue","Continuer"], ["Review my first try","Revoir mon premier essai"],
  ["Make my second try","Faire mon deuxième essai"], ["Compare my tries","Comparer mes essais"], ["Finish review","Terminer la révision"]
];
var NEED = [
  ["Choose the sentence that matches the lesson goal to start.","Choisissez la phrase qui correspond à l'objectif de la leçon pour commencer."],
  ["Answer every question to continue. You can use a hint.","Répondez à toutes les questions pour continuer. Vous pouvez utiliser un indice."],
  ["Write at least three words to continue.","Écrivez au moins trois mots pour continuer."],
  ["Choose a message and one or two things to improve.","Choisissez un message et un ou deux points à améliorer."],
  ["Write a second try that is different from your first try.","Écrivez un deuxième essai différent du premier."],
  ["Choose at least one thing that improved.","Choisissez au moins un point qui s'est amélioré."]
];
function showScreen(i, noFocus){
  stopAllRecorders();
  S.screen = i;
  for(var k=0;k<NSCREENS;k++){ $("screen"+k).hidden = (k!==i); }
  if(i===3) strengthsRender();
  if(i===4){ fillTexts(); chosenListRender(); }
  if(i===5){ fillTexts(); summaryRender(); }
  $("progressFill").style.width = Math.round(((i+1)/NSCREENS)*100)+"%";
  var pl = $("progressLabel");
  pl.innerHTML = bi("Screen "+(i+1)+" of "+NSCREENS,"Écran "+(i+1)+" sur "+NSCREENS);
  updateNav();
  var hd = $("screen"+i).querySelector(".screen-title");
  if(hd && !noFocus){ try{ hd.focus({preventScroll:true}); }catch(e){ hd.focus(); } }
  window.scrollTo(0,0);
  if(!noFocus) announce(hd ? hd.textContent.replace(/\s+/g," ").slice(0,80) : "");
  saveSoon();
}
function updateNav(){
  var i = S.screen, last = (i===NSCREENS-1);
  var nb=$("nextBtn"), rb=$("retryBtn"), db=$("doneBtn"), hint=$("navHint");
  nb.hidden = last; rb.hidden = !last; db.hidden = !last;
  if(!last){
    nb.innerHTML = bi(NEXT[i][0],NEXT[i][1]);
    var ok = VALID[i]();
    nb.disabled = !ok;
    hint.innerHTML = ok ? "" : bi(NEED[i][0],NEED[i][1]);
    hint.hidden = false;
  } else {
    hint.innerHTML = "";
    var fin = canFinish();
    if(!completionSent) db.disabled = !fin;
  }
}
function afterChange(){ if(S.screen===3) strengthsRender(); if(S.screen===5) summaryRender(); updateNav(); saveSoon(); }

$("nextBtn").addEventListener("click", function(){
  if(S.screen<NSCREENS-1 && VALID[S.screen]()){
    if(S.screen===1){ /* nothing extra */ }
    if(S.screen===2){ S.focusFor = hash(S.first); }
    showScreen(S.screen+1);
  }
});

doneBtn.addEventListener("click", function(){
  if(S.screen!==NSCREENS-1 || !canFinish()) return;
  var ok = activityCompleted();
  var ds = $("doneStatus");
  if(ok){
    doneBtn.disabled = true;
    doneBtn.innerHTML = bi("Finished","Terminé");
    ds.hidden = false;
    ds.innerHTML = bi("Finished. Well done.","Terminé. Bravo.");
    announce("Finished. Well done.");
    saveSoon();
  } else {
    ds.hidden = false;
    ds.innerHTML = bi("Please press Done once more.","Appuyez encore une fois sur Terminé.");
  }
});

$("retryBtn").addEventListener("click", function(){
  stopAllRecorders();
  var keepLang = S.lang;
  S = fresh(); S.lang = keepLang;
  completionSent = false;
  doneBtn.disabled = true; doneBtn.innerHTML = bi("Done","Terminé");
  $("doneStatus").hidden = true; $("doneStatus").innerHTML = "";
  try{ localStorage.removeItem(KEY); }catch(e){}
  newOrders(); build(); applyAll(); showScreen(0);
  announce("The activity was reset. You can start again.");
  saveNow();
});

/* ===================== LANGUAGE TOGGLE ===================== */
function applyLang(){
  var fr = S.lang==="fr";
  document.body.setAttribute("data-lang", fr?"fr":"en");
  var lb = $("langBtn");
  lb.textContent = fr ? "English" : "Français";
  lb.setAttribute("lang", fr?"en":"fr");
  lb.setAttribute("aria-pressed", fr?"true":"false");
  lb.setAttribute("aria-label", fr ? "Switch to English" : "Passer en français");
  qa("[data-en]").forEach(function(e){ e.textContent = fr ? e.getAttribute("data-fr") : e.getAttribute("data-en"); });
  qa("[data-aen]").forEach(function(e){ e.setAttribute("aria-label", fr ? e.getAttribute("data-afr") : e.getAttribute("data-aen")); });
  document.documentElement.setAttribute("lang","en-GB");
}
$("langBtn").addEventListener("click", function(){
  S.lang = S.lang==="fr" ? "en" : "fr";
  applyLang(); announce(S.lang==="fr"?"Français":"English"); saveSoon();
});

/* ===================== INIT ===================== */
(function init(){
  var saved = loadSaved();
  S = sanitize(saved);
  newOrders();
  build();
  revalidate();
  if(S.done){ /* a finished review stays finished only on screen 7 */ }
  var m = allowedMax();
  var target = Math.min(S.screen, m);
  if(target===6 && !canFinish()) target = 5;
  applyAll();
  showScreen(target, true);
  if(S.done && target===6){
    completionSent = true;
    doneBtn.disabled = true; doneBtn.innerHTML = bi("Finished","Terminé");
    $("doneStatus").hidden=false; $("doneStatus").innerHTML = bi("Finished. Well done.","Terminé. Bravo.");
  }
})();
})();
</script>
