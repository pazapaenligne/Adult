<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workplace instructions – Listening Mission</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#D7F1F7;
  --green-tint:#F4F7DA;
  --yellow-tint:#FEF3CD;
  --white:#FFFFFF;
  --muted:#5B5B59;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);font-family:"Open Sans",Arial,sans-serif;font-size:1.0625rem;line-height:1.5}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;line-height:1.25;margin:0 0 .5rem;text-transform:none}
h1{font-size:1.9rem}
h2{font-size:1.55rem}
p{margin:0 0 .75rem}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column}
.topbar{background:var(--pazapa-blue);color:var(--pazapa-grey-dark);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:700;font-size:1rem}
.lesson-tag{font-size:.9rem}
.progress-region{padding:12px 16px 10px;border-bottom:1px solid var(--pazapa-grey-light);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress-main{flex:1 1 220px;min-width:0}
.progress-label{font-size:.9rem;font-weight:600;margin-bottom:6px}
.progress-track{height:10px;background:var(--pazapa-grey-light);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--pazapa-blue);transition:width .3s}
.fr-toggle{min-height:48px;min-width:48px;padding:8px 16px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);background:var(--white);font-weight:700}
.fr-toggle[aria-pressed="true"]{background:var(--pazapa-yellow)}
main{flex:1;padding:20px 16px 28px}
.screen{display:none}
.screen.active{display:block}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.instruction{font-size:1.15rem;font-weight:600}
.fr{display:none}
body.fr-on .fr{display:block}
.fr-line{background:var(--yellow-tint);border-left:5px solid var(--pazapa-yellow);padding:8px 12px;border-radius:6px;font-size:1rem;margin-bottom:12px}
.gloss{font-size:.85rem;font-weight:400;color:var(--muted);margin-top:2px}
body.fr-on .gloss{display:block}
/* audio */
.player{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--blue-tint);border-radius:12px;padding:12px;margin:12px 0}
.player .pnote{font-size:.95rem;flex:1 1 180px}
.btn{min-height:48px;min-width:48px;padding:10px 22px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);background:var(--white);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--pazapa-blue)}
.btn-help{background:var(--pazapa-yellow)}
.btn:disabled{background:var(--pazapa-grey-light);color:#6A6A68;border-color:#9A9A98;border-style:dashed;cursor:not-allowed}
.btn svg{width:22px;height:22px;flex:none}
details.transcript{margin:8px 0 16px;border:1px solid #BDBDBB;border-radius:10px;background:var(--white)}
details.transcript summary{min-height:48px;padding:12px 14px;font-weight:700;cursor:pointer;display:flex;align-items:center}
.tr-body{padding:4px 14px 12px}
.tr-line{margin:0 0 8px}
.tr-line b{font-weight:700}
.tr-line .fr{font-size:.95rem;color:var(--muted)}
.pending-note{background:var(--yellow-tint);border-left:5px solid var(--pazapa-yellow);padding:8px 12px;border-radius:6px;font-size:.95rem;margin-bottom:10px}
/* choices */
.grid{display:grid;gap:12px;margin:12px 0}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:560px){.grid.three{grid-template-columns:repeat(2,1fr)}.grid.situ{grid-template-columns:1fr}}
.choice{position:relative;min-height:64px;padding:12px;border-radius:12px;border:2px solid #9A9A98;background:var(--white);text-align:center;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.choice:disabled{opacity:.55;cursor:not-allowed}
.choice img{width:100%;max-width:130px;height:150px;object-fit:contain}
.choice img.wide{max-width:100%;height:120px;border-radius:8px}
.choice svg.ico{width:84px;height:84px}
.choice .mark{display:none;position:absolute;top:6px;right:8px;font-weight:800;font-size:1.1rem}
.choice[aria-pressed="true"]{border:4px solid var(--pazapa-grey-dark);background:var(--blue-tint);padding:10px}
.choice[aria-pressed="true"] .mark{display:block}
.choice.is-good{background:var(--green-tint);border-color:var(--pazapa-green);border-width:4px;padding:10px}
.choice.is-good .mark{display:block}
.choice.row{flex-direction:row;justify-content:flex-start;text-align:left;gap:14px}
.q{border:1px solid #D0D0CE;border-radius:12px;padding:14px;margin:14px 0}
.q h3{font-size:1.1rem}
.q-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.q-top img{width:96px;height:120px;object-fit:contain;flex:none}
.q-top .qtext{flex:1 1 200px}
.opts{display:grid;gap:10px;margin-top:10px}
.opts.row3{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
/* order */
.order-list{list-style:none;margin:12px 0;padding:0;display:grid;gap:10px}
.o-item{display:flex;align-items:center;gap:10px;border:2px solid #9A9A98;border-radius:12px;padding:10px;background:var(--white);flex-wrap:wrap}
.o-item.selected{border:4px solid var(--pazapa-grey-dark);background:var(--blue-tint);padding:8px}
.o-item.dragging{opacity:.75;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.o-item.is-good{background:var(--green-tint);border-color:var(--pazapa-green)}
.o-grip{width:48px;height:48px;border-radius:10px;border:2px solid var(--pazapa-grey-dark);background:var(--pazapa-grey-light);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;flex:none;font-size:1.4rem;line-height:1}
.o-item img{width:54px;height:72px;object-fit:contain;flex:none}
.o-text{flex:1 1 160px;font-weight:600}
.o-btns{display:flex;gap:8px;flex-wrap:wrap}
.o-btns .btn{padding:8px 14px}
/* feedback + actions */
.feedback{display:none;margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:600;align-items:flex-start;gap:10px}
.feedback.show{display:flex}
.feedback .dot{flex:none;width:16px;height:16px;border-radius:50%;margin-top:5px}
.feedback.hint{background:var(--yellow-tint)}
.feedback.hint .dot{background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark)}
.feedback.good{background:var(--green-tint)}
.feedback.good .dot{background:var(--pazapa-green);border:2px solid var(--pazapa-grey-dark)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.actions .spacer{flex:1}
.hidden{display:none !important}
.final{text-align:center;padding:10px 0}
.final img{max-width:300px;width:100%;height:auto;margin:10px auto}
.final .actions{justify-content:center}
.status-line{margin-top:12px;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Pazapa English Programme for Adults</div>
    <div class="lesson-tag">Week 11 · Lesson 2</div>
  </header>
  <div class="progress-region">
    <div class="progress-main">
      <div class="progress-label" id="progress-label">Screen 1 of 4</div>
      <div class="progress-track" role="progressbar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-outer"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <button type="button" class="fr-toggle" id="fr-toggle" aria-pressed="false" aria-label="Show French translation">Français</button>
  </div>
  <main id="main"></main>
</div>
<div class="sr-only" id="live" role="status" aria-live="polite"></div>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a,avoid){var b=a.slice(),t=0;do{for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x}t++}while(avoid&&b.join()===avoid.join()&&t<20);return b}
function same(a,b){return a.length===b.length&&a.every(function(v,i){return v===b[i]})}
var live=$("#live");
function say(m){live.textContent="";setTimeout(function(){live.textContent=m},40)}
function lsGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}

/* ========== STATE (progress only) ========== */
var TASKS = SCREENS.length;            // 4 task screens, then completion
var st;
function freshScreenState(def){
  var s={att:0,ok:false,rev:false,checked:false,hint:false};
  if(def.id==="s1"){s.sel=null;s.order=shuffle(def.opts.map(function(o){return o.id}))}
  if(def.id==="s2"){s.sel=[];s.order=shuffle(def.opts.map(function(o){return o.id}))}
  if(def.id==="s3"){s.sel={};s.orders={};def.qs.forEach(function(q){s.orders[q.id]=shuffle(q.opts.map(function(o){return o.id}))})}
  if(def.id==="s4"){var ids=def.items.map(function(i){return i.id});s.order=shuffle(ids,CONFIG.answers.s4);s.cur=null}
  return s;
}
function freshState(){
  var o={screen:0,heard:false,s:{}};
  SCREENS.forEach(function(d){o.s[d.id]=freshScreenState(d)});
  return o;
}
function validState(o){
  if(!o||typeof o!=="object"||!o.s)return false;
  return SCREENS.every(function(d){return o.s[d.id]&&typeof o.s[d.id].att==="number"})&&typeof o.screen==="number";
}
function loadState(){
  try{var o=JSON.parse(lsGet(CONFIG.storageKey)||"null");if(validState(o)){
    // sanity: orders must contain the right ids
    var f=freshState();
    SCREENS.forEach(function(d){var a=o.s[d.id],b=f.s[d.id];
      if(a.order&&b.order&&a.order.slice().sort().join()!==b.order.slice().sort().join())a.order=b.order;
      if(d.id==="s3"&&!a.orders)a.orders=b.orders;
    });
    return o}}catch(e){}
  return freshState();
}
function save(){lsSet(CONFIG.storageKey,JSON.stringify(st))}
function allOk(){return SCREENS.every(function(d){return st.s[d.id].ok})}

/* ========== AUDIO ENGINE (one source at a time, click-started, normal speed) ========== */
var audioEl=null,playing=false;
function audioSrc(){return AUDIO_FILES[CONFIG.audioKey]||""}
var AUDIO_PENDING=!audioSrc();
if(AUDIO_PENDING&&window.console)console.warn("W11D2: no recording supplied. Add it to AUDIO_FILES."+CONFIG.audioKey+" (audio pending mode).");
function updatePlayers(){
  $$(".player").forEach(function(p){
    var b=$(".p-play",p);
    b.setAttribute("aria-pressed",playing?"true":"false");
    b.setAttribute("aria-label",playing?"Pause audio":"Play audio");
    $(".p-play-txt",b).textContent=playing?"Pause":"Listen";
    $(".p-icon",b).innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z"/>';
  });
}
function getAudio(){
  if(audioEl)return audioEl;
  var a=new Audio();a.preload="auto";a.src=audioSrc();a.playbackRate=1;
  a.addEventListener("play",function(){playing=true;updatePlayers()});
  a.addEventListener("pause",function(){playing=false;updatePlayers()});
  a.addEventListener("ended",function(){playing=false;if(!st.heard){st.heard=true;save()}updatePlayers();refreshAll()});
  a.addEventListener("error",function(){playing=false;updatePlayers();if(window.console)console.error("Audio could not be loaded.")});
  audioEl=a;return a;
}
function playPause(){
  if(AUDIO_PENDING)return;
  var a=getAudio();
  if(playing){a.pause();return}
  var pr=a.play();if(pr&&pr.catch)pr.catch(function(e){if(window.console)console.error("Playback failed:",e)});
}
function restartAudio(){
  if(AUDIO_PENDING)return;
  var a=getAudio();try{a.currentTime=0}catch(e){}
  var pr=a.play();if(pr&&pr.catch)pr.catch(function(e){if(window.console)console.error("Playback failed:",e)});
}
function stopAudio(){if(audioEl){try{audioEl.pause();audioEl.currentTime=0}catch(e){}}if(window.speechSynthesis){try{window.speechSynthesis.cancel()}catch(e){}}playing=false;updatePlayers()}

function choiceBtn(o,extraCls){
  var b=el("button","choice"+(extraCls?" "+extraCls:""));b.type="button";b.setAttribute("aria-pressed","false");b.dataset.id=o.id;
  var inner="";
  if(o.ico)inner+=ICONS[o.ico];
  if(o.img)inner+='<img'+(o.wide?' class="wide"':'')+' src="'+IMAGES[o.img]+'" alt="" width="'+(o.wide?'180':'130')+'" height="'+(o.wide?'120':'150')+'">';
  inner+='<span>'+esc(o.label)+'<span class="fr gloss">'+esc(o.fr)+'</span></span><span class="mark" aria-hidden="true">✓</span>';
  b.innerHTML=inner;return b;
}
function buildTask(def,u){
  var s=st.s[def.id];
  u.task.innerHTML="";
  if(def.id==="s1"){
    var g=el("div","grid three situ");g.setAttribute("role","group");g.setAttribute("aria-label","Choose the situation");
    var byId={};def.opts.forEach(function(o){byId[o.id]=o});
    s.order.forEach(function(id){var b=choiceBtn(byId[id]);b.addEventListener("click",function(){selectOne(def,id)});g.appendChild(b)});
    u.task.appendChild(g);
  }
  if(def.id==="s2"){
    var g2=el("div","grid three");g2.setAttribute("role","group");g2.setAttribute("aria-label","Choose the words you hear");
    var m={};def.opts.forEach(function(o){m[o.id]=o});
    s.order.forEach(function(id){var b=choiceBtn(m[id]);b.addEventListener("click",function(){toggleMulti(def,id)});g2.appendChild(b)});
    u.task.appendChild(g2);
  }
  if(def.id==="s3"){
    def.qs.forEach(function(q,qi){
      var box=el("div","q");box.dataset.q=q.id;
      var top=el("div","q-top",'<img src="'+IMAGES[q.img]+'" alt="" width="96" height="120"><div class="qtext"><h3>'+(qi+1)+'. '+esc(q.q)+'</h3><p class="fr fr-line" style="margin:0">'+esc(q.fr)+'</p></div>');
      box.appendChild(top);
      var og=el("div","opts"+(q.opts[0].img?" row3":" row3"));og.setAttribute("role","group");og.setAttribute("aria-label",q.q);
      var mm={};q.opts.forEach(function(o){mm[o.id]=o});
      s.orders[q.id].forEach(function(id){var b=choiceBtn(mm[id],mm[id].img?"":"");b.addEventListener("click",function(){selectQ(def,q.id,id)});og.appendChild(b)});
      box.appendChild(og);u.task.appendChild(box);
    });
  }
  if(def.id==="s4"){
    var ol=el("ol","order-list");ol.setAttribute("aria-label","Message parts. Put them in order.");
    u.list=ol;u.task.appendChild(ol);
    renderOrder(def);
    wireDrag(def,ol);
  }
}

/* ========== SELECTIONS ========== */
function invalidate(def){
  var s=st.s[def.id];
  if(s.ok||s.checked||s.rev){s.ok=false;s.checked=false;s.rev=false;s.hint=false}
  s.hint=false;
}
function selectOne(def,id){
  var s=st.s[def.id];invalidate(def);s.sel=id;save();refresh(def);
}
function toggleMulti(def,id){
  var s=st.s[def.id];invalidate(def);
  var i=s.sel.indexOf(id);if(i>=0)s.sel.splice(i,1);else s.sel.push(id);save();refresh(def);
}
function selectQ(def,qid,id){
  var s=st.s[def.id];invalidate(def);s.sel[qid]=id;save();refresh(def);
}

/* ========== ORDER (drag + buttons) ========== */
var ARROW_UP='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5l7 8h-5v6h-4v-6H5z"/></svg>';
var ARROW_DOWN='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 19l-7-8h5V5h4v6h5z"/></svg>';
function renderOrder(def,focusId,focusDir){
  var s=st.s[def.id],u=ui[def.id],ol=u.list;ol.innerHTML="";
  var m={};def.items.forEach(function(it){m[it.id]=it});
  s.order.forEach(function(id,pos){
    var it=m[id];
    var li=el("li","o-item"+(s.cur===id?" selected":""));li.dataset.id=id;
    li.innerHTML='<span class="o-grip" aria-hidden="true">⠿</span>'+
      '<img src="'+IMAGES[it.img]+'" alt="" width="54" height="72">'+
      '<div class="o-text"><span class="sr-only">Position '+(pos+1)+' of 3. </span>'+esc(it.text)+'<span class="fr gloss">'+esc(it.fr)+'</span></div>'+
      '<div class="o-btns"><button type="button" class="btn o-up" aria-label="Move up: '+esc(it.text)+'"'+(pos===0?' disabled':'')+'>'+ARROW_UP+'Move up</button>'+
      '<button type="button" class="btn o-down" aria-label="Move down: '+esc(it.text)+'"'+(pos===s.order.length-1?' disabled':'')+'>'+ARROW_DOWN+'Move down</button></div>';
    li.addEventListener("click",function(e){if(e.target.closest(".o-btns"))return;selectCard(def,id)});
    $(".o-up",li).addEventListener("click",function(){moveCard(def,id,-1)});
    $(".o-down",li).addEventListener("click",function(){moveCard(def,id,1)});
    ol.appendChild(li);
  });
  if(focusId){
    var li2=$('[data-id="'+focusId+'"]',ol);
    if(li2){var b=$(focusDir<0?".o-up":".o-down",li2);if(b&&b.disabled)b=$(focusDir<0?".o-down":".o-up",li2);if(b)b.focus()}
  }
}
function selectCard(def,id){var s=st.s[def.id];s.cur=id;save();$$(".o-item",ui[def.id].list).forEach(function(li){li.classList.toggle("selected",li.dataset.id===id)})}
function moveCard(def,id,dir){
  var s=st.s[def.id];var i=s.order.indexOf(id),j=i+dir;if(j<0||j>=s.order.length)return;
  invalidate(def);
  var t=s.order[i];s.order[i]=s.order[j];s.order[j]=t;s.cur=id;save();
  renderOrder(def,id,dir);refresh(def);
  say("Moved to position "+(j+1)+" of 3.");
}
function wireDrag(def,ol){
  var drag=null;
  ol.addEventListener("pointerdown",function(e){
    var grip=e.target.closest(".o-grip");if(!grip)return;
    var li=grip.closest(".o-item");drag=li;li.classList.add("dragging");
    try{ol.setPointerCapture(e.pointerId)}catch(x){}
    e.preventDefault();
  });
  ol.addEventListener("pointermove",function(e){
    if(!drag)return;
    var items=$$(".o-item",ol);
    for(var k=0;k<items.length;k++){var o=items[k];if(o===drag)continue;
      var r=o.getBoundingClientRect();
      if(e.clientY>r.top&&e.clientY<r.bottom){
        var cur=items.indexOf(drag),idx=k;
        if(idx<cur)ol.insertBefore(drag,o);else ol.insertBefore(drag,o.nextSibling);
        break;
      }}
  });
  function end(e){
    if(!drag)return;
    var id=drag.dataset.id;drag.classList.remove("dragging");drag=null;
    try{ol.releasePointerCapture(e.pointerId)}catch(x){}
    var s=st.s[def.id];
    var newOrder=$$(".o-item",ol).map(function(li){return li.dataset.id});
    if(!same(newOrder,s.order)){invalidate(def);s.order=newOrder;s.cur=id;save();renderOrder(def);refresh(def);say("Card moved.")}
  }
  ol.addEventListener("pointerup",end);
  ol.addEventListener("pointercancel",end);
}

/* ========== CHECK / RETRY / SHOW ME ========== */
function isCorrect(def){
  var s=st.s[def.id],a=CONFIG.answers[def.id];
  if(def.id==="s1")return s.sel===a;
  if(def.id==="s2")return same(s.sel.slice().sort(),a.slice().sort());
  if(def.id==="s3")return def.qs.every(function(q){return s.sel[q.id]===a[q.id]});
  if(def.id==="s4")return same(s.order,a);
}
function canCheck(def){
  var s=st.s[def.id];
  if(def.id==="s1")return s.sel!==null&&(AUDIO_PENDING||st.heard);
  if(def.id==="s2")return s.sel.length>0;
  if(def.id==="s3")return def.qs.every(function(q){return !!s.sel[q.id]});
  return true;
}
function doCheck(def){
  var s=st.s[def.id];if(!canCheck(def))return;
  s.checked=true;
  if(isCorrect(def)){s.ok=true;s.hint=false;say("Correct.")}
  else{s.ok=false;s.att++;s.hint=true;say("Not yet.")}
  save();refresh(def);
}
function doRetry(def){
  st.s[def.id]=freshScreenState(def);
  buildTask(def,ui[def.id]);
  save();refresh(def);say("Screen reset.");
  var first=$(".choice,.o-up",ui[def.id].sec);if(first)first.focus();
}
function doShow(def){
  var s=st.s[def.id],a=CONFIG.answers[def.id];
  if(def.id==="s1")s.sel=a;
  if(def.id==="s2")s.sel=a.slice();
  if(def.id==="s3"){s.sel={};Object.keys(a).forEach(function(k){s.sel[k]=a[k]})}
  if(def.id==="s4"){s.order=a.slice();s.cur=null;renderOrder(def)}
  s.ok=true;s.rev=true;s.checked=true;s.hint=false;save();refresh(def);say("Answer shown.");
}

/* ========== REFRESH UI ========== */
function refresh(def){
  var s=st.s[def.id],u=ui[def.id];
  // selection states
  if(def.id==="s1"){$$(".choice",u.task).forEach(function(b){var on=s.sel===b.dataset.id;b.setAttribute("aria-pressed",on?"true":"false");b.classList.toggle("is-good",on&&s.ok);b.disabled=!(AUDIO_PENDING||st.heard)})}
  if(def.id==="s2"){$$(".choice",u.task).forEach(function(b){var on=s.sel.indexOf(b.dataset.id)>=0;var good=on&&s.checked&&CONFIG.answers.s2.indexOf(b.dataset.id)>=0;b.setAttribute("aria-pressed",on&&!good?"true":"false");b.classList.toggle("is-good",good)})}
  if(def.id==="s3"){$$(".q",u.task).forEach(function(box){var qid=box.dataset.q;$$(".choice",box).forEach(function(b){var on=s.sel[qid]===b.dataset.id;var good=on&&s.checked&&CONFIG.answers.s3[qid]===b.dataset.id;b.setAttribute("aria-pressed",on&&!good?"true":"false");b.classList.toggle("is-good",good)})})}
  if(def.id==="s4"){var a=CONFIG.answers.s4;$$(".o-item",u.list).forEach(function(li,i){li.classList.toggle("is-good",s.checked&&a[i]===li.dataset.id)})}
  // gate note for screen 1
  // feedback
  u.fb.className="feedback";
  if(s.ok){u.fb.className="feedback show good";$(".ftxt",u.fb).textContent=s.rev?"Here is the answer. Listen again and read it.":CONFIG.goodText[def.id]}
  else if(s.hint){u.fb.className="feedback show hint";$(".ftxt",u.fb).textContent=CONFIG.hints[def.id]}
  else if(def.id==="s1"&&!AUDIO_PENDING&&!st.heard){u.fb.className="feedback show hint";$(".ftxt",u.fb).textContent="Listen to the audio first. Then choose."}
  // buttons
  u.check.disabled=!canCheck(def);
  u.retry.classList.toggle("hidden",!(s.checked||s.att>0||s.ok));
  u.show.classList.toggle("hidden",!(s.att>=2&&!s.ok));
  u.next.disabled=!s.ok;
  u.next.textContent="Continue";
  // done button
  ui.done.disabled=!allOk();
}
function refreshAll(){SCREENS.forEach(refresh)}

/* ========== NAVIGATION ========== */
function goTo(i,noFocus){
  stopAudio();
  if(i>TASKS)i=TASKS;
  // never skip an unfinished screen
  for(var k=0;k<Math.min(i,TASKS);k++){if(!st.s[SCREENS[k].id].ok){i=k;break}}
  $$(".screen").forEach(function(s,idx){s.classList.toggle("active",idx===i)});
  st.screen=i;save();
  var pct=Math.round(i/TASKS*100);
  $("#progress-fill").style.width=pct+"%";
  $("#progress-outer").setAttribute("aria-valuenow",pct);
  $("#progress-label").textContent=i<TASKS?("Screen "+(i+1)+" of "+TASKS):"Listening Mission complete";
  refreshAll();
  if(!noFocus){var h=$("#h-"+i);if(h){h.focus({preventScroll:true})}window.scrollTo(0,0)}
}

/* ========== LMS / COMPLETION (separate from progress) ========== */
var completionSent=false, lmsDone=false;
function findAPIIn(win){
  var n=0;
  while(win&&n++<12){
    try{
      if(win.API)return {v:"1.2",api:win.API};
      if(win.API_1484_11)return {v:"2004",api:win.API_1484_11};
    }catch(e){}
    var p=null;try{p=win.parent}catch(e2){p=null}
    if(!p||p===win)break;win=p;
  }
  return null;
}
function discoverLms(){
  var f=null;
  try{f=findAPIIn(window)}catch(e){}
  if(!f){try{if(window.opener&&!window.opener.closed)f=findAPIIn(window.opener)}catch(e){}}
  return f;
}
function sendToLms(){
  if(lmsDone)return true;
  var f=discoverLms();if(!f)return false;
  try{
    var api=f.api;
    if(f.v==="1.2"){
      try{api.LMSInitialize("")}catch(e){}
      var cur=api.LMSGetValue("cmi.core.lesson_status");
      if(cur!=="completed"&&cur!=="passed")api.LMSSetValue("cmi.core.lesson_status","completed");
      api.LMSCommit("");
    }else{
      try{api.Initialize("")}catch(e){}
      var cs=api.GetValue("cmi.completion_status");
      if(cs!=="completed")api.SetValue("cmi.completion_status","completed");
      api.Commit("");
    }
    lmsDone=true;lsSet(CONFIG.completionKey,JSON.stringify({completed:true,lms:true}));
    return true;
  }catch(e){if(window.console)console.error("LMS error",e);return false}
}
function activityCompleted(){
  if(!allOk())return;
  if(!completionSent){
    completionSent=true;
    lsSet(CONFIG.completionKey,JSON.stringify({completed:true,lms:lmsDone}));
    sendToLms();
    if(window.console)console.log(CONFIG.logLabel);
  }
  showDoneState();
  say("Done.");
}
function showDoneState(){
  var d=$("#done-status");d.textContent="Done ✓";d.classList.remove("hidden");
}
document.addEventListener("pointerdown",function(){if(completionSent&&!lmsDone)sendToLms()},true);
document.addEventListener("keydown",function(){if(completionSent&&!lmsDone)sendToLms()},true);

/* ========== RESET (whole activity) ========== */
function resetAll(){
  stopAudio();
  var keepHeard=false;
  st=freshState();
  $("#main").innerHTML="";ui={};
  build();
  $("#done-status").classList.add("hidden");
  save();refreshAll();goTo(0);
  say("Activity reset. Start again.");
}

/* ========== FRENCH TOGGLE ========== */
$("#fr-toggle").addEventListener("click",function(){
  var on=document.body.classList.toggle("fr-on");
  this.setAttribute("aria-pressed",on?"true":"false");
  this.setAttribute("aria-label",on?"Hide French translation":"Show French translation");
});

/* ========== INIT ========== */
st=loadState();
try{var c=JSON.parse(lsGet(CONFIG.completionKey)||"null");if(c&&c.completed){completionSent=true;lmsDone=!!c.lms}}catch(e){}
build();
refreshAll();
var start=st.screen||0;
if(start>TASKS)start=TASKS;
goTo(start,true);
if(completionSent&&start===TASKS&&allOk())showDoneState();
if(completionSent&&!lmsDone)sendToLms();
})();
</script>
</body>
</html>
