<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedules and availability — Listening Mission</title>
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;
    --blue-tint:#E3F5F9;
    --green-tint:#F4F7D6;
    --yellow-tint:#FFF3C4;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Open Sans",Arial,sans-serif;
    background:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;touch-action:manipulation;}
  h1,h2,h3{
    font-family:"Filson Soft","Open Sans",Arial,sans-serif;
    font-weight:800;
    margin:0 0 10px 0;
    line-height:1.25;
    color:var(--pazapa-grey-dark);
  }
  h2{font-size:1.5rem;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
  }
  .app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;}
  header.topbar{
    background:var(--pazapa-blue);
    color:var(--pazapa-grey-dark);
    padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{font-weight:700;font-size:0.9rem;line-height:1.3;}
  .brand small{display:block;font-weight:600;font-size:0.8rem;}
  .lang-btn{
    white-space:nowrap;min-height:48px;min-width:48px;padding:8px 16px;
    border-radius:10px;border:2px solid var(--pazapa-grey-dark);
    background:var(--white);font-weight:700;font-size:0.95rem;cursor:pointer;
  }
  .lang-btn[aria-pressed="true"]{background:var(--pazapa-grey-dark);color:var(--white);}
  .progress-region{padding:12px 16px 8px;border-bottom:1px solid var(--pazapa-grey-light);}
  .progress-label{font-size:0.85rem;font-weight:700;margin-bottom:6px;}
  .progress-track{height:10px;background:var(--pazapa-grey-light);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--pazapa-green);border-radius:6px;transition:width .3s ease;width:0;}
  main{flex:1;padding:20px 16px 32px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .eyebrow{font-weight:700;font-size:0.85rem;margin:0 0 4px;color:var(--pazapa-grey-dark);}
  .instr{font-size:1.1rem;font-weight:700;margin:4px 0 14px;}
  .fr{display:none;font-weight:400;font-size:0.88em;color:#4A4A49;font-style:italic;}
  body.fr-on .fr{display:block;}
  .instr .fr, h2 .fr{font-weight:600;}
  .btn .fr, .pbtn .fr{font-size:0.78em;font-style:normal;color:inherit;opacity:.9;}

  /* Player */
  .player{background:var(--blue-tint);border:1px solid #BFE6EF;border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .player-row{display:flex;gap:10px;flex-wrap:wrap;}
  .pbtn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:48px;min-width:48px;padding:8px 18px;border-radius:10px;
    background:var(--pazapa-blue);border:2px solid var(--pazapa-blue);
    font-weight:700;font-size:1rem;cursor:pointer;color:var(--pazapa-grey-dark);
  }
  .pbtn.alt{background:var(--white);border-color:var(--pazapa-blue);}
  .pbtn:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6B6B69;cursor:not-allowed;}
  .pbtn svg{width:20px;height:20px;flex:none;}
  .pbtn > span{display:block;text-align:left;}
  .pnote{margin:8px 0 0;font-size:0.9rem;}
  .pnote.missing{background:var(--yellow-tint);border:1px solid var(--pazapa-yellow);border-radius:8px;padding:6px 10px;}
  .tr-toggle{
    margin-top:10px;min-height:48px;padding:8px 14px;border-radius:10px;
    background:var(--white);border:2px solid var(--pazapa-grey-dark);font-weight:700;cursor:pointer;font-size:0.95rem;
  }
  .tr-panel{margin-top:10px;background:var(--white);border:1px solid #BFE6EF;border-radius:10px;padding:10px 14px;}
  .tr-panel[hidden]{display:none;}
  .tr-line{margin:0 0 8px;}
  .tr-line:last-child{margin-bottom:0;}
  .spk{font-weight:700;}

  /* Choices */
  .grid{display:grid;gap:12px;margin:10px 0;}
  .grid.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
  .grid.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .opt{
    position:relative;background:var(--white);border:3px solid var(--pazapa-grey-light);
    border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer;
    font-size:1.02rem;font-weight:700;min-height:56px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;
  }
  .opt:hover:not(:disabled){border-color:var(--pazapa-blue);}
  .opt:disabled{cursor:not-allowed;opacity:.6;}
  .opt[aria-pressed="true"]{border-color:var(--pazapa-blue);background:var(--blue-tint);}
  .opt .mk{
    position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;
    display:none;align-items:center;justify-content:center;font-weight:800;font-size:1rem;
  }
  .opt[aria-pressed="true"] .mk.sel-mk{display:flex;background:var(--pazapa-blue);}
  .opt.good{border-color:var(--pazapa-green);background:var(--green-tint);}
  .opt.good .mk,.opt[aria-pressed="true"].good .mk.sel-mk{display:flex;background:var(--pazapa-green);}
  .opt.nudge{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
  .opt.nudge .mk,.opt[aria-pressed="true"].nudge .mk.sel-mk{display:flex;background:var(--pazapa-yellow);}
  .opt img{height:120px;width:auto;max-width:100%;object-fit:contain;border-radius:10px;display:block;}
  .opt svg.ico{width:64px;height:64px;}
  .opt .lbl{display:block;}
  .row-opts{display:flex;flex-direction:column;gap:10px;}
  .row-opts .opt{flex-direction:row;justify-content:flex-start;text-align:left;padding-right:44px;}
  .row-opts .opt img{height:64px;}
  .q{border:0;margin:0 0 18px;padding:0;}
  .q legend{font-weight:700;font-size:1.05rem;padding:0;margin-bottom:8px;width:100%;}
  .q .qimg{display:flex;align-items:center;gap:12px;}
  .q .qimg img{height:70px;width:auto;border-radius:8px;}
  .qno{font-size:0.82rem;font-weight:700;}

  /* Ordering */
  .olist{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;}
  .ocard{
    display:flex;align-items:center;gap:10px;background:var(--white);
    border:3px solid var(--pazapa-grey-light);border-radius:14px;padding:10px;
  }
  .ocard:focus-within,.ocard.dragging{border-color:var(--pazapa-blue);background:var(--blue-tint);}
  .ocard.dragging{box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .ocard.good{border-color:var(--pazapa-green);background:var(--green-tint);}
  .ocard.nudge{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
  .ocard .num{
    flex:none;width:36px;height:36px;border-radius:50%;background:var(--pazapa-blue);
    font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .ocard img{height:72px;width:auto;border-radius:8px;flex:none;}
  .ocard .txt{flex:1;font-weight:700;}
  .ocard .ctl{display:flex;flex-direction:column;gap:6px;flex:none;}
  .grip{
    flex:none;width:48px;min-height:48px;align-self:stretch;border:2px dashed var(--pazapa-grey-dark);
    border-radius:10px;background:var(--white);cursor:grab;touch-action:none;
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;line-height:1;
  }
  .mv{
    min-height:48px;min-width:48px;padding:6px 10px;border-radius:10px;border:2px solid var(--pazapa-blue);
    background:var(--white);font-weight:700;font-size:0.9rem;cursor:pointer;
  }
  .mv:disabled{border-color:var(--pazapa-grey-light);color:#6B6B69;cursor:not-allowed;}
  @media (max-width:520px){
    .ocard{flex-wrap:wrap;}
    .ocard .txt{flex-basis:calc(100% - 140px);}
    .ocard .ctl{flex-direction:row;flex-basis:100%;}
    .ocard .ctl .mv{flex:1;}
    .grip{display:none;}
  }

  .feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:700;display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:var(--green-tint);border:2px solid var(--pazapa-green);}
  .feedback.nudge{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);}
  .feedback.info{background:var(--blue-tint);border:2px solid var(--pazapa-blue);}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center;}
  .actions .spacer{flex:1;}
  .btn{
    font-size:1rem;font-weight:700;border-radius:10px;padding:10px 22px;border:2px solid transparent;
    cursor:pointer;min-height:48px;min-width:48px;text-align:center;
  }
  .btn-primary{background:var(--pazapa-blue);border-color:var(--pazapa-blue);color:var(--pazapa-grey-dark);}
  .btn-primary:hover:not(:disabled){background:#29A9C4;}
  .btn-ghost{background:var(--white);border-color:var(--pazapa-grey-dark);color:var(--pazapa-grey-dark);}
  .btn-help{background:var(--pazapa-yellow);border-color:var(--pazapa-yellow);}
  .btn:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6B6B69;cursor:not-allowed;}
  .btn[hidden]{display:none;}
  :focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .final{text-align:center;padding:16px 0 8px;}
  .final img{height:200px;width:auto;border-radius:12px;display:block;margin:0 auto 16px;}
  .final .next{font-weight:700;margin-top:8px;}
  .final .actions{justify-content:center;}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="brand">Pazapa English Programme for Adults<small>Week 11 · Lesson 3</small></div>

  </div>

  <main id="main"></main>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

/* ======================================================================
   HELPERS
   ====================================================================== */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function T(en, fr){ return '<span class="en">'+en+'</span><span class="fr" lang="fr">'+fr+'</span>'; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sameArr(a,b){ return a.length===b.length && a.every(function(v,i){ return v===b[i]; }); }
function sameSet(a,b){ return a.length===b.length && a.every(function(v){ return b.indexOf(v)>-1; }); }
function ids(list){ return list.map(function(o){ return o.id; }); }
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ window.localStorage.removeItem(k); }catch(e){} }
var live = $("#live");
function announce(msg){ live.textContent=""; window.setTimeout(function(){ live.textContent=msg; },50); }

var audioReady = typeof AUDIO_FILES.main === "string" && AUDIO_FILES.main.length > 0;
if(!audioReady){ try{ console.warn("W11D3 Listening Mission: AUDIO PLACEHOLDER ACTIVE. No recording supplied (AUDIO_FILES.main is empty). Listen controls are disabled and the script is shown."); }catch(e){} }

/* ======================================================================
   STATE
   ====================================================================== */
function orderNotCorrect(){
  var correct = CONFIG.answers.s4, o;
  do { o = shuffle(correct); } while(sameArr(o, correct));
  return o;
}
function freshScreen(n){
  if(n===1) return { sel:null, att:0, st:"idle", msg:null, heard:false, order:shuffle(ids(CONFIG.s1)) };
  if(n===2) return { sel:[],   att:0, st:"idle", msg:null, heard:false, order:shuffle(ids(CONFIG.s2)) };
  if(n===3){
    var orders = {};
    CONFIG.s3.forEach(function(q){ orders[q.id] = shuffle(ids(q.opts)); });
    return { sel:{q1:null,q2:null,q3:null}, att:0, st:"idle", msg:null, heard:false, orders:orders };
  }
  return { order:orderNotCorrect(), att:0, st:"idle", msg:null, heard:false };
}
function freshState(){ return { v:1, screen:1, s1:freshScreen(1), s2:freshScreen(2), s3:freshScreen(3), s4:freshScreen(4) }; }
function validState(s){
  try{
    return s && s.v===1 && s.screen>=1 && s.screen<=5 &&
      s.s1 && s.s2 && s.s3 && s.s4 && s.s1.order && s.s2.order && s.s3.orders && s.s4.order &&
      s.s1.order.length===3 && s.s2.order.length===6 && s.s4.order.length===3;
  }catch(e){ return false; }
}
var S;
(function(){
  var raw = lsGet(CONFIG.storageKey), parsed = null;
  try{ parsed = raw ? JSON.parse(raw) : null; }catch(e){ parsed = null; }
  S = validState(parsed) ? parsed : freshState();
})();
function save(){ lsSet(CONFIG.storageKey, JSON.stringify(S)); }
function resolved(n){ var s=S["s"+n]; return s.st==="ok" || s.st==="shown"; }
function allResolved(){ return resolved(1)&&resolved(2)&&resolved(3)&&resolved(4); }
function needHear(n){ return audioReady && !S["s"+n].heard; }

/* ======================================================================
   AUDIO ENGINE  (one sound at a time, started only by a learner click/tap)
   ====================================================================== */
var audio = null, audioOwner = 0;
function getAudio(){
  if(!audio){
    audio = new Audio();
    audio.preload = "auto";
    audio.addEventListener("ended", function(){
      var n = audioOwner;
      if(n>=1 && n<=4 && !S["s"+n].heard){
        S["s"+n].heard = true; save();
        refresh(n);
        announce("Audio finished.");
      }
      updatePlayers();
    });
    audio.addEventListener("play", updatePlayers);
    audio.addEventListener("pause", updatePlayers);
    audio.addEventListener("error", function(){ try{ console.error("Audio loading error:", audio.error ? audio.error.code : "unknown"); }catch(e){} updatePlayers(); });
  }
  return audio;
}
function stopAudio(){
  if(audio){ try{ audio.pause(); audio.currentTime = 0; }catch(e){} }
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
}
function playAudio(n, restart){
  if(!audioReady){ try{ console.error("MISSING AUDIO FILE: AUDIO_FILES.main"); }catch(e){} return; }
  var a = getAudio();
  if(audioOwner !== n){ a.pause(); audioOwner = n; try{ a.currentTime = 0; }catch(e){} }
  if(!a.src || a.getAttribute("data-set")!=="1"){ a.src = AUDIO_FILES.main; a.setAttribute("data-set","1"); }
  if(restart){ try{ a.currentTime = 0; }catch(e){} }
  var p = a.play();
  if(p && typeof p.catch === "function"){ p.catch(function(err){ try{ console.error("Audio playback failed:", err); }catch(e){} updatePlayers(); }); }
}
function pauseAudio(){ if(audio){ audio.pause(); } }
function isPlaying(n){ return audio && audioOwner===n && !audio.paused && !audio.ended; }

function updatePlayers(){
  $$(".player").forEach(function(p){

    btn.setAttribute("aria-pressed", playing ? "true" : "false");

    btn.innerHTML = (playing ? SVG_PAUSE : SVG_PLAY) + '<span class="plabel">'+(playing ? T("Pause","Pause") : T("Play","Lecture"))+'</span>';
  });
}

function byId(list,id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function mark(cls){ return cls==="good" ? "✓" : (cls==="nudge" ? "!" : ""); }

function render1(){
  var s=S.s1, locked = needHear(1);
  var showMarks = s.st==="ok"||s.st==="wrong"||s.st==="shown";
  var html = '<div class="grid g3" role="group" aria-label="Choose the situation">';
  s.order.forEach(function(id){
    var o = byId(CONFIG.s1,id), sel = s.sel===id, cls="";
    if(showMarks && sel){ cls = (id===CONFIG.answers.s1) ? "good" : "nudge"; }
    if(s.st==="shown" && id===CONFIG.answers.s1) cls="good";
    html += '<button type="button" class="opt '+cls+'" data-k="'+id+'" aria-pressed="'+(sel?'true':'false')+'"'+(locked?' disabled':'')+'>'+
      (o.img ? '<img src="'+IMAGES[o.img]+'" alt="'+IMG_ALT[o.img]+'">' : ICONS[o.icon])+'<span class="lbl">'+T(o.en,o.fr)+'</span><span class="mk sel-mk" aria-hidden="true">'+(cls?mark(cls):"✓")+'</span></button>';
  });
  html += '</div>';
  $("#ui1").innerHTML = html;
  $("#hold1").innerHTML = locked ? T("Listen to the audio to the end. Then choose.","Écoutez l’audio jusqu’à la fin. Ensuite, choisissez.") : "";
}
function render2(){
  var s=S.s2, locked=false;
  var showMarks = s.st==="ok"||s.st==="wrong"||s.st==="shown";
  var html = '<div class="grid g6" role="group" aria-label="Choose the words you hear">';
  s.order.forEach(function(id){
    var o = byId(CONFIG.s2,id), sel = s.sel.indexOf(id)>-1, cls="";
    var isKey = CONFIG.answers.s2.indexOf(id)>-1;
    if(showMarks){

var FB_SHOWN = ["Here is the answer. Listen again to hear it.","Voici la réponse. Écoutez encore pour l’entendre."];
var FB_HEAR  = ["Listen to the audio to the end first.","Écoutez d’abord l’audio jusqu’à la fin."];

function refresh(n){
  var s = S["s"+n];
  var focusKey=null, focusQ=null, ae=document.activeElement;
  if(ae && ae.getAttribute && $("#ui"+n).contains(ae)){ focusKey=ae.getAttribute("data-k"); focusQ=ae.getAttribute("data-q"); }
  renderers[n]();
  if(focusKey && n!==4){
    var sel = '[data-k="'+focusKey+'"]'+(focusQ?'[data-q="'+focusQ+'"]':'');
    var el = $(sel, $("#ui"+n)); if(el && !el.disabled) el.focus();
  }
  var fb = $("#fb"+n), msg = null, cls = "";
  if(s.msg){ msg = s.msg; cls = "info"; }
  else if(s.st==="ok"){ msg = FB[n].ok; cls="good"; }
  else if(s.st==="wrong"){ msg = FB[n].wrong; cls="nudge"; }
  else if(s.st==="shown"){ msg = FB_SHOWN; cls="info"; }
  if(msg && msg[0]){ fb.innerHTML = T(msg[0],msg[1]); fb.className = "feedback show "+cls; }
  else { fb.innerHTML=""; fb.className="feedback"; }
  var scr = $("#screen"+n);
  var done = resolved(n);
  $('[data-act="check"]', scr).disabled = done;
  $('[data-act="next"]', scr).disabled = !done;
  $('[data-act="show"]', scr).hidden = !(s.att>=2 && !done);
  updateDone();
}

/* ======================================================================
   INTERACTIONS
   ====================================================================== */
function invalidate(n){
  var s=S["s"+n];
  if(s.st!=="idle"){ s.st="idle"; }
  s.msg=null;
}
function onChoose(n, e){
  var btn = e.target.closest(".opt"); if(!btn || btn.disabled) return;
  var s=S["s"+n], k=btn.getAttribute("data-k");
  invalidate(n);
  if(n===1){ s.sel = k; }
  else if(n===2){ var i=s.sel.indexOf(k); if(i>-1) s.sel.splice(i,1); else s.sel.push(k); }
  else if(n===3){ s.sel[btn.getAttribute("data-q")] = k; }
  save(); refresh(n);
}
function check(n){
  var s=S["s"+n];
  if(needHear(n)){ s.msg=FB_HEAR; save(); refresh(n); announce(FB_HEAR[0]); return; }
  var ok=false, complete=true;
  if(n===1){ complete = !!s.sel; ok = s.sel===CONFIG.answers.s1; }
  if(n===2){ complete = s.sel.length>0; ok = sameSet(s.sel, CONFIG.answers.s2); }
  if(n===3){ complete = CONFIG.s3.every(function(q){ return !!s.sel[q.id]; });
             ok = CONFIG.s3.every(function(q){ return s.sel[q.id]===CONFIG.answers.s3[q.id]; }); }
  if(n===4){ ok = sameArr(s.order, CONFIG.answers.s4); }
  if(!complete){ s.msg=FB[n].miss; save(); refresh(n); announce(FB[n].miss[0]); return; }
  s.msg=null;
  if(ok){ s.st="ok"; } else { s.st="wrong"; s.att++; }
  save(); refresh(n);
  announce(ok ? FB[n].ok[0] : FB[n].wrong[0]);
  if(ok){ var nx=$('#screen'+n+' [data-act="next"]'); if(nx) nx.focus(); }
}
function again(n){
  var heard = S["s"+n].heard;
  S["s"+n] = freshScreen(n);
  S["s"+n].heard = heard;
  save(); refresh(n);
  announce("This screen is reset.");
}
function showMe(n){
  var s=S["s"+n];
  if(n===1) s.sel = CONFIG.answers.s1;
  if(n===2) s.sel = CONFIG.answers.s2.slice();
  if(n===3) s.sel = JSON.parse(JSON.stringify(CONFIG.answers.s3));
  if(n===4) s.order = CONFIG.answers.s4.slice();
  s.st="shown"; s.msg=null;
  save(); refresh(n);
  announce(FB_SHOWN[0]);
}

/* Ordering: Move up / Move down + drag */
function syncOrderFromDom(){
  var cards = $$("#olist .ocard");
  S.s4.order = cards.map(function(c){ return c.getAttribute("data-k"); });
  cards.forEach(function(c,i){
    $(".num",c).textContent = i+1;
    var up = $('[data-mv="-1"]',c), dn = $('[data-mv="1"]',c);
    up.disabled = (i===0); dn.disabled = (i===cards.length-1);
    c.classList.remove("good","nudge");
  });
  invalidate(4); save(); refresh4Light();
}
function refresh4Light(){
  var fb=$("#fb4"); fb.innerHTML=""; fb.className="feedback";
  var scr=$("#screen4");
  $('[data-act="check"]',scr).disabled=false;
  $('[data-act="next"]',scr).disabled=true;
  $('[data-act="show"]',scr).hidden = !(S.s4.att>=2);
  updateDone();
}
function moveCard(card, dir){
  var list=$("#olist"), cards=$$(".ocard",list), i=cards.indexOf(card), j=i+dir;
  if(j<0||j>=cards.length) return;
  if(dir<0) list.insertBefore(card, cards[j]); else list.insertBefore(card, cards[j].nextSibling);
  syncOrderFromDom();
  var want = $('[data-mv="'+dir+'"]',card);
  if(want.disabled) want = $('[data-mv="'+(-dir)+'"]',card);
  want.focus();
  announce("Moved to position "+(cards.indexOf(card)+1)+" of 3.");
}
(function(){
  var drag=null;
  main.addEventListener("pointerdown",function(e){
    var grip=e.target.closest(".grip"); if(!grip) return;
    var list=$("#olist"); if(!list) return;
    var card=grip.closest(".ocard");
    drag={card:card,id:e.pointerId,list:list};
    card.classList.add("dragging");
    try{ list.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  main.addEventListener("pointermove",function(e){
    if(!drag||e.pointerId!==drag.id) return;
    var others=$$(".ocard",drag.list).filter(function(c){ return c!==drag.card; }), before=null;
    for(var i=0;i<others.length;i++){
      var r=others[i].getBoundingClientRect();
      if(e.clientY < r.top + r.height/2){ before=others[i]; break; }
    }
    if(before!==drag.card.nextElementSibling){ drag.list.insertBefore(drag.card,before); }
  });
  function end(e){
    if(!drag||e.pointerId!==drag.id) return;
    drag.card.classList.remove("dragging");
    try{ drag.list.releasePointerCapture(e.pointerId); }catch(err){}
    drag=null; syncOrderFromDom();
  }
  main.addEventListener("pointerup",end);
  main.addEventListener("pointercancel",end);
})();

/* ======================================================================
   NAVIGATION + PROGRESS
   ====================================================================== */
var TOTAL=5;
function showScreen(n){
  stopAudio(); audioOwner=0; updatePlayers();
  S.screen=n; save();
  $$(".screen").forEach(function(sc){ sc.classList.remove("active"); });
  $("#screen"+n).classList.add("active");
  var pct = Math.round(((n-1)/(TOTAL-1))*100);
  $("#progFill").style.width = pct+"%";
  $("#progOuter").setAttribute("aria-valuenow", pct);
  $("#progLabel").innerHTML = T("Screen "+n+" of "+TOTAL, "Écran "+n+" sur "+TOTAL);
  var h = $("#h"+n); if(h) h.focus();
  window.scrollTo(0,0);
  updateDone();
}

/* ======================================================================
   COMPLETION + LMS  (silent: nothing about the LMS is ever shown to the learner)
   ====================================================================== */
var doneBtn = document.getElementById("doneBtn");
doneBtn.disabled = true;
let completionSent = false;
if(lsGet(CONFIG.doneKey)==="1"){ completionSent = true; }

function updateDone(){
  var ready = (S.screen===5) && allResolved();
  doneBtn.disabled = !ready;
  var label = completionSent ? T("Done ✓","Terminé ✓") : T("Done","Terminé");
  if(doneBtn.getAttribute("data-sent")!==(completionSent?"1":"0")){
    doneBtn.innerHTML = label; doneBtn.setAttribute("data-sent", completionSent?"1":"0");
  }
}

var lms = null, lmsTried = 0;
function findAPIIn(win){
  var hops=0;
  while(win && hops<10){
    try{
      if(win.API) return {v:"1.2", api:win.API};
      if(win.API_1484_11) return {v:"2004", api:win.API_1484_11};
    }catch(e){}
    var next=null;
    try{ next = (win.parent && win.parent!==win) ? win.parent : null; }catch(e){ next=null; }
    if(!next) break;
    win = next; hops++;
  }
  return null;
}
function discoverLMS(){
  if(lms) return lms;
  lmsTried++;
  var found = findAPIIn(window);
  if(!found){ try{ if(window.opener && !window.opener.closed){ found = findAPIIn(window.opener); } }catch(e){} }
  if(found){ lms = found; }
  return lms;
}
function sendToLMS(){
  var l = discoverLMS(); if(!l) return false;
  try{
    if(l.v==="1.2"){
      var cur = String(l.api.LMSGetValue("cmi.core.lesson_status")||"");
      if(!l.inited){ try{ l.api.LMSInitialize(""); }catch(e){} l.inited=true; cur = String(l.api.LMSGetValue("cmi.core.lesson_status")||""); }
      if(cur==="completed"||cur==="passed") return true;       // never overwrite / downgrade
      l.api.LMSSetValue("cmi.core.lesson_status","completed");
      l.api.LMSCommit("");
      return true;
    } else {
      if(!l.inited){ try{ l.api.Initialize(""); }catch(e){} l.inited=true; }
      var cur2 = String(l.api.GetValue("cmi.completion_status")||"");
      if(cur2==="completed") return true;
      l.api.SetValue("cmi.completion_status","completed");
      l.api.Commit("");
      return true;
    }
  }catch(e){ try{ console.error("LMS error:", e); }catch(err){} return false; }
}
var lmsDone = false;
function activityCompleted(){
  if(lmsDone) return;                       // idempotent: one commit only
  if(!allResolved()) return;                // never complete early
  lmsDone = true;
  completionSent = true;
  lsSet(CONFIG.doneKey,"1");                // local record (separate from progress state)
  sendToLMS();                              // silently, if an LMS is present
  try{ console.log(CONFIG.logLabel); }catch(e){}
}
if(completionSent){ lmsDone = true; }       // restored as completed: never resend or downgrade
// keep looking for an LMS after later interaction if none was found yet
document.addEventListener("pointerdown", function(){ if(!lms && lmsTried<5){ discoverLMS(); } }, {passive:true});

doneBtn.addEventListener("click", function(){
  if(doneBtn.disabled) return;
  activityCompleted();
  updateDone();
  announce("Listening Mission complete. Done.");
});
document.getElementById("againAllBtn").addEventListener("click", function(){
  // Full retry of the activity. Learner progress is cleared; an LMS completion already sent is never downgraded.
  stopAudio();
  S = freshState();
  save();
  [1,2,3,4].forEach(refresh);
  showScreen(1);
  announce("The activity is reset. Start again.");
});

/* ======================================================================
   EVENT WIRING
   ====================================================================== */
main.addEventListener("click", function(e){
  var t = e.target;
  var player = t.closest(".player");
  if(player){
    var n = parseInt(player.getAttribute("data-player"),10);
    var b = t.closest("button"); if(!b || b.disabled) return;
    var act = b.getAttribute("data-act");
    if(act==="play"){ if(isPlaying(n)) pauseAudio(); else playAudio(n,false); }
    else if(act==="replay"){ playAudio(n,true); }
    else if(act==="tr"){
      var panel = $('[data-tr="'+n+'"]', player), open = panel.hidden;
      panel.hidden = !open; b.setAttribute("aria-expanded", open?"true":"false");
    }
    return;
  }
  var ab = t.closest("button[data-act]");
  if(ab){
    var nn = parseInt(ab.getAttribute("data-n"),10), a = ab.getAttribute("data-act");
    if(a==="check") check(nn);
    else if(a==="again") again(nn);
    else if(a==="show") showMe(nn);
    else if(a==="next"){ if(resolved(nn)) showScreen(nn+1); }
    return;
  }
  var mv = t.closest(".mv");
  if(mv && !mv.disabled){ moveCard(mv.closest(".ocard"), parseInt(mv.getAttribute("data-mv"),10)); return; }
  var screen = t.closest(".screen");
  if(screen && t.closest(".opt")){
    var sn = parseInt(screen.id.replace("screen",""),10);
    onChoose(sn, e);
  }
});

/* French support toggle */
function setLang(on, persist){
  document.body.classList.toggle("fr-on", on);
  var b=$("#langBtn");
  b.setAttribute("aria-pressed", on?"true":"false");
  b.setAttribute("aria-label", on ? "Hide French translation" : "Show French translation");
  $("#langTxt").textContent = on ? "Français ✓" : "Français";
  if(persist) lsSet(CONFIG.langKey, on?"1":"0");
}
$("#langBtn").addEventListener("click", function(){ setLang(!document.body.classList.contains("fr-on"), true); });
setLang(lsGet(CONFIG.langKey)==="1", false);

/* ======================================================================
   INIT
   ====================================================================== */
[1,2,3,4].forEach(refresh);
updatePlayers();
showScreen(S.screen);
// showScreen moves focus to the heading; avoid stealing focus on first page load
if(document.activeElement && document.activeElement.blur){ try{ document.activeElement.blur(); }catch(e){} }
window.scrollTo(0,0);

})();
