<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communication Mission - Using an online learning platform</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-tint:#EAF8FB;
  --pazapa-green:#C9D646;
  --pazapa-green-tint:#F7FAEC;
  --pazapa-yellow:#FCC104;
  --pazapa-yellow-tint:#FFF6D6;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --muted:#555650;
  --focus:#1B4F5C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Open Sans",Arial,sans-serif;background:#fff;color:var(--pazapa-grey-dark);line-height:1.5;font-size:1rem}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 8px;line-height:1.25}
h2{font-size:1.5rem}
h3{font-size:1.05rem}
.app{max-width:760px;margin:0 auto;padding:12px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:4px solid var(--pazapa-blue);margin-bottom:16px}
.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:1rem}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{font-size:.9rem;background:var(--pazapa-grey-light);border-radius:999px;padding:6px 14px}
.lang-btn{font:inherit;font-weight:700;min-height:48px;min-width:48px;padding:8px 18px;border-radius:999px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation}
.lang-btn[aria-pressed="true"]{background:var(--pazapa-blue)}
.screen{outline:none}
.card{background:var(--pazapa-blue-tint);border-radius:16px;padding:20px;margin-bottom:16px}
.card.green{background:var(--pazapa-green-tint)}
.card.yellow{background:var(--pazapa-yellow-tint)}
.lead{font-size:1.1rem;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 12px}
.illus{display:block;margin:0 auto 14px;max-width:200px;width:60%;height:auto;object-fit:contain}
.info-grid{display:grid;gap:10px;margin:14px 0}
.info{background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px 14px}
.info b{display:block;font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-size:.9rem;margin-bottom:2px}
.goal{background:var(--pazapa-yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:600}
button{font-family:inherit;touch-action:manipulation}
.btn{font:inherit;font-weight:700;min-height:48px;min-width:48px;padding:12px 24px;border-radius:999px;border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);cursor:pointer}
.btn.alt{background:#fff}
.btn.green{background:var(--pazapa-green);border-color:var(--pazapa-green)}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6b66;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:20px}
.actions.start{justify-content:flex-start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.pcard{font:inherit;text-align:left;background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px 14px;min-height:64px;cursor:pointer;color:var(--pazapa-grey-dark);display:block;width:100%}
.pcard[aria-pressed="true"]{background:var(--pazapa-blue-tint);border-width:4px;padding:10px 12px}
.pcard.good{background:var(--pazapa-green-tint);border-color:#6f7d12}
.pcard.warn{background:var(--pazapa-yellow-tint);border-color:var(--pazapa-yellow)}
.pcard .fr{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.pcard .tag{display:block;font-size:.85rem;font-weight:700;margin-top:4px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--pazapa-yellow);border:1px solid var(--pazapa-grey-dark)}
.dot.g{background:var(--pazapa-green)}
fieldset{border:2px solid var(--pazapa-blue);border-radius:12px;margin:0 0 14px;padding:10px 14px 12px;background:#fff}
legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;padding:0 6px}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 0;cursor:pointer}
.opt input{width:24px;height:24px;flex:none;accent-color:#1B4F5C}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:inherit;min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--pazapa-grey-dark);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pazapa-blue);font-weight:700}
.panel{background:#fff;border:2px dashed var(--pazapa-blue);border-radius:12px;padding:12px 14px;margin:12px 0}
.panel.y{border-color:var(--pazapa-yellow);background:var(--pazapa-yellow-tint);border-style:solid}
.panel.g{border-color:#6f7d12;background:var(--pazapa-green-tint);border-style:solid}
.panel p{margin:0 0 6px}
.panel p:last-child{margin-bottom:0}
textarea{width:100%;font:inherit;font-size:1.05rem;min-height:120px;padding:10px;border:2px solid var(--pazapa-blue);border-radius:10px;color:var(--pazapa-grey-dark);background:#fff;resize:vertical}
label.lbl{display:block;font-weight:700;margin-bottom:4px}
.count{font-size:.9rem;color:var(--muted);margin:4px 0 8px}
.mode{display:flex;gap:10px;margin:8px 0 14px}
.mode .chip{flex:1}
.status{min-height:24px;font-weight:600;margin:6px 0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.model{font-style:italic}
.fr-line{display:block;font-size:.9rem;color:var(--muted);font-style:normal}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.done-pressed{background:var(--pazapa-green)!important;border-color:var(--pazapa-green)!important;color:var(--pazapa-grey-dark)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.btn{padding:12px 18px}.actions .btn{flex:1 1 140px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Pazapa English Programme for Adults</div>
    <div class="top-right">
      <span class="step" id="stepLabel"></span>
      <button type="button" class="lang-btn" id="langBtn">Français</button>
    </div>
  </div>
  <main id="screen" class="screen" tabindex="-1"></main>
  <div class="status" id="live" role="status" aria-live="polite"></div>
  <audio id="player" preload="none" hidden></audio>
</div>

  if(Array.isArray(o.tr)) n.tray=o.tr.filter(function(id){return pById(id) && pById(id).kind!=="bad";});
  n.c2fails = Math.min(9, parseInt(o.f2,10)||0);
  if(typeof o.o==="string" && OPENS.indexOf(o.o)>-1) n.plan.open=o.o;
  if(Array.isArray(o.i)) n.plan.info=o.i.filter(function(id){return pById(id) && pById(id).kind!=="bad" && id!=="p_thanks";});
  if(typeof o.c==="string" && (o.c==="Thank you for your help."||CLOSES_EXTRA.indexOf(o.c)>-1)) n.plan.close=o.c;
  if(typeof o.m==="string" && (o.m===""||MODS.indexOf(o.m)>-1)) n.plan.mod=o.m;
  if(typeof o.tx==="string") n.text=o.tx.slice(0,MAXLEN);
  if(typeof o.au==="string") n.auto=o.au.slice(0,MAXLEN);
  n.mode = o.md==="speak" ? "speak" : "type";
  n.aloud = o.al===1;
  if(Array.isArray(o.sc) && o.sc.length===4) n.sc=o.sc.map(function(b){return b===1;});
  n.att=Math.min(9,parseInt(o.at,10)||0); n.help=Math.min(9,parseInt(o.hp,10)||0);
  // revalidate against current requirements
  S=n;
  var e=c2eval(); S.c2pass=e.pass;
  S.tray = S.sel.filter(function(id){return pById(id).kind!=="bad";});
  var want=Math.max(1,Math.min(6,parseInt(o.s,10)||1));
  if(want>=3 && !S.c2pass) want=2;
  if(want>=4 && !planValid()) want=3;
  if(want>=5 && !productionOk()) want=4;
  if(want>=6){
    if(S.mode==="type"){ var a=typedComplete(); S.val=true; if(!(a||S.att>=3)||!selfAll()) { want=5; S.val=false; } }
    else if(!selfAll()) want=5;
  }
  S.screen=want;
}
function activityCompleted(){
  if(completionSent) return;
  console.log("W13D1 Communication Mission completed");
  if(!LMS.api) lmsInit();
  if(LMS.api){
    var cur=lmsStatus();
    if(cur==="completed"||cur==="passed"){ completionSent=true; return; }
    var ok;
    if(LMS.ver==="2004"){ ok = lmsSet("cmi.completion_status","completed"); }
    else { ok = lmsSet("cmi.core.lesson_status","completed"); }
    lmsCommit();
    if(ok){
      var v = LMS.ver==="2004" ? lmsGet("cmi.completion_status") : lmsGet("cmi.core.lesson_status");
      if(v && String(v)!=="completed" && String(v)!=="passed"){
        lmsSet(LMS.ver==="2004"?"cmi.completion_status":"cmi.core.lesson_status","completed"); lmsCommit();
      }
    }
    completionSent=true;
  } else {
    try{ localStorage.setItem(STORE_KEY+"_done","1"); }catch(e){}
    completionSent=true;
  }
}

function wire(){
  var sc=S.screen;
  if(sc===1){ $("c1").onclick=function(){ go(2); }; }
  if(sc===2){
    Array.prototype.forEach.call(document.querySelectorAll("[data-pid]"),function(b){
      b.onclick=function(){
        var id=b.getAttribute("data-pid"), i=S.sel.indexOf(id);
        if(i>-1) S.sel.splice(i,1); else S.sel.push(id);
        if(S.c2checked){ S.c2checked=false; S.c2pass=false; render({keepFocus:true}); var nb=document.querySelector('[data-pid="'+id+'"]'); if(nb) nb.focus(); }
        else { b.setAttribute("aria-pressed", i>-1?"false":"true"); $("c2count").textContent=t("chosen",{n:S.sel.length}); }
        save();
      };
    });
    var ck=$("c2check");
    if(ck) ck.onclick=function(){
      var e=c2eval(); S.c2checked=true;
      if(e.pass){ S.c2pass=true; S.tray=S.sel.filter(function(id){return pById(id).kind!=="bad";}); say(t("okTray")); }
      else {
        S.c2pass=false; S.c2fails++;
        if(S.c2fails>=3){ S.sel=["p_video","p_find","p_thanks"]; S.tray=S.sel.slice(); S.c2pass=true; S.c2auto=true; }
      }
      save(); render({keepFocus:true});
      var m=$("c2msg"); if(m){ m.setAttribute("tabindex","-1"); m.focus(); }
    };
    var rt=$("c2retry");
    if(rt) rt.onclick=function(){ S.sel=[]; S.tray=[]; S.c2checked=false; S.c2pass=false; S.c2auto=false; order=shuffle(P.map(function(p){return p.id;})); invalidate(); save(); render({keepFocus:true}); var f=document.querySelector("[data-pid]"); if(f) f.focus(); };
    var gn=$("c2go");
    if(gn) gn.onclick=function(){
      // drop plan items that are no longer in the tray
      S.plan.info=S.plan.info.filter(function(id){return S.tray.indexOf(id)>-1;});
      if(S.plan.close==="Thank you for your help." && S.tray.indexOf("p_thanks")<0) S.plan.close="";
      go(3);
    };
  }
  if(sc===3){
    Array.prototype.forEach.call(document.querySelectorAll('input[name="po"]'),function(i){ i.onchange=function(){ S.plan.open=i.value; planChanged(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="pc"]'),function(i){ i.onchange=function(){ S.plan.close=i.value; planChanged(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="pi"]'),function(i){ i.onchange=function(){
      var k=S.plan.info.indexOf(i.value); if(i.checked&&k<0) S.plan.info.push(i.value); if(!i.checked&&k>-1) S.plan.info.splice(k,1); planChanged(); }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-mod]"),function(b){ b.onclick=function(){
      S.plan.mod=b.getAttribute("data-mod");
      Array.prototype.forEach.call(document.querySelectorAll("[data-mod]"),function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
      planChanged(); }; });
    $("exBtn").onclick=function(){ S.showEx=!S.showEx; render({keepFocus:true}); $("exBtn").focus(); };
    $("c3").onclick=function(){
      if(!planValid()) return;
      if(!S.text.trim() || S.text===S.auto){ S.text=compilePlan(); S.auto=S.text; }
      invalidate(); go(4);
    };
  }
  if(sc===4){
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"),function(b){ b.onclick=function(){
      var m=b.getAttribute("data-mode"); if(m===S.mode) return;
      if(R.state==="recording") stopRec(); stopPlayback();
      S.mode=m; invalidate(); save(); render({keepFocus:true});
      var nb=document.querySelector('[data-mode="'+m+'"]'); if(nb) nb.focus();
      say(m==="speak"?t("speak"):t("type")); }; });
    var ta=$("msg");
    ta.oninput=function(){ S.text=ta.value.slice(0,MAXLEN); invalidate(); updateCounts(); recUI(); save(); };
    $("usePlan").onclick=function(){
      if(!planValid()){ say(t("planNeed")); return; }
      S.text=compilePlan(); S.auto=S.text; invalidate(); ta.value=S.text; updateCounts(); recUI(); save(); ta.focus();
    };
    Array.prototype.forEach.call(document.querySelectorAll("[data-ins]"),function(b){ b.onclick=function(){ insertText(b.getAttribute("data-ins")); }; });
    if(S.mode==="speak"){
      $("recBtn").onclick=startRec; $("stopBtn").onclick=stopRec; $("hearBtn").onclick=hearRec; $("tryRecBtn").onclick=tryRec;
      $("aloudBtn").onclick=function(){
        S.aloud=!S.aloud; invalidate();
        $("aloudBtn").textContent=S.aloud?t("aloudOn"):t("aloud");
        $("aloudBtn").setAttribute("aria-pressed",S.aloud?"true":"false");
        $("aloudMsg").textContent=S.aloud?t("aloudSaid"):"";
        recUI(); save();
      };
    }
    $("reviewBtn").onclick=function(){
      if(!productionOk()){ say(t("needProd")); return; }
      if(S.mode==="type"){ runCheck(); } else { curFeedback=null; S.val=true; }
      go(5);
    };
  }
  if(sc===5){
    var t5=$("msg5");
    if(t5){
      t5.oninput=function(){ S.text=t5.value.slice(0,MAXLEN); invalidate(); updateCounts(); updateFinish(); save(); };
      $("checkBtn").onclick=function(){
        S.text=t5.value.slice(0,MAXLEN);
        runCheck(); render({keepFocus:true});
        var fb=$("fbPanel"); if(fb){ fb.setAttribute("tabindex","-1"); fb.focus(); }
      };
    }
    var h5=$("hearBtn5"); if(h5) h5.onclick=hearRec;
    var e5=$("exBtn5"); if(e5) e5.onclick=function(){ S.showEx5=!S.showEx5; S.help++; render({keepFocus:true}); $("exBtn5").focus(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-ins]"),function(b){ b.onclick=function(){ S.help++; insertText(b.getAttribute("data-ins")); }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sc]"),function(i){ i.onchange=function(){ S.sc[parseInt(i.getAttribute("data-sc"),10)]=i.checked; updateFinish(); save(); }; });
    $("finishBtn").onclick=function(){ if(!missionComplete()) return; go(6); };
  }
  if(sc===6){
    $("doneBtn").onclick=function(){
      if(S.screen!==6 || !missionComplete()) return;
      activityCompleted();
      $("doneBtn").classList.add("done-pressed");
      say(t("done"));
    };
    $("retryAll").onclick=function(){ fullReset(); };
  }
}
function planChanged(){
  invalidate();
  var ok=planValid(), pv=$("planPrev"), c3=$("c3");
  if(pv){ pv.innerHTML = ok ? esc(compilePlan()) : '<span lang="'+(S.lang==="fr"?"fr":"en-GB")+'">'+t("planNeed")+'</span>'; pv.setAttribute("lang","en-GB"); }
  if(c3) c3.disabled=!ok;
  save();
}
function fullReset(){
  clearRecording();
  var lang=S.lang;
  S=freshState(lang); curFeedback=null; order=shuffle(P.map(function(p){return p.id;}));
  saveNow(); render();
}

$("langBtn").onclick=function(){
  S.lang = S.lang==="en" ? "fr" : "en";
  save(); render({keepFocus:true});
  say(S.lang==="fr"?"Français":"English");
};

/* ---------------- start ---------------- */
restore();
order = shuffle(P.map(function(p){return p.id;}));
if(S.screen===5 && S.mode==="type"){ curFeedback=analyse(S.text); }
render();
})();
</script>
</body>
</html>
