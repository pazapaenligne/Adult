<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looking for accommodation – Listening Mission</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --white:#fff;
  --focus:#1B4F5C;
  --soft-blue:#EAF8FB;
  --soft-yellow:#FFF6D6;
  --soft-green:#F4F8D6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Open Sans",Arial,sans-serif;background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);line-height:1.5;font-size:1rem;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;color:var(--pazapa-grey-dark);margin:0 0 .5rem;line-height:1.25}
h2{font-size:1.6rem}
button{font-family:inherit;font-size:1rem;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2:focus{outline:none}
h2:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:780px;margin:0 auto;background:var(--white);min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:5px solid var(--pazapa-blue);background:var(--white);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .tag{font-weight:700;font-size:.9rem;color:var(--pazapa-blue-dark);margin:0}
.brand .tag .fr{font-weight:400}
.frbtn{min-height:48px;min-width:48px;padding:6px 16px;border-radius:24px;border:2px solid var(--pazapa-blue-dark);background:var(--white);color:var(--pazapa-blue-dark);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.frbtn[aria-pressed="true"]{background:var(--pazapa-blue-dark);color:var(--white)}
.frbtn .dot{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:inline-block}
.frbtn[aria-pressed="true"] .dot{background:var(--white)}
.progress{padding:12px 18px 10px;border-bottom:1px solid var(--pazapa-grey-light)}
.progress .lbl{font-size:.85rem;font-weight:700;color:var(--pazapa-blue-dark);margin-bottom:6px}
.track{height:10px;background:var(--pazapa-grey-light);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:var(--pazapa-blue-dark);border-radius:6px;transition:width .3s ease}
main{flex:1;padding:22px 18px 32px}
.screen[hidden]{display:none}
.eyebrow{margin:0 0 4px;font-weight:700;font-size:.85rem;color:var(--pazapa-blue-dark)}
.hero{display:block;width:100%;max-width:300px;margin:0 auto 14px;border-radius:14px;border:1px solid var(--pazapa-grey-light)}
.instr{background:var(--soft-blue);border:1px solid #BFE6EE;border-radius:12px;padding:12px 16px;margin:0 0 16px;font-weight:600;font-size:1.05rem}
.player{border:2px solid var(--pazapa-grey-light);border-radius:14px;padding:14px;margin:0 0 16px;background:var(--white)}
.prow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:48px;min-width:48px;padding:8px 22px;border-radius:12px;border:2px solid var(--pazapa-blue-dark);background:var(--pazapa-blue-dark);color:var(--white);font-weight:700;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.btn:hover:not(:disabled){background:#146577;border-color:#146577}
.btn.alt{background:var(--white);color:var(--pazapa-blue-dark)}
.btn.alt:hover:not(:disabled){background:var(--soft-blue)}
.btn.help{background:var(--pazapa-yellow);border-color:var(--pazapa-yellow);color:var(--pazapa-grey-dark)}
.btn.help:hover:not(:disabled){background:#e3ad00;border-color:#e3ad00}
.btn.good{background:var(--pazapa-green);border-color:var(--pazapa-green);color:var(--pazapa-grey-dark)}
.btn.good:hover:not(:disabled){background:#b8c53a;border-color:#b8c53a}
.btn:disabled{background:var(--pazapa-grey-light);border-color:#C9C9C9;color:#595959}
.btn .row{display:inline-flex;align-items:center;gap:8px}
.pstat{font-size:.9rem;color:#4a4a49}
.audio-note{margin:10px 0 0;padding:10px 12px;background:var(--soft-yellow);border:2px dashed var(--pazapa-yellow);border-radius:10px;font-weight:600;font-size:.95rem}
.tbtn{margin-top:12px;min-height:48px;padding:6px 14px;background:transparent;border:0;color:var(--pazapa-blue-dark);font-weight:700;text-decoration:underline;display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left}
.transcript{margin-top:6px;padding:12px 14px;background:#FAFAFA;border-left:5px solid var(--pazapa-blue);border-radius:6px}
.transcript p{margin:0 0 8px}
.transcript p:last-child{margin:0}
.transcript .who{font-weight:700;color:var(--pazapa-blue-dark)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0 0 14px}
.grid.six{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{position:relative;min-height:56px;padding:10px;border-radius:14px;border:3px solid var(--pazapa-grey-light);background:var(--white);color:var(--pazapa-grey-dark);font-weight:700;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.opt:hover:not(:disabled){border-color:var(--pazapa-blue)}
.opt img,.opt svg.pic{width:100%;max-width:130px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:#FBF6EE}
.grid.six .opt img,.grid.six .opt svg.pic{max-width:100px}
.opt svg.pic{aspect-ratio:3/4;height:auto}
.opt:disabled{opacity:.55}
.opt.sel{border-color:var(--pazapa-blue-dark);background:var(--soft-blue);box-shadow:inset 0 0 0 2px var(--pazapa-blue-dark)}
.opt.fine{border-color:#7E8A14;background:var(--soft-green)}
.opt.retry{border-color:#B38400;background:var(--soft-yellow)}
.opt .mark{font-size:.8rem;font-weight:700;min-height:1.2em}
.opt .lab{display:flex;flex-direction:column;align-items:center}
.qcard{border:2px solid var(--pazapa-grey-light);border-radius:14px;padding:12px;margin:0 0 14px;display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:start}
.qcard.fine{border-color:#7E8A14}
.qcard.retry{border-color:#B38400}
.qcard img{width:90px;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.qcard h3{font-size:1.05rem;margin:0 0 8px}
.qcard .choices{display:grid;gap:8px}
.qcard .opt{flex-direction:column;min-height:48px;padding:8px 12px}
.qnote{font-size:.9rem;font-weight:700;margin:8px 0 0;min-height:1.2em}
@media (max-width:480px){.qcard{grid-template-columns:1fr}.qcard img{width:100px}}
ol.order{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.ocard{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:3px solid var(--pazapa-grey-light);border-radius:14px;background:var(--white);cursor:grab}
.ocard.sel{border-color:var(--pazapa-blue-dark);background:var(--soft-blue);box-shadow:inset 0 0 0 2px var(--pazapa-blue-dark)}
.ocard.fine{border-color:#7E8A14;background:var(--soft-green)}
.ocard.retry{border-color:#B38400;background:var(--soft-yellow)}
.ocard.over{outline:3px dashed var(--pazapa-blue-dark)}
.ocard .num{width:40px;height:40px;border-radius:50%;background:var(--pazapa-blue-dark);color:var(--white);font-weight:700;display:flex;align-items:center;justify-content:center}
.ocard .txt{font-weight:700;display:flex;flex-direction:column}
.ocard .mv{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ocard .mv .btn{padding:6px 12px;font-size:.9rem}
@media (max-width:520px){.ocard{grid-template-columns:44px 1fr}.ocard .mv{grid-column:1 / -1;justify-content:flex-start}}
.fb{min-height:1.5rem;margin:0 0 14px;padding:0}
.fb.show{padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--soft-green);border:2px solid #7E8A14}
.fb.hint{background:var(--soft-yellow);border:2px solid #B38400}
.fb.info{background:var(--soft-blue);border:2px solid var(--pazapa-blue-dark)}
.nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
.final{text-align:center;padding:10px 0}
.final .hero{max-width:240px}
.final .tick{width:72px;height:72px;margin:0 auto 10px;display:block}
.donemsg{margin:16px auto 0;max-width:480px;padding:12px 14px;border-radius:12px;background:var(--soft-green);border:2px solid #7E8A14;font-weight:600}
.donemsg[hidden]{display:none}
.final .nav{justify-content:center;margin-top:14px}
footer{padding:12px 18px;text-align:center;font-size:.85rem;color:#4a4a49;border-top:1px solid var(--pazapa-grey-light)}
/* French translation layer */
.fr{display:none}
body.fr-on .fr{display:block;font-weight:400;font-style:italic;font-size:.88em;margin-top:2px}
body.fr-on .btn .fr,body.fr-on .tbtn .fr{font-size:.8em}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------- state + storage ---------- */
var mem = {};
function lsGet(k){ try{ var v=window.localStorage.getItem(k); return v; }catch(e){ return mem[k]||null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
function blank(){ return { 1:{sel:null,att:0,ok:false,rev:false,heard:false}, 2:{sel:[],att:0,ok:false,rev:false,heard:false}, 3:{sel:{},att:0,ok:false,rev:false,heard:false}, 4:{sel:["m2","p9","k7"].slice().reverse(),att:0,ok:false,rev:false,heard:false} }; }
function initialOrder(){ return ["p9","k7","m2"]; }
var state = { screen:1, fr:false, s:blank() };
state.s[4].sel = initialOrder();
function save(){ lsSet(CONFIG.storageKey, JSON.stringify(state)); }
function load(){
  var raw=lsGet(CONFIG.storageKey); if(!raw) return;
  try{
    var o=JSON.parse(raw);
    if(o && o.s){
      for(var n=1;n<=4;n++){ if(o.s[n]){ var t=state.s[n]; var u=o.s[n];
        t.att=+u.att||0; t.ok=!!u.ok; t.rev=!!u.rev; t.heard=!!u.heard;
        if(n===1) t.sel=(typeof u.sel==="string")?u.sel:null;
        if(n===2) t.sel=Array.isArray(u.sel)?u.sel:[];
        if(n===3) t.sel=(u.sel&&typeof u.sel==="object"&&!Array.isArray(u.sel))?u.sel:{};
        if(n===4 && Array.isArray(u.sel) && u.sel.length===3) t.sel=u.sel;
      }}
      state.fr=!!o.fr;
      state.screen=Math.min(5,Math.max(1,+o.screen||1));
    }
  }catch(e){}
  // never land past a screen that is not complete
  for(var i=1;i<=4;i++){ if(!(state.s[i].ok||state.s[i].rev)){ if(state.screen>i) state.screen=i; break; } }
}
function isDone(n){ return state.s[n].ok||state.s[n].rev; }

/* ---------- audio ---------- */
var audio=new Audio(), audioState="loading", playing=false;
audio.preload="auto";
audio.addEventListener("loadedmetadata",function(){ audioState="ready"; syncAudioUI(); });
audio.addEventListener("canplay",function(){ if(audioState==="loading"){ audioState="ready"; syncAudioUI(); } });
audio.addEventListener("error",function(){ try{ console.error("Audio loading error:", audio.error ? audio.error.code : "unknown"); }catch(e){} audioState="missing"; playing=false; syncAudioUI(); });
audio.addEventListener("playing",function(){ playing=true; syncAudioUI(); });
audio.addEventListener("pause",function(){ playing=false; syncAudioUI(); });
audio.addEventListener("ended",function(){
  playing=false;
  var st=state.s[state.screen];
  if(st && !st.heard){ st.heard=true; save(); }
  syncAudioUI(); applyLocks(); announce(M.heard[0]);
});
function stopAudio(){ try{ audio.pause(); audio.currentTime=0; }catch(e){} playing=false; }
function togglePlay(){
  if(audioState!=="ready") return;
  if(playing){ audio.pause(); return; }
  if(audio.ended || (audio.duration && audio.currentTime>=audio.duration-0.05)){ try{ audio.currentTime=0; }catch(e){} }
  var p=audio.play();
  if(p && typeof p.catch==="function"){ p.catch(function(){ playing=false; syncAudioUI(); }); }
}
function restartAudio(){
  if(audioState!=="ready") return;
  try{ audio.currentTime=0; }catch(e){}
  var p=audio.play();
  if(p && typeof p.catch==="function"){ p.catch(function(){ playing=false; syncAudioUI(); }); }
}
function setBi(el,en,fr){ var e=el.querySelector(".en"), f=el.querySelector(".fr"); if(e) e.textContent=en; if(f) f.textContent=fr; }
function syncAudioUI(){
  var players=document.querySelectorAll(".player");
  for(var i=0;i<players.length;i++){
    var p=players[i], n=+p.getAttribute("data-player"), vis=(n===state.screen);
    var play=p.querySelector(".p-play"), rs=p.querySelector(".p-restart"), note=p.querySelector(".audio-note"), stat=p.querySelector(".pstat"), ico=play.querySelector(".ico");
    var ok=(audioState==="ready");
    play.disabled=!ok; rs.disabled=!ok;
    note.hidden=(audioState!=="missing");
    var heard=state.s[n] && state.s[n].heard;
    var on=vis&&playing;
    play.setAttribute("aria-pressed", on?"true":"false");
    if(on){ setBi(play,"Pause","Pause"); ico.textContent="❚❚"; play.setAttribute("aria-label","Pause audio"); }
    else { setBi(play,heard?"Replay":"Play",heard?"Réécouter":"Écouter"); ico.textContent="▶"; play.setAttribute("aria-label",heard?"Replay audio":"Play audio"); }
    var key = audioState==="loading"?"audioLoading":(audioState==="missing"?null:(on?"playing":(heard?"heard":"ready")));
    stat.textContent = key?M[key][0]:"";
  }
}

/* ---------- announce ---------- */
function announce(t){ var l=document.getElementById("live"); l.textContent=""; setTimeout(function(){ l.textContent=t; },30); }

/* ---------- selection locks (options open after a genuine playback) ---------- */
function applyLocks(){
  for(var n=1;n<=4;n++){
    var sec=document.querySelector('.screen[data-n="'+n+'"]'); if(!sec) continue;
    var open=!!state.s[n].heard;
    var lock=sec.querySelector(".lockmsg"); if(lock) lock.hidden=open;
    var opts=sec.querySelectorAll(".opt"); for(var i=0;i<opts.length;i++) opts[i].disabled=!open;
    var cards=sec.querySelectorAll(".ocard .btn"); for(var j=0;j<cards.length;j++) cards[j].disabled=!open;
    renderNav(n);
  }
  if(state.screen===4) renderOrder();
}

/* ---------- rendering of selections ---------- */
function clearMarks(sec){
  var els=sec.querySelectorAll(".opt,.qcard,.ocard");
  for(var i=0;i<els.length;i++){ els[i].classList.remove("fine","retry"); }
  var m=sec.querySelectorAll(".opt .mark"); for(var k=0;k<m.length;k++) m[k].innerHTML="";
  var qn=sec.querySelectorAll(".qnote"); for(var j=0;j<qn.length;j++) qn[j].innerHTML="";
}
function renderSel(n){
  var sec=document.querySelector('.screen[data-n="'+n+'"]'), st=state.s[n];
  var opts=sec.querySelectorAll(".opt");
  for(var i=0;i<opts.length;i++){
    var id=opts[i].getAttribute("data-id"), on=false;
    if(n===1) on=(st.sel===id);
    if(n===2) on=(st.sel.indexOf(id)>-1);
    if(n===3){ var qk=opts[i].closest(".qcard").getAttribute("data-q"); on=(st.sel[qk]===id); }
    opts[i].classList.toggle("sel",on);
    opts[i].setAttribute("aria-pressed",on?"true":"false");
  }
}
function hasSelection(n){
  var st=state.s[n];
  if(n===1) return !!st.sel;
  if(n===2) return st.sel.length>0;
  if(n===3) return !!(st.sel.A&&st.sel.B&&st.sel.C);
  return true;
}
function renderNav(n){
  var sec=document.querySelector('.screen[data-n="'+n+'"]'), st=state.s[n];
  var chk=sec.querySelector(".n-check"), show=sec.querySelector(".n-show"), nxt=sec.querySelector(".n-next");
  var complete=st.ok||st.rev;
  chk.hidden=complete; nxt.hidden=!complete;
  chk.disabled=!(st.heard && hasSelection(n));
  show.hidden=!(!complete && st.att>=CONFIG.maxAttemptsBeforeShowMe);
}
function setFB(n,kind,key){
  var sec=document.querySelector('.screen[data-n="'+n+'"]'), fb=sec.querySelector(".fb:not(.lockmsg)");
  if(!key){ fb.className="fb"; fb.innerHTML=""; return; }
  fb.className="fb show "+kind; fb.innerHTML=msgHTML(key);
}

/* ---------- editing ---------- */
function edited(n){
  var st=state.s[n], sec=document.querySelector('.screen[data-n="'+n+'"]');
  var was=st.ok||st.rev;
  st.ok=false; st.rev=false; clearMarks(sec);
  if(was) setFB(n,"info","edited"); else setFB(n,"", null);
  renderNav(n); save(); updateDone();
}
function pick(n,id,qk){
  var st=state.s[n];
  if(n===1) st.sel=id;
  if(n===2){ var i=st.sel.indexOf(id); if(i>-1) st.sel.splice(i,1); else st.sel.push(id); }
  if(n===3) st.sel[qk]=id;
  renderSel(n); edited(n);
}

/* ---------- checking ---------- */
function sameSet(a,b){ if(a.length!==b.length) return false; return a.slice().sort().join("|")===b.slice().sort().join("|"); }
function evaluate(n){
  var st=state.s[n], A=CONFIG.answers[n], res={all:false,wrong:[]};
  if(n===1){ res.all=(st.sel===A); }
  if(n===2){ res.all=sameSet(st.sel,A); }
  if(n===3){ ["A","B","C"].forEach(function(k){ if(st.sel[k]!==A[k]) res.wrong.push(k); }); res.all=(res.wrong.length===0); }
  if(n===4){ res.all=(st.sel.join("|")===A.join("|")); }
  return res;
}
function check(n){
  var st=state.s[n], sec=document.querySelector('.screen[data-n="'+n+'"]');
  if(!st.heard){ return; }
  if(!hasSelection(n)){ setFB(n,"hint",n===3?"need3":"needAnswer"); return; }
  var r=evaluate(n); clearMarks(sec);
  if(r.all){
    st.ok=true; st.rev=false; markResult(n,r); setFB(n,"ok","ok"); announce(M.ok[0]);
  } else {
    st.att++; markResult(n,r); setFB(n,"hint","h"+n); announce(M["h"+n][0]);
  }
  renderNav(n); save(); updateDone();
  if(st.ok){ var nx=sec.querySelector(".n-next"); if(!nx.hidden) nx.focus(); }
}
function markResult(n,r){
  var sec=document.querySelector('.screen[data-n="'+n+'"]'), st=state.s[n], A=CONFIG.answers[n];
  if(n===1||n===2){
    var opts=sec.querySelectorAll(".opt");
    for(var i=0;i<opts.length;i++){
      var id=opts[i].getAttribute("data-id"); if(st.sel===undefined) continue;
      var chosen=(n===1)?(st.sel===id):(st.sel.indexOf(id)>-1);
      if(!chosen) continue;
      var right=(n===1)?(A===id):(A.indexOf(id)>-1);
      opts[i].classList.add(right?"fine":"retry");
      opts[i].querySelector(".mark").innerHTML=right?"✓ Correct":bi("Listen again","Réécoutez");
    }
  }
  if(n===3){
    var cards=sec.querySelectorAll(".qcard");
    for(var c=0;c<cards.length;c++){
      var k=cards[c].getAttribute("data-q"), good=(r.wrong.indexOf(k)===-1);
      cards[c].classList.add(good?"fine":"retry");
      cards[c].querySelector(".qnote").innerHTML=good?"✓ Correct":msgHTML("again");
    }
  }
  if(n===4){
    var lis=sec.querySelectorAll(".ocard");
    for(var j=0;j<lis.length;j++){
      var id2=lis[j].getAttribute("data-id"), pos=state.s[4].sel.indexOf(id2);
      lis[j].classList.add(A[pos]===id2?"fine":"retry");
    }
  }
}
function showMe(n){
  var st=state.s[n], A=CONFIG.answers[n], sec=document.querySelector('.screen[data-n="'+n+'"]');
  if(n===1) st.sel=A;
  if(n===2) st.sel=A.slice();
  if(n===3) st.sel={A:A.A,B:A.B,C:A.C};
  if(n===4) st.sel=A.slice();
  st.rev=true; st.ok=false;
  clearMarks(sec);
  if(n===4) renderOrder(); else renderSel(n);
  setFB(n,"info","shown"); announce(M.shown[0]);
  renderNav(n); save(); updateDone();
  var nx=sec.querySelector(".n-next"); if(!nx.hidden) nx.focus();
}

var ORDER_TEXT={
  k7:["Sara asks about the apartment.","Sara pose des questions sur l’appartement."],
  m2:["Sara asks about the monthly rent.","Sara demande le loyer mensuel."],
  p9:["Sara asks when she can see it.","Sara demande quand elle peut le voir."]
};
var selCard=null, dragId=null;
function renderOrder(focusId,focusKind){
  var ol=document.getElementById("orderList"), st=state.s[4], heard=st.heard, html="";
  st.sel.forEach(function(id,i){
    html+='<li class="ocard'+(selCard===id?' sel':'')+'" data-id="'+id+'" draggable="'+(heard?"true":"false")+'" tabindex="0" aria-label="'+esc(ORDER_TEXT[id][0])+' Position '+(i+1)+' of 3"'+(selCard===id?' aria-current="true"':'')+'>'+
      '<span class="num" aria-hidden="true">'+(i+1)+'</span>'+
      '<span class="txt"><span class="en">'+esc(ORDER_TEXT[id][0])+'</span><span class="fr" lang="fr">'+esc(ORDER_TEXT[id][1])+'</span></span>'+
      '<span class="mv">'+
        '<button type="button" class="btn alt mv-up"'+((i===0||!heard)?' disabled':'')+' aria-label="Move up: '+esc(ORDER_TEXT[id][0])+'"><span class="en">Move up</span><span class="fr" lang="fr">Monter</span></button>'+
        '<button type="button" class="btn alt mv-down"'+((i===2||!heard)?' disabled':'')+' aria-label="Move down: '+esc(ORDER_TEXT[id][0])+'"><span class="en">Move down</span><span class="fr" lang="fr">Descendre</span></button>'+
      '</span></li>';
  });
  ol.innerHTML=html;
  if(focusId){
    var li=ol.querySelector('[data-id="'+focusId+'"]');
    if(li){
      var b=li.querySelector(focusKind==="down"?".mv-down":".mv-up");
      if(b && !b.disabled) b.focus();
      else { var o=li.querySelector(focusKind==="down"?".mv-up":".mv-down"); if(o&&!o.disabled) o.focus(); else li.focus(); }
    }
  }
}
function moveCard(id,delta,kind,viaKey){
  var st=state.s[4]; if(!st.heard) return;
  var i=st.sel.indexOf(id), j=i+delta;
  if(i<0||j<0||j>2) return;
  var t=st.sel[i]; st.sel[i]=st.sel[j]; st.sel[j]=t;
  selCard=id;
  renderOrder(id,kind);
  if(viaKey){ var li=document.querySelector('#orderList [data-id="'+id+'"]'); if(li) li.focus(); }
  edited(4);
  announce("Moved to position "+(j+1)+" of 3");
}
function dropBefore(fromId,toId){
  var st=state.s[4]; if(!st.heard||fromId===toId) return;
  var arr=st.sel.filter(function(x){ return x!==fromId; });
  var idx=arr.indexOf(toId);
  var fromIdx=st.sel.indexOf(fromId), toIdx=st.sel.indexOf(toId);
  if(fromIdx<toIdx) arr.splice(idx+1,0,fromId); else arr.splice(idx,0,fromId);
  st.sel=arr; selCard=fromId; renderOrder(); edited(4);
}
function bindOrder(){
  var ol=document.getElementById("orderList");
  ol.addEventListener("click",function(e){
    var li=e.target.closest(".ocard"); if(!li) return;
    var id=li.getAttribute("data-id");
    var up=e.target.closest(".mv-up"), dn=e.target.closest(".mv-down");
    if(up){ moveCard(id,-1,"up"); return; }
    if(dn){ moveCard(id,1,"down"); return; }
    if(!state.s[4].heard) return;
    selCard=(selCard===id)?null:id; renderOrder(); var again=ol.querySelector('[data-id="'+id+'"]'); if(again) again.focus();
  });
  ol.addEventListener("keydown",function(e){
    var li=e.target.closest(".ocard"); if(!li||e.target!==li) return;
    var id=li.getAttribute("data-id");
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!state.s[4].heard) return; selCard=(selCard===id)?null:id; renderOrder(); var a=ol.querySelector('[data-id="'+id+'"]'); if(a) a.focus(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); moveCard(id,-1,"up",true); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); moveCard(id,1,"down",true); }
  });
  ol.addEventListener("dragstart",function(e){ var li=e.target.closest(".ocard"); if(!li||!state.s[4].heard){ e.preventDefault(); return; } dragId=li.getAttribute("data-id"); try{ e.dataTransfer.setData("text/plain",dragId); e.dataTransfer.effectAllowed="move"; }catch(x){} });
  ol.addEventListener("dragover",function(e){ var li=e.target.closest(".ocard"); if(!li||!dragId) return; e.preventDefault(); li.classList.add("over"); });
  ol.addEventListener("dragleave",function(e){ var li=e.target.closest(".ocard"); if(li) li.classList.remove("over"); });
  ol.addEventListener("drop",function(e){ var li=e.target.closest(".ocard"); if(!li||!dragId) return; e.preventDefault(); var to=li.getAttribute("data-id"), from=dragId; dragId=null; dropBefore(from,to); });
  ol.addEventListener("dragend",function(){ dragId=null; var o=ol.querySelectorAll(".over"); for(var i=0;i<o.length;i++) o[i].classList.remove("over"); });
}

/* ---------- screens ---------- */
function show(n,focus){
  if(n>1){ var fo=firstOpen(); if(n>fo) n=fo; }
  stopAudio();
  state.screen=n;
  var secs=document.querySelectorAll(".screen");
  for(var i=0;i<secs.length;i++) secs[i].hidden=(+secs[i].getAttribute("data-n")!==n);
  var pct=Math.round(((n-1)/5)*100); if(n===5) pct=100;
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("progBar").setAttribute("aria-valuenow",String(pct));
  document.getElementById("progLabel").textContent=(n===5?"Complete":"Screen "+n+" of 5");
  if(n<=4){ var st=state.s[n]; renderSel(n); if(n===4) renderOrder(); applyLocks();
    var sec=document.querySelector('.screen[data-n="'+n+'"]');
    if(st.ok||st.rev){ if(st.rev) setFB(n,"info","shown"); else setFB(n,"ok","ok"); }
  }
  syncAudioUI(); updateDone(); save();
  if(focus){ var h=document.getElementById("h"+n); if(h){ h.focus(); window.scrollTo(0,0); } announce(TITLES[n][0]); }
}
function firstOpen(){ for(var i=1;i<=4;i++){ if(!isDone(i)) return i; } return 5; }

/* ---------- completion: SCORM 1.2 / 2004 discovery ---------- */
var lms=null, lmsInit=false, lmsCommitted=false;
let completionSent = false;
function findAPI(win){
  var depth=0;
  while(win && depth<12){
    depth++;
    try{ if(win.API_1484_11) return {v:"2004",api:win.API_1484_11}; }catch(e){}
    try{ if(win.API) return {v:"1.2",api:win.API}; }catch(e){}
    var next=null;
    try{ next=win.parent; }catch(e){ next=null; }
    if(!next||next===win) break;
    win=next;
  }
  return null;
}
function discover(){
  if(lms) return lms;
  var r=null;
  try{ r=findAPI(window); }catch(e){}
  if(!r){ try{ if(window.opener) r=findAPI(window.opener); }catch(e){} }
  if(r){ lms=r; }
  return lms;
}
function sendToLms(){
  var l=discover(); if(!l) return false;
  try{
    if(l.v==="2004"){
      if(!lmsInit){ try{ l.api.Initialize(""); }catch(e){} lmsInit=true; }
      var c=String(l.api.GetValue("cmi.completion_status")||"");
      if(c!=="completed"){ l.api.SetValue("cmi.completion_status","completed"); }
      l.api.Commit("");
    } else {
      if(!lmsInit){ try{ l.api.LMSInitialize(""); }catch(e){} lmsInit=true; }
      var s=String(l.api.LMSGetValue("cmi.core.lesson_status")||"");
      if(s!=="completed" && s!=="passed"){ l.api.LMSSetValue("cmi.core.lesson_status","completed"); }
      l.api.LMSCommit("");
    }
    return true;
  }catch(e){ return false; }
}
function storedCompletion(){ try{ var o=JSON.parse(lsGet(CONFIG.completionKey)||"null"); return o&&o.completed?o:null; }catch(e){ return null; } }
function activityCompleted(){
  if(!allDone()) return false;
  if(completionSent){ return true; }           // idempotent
  completionSent=true;
  lmsCommitted=sendToLms();
  lsSet(CONFIG.completionKey, JSON.stringify({completed:true,lmsCommitted:lmsCommitted}));
  try{ console.log("W10D1 Listening Mission completed"); }catch(e){}
  return true;
}
function retryPendingLms(){
  if(!completionSent||lmsCommitted) return;
  if(sendToLms()){ lmsCommitted=true; lsSet(CONFIG.completionKey, JSON.stringify({completed:true,lmsCommitted:true})); }
}
var doneBtn, retryBtn;
function updateDone(){
  if(!doneBtn) return;
  doneBtn.disabled = !(state.screen===5 && allDone());
}
function onDone(){
  if(doneBtn.disabled) return;
  var already=completionSent;
  activityCompleted();
  var m=document.getElementById("doneMsg");
  m.innerHTML=msgHTML(already?"savedAgain":"doneMsg"); m.hidden=false;
  announce(already?M.savedAgain[0]:M.doneMsg[0]);
}
function onRetry(){
  stopAudio();
  var keepFr=state.fr;
  state.s=blank(); state.s[4].sel=initialOrder(); selCard=null;
  state.screen=1; state.fr=keepFr;
  var m=document.getElementById("doneMsg"); m.hidden=true; m.innerHTML="";
  // clear visible marks and feedback on all task screens
  for(var n=1;n<=4;n++){
    var sec=document.querySelector('.screen[data-n="'+n+'"]'); clearMarks(sec); setFB(n,"",null); renderSel(n);
  }
  save(); show(1,true); announce(M.retryDone[0]);
}

/* ---------- French toggle ---------- */
function applyLang(){
  document.body.classList.toggle("fr-on",!!state.fr);
  var b=document.getElementById("frBtn");
  b.setAttribute("aria-pressed",state.fr?"true":"false");
  b.setAttribute("aria-label",state.fr?"Hide French translation":"Show French translation");
}

/* ---------- init ---------- */
function init(){
  load();
  buildScreens();
  doneBtn=document.getElementById("doneBtn"); retryBtn=document.getElementById("retryBtn");
  doneBtn.disabled = true;
  completionSent = false;
  var sc=storedCompletion();
  if(sc){ completionSent=true; lmsCommitted=!!sc.lmsCommitted; }

  // audio source – relative path only, never autoplay
  audio.src=AUDIO_FILES.listening;
  try{ audio.load(); }catch(e){}

  // selection events
  document.getElementById("main").addEventListener("click",function(e){
    var opt=e.target.closest(".opt");
    var sec=e.target.closest(".screen"); if(!sec) return;
    var n=+sec.getAttribute("data-n");
    if(opt && !opt.disabled && n<=3){
      pick(n,opt.getAttribute("data-id"), opt.closest(".qcard")?opt.closest(".qcard").getAttribute("data-q"):null);
      return;
    }
    if(e.target.closest(".p-play")){ togglePlay(); return; }
    if(e.target.closest(".p-restart")){ restartAudio(); return; }
    var tb=e.target.closest(".tbtn");
    if(tb){ var box=document.getElementById(tb.getAttribute("aria-controls")); var open=tb.getAttribute("aria-expanded")==="true"; tb.setAttribute("aria-expanded",open?"false":"true"); box.hidden=open; return; }
    if(e.target.closest(".n-check")){ check(n); return; }
    if(e.target.closest(".n-show")){ showMe(n); return; }
    if(e.target.closest(".n-next")){ if(isDone(n)) show(n+1,true); return; }
  });
  bindOrder();
  doneBtn.addEventListener("click",onDone);
  retryBtn.addEventListener("click",onRetry);
  document.getElementById("frBtn").addEventListener("click",function(){ state.fr=!state.fr; applyLang(); save(); announce(state.fr?"French translation on":"French translation off"); });
  // keep trying LMS discovery after later interaction
  ["click","keydown","touchend"].forEach(function(ev){ document.addEventListener(ev,retryPendingLms,{passive:true}); });

  applyLang();
  for(var n=1;n<=4;n++){ renderSel(n); }
  renderOrder();
  show(state.screen,false);
  // restored completed status for display only (no resend)
  if(state.screen===5 && completionSent){ var m=document.getElementById("doneMsg"); m.innerHTML=msgHTML("savedAgain"); m.hidden=false; }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init); else init();
})();
</script>
