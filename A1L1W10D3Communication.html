<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission — Reporting household problems</title>
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;
    --blue-tint:#EAF8FB;
    --green-tint:#F7FAEC;
    --yellow-tint:#FFF8E1;
    --muted:#55564f;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Open Sans",Arial,sans-serif;
    background:var(--white);
    color:var(--pazapa-grey-dark);
    line-height:1.5;
    font-size:1rem;
  }
  h1,h2,h3{
    font-family:"Filson Soft","Open Sans",Arial,sans-serif;
    font-weight:800;
    margin:0 0 8px 0;
    line-height:1.25;
  }
  h2{font-size:1.45rem;}
  h3{font-size:1.05rem;}
  p{margin:0 0 12px 0;}
  .app{max-width:760px;margin:0 auto;padding:14px 16px 48px 16px;}
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:8px 0 12px 0;border-bottom:4px solid var(--pazapa-blue);
  }
  .brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:1rem;}
  .step-label{
    background:var(--pazapa-grey-light);border-radius:999px;padding:6px 14px;font-size:0.92rem;white-space:nowrap;
  }
  .dots{display:flex;gap:6px;margin:10px 0 18px 0;}
  .dot{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
  .dot.done{background:var(--pazapa-blue);}
  .dot.current{background:var(--pazapa-yellow);}
  .screen{outline:none;}
  .screen h2:focus{outline:none;}
  .card{background:var(--blue-tint);border-radius:16px;padding:20px;margin-bottom:16px;}
  .card.green{background:var(--green-tint);}
  .card.yellow{background:var(--yellow-tint);}
  .card.white{background:var(--white);border:2px solid var(--pazapa-grey-light);}
  .lead{font-size:1.1rem;}
  .sub{color:var(--muted);font-size:0.97rem;}
  .art{display:block;width:100%;max-width:220px;height:auto;max-height:260px;object-fit:contain;margin:0 auto;border-radius:12px;background:var(--white);}
  .art.wide{max-width:300px;}

  /* Screen 1 */
  .hero{display:grid;grid-template-columns:1fr;gap:14px;align-items:center;}
  @media (min-width:600px){.hero{grid-template-columns:200px 1fr;}}
  .brief{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 16px 0;}
  @media (min-width:600px){.brief{grid-template-columns:1fr 1fr;}}
  .brief-item{background:var(--white);border:2px solid var(--pazapa-blue);border-radius:14px;padding:14px 16px;}
  .brief-item dt{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:0.95rem;margin-bottom:4px;}
  .brief-item dd{margin:0;}
  .goal{background:var(--green-tint);border-left:8px solid var(--pazapa-green);border-radius:10px;padding:14px 16px;margin-bottom:18px;}

  /* Buttons */
  .btn{
    font-family:inherit;font-size:1rem;font-weight:700;min-height:48px;min-width:48px;
    padding:12px 22px;border-radius:999px;cursor:pointer;touch-action:manipulation;
    border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);
  }
  .btn.primary{background:var(--pazapa-blue);}
  .btn[aria-pressed="true"]{background:var(--pazapa-blue);}
  .btn[aria-pressed="true"]::before{content:"\2713\00a0";}
  .btn.done-state{background:var(--pazapa-green);border-color:var(--pazapa-green);}
  .btn[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6a6b65;cursor:not-allowed;}
  .btn:hover:not([disabled]){filter:brightness(0.97);}
  .btn.help{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:center;}
  :focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 6px var(--pazapa-blue);}

  /* Phrase cards */
  fieldset{border:0;margin:0 0 16px 0;padding:0;min-width:0;}
  legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:1.05rem;padding:0;margin-bottom:8px;}
  .pgrid{display:grid;grid-template-columns:1fr;gap:10px;}
  @media (min-width:600px){.pgrid{grid-template-columns:1fr 1fr;}}
  button.pcard{
    font-family:inherit;font-size:1rem;text-align:left;min-height:64px;padding:12px 14px;border-radius:12px;
    border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;
    display:flex;flex-direction:column;gap:4px;
  }
  button.pcard .tag{font-size:0.85rem;font-weight:700;min-height:1.2em;}
  button.pcard[aria-pressed="true"]{background:var(--blue-tint);border-width:4px;padding:11px 13px;}
  button.pcard[aria-pressed="true"] .tag::before{content:"\2713  Selected";}
  button.pcard.ok{background:var(--green-tint);border-color:var(--pazapa-green);}
  button.pcard.ok .tag::before{content:"\2713  Useful for this message";}
  button.pcard.no{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
  button.pcard.no .tag::before{content:"\25CF  Not needed for this message";}
  button.pcard.locked{cursor:default;}
  .status{min-height:1.5em;font-weight:700;margin:6px 0 0 0;}
  .note{background:var(--yellow-tint);border-left:8px solid var(--pazapa-yellow);border-radius:10px;padding:10px 14px;margin:10px 0;}
  .tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 0;padding:0;list-style:none;}
  .tray li{background:var(--white);border:2px solid var(--pazapa-green);border-radius:999px;padding:8px 14px;font-weight:600;}

  /* Plan screen */
  .plan{list-style:none;margin:0;padding:0;display:grid;gap:14px;}
  .plan-sec{background:var(--white);border-radius:14px;border:2px solid var(--pazapa-blue);padding:14px 16px;}
  .plan-sec .num{
    display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    background:var(--pazapa-blue);font-weight:800;margin-right:8px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px 0;}
  button.chip{
    font-family:inherit;font-size:0.97rem;font-weight:600;min-height:48px;padding:8px 16px;border-radius:999px;
    border:2px solid var(--pazapa-blue);background:var(--white);color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;
  }
  button.chip[aria-pressed="true"]{background:var(--pazapa-blue);}
  button.chip[aria-pressed="true"]::before{content:"\2713\00a0";}
  label{font-weight:700;display:block;margin-bottom:4px;}
  select,textarea{
    font-family:inherit;font-size:1rem;width:100%;border:2px solid var(--pazapa-blue);border-radius:10px;
    padding:10px;background:var(--white);color:var(--pazapa-grey-dark);min-height:48px;touch-action:manipulation;
  }
  textarea{min-height:120px;resize:vertical;}
  .preview{background:var(--white);border:2px dashed var(--pazapa-blue);border-radius:12px;padding:12px 14px;min-height:56px;}
  .example{background:var(--yellow-tint);border-left:8px solid var(--pazapa-yellow);border-radius:10px;padding:12px 14px;margin-top:10px;}
  .example p{margin:0 0 6px 0;}

  /* Chat */
  .chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .bubble{border-radius:16px;padding:12px 16px;max-width:92%;}
  .bubble.in{background:var(--pazapa-grey-light);align-self:flex-start;border-bottom-left-radius:4px;}
  .bubble .who{font-weight:800;font-size:0.9rem;display:block;margin-bottom:2px;}
  .modes{display:flex;gap:10px;margin:8px 0 14px 0;}
  .count{font-size:0.9rem;color:var(--muted);margin-top:4px;}
  .helpers{margin-top:14px;}
  .helpers h3{margin-top:12px;}
  .say{background:var(--white);border:2px solid var(--pazapa-green);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:1.05rem;}
  .rec-row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
  .rec-status{font-weight:700;min-height:1.5em;}
  audio{display:none;}

  /* Check */
  .checks{display:grid;gap:10px;margin:8px 0 0 0;}
  .checkrow{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:12px 14px;min-height:56px;}
  .checkrow input{width:28px;height:28px;margin-top:2px;flex:0 0 28px;touch-action:manipulation;accent-color:#1b6f80;}
  .checkrow label{margin:0;font-weight:400;cursor:pointer;}
  .checkrow label strong{display:block;}
  .checkrow .eg{color:var(--muted);font-size:0.93rem;}
  .result{background:var(--white);border:2px solid var(--pazapa-blue);border-radius:12px;padding:14px 16px;margin-top:12px;}
  .parts{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px;}
  .parts li{padding:6px 10px;border-radius:8px;}
  .parts li.good{background:var(--green-tint);}
  .parts li.todo{background:var(--yellow-tint);}
  .bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}

  .final{text-align:center;}
  .final .actions{justify-content:center;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .fr{display:none;color:var(--muted);font-style:italic;font-size:0.92em;margin-top:2px;}
  body.show-fr .fr{display:block;}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .fr-btn{min-height:48px;padding:8px 16px;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="brand">Pazapa English Programme for Adults</div>
    <div class="top-right"><button type="button" class="btn fr-btn" id="frBtn" aria-pressed="false" lang="fr">Français</button><div class="step-label" id="stepLabel">Step 1 of 6</div></div>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <main id="screen" class="screen" tabindex="-1" aria-label="Communication Mission activity"></main>

  <div class="actions final-row" id="finalRow" hidden>
    <button type="button" class="btn primary" id="doneBtn" disabled>Done</button>
    <button type="button" class="btn" id="tryAgainBtn">Try again</button>
  </div>
  <div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

  function $(s, r){ return (r || document).querySelector(s); }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];

  };

  function byId(id){ for(var i=0;i<PHRASES.length;i++){ if(PHRASES[i].id===id) return PHRASES[i]; } return null; }

    setTimeout(function(){ liveEl.textContent = msg; }, 30);

  function shuffle(a){
    var arr = a.slice();
    for(var i=arr.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }

  }
  function inList(v, list){ return list.indexOf(v) > -1; }

  /* ---------- meaning check (deterministic, documented phrase groups) ---------- */
  function normalise(s){
    s = String(s || "");
    try{ s = s.normalize("NFKC"); }catch(e){}
    s = s.replace(/[‘’ʼ`]/g, "'").replace(/[“”]/g, '"');
    s = s.replace(/\s+/g, " ").trim().toLowerCase();
    s = s.replace(/[.!?,;:\s]+$/, "");
    return s;
  }
  // PROBLEM group: the learner names what is wrong.
  var G_PROBLEM = ["leak","drip","broken","not working","isn't working","isnt working","is not working","stopped working","problem with","no water","no electricity","no power"];
  // REQUEST group: the learner asks someone to come, check or repair.
  var G_REQUEST = ["could someone","can someone","would someone","could you","can you","would you","come and check","come and fix","come and look","come and repair","check it","check the","fix it","fix the","repair","send someone","please come","when can the repair","when can someone","when can you"];
  // AVAILABILITY group: the learner says they are free.
  var G_AVAIL = ["available","i'm free","i am free","free after","free at","free before","i can be home","i am home","i'm home"];
  // TIME group: a clear time word or number.
  var TIME_RE = /\b(after|before|at|from|until|around|about)\s+(\d{1,2}([:.]\d{2})?|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|noon|midday)\b|\b(tomorrow|today|tonight)\b|\b\d{1,2}\s?(o'clock|oclock|am|pm)\b|\b(morning|afternoon|evening)\b/;
  var G_POLITE = ["thank","please","thanks","cheers"];
  function hasAny(t, list){ for(var i=0;i<list.length;i++){ if(t.indexOf(list[i]) > -1) return true; } return false; }

  function analyse(text){
    var t = normalise(text);
    var problem = hasAny(t, G_PROBLEM);
    var request = hasAny(t, G_REQUEST);
    var availWord = hasAny(t, G_AVAIL);
    var timeWord = TIME_RE.test(t);
    var polite = hasAny(t, G_POLITE);
    return {
      problem: problem,
      request: request,
      avail: availWord && timeWord ? "ok" : (availWord ? "time" : "missing"),
      polite: polite,
      complete: problem && request && availWord && timeWord
    };
  }

    return t;
  }
  function composeDraft(){
    var pl = state.plan, parts = [], used = {};
    var g = pl.g ? pl.g.replace(/\.$/, "") : "";
    if(g && pl.apt){ parts.push(g + ", apartment " + pl.apt + "."); }
    else if(g){ parts.push(g + "."); }
    else if(pl.apt){ parts.push("Apartment " + pl.apt + "."); }
    [pl.o, pl.k1, pl.k2, pl.c].forEach(function(id){
      if(id && !used[id]){ used[id] = true; parts.push(phraseText(id)); }
    });
    if(pl.th){ parts.push("Thank you."); }
    return parts.join(" ");
  }

  /* ---------- LMS (SCORM 1.2 / 2004) with localStorage fallback ---------- */
  var lms = {api:null, ver:"", ready:false};
  function findApiIn(win){
    var n = 0;
    while(win && n < 12){
      try{ if(win.API_1484_11) return {api:win.API_1484_11, ver:"2004"}; }catch(e){}
      try{ if(win.API) return {api:win.API, ver:"1.2"}; }catch(e2){}
      var p = null;
      try{ p = win.parent; }catch(e3){ p = null; }
      if(!p || p === win) break;
      win = p; n++;
    }
    return null;
  }
  function discover(){
    if(lms.ready) return true;
    var f = null;
    try{ f = findApiIn(window); }catch(e){}
    if(!f){ try{ if(window.opener && window.opener !== window){ f = findApiIn(window.opener); } }catch(e2){} }
    if(!f) return false;
    lms.api = f.api; lms.ver = f.ver;
    try{ if(lms.ver === "2004"){ lms.api.Initialize(""); } else { lms.api.LMSInitialize(""); } }catch(e3){ lms.api = null; return false; }
    lms.ready = true;
    return true;
  }
  function lget(k){ try{ return String(lms.ver === "2004" ? lms.api.GetValue(k) : lms.api.LMSGetValue(k)); }catch(e){ return ""; } }
  function lset(k, v){ try{ var r = lms.ver === "2004" ? lms.api.SetValue(k, v) : lms.api.LMSSetValue(k, v); return String(r) !== "false"; }catch(e){ return false; } }
  function lcommit(){ try{ var r = lms.ver === "2004" ? lms.api.Commit("") : lms.api.LMSCommit(""); return String(r) !== "false"; }catch(e){ return false; } }
  function lmsDone(){
    if(lms.ver === "2004"){ var c = lget("cmi.completion_status"), s = lget("cmi.success_status"); return c === "completed" || s === "passed"; }
    var st = lget("cmi.core.lesson_status"); return st === "completed" || st === "passed";
  }

  function pack(){
    var p = state.plan;
    return JSON.stringify({
      v:1,
      s:Math.min(state.screen, 5),
      m:state.mode,
      sel:state.sel,
      pl:[p.o,p.k1,p.k2,p.c,p.g,p.apt,p.time,p.th ? 1 : 0],
      tx:state.text,
      ld:state.lastDraft,
      ck:state.chk.map(function(b){ return b ? 1 : 0; }).join(""),
      at:state.att,
      a2:state.a2,
      hp:(state.help.ex ? "1" : "0") + (state.help.bank ? "1" : "0"),
      sp:state.spoke ? 1 : 0
    });
  }

  var saveTimer = null;
  function scheduleSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveProgress, 250);
  }
  function saveProgress(){
    saveTimer = null;
    var data = pack();
    if(data.length > 3500){ return; }
    discover();
    if(lms.ready){
      lset("cmi.suspend_data", data);
      if(!lmsDone()){
        if(lms.ver === "2004"){
          var cs = lget("cmi.completion_status");
          if(cs === "" || cs === "unknown" || cs === "not attempted"){ lset("cmi.completion_status", "incomplete"); }
        } else {
          var st = lget("cmi.core.lesson_status");
          if(st === "" || st === "not attempted"){ lset("cmi.core.lesson_status", "incomplete"); }
        }
      }
      lcommit();
    } else {
      try{ localStorage.setItem(ACT_KEY, data); }catch(e){}
    }
  }
  function loadSaved(){
    var raw = "";
    discover();
    if(lms.ready){ raw = lget("cmi.suspend_data"); }
    if(!raw){ try{ raw = localStorage.getItem(ACT_KEY) || ""; }catch(e){ raw = ""; } }
    if(!raw || raw.length > 4000) return null;
    try{
      var d = JSON.parse(raw);
      if(!d || d.v !== 1) return null;
      return d;
    }catch(e2){ return null; }
  }
  function restore(){
    var d = loadSaved();
    if(!d) return;
    try{
      var known = PHRASES.map(function(p){ return p.id; });
      var sel = (Array.isArray(d.sel) ? d.sel : []).filter(function(id, i, a){ return inList(id, known) && a.indexOf(id) === i; });
      state.sel = sel;
      var pl = Array.isArray(d.pl) ? d.pl : [];
      var pickId = function(v){ return (typeof v === "string" && inList(v, sel)) ? v : ""; };
      state.plan = {
        o:pickId(pl[0]), k1:pickId(pl[1]), k2:pickId(pl[2]), c:pickId(pl[3]),
        g:inList(pl[4], GREETS) ? pl[4] : "",
        apt:inList(pl[5], APTS) ? pl[5] : "",
        time:inList(pl[6], TIMES) ? pl[6] : "",
        th:pl[7] === 1
      };
      state.text = typeof d.tx === "string" ? d.tx.slice(0, MAX) : "";
      state.lastDraft = typeof d.ld === "string" ? d.ld.slice(0, MAX) : "";
      state.mode = d.m === "speak" ? "speak" : "type";
      state.spoke = d.sp === 1;
      var ck = typeof d.ck === "string" ? d.ck : "";
      state.chk = [0,1,2,3].map(function(i){ return ck.charAt(i) === "1"; });
      state.att = Math.max(0, Math.min(9, parseInt(d.at, 10) || 0));
      state.a2 = Math.max(0, Math.min(9, parseInt(d.a2, 10) || 0));
      state.help.ex = typeof d.hp === "string" && d.hp.charAt(0) === "1";
      state.help.bank = typeof d.hp === "string" && d.hp.charAt(1) === "1";
      state.checked = false; // always review again after a restore
      state.s2done = selOk();
      var scr = Math.max(1, Math.min(5, parseInt(d.s, 10) || 1));
      if(!selOk()){ scr = Math.min(scr, 2); }
      else if(!planOk()){ scr = Math.min(scr, 3); }
      else if(scr > 4 && !productionOk()){ scr = 4; }
      if(scr === 5 && state.mode === "speak" && !state.spoke){ scr = 4; }
      state.screen = scr;
    }catch(e){ state = freshState(); }
  }

  function activityCompleted(){
    if(completionSent) return;
    discover();
    if(lms.ready){
      if(!lmsDone()){
        if(lms.ver === "2004"){ lset("cmi.completion_status", "completed"); }
        else { lset("cmi.core.lesson_status", "completed"); }
        lcommit();
        if(!lmsDone()){
          if(lms.ver === "2004"){ lset("cmi.completion_status", "completed"); }
          else { lset("cmi.core.lesson_status", "completed"); }
          lcommit();
        }
      }
    } else {
      try{ localStorage.setItem(ACT_KEY + "_done", "1"); }catch(e){}
    }
    completionSent = true;
    try{ console.log("W10D3 Communication Mission completed"); }catch(e2){}
  }

  /* ---------- recording (local only) ---------- */
  var rec = {
    state:"idle", stream:null, mr:null, chunks:[], blob:null, url:null,
    audio:null, playing:false, err:"", discard:false,
    supported:!!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)
  };
  function pickMime(){
    if(!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== "function") return "";
    var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
    for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
    return "";
  }
  function revokeUrl(){
    if(rec.url){ try{ URL.revokeObjectURL(rec.url); }catch(e){} rec.url = null; }
  }
  function releaseStream(){
    if(rec.stream){
      try{ rec.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      rec.stream = null;
    }
  }
  function getAudio(){
    if(!rec.audio){
      rec.audio = new Audio();
      rec.audio.addEventListener("ended", function(){ rec.playing = false; updateRecUI(); });
      rec.audio.addEventListener("pause", function(){ rec.playing = false; updateRecUI(); });
    }
    return rec.audio;
  }
  function stopPlayback(){
    if(rec.audio){
      try{ rec.audio.pause(); }catch(e){}
      try{ rec.audio.removeAttribute("src"); rec.audio.load(); }catch(e2){}
    }
    rec.playing = false;
  }
  function failRec(kind){
    var msgs = {
      denied:"Microphone access was not allowed. You can type your message or speak aloud without recording.",
      nodevice:"No microphone was found on this device. You can type your message or speak aloud without recording.",
      busy:"The microphone is busy or cannot be read. You can type your message or speak aloud without recording.",
      unsupported:"Recording is not available on this device or browser. You can type your message or speak aloud without recording.",
      empty:"The recording was empty. Press Try again, then record once more.",
      unexpected:"Recording stopped unexpectedly. You can try again, type your message or speak aloud without recording."
    };
    rec.state = "error";
    rec.err = msgs[kind] || msgs.unexpected;
    releaseStream();
    updateRecUI();
    announce(rec.err);
  }
  function errKind(err){
    var n = err && err.name ? err.name : "";
    if(n === "NotAllowedError" || n === "PermissionDeniedError" || n === "SecurityError") return "denied";
    if(n === "NotFoundError" || n === "DevicesNotFoundError") return "nodevice";
    if(n === "NotReadableError" || n === "TrackStartError" || n === "AbortError") return "busy";
    return "unexpected";
  }
  function startRecording(){
    if(rec.state === "requesting" || rec.state === "recording" || rec.state === "stopping") return;
    if(!rec.supported){ failRec("unsupported"); return; }
    stopPlayback();
    rec.discard = false;
    rec.state = "requesting";
    rec.err = "";
    updateRecUI();
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(rec.state !== "requesting"){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      rec.stream = stream;
      rec.chunks = [];
      var mt = pickMime(), mr;
      try{ mr = mt ? new MediaRecorder(stream, {mimeType:mt}) : new MediaRecorder(stream); }
      catch(e){ failRec("unexpected"); return; }
      rec.mr = mr;
      mr.ondataavailable = function(ev){ if(ev.data && ev.data.size > 0){ rec.chunks.push(ev.data); } };
      mr.onerror = function(){ if(rec.mr === mr){ failRec("unexpected"); } };
      mr.onstop = function(){
        releaseStream();
        if(rec.mr !== mr) return;
        rec.mr = null;
        if(rec.discard){ rec.chunks = []; rec.discard = false; rec.state = "idle"; updateRecUI(); return; }
        var type = mr.mimeType || mt || "audio/mp4";
        var blob = new Blob(rec.chunks, {type:type});
        rec.chunks = [];
        revokeUrl();
        if(!blob.size){ rec.blob = null; failRec("empty"); refreshGates(); return; }
        rec.blob = blob;
        rec.url = URL.createObjectURL(blob);
        rec.state = "ready";
        updateRecUI();
        refreshGates();
        announce("Recording stopped. You can now hear your recording.");
      };
      try{ mr.start(); }catch(e2){ failRec("unexpected"); return; }
      rec.state = "recording";
      updateRecUI();
      announce("Recording started.");
    }).catch(function(err){
      if(rec.state !== "requesting") return;
      failRec(errKind(err));
    });
  }
  function stopRecording(){
    if(rec.state !== "recording" || !rec.mr) return;
    rec.state = "stopping";
    updateRecUI();
    try{ if(rec.mr.state !== "inactive"){ rec.mr.stop(); } }catch(e){ failRec("unexpected"); return; }
    releaseStream();
  }
  function discardRecording(){
    stopPlayback();
    if(rec.state === "recording" && rec.mr){
      rec.discard = true;
      rec.state = "stopping";
      try{ if(rec.mr.state !== "inactive"){ rec.mr.stop(); } }catch(e){}
      releaseStream();
    } else if(rec.state === "requesting"){
      rec.state = "idle";
    } else {
      rec.state = "idle";
    }
    rec.err = "";
    rec.blob = null;
    revokeUrl();
    updateRecUI();
    refreshGates();
  }
  function togglePlayback(){
    if(rec.state !== "ready" || !rec.url) return;
    if(rec.playing){ stopPlayback(); updateRecUI(); return; }
    var a = getAudio();
    a.src = rec.url;
    rec.playing = true;
    updateRecUI();
    var pr = a.play();
    if(pr && pr.catch){ pr.catch(function(){ rec.playing = false; updateRecUI(); announce("The recording could not be played. Try recording again."); }); }
  }
  function updateRecUI(){
    var st = rec.state;
    var busy = st === "requesting" || st === "recording" || st === "stopping";
    $$('[data-rec="record"]').forEach(function(b){ b.disabled = !rec.supported || busy; });
    $$('[data-rec="stop"]').forEach(function(b){ b.disabled = st !== "recording"; });
    $$('[data-rec="hear"]').forEach(function(b){
      b.disabled = st !== "ready" || !rec.blob;
      b.textContent = rec.playing ? "Stop playback" : "Hear my recording";
    });
    $$('[data-rec="retry"]').forEach(function(b){ b.disabled = !(st === "ready" || st === "error" || st === "recording"); });
    var msg;
    if(!rec.supported && st !== "error"){ msg = "Recording is not available on this device or browser. You can type your message or speak aloud without recording."; }
    else if(st === "idle"){ msg = rec.blob ? "Recording ready. Press Hear my recording." : "Press Record my voice when you are ready."; }
    else if(st === "requesting"){ msg = "Waiting for microphone access…"; }
    else if(st === "recording"){ msg = "● Recording. Speak now, then press Stop."; }
    else if(st === "stopping"){ msg = "Stopping…"; }
    else if(st === "ready"){ msg = "Recording ready. Press Hear my recording."; }
    else { msg = rec.err; }
    $$('[data-rec="status"]').forEach(function(el){ el.textContent = msg; });
  }

  function cleanupMedia(){
    try{ if(rec.mr && rec.mr.state !== "inactive"){ rec.discard = true; rec.mr.stop(); } }catch(e){}
    releaseStream();
    stopPlayback();
    revokeUrl();
  }
  window.addEventListener("pagehide", function(){

          '<p class="sub">Ask for help with the problem.</p>' + F('Demandez de l\'aide pour le problème.') +
          '<label for="selK1">Phrase for your request</label><select id="selK1" data-sel="k1">' + optionList(pl.k1) + '</select>' +
          '<label for="selK2" style="margin-top:10px;">Another phrase (optional)</label><select id="selK2" data-sel="k2">' + optionList(pl.k2) + '</select>' +
        '</fieldset></li>' +
        '<li class="plan-sec"><fieldset><legend><span class="num" aria-hidden="true">3</span>Closing and confirmation</legend>' +
          '<img class="art" src="' + IMG.clock + '" alt="" style="max-width:90px;max-height:110px;margin:0 0 8px 0;">' +
          '<p class="sub">Say when you are available.</p>' + F('Dites quand vous êtes disponible.') +
          '<label for="selC">Phrase for the closing</label><select id="selC" data-sel="c">' + optionList(pl.c) + '</select>' +
          '<div class="chips" role="group" aria-label="Time you are available">' + chipGroup("time", TIMES, function(v){ return "after " + v; }, pl.time) + '</div>' +
          '<div class="chips" role="group" aria-label="Polite ending"><button type="button" class="chip" data-chip="th" data-val="1" aria-pressed="' + (pl.th ? "true" : "false") + '">Thank you.</button></div>' +
        '</fieldset></li>' +
      '</ol>' +
      '<h3 style="margin-top:16px;">Your plan so far</h3>' +
      '<div class="preview" id="s3preview"></div>' +
      '<div class="actions">' +
        '<button type="button" class="btn help" data-act="s3example" id="s3exBtn" aria-expanded="' + (state.help.ex ? "true" : "false") + '" aria-controls="s3ex">' + (state.help.ex ? "Hide example" : "Show example") + '</button>' +
        '<button type="button" class="btn primary" data-act="s3next" id="s3next" disabled>Continue</button>' +
      '</div>' +
      '<div class="example" id="s3ex"' + (state.help.ex ? "" : " hidden") + '>' +
        '<p><strong>Opening:</strong> Hello, apartment 12B. The kitchen tap is leaking.</p>' +
        '<p><strong>Key information and request:</strong> Could someone come and check it?</p>' +
        '<p><strong>Closing and confirmation:</strong> I am available after four. Thank you.</p>' +
      '</div>' +
    '</div>';
  }
  function updateS3(){
    var d = composeDraft();
    var pv = $("#s3preview");
    if(pv){ pv.textContent = d || "Choose phrases above. Your plan will appear here."; }
    var nx = $("#s3next");
    if(nx){ nx.disabled = !planOk(); }
    $$(".chip").forEach(function(b){
      var k = b.getAttribute("data-chip"), v = b.getAttribute("data-val");
      var on = k === "th" ? state.plan.th : state.plan[k] === v;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  function planChanged(){
    state.checked = false;
    updateS3();
    scheduleSave();
  }

  /* Screen 4 */
  function htmlS4(){
    var typeMode = state.mode === "type";
    var trayHtml = PHRASES.filter(function(p){ return inList(p.id, state.sel); }).map(function(p){ return "<li>" + esc(p.text) + "</li>"; }).join("");
    var trayBtns = PHRASES.filter(function(p){ return inList(p.id, state.sel); }).map(function(p){
      return '<button type="button" class="chip" data-ins="' + esc(phraseText(p.id)) + '">' + esc(phraseText(p.id)) + "</button>";
    }).join("");
    var starters = STARTERS.map(function(s){ return '<button type="button" class="chip" data-ins="' + esc(s.replace("…", "")) + '">' + esc(s) + "</button>"; }).join("");
    var details = APTS.map(function(a){ return '<button type="button" class="chip" data-ins="Apartment ' + a + '.">Apartment ' + a + "</button>"; }).join("") +
                  TIMES.map(function(t){ return '<button type="button" class="chip" data-ins="after ' + t + '">after ' + t + "</button>"; }).join("");
    return '' +
    '<div class="card">' +
      '<h2 id="sh" tabindex="-1">Complete the arrangement</h2>' +
      '<img class="art wide" src="' + IMG.dialogue + '" alt="" style="margin-bottom:12px;">' +
      '<div class="chat"><div class="bubble in"><span class="who">Maintenance office</span>Hello. Please tell us the problem and when you are available.' + F('Bonjour. Dites-nous le problème et quand vous êtes disponible.') + '</div></div>' +
      '<p class="sub">Reply in 2 to 5 short sentences. You can type or speak. Your plan stays the same.</p>' + F('Répondez en 2 à 5 phrases courtes. Vous pouvez écrire ou parler.') +
      '<div class="modes" role="group" aria-label="How do you want to answer?">' +
        '<button type="button" class="btn" data-act="modeType" id="modeType" aria-pressed="' + (typeMode ? "true" : "false") + '">Type</button>' +
        '<button type="button" class="btn" data-act="modeSpeak" id="modeSpeak" aria-pressed="' + (typeMode ? "false" : "true") + '">Speak</button>' +
      '</div>' +
      '<div id="panelType"' + (typeMode ? "" : " hidden") + '>' +
        '<label for="msg">Your message to the maintenance office</label>' +
        '<textarea id="msg" maxlength="' + MAX + '" aria-describedby="msgCount"></textarea>' +
        '<div class="count" id="msgCount"></div>' +
        '<div class="helpers">' +
          '<h3>Sentence starters</h3><div class="chips">' + starters + '</div>' +
          '<h3>Your phrase tray</h3><div class="chips">' + trayBtns + '</div>' +
          '<h3>Made-up details</h3><div class="chips">' + details + '</div>' +
        '</div>' +
      '</div>' +
      '<div id="panelSpeak"' + (typeMode ? " hidden" : "") + '>' +
        '<h3>Say your message</h3>' +
        '<div class="say" id="sayBox"></div>' +
        '<ul class="tray">' + trayHtml + '</ul>' +
        '<div class="rec-row" style="margin-top:14px;">' +
          '<button type="button" class="btn primary" data-rec="record" data-act="recRecord">Record my voice</button>' +
          '<button type="button" class="btn" data-rec="stop" data-act="recStop" disabled>Stop</button>' +
          '<button type="button" class="btn" data-rec="hear" data-act="recHear" disabled>Hear my recording</button>' +
          '<button type="button" class="btn" data-rec="retry" data-act="recRetry" disabled>Try again</button>' +
        '</div>' +
        '<p class="rec-status" data-rec="status" role="status"></p>' +
        '<div class="actions" style="margin-top:6px;"><button type="button" class="btn" data-act="spokeAloud" id="spokeBtn" aria-pressed="' + (state.spoke ? "true" : "false") + '">Speak aloud without recording</button></div>' +
        '<p class="status" id="spokeStatus"></p>' +
      '</div>' +
      '<div class="actions"><button type="button" class="btn primary" data-act="s4next" id="s4next" disabled>Review my message</button></div>' +
    '</div>';
  }
  function bindS4(){
    var ta = $("#msg");
    if(ta){
      ta.value = state.text;
      ta.addEventListener("input", onTextInput);
    }
    updateS4Text();
    updateSpokeUI();
    refreshGates();
  }
  function updateS4Text(){
    var c = $("#msgCount");
    if(c){ c.textContent = state.text.length + " of " + MAX + " characters"; }
    var say = $("#sayBox");
    if(say){ say.textContent = state.text.trim() ? state.text : "Your message will appear here. Go to Type if you want to write or change it."; }
  }
  function updateSpokeUI(){
    var b = $("#spokeBtn");
    if(b){ b.setAttribute("aria-pressed", state.spoke ? "true" : "false"); b.textContent = state.spoke ? "✓ Speak aloud without recording" : "Speak aloud without recording"; }
    var s = $("#spokeStatus");
    if(s){ s.textContent = state.spoke ? "You chose to speak aloud. Say your message now, then press Review my message." : ""; }
  }
  function onTextInput(ev){
    var el = ev && ev.target ? ev.target : $("#msg");
    state.text = el.value.slice(0, MAX);
    state.checked = false;
    updateS4Text();
    var t5 = $("#msg5");
    var cnt5 = $("#msg5Count");
    if(cnt5){ cnt5.textContent = state.text.length + " of " + MAX + " characters"; }
    if(el.id === "msg5"){ staleResult(); }
    refreshGates();
    scheduleSave();
  }
  function insertText(str){
    var ta = $("#msg5") && state.screen === 5 ? $("#msg5") : $("#msg");
    if(!ta) return;
    var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    if(typeof s !== "number"){ s = e = v.length; }
    var before = v.slice(0, s), after = v.slice(e);
    var sepB = (before && !/\s$/.test(before)) ? " " : "";
    var sepA = (after && !/^\s/.test(after)) ? " " : "";
    var nv = before + sepB + str + sepA + after;
    if(nv.length > MAX){ announce("The message is at the limit of " + MAX + " characters."); return; }
    ta.value = nv;
    var pos = (before + sepB + str).length;
    try{ ta.setSelectionRange(pos, pos); }catch(e2){}
    ta.focus();
    onTextInput({target:ta});
  }
  function setMode(m){
    if(m === state.mode) return;
    state.mode = m;
    state.checked = false;
    $("#modeType").setAttribute("aria-pressed", m === "type" ? "true" : "false");
    $("#modeSpeak").setAttribute("aria-pressed", m === "speak" ? "true" : "false");
    $("#panelType").hidden = m !== "type";
    $("#panelSpeak").hidden = m !== "speak";
    updateS4Text();
    refreshGates();
    announce(m === "type" ? "Type. Your message is in the box." : "Speak. You can record your voice or speak aloud.");
    scheduleSave();
  }

  /* Screen 5 */
  function htmlS5(){
    var typeMode = state.mode === "type";
    var items = [
      ["Clear purpose","I say there is a problem and ask for help.","The kitchen tap is leaking. Could someone come and check it?","Objectif clair : je dis qu'il y a un problème et je demande de l'aide."],
      ["Key information","I give the problem and when I am available.","I am available after four.","Informations clés : je donne le problème et mes disponibilités."],
      ["Useful lesson language","I use words and phrases from this lesson.","Could someone come and check it?","Langue utile : j'utilise les mots et phrases de la leçon."],
      ["Polite ending","I end in a polite way.","Thank you.","Fin polie : je termine poliment."]
    ];
    var checks = items.map(function(it, i){
      return '<div class="checkrow"><input type="checkbox" id="ck' + i + '" data-ck="' + i + '"' + (state.chk[i] ? " checked" : "") + '>' +
        '<label for="ck' + i + '"><strong>' + esc(it[0]) + '</strong>' + esc(it[1]) + '<span class="eg"> Example: “' + esc(it[2]) + '”</span>' + F(it[3]) + '</label></div>';
    }).join("");
    var top;
    if(typeMode){
      top = '<label for="msg5">Your message (you can still change it)</label>' +
        '<textarea id="msg5" maxlength="' + MAX + '" aria-describedby="msg5Count"></textarea>' +
        '<div class="count" id="msg5Count"></div>' +
        '<div class="actions" style="margin-top:10px;"><button type="button" class="btn primary" data-act="checkMsg" id="checkMsgBtn">Check my message</button></div>' +
        '<div id="s5result" aria-live="polite"></div>' +
        '<div id="s5extra"></div>';
    } else {
      top = '<h3>Your spoken message</h3>' +
        (state.text.trim() ? '<div class="say">' + esc(state.text) + '</div>' : "") +
        (rec.blob || rec.state === "ready"
          ? '<p>Listen to your recording. Is it clear?</p><div class="rec-row"><button type="button" class="btn" data-rec="hear" data-act="recHear" disabled>Hear my recording</button><button type="button" class="btn" data-act="recordAgain">Record again</button></div><p class="rec-status" data-rec="status" role="status"></p>'
          : '<p>You chose to speak aloud. Say your message once more if you like, then use the check below.</p>');
    }
    return '' +
    '<div class="card">' +
      '<h2 id="sh" tabindex="-1">Check your message</h2>' +
      '<img class="art" src="' + IMG.cal + '" alt="" style="max-width:110px;max-height:150px;margin:0 0 12px 0;">' +
      top +
      '<fieldset style="margin-top:18px;"><legend>Does your message do these four things?</legend><div class="checks">' + checks + '</div></fieldset>' +
      '<div class="actions"><button type="button" class="btn primary" data-act="finish" id="finishBtn" disabled>Finish mission</button></div>' +
      '<p class="status" id="finishHint"></p>' +
    '</div>';
  }
  function bindS5(){
    var ta = $("#msg5");
    if(ta){
      ta.value = state.text;
      ta.addEventListener("input", onTextInput);
      var cnt = $("#msg5Count"); if(cnt){ cnt.textContent = state.text.length + " of " + MAX + " characters"; }
    }
    $$("[data-ck]").forEach(function(c){
      c.addEventListener("change", function(){
        state.chk[parseInt(c.getAttribute("data-ck"), 10)] = c.checked;
        refreshGates();
        scheduleSave();
      });
    });
    if(state.checked){ showResult(false); }
    renderExtras();
    refreshGates();
  }
  function showResult(count){
    var box = $("#s5result");
    if(!box) return;
    var a = analyse(state.text);
    var good = [], next = [];
    var rows = [];
    function row(ok, label, goodTxt, todoTxt){
      rows.push('<li class="' + (ok ? "good" : "todo") + '">' + (ok ? "✓ " : "● ") + "<strong>" + label + ":</strong> " + (ok ? goodTxt : todoTxt) + "</li>");
    }
    row(a.problem, "Problem", "your message says what is wrong.", "say what the problem is. Example: The kitchen tap is leaking.");
    row(a.request, "Request", "you ask for help.", "ask for help. Example: Could someone come and check it?");
    row(a.avail === "ok", "Availability", "you say when you are available.", a.avail === "time" ? "add the time so the listener has the full information. Example: after four." : "say when you are available. Example: I am available after four.");
    if(a.problem) good.push("you say what the problem is");
    if(a.request) good.push("you ask for help");
    if(a.avail === "ok") good.push("you give your time");
    if(!a.problem) next.push("Say what the problem is.");
    else if(!a.request) next.push("Ask someone to come and check it.");
    else if(a.avail === "time") next.push("Add the time so the listener has the full information.");
    else if(a.avail === "missing") next.push("Add when you are available.");
    else if(!a.polite) next.push("Add “Thank you.” to end politely.");
    else next.push("Read your message aloud once before you finish.");
    var lead = a.complete ? "Your message achieves its purpose." : "Your message is a good start.";
    box.innerHTML = '<div class="result"><p><strong>' + lead + '</strong></p><ul class="parts">' + rows.join("") + '</ul>' +
      '<p><strong>What works:</strong> ' + (good.length ? esc(good[0].charAt(0).toUpperCase() + good[0].slice(1)) + "." : "You have started your message.") + '</p>' +
      '<p><strong>Next step:</strong> ' + esc(next[0]) + '</p>' +
      (a.complete && !a.polite ? '<p class="sub">Suggestion: add “Thank you.” to end politely.</p>' : "") +
      '<p class="sub">These are suggestions. Your own message is not changed.</p></div>';
    if(count){ announce(lead + " " + next[0]); }
  }
  function staleResult(){
    var box = $("#s5result");
    if(box && box.innerHTML){ box.innerHTML = '<div class="note">Your message has changed. Press Check my message again.</div>'; }
  }
  function renderExtras(){
    var ex = $("#s5extra");
    if(!ex) return;
    var html = "";
    if(state.att >= 2){
      html += '<div class="note"><strong>Phrase bank.</strong> Press a phrase to add it to your message.</div><div class="bank">' +
        PHRASES.filter(function(p){ return inList(p.id, state.sel); }).map(function(p){
          return '<button type="button" class="chip" data-ins="' + esc(phraseText(p.id)) + '">' + esc(phraseText(p.id)) + "</button>";
        }).join("") + '</div>';
    }
    if(state.att >= 3){
      html += '<div class="actions"><button type="button" class="btn help" data-act="s5example" aria-expanded="' + (state.help.ex ? "true" : "false") + '" aria-controls="s5ex">' + (state.help.ex ? "Hide example" : "Show example") + '</button></div>' +
        '<div class="example" id="s5ex"' + (state.help.ex ? "" : " hidden") + '><p>Hello, apartment 12B. The kitchen tap is leaking. Could someone come and check it? I am available after four. Thank you.</p><p class="sub">This is only an example. Your own message stays as you wrote it.</p></div>';
    }
    ex.innerHTML = html;
  }
  function canFinish(){
    if(!productionOk()) return false;
    if(!state.chk.every(Boolean)) return false;
    if(state.mode === "type"){
      return state.checked && (analyse(state.text).complete || state.att >= 2);
    }
    return true;
  }
  function refreshGates(){
    var s4 = $("#s4next");
    if(s4){ s4.disabled = !productionOk(); }
    var fin = $("#finishBtn");
    if(fin){
      fin.disabled = !canFinish();
      var hint = $("#finishHint");
      if(hint){
        var msg = "";
        if(!fin.disabled){ msg = ""; }
        else if(state.mode === "type" && !state.checked){ msg = "Press Check my message first."; }
        else if(state.mode === "type" && !analyse(state.text).complete && state.att < 2){ msg = "Add the missing parts, then press Check my message again."; }
        else if(!state.chk.every(Boolean)){ msg = "Tick all four boxes when you are ready."; }
        hint.textContent = msg;
      }
    }
  }

  /* Screen 6 */
  function htmlS6(){
    return '' +
    '<div class="card green final">' +
      '<img class="art" src="' + IMG.done + '" alt="" style="margin-bottom:12px;">' +
      '<h2 id="sh" tabindex="-1">Communication Mission complete.</h2>' +
      '<p class="lead">You communicated about reporting household problems.</p>' + F('Vous avez communiqué pour signaler des problèmes à la maison.') +
      '<p>Next, you will review, improve and retry.</p>' + F('Ensuite, vous allez réviser, améliorer et réessayer.') +
    '</div>';
  }

  /* ---------- events ---------- */
  screenEl.addEventListener("click", function(e){
    var t = e.target;
    var pc = t.closest(".pcard");
    if(pc){ togglePhrase(pc.getAttribute("data-id")); return; }
    var chip = t.closest("[data-chip]");
    if(chip){
      var k = chip.getAttribute("data-chip"), v = chip.getAttribute("data-val");
      if(k === "th"){ state.plan.th = !state.plan.th; }
      else { state.plan[k] = state.plan[k] === v ? "" : v; }
      planChanged();
      return;
    }
    var ins = t.closest("[data-ins]");
    if(ins){ insertText(ins.getAttribute("data-ins")); return; }
    var b = t.closest("[data-act]");
    if(!b || b.disabled) return;
    var act = b.getAttribute("data-act");
    switch(act){
      case "s1next": go(2); break;
      case "s2check": checkS2(); break;
      case "s2show":
        state.sel = correctIds();
        $$(".pcard").forEach(function(x){ x.classList.remove("no"); });
        $("#s2status").textContent = "These are the four useful phrases. Press Check.";
        updateS2(); announce("The four useful phrases are selected. Press Check."); scheduleSave(); break;
      case "s2next": if(state.s2done){ go(3); } break;
      case "s3example":
        state.help.ex = !state.help.ex;
        $("#s3ex").hidden = !state.help.ex;
        b.setAttribute("aria-expanded", state.help.ex ? "true" : "false");
        b.textContent = state.help.ex ? "Hide example" : "Show example";
        scheduleSave(); break;
      case "s3next":
        if(planOk()){
          var d = composeDraft();
          if(!state.text.trim() || state.text === state.lastDraft){ state.text = d.slice(0, MAX); }
          state.lastDraft = d.slice(0, MAX);
          state.checked = false;
          go(4);
        }
        break;
      case "modeType": setMode("type"); break;
      case "modeSpeak": setMode("speak"); break;
      case "recRecord": startRecording(); break;
      case "recStop": stopRecording(); break;
      case "recHear": togglePlayback(); break;
      case "recRetry": discardRecording(); break;
      case "recordAgain": discardRecording(); state.mode = "speak"; state.checked = false; go(4); break;
      case "spokeAloud":
        state.spoke = !state.spoke;
        state.checked = false;
        updateSpokeUI(); refreshGates(); scheduleSave();
        announce(state.spoke ? "You chose to speak aloud." : "Speak aloud is off."); break;
      case "s4next": if(productionOk()){ go(5); } break;
      case "checkMsg":
        var a = analyse(state.text);
        state.checked = true;
        if(!a.complete){ state.att++; }
        showResult(true);
        renderExtras();
        refreshGates();
        scheduleSave(); break;
      case "s5example":
        state.help.ex = !state.help.ex;
        var ex5 = $("#s5ex"); if(ex5){ ex5.hidden = !state.help.ex; }
        b.setAttribute("aria-expanded", state.help.ex ? "true" : "false");
        b.textContent = state.help.ex ? "Hide example" : "Show example";
        scheduleSave(); break;
      case "finish": if(canFinish()){ go(6); } break;
    }
  });
  // Selects (plan) use change events
  screenEl.addEventListener("change", function(e){
    var s = e.target.closest("[data-sel]");
    if(s){ state.plan[s.getAttribute("data-sel")] = s.value; planChanged(); }
  });

  doneBtn.addEventListener("click", function(){
    if(doneBtn.disabled || completionSent || state.screen !== 6) return;
    activityCompleted();
    doneBtn.textContent = "Done ✓";
    doneBtn.classList.add("done-state");
    doneBtn.disabled = true;
    announce("Done.");
  });
  tryAgainBtn.addEventListener("click", function(){
    cleanupMedia();
    rec.state = "idle"; rec.blob = null; rec.err = ""; rec.mr = null; rec.chunks = []; rec.discard = false;
    state = freshState();
    completionSent = false;
    doneBtn.textContent = "Done";
    doneBtn.classList.remove("done-state");
    doneBtn.disabled = true;
    render(true);
    saveProgress();
    announce("Starting again from the first screen.");
  });

  var frBtn = document.getElementById("frBtn");
  frBtn.addEventListener("click", function(){
    var on = !document.body.classList.contains("show-fr");
    document.body.classList.toggle("show-fr", on);
    frBtn.setAttribute("aria-pressed", on ? "true" : "false");
    announce(on ? "French help is on." : "French help is off.");
  });

  /* ---------- start ---------- */
  restore();
  render(false);
})();
</script>
</body>
</html>
