<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission: Explaining a problem</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF4CC;
  --muted:#4A4A48;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:#fff;color:var(--pazapa-grey-dark);font-family:"Open Sans",Arial,sans-serif;font-size:1rem;line-height:1.5;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 8px;line-height:1.25;}
h2{font-size:1.45rem;}
h3{font-size:1.05rem;}
.app{max-width:760px;margin:0 auto;padding:12px 16px 40px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px;border-bottom:4px solid var(--pazapa-blue);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:36px;width:auto;display:block;}
.brand span{font-weight:700;font-size:.95rem;}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.progress{background:var(--pazapa-grey-light);border-radius:999px;padding:6px 14px;font-size:.92rem;white-space:nowrap;}
.dots{display:flex;gap:6px;margin:10px 0 16px;}
.dot{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
.dot.done{background:var(--pazapa-blue);}
.dot.now{background:var(--pazapa-yellow);}
.screen{outline:none;}
.card{background:var(--blue-tint);border-radius:16px;padding:18px;margin-bottom:14px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:#fff;border:2px solid var(--pazapa-grey-light);}
.lead{font-size:1.1rem;margin:0 0 12px;}
.fr{display:block;font-weight:400;font-size:.88em;color:var(--muted);font-style:italic;margin-top:2px;}
button .fr{font-size:.8em;margin-top:0;color:inherit;opacity:.92;}
.mgrid{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0;}
@media(min-width:620px){.mgrid{grid-template-columns:1fr 1fr;}}
.mcard{background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px 14px;}
.mcard .lab{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:.95rem;margin-bottom:2px;}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.hero img{width:150px;max-width:40%;height:auto;object-fit:contain;border-radius:12px;background:#FFF7EC;}
.hero .txt{flex:1;min-width:200px;}
fieldset{border:0;margin:0;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin-bottom:8px;}
.plist{display:grid;grid-template-columns:1fr;gap:10px;}
@media(min-width:620px){.plist{grid-template-columns:1fr 1fr;}}
label.phrase{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:10px 12px;min-height:56px;cursor:pointer;}
label.phrase img{width:44px;height:60px;object-fit:contain;flex:none;background:#FFF7EC;border-radius:8px;}
label.phrase input{width:24px;height:24px;flex:none;accent-color:#1B1B1A;}
label.phrase.on{border-width:4px;background:var(--green-tint);padding:8px 10px;}
label.phrase.flag{border-color:var(--pazapa-yellow);border-width:4px;background:var(--yellow-tint);padding:8px 10px;}
label.phrase .ptxt{flex:1;}
.tag{display:inline-block;font-size:.8rem;font-weight:700;margin-top:2px;}
.sdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark);}
.sdot.g{background:var(--pazapa-green);}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:600;min-height:0;}
.fb:empty{display:none;}
.fb.ok{background:var(--green-tint);border:2px solid var(--pazapa-green);}
.fb.help{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);}
button{font-family:inherit;touch-action:manipulation;}
.btn{min-height:48px;min-width:48px;padding:10px 20px;border-radius:999px;border:2px solid var(--pazapa-blue);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-weight:700;font-size:1rem;cursor:pointer;line-height:1.25;text-align:center;}
.btn.sec{background:#fff;}
.btn.green{background:var(--pazapa-green);border-color:var(--pazapa-green);}
.btn.yellow{background:var(--pazapa-yellow);border-color:var(--pazapa-yellow);}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#5F5F5C;cursor:not-allowed;}
.btn.sm{padding:8px 14px;font-size:.95rem;}
.chip{min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--pazapa-grey-dark);font-size:.97rem;cursor:pointer;text-align:left;}
.chip[aria-pressed="true"]{border-width:4px;background:var(--green-tint);padding:6px 12px;font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px;}
.nav{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;}
.nav [hidden]{display:none;}
.part{background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.part h3{margin-bottom:4px;}
.part ul{margin:4px 0 0;padding-left:20px;}
.part .empty{color:var(--muted);font-style:italic;}
.place{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:10px 12px;}
select,textarea{font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);border:2px solid var(--pazapa-blue);border-radius:10px;background:#fff;}
select{min-height:48px;padding:8px 10px;width:100%;}
textarea{width:100%;padding:10px;min-height:120px;resize:vertical;}
.count{font-size:.9rem;color:var(--muted);margin-top:4px;}
.modes{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.modes .btn[aria-pressed="true"]{background:var(--pazapa-blue);border-width:4px;padding:8px 18px;}
.modes .btn[aria-pressed="false"]{background:#fff;}
.chat{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:14px;padding:12px;margin-top:12px;}
.chat .who{font-weight:700;font-size:.85rem;margin-bottom:2px;}
.bubble{border-radius:14px;padding:10px 12px;margin:4px 0 10px;max-width:92%;overflow-wrap:anywhere;}
.bubble.me{background:var(--blue-tint);border:2px solid var(--pazapa-blue);margin-left:auto;}
.bubble.sara{background:var(--green-tint);border:2px solid var(--pazapa-green);}
.recrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
.status{font-weight:600;margin-top:6px;}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--pazapa-grey-light);min-height:48px;cursor:pointer;}
.checks input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:#1B1B1A;}
.checks .ex{display:block;font-size:.92rem;color:var(--muted);}
.found li{margin-bottom:4px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.msgbox{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere;}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 5px #fff;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important;}}
@media(max-width:420px){.btn{padding:10px 14px;}.hero img{max-width:100%;width:140px;}}
</style>
</head>

/* ---------- Text normalisation and deterministic check ---------- */
function norm(s){
  s = String(s||"");
  try{ s = s.normalize("NFKC"); }catch(e){}
  s = s.replace(/[‘’ʼ`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g," ").trim().toLowerCase();
  s = s.replace(/[.!?,;:\s]+$/,"");
  return s;
}
/* Phrase groups (documented): each group lists accepted wording patterns.
   problem  : an item word plus "not arrived / late / missing", or wrong/broken/lost/missing
   detail   : a time or order detail (yesterday, today, a day name, due, ordered, a number)
   request  : asking for action or help (could you check, please check, I need some help, help me)
   polite   : thank you / thanks / please
   language : any lesson word (order, delivery, late, lost, broken, wrong, bill, help, check) */
var G = {
  subject:/\b(order|delivery|parcel|package|item|bag|shipment)\b/,
  signal:/\b(hasn'?t|hasnt|has not|have not|haven'?t|did not|didn'?t|not|never)\b.{0,25}\b(arrive|arrived|come|came|here|delivered|receive|received)\b|\bis (late|missing)\b|\bwas late\b|\blate\b|\bmissing\b/,
  other:/\b(wrong|broken|lost)\b/,
  detail:/\b(yesterday|today|monday|tuesday|wednesday|thursday|friday|saturday|sunday|last (night|week)|days? ago|due|expected|ordered|number)\b|\d{3,}/,
  request:/\b(could|can|would|will|may) you( please)? (check|help|find|look|tell|send)\b|\bplease (check|help|find|look)\b|\bi need (some )?help\b|\bhelp me\b|\bcheck (it|the delivery|my order|this)\b/,
  polite:/\b(thank you|thanks|thank)\b|\bplease\b/,
  language:/\b(order|delivery|late|lost|broken|wrong|bill|help|check)\b/
};
function detCheck(text){
  var n = norm(text).replace(/\bhasnt\b/g,"hasn't");
  var purpose = (G.subject.test(n) && G.signal.test(n)) || G.other.test(n) || G.signal.test(n);
  var detail = G.detail.test(n), request = G.request.test(n);
  var r = { purpose:purpose, detail:detail, request:request, polite:G.polite.test(n), language:G.language.test(n) };
  r.info = detail && request;
  r.all = r.purpose && r.info && r.language && r.polite;
  return r;
}

/* ---------- Plan helpers ---------- */
function planParts(){
  var tray = byCanon(state.tray);
  function pick(k){ return tray.filter(function(id){ return state.assign[id]===k; }).map(function(id){ return PH[id].en; }); }
  return {
    open:(state.greet?[state.greet]:[]).concat(pick("open")),
    info:pick("info").concat(state.details),
    close:pick("close").concat(state.sign?[state.sign]:[])
  };
}
function planSentences(){ var p=planParts(); return p.open.concat(p.info,p.close); }
function planOk(){ return planParts().info.length>0 && selOk(); }
function selCheck(sel){
  var ids = sel.filter(function(id){ return PH[id]; });
  if(ids.length<3 || ids.length>4) return {ok:false,type:"few"};
  var bad = ids.filter(function(id){ return !PH[id].ok; });
  if(bad.length) return {ok:false,type:"bad",bad:bad};
  if(ids.indexOf("p1")<0) return {ok:false,type:"noproblem"};
  return {ok:true};
}
function selOk(){ return state.checked && selCheck(state.tray).ok; }

/* ---------- Production / completion rules ---------- */
function typedValid(){ return state.sent && state.text.trim().length>0 && state.sentText===state.text; }
function hasProduction(){ return typedValid() || run.recorded || state.spoke; }
function ticksAll(){ return state.ticks.every(Boolean); }
function checkComplete(){
  if(!hasProduction() || !ticksAll()) return false;
  if(typedValid()) return !!state.checkRun && !!state.det && (state.det.all || state.attempts>=2);
  return true;
}
function invalidate(){ state.checkRun=false; state.det=null; state.ticks=[false,false,false,false]; }

/* ---------- Persistence ---------- */
var lms = {api:null, kind:"", inited:false, tried:false};
function findIn(win,name){
  var n=0;
  while(win && n++<12){
    try{ if(win[name]) return win[name]; }catch(e){ return null; }
    var p=null;
    try{ p = win.parent; }catch(e2){ return null; }
    if(!p || p===win) break;
    win = p;
  }
  return null;
}
function detectLms(){
  if(lms.api) return true;
  var cands=[];
  try{ cands.push(window); }catch(e){}
  try{ if(window.opener) cands.push(window.opener); }catch(e){}
  for(var i=0;i<cands.length;i++){
    var a = findIn(cands[i],"API_1484_11");
    if(a){ lms.api=a; lms.kind="2004"; return true; }
    a = findIn(cands[i],"API");
    if(a){ lms.api=a; lms.kind="1.2"; return true; }
  }
  return false;
}
function lmsInit(){
  if(!lms.api || lms.inited) return;
  try{
    var r = lms.kind==="2004" ? lms.api.Initialize("") : lms.api.LMSInitialize("");
    lms.inited = (String(r)!=="false");
  }catch(e){ lms.inited=true; }
}
function lmsGet(k){ try{ return String(lms.kind==="2004"?lms.api.GetValue(k):lms.api.LMSGetValue(k)); }catch(e){ return ""; } }
function lmsSet(k,v){ try{ var r = lms.kind==="2004"?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v); return String(r)!=="false"; }catch(e){ return false; } }
function lmsCommit(){ try{ var r = lms.kind==="2004"?lms.api.Commit(""):lms.api.LMSCommit(""); return String(r)!=="false"; }catch(e){ return false; } }

function compact(){
  return JSON.stringify({
    v:1, s:state.screen, f:state.fr?1:0, sel:state.sel, k:state.checked?1:0, tr:state.tray, as:state.assign,
    g:state.greet, d:state.details, sg:state.sign, m:state.mode, t:state.text, se:state.sent?1:0, st:state.sentText,
    sp:state.spoke?1:0, cr:state.checkRun?1:0, dt:state.det, tk:state.ticks, at:state.attempts, pf:state.prefilled?1:0
  });
}

function saveProgress(){

  try{ data = compact(); }catch(e){ return; }
  if(data.length>3800){ return; }
  if(detectLms()){
    lmsInit();
    lmsSet("cmi.suspend_data", data);
    lmsCommit();
  } else {
    try{ localStorage.setItem(KEY,data); }catch(e){}
  }

function loadProgress(){
  var raw=null;
  if(detectLms()){
    lmsInit();
    var s = lmsGet("cmi.suspend_data");
    if(s && s.charAt(0)==="{") raw=s;
  }
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(!raw || raw.length>6000) return;
  var o;
  try{ o=JSON.parse(raw); }catch(e){ return; }
  if(!o || o.v!==1 || typeof o!=="object") return;
  function ids(a){ return Array.isArray(a)?a.filter(function(x){return PH[x];}):[]; }
  function str(x,max){ return typeof x==="string"?x.slice(0,max):""; }
  state.fr = o.f===1;
  state.sel = ids(o.sel).slice(0,4);
  state.checked = o.k===1;
  state.tray = ids(o.tr).slice(0,4);
  state.assign = {};
  if(o.as && typeof o.as==="object"){ state.tray.forEach(function(id){ var v=o.as[id]; if(v==="open"||v==="info"||v==="close") state.assign[id]=v; }); }
  state.greet = GREETS.some(function(g){return g.en===o.g;})?o.g:"";
  state.details = Array.isArray(o.d)?o.d.filter(function(x){return DETAILS.some(function(d){return d.en===x;});}):[];
  state.sign = SIGNS.indexOf(o.sg)>-1?o.sg:"";
  state.mode = o.m==="speak"?"speak":"type";
  state.text = str(o.t,MAXCH);
  state.sent = o.se===1;
  state.sentText = str(o.st,MAXCH);
  state.spoke = o.sp===1;
  state.prefilled = o.pf===1;
  state.attempts = Math.min(9,Math.max(0,parseInt(o.at,10)||0));
  state.ticks = Array.isArray(o.tk)&&o.tk.length===4?o.tk.map(Boolean):[false,false,false,false];
  state.checkRun = o.cr===1;
  state.det = (o.dt && typeof o.dt==="object")?{purpose:!!o.dt.purpose,detail:!!o.dt.detail,request:!!o.dt.request,polite:!!o.dt.polite,language:!!o.dt.language,info:!!o.dt.info,all:!!o.dt.all}:null;
  /* revalidate against current rules instead of trusting saved flags */
  if(state.checked && !selCheck(state.tray).ok){ state.checked=false; state.tray=[]; }
  if(state.text.trim() && state.sent){ state.det = state.checkRun ? detCheck(state.sentText) : null; }
  var want = Math.min(6,Math.max(1,parseInt(o.s,10)||1));
  function allowed(n){
    if(n<=2) return true;
    if(n===3) return selOk();
    if(n===4) return planOk();
    if(n===5) return hasProduction();
    return checkComplete();
  }
  while(want>1 && !allowed(want)) want--;
  state.screen = want;
}

    if(detectLms()){
      lmsInit();
      var key = lms.kind==="2004" ? "cmi.completion_status" : "cmi.core.lesson_status";
      var st = lmsGet(key).toLowerCase();
      var already = (st==="completed" || st==="passed");
      if(lms.kind==="2004"){ var ss=lmsGet("cmi.success_status").toLowerCase(); if(ss==="passed") already=true; }
      if(!already){
        lmsSet(key,"completed");
        lmsCommit();
        var back = lmsGet(key).toLowerCase();
        if(back!=="completed" && back!=="passed"){ lmsSet(key,"completed"); lmsCommit(); }
      }
    } else {
      try{ localStorage.setItem(DONEKEY,"1"); }catch(e){}
    }
  }catch(e){}
  try{ console.log("W15D2 Communication Mission completed"); }catch(e){}
}

/* ---------- Recording ---------- */
function pickMime(){
  if(!window.MediaRecorder || typeof MediaRecorder.isTypeSupported!=="function") return "";
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return "";
}
function recSupported(){ return window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder; }
function stopTracks(){ if(rec.stream){ try{ rec.stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} rec.stream=null; } }
function revokeUrl(){ if(rec.url){ try{ URL.revokeObjectURL(rec.url); }catch(e){} rec.url=null; } }
function stopPlayback(){ try{ player.pause(); }catch(e){} rec.playing=false; }
function clearRecording(){
  stopPlayback();
  try{ player.removeAttribute("src"); player.load(); }catch(e){}
  revokeUrl(); rec.chunks=[]; run.recorded=false; rec.state="idle"; rec.err="";
}
function discardAll(){
  rec.session++;
  try{ if(rec.recorder && rec.recorder.state!=="inactive") rec.recorder.stop(); }catch(e){}
  rec.recorder=null; stopTracks(); clearRecording();
}
function mapErr(err){
  var n = err&&err.name?err.name:"";
  if(n==="NotAllowedError"||n==="PermissionDeniedError"||n==="SecurityError") return "denied";
  if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") return "nodevice";
  return "failure";
}
function startRec(){
  if(rec.state==="requesting"||rec.state==="recording"||rec.state==="stopping") return;
  if(!recSupported()){ rec.state="error"; rec.err="unsupported"; updateRecUI(); return; }
  clearRecording(); invalidate();
  rec.state="requesting"; updateRecUI();
  var ses=++rec.session;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(ses!==rec.session){ stream.getTracks().forEach(function(t){t.stop();}); return; }
    rec.stream=stream; rec.chunks=[];
    var mt=pickMime(), r;
    try{ r = mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream); }
    catch(e){ stopTracks(); rec.state="error"; rec.err="failure"; updateRecUI(); return; }
    rec.recorder=r;
    r.ondataavailable=function(e){ if(e.data && e.data.size>0) rec.chunks.push(e.data); };
    r.onstop=function(){
      stopTracks();
      if(ses!==rec.session) return;
      var blob = new Blob(rec.chunks,{type:r.mimeType||mt||"audio/mp4"});
      rec.chunks=[]; rec.recorder=null;
      if(!blob.size){ rec.state="error"; rec.err="empty"; run.recorded=false; }
      else { revokeUrl(); rec.url=URL.createObjectURL(blob); rec.state="ready"; run.recorded=true; }
      invalidate(); updateRecUI(); updateNav();
    };
    r.onerror=function(){
      stopTracks(); if(ses!==rec.session) return;
      rec.state="error"; rec.err="failure"; run.recorded=false; updateRecUI(); updateNav();
    };
    try{ r.start(); }catch(e2){ stopTracks(); rec.state="error"; rec.err="failure"; updateRecUI(); return; }
    rec.state="recording"; updateRecUI(); updateNav();
  }).catch(function(err){
    if(ses!==rec.session) return;
    rec.state="error"; rec.err=mapErr(err); updateRecUI();
  });
}
function stopRec(){
  if(rec.state!=="recording" || !rec.recorder) return;
  rec.state="stopping"; updateRecUI();
  try{ rec.recorder.stop(); }catch(e){ stopTracks(); rec.state="error"; rec.err="failure"; updateRecUI(); }
}
function hearRec(){
  if(rec.state!=="ready" || !rec.url) return;
  if(rec.playing){ stopPlayback(); updateRecUI(); return; }
  try{
    player.src=rec.url;
    var p=player.play();
    rec.playing=true; updateRecUI();
    if(p && p.catch) p.catch(function(){ rec.playing=false; updateRecUI(); });
  }catch(e){ rec.playing=false; updateRecUI(); }
}
player.onended=function(){ rec.playing=false; updateRecUI(); };
player.onpause=function(){ rec.playing=false; updateRecUI(); };
function tryAgainRec(){ discardAll(); invalidate(); updateRecUI(); updateNav(); }

function recMsgKey(){
  if(rec.state==="error") return rec.err||"failure";
  if(rec.state==="ready" && rec.playing) return "playing";
  if(rec.state==="idle" && state.spoke) return "spoke";
  if(rec.state==="idle" && !recSupported()) return "unsupported";
  return rec.state;
}
var lastRecKey="";
function updateRecUI(){
  var h5=document.querySelector('[data-act="hear5"]');
  if(h5) h5.innerHTML = rec.playing ? T("Stop listening","Arrêter l'écoute") : T("Hear my recording","Écouter mon enregistrement");
  var b=document.getElementById("recBtn"); if(!b) return;
  var st=rec.state, busy=(st==="requesting"||st==="recording"||st==="stopping");
  var unsupported = !recSupported();
  b.disabled = busy || unsupported;
  document.getElementById("stopBtn").disabled = st!=="recording";
  var h=document.getElementById("hearBtn");
  h.disabled = !(st==="ready" && rec.url && run.recorded);
  h.innerHTML = rec.playing ? T("Stop listening","Arrêter l'écoute") : T("Hear my recording","Écouter mon enregistrement");
  document.getElementById("againBtn").disabled = busy || (st==="idle" && !run.recorded);
  document.getElementById("spokeBtn").setAttribute("aria-pressed", state.spoke?"true":"false");
  var key = recMsgKey();
  var m = REC_MSG[key]||REC_MSG.failure;
  var el=document.getElementById("recStatus");
  el.innerHTML = '<span class="sdot'+(key==="ready"||key==="spoke"?" g":"")+'" aria-hidden="true"></span>'+T(m[0],m[1]);
  if(key!==lastRecKey){ lastRecKey=key; announce(m[0]); }
}

  else if(!r.request) next=["Add what you need (for example: Could you check the delivery, please?)","Ajoutez ce dont vous avez besoin (par exemple : Could you check the delivery, please?)"];

    if(state.checkRun && state.det){
      var r=state.det, f=fbText(r);
      var rows=[[r.purpose,"Problem","Problème"],[r.detail,"Time or detail","Moment ou détail"],[r.request,"Request for help","Demande d'aide"],[r.polite,"Polite ending","Fin polie"],[r.language,"Lesson language","Vocabulaire du cours"]];
      h+='<div class="fb '+(r.all?"ok":"help")+'" role="status" aria-live="polite"><span class="sdot'+(r.all?" g":"")+'" aria-hidden="true"></span>'+T(f.lead[0],f.lead[1])+
        (f.ok?'<br>'+T(f.ok[0],f.ok[1]):"")+(f.next?'<br>'+T("Next step: ","Prochaine étape : ")+T(f.next[0],f.next[1]):"")+'</div>';
      h+='<ul class="found" style="margin:10px 0 0;padding-left:20px">'+rows.map(function(x){ return '<li>'+(x[0]?T("Found: ","Trouvé : "):T("Add: ","À ajouter : "))+T(x[1],x[2])+'</li>'; }).join("")+'</ul>';
      h+='<p class="count">'+T("This check looks for key ideas. Other clear messages can be correct too.","Cette vérification cherche des idées clés. D'autres messages clairs peuvent aussi être corrects.")+'</p>';
    }
    if(state.attempts>=2){
      h+='<div class="card yellow" style="margin:10px 0 0"><h3>'+T("Phrase bank","Banque de phrases")+'</h3><ul style="margin:0;padding-left:20px">'+
        byCanon(state.tray).map(function(id){ return '<li>'+T(PH[id].en,PH[id].fr)+'</li>'; }).join("")+'</ul>';
      if(state.attempts>=3){
        h+='<button type="button" class="btn sec sm" data-act="example5" aria-expanded="'+state.showExample5+'" style="margin-top:8px">'+T("Show example","Voir un exemple")+'</button>';
        if(state.showExample5){ h+='<div class="msgbox" style="margin-top:8px">Hello, Sara. My order hasn\'t arrived. It was due yesterday. Could you check the delivery, please? Thank you for your help.</div>'; }
      }
      h+='</div>';
    }
    h+='</div>';
  }
  if(!hasProduction()){ h+='<div class="fb help" role="status"><span class="sdot" aria-hidden="true"></span>'+T("Write your message to continue.","Écrivez votre message pour continuer.")+'</div>'; }
  h+='<div class="card white checks"><fieldset><legend>'+T("My message","Mon message")+'</legend>'+
    CHECKS.map(function(c,i){ return '<label><input type="checkbox" data-tick="'+i+'"'+(state.ticks[i]?" checked":"")+'><span>'+T(c.en,c.fr)+'<span class="ex">'+esc(c.ex)+'</span></span></label>'; }).join("")+
    '</fieldset></div>';
  return h;
}

function s6(){
  return '<div class="card green"><div class="hero"><img src="'+IMG.delivery+'" alt="A customer receiving a parcel from a delivery worker."><div class="txt">'+
    '<h2 id="hd" tabindex="-1">'+T("Communication Mission complete.","Mission de communication terminée.")+'</h2>'+
    '<p class="lead">'+T("You communicated about explaining a problem.","Vous avez communiqué pour expliquer un problème.")+'</p>'+
    '<p style="margin:0">'+T("Next, you will review, improve and retry.","Ensuite, vous allez revoir, améliorer et réessayer.")+'</p></div></div></div>';
}

/* ---------- Render / nav ---------- */
function updateCounters(){
  var t=document.getElementById("msgText"), c=document.getElementById("cnt");
  if(t&&c) c.textContent=t.value.length+" / "+MAXCH+(state.fr?" caractères":" characters");
  var t5=document.getElementById("msgText5"), c5=document.getElementById("cnt5");
  if(t5&&c5) c5.textContent=t5.value.length+" / "+MAXCH+(state.fr?" caractères":" characters");
}
function updateNav(){
  var S=state.screen, ids=["continueBtn","checkBtn","retryBtn","reviewBtn","finishBtn","doneBtn"], b={};
  ids.forEach(function(i){ b[i]=document.getElementById(i); b[i].hidden=true; });
  if(S===1){ b.continueBtn.hidden=false; btnLabel(b.continueBtn,"Continue","Continuer"); b.continueBtn.disabled=false; }
  if(S===2){
    if(!state.checked){ b.checkBtn.hidden=false; btnLabel(b.checkBtn,"Check","Vérifier"); b.checkBtn.disabled=false; }
    b.retryBtn.hidden=false; btnLabel(b.retryBtn,"Try again","Réessayer");
    b.continueBtn.hidden=false; btnLabel(b.continueBtn,"Continue","Continuer"); b.continueBtn.disabled=!state.checked;
  }
  if(S===3){ b.continueBtn.hidden=false; btnLabel(b.continueBtn,"Continue","Continuer"); b.continueBtn.disabled=!planOk(); }
  if(S===4){
    b.reviewBtn.hidden=false; btnLabel(b.reviewBtn,"Review my message","Relire mon message");
    var busy=(rec.state==="requesting"||rec.state==="recording"||rec.state==="stopping");
    b.reviewBtn.disabled = busy || !hasProduction();
  }
  if(S===5){
    b.retryBtn.hidden=false; btnLabel(b.retryBtn,"Try again","Réessayer");
    b.finishBtn.hidden=false; btnLabel(b.finishBtn,"Finish mission","Terminer la mission"); b.finishBtn.disabled=!checkComplete();
  }
  if(S===6){
    b.retryBtn.hidden=false; btnLabel(b.retryBtn,"Try again","Réessayer");
    b.doneBtn.hidden=false;
    if(run.doneShown){ btnLabel(b.doneBtn,"Done ✓","Terminé ✓"); b.doneBtn.disabled=true; }
    else { btnLabel(b.doneBtn,"Done","Terminé"); b.doneBtn.disabled=false; }
  } else { doneBtn.disabled=true; }
  var fb=document.getElementById("frBtn");
  fb.textContent = state.fr?"Français : on":"Français : off";
  fb.setAttribute("aria-pressed", state.fr?"true":"false");
}
var SCREENS=[null,s1,s2,s3,s4,s5,s6];
function render(opts){
  opts=opts||{};
  var S=state.screen;
  sc.innerHTML = SCREENS[S]();
  document.getElementById("progressLabel").innerHTML = state.fr ? S+" of 6 <span class=\"fr\" lang=\"fr\" style=\"display:inline;margin-left:4px\">"+S+" sur 6</span>" : S+" of 6";
  var dots=document.getElementById("dots"); dots.innerHTML="";
  for(var i=1;i<=6;i++){ var d=document.createElement("div"); d.className="dot"+(i<S?" done":"")+(i===S?" now":""); dots.appendChild(d); }
  updateNav(); updateCounters();
  if(S===4 && state.mode==="speak"){ lastRecKey=""; updateRecUI(); }
  if(opts.focus){ var el=sc.querySelector(opts.focus); if(el) el.focus(); }
  else if(opts.heading){ var hd=document.getElementById("hd"); if(hd) hd.focus(); window.scrollTo(0,0); }
}
function go(n){
  if(state.screen===4 && n!==4){ /* leaving: nothing is recording because Review is disabled while busy */ }
  state.screen=n;
  if(n===4 && !state.prefilled){ state.prefilled=true; if(!state.text.trim()){ state.text=buildFromPlan().slice(0,MAXCH); } }
  render({heading:true}); scheduleSave();
}

/* ---------- Events ---------- */
document.getElementById("frBtn").addEventListener("click",function(){
  state.fr=!state.fr; var t=document.getElementById("msgText"); if(t) state.text=t.value;
  render(); scheduleSave(); announce(state.fr?"French translation on":"French translation off");
});
function resetAll(){
  discardAll();
  var fr=state.fr;
  state={screen:1,fr:fr,sel:[],checked:false,tray:[],assign:{},greet:"",details:[],sign:"",mode:"type",text:"",sent:false,sentText:"",spoke:false,prefilled:false,checkRun:false,det:null,ticks:[false,false,false,false],attempts:0,showExample:false,showExample5:false};
  run.order=shuffle(CANON); run.flags=[]; run.fb=null; run.editing=false; run.recorded=false; run.doneShown=false;
  clearProgress(); render({heading:true}); announce("Starting again.");
}
function doCheck2(){
  var r=selCheck(state.sel);
  if(r.ok){
    state.checked=true; state.tray=state.sel.slice(); run.flags=[];
    run.fb={ok:true,en:"Good choices. These phrases are in your phrase tray.",fr:"Bons choix. Ces phrases sont dans votre plateau de phrases."};
  } else if(r.type==="few"){ run.flags=[]; run.fb={ok:false,en:"Choose three or four phrases.",fr:"Choisissez trois ou quatre phrases."}; }
  else if(r.type==="bad"){ run.flags=r.bad; run.fb={ok:false,en:"Look again. One phrase does not help with this mission.",fr:"Regardez encore. Une phrase n'aide pas pour cette mission."}; }
  else { run.flags=[]; run.fb={ok:false,en:"Include a phrase that explains the problem.",fr:"Choisissez une phrase qui explique le problème."}; }
  render({focus:"#s2fb"}); announce(run.fb.en); scheduleSave();
}

document.getElementById("continueBtn").addEventListener("click",function(){
  var S=state.screen;
  if(S===1) go(2);
  else if(S===2 && state.checked) go(3);
  else if(S===3 && planOk()) go(4);
});
document.getElementById("checkBtn").addEventListener("click",function(){ if(state.screen===2) doCheck2(); });
document.getElementById("retryBtn").addEventListener("click",function(){
  var S=state.screen;
  if(S===2){
    state.sel=[]; state.checked=false; state.tray=[]; state.assign={}; state.greet=""; state.details=[]; state.sign="";
    run.order=shuffle(CANON); run.flags=[]; run.fb=null; render({heading:true}); scheduleSave();
  } else if(S===5){
    invalidate(); state.attempts=0; state.showExample5=false; run.editing=false; render({heading:true}); scheduleSave();
  } else if(S===6){ resetAll(); }
});
document.getElementById("reviewBtn").addEventListener("click",function(){ if(hasProduction()) go(5); });
document.getElementById("finishBtn").addEventListener("click",function(){ if(checkComplete()) go(6); });
doneBtn.addEventListener("click",function(){
  if(state.screen!==6 || doneBtn.disabled) return;
  activityCompleted();
  run.doneShown=true;
  updateNav();
  announce("Done");
  var hd=document.getElementById("hd"); if(hd) hd.focus();
  scheduleSave();
});

sc.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("[data-sel]")){
    var id=t.getAttribute("data-sel"), i=state.sel.indexOf(id);
    if(t.checked){
      if(state.sel.length>=4){ t.checked=false; run.fb={ok:false,en:"You can choose up to four phrases. Remove one first.",fr:"Vous pouvez choisir jusqu'à quatre phrases. Retirez-en une d'abord."}; run.flags=[]; render({focus:'[data-sel="'+id+'"]'}); announce(run.fb.en); return; }
      if(i<0) state.sel.push(id);
    } else if(i>-1){ state.sel.splice(i,1); }
    run.flags=[]; run.fb=null; render({focus:'[data-sel="'+id+'"]'}); scheduleSave();
  } else if(t.matches("[data-as]")){
    var pid=t.getAttribute("data-as"); if(t.value) state.assign[pid]=t.value; else delete state.assign[pid];
    render({focus:'[data-as="'+pid+'"]'}); scheduleSave();
  } else if(t.matches("[data-tick]")){
    state.ticks[parseInt(t.getAttribute("data-tick"),10)]=t.checked; updateNav(); scheduleSave();
  }
});
sc.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="msgText" || t.id==="msgText5"){
    state.text=t.value;
    if(t.id==="msgText"){ if(state.sent && state.sentText!==t.value) state.sent=false; }
    else if(state.sent){ state.sentText=t.value; }
    invalidate(); updateCounters(); updateNav(); scheduleSave();
    if(t.id==="msgText5"){ var v=document.getElementById("msgView"); if(v) v.textContent=t.value; }
  }
});
sc.addEventListener("blur",function(e){
  var t=e.target;
  if(t && t.id==="msgText"){ var h=document.getElementById("hint4"); if(h && t.value.length>=MAXCH-20) h.textContent=(t.value.length>=MAXCH?"Your message is full.":"You are near the limit.")+(state.fr?" / "+(t.value.length>=MAXCH?"Votre message est plein.":"Vous approchez de la limite."):""); }
},true);
sc.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t || !sc.contains(t)) return;
  var S=state.screen;
  if(t.hasAttribute("data-greet")){ var g=t.getAttribute("data-greet"); state.greet = state.greet===g?"":g; render({focus:'[data-greet="'+g+'"]'}); scheduleSave(); return; }
  if(t.hasAttribute("data-detail")){ var d=DETAILS[parseInt(t.getAttribute("data-detail"),10)].en, k=state.details.indexOf(d); if(k>-1) state.details.splice(k,1); else state.details.push(d); render({focus:'[data-detail="'+t.getAttribute("data-detail")+'"]'}); scheduleSave(); return; }
  if(t.hasAttribute("data-sign")){ var s=t.getAttribute("data-sign"); state.sign = state.sign===s?"":s; render({focus:'[data-sign="'+s+'"]'}); scheduleSave(); return; }
  if(t.hasAttribute("data-mode")){
    var tx=document.getElementById("msgText"); if(tx) state.text=tx.value;
    state.mode=t.getAttribute("data-mode"); render({focus:'[data-mode="'+state.mode+'"]'}); scheduleSave(); return;
  }
  if(t.hasAttribute("data-ins")){
    var box=document.getElementById("msgText"); var cur=box.value, add=t.getAttribute("data-ins");
    var next=cur+(cur&&!/\s$/.test(cur)?" ":"")+add;
    var h=document.getElementById("hint4");
    if(next.length>MAXCH){ h.textContent=state.fr?"Votre message est plein. Raccourcissez-le d'abord. / Your message is full. Shorten it first.":"Your message is full. Shorten it first."; return; }
    h.textContent="";
    box.value=next; state.text=next; if(state.sent && state.sentText!==next) state.sent=false;
    invalidate(); updateCounters(); updateNav(); box.focus(); scheduleSave(); return;
  }
  var a=t.getAttribute("data-act"); if(!a) return;
  if(a==="example3"){ state.showExample=!state.showExample; render({focus:'[data-act="example3"]'}); }
  else if(a==="example5"){ state.showExample5=!state.showExample5; render({focus:'[data-act="example5"]'}); }
  else if(a==="useplan"){
    var b2=document.getElementById("msgText"), more=buildFromPlan();
    var h2=document.getElementById("hint4");
    if(!more){ h2.textContent=state.fr?"Votre plan est déjà dans le message. / Your plan is already in your message.":"Your plan is already in your message."; return; }
    var nx=b2.value+(b2.value&&!/\s$/.test(b2.value)?" ":"")+more;
    if(nx.length>MAXCH){ h2.textContent=state.fr?"Votre message est trop long. Raccourcissez-le. / Your message is too long. Shorten it.":"Your message is too long. Shorten it."; return; }
    h2.textContent=""; b2.value=nx; state.text=nx; if(state.sent && state.sentText!==nx) state.sent=false;
    invalidate(); updateCounters(); updateNav(); b2.focus(); scheduleSave();
  }
  else if(a==="send"){
    var bx=document.getElementById("msgText"), val=bx.value; state.text=val;
    if(!val.trim()){ document.getElementById("hint4").textContent=state.fr?"Écrivez d'abord votre message. / Write your message first.":"Write your message first."; bx.focus(); return; }
    state.sent=true; state.sentText=val; invalidate(); render({focus:'[data-act="send"]'}); announce("Message sent. Sara says: Thank you. I'll check the delivery for you."); scheduleSave();
  }
  else if(a==="rec") startRec();
  else if(a==="stop") stopRec();
  else if(a==="hear") hearRec();
  else if(a==="again") tryAgainRec();
  else if(a==="spoke"){ state.spoke=!state.spoke; invalidate(); updateRecUI(); updateNav(); scheduleSave(); }
  else if(a==="edit5"){ run.editing=!run.editing; render({focus:'[data-act="edit5"]'}); }
  else if(a==="hear5"){ hearRec(); render({focus:'[data-act="hear5"]'}); }
  else if(a==="runcheck"){
    state.det=detCheck(state.sentText); state.checkRun=true; if(!state.det.all) state.attempts++;
    render({focus:'[data-act="runcheck"]'}); announce(fbText(state.det).lead[0]); scheduleSave();
  }
});

window.addEventListener("pagehide",function(){ discardAll(); clearTimeout(saveTimer); saveProgress(); });

/* ---------- Init ---------- */
run.order=shuffle(CANON);
loadProgress();
render({heading:false});
})();
</script>
</body>
</html>
