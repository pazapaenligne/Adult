<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Mission - Final practical assessment</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF8E1;
  --muted:#55564f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Open Sans",Arial,sans-serif;background:#fff;color:var(--pazapa-grey-dark);line-height:1.5;font-size:1rem;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 8px 0;line-height:1.25;}
h2{font-size:1.4rem;}
h3{font-size:1.05rem;}
p{margin:0 0 10px 0;}
.app{max-width:720px;margin:0 auto;padding:14px 16px 48px 16px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 12px 0;border-bottom:4px solid var(--pazapa-blue);}
.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:.98rem;}
.progress{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px 0;}
.prog-text{font-size:.92rem;color:var(--muted);}
.dots{display:flex;gap:6px;}
.dot-p{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
.dot-p.done{background:var(--pazapa-blue);}
.dot-p.cur{background:var(--pazapa-yellow);}
.screen{outline:none;}
.screen[hidden]{display:none;}
.panel{background:var(--blue-tint);border-radius:16px;padding:18px;margin-bottom:16px;}
.panel.green{background:var(--green-tint);}
.panel.yellow{background:var(--yellow-tint);}
.panel.white{background:#fff;border:2px solid var(--pazapa-grey-light);}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:14px;}
.hero img{width:112px;height:112px;object-fit:contain;border-radius:14px;background:#FFF8EE;flex:none;}
.hero .kicker{font-size:.9rem;color:var(--muted);margin:0 0 2px 0;}
.lead{font-size:1.05rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0;}
.info{background:#fff;border:2px solid var(--pazapa-blue);border-radius:14px;padding:12px 14px;}
.info .lab{font-weight:800;font-size:.88rem;color:var(--muted);margin-bottom:2px;}
.goal{background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:14px;padding:14px 16px;margin:12px 0;font-weight:600;}
.tip{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:10px;padding:10px 14px;margin:12px 0;}
.fr{display:block;font-style:italic;font-weight:400;font-size:.88em;color:#3d3e3a;}
.btn{font-family:inherit;font-size:1rem;font-weight:700;min-height:48px;min-width:48px;padding:10px 20px;border-radius:999px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;text-align:center;}
.btn .fr{font-weight:400;font-size:.8em;}
.btn.primary{background:var(--pazapa-blue);}
.btn.help{background:var(--pazapa-yellow);border-color:var(--pazapa-yellow);}
.btn.small{padding:8px 14px;font-size:.95rem;}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6c66;cursor:not-allowed;}
.btn{position:relative;}
.btn[aria-pressed="true"]{background:var(--green-tint);border-color:var(--pazapa-green);border-width:3px;padding-left:36px;}
.btn[aria-pressed="true"]::before{content:"\2713";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:800;}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:center;}
.btn-row .push{margin-left:auto;}
.card-btn{font-family:inherit;font-size:1rem;text-align:left;width:100%;min-height:56px;padding:12px 14px;border-radius:12px;border:2px solid var(--pazapa-blue);background:#fff;color:var(--pazapa-grey-dark);cursor:pointer;touch-action:manipulation;display:block;}
.card-btn[aria-pressed="true"]{background:var(--blue-tint);border-width:3px;}
.card-btn[aria-pressed="true"] .ph-text::before{content:"\2713 ";font-weight:800;}
.card-btn.good{background:var(--green-tint);border-color:var(--pazapa-green);}
.card-btn.warn{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.card-btn .res{display:block;font-size:.88rem;font-weight:700;margin-top:4px;}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dotc.dg{background:var(--pazapa-green);border:2px solid #7d8a12;}
.dotc.dy{background:var(--pazapa-yellow);}
.stack{display:flex;flex-direction:column;gap:10px;margin:12px 0;}
fieldset{border:none;margin:0;padding:0;min-width:0;}
legend{font-weight:800;padding:0;margin-bottom:8px;}
.status{min-height:24px;font-weight:600;margin-top:10px;}
.chiprow{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px 0;}
.sec{background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
.sec h3{margin:0 0 4px 0;}
.sec ul{margin:0;padding-left:20px;}
.sec .empty{color:var(--muted);margin:0;}
.planrow{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
.planrow label{display:block;font-weight:700;margin-bottom:6px;}
select,textarea{font-family:inherit;font-size:1rem;color:var(--pazapa-grey-dark);background:#fff;border:2px solid var(--pazapa-blue);border-radius:10px;padding:10px;width:100%;}
select{min-height:48px;}
textarea{min-height:120px;resize:vertical;}
.count{font-size:.9rem;color:var(--muted);margin-top:4px;}
.route{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px 0;}
.route span.step{background:#fff;border:2px solid var(--pazapa-blue);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px 0;}
.modes label{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 18px;border:2px solid var(--pazapa-blue);border-radius:999px;background:#fff;font-weight:700;cursor:pointer;touch-action:manipulation;}
.modes input{width:22px;height:22px;accent-color:#1B1B1A;}
.modes input:checked + span{text-decoration:underline;}
.modes label.on{background:var(--blue-tint);border-width:3px;}
.rec{background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:14px;padding:14px;margin:10px 0;}
.rec-row{display:flex;flex-wrap:wrap;gap:10px;}
.rec-status{font-weight:600;margin:10px 0 0 0;min-height:24px;}
.msgbox{background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;margin-bottom:12px;}
.checks label{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:10px 12px;background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:12px;margin-bottom:8px;cursor:pointer;touch-action:manipulation;}
.checks input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:#1B1B1A;}
.checks .ex{display:block;font-size:.9rem;color:var(--muted);}
.parts{list-style:none;padding:0;margin:10px 0 0 0;}
.parts li{padding:6px 0;border-bottom:1px solid var(--pazapa-grey-light);}
.model{background:#fff;border:2px dashed var(--pazapa-blue);border-radius:12px;padding:12px 14px;margin-top:10px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:focus-visible{outline:3px solid #1B1B1A;outline-offset:2px;box-shadow:0 0 0 5px #fff;}
.donenote{margin-top:14px;font-weight:700;background:var(--green-tint);border:3px solid var(--pazapa-green);border-radius:12px;padding:10px 14px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
@media (max-width:420px){.hero img{width:84px;height:84px;}.btn{padding:10px 16px;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">Pazapa English Programme for Adults</span>
    <button type="button" class="btn small" id="langBtn" data-a="lang" aria-pressed="false" lang="fr">Fran&ccedil;ais</button>
  </header>
  <div class="progress">
    <div class="prog-text" id="progText"></div>
    <div class="dots" id="progDots" aria-hidden="true"></div>
  </div>

  <main id="stage">
    <section class="screen" id="s1" aria-labelledby="h1"><h2 id="h1" tabindex="-1"></h2><div class="body"></div></section>
    <section class="screen" id="s2" aria-labelledby="h2t" hidden><h2 id="h2t" tabindex="-1"></h2><div class="body"></div></section>
    <section class="screen" id="s3" aria-labelledby="h3t" hidden><h2 id="h3t" tabindex="-1"></h2><div class="body"></div></section>
    <section class="screen" id="s4" aria-labelledby="h4t" hidden><h2 id="h4t" tabindex="-1"></h2><div class="body"></div></section>
    <section class="screen" id="s5" aria-labelledby="h5t" hidden><h2 id="h5t" tabindex="-1"></h2><div class="body"></div></section>
    <section class="screen" id="s6" aria-labelledby="h6t" hidden>
      <h2 id="h6t" tabindex="-1"></h2>
      <div class="body"></div>
      <div class="btn-row">
        <button type="button" class="btn" id="retryAllBtn" data-a="tryall"></button>
        <button type="button" class="btn primary" id="doneBtn" data-a="done"></button>
      </div>
      <div class="donenote" id="doneNote" hidden></div>
    </section>
  </main>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
</div>

/* ---------- LMS (SCORM 1.2 / 2004) and local storage ---------- */
var lms={kind:null,api:null};
function findIn(w){
  var n=0;
  while(w && n<10){
    try{ if(w.API_1484_11) return {kind:"2004",api:w.API_1484_11}; }catch(e){}
    try{ if(w.API) return {kind:"1.2",api:w.API}; }catch(e){}
    var p=null; try{p=w.parent;}catch(e2){p=null;}
    if(!p || p===w) break;
    w=p; n++;
  }
  return null;
}
function detectLms(){
  if(lms.api) return true;
  var f=findIn(window);
  if(!f){ try{ if(window.opener && window.opener!==window) f=findIn(window.opener);}catch(e){} }
  if(!f) return false;
  var ok=false;
  try{
    var r=(f.kind==="2004")? f.api.Initialize("") : f.api.LMSInitialize("");
    ok=(r===true||r==="true");
    if(!ok){
      var code=(f.kind==="2004")? String(f.api.GetLastError()) : String(f.api.LMSGetLastError());
      if(code==="103"||code==="0") ok=true;
    }
  }catch(e3){ok=false;}
  if(!ok) return false;
  lms.kind=f.kind; lms.api=f.api; return true;
}
function lget(el){try{return String((lms.kind==="2004")? lms.api.GetValue(el):lms.api.LMSGetValue(el)||"");}catch(e){return "";}}
function lset(el,v){try{var r=(lms.kind==="2004")? lms.api.SetValue(el,v):lms.api.LMSSetValue(el,v); return r===true||r==="true";}catch(e){return false;}}
function lcommit(){try{var r=(lms.kind==="2004")? lms.api.Commit(""):lms.api.LMSCommit(""); return r===true||r==="true";}catch(e){return false;}}
function statusEl(){return lms.kind==="2004"?"cmi.completion_status":"cmi.core.lesson_status";}
function lmsDone(){
  var v=lget(statusEl());
  if(v==="completed"||v==="passed") return true;
  if(lms.kind==="2004" && lget("cmi.success_status")==="passed") return true;
  return false;
}
function compact(){
  return {v:1,s:S.screen,l:S.lang,sel:S.sel,ck:S.checked?1:0,pl:S.plan,ch:S.chips,tx:S.text,md:S.mode,sp:S.spoke?1:0,
          cs:S.checks.map(function(b){return b?1:0;}),at:S.attempts,bk:S.bank?1:0,mu:S.modelUsed?1:0,rv:S.rev};
}

function saveNow(){
  saveTimer=null;

        var cur=lget(statusEl());
        if(cur===""||cur==="not attempted"||cur==="unknown"||cur==="not_attempted") lset(statusEl(),"incomplete");
      }
      lcommit();
    }catch(e2){}
  }
}
function loadState(){
  var raw=null;
  if(detectLms()){ var d=lget("cmi.suspend_data"); if(d && d.length<4000) raw=d; }
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(!raw || raw.length>4000) return;
  var o; try{o=JSON.parse(raw);}catch(e2){return;}
  if(!o || o.v!==1) return;
  var ns=freshState(o.l==="fr"?"fr":"en");
  if(Array.isArray(o.sel)){ o.sel.forEach(function(id){ if(PH[id] && ns.sel.indexOf(id)===-1 && ns.sel.length<4) ns.sel.push(id); }); }
  ns.checked=(o.ck===1);
  if(o.pl && typeof o.pl==="object"){ ns.sel.forEach(function(id){ if(SECTIONS.indexOf(o.pl[id])!==-1) ns.plan[id]=o.pl[id]; }); }
  if(o.ch && typeof o.ch==="object"){ ["item","problem","solution"].forEach(function(g){ if(typeof o.ch[g]==="string" && chipById(g,o.ch[g])) ns.chips[g]=o.ch[g]; }); }
  if(typeof o.tx==="string") ns.text=o.tx.slice(0,MAXLEN);
  ns.mode=(o.md==="speak")?"speak":"type";
  ns.spoke=(o.sp===1);
  if(Array.isArray(o.cs)&&o.cs.length===4) ns.checks=o.cs.map(function(x){return x===1;});
  ns.attempts=Math.max(0,Math.min(99,parseInt(o.at,10)||0));
  ns.bank=(o.bk===1); ns.modelUsed=(o.mu===1);
  ns.rev=(typeof o.rv==="string")?o.rv.slice(0,MAXLEN):null;
  ns.screen=Math.max(1,Math.min(6,parseInt(o.s,10)||1));
  S=ns;
  /* revalidate against current requirements instead of trusting saved screen */
  if(S.screen>maxScreen()) S.screen=maxScreen();
  if(S.screen===5 && S.rev===null) S.rev=null;
}

/* ---------- Recording (local only, never stored) ---------- */
var rec={state:"idle",status:"rec_idle",stream:null,mr:null,chunks:[],url:null,player:null};
function recSupported(){return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);}
function pickMime(){
  if(!window.MediaRecorder || typeof MediaRecorder.isTypeSupported!=="function") return "";
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return "";
}
function stopTracks(){ if(rec.stream){ try{rec.stream.getTracks().forEach(function(t){t.stop();});}catch(e){} rec.stream=null; } }
function revokeUrl(){ if(rec.url){ try{URL.revokeObjectURL(rec.url);}catch(e){} rec.url=null; } }
function stopPlayback(){
  if(rec.player){ var p=rec.player; rec.player=null; p.onended=null; p.onerror=null; try{p.pause();}catch(e){} try{p.removeAttribute("src"); p.load();}catch(e2){} }
}
function recHtml(){
  return '<div class="rec" data-rec>'+
   '<div class="rec-row">'+
   '<button type="button" class="btn primary" data-ra="start">'+B("rec_btn")+'</button>'+
   '<button type="button" class="btn" data-ra="stop">'+B("stop_btn")+'</button>'+
   '<button type="button" class="btn" data-ra="hear">'+B("hear_btn")+'</button>'+
   '<button type="button" class="btn" data-ra="again">'+B("again")+'</button>'+
   '</div><p class="rec-status" data-recstatus aria-live="polite"></p></div>';
}
function updateRec(){
  var sup=recSupported();
  var st=rec.state;
  var q=document.querySelectorAll("[data-ra]");
  for(var i=0;i<q.length;i++){
    var a=q[i].getAttribute("data-ra"), dis=true;
    if(a==="start") dis=!(sup && st==="idle");
    else if(a==="stop") dis=!(st==="recording");
    else if(a==="hear") dis=!(st==="ready" && !!rec.url);
    else if(a==="again") dis=!(st==="ready");
    q[i].disabled=dis;
  }
  var s=document.querySelectorAll("[data-recstatus]");
  var key=(!sup && st==="idle")? "rec_unsup" : rec.status;
  for(var j=0;j<s.length;j++){ s[j].innerHTML=B(key); }
}
function setRec(state,status){ rec.state=state; rec.status=status; updateRec(); }
function startRecording(){
  if(rec.state!=="idle") return;
  if(!recSupported()){ setRec("idle","rec_unsup"); return; }
  stopPlayback();
  setRec("starting","rec_asking");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(rec.state!=="starting"){ stream.getTracks().forEach(function(t){t.stop();}); return; }
    var mime=pickMime(), mr;
    try{ mr=mime? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(e){ stream.getTracks().forEach(function(t){t.stop();}); setRec("idle","rec_fail"); return; }
    rec.stream=stream; rec.mr=mr; rec.chunks=[];
    mr.ondataavailable=function(ev){ if(ev.data && ev.data.size>0) rec.chunks.push(ev.data); };
    mr.onstop=function(){
      stopTracks();
      if(rec.mr!==mr) return;
      var chunks=rec.chunks; rec.chunks=[]; rec.mr=null;
      var blob=new Blob(chunks,{type:mr.mimeType||mime||"audio/mp4"});
      revokeUrl();
      if(!blob.size){ session.recorded=false; setRec("idle","rec_empty"); onProducedChange(); return; }
      rec.url=URL.createObjectURL(blob);
      session.recorded=true;
      setRec("ready","rec_ready");
      onProducedChange();
    };
    mr.onerror=function(){
      stopTracks(); rec.mr=null; rec.chunks=[]; revokeUrl(); session.recorded=false;
      setRec("idle","rec_fail"); onProducedChange();
    };
    try{ mr.start(); }catch(e2){ stopTracks(); rec.mr=null; setRec("idle","rec_fail"); return; }
    setRec("recording","rec_recording");
    announce(Tt("rec_recording"));
  }).catch(function(err){
    var n=err&&err.name?err.name:"";
    var key="rec_fail";
    if(n==="NotAllowedError"||n==="PermissionDeniedError"||n==="SecurityError") key="rec_denied";
    else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError") key="rec_nodev";
    else if(n==="NotReadableError"||n==="TrackStartError"||n==="AbortError") key="rec_busy";
    else if(n==="TypeError") key="rec_unsup";
    if(rec.state==="starting") setRec("idle",key);
  });
}
function stopRecording(){
  if(rec.state!=="recording" || !rec.mr) return;
  rec.state="stopping";
  try{ if(rec.mr.state!=="inactive") rec.mr.stop(); }catch(e){ stopTracks(); setRec("idle","rec_fail"); return; }
  updateRec();
}
function hearRecording(){
  if(rec.state!=="ready" || !rec.url) return;
  stopPlayback();
  var p=new Audio(rec.url);
  rec.player=p;
  p.onended=function(){ if(rec.player===p){ rec.player=null; if(rec.state==="playing") setRec("ready","rec_ready"); } };
  p.onerror=function(){ if(rec.player===p){ rec.player=null; setRec("ready","rec_ready"); } };
  setRec("playing","rec_playing");
  var pr=p.play();
  if(pr && pr.catch){ pr.catch(function(){ if(rec.player===p){ rec.player=null; setRec("ready","rec_ready"); } }); }
}
function resetRecording(statusKey){
  stopPlayback();
  if(rec.mr){ var m=rec.mr; rec.mr=null; try{ if(m.state!=="inactive") m.stop(); }catch(e){} }
  stopTracks(); revokeUrl(); rec.chunks=[];
  session.recorded=false;
  rec.state="idle"; rec.status=statusKey||"rec_idle";
}

  var chipGroups=["item","problem","solution"].map(function(g){
    var gk={item:"g_item",problem:"g_problem",solution:"g_solution"}[g];
    return '<div><div class="lab" style="font-weight:800;">'+B(gk)+'</div><div class="chiprow">'+CHIPS[g].map(function(c){
      var on=S.chips[g]===c.id;
      return '<button type="button" class="btn small" data-a="chip" data-g="'+g+'" data-v="'+c.id+'" aria-pressed="'+(on?"true":"false")+'"><span lang="en-GB">'+esc(c.en)+'</span>'+(S.lang==="fr"?'<span class="fr" lang="fr">'+esc(c.fr)+'</span>':'')+'</button>';
    }).join("")+'</div></div>';
  }).join("");
  var ex=session.exampleShown?
    '<div class="model" id="exBox"><h3>'+B("ex_title")+'</h3><p><strong>'+B("part_open")+':</strong> <span lang="en-GB">'+esc(PH.p1.en)+'</span></p><p><strong>'+B("part_req")+':</strong> <span lang="en-GB">'+esc(PH.p2.en+" "+PH.p3.en)+'</span></p><p><strong>'+B("part_close")+':</strong> <span lang="en-GB">'+esc(PH.p4.en)+'</span></p></div>':"";
  $("s3").querySelector(".body").innerHTML=
   '<div class="panel">'+heroHtml("s3",null,"s3_i")+
   rows+secs+
   '<fieldset><legend>'+B("details_leg")+'</legend>'+chipGroups+'</fieldset>'+
   '<div class="btn-row">'+btn("ex","show_ex","help",'aria-expanded="'+(session.exampleShown?"true":"false")+'"').replace(B("show_ex"),B(session.exampleShown?"hide_ex":"show_ex"))+'</div>'+ex+
   '<p class="status" id="st3" aria-live="polite"></p>'+
   '<div class="btn-row">'+btn("go4","cont","primary",'id="cont3Btn"'+(planReady()?"":" disabled"))+'</div></div>';
  updateS3Status();
}
function updateS3Status(){
  var k=$("cont3Btn"); if(k) k.disabled=!planReady();
  var st=$("st3"); if(st) st.innerHTML=planReady()?"":B("plan_need");
}

function insertButtons(){
  var tray=S.sel.map(function(id){
    return '<button type="button" class="btn small" data-a="ins" data-t="'+esc(PH[id].en)+'"><span lang="en-GB">'+esc(PH[id].en)+'</span>'+(S.lang==="fr"?'<span class="fr" lang="fr">'+esc(PH[id].fr)+'</span>':'')+'</button>';
  }).join("");
  var starters=STARTERS.map(function(s){return '<button type="button" class="btn small" data-a="ins" data-t="'+esc(s.ins)+'"><span lang="en-GB">'+esc(s.en)+'</span></button>';}).join("");
  var det=[];
  ["item","problem","solution"].forEach(function(g){
    var list=S.chips[g]? [chipById(g,S.chips[g])] : CHIPS[g];
    list.forEach(function(c){ if(c) det.push('<button type="button" class="btn small" data-a="ins" data-t="'+esc(c.ins)+'"><span lang="en-GB">'+esc(c.ins)+'</span></button>'); });
  });
  return '<h3>'+B("starters")+'</h3><div class="chiprow">'+starters+'</div>'+
         '<h3>'+B("tray")+'</h3><div class="chiprow">'+tray+'</div>'+
         '<h3>'+B("details4")+'</h3><div class="chiprow">'+det.join("")+'</div>'+
         '<p class="count">'+B("insert_hint")+'</p>';
}
function planNotes(){
  return '<div class="panel white"><h3>'+B("plan_notes")+'</h3>'+SECTIONS.map(function(sec){
    var items=S.sel.filter(function(id){return S.plan[id]===sec;});
    return '<p><strong>'+B(SEC_KEY[sec])+':</strong> '+(items.length? items.map(function(id){return '<span lang="en-GB">'+esc(PH[id].en)+'</span>';}).join(" "):'-')+'</p>';
  }).join("")+'</div>';
}
function textareaHtml(id){
  return '<label for="'+id+'"><strong>'+B("msg_lbl")+'</strong></label>'+
    '<textarea id="'+id+'" data-msg maxlength="'+MAXLEN+'" lang="en-GB" aria-describedby="'+id+'_c">'+esc(S.text)+'</textarea>'+
    '<div class="count" id="'+id+'_c">'+S.text.length+' / '+MAXLEN+'</div>';
}
function render4(){
  $("h4t").innerHTML=B("s4_h");
  var typeOn=S.mode==="type";
  $("s4").querySelector(".body").innerHTML=
   '<div class="panel">'+heroHtml("s4",null,"s4_i")+
   '<div class="route"><span class="step">'+B("route1")+'</span><span class="step">'+B("route2")+'</span><span class="step">'+B("route3")+'</span></div>'+
   '<fieldset class="modes" style="display:flex;"><legend class="sr-only">'+esc(Tt("mode_leg"))+'</legend>'+
     '<label class="'+(typeOn?"on":"")+'"><input type="radio" name="mode" value="type"'+(typeOn?" checked":"")+'><span>'+B("mode_type")+'</span></label>'+
     '<label class="'+(typeOn?"":"on")+'"><input type="radio" name="mode" value="speak"'+(typeOn?"":" checked")+'><span>'+B("mode_speak")+'</span></label>'+
   '</fieldset>'+
   '<div id="typePanel"'+(typeOn?"":" hidden")+'>'+insertButtons()+textareaHtml("msg4")+'</div>'+
   '<div id="speakPanel"'+(typeOn?" hidden":"")+'>'+planNotes()+'<p>'+B("speak_i")+'</p>'+recHtml()+
     '<div class="btn-row" style="margin-top:8px;"><button type="button" class="btn" data-a="aloud" id="aloudBtn" aria-pressed="'+(S.spoke?"true":"false")+'">'+B("aloud")+'</button></div>'+
     '<p class="status" id="aloudSt" aria-live="polite">'+(S.spoke?B("spoke_on"):"")+'</p></div>'+
   '<p class="status" id="st4" aria-live="polite"></p>'+
   '<div class="btn-row">'+btn("review","review","primary",'id="reviewBtn"')+'</div></div>';
  updateRec();
  updateS4Buttons();
}
function updateS4Buttons(){
  var r=$("reviewBtn"); if(r) r.disabled=!produced();
  var st=$("st4"); if(st) st.innerHTML=produced()?"":B("review_need");
}

function feedbackHtml(){
  var a=analyse(S.text);
  var lead=(a.problem&&a.help)?"fb_lead_ok":"fb_lead_start";
  var good=a.help?"fb_s_help":(a.problem?"fb_s_prob":(a.close?"fb_s_close":"fb_s_none"));
  var next=!a.problem?"fb_n_prob":!a.help?"fb_n_help":!a.solution?"fb_n_sol":!a.close?"fb_n_close":!a.detail?"fb_n_detail":"fb_n_all";
  var rows=[["p_purpose",a.problem&&a.help],["p_info",a.detail],["p_lang",a.lesson],["p_polite",a.close]].map(function(r){
    return '<li><span class="dotc '+(r[1]?"dg":"dy")+'"></span><strong>'+B(r[0])+':</strong> '+B(r[1]?"found":"idea")+'</li>';
  }).join("");
  var bank="";
  if(S.bank){
    bank='<div class="model"><h3>'+B("bank_title")+'</h3><ul>'+USEFUL_IDS.map(function(id){return '<li>'+phText(id)+'</li>';}).join("")+'</ul></div>';
  }
  var model="";
  if(S.attempts>=3){
    model='<div class="btn-row">'+btn("model","model_btn","help").replace(B("model_btn"),B(session.modelShown?"model_hide":"model_btn"))+'</div>'+
      (session.modelShown?'<div class="model"><h3>'+B("model_title")+'</h3><p lang="en-GB">'+esc(MODEL)+'</p></div>':"");
  }
  return '<div class="panel yellow"><h3>'+B("fb_title")+'</h3><p><strong>'+B(lead)+'</strong></p><p>'+B(good)+'</p><p>'+B(next)+'</p><ul class="parts">'+rows+'</ul>'+bank+model+'</div>';
}
function render5(){
  $("h5t").innerHTML=B("s5_h");
  var typed=S.text.trim().length>0;
  var msg=typed?
    '<h3>'+B("your_msg")+'</h3><div class="msgbox" lang="en-GB">'+esc(S.text)+'</div>':
    '<h3>'+B("your_voice")+'</h3><p>'+B("voice_noted")+'</p>';
  var improveArea="";
  if(session.improving){
    if(typed || S.mode==="type"){
      improveArea='<div class="panel white">'+textareaHtml("msg5")+'<div class="btn-row">'+btn("recheck","check_again","primary",'id="recheckBtn"')+'</div></div>';
    }else{
      improveArea='<div class="panel white"><p>'+B("speak_i")+'</p>'+recHtml()+'<div class="btn-row"><button type="button" class="btn" data-a="aloud" id="aloudBtn5" aria-pressed="'+(S.spoke?"true":"false")+'">'+B("aloud")+'</button></div></div>';
    }
  }
  var ticks=[["c1","c1x"],["c2","c2x"],["c3","c3x"],["c4","c4x"]].map(function(c,i){
    return '<label><input type="checkbox" data-chk="'+i+'"'+(S.checks[i]?" checked":"")+'><span>'+B(c[0])+'<span class="ex">'+B(c[1])+'</span></span></label>';
  }).join("");
  $("s5").querySelector(".body").innerHTML=
   '<div class="panel">'+heroHtml("s5",null,"s5_i")+msg+'</div>'+
   (typed?feedbackHtml():"")+
   '<div class="panel white"><div class="checks"><fieldset><legend>'+B("s5_i")+'</legend>'+ticks+'</fieldset></div></div>'+
   (session.improving?improveArea:"")+
   '<p class="status" id="st5" aria-live="polite"></p>'+
   '<div class="btn-row">'+
     btn("improve","improve","help",'id="improveBtn" aria-expanded="'+(session.improving?"true":"false")+'"')+
     btn("finish","finish","primary",'id="finishBtn"')+
   '</div>';
  updateRec();
  updateS5Buttons();
}
function updateS5Buttons(){
  var f=$("finishBtn"); if(!f) return;
  f.disabled=!canFinish();
  var st=$("st5");
  if(st){
    if(!reviewMatches() && S.text.trim()) st.innerHTML=B("need_recheck");
    else if(!allTicked()) st.innerHTML=B("tick_all");
    else if(!produced()) st.innerHTML=B("review_need");
    else st.innerHTML="";
  }
}

function render6(){
  $("h6t").innerHTML=B("s6_h");
  $("s6").querySelector(".body").innerHTML=
   '<div class="panel green"><div class="hero"><img src="'+IMG.s6+'" alt="'+esc(ALT.s6)+'"><div><p class="lead">'+B("s6_a")+'</p><p>'+B("s6_b")+'</p></div></div></div>';
  $("retryAllBtn").innerHTML=B("again");
  doneBtn.innerHTML=B("done");
}

var RENDER={1:render1,2:render2,3:render3,4:render4,5:render5,6:render6};

function updateProgress(){
  var n=S.screen;
  $("progText").textContent=(S.lang==="fr"? "Écran "+n+" sur 6":"Screen "+n+" of 6");
  var h="";
  for(var i=1;i<=6;i++){ h+='<div class="dot-p'+(i<n?" done":"")+(i===n?" cur":"")+'"></div>'; }
  $("progDots").innerHTML=h;
}
function showScreen(focusHeading){
  for(var i=1;i<=6;i++){ $("s"+i).hidden=(i!==S.screen); }
  RENDER[S.screen]();
  updateProgress();
  doneBtn.disabled=!(S.screen===6 && canFinish());
  if(S.screen!==6){ $("doneNote").hidden=true; }
  if(focusHeading){
    var h=$("s"+S.screen).querySelector("h2");
    if(h) h.focus();
  }
  var lb=$("langBtn");
  lb.textContent=(S.lang==="fr")?"English":"Français";
  lb.setAttribute("lang",S.lang==="fr"?"en-GB":"fr");
  lb.setAttribute("aria-pressed",S.lang==="fr"?"true":"false");
  document.documentElement.setAttribute("lang",S.lang==="fr"?"fr":"en-GB");
}
function go(n){
  if(n>maxScreen()) return;
  if(rec.state==="recording") stopRecording();
  S.screen=n;
  if(n===5){ runReview(); }
  showScreen(true);
  save();
}
function runReview(){
  S.rev=S.text;
  if(S.text.trim()){
    var a=analyse(S.text);
    if(!(a.problem&&a.help&&a.solution)) S.attempts=Math.min(99,S.attempts+1);
    if(S.attempts>=2) S.bank=true;
  }
  session.improving=false; session.modelShown=false;
}
function fullReset(){
  var lang=S.lang;
  resetRecording("rec_idle");
  S=freshState(lang);
  session.order=shuffle(PH_IDS);
  session.msg2="m2_few"; session.exampleShown=false; session.modelShown=false; session.improving=false; session.recorded=false;
  showScreen(true);
  save();
}

/* ---------- Events ---------- */
document.addEventListener("click",function(e){
  var rb=e.target.closest("[data-ra]");
  if(rb && !rb.disabled){
    var ra=rb.getAttribute("data-ra");
    if(ra==="start") startRecording();
    else if(ra==="stop") stopRecording();
    else if(ra==="hear") hearRecording();
    else if(ra==="again"){ resetRecording("rec_idle"); updateRec(); onProducedChange(); }
    return;
  }
  var el=e.target.closest("[data-a]");
  if(!el || el.disabled) return;
  var a=el.getAttribute("data-a"), v=el.getAttribute("data-v");
  if(a==="lang"){
    S.lang=(S.lang==="fr")?"en":"fr";
    showScreen(false); save(); return;
  }
  if(a==="go2"){ go(2); return; }
  if(a==="ph"){
    var i=S.sel.indexOf(v);
    if(i!==-1){ S.sel.splice(i,1); }
    else{
      if(S.sel.length>=4){ session.msg2="m2_max"; $("st2").innerHTML=B("m2_max"); announce(Tt("m2_max")); return; }
      S.sel.push(v);
    }
    S.checked=false; session.msg2="m2_few";
    render2(); save();
    var again=document.querySelector('[data-a="ph"][data-v="'+v+'"]'); if(again) again.focus();
    return;
  }
  if(a==="check2"){
    var r=evalPhrases(S.sel);
    S.checked=true; session.msg2=r;
    /* keep only useful phrases in the tray; unsuitable ones stay marked until changed */
    render2(); announce(Tt(r)); save(); return;
  }
  if(a==="again2"){
    S.sel=[]; S.checked=false; S.plan={}; session.msg2="m2_few"; session.order=shuffle(PH_IDS);
    render2(); save(); return;
  }
  if(a==="go3"){
    if(S.checked && evalPhrases(S.sel)==="m2_ok"){
      /* drop plan entries for phrases no longer selected */
      Object.keys(S.plan).forEach(function(id){ if(S.sel.indexOf(id)===-1) delete S.plan[id]; });
      go(3);
    }
    return;
  }
  if(a==="chip"){
    var g=el.getAttribute("data-g");
    S.chips[g]=(S.chips[g]===v)?"":v;
    render3(); save();
    var c2=document.querySelector('[data-a="chip"][data-g="'+g+'"][data-v="'+v+'"]'); if(c2) c2.focus();
    return;
  }
  if(a==="ex"){ session.exampleShown=!session.exampleShown; render3(); var eb=document.querySelector('[data-a="ex"]'); if(eb) eb.focus(); return; }
  if(a==="go4"){ if(planReady()) go(4); return; }
  if(a==="ins"){
    var t=el.getAttribute("data-t")||"";
    var base=S.text.replace(/\s+$/,"");
    var nt=(base?base+" ":"")+t;
    if(nt.length>MAXLEN){ announce(Tt("at_limit")); var cnt=$("msg4_c"); if(cnt) cnt.innerHTML=S.text.length+" / "+MAXLEN+" - "+esc(STR.at_limit.en); return; }
    S.text=nt;
    var ta=$("msg4"); if(ta){ ta.value=S.text; $("msg4_c").textContent=S.text.length+" / "+MAXLEN; ta.focus(); try{ta.setSelectionRange(S.text.length,S.text.length);}catch(x){} }
    updateS4Buttons(); save(); return;
  }
  if(a==="aloud"){
    S.spoke=!S.spoke;
    var ab=$("aloudBtn"); if(ab){ ab.setAttribute("aria-pressed",S.spoke?"true":"false"); }
    var ab5=$("aloudBtn5"); if(ab5){ ab5.setAttribute("aria-pressed",S.spoke?"true":"false"); }
    var as=$("aloudSt"); if(as) as.innerHTML=S.spoke?B("spoke_on"):"";
    if(S.spoke) announce(Tt("spoke_on"));
    onProducedChange(); save(); return;
  }
  if(a==="review"){ if(produced()) go(5); return; }
  if(a==="improve"){
    session.improving=!session.improving;
    render5();
    var ib=$("improveBtn"); if(ib) ib.focus();
    return;
  }
  if(a==="recheck"){
    runReview(); session.improving=true; render5();
    var rc=$("recheckBtn"); if(rc) rc.focus();
    save(); return;
  }
  if(a==="model"){ session.modelShown=!session.modelShown; if(session.modelShown) S.modelUsed=true; render5(); save(); return; }
  if(a==="finish"){ if(canFinish()) go(6); return; }
  if(a==="tryall"){ fullReset(); return; }
  if(a==="done"){
    if(!(S.screen===6 && canFinish())) return;
    activityCompleted();
    var dn=$("doneNote"); dn.innerHTML=B("done_note"); dn.hidden=false;
    announce(Tt("done_note"));
    return;
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("select[data-plan]")){
    var id=t.getAttribute("data-plan");
    if(t.value) S.plan[id]=t.value; else delete S.plan[id];
    render3();
    var again=$("pl_"+id); if(again) again.focus();
    save(); return;
  }
  if(t.matches('input[name="mode"]')){
    S.mode=t.value;
    $("typePanel").hidden=(S.mode!=="type");
    $("speakPanel").hidden=(S.mode!=="speak");
    var labs=t.closest("fieldset").querySelectorAll("label");
    for(var i=0;i<labs.length;i++){ labs[i].className=labs[i].querySelector("input").checked?"on":""; }
    save(); return;
  }
  if(t.matches("input[data-chk]")){
    S.checks[parseInt(t.getAttribute("data-chk"),10)]=t.checked;
    updateS5Buttons(); save(); return;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.matches("textarea[data-msg]")){
    S.text=t.value.slice(0,MAXLEN);
    var c=$(t.id+"_c"); if(c) c.textContent=S.text.length+" / "+MAXLEN;
    if(S.text.length>=MAXLEN) announce(Tt("at_limit"));
    if(S.screen===4) updateS4Buttons();
    if(S.screen===5) updateS5Buttons();
    save();
  }
});
window.addEventListener("pagehide",function(){
  resetRecording("rec_idle");
  if(saveTimer){ clearTimeout(saveTimer); saveNow(); }
});

/* ---------- Start ---------- */
loadState();
session.order=shuffle(PH_IDS);
if(!recSupported()){ rec.status="rec_unsup"; }
if(S.screen===5 && S.rev===null){ runReview(); }
showScreen(false);
})();
</script>
</body>
</html>
