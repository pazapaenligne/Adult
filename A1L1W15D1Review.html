<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitations and arrangements — Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;--pazapa-blue-dark:#1B7E92;--pazapa-green:#C9D646;--pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;--pazapa-grey-light:#EBEBEB;--pazapa-grey-dark:#2E2E2D;
  --tint-blue:#EAF8FB;--tint-green:#F5F8DC;--tint-yellow:#FFF6D6;--white:#fff;--radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:"Open Sans",Arial,sans-serif;background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;line-height:1.25}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column}
header.app-header{padding:14px 20px 12px;border-top:8px solid var(--pazapa-blue);border-bottom:1px solid var(--pazapa-grey-light)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{height:40px;width:auto;display:block}
h1{font-size:1.2rem;margin:10px 0 10px}
.progress-wrap{display:flex;align-items:center;gap:10px}
.progress-track{flex:1;height:10px;background:var(--pazapa-grey-light);border-radius:8px;overflow:hidden}
.progress-fill{height:100%;background:var(--pazapa-blue-dark);border-radius:8px;transition:width .3s ease}
.progress-label{font-size:.85rem;white-space:nowrap}
main{flex:1;padding:22px 20px 32px}
h2.screen-title{font-size:1.3rem;margin:0 0 8px;outline:none}
h2.screen-title:focus-visible{outline:3px solid var(--pazapa-blue-dark);outline-offset:4px}
.intro{margin:0 0 16px}
.card{background:var(--tint-blue);border-radius:var(--radius);padding:16px;margin:0 0 16px}
.card.green{background:var(--tint-green)}
.card.yellow{background:var(--tint-yellow);border:2px solid var(--pazapa-yellow)}
.card.plain{background:var(--white);border:2px solid var(--pazapa-grey-light)}
.card h3{margin:0 0 10px;font-size:1.05rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;padding:0;margin:0 0 10px}
.illustration{display:block;width:100%;max-width:200px;margin:0 auto 16px;border-radius:var(--radius)}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:10px 14px;margin:0 0 8px;border:2px solid var(--pazapa-blue);border-radius:10px;background:var(--white);cursor:pointer;touch-action:manipulation}
.opt:hover{background:var(--tint-blue)}
.opt input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--pazapa-blue-dark)}
.opt.checked{background:var(--tint-blue);font-weight:700}
.opt.disabled{opacity:.6;cursor:not-allowed}
.gloss{display:block;font-size:.85rem;font-weight:400;color:#4a4a48}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);margin-left:6px}
button{font-family:inherit;touch-action:manipulation}
.btn,.btn-secondary,.btn-link,.chip,.lang-btn{min-height:48px;touch-action:manipulation}
.btn{padding:12px 24px;border-radius:10px;border:2px solid var(--pazapa-blue-dark);background:var(--pazapa-blue-dark);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
.btn:disabled{background:#DADADA;border-color:#DADADA;color:#555;cursor:not-allowed}
.btn-secondary{padding:12px 20px;border-radius:10px;border:2px solid var(--pazapa-blue-dark);background:#fff;color:var(--pazapa-blue-dark);font-size:1rem;font-weight:700;cursor:pointer}
.btn-secondary:disabled{border-color:#DADADA;color:#777;cursor:not-allowed}
.btn-hint{padding:10px 18px;border-radius:10px;border:2px solid var(--pazapa-yellow);background:var(--tint-yellow);color:var(--pazapa-grey-dark);font-size:.95rem;font-weight:700;min-height:48px;cursor:pointer}
.btn-hint:disabled{opacity:.55;cursor:not-allowed}
.lang-btn{padding:8px 16px;border-radius:24px;border:2px solid var(--pazapa-blue-dark);background:#fff;color:var(--pazapa-blue-dark);font-weight:700;font-size:.95rem;cursor:pointer}
.chip{padding:8px 14px;border-radius:24px;border:2px solid var(--pazapa-blue-dark);background:#fff;color:var(--pazapa-grey-dark);font-size:.95rem;cursor:pointer;text-align:left}
.chip:disabled{opacity:.45;cursor:not-allowed}
.btn-link{background:none;border:none;color:var(--pazapa-blue-dark);text-decoration:underline;font-size:.95rem;cursor:pointer;padding:0 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label.field{display:block;font-weight:700;margin:0 0 6px}
select,input[type=text],textarea{font:inherit;color:var(--pazapa-grey-dark);border:2px solid var(--pazapa-blue-dark);border-radius:10px;background:#fff;padding:10px 12px;min-height:48px;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=text]{width:9.5em}
.fb{margin:10px 0 0;font-size:.95rem}
.fb .line{margin:4px 0}
.fb.ok{background:var(--tint-green);border-left:6px solid var(--pazapa-green);padding:8px 12px;border-radius:8px}
.fb.help{background:var(--tint-yellow);border-left:6px solid var(--pazapa-yellow);padding:8px 12px;border-radius:8px}
.fb.info{background:var(--tint-blue);border-left:6px solid var(--pazapa-blue);padding:8px 12px;border-radius:8px}
.fb:empty{display:none}
.cue{margin:8px 0 0;padding:8px 12px;background:var(--tint-yellow);border-radius:8px;font-size:.95rem}
.cue:empty{display:none}
.wordrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.wordrow .w{min-width:7.5em;font-weight:700}
.wordrow img{width:44px;height:56px;object-fit:cover;border-radius:6px}
.sentence{margin:6px 0 10px}
.attempt{background:#fff;border:2px solid var(--pazapa-grey-light);border-radius:10px;padding:12px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.attempt.ro{background:#F6F6F6}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.compare{grid-template-columns:1fr}}
.built{min-height:52px;border:2px dashed var(--pazapa-blue-dark);border-radius:10px;padding:10px 12px;background:var(--tint-blue);margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rec{background:var(--tint-blue);border-radius:10px;padding:12px;margin:10px 0}
.rec .status{margin:8px 0 0;font-size:.95rem}
ul.plain{margin:6px 0;padding-left:1.2em}
.done-msg{margin-top:14px;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.model{margin-top:10px}
.model p{margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------- text analysis (deterministic) ---------- */
function norm(s){return String(s==null?"":s).normalize("NFKC").replace(/[‘’ʼ`´]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/\s+/g," ").trim();}
function stripEnd(s){return s.replace(/[\s.!?,;:]+$/,"");}
function wordCount(s){var n=norm(s);return n?n.split(" ").filter(Boolean).length:0;}
function sentencesOf(s){return norm(s).split(/[.!?]+/).map(function(x){return x.trim();}).filter(Boolean);}
var RX={
 purpose:/(love to come|like to come|would love|can come|can't come|cannot come|will come|i'll come|i will come|not available|i'm available|i am available|i'm free|i am free|not free|i'm busy|i am busy|\byes\b|sorry|see you|i can't|i cannot)/,
 info:/(saturday|sunday|monday|tuesday|wednesday|thursday|friday|tomorrow|weekend|today|tonight|morning|afternoon|evening|o'clock|oclock|\d{1,2}(:\d{2})?|\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b)/,
 phrase:/(would you like to join|are you free on|thank you for the invitation|thank you for inviting|love to come|not available|meet another time|another time)/,
 ending:/(thank|thanks|see you|please|best wishes|kind regards|regards|bye)/
};
function parts(text){
 var n=norm(text),out={purpose:false,info:false,phrase:false,ending:false};
 if(!n)return out;
 out.purpose=RX.purpose.test(n);out.info=RX.info.test(n);out.phrase=RX.phrase.test(n);
 var s=sentencesOf(text);out.ending=s.length>0&&RX.ending.test(s[s.length-1]);
 return out;
}

var saveTimer=null;
function compact(){
 var o={v:VERSION,l:state.lang,s:state.screen,st:state.st,rc:state.rc,
  d1:slimDraft(state.d1),f:state.first?{r:state.first.route,t:state.first.text,d:state.first.done?1:0}:null,
  fc:state.focus,h4:state.h4,mu:state.modelUsed?1:0,d2:slimDraft(state.d2),im:state.imp,cd:state.cd?1:0};
 return JSON.stringify(o);
}
function slimDraft(x){return {r:x.route,t:x.text.slice(0,300),b:x.build,d:x.done?1:0,a:x.applied?1:0};}
function fromDraft(o,target){
 if(!o||typeof o!=="object")return;
 if(["type","build","speak"].indexOf(o.r)>=0)target.route=o.r;
 if(typeof o.t==="string")target.text=o.t.slice(0,300);
 if(Array.isArray(o.b))target.build=o.b.filter(function(i){return typeof i==="number"&&i>=0&&i<CHIPS.length;}).slice(0,CHIPS.length);
 target.done=o.d===1;target.applied=o.a===1;
}
function restore(raw){
 try{
  if(!raw||typeof raw!=="string"||raw.length>20000)return null;
  var o=JSON.parse(raw);
  if(!o||o.v!==VERSION)return null;
  var s=blankState(o.l==="fr"?"fr":"en");
  s.screen=typeof o.s==="number"?Math.max(0,Math.min(6,o.s|0)):0;
  s.st=typeof o.st==="string"?o.st.slice(0,10):"";
  if(o.rc&&typeof o.rc==="object"){
   if(o.rc.a&&typeof o.rc.a==="object"){Object.keys(s.rc.a).forEach(function(k){var v=o.rc.a[k];if(typeof v==="string"&&MEANS.indexOf(v)>=0)s.rc.a[k]=v;});}
   if(Array.isArray(o.rc.b)){for(var i=0;i<3;i++){if(typeof o.rc.b[i]==="string")s.rc.b[i]=o.rc.b[i].slice(0,30);}}
   if(typeof o.rc.c==="string")s.rc.c=o.rc.c.slice(0,2);
   if(Array.isArray(o.rc.chk)){for(var j=0;j<3;j++)s.rc.chk[j]=o.rc.chk[j]===true;}
   if(Array.isArray(o.rc.h)){for(var q=0;q<3;q++){var hv=o.rc.h[q];if(typeof hv==="number")s.rc.h[q]=Math.max(0,Math.min(3,hv|0));}}
  }
  fromDraft(o.d1,s.d1);fromDraft(o.d2,s.d2);
  if(o.f&&typeof o.f==="object"&&["type","build","speak"].indexOf(o.f.r)>=0){s.first={route:o.f.r,text:typeof o.f.t==="string"?o.f.t.slice(0,300):"",done:o.f.d===1};}
  if(Array.isArray(o.fc))s.focus=o.fc.filter(function(x){return FOCUS.indexOf(x)>=0;}).slice(0,2);
  s.h4=typeof o.h4==="number"?Math.max(0,Math.min(3,o.h4|0)):0;
  s.modelUsed=o.mu===1;
  if(Array.isArray(o.im))s.imp=o.im.filter(function(x){return FOCUS.indexOf(x)>=0||x==="unsure";}).slice(0,5);
  s.cd=o.cd===1;
  return s;
 }catch(e){return null;}
}

/* ---------- LMS (SCORM 1.2 and 2004) with guarded discovery ---------- */
var lms=null,lmsReady=false,lmsClosed=false;
function scan(w){
 var n=0;
 while(w&&n<15){
  try{if(w.API_1484_11)return {ver:"2004",api:w.API_1484_11};}catch(e){}
  try{if(w.API)return {ver:"1.2",api:w.API};}catch(e){}
  var p=null;
  try{p=w.parent;}catch(e){break;}
  if(!p||p===w)break;
  w=p;n++;
 }
 return null;
}
function discover(){
 if(lms)return lms;
 var found=null;
 try{found=scan(window);}catch(e){}
 if(!found){try{if(window.opener&&!window.opener.closed)found=scan(window.opener);}catch(e){}}
 if(found){
  lms=found;
  try{lmsReady=(lms.ver==="2004"?lms.api.Initialize(""):lms.api.LMSInitialize(""))!=="false";}catch(e){lmsReady=true;}
 }
 return lms;
}
function lget(el){try{if(lms.ver==="2004")return String(lms.api.GetValue(el)||"");return String(lms.api.LMSGetValue(el)||"");}catch(e){return "";}}
function lset(el,v){try{return String(lms.ver==="2004"?lms.api.SetValue(el,v):lms.api.LMSSetValue(el,v))!=="false";}catch(e){return false;}}
function lcommit(){try{return String(lms.ver==="2004"?lms.api.Commit(""):lms.api.LMSCommit(""))!=="false";}catch(e){return false;}}
function lmsStatusDone(){
 if(!discover())return false;
 if(lms.ver==="2004"){return lget("cmi.completion_status")==="completed"||lget("cmi.success_status")==="passed";}
 var s=lget("cmi.core.lesson_status");return s==="completed"||s==="passed";
}
function lmsSaveProgress(str){
 if(!discover())return;
 lset("cmi.suspend_data",str);
 if(lms.ver==="2004"){var c=lget("cmi.completion_status");if(c===""||c==="unknown"||c==="not attempted")lset("cmi.completion_status","incomplete");}
 else{var s=lget("cmi.core.lesson_status");if(s===""||s==="not attempted")lset("cmi.core.lesson_status","incomplete");}
 lcommit();
}
function lmsLoad(){
 if(!discover())return "";
 return lget("cmi.suspend_data");
}
function submitCompletion(){
 if(!discover())return false;
 if(lmsStatusDone())return true;                       /* never downgrade or rewrite */
 var ok;
 if(lms.ver==="2004"){lset("cmi.completion_status","completed");ok=lcommit();ok=ok&&lget("cmi.completion_status")==="completed";}
 else{lset("cmi.core.lesson_status","completed");ok=lcommit();ok=ok&&lget("cmi.core.lesson_status")==="completed";}
 if(!ok){lcommit();}
 return true;
}
function lmsClose(){
 if(lmsClosed||!lms)return;lmsClosed=true;
 try{if(lms.ver==="2004")lms.api.Terminate("");else lms.api.LMSFinish("");}catch(e){}
}

/* ---------- validity (always recomputed from current answers) ---------- */
function draftText(dr){
 if(dr.route==="type")return dr.text;
 if(dr.route==="build")return dr.build.map(function(i){return CHIPS[i].en;}).join(" ");
 return "";
}
function draftReady(dr){return dr.route==="speak"?dr.done:wordCount(draftText(dr))>=3;}
function recallState(){
 var rc=state.rc,r={};
 r.t1=WORDS.every(function(w){return rc.a[w.id]===w.ans;});
 var b=rc.b.map(function(x){return stripEnd(norm(x));});
 r.t2=[b[0]==="join",b[1]==="free"||b[1]==="available",b[2]==="invitation"];
 r.t3=rc.c==="B";
 return r;
}
function firstOK(){var f=state.first;return !!f&&(f.route==="speak"?f.done:wordCount(f.text)>=3);}
function focusOK(){return state.focus.length>=1&&state.focus.length<=2&&state.focus.every(function(x){return FOCUS.indexOf(x)>=0;});}
function appliedFocus(){
 var f=state.first,a=state.d2,list=[];
 if(!f)return list;
 if(a.route==="speak")return a.applied?state.focus.slice():[];
 var p1=f.route==="speak"?{purpose:false,info:false,phrase:false,ending:false}:parts(f.text);
 var p2=parts(draftText(a));
 var changed=norm(stripEnd(norm(draftText(a))))!==norm(stripEnd(norm(f.text||"")));
 state.focus.forEach(function(k){if(p2[k]&&(!p1[k]||changed))list.push(k);});
 return list;
}
function secondOK(){
 if(!firstOK()||!focusOK())return false;
 var a=state.d2;
 if(a.route==="speak")return a.done&&a.applied;
 if(wordCount(draftText(a))<3)return false;
 var f=state.first;
 if(f.route!=="speak"&&stripEnd(norm(draftText(a)))===stripEnd(norm(f.text)))return false;
 return appliedFocus().length>=1;
}
function impOK(){return secondOK()&&state.imp.length>=1;}
function reachable(){
 var n=0;
 if(state.st==="st_1")n=1;else return 0;
 var r=recallState();
 if(state.rc.chk[0]&&state.rc.chk[1]&&state.rc.chk[2])n=2;else return n;
 if(firstOK())n=3;else return n;
 if(focusOK())n=4;else return n;
 if(secondOK())n=5;else return n;
 if(impOK())n=6;
 return n;
}

var TOTAL=7;
function go(n,noFocus){
 state.screen=n;
 secs.forEach(function(s,i){s.hidden=(i!==n);});
 document.getElementById("progressFill").style.width=Math.round((n+1)/TOTAL*100)+"%";
 document.getElementById("progressLabel").textContent=t("part",{n:n+1,t:TOTAL});
 if(n===3)renderReplay();

 if(n===5)renderCompare();
 refreshButtons();
 if(!noFocus){var h=secs[n].querySelector("h2");if(h){h.focus({preventScroll:true});}window.scrollTo(0,0);}
 save();
}

/* ---------- recorder (local only, optional) ---------- */
var recorders=[];
function createRecorder(host){
 var r={state:"idle",err:"",url:null,stream:null,mr:null,chunks:[],timer:null,supported:false};
 r.supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
 host.innerHTML='<div class="rec"><div class="row"><button type="button" class="btn-secondary" data-r="rec"></button><button type="button" class="btn-secondary" data-r="stop"></button><button type="button" class="btn-secondary" data-r="hear"></button><button type="button" class="btn-secondary" data-r="again"></button></div><audio data-r="audio" preload="none"></audio><p class="status" data-r="status" role="status" aria-live="polite"></p></div>';
 var q=function(n){return host.querySelector('[data-r="'+n+'"]');};
 function revoke(){if(r.url){try{URL.revokeObjectURL(r.url);}catch(e){}r.url=null;}q("audio").removeAttribute("src");}
 function release(){if(r.stream){try{r.stream.getTracks().forEach(function(x){x.stop();});}catch(e){}r.stream=null;}clearTimeout(r.timer);}
 r.paint=function(){
  q("rec").textContent=t("btn_rec");q("stop").textContent=t("btn_stop");q("hear").textContent=t("btn_hear");q("again").textContent=t("btn_rec_again");
  q("rec").disabled=!r.supported||r.state==="recording"||r.state==="asking"||r.state==="ready";
  q("stop").disabled=r.state!=="recording";
  q("hear").disabled=!(r.state==="ready"&&r.url);
  q("again").disabled=!(r.state==="ready"||r.state==="error")||!r.supported;
  var s=q("status"),txt;
  if(!r.supported)txt="ℹ "+t("rec_unsupported");
  else if(r.state==="asking")txt="… "+t("rec_starting");
  else if(r.state==="recording")txt="● "+t("rec_recording");
  else if(r.state==="ready")txt="✔ "+t("rec_ready");
  else if(r.state==="error")txt="→ "+t(r.err);
  else txt="ℹ "+t("rec_idle");
  s.textContent=txt;
 };
 r.reset=function(){
  if(r.mr){try{r.mr.ondataavailable=null;r.mr.onstop=null;r.mr.onerror=null;if(r.mr.state==="recording")r.mr.stop();}catch(e){}r.mr=null;}
  release();revoke();r.state="idle";r.err="";r.chunks=[];r.paint();
 };
 r.stop=function(){if(r.mr&&r.mr.state==="recording"){try{r.mr.stop();}catch(e){}}};
 r.start=function(){
  if(!r.supported){r.state="idle";r.paint();return;}
  revoke();r.err="";r.state="asking";r.paint();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
   r.stream=stream;r.chunks=[];
   var mime="";["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].some(function(m){try{if(window.MediaRecorder.isTypeSupported&&window.MediaRecorder.isTypeSupported(m)){mime=m;return true;}}catch(e){}return false;});
   try{r.mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){release();r.state="error";r.err="rec_err_unexpected";r.paint();return;}
   var mr=r.mr;
   mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)r.chunks.push(ev.data);};
   mr.onerror=function(){release();r.state="error";r.err="rec_err_unexpected";r.paint();};
   mr.onstop=function(){
    release();
    var blob=new Blob(r.chunks,{type:mr.mimeType||mime||"audio/webm"});
    if(!blob.size){revoke();r.state="error";r.err="rec_err_empty";}
    else{revoke();r.url=URL.createObjectURL(blob);q("audio").src=r.url;r.state="ready";}
    r.paint();announce(t(r.state==="ready"?"rec_ready":r.err));
   };
   try{mr.start();}catch(e){release();r.state="error";r.err="rec_err_unexpected";r.paint();return;}
   r.state="recording";r.paint();announce(t("rec_recording"));
   r.timer=setTimeout(function(){r.stop();},60000);
  }).catch(function(err){
   var n=err&&err.name?err.name:"";
   r.state="error";
   if(n==="NotAllowedError"||n==="PermissionDeniedError"||n==="SecurityError")r.err="rec_err_denied";
   else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError")r.err="rec_err_missing";
   else r.err="rec_err_unexpected";
   r.paint();announce(t(r.err));
  });
 };
 q("rec").addEventListener("click",function(){r.start();});
 q("stop").addEventListener("click",function(){r.stop();});
 q("hear").addEventListener("click",function(){var a=q("audio");if(r.url){try{var p=a.play();if(p&&p.catch)p.catch(function(){r.state="error";r.err="rec_err_unexpected";r.paint();});}catch(e){}}});
 q("again").addEventListener("click",function(){r.reset();r.start();});
 r.paint();
 recorders.push(r);
 return r;
}
function revokeAll(){recorders.forEach(function(r){try{r.reset();}catch(e){}});}

/* ---------- route builder (type / build / speak) used for both tries ---------- */
var routeUI={};
function buildRoute(hostId,which){
 var host=document.getElementById(hostId);
 var dr=which===1?state.d1:state.d2;
 var P="r"+which;
 var html='<div class="card"><fieldset><legend data-i18n="route_legend"></legend><div id="'+P+'opts"></div></fieldset>';
 html+='<div id="'+P+'type"><label class="field" for="'+P+'txt" data-i18n="type_label"></label><textarea id="'+P+'txt" rows="4" maxlength="300" lang="en-GB"></textarea>';
 if(which===2)html+='<div class="row"><button type="button" class="btn-secondary" id="'+P+'copy" data-i18n="s4_copy"></button></div><div class="row"><span data-i18n="s4_add"></span></div><div class="chips" id="'+P+'bank"></div>';
 html+='</div>';
 html+='<div id="'+P+'build"><p data-i18n="build_intro"></p><div class="chips" id="'+P+'chips"></div><p style="margin:12px 0 4px;font-weight:700" data-i18n="build_mine"></p><div class="built" id="'+P+'built" lang="en-GB"></div><div class="row"><button type="button" class="btn-secondary" id="'+P+'undo" data-i18n="btn_undo"></button><button type="button" class="btn-secondary" id="'+P+'clear" data-i18n="btn_clear"></button></div></div>';
 html+='<div id="'+P+'speak"><p data-i18n="speak_intro"></p><div id="'+P+'rec"></div><label class="opt"><input type="checkbox" id="'+P+'done"><span data-i18n="'+(which===1?"speak_done1":"speak_done2")+'"></span></label>';
 if(which===2)html+='<label class="opt"><input type="checkbox" id="'+P+'app"><span data-i18n="speak_applied"></span></label>';
 html+='</div></div>';
 host.innerHTML=html;
 var rec=createRecorder(document.getElementById(P+"rec"));
 routeUI[which]={rec:rec,P:P};
 var opts=document.getElementById(P+"opts");
 [["type","route_type"],["build","route_build"],["speak","route_speak"]].forEach(function(x){
  var lab=document.createElement("label");lab.className="opt";
  var inp=document.createElement("input");inp.type="radio";inp.name=P+"route";inp.value=x[0];
  var sp=document.createElement("span");sp.setAttribute("data-i18n",x[1]);
  lab.appendChild(inp);lab.appendChild(sp);opts.appendChild(lab);
  inp.addEventListener("change",function(){dr.route=x[0];paintRoute(which);changed(which);});
 });
 var txt=document.getElementById(P+"txt");txt.value=dr.text;
 txt.addEventListener("input",function(){dr.text=txt.value.slice(0,300);changed(which);});
 document.getElementById(P+"undo").addEventListener("click",function(){dr.build.pop();paintRoute(which);changed(which);});
 document.getElementById(P+"clear").addEventListener("click",function(){dr.build=[];paintRoute(which);changed(which);});
 var dn=document.getElementById(P+"done");dn.checked=dr.done;
 dn.addEventListener("change",function(){dr.done=dn.checked;changed(which);});
 if(which===2){
  var ap=document.getElementById(P+"app");ap.checked=dr.applied;
  ap.addEventListener("change",function(){dr.applied=ap.checked;changed(which);});
  document.getElementById(P+"copy").addEventListener("click",function(){
   if(state.first&&state.first.route!=="speak"){dr.route="type";dr.text=state.first.text;txt.value=dr.text;paintRoute(2);changed(2);txt.focus();}
  });
 }
 paintRoute(which);
}
function paintRoute(which){
 var dr=which===1?state.d1:state.d2,P="r"+which,ui=routeUI[which];if(!ui)return;
 ["type","build","speak"].forEach(function(r){document.getElementById(P+r).hidden=(dr.route!==r);});
 document.querySelectorAll('input[name="'+P+'route"]').forEach(function(i){i.checked=i.value===dr.route;i.parentNode.classList.toggle("checked",i.checked);});
 var txt=document.getElementById(P+"txt");if(txt.value!==dr.text)txt.value=dr.text;
 var chips=document.getElementById(P+"chips");chips.innerHTML="";
 CHIPS.forEach(function(c,i){
  var b=document.createElement("button");b.type="button";b.className="chip";b.innerHTML=enGloss(c.en,c.fr);
  b.disabled=dr.build.indexOf(i)>=0;
  b.addEventListener("click",function(){if(dr.build.indexOf(i)<0){dr.build.push(i);paintRoute(which);changed(which);}});
  chips.appendChild(b);
 });
 var built=document.getElementById(P+"built");
 built.textContent=dr.build.length?draftText({route:"build",build:dr.build}):"";
 if(!dr.build.length){built.removeAttribute("lang");built.textContent=t("build_empty");}else built.setAttribute("lang","en-GB");
 document.getElementById(P+"undo").disabled=!dr.build.length;document.getElementById(P+"clear").disabled=!dr.build.length;
 if(which===2){
  var bank=document.getElementById(P+"bank");bank.innerHTML="";
  PH.forEach(function(p){
   var b=document.createElement("button");b.type="button";b.className="chip";b.innerHTML=enGloss(p.en,p.fr);
   b.addEventListener("click",function(){
    if(dr.route!=="type"){dr.route="type";}
    var cur=dr.text.replace(/\s+$/,"");dr.text=(cur?cur+" ":"")+p.en;dr.text=dr.text.slice(0,300);
    document.getElementById(P+"txt").value=dr.text;paintRoute(2);changed(2);
   });
   bank.appendChild(b);
  });
  document.getElementById(P+"copy").disabled=!(state.first&&state.first.route!=="speak");
 }
 ui.rec.paint();
 applyStaticI18n(document.getElementById(which===1?"route1":"route2"));
}
function changed(which){
 if(which===1){refreshButtons();}
 else{renderValidation();refreshButtons();}
 save();
}

/* ---------- SCREEN 4: confidence replay ---------- */
function attemptHtml(route,text,done,rec,labelKey){
 if(route==="speak"){
  var h='<p class="attempt ro">✔ '+esc(t(labelKey))+'</p>';
  return h;
 }
 return '<p class="attempt ro" lang="en-GB">'+nl(text)+'</p>';
}
function suggestKey(p){for(var i=0;i<FOCUS.length;i++){if(!p[FOCUS[i]])return FOCUS[i];}return null;}
function renderReplay(){
 var f=state.first;if(!f)return;
 bind(document.getElementById("firstShow"),function(){return attemptHtml(f.route,f.text,f.done,null,"first_speak");});
 var p=f.route==="speak"?{purpose:false,info:false,phrase:false,ending:false}:parts(f.text);
 bind(document.getElementById("strengths"),function(){
  if(f.route==="speak")return line("ok",esc(t("good_speak")));
  var o="";FOCUS.forEach(function(k){if(p[k])o+=line("ok",esc(t("g_"+k)));});
  return o||line("ok",esc(t("good_none")));
 });
 var sug=f.route==="speak"?"purpose":suggestKey(p);
 bind(document.getElementById("suggestLine"),function(){return sug?esc(t("s3_sug",{s:t("sg_"+sug)})):esc(t("s3_sug_none"));});
 var host=document.getElementById("focusOpts");host.innerHTML="";
 FOCUS.forEach(function(k){
  var lab=document.createElement("label");lab.className="opt";
  var inp=document.createElement("input");inp.type="checkbox";inp.value=k;inp.checked=state.focus.indexOf(k)>=0;
  var sp=document.createElement("span");sp.setAttribute("data-i18n","f_"+k);
  lab.appendChild(inp);lab.appendChild(sp);
  if(k===sug){var bd=document.createElement("span");bd.className="badge";bd.setAttribute("data-i18n","badge_sug");lab.appendChild(bd);}
  host.appendChild(lab);
  inp.addEventListener("change",function(){
   if(inp.checked){if(state.focus.indexOf(k)<0)state.focus.push(k);}
   else state.focus=state.focus.filter(function(x){return x!==k;});
   paintFocus();refreshButtons();save();
  });
 });
 applyStaticI18n(host);
 paintFocus();
 bank4();
 paintHelp();
}

document.getElementById("hint4").addEventListener("click",function(){if(state.h4<3){state.h4++;paintHelp();save();}});
document.getElementById("modelBtn").addEventListener("click",function(){state.model=!state.model;if(state.model)state.modelUsed=true;paintHelp();save();});
document.getElementById("btnSecond").addEventListener("click",function(){if(focusOK())go(4);});

/* ---------- SCREEN 5: second try ---------- */
function focusList(){return state.focus.map(function(k){return t("f_"+k);}).join(" · ");}
function renderSecond(){
 var f=state.first;if(!f)return;
 bind(document.getElementById("firstRO"),function(){return attemptHtml(f.route,f.text,f.done,null,"first_speak");});
 bind(document.getElementById("focusRem"),function(){return "<p style='margin:0;font-weight:700'>"+esc(focusList())+"</p>";});
 paintRoute(2);
 renderValidation();
}
function renderValidation(){
 var el=document.getElementById("vmsg"),a=state.d2;
 if(!state.first||!focusOK()){clearBox(el);return;}
 if(secondOK())box(el,"ok",function(){return line("ok",esc(t("v_ok",{f:appliedFocus().map(function(k){return t("f_"+k);}).join(" · ")})));});
 else box(el,"help",function(){
  if(a.route==="speak"){return line("help",esc(!a.done?t("v_speak"):t("v_speak_apply")));}
  if(wordCount(draftText(a))<3)return line("help",esc(t("v_words")));
  if(state.first.route!=="speak"&&stripEnd(norm(draftText(a)))===stripEnd(norm(state.first.text)))return line("help",esc(t("v_same")));
  return line("help",esc(t("v_apply",{f:focusList()})));
 });
}
document.getElementById("btnCompare").addEventListener("click",function(){if(secondOK()){state.imp=[];go(5);}});

/* ---------- SCREEN 6: notice the progress ---------- */
function recAudioHtml(which){
 var ui=routeUI[which];
 if(ui&&ui.rec&&ui.rec.url)return '<audio controls src="'+ui.rec.url+'" style="width:100%;margin-top:8px"></audio>';
 return "";
}
function renderCompare(){
 var f=state.first,a=state.d2;if(!f)return;
 bind(document.getElementById("cmp1"),function(){return attemptHtml(f.route,f.text,f.done,null,"first_speak")+(f.route==="speak"?recAudioHtml(1):"");});
 bind(document.getElementById("cmp2"),function(){return attemptHtml(a.route,draftText(a),a.done,null,"second_speak")+(a.route==="speak"?recAudioHtml(2):"");});
 var host=document.getElementById("impOpts");host.innerHTML="";
 FOCUS.concat(["unsure"]).forEach(function(k){
  var lab=document.createElement("label");lab.className="opt"+(state.imp.indexOf(k)>=0?" checked":"");
  var inp=document.createElement("input");inp.type="checkbox";inp.value=k;inp.checked=state.imp.indexOf(k)>=0;
  var sp=document.createElement("span");sp.setAttribute("data-i18n","imp_"+k);
  lab.appendChild(inp);lab.appendChild(sp);host.appendChild(lab);
  inp.addEventListener("change",function(){
   if(inp.checked){if(state.imp.indexOf(k)<0)state.imp.push(k);}
   else state.imp=state.imp.filter(function(x){return x!==k;});
   lab.classList.toggle("checked",inp.checked);refreshButtons();save();
  });
 });
 applyStaticI18n(host);
 bind(document.getElementById("summary"),function(){
  if(a.route==="speak")return "<p style='margin:0 0 8px'>"+esc(t("sum_speak",{f:focusList()}))+"</p><p style='margin:0;font-size:.9rem'>"+esc(t("sum_note"))+"</p>";
  var p1=f.route==="speak"?{purpose:false,info:false,phrase:false,ending:false}:parts(f.text);
  var p2=parts(draftText(a));
  var gained=FOCUS.filter(function(k){return p2[k]&&!p1[k];});
  var s;
  if(gained.length){
   var rs=gained.map(function(k){return t("r_"+k);}).join(state.lang==="fr"?" et ":" and ");
   s=t("sum_gain",{r:rs});
  }else s=t("sum_none");
  return "<p style='margin:0 0 8px'>"+esc(s)+"</p><p style='margin:0;font-size:.9rem'>"+esc(t("sum_note"))+"</p>";
 });
}
document.getElementById("btnFinish").addEventListener("click",function(){if(impOK())go(6);});

/* ---------- SCREEN 7: complete ---------- */
function updateDone(){
 doneBtn.disabled=!(state.screen===6&&impOK());
}
doneBtn.addEventListener("click",function(){
 if(doneBtn.disabled)return;
 activityCompleted();
});
document.getElementById("tryAgainBtn").addEventListener("click",function(){resetAll();});
function resetAll(){
 revokeAll();
 var keepLang=state.lang,keepCd=state.cd;
 state=blankState(keepLang);state.cd=keepCd;
 document.getElementById("doneMsg").textContent="";doneBtn.removeAttribute("aria-pressed");
 buildStatements();paintStatementFb();
 buildRecall();["fb1","fb2","fb3"].forEach(function(i){clearBox(document.getElementById(i));});renderCues();
 buildRoute("route1",1);buildRoute("route2",2);
 ["firstShow","strengths","suggestLine","firstRO","focusRem","cmp1","cmp2","summary","model","cue4","bank4"].forEach(function(i){var el=document.getElementById(i);if(el)unbind(el);});
 clearBox(document.getElementById("vmsg"));clearBox(document.getElementById("focusFb"));
 document.getElementById("focusOpts").innerHTML="";document.getElementById("impOpts").innerHTML="";
 go(0);
 announce(t("btn_again"));
}

/* ---------- buttons / state refresh ---------- */
function refreshButtons(){
 document.getElementById("btnStart").disabled=state.st!=="st_1";
 document.getElementById("btnCont").disabled=!(state.rc.chk[0]&&state.rc.chk[1]&&state.rc.chk[2]);
 document.getElementById("btnFirst").disabled=!draftReady(state.d1);
 document.getElementById("btnSecond").disabled=!focusOK();
 document.getElementById("btnCompare").disabled=!secondOK();
 document.getElementById("btnFinish").disabled=!impOK();
 updateDone();
}

/* ---------- language ---------- */
function applyStaticI18n(root){
 (root||document).querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"));});
}
function applyLang(){
 document.documentElement.lang=state.lang==="fr"?"fr":"en-GB";
 var lb=document.getElementById("langBtn");
 lb.textContent=state.lang==="fr"?"English":"Français";
 lb.setAttribute("lang",state.lang==="fr"?"en-GB":"fr");
 lb.setAttribute("aria-label",state.lang==="fr"?"Switch to English":"Passer en français");
 document.title=t("title");
 applyStaticI18n(document);
 document.getElementById("progressLabel").textContent=t("part",{n:state.screen+1,t:TOTAL});
 buildStatements();
 fillMeans();buildT3();renderCues();
 [1,2].forEach(function(w){if(routeUI[w])paintRoute(w);});
 if(state.screen===3){renderReplay();}
 if(state.screen===4){renderSecond();}
 if(state.screen===5){renderCompare();}
 paintHelp();paintFocus();paintStatementFb();
 refreshDyn();
 if(doneBtn.getAttribute("aria-pressed")==="true")showDone();
}
document.getElementById("langBtn").addEventListener("click",function(){
 state.lang=state.lang==="fr"?"en":"fr";
 applyLang();save();announce(t("sr_lang_fr"));
});

/* ---------- unload safety ---------- */
window.addEventListener("pagehide",function(){try{saveNow();}catch(e){}revokeAll();});
window.addEventListener("beforeunload",function(){revokeAll();});

/* ---------- init ---------- */
(function init(){
 var restored=null;
 try{restored=restore(lmsLoad());}catch(e){}
 if(!restored){try{restored=restore(localStorage.getItem(KEY));}catch(e){}}
 try{if(lmsStatusDone())state.cd=true;}catch(e){}
 if(restored){state=restored;}
 try{if(lms&&lmsStatusDone())state.cd=true;}catch(e){}
 buildStatements();
 buildRecall();
 buildRoute("route1",1);buildRoute("route2",2);
 /* revalidate against the current rules rather than trusting stale flags */
 var max=reachable();
 state.screen=Math.min(state.screen,max);
 if(state.screen<3){state.focus=state.focus;}
 document.getElementById("progressLabel").textContent=t("part",{n:state.screen+1,t:TOTAL});
 applyLang();
 repaintRecallFb();
 go(state.screen,true);
 refreshButtons();
})();

})();
</script>
</body>
</html>
