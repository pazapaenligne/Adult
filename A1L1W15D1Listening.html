<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pazapa English for Adults — W15D1 Step 2 — Listening Mission</title>
<style>
  :root{
    --blue:#36BBD6;
    --green:#C9D646;
    --yellow:#FCC104;
    --red:#E6352B;               /* decorative accent only — never used for learner errors */
    --grey-light:#EBEBEB;
    --grey-dark:#2E2E2D;
    --blue-tint:#EAF8FB;
    --green-tint:#F4F8DC;
    --yellow-tint:#FFF6D6;
    --focus-ring:3px solid #2E2E2D;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{
    margin:0;padding:0;
    font-family:'Open Sans','Segoe UI',Arial,sans-serif;
    color:var(--grey-dark);
    background:#fff;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3{
    font-family:'Filson Soft','Arial Black',Arial,sans-serif;
    color:var(--grey-dark);
    margin:0 0 .5em 0;
    text-transform:none;
    line-height:1.2;
  }
  h1{font-size:1.6rem;}
  h2{font-size:1.2rem;}
  h1:focus{outline:none;}
  .app-header{
    background:var(--blue);
    color:var(--grey-dark);
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .header-text{
    font-family:'Filson Soft','Arial Black',Arial,sans-serif;
    font-weight:700;
    font-size:1.05rem;
  }
  main{max-width:760px;margin:0 auto;padding:24px 20px 60px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fadein .25s ease-in;}
  @media (prefers-reduced-motion:reduce){
    .screen.active{animation:none;}
    .btn,.choice-card{transition:none !important;}
  }
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}

  .step-count{font-size:.85rem;font-weight:600;color:#5d5d5c;margin:0 0 6px;}
  .instruction{font-size:1.15rem;font-weight:600;margin:0 0 14px;}
  .card-box{background:var(--grey-light);border-radius:16px;padding:16px 18px;margin:14px 0;}

  /* French support — hidden until the learner switches it on */
  .fr{display:none;}
  body.fr-on .fr{
    display:block;
    font-family:'Open Sans','Segoe UI',Arial,sans-serif;
    font-size:.88em;
    font-weight:400;
    font-style:italic;
    color:#4a4a49;
    margin-top:2px;
  }
  body.fr-on .btn .fr,body.fr-on .app-header .fr{color:inherit;}
  body.fr-on .choice-card .fr{text-align:center;}

  .btn{
    display:inline-flex;flex-direction:column;
    align-items:center;justify-content:center;
    min-height:48px;min-width:48px;
    padding:10px 22px;
    font-size:1rem;line-height:1.25;
    font-family:'Open Sans',Arial,sans-serif;font-weight:600;
    border-radius:999px;
    border:2px solid var(--blue);
    background:#fff;color:var(--grey-dark);
    cursor:pointer;
    touch-action:manipulation;
    transition:transform .1s ease,background .15s ease;
  }
  .btn:hover{background:var(--blue-tint);}
  .btn:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--blue);border-color:var(--blue);color:var(--grey-dark);}
  .btn-primary:hover{background:#2fa9c2;}
  .btn:disabled{
    background:var(--grey-light);border-color:var(--grey-light);
    color:#767675;cursor:not-allowed;transform:none;
  }
  .btn-yellow{border-color:var(--yellow);background:#fff;}
  .btn-yellow:hover{background:var(--yellow-tint);}
  .btn[aria-pressed="true"]{background:var(--blue-tint);}
  .btn-small{padding:8px 16px;font-size:.92rem;}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
  .app-header .btn{min-height:48px;padding:8px 16px;border-color:var(--grey-dark);background:var(--blue);}
  .app-header .btn[aria-pressed="true"]{background:#fff;}

  .audio-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:6px 0 8px;}
  .audio-note{font-size:.9rem;margin:4px 0 8px;min-height:1.2em;}
  details.transcript{margin:8px 0 6px;}
  details.transcript summary{
    cursor:pointer;font-weight:600;min-height:48px;
    display:flex;align-items:center;gap:8px;touch-action:manipulation;
  }
  details.transcript summary:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  .transcript-body{background:#fff;border-radius:12px;padding:10px 14px;margin-top:4px;}
  .transcript-body p{margin:6px 0;}
  .transcript-body .who{font-weight:700;}

  .choices{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px;margin-top:10px;
  }
  .choices.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:520px){ .choices.cols-3{grid-template-columns:repeat(2,1fr);} }
  .choice-card{
    border:3px solid transparent;
    background:#fff;
    border-radius:14px;
    padding:12px;
    text-align:center;
    cursor:pointer;
    min-height:56px;
    font-family:inherit;font-size:1rem;color:inherit;
    touch-action:manipulation;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  }
  .choice-card:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  .choice-card:disabled{opacity:.55;cursor:not-allowed;}
  .choice-card img{
    width:100%;height:150px;
    object-fit:contain;           /* whole picture always visible — never cropped */
    background:#FDF4EC;
    border-radius:10px;display:block;
  }
  .choice-label{font-weight:700;font-size:1.05rem;}
  .choice-card.is-selected{border-color:var(--blue);background:var(--blue-tint);}
  .choice-card.is-right{border-color:var(--green);background:var(--green-tint);}
  .choice-card.is-right::after{content:"\2713";font-weight:900;}
  .choice-text{padding:14px 8px;}

  fieldset.q{border:0;padding:0;margin:0 0 18px;}
  fieldset.q legend{font-weight:700;font-size:1.08rem;padding:0;margin-bottom:8px;}
  .q-row{display:flex;gap:12px;align-items:flex-start;}
  .q-pic{width:84px;height:106px;object-fit:contain;background:#FDF4EC;border-radius:10px;flex:0 0 auto;}
  .q-body{flex:1 1 auto;min-width:0;}
  .q-choices{display:flex;flex-wrap:wrap;gap:10px;}
  .q-choices .choice-card{flex:1 1 140px;min-height:52px;justify-content:center;flex-direction:column;}

  ol.order-list{list-style:none;margin:10px 0 0;padding:0;}
  .order-item{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fff;border:3px solid transparent;border-radius:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
    padding:10px 12px;margin-bottom:10px;
    touch-action:manipulation;cursor:grab;
  }
  .order-item:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  .order-item.is-selected{border-color:var(--blue);background:var(--blue-tint);}
  .order-item.is-right{border-color:var(--green);background:var(--green-tint);}
  .order-item.dragging{opacity:.5;}
  .order-num{
    flex:0 0 36px;height:36px;border-radius:50%;background:var(--blue);
    display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .order-text{flex:1 1 200px;font-weight:600;font-size:1.05rem;}
  .order-moves{display:flex;gap:8px;}
  .order-moves .btn{min-width:48px;padding:6px 12px;font-size:.92rem;}

  .feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;min-height:24px;}
  .feedback:empty{display:none;}
  .feedback.correct{background:var(--green-tint);}
  .feedback.wrong{background:var(--yellow-tint);}
  .feedback.info{background:var(--grey-light);}
  .status-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;}
  .status-dot.wrong{background:var(--yellow);}
  .status-dot.correct{background:var(--green);}

  .done-status{margin-top:14px;font-weight:700;min-height:1.4em;}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  @media (max-width:390px){
    main{padding:16px 12px 50px;}
    h1{font-size:1.35rem;}
    .header-text{font-size:.9rem;}
  }
  @media (min-width:768px){ main{padding:32px 32px 70px;} }
</style>
</head>

  <span class="header-text">Pazapa English for Adults</span>
  <button type="button" class="btn btn-small" id="btn-fr" aria-pressed="false" aria-label="Show French translation">Français</button>
</div>

<main id="main">
  <div id="screens"></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</main>

    var r = a.slice();

        if (SCHEMA.situation.indexOf(sel.situation) === -1) throw 0;
        c.sel.situation = sel.situation;
      }
      if (Array.isArray(sel.words)){
        sel.words.forEach(function(w){ if (SCHEMA.words.indexOf(w) === -1) throw 0; });
        c.sel.words = sel.words.filter(function(w,i,a){ return a.indexOf(w) === i; });
      }
      var d = sel.details || {};
      ["q1","q2","q3"].forEach(function(q){
        if (d[q] !== null && d[q] !== undefined){
          if (SCHEMA.q[q].indexOf(d[q]) === -1) throw 0;
          c.sel.details[q] = d[q];
        }
      });
      if (Array.isArray(sel.order)){
        if (!sameSet(sel.order, SCHEMA.order)) throw 0;
        c.sel.order = sel.order.slice();
      }
      // a screen marked done must hold a real, consistent selection
      for (var i=0;i<4;i++){ if (c.done[i] && !c.revealed[i] && !isCorrect(i, c)) throw 0; }
      return c;
    }catch(e){ return null; }
  }

  /* ============================================================
     ANSWER CHECKING (reads CONFIG.answers only)
     ============================================================ */
  function isComplete(i, st){
    st = st || STATE;
    if (i === 0) return st.sel.situation !== null;
    if (i === 1) return st.sel.words.length > 0;
    if (i === 2) return !!(st.sel.details.q1 && st.sel.details.q2 && st.sel.details.q3);
    if (i === 3) return !!st.sel.order;
    return false;
  }
  function isCorrect(i, st){
    st = st || STATE;
    var A = CONFIG.answers;
    if (i === 0) return st.sel.situation === A.situation;
    if (i === 1) return sameSet(st.sel.words, A.words);
    if (i === 2) return st.sel.details.q1 === A.details.q1 && st.sel.details.q2 === A.details.q2 && st.sel.details.q3 === A.details.q3;
    if (i === 3) return !!st.sel.order && sameList(st.sel.order, A.order);
    return false;
  }
  function allDone(){ return STATE.done.every(function(v){ return v; }); }

  /* ============================================================
     PERSISTENCE (localStorage + SCORM suspend_data)
     ============================================================ */
  function payload(){
    return JSON.stringify({ id: CONFIG.activityId, state: STATE, completed: completionSent });
  }
  function lsSave(){
    try{ window.localStorage.setItem(CONFIG.lsKey, payload()); }catch(e){}
  }
  function lsLoad(){
    try{ return window.localStorage.getItem(CONFIG.lsKey); }catch(e){ return null; }
  }
  function parseSaved(raw){
    if (!raw || typeof raw !== "string" || raw.length > 20000) return null;
    try{
      var d = JSON.parse(raw);
      if (!d || d.id !== CONFIG.activityId) return null;
      return { state: validState(d.state), completed: d.completed === true };
    }catch(e){ return null; }
  }
  function save(){
    lsSave();
    if (lms.api){
      try{
        if (lms.ver === "1.2"){ lms.api.LMSSetValue("cmi.suspend_data", payload()); }
        else { lms.api.SetValue("cmi.suspend_data", payload()); }
      }catch(e){}
    }
  }

  /* ============================================================
     LMS (SCORM 1.2 / 2004) — guarded discovery, idempotent completion
     ============================================================ */
  var lms = { api:null, ver:null, tries:0 };

  function findAPI(startWin){
    var visited = [], depth = 0, found = null, ver = null;
    function search(win){
      if (!win || found || depth >= 10) return;
      if (visited.indexOf(win) !== -1) return;
      visited.push(win); depth++;
      var a = null;
      try{ a = win.API || null; }catch(e){ a = null; }
      if (a){ found = a; ver = "1.2"; return; }
      try{ a = win.API_1484_11 || null; }catch(e){ a = null; }
      if (a){ found = a; ver = "2004"; return; }
      var p = null; try{ p = win.parent; }catch(e){ p = null; }
      if (p && p !== win) search(p);
      if (found) return;
      var o = null; try{ o = win.opener; }catch(e){ o = null; }
      if (o && o !== win) search(o);
    }
    search(startWin);
    return found ? { api:found, ver:ver } : null;
  }
  function ok(v){ return v === true || (typeof v === "string" && v.toLowerCase() === "true"); }

  function connectLMS(initial){
    if (lms.api) return;
    lms.tries++;
    var f = null;
    try{ f = findAPI(window); }catch(e){ f = null; }
    if (!f) return;
    try{
      if (f.ver === "1.2"){
        if (!ok(f.api.LMSInitialize(""))) return;
        lms.api = f.api; lms.ver = "1.2";
        var st = f.api.LMSGetValue("cmi.core.lesson_status");
        if (st === "completed" || st === "passed"){ completionSent = true; }
        else if (!st || st === "not attempted"){ f.api.LMSSetValue("cmi.core.lesson_status","incomplete"); }
        if (initial){ restoreFrom(f.api.LMSGetValue("cmi.suspend_data")); }
        f.api.LMSCommit("");
      } else {
        if (!ok(f.api.Initialize(""))) return;
        lms.api = f.api; lms.ver = "2004";
        var cs = f.api.GetValue("cmi.completion_status");
        if (cs === "completed"){ completionSent = true; }
        else if (!cs || cs === "unknown" || cs === "not attempted"){ f.api.SetValue("cmi.completion_status","incomplete"); }
        if (initial){ restoreFrom(f.api.GetValue("cmi.suspend_data")); }
        f.api.Commit("");
      }
    }catch(e){ lms.api = null; lms.ver = null; }
  }

  function restoreFrom(raw){
    var p = parseSaved(raw);
    if (!p) return;
    if (p.state) STATE = p.state;
    if (p.completed) completionSent = true;
  }

  // Idempotent. Called only when Done is pressed. Never downgrades.
  function activityCompleted(){
    if (completionSent) return true;
    if (!lms.api) connectLMS(false);
    if (lms.api){
      try{
        var good = true;
        if (lms.ver === "1.2"){
          good = ok(lms.api.LMSSetValue("cmi.core.lesson_status","completed")) && good;
          good = ok(lms.api.LMSSetValue("cmi.suspend_data", JSON.stringify({id:CONFIG.activityId,state:STATE,completed:true}))) && good;
          good = ok(lms.api.LMSCommit("")) && good;
        } else {
          good = ok(lms.api.SetValue("cmi.completion_status","completed")) && good;
          good = ok(lms.api.SetValue("cmi.suspend_data", JSON.stringify({id:CONFIG.activityId,state:STATE,completed:true}))) && good;
          good = ok(lms.api.Commit("")) && good;
        }
        if (!good) console.log("LMS did not confirm completion; completed locally.");
      }catch(e){ console.log("LMS completion skipped:", e); }
    }
    completionSent = true;       // learner-side completion is never blocked by the LMS
    lsSave();
    console.log(CONFIG.logLabel);
    return true;
  }

  /* ============================================================
     AUDIO ENGINE — one clip, one player, learner-started only
     ============================================================ */
  var audio = null, audioState = "idle", audioFailed = false;
  function audioReady(){ return !!AUDIO_FILES.main && !audioFailed; }

  function refreshAudioUI(){
    var ready = audioReady();
    Array.prototype.forEach.call(document.querySelectorAll("[data-audio-btn]"), function(b){
      var kind = b.getAttribute("data-audio-btn");
      var dis = !ready;
      b.disabled = dis;
      if (kind === "play"){ b.setAttribute("aria-pressed", audioState === "playing" ? "true" : "false"); }
      if (kind === "pause"){ b.setAttribute("aria-pressed", audioState === "paused" ? "true" : "false"); }
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-audio-note]"), function(n){
      if (!AUDIO_FILES.main) n.innerHTML = bi(MSG.audioMissing);
      else if (audioFailed) n.innerHTML = bi(MSG.audioFailed);
      else n.innerHTML = "";
    });
    if (!ready){
      Array.prototype.forEach.call(document.querySelectorAll("details.transcript"), function(d){ d.open = true; });
    }
    updateGate();
  }
  function ensureAudio(){
    if (audio) return audio;
    audio = new Audio();
    audio.preload = "auto";
    audio.src = AUDIO_FILES.main;
    audio.addEventListener("ended", function(){
      audioState = "idle";
      STATE.heard = true; save();
      refreshAudioUI();
    });
    audio.addEventListener("error", function(){
      console.error("Audio loading error:", audio.error ? audio.error.code : "unknown");
      audioFailed = true; audioState = "idle"; refreshAudioUI();
    });
    return audio;
  }
  function stopAudio(){
    if (audio){ try{ audio.pause(); }catch(e){} audioState = "idle"; }
  }
  function playAudio(fromStart){
    if (!audioReady()) return;
    var a = ensureAudio();
    if (fromStart){ try{ a.currentTime = 0; }catch(e){} }
    var p = a.play();
    audioState = "playing"; refreshAudioUI();
    if (p && typeof p.catch === "function"){
      p.catch(function(err){ console.error("Audio playback failed:", err); audioState = "idle"; audioFailed = true; refreshAudioUI(); });
    }
  }
  function pauseAudio(){
    if (audio && audioState === "playing"){ try{ audio.pause(); }catch(e){} audioState = "paused"; refreshAudioUI(); }
  }

  /* ---------- ordering (drag-and-drop + Move up / Move down) ---------- */
  var orderSelected = null;
  function currentOrder(){
    if (!STATE.sel.order){
      var ids = ORDER_CARDS.map(function(c){return c.id;});
      var s = shuffle(ids), guard = 0;
      while (sameList(s, CONFIG.answers.order) && guard++ < 20) s = shuffle(ids);
      return s;
    }
    return STATE.sel.order;
  }
  var orderWorking = null;    // visible order (may not yet be committed to STATE)
  function renderOrder(){
    var g = ui[3].group; g.innerHTML = "";
    if (!orderWorking) orderWorking = currentOrder().slice();
    if (!STATE.sel.order) STATE.sel.order = orderWorking.slice();
    var list = el("ol", { class:"order-list", "aria-label":"Three parts to put in order" });
    orderWorking.forEach(function(id, pos){
      var card = ORDER_CARDS.filter(function(c){return c.id===id;})[0];
      var li = el("li", { class:"order-item" + (orderSelected===id ? " is-selected":""), tabindex:"0", draggable:"true", "data-v":id,
                          "aria-label":"Part " + (pos+1) + " of 3: " + card.en });
      li.appendChild(el("span", { class:"order-num", "aria-hidden":"true" }, String(pos+1)));
      li.appendChild(el("span", { class:"order-text" }, bi(card)));
      var mv = el("span", { class:"order-moves" });
      var up = el("button", { type:"button", class:"btn btn-small", "aria-label":"Move up: " + card.en }, bi(UI.up));
      var dn = el("button", { type:"button", class:"btn btn-small", "aria-label":"Move down: " + card.en }, bi(UI.down));
      up.disabled = pos === 0; dn.disabled = pos === orderWorking.length-1;
      up.addEventListener("click", function(e){ e.stopPropagation(); moveItem(id,-1); });
      dn.addEventListener("click", function(e){ e.stopPropagation(); moveItem(id,1); });
      mv.appendChild(up); mv.appendChild(dn); li.appendChild(mv);
      li.addEventListener("click", function(){ orderSelected = id; refreshOrderSel(); });
      li.addEventListener("keydown", function(e){
        if (e.target !== li) return;
        if (e.key === "ArrowUp"){ e.preventDefault(); moveItem(id,-1,true); }
        else if (e.key === "ArrowDown"){ e.preventDefault(); moveItem(id,1,true); }
        else if (e.key === "Enter" || e.key === " "){ e.preventDefault(); orderSelected = id; refreshOrderSel(); }
      });
      li.addEventListener("dragstart", function(e){
        orderSelected = id; li.classList.add("dragging");
        try{ e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; }catch(x){}
      });
      li.addEventListener("dragend", function(){ li.classList.remove("dragging"); });
      li.addEventListener("dragover", function(e){ e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        var from = orderSelected; if (!from || from === id) return;
        var a = orderWorking.slice();
        a.splice(a.indexOf(from),1);
        a.splice(a.indexOf(id) + (orderWorking.indexOf(from) < orderWorking.indexOf(id) ? 1 : 0), 0, from);
        commitOrder(a, from, false);
      });
      list.appendChild(li);
    });
    g.appendChild(list);
  }
  function refreshOrderSel(){
    Array.prototype.forEach.call(ui[3].group.querySelectorAll(".order-item"), function(li){
      li.classList.toggle("is-selected", li.getAttribute("data-v") === orderSelected);
    });
  }
  function moveItem(id, dir, keepFocusOnCard){
    var a = orderWorking.slice(), i = a.indexOf(id), j = i + dir;
    if (j < 0 || j >= a.length) return;
    a.splice(i,1); a.splice(j,0,id);
    commitOrder(a, id, keepFocusOnCard, dir);
  }
  function commitOrder(a, id, focusCard, dir){
    orderWorking = a; STATE.sel.order = a.slice(); orderSelected = id;
    changed(3); renderOrder(); save();
    var li = ui[3].group.querySelector('[data-v="' + id + '"]');
    if (li){
      if (focusCard) li.focus();
      else {
        var btns = li.querySelectorAll("button"), b = (dir === 1 ? btns[1] : btns[0]);
        if (b && !b.disabled) b.focus(); else (dir === 1 ? btns[0] : btns[1]).focus();
      }
    }
    live("Part " + (a.indexOf(id)+1) + " of 3");
  }

      if (idx === 2){
        Array.prototype.forEach.call(g.querySelectorAll("fieldset.q"), function(fs){
          var q = fs.getAttribute("data-q");
          var b = fs.querySelector('[data-v="' + CONFIG.answers.details[q] + '"]');
          if (b) b.classList.add("is-right");
        });
      } else {
        Array.prototype.forEach.call(g.querySelectorAll("[data-v]"), function(b){
          if (right.indexOf(b.getAttribute("data-v")) !== -1) b.classList.add("is-right");
        });
      }
    }
    if (idx === 3){
      Array.prototype.forEach.call(g.querySelectorAll(".order-item"), function(li){ li.classList.add("is-right"); });
    }
  }

  function checkScreen(idx){
    if (!isComplete(idx)){ setFeedback(idx, "info", MSG.need[idx]); live(MSG.need[idx].en); return; }
    if (isCorrect(idx)){
      STATE.done[idx] = true; STATE.revealed[idx] = false;
      setFeedback(idx, "correct", MSG.correct);
      markRight(idx);
      ui[idx].next.disabled = false;
      ui[idx].show.hidden = true;
    } else {
      STATE.done[idx] = false;
      STATE.attempts[idx]++;
      setFeedback(idx, "wrong", MSG.hint[idx]);
      ui[idx].next.disabled = true;
      if (STATE.attempts[idx] >= 2) ui[idx].show.hidden = false;
    }
    save();
  }

  function showMe(idx){
    var A = CONFIG.answers;
    if (idx === 0){ STATE.sel.situation = A.situation; markSel(ui[0].group, [A.situation]); }
    if (idx === 1){ STATE.sel.words = A.words.slice(); markSel(ui[1].group, STATE.sel.words); }
    if (idx === 2){
      STATE.sel.details = { q1:A.details.q1, q2:A.details.q2, q3:A.details.q3 };
      Array.prototype.forEach.call(ui[2].group.querySelectorAll(".q-choices"), function(grp, k){
        markSel(grp, [A.details[QUESTIONS[k].id]]);
      });
    }
    if (idx === 3){ STATE.sel.order = A.order.slice(); orderWorking = A.order.slice(); orderSelected = null; renderOrder(); }
    STATE.done[idx] = true; STATE.revealed[idx] = true;
    markRight(idx);
    setFeedback(idx, "info", MSG.revealed);
    ui[idx].next.disabled = false;
    ui[idx].show.hidden = true;
    save();
  }

  function resetScreen(idx, focus){
    STATE.done[idx] = false; STATE.revealed[idx] = false;
    if (idx === 0) STATE.sel.situation = null;
    if (idx === 1) STATE.sel.words = [];
    if (idx === 2) STATE.sel.details = { q1:null, q2:null, q3:null };
    if (idx === 3){ STATE.sel.order = null; orderWorking = null; orderSelected = null; }
    clearFeedback(idx);
    ui[idx].next.disabled = true;
    ui[idx].show.hidden = STATE.attempts[idx] < 2;
    renderScreen(idx);
    save();
    if (focus){
      var first = ui[idx].group.querySelector("button, [tabindex]");
      if (first) first.focus();
    }
  }
  function renderScreen(idx){
    if (idx === 0) renderSituation();
    if (idx === 1) renderWords();
    if (idx === 2) renderDetails();
    if (idx === 3) renderOrder();
  }

  /* Screen 1: choices open after a genuine playback ends.
     If no recording exists (or it cannot play) they stay usable so
     the learner is never trapped. */
  function updateGate(){
    if (!ui[0] || !ui[0].group) return;
    var open = STATE.heard || !audioReady();
    Array.prototype.forEach.call(ui[0].group.querySelectorAll(".choice-card"), function(b){ b.disabled = !open; });
    ui[0].check.disabled = !open;
    var note = document.getElementById("gate-note");
    if (note) note.innerHTML = open ? "" : bi(MSG.listenFirst);
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */
  function showScreen(idx, moveFocus){
    SCREEN_IDS.forEach(function(id, i){
      screens[id].classList.toggle("active", i === idx);
    });
    STATE.screen = idx;
    if (idx === 4) updateDone();
    save();
    var h = document.getElementById("h-" + idx);
    if (moveFocus && h){ h.focus(); try{ window.scrollTo(0,0); }catch(e){} }
    live(idx === 4 ? "Listening Mission complete." : "Part " + (idx+1) + " of 4");
  }
  function goTo(idx){
    if (idx > 4) return;
    if (idx > STATE.screen && !STATE.done[STATE.screen] && STATE.screen < 4) return;
    stopAudio(); refreshAudioUI();
    showScreen(idx, true);
  }

  function updateDone(){
    var status = document.getElementById("done-status");
    if (STATE.doneClicked){
      doneBtn.disabled = true;
      status.innerHTML = bi(MSG.completed);
    } else {
      doneBtn.disabled = !allDone();
      status.innerHTML = "";
    }
  }
  function onDone(){
    if (!allDone()) return;
    STATE.doneClicked = true;
    activityCompleted();
    updateDone();
    save();
    live("Completed.");
  }

  function retryAll(){
    stopAudio();
    STATE = freshState();
    orderWorking = null; orderSelected = null;
    for (var i=0;i<4;i++){ clearFeedback(i); ui[i].next.disabled = true; ui[i].show.hidden = true; renderScreen(i); }
    audioState = "idle"; refreshAudioUI();
    showScreen(0, true);
  }

  /* Re-apply saved progress to the interface */
  function applySaved(){
    for (var i=0;i<4;i++){
      renderScreen(i);
      if (STATE.done[i]){
        markRight(i);
        if (STATE.revealed[i]) setFeedback(i, "info", MSG.revealed); else setFeedback(i, "correct", MSG.correct);
        ui[i].next.disabled = false;
      }
      ui[i].show.hidden = !(STATE.attempts[i] >= 2 && !STATE.done[i]);
    }
  }

  /* ============================================================
     FRENCH SUPPORT TOGGLE
     ============================================================ */
  function setFrench(on){
    document.body.classList.toggle("fr-on", on);
    var b = document.getElementById("btn-fr");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.setAttribute("aria-label", on ? "Hide French translation" : "Show French translation");
    try{ window.localStorage.setItem("pazapa-fr-support", on ? "1" : "0"); }catch(e){}
  }

  /* ============================================================
     INIT
     ============================================================ */
  buildScreens();

  // restore: local copy first, then the LMS copy (LMS completion always wins)
  var local = parseSaved(lsLoad());
  if (local){
    if (local.state) STATE = local.state;
    if (local.completed) completionSent = true;
  }
  connectLMS(true);
  if (STATE.screen === 4 && !allDone()) STATE.screen = 0;

  applySaved();
  refreshAudioUI();
  showScreen(STATE.screen, false);

  var frOn = false;
  try{ frOn = window.localStorage.getItem("pazapa-fr-support") === "1"; }catch(e){}
  setFrench(frOn);
  document.getElementById("btn-fr").addEventListener("click", function(){
    setFrench(!document.body.classList.contains("fr-on"));
  });

  // keep looking for an LMS API after later interaction
  document.addEventListener("click", function(){
    if (!lms.api && lms.tries < 6){ connectLMS(false); if (lms.api) save(); }
  });
  window.addEventListener("beforeunload", function(){
    try{
      if (lms.api){ if (lms.ver === "1.2") lms.api.LMSCommit(""); else lms.api.Commit(""); }
    }catch(e){}
  });
})();
</script>
</body>
</html>
