<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online discussions — Build Useful English</title>
<style>
  :root{
    --blue:#36BBD6; --blue-tint:#D7F1F7; --green:#C9D646; --green-tint:#F4F7DA;
    --yellow:#FCC104; --yellow-tint:#FEF3CD; --red:#E6352B; --grey:#EBEBEB; --dark:#2E2E2D; --white:#FFFFFF;
    --focus:3px solid #2E2E2D; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:"Open Sans",Arial,sans-serif;color:var(--dark);background:var(--white);max-width:100%;overflow-x:hidden;font-size:16px;}
  h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;margin:0 0 8px 0;line-height:1.25;}
  p{line-height:1.55;margin:0 0 10px 0;}
  .app{max-width:780px;margin:0 auto;padding:16px 16px 40px 16px;}
  .top-bar{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:8px 0 10px 0;border-bottom:4px solid var(--blue);margin-bottom:18px;}
  .brand{font-size:13px;font-weight:700;margin:0 0 2px 0;}
  .eyebrow{font-size:13px;font-weight:600;overflow-wrap:break-word;}
  .top-bar h1{font-size:22px;margin:2px 0 0 0;}
  .top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:1 1 180px;min-width:0;}
  .progress-wrap{display:flex;align-items:center;gap:10px;width:100%;max-width:260px;}
  .progress-track{flex:1 1 60px;min-width:0;height:10px;background:var(--grey);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue);width:16.6%;transition:width .3s ease;}
  .progress-label{font-size:12px;font-weight:700;white-space:nowrap;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
  button,input,textarea,label.opt{touch-action:manipulation;}
  button{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;border-radius:999px;min-height:48px;min-width:48px;padding:10px 22px;border:2px solid var(--dark);background:var(--white);color:var(--dark);}
  button:focus-visible,input:focus-visible,textarea:focus-visible,label.opt:focus-within{outline:var(--focus);outline-offset:3px;}
  button.primary{background:var(--blue);border-color:var(--blue);color:var(--dark);}
  button.primary:hover:not(:disabled){background:#2aa9c4;border-color:#2aa9c4;}
  button.primary:disabled{background:var(--grey);border-color:var(--grey);color:#6b6b6b;cursor:not-allowed;}
  button.ghost{border-color:#9a9a9a;}
  button.help{background:var(--yellow-tint);border-color:var(--yellow);}
  button.lang{min-height:48px;padding:8px 18px;border-color:var(--blue);background:var(--blue-tint);}
  .screen{display:none;}
  .screen.active{display:block;}
  .goal-box{background:var(--blue-tint);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;}
  .goal-box .label{font-size:13px;font-weight:700;margin-bottom:4px;}
  .goal-box .goal-text{font-size:18px;font-weight:800;}
  .two-col{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .two-col .col{flex:1 1 260px;min-width:0;}
  .art{display:block;width:100%;max-width:230px;height:auto;object-fit:contain;margin:0 auto 12px auto;border-radius:12px;}
  .art.small{max-width:150px;}
  /* chat strips */
  .strip{border:1px solid var(--grey);border-radius:var(--radius);padding:12px;margin-bottom:12px;background:var(--white);}
  .strip .ctx{display:inline-block;font-size:13px;font-weight:800;background:var(--yellow-tint);border-radius:999px;padding:3px 12px;margin-bottom:8px;}
  .bubble{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px;}
  .avatar{flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:var(--blue);color:var(--dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .avatar.s{background:var(--green);}
  .bubble .msg{background:var(--grey);border-radius:4px 14px 14px 14px;padding:8px 14px;font-size:16px;max-width:100%;overflow-wrap:break-word;}
  .bubble.reply .msg{background:var(--blue-tint);font-weight:700;}
  .bubble .who{display:block;font-size:12px;font-weight:800;opacity:.75;}
  mark.swap{background:var(--yellow);color:var(--dark);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:0 3px;border-radius:4px;}
  .fr{display:none;font-size:14px;font-style:italic;margin-top:2px;opacity:.9;}
  body.lang-fr .fr{display:block;}
  .obs{background:var(--green-tint);border-radius:var(--radius);padding:12px 16px;font-weight:700;}
  /* items */
  .item{border:2px solid var(--grey);border-radius:var(--radius);padding:14px;margin-bottom:14px;background:var(--white);}
  .item.is-ok{background:var(--green-tint);border-color:var(--green);}
  .item.is-no{background:var(--yellow-tint);border-color:var(--yellow);}
  .item.is-rev{background:var(--blue-tint);border-color:var(--blue);}
  .item h3{font-size:15px;margin-bottom:6px;}
  .item fieldset{border:0;padding:0;margin:0;min-width:0;}
  .item legend{font-weight:700;padding:0;margin-bottom:8px;}
  .clue{font-weight:600;margin-bottom:8px;}
  .slots,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:10px;align-items:center;}
  .slots{background:var(--blue-tint);border:2px dashed var(--blue);margin-bottom:8px;}
  .bank{background:var(--grey);}
  .pl{display:inline-flex;align-items:center;gap:2px;}
  .chunk{border-radius:10px;border:2px solid var(--blue);background:var(--white);padding:8px 14px;}
  .chunk.placed{background:var(--blue);}
  .mv{padding:4px 8px;min-width:48px;border-radius:10px;border-color:#9a9a9a;}
  .mv:disabled{opacity:.4;cursor:not-allowed;}
  .gapline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:18px;font-weight:700;}
  .gapinput{font:inherit;font-weight:700;min-height:48px;width:150px;max-width:100%;padding:6px 12px;border:2px solid var(--blue);border-radius:10px;background:var(--white);color:var(--dark);}
  .wordbank{background:var(--grey);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .wordbank .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chipbtn{border-radius:10px;border-color:var(--blue);background:var(--white);padding:8px 16px;}
  .chipbtn[aria-pressed="true"]{background:var(--blue);}
  .chipbtn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  label.opt{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:10px 14px;border:2px solid var(--blue);border-radius:12px;background:var(--white);margin-bottom:8px;cursor:pointer;font-weight:700;}
  label.opt input{width:22px;height:22px;margin-top:2px;flex:0 0 22px;accent-color:#1b6f80;}
  label.opt .fr{font-weight:400;}
  label.opt:has(input:checked){background:var(--blue-tint);}
  .say{background:var(--grey);border-radius:10px;padding:10px 14px;margin-bottom:10px;}
  .say .who{display:block;font-size:12px;font-weight:800;opacity:.75;}
  .say.bad{background:var(--yellow-tint);}
  textarea{font:inherit;width:100%;min-height:96px;padding:10px 12px;border:2px solid var(--blue);border-radius:10px;background:var(--white);color:var(--dark);resize:vertical;}
  .fb{margin-top:10px;font-weight:700;min-height:0;}
  .fb .ic{display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-weight:800;margin-right:6px;background:var(--dark);color:var(--white);}
  .fb.ok .ic{background:var(--green);color:var(--dark);}
  .fb.no .ic{background:var(--yellow);color:var(--dark);}
  .fb .why{display:block;font-weight:600;margin-top:4px;}
  .own{background:var(--white);border:1px dashed #9a9a9a;border-radius:8px;padding:6px 10px;margin-top:6px;font-weight:600;}
  .model{background:var(--white);border:2px solid var(--blue);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:700;}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px 0;}
  .summary{font-weight:700;min-height:24px;}
  .part-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px 0;}
  .part-h .n{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 32px;}
  .part-h h3{margin:0;font-size:17px;}
  .recap{background:var(--blue-tint);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .confirm-panel{display:none;background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;margin-top:12px;}
  .confirm-panel p{font-weight:700;}
  .confirm-panel .row{display:flex;gap:10px;flex-wrap:wrap;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .nav-bar{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:12px;}
  #completionNote{font-weight:700;min-height:24px;}
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div>
      <p class="brand" data-i18n="brand">Pazapa English Programme for Adults</p>
      <div class="eyebrow" data-i18n="eyebrow">Week 14 · Lesson 3 · Online discussions</div>
      <h1 data-i18n="h1">Build Useful English</h1>
    </div>
    <div class="top-right">
      <button type="button" class="lang" id="langBtn" aria-pressed="false">Français</button>
      <div class="progress-wrap" role="progressbar" aria-label="Activity progress" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Screen 1 of 6</div>
      </div>
    </div>
  </div>

  <div aria-live="polite" class="sr-only" id="srAnnounce"></div>

  <section class="screen active" id="screen1" aria-labelledby="s1h"></section>
  <section class="screen" id="screen2" aria-labelledby="s2h" aria-hidden="true"></section>
  <section class="screen" id="screen3" aria-labelledby="s3h" aria-hidden="true"></section>
  <section class="screen" id="screen4" aria-labelledby="s4h" aria-hidden="true"></section>
  <section class="screen" id="screen5" aria-labelledby="s5h" aria-hidden="true"></section>
  <section class="screen" id="screen6" aria-labelledby="s6h" aria-hidden="true"></section>

</div>

function norm(s){
  s=String(s==null?"":s);
  try{ s=s.normalize("NFKC"); }catch(e){}
  s=s.replace(/[‘’ʼ]/g,"'").toLowerCase().replace(/\s+/g," ").trim();
  s=s.replace(/[.!?,;:]+$/,"").trim();
  return s;
}
function countSentences(s){ var parts=String(s).split(/[.!?]+/); var n=0; parts.forEach(function(p){ if(p.replace(/\s/g,"").length>0) n++; }); return n; }
function isCorrect(id){
  var it=ITEMS[id], c=it.cfg, r=S.items[id].r;
  switch(it.type){
    case "order": return c.valid.some(function(v){ return v.length===r.length && v.every(function(x,i){return x===r[i];}); });
    case "gap": return c.acc.indexOf(norm(r))!==-1;
    case "radio": return c.opts.some(function(o){ return o[0]===r && o[2]===1; });
    case "chips": return r===c.ans;
    case "match": return r===c.ans;
    case "text": return textProblems(r).length===0;
  }
  return false;
}
function hasAnswer(id){ var r=S.items[id].r; return Array.isArray(r)? r.length>0 : String(r).replace(/\s/g,"").length>0; }
function textProblems(txt){
  var n=norm(txt), probs=[];
  var op=/(i agree|different opinion|good point)/.test(n);
  var q=/could you (explain|give|share)/.test(n) && String(txt).indexOf("?")!==-1;
  if(!op) probs.push("needOpinion");
  if(!q) probs.push("needQuestion");
  if(countSentences(txt)>2) probs.push("tooLong");
  return probs;
}
function isValid(id){ var s=S.items[id]; return s.rev || s.res==="ok"; }
function screenValid(n){ if(n===1) return true; return SCREEN_IDS[n].every(isValid); }
function maxReachable(){ var m=1; for(var n=2;n<=5;n++){ if(screenValid(n)) m=n+1; else break; } return m; }
function reveal(id){
  var it=ITEMS[id], c=it.cfg, s=S.items[id];
  s.rev=true; s.res=null;
  if(it.type==="order") s.r=c.valid[0].slice();
  else if(it.type==="gap") s.r=c.ans;
  else if(it.type==="radio") s.r=c.opts.filter(function(o){return o[2]===1;})[0][0];
  else if(it.type==="chips"||it.type==="match") s.r=c.ans;
  else if(it.type==="text") s.r=c.model;
}

function snapshot(){
  var it={}; Object.keys(S.items).forEach(function(id){ var s=S.items[id]; it[id]=[s.r,s.att,s.rev?1:0,s.res?1:0]; });
  return {v:1,screen:S.screen,lang:lang,done:S.done?1:0,i:it};
}
function save(){ try{ window.localStorage.setItem(KEY,JSON.stringify(snapshot())); }catch(e){} }
function clearSaved(){ try{ window.localStorage.removeItem(KEY); }catch(e){} }
function restore(){
  var raw=null;
  try{ var j=window.localStorage.getItem(KEY); if(j) raw=JSON.parse(j); }catch(e){ raw=null; }
  if(!raw||raw.v!==1||typeof raw.i!=="object"||!raw.i) return 1;
  if(raw.lang==="fr") lang="fr";
  Object.keys(ITEMS).forEach(function(id){
    var it=ITEMS[id], d=raw.i[id]; if(!Array.isArray(d)) return;
    var r=d[0], s=S.items[id];
    if(it.type==="order"){
      if(!Array.isArray(r)) return;
      var ids=it.cfg.chunks.map(function(c){return c[0];}), seen={}, ok=[];
      r.forEach(function(x){ if(ids.indexOf(x)!==-1&&!seen[x]){ seen[x]=1; ok.push(x); } });
      s.r=ok;
    } else if(it.type==="radio"){
      if(it.cfg.opts.some(function(o){return o[0]===r;})) s.r=r;
    } else if(it.type==="chips"){
      if(it.cfg.opts.indexOf(r)!==-1) s.r=r;
    } else if(it.type==="match"){
      if(CFG.s5bOpts.indexOf(r)!==-1) s.r=r;
    } else {
      if(typeof r==="string") s.r=r.slice(0,300);
    }
    s.att=(typeof d[1]==="number"&&d[1]>=0&&d[1]<=50)?Math.floor(d[1]):0;
    s.rev=d[2]===1;
    // Revalidate against the CURRENT answer data; never trust a saved boolean.
    if(s.rev){ reveal(id); }
    else if(d[3]===1 && hasAnswer(id)){ s.res=isCorrect(id)?"ok":"no"; }
  });
  S.done = raw.done===1;
  var want=(typeof raw.screen==="number")?Math.floor(raw.screen):1;
  if(want<1||want>6) want=1;
  var allv=screenValid(2)&&screenValid(3)&&screenValid(4)&&screenValid(5);
  if(want===6 && !allv) want=maxReachable();
  if(want>maxReachable()) want=maxReachable();
  if(S.done && !allv) S.done=false;
  return want;
}

  announce(t("moved",{w:w,p:np+1,n:s.r.length}));
  var side=d<0?"l":"r";

function refreshBank(){
  var box=$("s3bank"); if(!box) return;
  var used={};
  CFG.s3.forEach(function(c){ var v=norm(S.items[c.id].r); if(v) used[v]=c.id; });
  box.innerHTML="";
  (RT.bank.s3||CFG.s3bank).forEach(function(w){
    var u=used[w]&&used[w]!==RT.active;
    var b=h("button",{type:"button",class:"chipbtn","aria-disabled":u?"true":"false",text:w,onclick:function(){
      if(u) return;
      var inp=$("in_"+RT.active); if(!inp) return;
      inp.value=w; inp.dispatchEvent(new Event("input")); inp.focus();
    }});
    box.appendChild(b);
  });
}

/* ============================== CHECK / TRY AGAIN ============================== */
function checkScreen(n){
  var ok=0, total=SCREEN_IDS[n].length;
  SCREEN_IDS[n].forEach(function(id){
    var s=S.items[id];
    if(s.rev){ return; }
    if(!hasAnswer(id)){ s.res="empty"; return; }
    if(isCorrect(id)){ s.res="ok"; }
    else { s.res="no"; s.att++; }
  });
  SCREEN_IDS[n].forEach(function(id){ if(isValid(id)) ok++; });
  refreshScreen(n); save();
  var msg = ok===total ? (SCREEN_IDS[n].some(function(id){return S.items[id].rev;})? t("summShown") : t("summAll")) : t("summ",{k:ok,n:total});
  $("sum"+n).textContent=msg; announce(msg);
}
function tryAgain(n){
  resetItems(n); S.done=false;
  buildScreen(n); goToKeep(n);
  $("sum"+n).textContent=""; save();
}
function goToKeep(n){ var hd=$("screen"+n).querySelector("h2"); if(hd){ hd.setAttribute("tabindex","-1"); hd.focus(); } }

    h("button",{type:"button",class:"ghost",text:t("tryScreen"),onclick:function(){ tryAgain(n); }})
  ]);
  return [row,h("p",{class:"summary",id:"sum"+n,role:"status"}),
    h("div",{class:"nav-bar"},[h("button",{type:"button",class:"primary",id:"cont"+n,text:t("cont"),disabled:!screenValid(n),onclick:function(){ if(screenValid(n)) goTo(n+1); }})])];
}
