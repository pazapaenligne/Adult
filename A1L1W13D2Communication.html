<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communication Mission - Understanding course instructions</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F7FAEC;
  --yellow-tint:#FFF6D6;
  --cream:#FFF8EE;
  --line:#6B6B68;
  --soft:#4A4A47;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Open Sans",Arial,sans-serif;
  font-size:1rem;
  line-height:1.55;
  color:var(--pazapa-grey-dark);
  background:#FFFFFF;
}
h1,h2,h3{
  font-family:"Filson Soft","Open Sans",Arial,sans-serif;
  font-weight:800;
  line-height:1.25;
  margin:0 0 10px 0;
  text-transform:none;
}
h1{font-size:1.6rem;}
h2{font-size:1.4rem;}
h3{font-size:1.05rem;}
p{margin:0 0 10px 0;}
.app{max-width:780px;margin:0 auto;padding:12px 16px 40px 16px;}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:8px 0 12px 0;border-bottom:4px solid var(--pazapa-blue);
}
.brand{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:1rem;}
.brand::before{content:"";display:inline-block;width:10px;height:10px;background:var(--pazapa-red);margin-right:8px;vertical-align:baseline;}
.lang{
  font-family:inherit;font-size:.95rem;font-weight:700;
  min-height:48px;min-width:48px;padding:8px 16px;border-radius:999px;cursor:pointer;
  border:2px solid var(--pazapa-grey-dark);background:#FFFFFF;color:var(--pazapa-grey-dark);
  touch-action:manipulation;
}
.lang[aria-pressed="true"]{background:var(--pazapa-yellow);}
.stepline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 4px 0;font-size:.92rem;color:var(--soft);}
.dots{display:flex;gap:5px;flex:1;min-width:120px;}
.dot{flex:1;height:8px;border-radius:4px;background:var(--pazapa-grey-light);}
.dot.done{background:var(--pazapa-blue);}
.dot.cur{background:var(--pazapa-grey-dark);}
.fr{display:none;}
body.show-fr .fr{display:block;font-style:italic;color:var(--soft);font-weight:400;font-size:.93em;margin-top:2px;}
body.show-fr .fr.in{display:inline;margin:0;}
main{display:block;margin-top:12px;outline:none;}
.card{background:var(--blue-tint);border-radius:16px;padding:18px;margin-bottom:14px;}
.card.cream{background:var(--cream);}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card.white{background:#FFFFFF;border:2px solid var(--pazapa-grey-light);}
.lead{font-size:1.08rem;}
.sub{color:var(--soft);}
.fourgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.fcard{background:#FFFFFF;border:2px solid var(--pazapa-blue);border-radius:12px;padding:12px;}
.fcard h3{margin-bottom:4px;}
.goal{background:var(--pazapa-green);border-radius:12px;padding:12px 14px;font-weight:700;}
.steps{list-style:none;margin:10px 0;padding:0;}
.steps li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--pazapa-grey-light);}
.steps li:last-child{border-bottom:none;}
.steps img{width:48px;height:auto;border-radius:8px;flex:none;}
.steps .num{font-weight:800;min-width:1.2em;}
.hero{display:block;margin:0 auto 12px auto;max-width:220px;width:60%;height:auto;border-radius:12px;}
fieldset{border:0;margin:0 0 12px 0;padding:0;min-inline-size:0;}
legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;font-size:1.1rem;padding:0;margin-bottom:8px;}
.phrases{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pcard{
  display:flex;align-items:flex-start;gap:10px;cursor:pointer;
  background:#FFFFFF;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px;
  touch-action:manipulation;
}
.pcard input{width:24px;height:24px;margin:2px 0 0 0;flex:none;accent-color:var(--pazapa-grey-dark);}
.pcard:has(input:checked){background:var(--green-tint);border-color:var(--pazapa-grey-dark);}
.pcard.warn{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
.pcard:has(input:focus-visible){outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
.pen{font-weight:700;display:block;}
.flag{display:block;font-weight:700;font-size:.9rem;margin-top:4px;}
.status{
  display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600;
}
.status.ok{background:var(--pazapa-green);}
.status.warn{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);}
.status.info{background:#FFFFFF;border:2px solid var(--pazapa-grey-light);}
.status .mark{font-weight:800;flex:none;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px 0;}
.chip{
  font-family:inherit;font-size:.98rem;text-align:left;cursor:pointer;
  background:#FFFFFF;border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-height:48px;
  color:var(--pazapa-grey-dark);touch-action:manipulation;
}
.chip.on{background:var(--pazapa-green);border-color:var(--pazapa-grey-dark);font-weight:700;}
.chip:disabled{opacity:.55;cursor:not-allowed;}
.trayline{font-weight:700;margin-top:8px;}
.plansec{background:#FFFFFF;border:2px solid var(--pazapa-grey-light);border-radius:14px;padding:14px;margin-bottom:12px;}
.plansec .num{display:inline-block;background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-weight:800;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px;margin-right:8px;}
.sublabel{font-weight:700;font-size:.92rem;margin:8px 0 2px 0;}
.preview{background:var(--cream);border:2px dashed var(--line);border-radius:12px;padding:12px;margin:8px 0;min-height:56px;}
.preview ol{margin:6px 0 0 0;padding-left:22px;}
.btn{
  font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;
  min-height:48px;min-width:48px;padding:10px 22px;border-radius:999px;
  border:2px solid var(--pazapa-grey-dark);touch-action:manipulation;
}
.btn.primary{background:var(--pazapa-blue);color:var(--pazapa-grey-dark);}
.btn.secondary{background:#FFFFFF;color:var(--pazapa-grey-dark);}
.btn.help{background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);}
.btn:disabled{background:var(--pazapa-grey-light);color:#5C5C59;border-color:#8A8A87;border-style:dashed;cursor:not-allowed;}
.btn.small{padding:8px 16px;font-size:.95rem;}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end;margin-top:16px;}
.hint{font-size:.92rem;color:var(--soft);margin:8px 0 0 0;text-align:right;}
.chatbox{border:2px solid var(--pazapa-grey-dark);border-radius:14px;overflow:hidden;background:#FFFFFF;margin:10px 0;}
.chathead{background:var(--pazapa-blue);padding:10px 14px;font-weight:800;}
.chatbody{padding:12px 14px;}
.bubble{background:var(--blue-tint);border:2px solid var(--pazapa-blue);border-radius:14px 14px 4px 14px;padding:10px 14px;margin-left:auto;max-width:92%;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;}
.bubble.them{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);border-radius:14px 14px 14px 4px;margin:0 0 8px 0;}
label.lbl{display:block;font-weight:700;margin-bottom:6px;}
textarea{
  width:100%;min-height:140px;font-family:inherit;font-size:1rem;line-height:1.5;color:var(--pazapa-grey-dark);
  border:2px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;background:#FFFFFF;
}
.count{font-size:.9rem;color:var(--soft);margin-top:4px;}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px 0;}
.modebtn{
  font-family:inherit;font-size:1rem;font-weight:700;min-height:48px;padding:8px 22px;border-radius:999px;cursor:pointer;
  border:2px solid var(--pazapa-grey-dark);background:#FFFFFF;color:var(--pazapa-grey-dark);touch-action:manipulation;
}
.modebtn[aria-pressed="true"]{background:var(--pazapa-blue);}
.reccontrols{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
.checkitem{
  display:flex;gap:12px;align-items:flex-start;background:#FFFFFF;border:2px solid var(--pazapa-grey-light);
  border-radius:12px;padding:10px 12px;margin-bottom:10px;min-height:56px;cursor:pointer;touch-action:manipulation;
}
.checkitem input{width:24px;height:24px;flex:none;margin:2px 0 0 0;accent-color:var(--pazapa-grey-dark);}
.checkitem:has(input:checked){background:var(--green-tint);border-color:var(--pazapa-grey-dark);}
.checkitem:has(input:focus-visible){outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
.checkitem .ct{font-weight:700;display:block;}
.checkitem .ex{display:block;font-size:.93rem;color:var(--soft);}
.found{display:block;font-weight:700;font-size:.9rem;margin-top:4px;}
.suggest{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);border-radius:12px;padding:10px 14px;margin:10px 0;}
.suggest ul{margin:6px 0 0 0;padding-left:20px;}
.bank{display:flex;flex-wrap:wrap;gap:8px;}
.donerow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end;margin-top:16px;}
.donerow[hidden],.actions[hidden]{display:none;}
.donerow .btn{flex:1 1 0;min-width:130px;max-width:260px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
[hidden]{display:none !important;}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;}
h1:focus,h2:focus{outline:none;}
@media (max-width:560px){
  .fourgrid,.phrases{grid-template-columns:1fr;}
  .actions{justify-content:stretch;}
  .actions .btn{flex:1 1 100%;}
  .hint{text-align:left;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Pazapa English Programme for Adults</div>
    <button type="button" class="lang" id="frBtn" aria-pressed="false">Français</button>
  </header>
  <div class="stepline"><span id="stepLabel"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
  <main id="screen" tabindex="-1"></main>
  <div class="hint" id="navHint"></div>
  <div class="actions" id="actions">
    <button type="button" class="btn secondary" id="secondBtn" hidden></button>
    <button type="button" class="btn primary" id="primaryBtn"></button>
  </div>
  <div class="donerow" id="doneRow" hidden>
    <button type="button" class="btn secondary" id="tryAgainBtn">Try again</button>
    <button type="button" class="btn primary" id="doneBtn">Done</button>
  </div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</div>

var Rec={phase:"idle",err:"",stream:null,mr:null,chunks:[],url:null,audio:null,playing:false,tok:0,timer:null,auto:false};
function recSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function pickMime(){
  if(!window.MediaRecorder||typeof MediaRecorder.isTypeSupported!=="function"){return "";}
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported(c[i])){return c[i];}}
  return "";
}
function stopTracks(st){if(st){try{st.getTracks().forEach(function(t){t.stop();});}catch(e){}}}
function cleanupStream(){stopTracks(Rec.stream);Rec.stream=null;}
function stopPlayback(){
  if(Rec.audio){try{Rec.audio.pause();}catch(e){}Rec.audio.onended=null;Rec.audio.onerror=null;Rec.audio=null;}
  Rec.playing=false;
}
function revokeUrl(){if(Rec.url){try{URL.revokeObjectURL(Rec.url);}catch(e){}Rec.url=null;}}
function discardRec(){
  stopPlayback();revokeUrl();Rec.chunks=[];Rec.phase="idle";Rec.err="";
}
function mapErr(err){
  var n=err&&err.name?err.name:"";
  if(n==="NotAllowedError"||n==="PermissionDeniedError"||n==="SecurityError"){return "denied";}
  if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError"){return "nodevice";}
  if(n==="NotReadableError"||n==="TrackStartError"||n==="AbortError"){return "busy";}
  return "fail";
}
function startRec(){
  if(Rec.phase==="requesting"||Rec.phase==="recording"||Rec.phase==="stopping"){return;}
  if(!recSupported()){Rec.phase="error";Rec.err="unsupported";updateRecUI();return;}
  discardRec();
  var tok=++Rec.tok;
  Rec.phase="requesting";Rec.err="";Rec.auto=false;
  S.rev=null;updateRecUI();refreshNav();
  var p;
  try{p=navigator.mediaDevices.getUserMedia({audio:true});}catch(e){Rec.phase="error";Rec.err=mapErr(e);updateRecUI();return;}
  p.then(function(stream){
    if(tok!==Rec.tok){stopTracks(stream);return;}
    var mime=pickMime(),mr;
    try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}
    catch(e){stopTracks(stream);Rec.phase="error";Rec.err="fail";updateRecUI();return;}
    Rec.stream=stream;Rec.mr=mr;Rec.chunks=[];
    mr.ondataavailable=function(ev){if(ev.data&&ev.data.size>0){Rec.chunks.push(ev.data);}};
    mr.onerror=function(){
      if(tok!==Rec.tok){return;}
      cleanupStream();clearTimeout(Rec.timer);Rec.phase="error";Rec.err="fail";updateRecUI();refreshNav();
    };
    mr.onstop=function(){
      cleanupStream();clearTimeout(Rec.timer);
      if(tok!==Rec.tok){return;}
      var blob=new Blob(Rec.chunks,{type:mr.mimeType||mime||"audio/webm"});
      Rec.chunks=[];
      if(!blob.size){Rec.phase="error";Rec.err="empty";}
      else{revokeUrl();Rec.url=URL.createObjectURL(blob);Rec.phase="ready";Rec.err="";S.rev=null;}
      updateRecUI();refreshNav();
      say(Rec.phase==="ready"?"Recording ready.":"The recording was empty.",Rec.phase==="ready"?"Enregistrement prêt.":"L'enregistrement était vide.");
    };
    try{mr.start();}catch(e2){cleanupStream();Rec.phase="error";Rec.err="fail";updateRecUI();return;}
    Rec.phase="recording";
    Rec.timer=setTimeout(function(){if(Rec.phase==="recording"){Rec.auto=true;stopRec();}},90000);
    updateRecUI();
    say("Recording started.","Enregistrement commencé.");
  }).catch(function(err){
    if(tok!==Rec.tok){return;}
    Rec.phase="error";Rec.err=mapErr(err);updateRecUI();refreshNav();
  });
}
function stopRec(){
  if(Rec.phase!=="recording"||!Rec.mr){return;}
  Rec.phase="stopping";updateRecUI();
  try{if(Rec.mr.state!=="inactive"){Rec.mr.stop();}else{cleanupStream();Rec.phase="error";Rec.err="empty";updateRecUI();}}
  catch(e){cleanupStream();Rec.phase="error";Rec.err="fail";updateRecUI();}
}
function playRec(){
  if(Rec.phase!=="ready"||!Rec.url){return;}
  if(Rec.playing){stopPlayback();updateRecUI();return;}
  stopPlayback();
  var a=new Audio(Rec.url);
  Rec.audio=a;Rec.playing=true;
  a.onended=function(){if(Rec.audio===a){Rec.audio=null;Rec.playing=false;updateRecUI();}};
  a.onerror=function(){if(Rec.audio===a){Rec.audio=null;Rec.playing=false;Rec.err="playfail";updateRecUI();}};
  var pr=a.play();
  if(pr&&pr.catch){pr.catch(function(){if(Rec.audio===a){Rec.audio=null;Rec.playing=false;Rec.err="playfail";updateRecUI();}});}
  updateRecUI();
}

   Key info : a course step word (watch, listen, read, answer, complete, upload, video, question, assignment,
              file, task, feedback) or deadline / attempt / a weekday
   Lesson   : at least two different lesson words (watch, listen, read, answer, complete, upload, deadline,
              attempt, feedback)
   Ending   : thank / thanks / regards / best wishes / see you
   Opening  : hello / hi / hey / dear / good morning|afternoon|evening (suggestion only)
   Minor spelling slips are tolerated (one-letter difference in longer words). */
var STEP_STEMS=["watch","listen","read","answer","complete","upload","video","question","assignment","file","task","feedback","deadline","attempt","friday","thursday","monday","tuesday","wednesday"];
var LESSON_STEMS=["watch","listen","read","answer","complete","upload","deadline","attempt","feedback"];
function analyse(text){
  var n=norm(text).toLowerCase(),tk=tokens(text);
  var purpose=/\?/.test(n)||/\b(can|could|may) (i|you|we)\b/.test(n)||/\bwhat should\b/.test(n)||/\bhow many\b/.test(n)||/\bplease\b/.test(n)||/\bhelp\b/.test(n)||/\btry again\b/.test(n);
  var info=false;STEP_STEMS.forEach(function(s){if(hasStem(tk,s)){info=true;}});
  var found=[];LESSON_STEMS.forEach(function(s){if(hasStem(tk,s)){found.push(s);}});
  var lesson=found.length>=2;
  var ending=/\b(thank|thanks|thx|thankyou|regards|see you)\b/.test(n)||/\bbest wishes\b/.test(n)||hasStem(tk,"thank");
  var opening=/\b(hello|hi|hey|dear)\b/.test(n)||/\bgood (morning|afternoon|evening)\b/.test(n);
  return {purpose:purpose,info:info,lesson:lesson,ending:ending,opening:opening,words:found};
}
function runReview(){
  /* Marks the current message/plan as reviewed. Counts an incomplete typed attempt. */
  if(hasTyped()){
    var a=analyse(S.text);
    lastReview=a;
    if(!(a.purpose&&a.info&&a.lesson&&a.ending)){S.attempts+=1;}
    if(S.attempts>=2){S.helpBank=true;}
    if(S.attempts>=3){S.helpModel=true;}
  }else{lastReview=null;}
  S.rev=stateHash();
  save();
}

  if(v.length>MAX_CHARS){v=v.slice(0,MAX_CHARS);clipped=true;}
  ta.value=v;onTextInput();
  ta.focus();try{ta.setSelectionRange(v.length,v.length);}catch(e){}
  if(clipped){say("The message is limited to 250 characters.","Le message est limité à 250 caractères.");}
}

var GOOD={
  purpose:["Your request is clear.","Votre demande est claire."],
  info:["You gave useful course information.","Vous avez donné des informations utiles sur le cours."],
  lesson:["You used lesson language.","Vous avez utilisé le vocabulaire de la leçon."],
  ending:["Your ending is polite.","Votre fin de message est polie."]
};
function R5(){
  var typed=hasTyped(),a=typed?analyse(S.text):null;
  var h='<div class="card"><h2>'+bi("Check your message","Vérifiez votre message")+'</h2>';
  /* the message */
  h+='<div class="chatbox"><div class="chathead">'+bin("Course chat · Ms Hana","Chat du cours · Ms Hana")+'</div><div class="chatbody">';
  if(typed){h+='<div class="sub">'+bi("Your message","Votre message")+'</div><div class="bubble">'+esc(S.text)+'</div>';}
  else{
    h+='<div class="bubble">'+(Rec.phase==="ready"?bi("Your voice message","Votre message vocal"):bi("Your spoken message","Votre message oral"))+'</div>';
    if(Rec.phase==="ready"){h+='<div class="reccontrols"><button type="button" class="btn secondary" data-rec="hear" aria-pressed="false">'+bin("Hear my recording","Écouter mon enregistrement")+'</button></div>';}
  }
  h+='</div></div>';
  /* lead feedback */
  var missing=[],good=[];
  if(typed){
    ["purpose","info","lesson","ending"].forEach(function(k){(a[k]?good:missing).push(k);});
    var lead;
    if(!missing.length){lead=["Your message achieves its purpose. Ms Hana can understand your request.","Votre message atteint son but. Ms Hana peut comprendre votre demande."];}
    else if(a.purpose){lead=["Your message works so far: your request is clear.","Votre message fonctionne déjà : votre demande est claire."];}
    else{lead=["Your message is a good start.","Votre message est un bon début."];}
    h+='<div class="status ok" id="lead"><span class="mark" aria-hidden="true">✓</span><span>'+bi(lead[0],lead[1])+'</span></div>';
    var feat=good.length?good[0]:null;
    var featHtml=feat?bi("Good: "+GOOD[feat][0]+(feat==="lesson"&&a.words.length?" ("+esc(a.words.join(", "))+")":""),"Bien : "+GOOD[feat][1]):"";
    var next=missing.length?missing[0]:(a.opening?null:"opening");
    var nextHtml=next?bi("Next step: "+SUGG[next][0],"Prochaine étape : "+SUGG[next][1]):"";
    if(featHtml||nextHtml){
      h+='<div class="suggest" role="status" aria-live="polite"><strong>'+bi("Suggestions","Suggestions")+'</strong>';
      if(featHtml){h+='<p>'+featHtml+'</p>';}
      if(nextHtml){h+='<p>'+nextHtml+'</p>';}
      if(missing.length>1){h+='<ul>';missing.slice(1).forEach(function(k){h+='<li>'+bi(SUGG[k][0],SUGG[k][1])+'</li>';});h+='</ul>';}
      h+='</div>';
    }
    h+='<p class="sub">'+bi("Your message stays exactly as you wrote it. These are only suggestions.","Votre message reste exactement comme vous l'avez écrit. Ce sont seulement des suggestions.")+'</p>';
  }else{
    h+='<div class="status ok"><span class="mark" aria-hidden="true">✓</span><span>'+bi("You practised your message. Listen to yourself and tick what you did.","Vous avez pratiqué votre message. Écoutez-vous et cochez ce que vous avez fait.")+'</span></div>';
  }
  /* self check */
  h+='<fieldset><legend>'+bi("Communication check","Vérification de la communication")+'</legend>';
  CHECK_ITEMS.forEach(function(c,i){
    var found="";
    if(typed){found='<span class="found">'+(a[c.key]?"✓ "+bi("Found in your message","Trouvé dans votre message"):"○ "+bi("Not found yet","Pas encore trouvé"))+'</span>';}
    h+='<label class="checkitem" for="ck'+i+'"><input type="checkbox" id="ck'+i+'" data-ck="'+i+'"'+(S.checks[i]?" checked":"")+'>'+
      '<span><span class="ct">'+bi(c.en,c.fr)+'</span><span class="ex">'+bi(c.exEn,c.exFr)+'</span>'+found+'</span></label>';
  });
  h+='</fieldset>';
  /* help */
  if(S.helpBank){
    h+='<div class="sublabel">'+bi("Phrase bank","Banque de phrases")+'</div><div class="bank">';
    EXAMPLE.concat(["What should I do first?"]).forEach(function(t){h+='<button type="button" class="chip" data-bank="'+esc(t)+'">'+esc(t)+(TEXTFR[t]?'<span class="fr" lang="fr">'+esc(TEXTFR[t])+'</span>':'')+'</button>';});
    h+='</div>';
  }
  if(S.helpModel){
    h+='<button type="button" class="btn help small" id="modelBtn" aria-expanded="'+(showModel5?"true":"false")+'" aria-controls="modelBox">'+(showModel5?bin("Hide example","Masquer l'exemple"):bin("Show example","Voir un exemple"))+'</button>'+
      '<div id="modelBox" class="card yellow" style="margin-top:10px"'+(showModel5?"":" hidden")+'><p>'+esc(EXAMPLE.join(" "))+'</p><p class="sub">'+bi("This is only an example. Your message stays the same.","Ceci est seulement un exemple. Votre message reste inchangé.")+'</p></div>';
  }
  /* improve inside the same screen */
  h+='<div style="margin-top:12px"><button type="button" class="btn secondary small" id="improveBtn" aria-expanded="'+(improveOpen?"true":"false")+'" aria-controls="improveBox">'+(improveOpen?bin("Close editor","Fermer l'éditeur"):bin("Improve my message","Améliorer mon message"))+'</button></div>';
  h+='<div id="improveBox" class="card white" style="margin-top:10px"'+(improveOpen?"":" hidden")+'>';
  if(S.mode==="speak"&&!hasTyped()){h+=recControlsHtml();}
  else{
    h+='<label class="lbl" for="edit">'+bi("Your message","Votre message")+'</label>'+
      '<textarea id="edit" maxlength="'+MAX_CHARS+'" autocomplete="off" spellcheck="true">'+esc(S.text)+'</textarea><div class="count" id="ecnt"></div>';
  }
  h+='<div style="margin-top:10px"><button type="button" class="btn primary small" id="recheckBtn">'+bin("Check again","Vérifier de nouveau")+'</button></div></div>';
  h+='</div>';
  $("screen").innerHTML=h;
  qa("[data-ck]").forEach(function(cb){
    cb.addEventListener("change",function(){S.checks[+cb.getAttribute("data-ck")]=cb.checked;save();refreshNav();});
  });
  var ed=$("edit");
  if(ed){
    var upd=function(){$("ecnt").innerHTML=bin(ed.value.length+" of "+MAX_CHARS+" characters",ed.value.length+" caractères sur "+MAX_CHARS);};
    upd();
    ed.addEventListener("input",function(){S.text=ed.value.slice(0,MAX_CHARS);S.rev=null;upd();save();refreshNav();});
  }
  $("improveBtn").addEventListener("click",function(){
    improveOpen=!improveOpen;render();
    var t=improveOpen?($("edit")||$("improveBtn")):$("improveBtn");if(t){t.focus();}
  });
  $("recheckBtn").addEventListener("click",function(){
    if(!hasResponse()){say("Add a message or a recording first.","Ajoutez d'abord un message ou un enregistrement.");return;}
    runReview();render();
    var l=$("lead")||$("screen").querySelector("h2");if(l){l.setAttribute("tabindex","-1");l.focus();}
    say("Message checked.","Message vérifié.");
  });
  var mb=$("modelBtn");
  if(mb){mb.addEventListener("click",function(){
    showModel5=!showModel5;$("modelBox").hidden=!showModel5;
    mb.setAttribute("aria-expanded",showModel5?"true":"false");
    mb.innerHTML=showModel5?bin("Hide example","Masquer l'exemple"):bin("Show example","Voir un exemple");
  });}
  qa("[data-bank]").forEach(function(b){
    b.addEventListener("click",function(){
      if(!improveOpen){improveOpen=true;S.mode="type";render();}
      var e=$("edit");
      if(e){var v=e.value;if(v&&!/\s$/.test(v)){v+=" ";}v=(v+b.getAttribute("data-bank")).slice(0,MAX_CHARS);e.value=v;
        S.text=v;S.rev=null;save();refreshNav();e.focus();
        var c=$("ecnt");if(c){c.innerHTML=bin(v.length+" of "+MAX_CHARS+" characters",v.length+" caractères sur "+MAX_CHARS);}}
    });
  });
  bindRec($("screen"));
}

/* ---- Screen 6 ---- */
function R6(){
  $("screen").innerHTML=
    '<div class="card green">'+
      '<img class="hero" src="'+IMG.task+'" alt="">'+
      '<h2>'+bi("Communication Mission complete.","Mission de communication terminée.")+'</h2>'+
      '<p class="lead">'+bi("You communicated about understanding course instructions.","Vous avez communiqué sur la compréhension des consignes du cours.")+'</p>'+
      '<p>'+bi("Next, you will review, improve and retry.","Ensuite, vous allez réviser, améliorer et réessayer.")+'</p>'+
      '<p id="doneNote" class="sub" aria-live="polite"></p>'+
    '</div>';
  if(completionSent){$("doneNote").innerHTML=bi("Finished.","Terminé.");}
}

/* ============ Buttons ============ */
$("primaryBtn").addEventListener("click",function(){
  var sc=S.screen;
  if(sc===1){goTo(2);}
  else if(sc===2){if(trayOk()){goTo(3);}else{checkPhrases();}}
  else if(sc===3){if(planOk()){goTo(4);}}
  else if(sc===4){if(hasResponse()){goTo(5);}}
  else if(sc===5){if(canFinish()){goTo(6);}}
});
$("secondBtn").addEventListener("click",function(){if(S.screen===2){retryPhrases();}});
$("frBtn").addEventListener("click",function(){
  setFr(!S.fr);
  /* French lines are CSS-driven; refresh dynamic labels */
  render();
  say(S.fr?"French translation on.":"French translation off.",S.fr?"Traduction française activée.":"");
});
doneBtn.addEventListener("click",function(){
  if(doneBtn.disabled){return;}
  activityCompleted();
  doneBtn.innerHTML=bin("Done ✓","Terminé ✓");
  var n=$("doneNote");if(n){n.innerHTML=bi("Finished.","Terminé.");}
  say("Done.","Terminé.");
});
$("tryAgainBtn").addEventListener("click",function(){
  Rec.tok++;clearTimeout(Rec.timer);
  try{if(Rec.mr&&Rec.mr.state!=="inactive"){Rec.mr.stop();}}catch(e){}
  cleanupStream();discardRec();
  var fr=S.fr;
  S=defaultState();S.fr=fr;
  order2=shuffle(PHRASES.map(function(p){return p.id;}));
  s2Msg=null;s2Checked=false;improveOpen=false;showExample3=false;showModel5=false;lastReview=null;
  doneBtn.disabled=true;
  doneBtn.innerHTML="Done";
  lsDel(STORE_KEY);
  var h=getLms();if(h){try{lmsSet(h,"cmi.suspend_data","");}catch(e2){}}
  save();
  goTo(1);
  say("The mission has started again.","La mission recommence.");
});

/* ============ Init ============ */
(function init(){
  var saved=loadSaved();
  S=saved;
  if(lsGet(DONE_KEY)==="1"){/* previously completed on this device: keep Done locked from re-sending */}
  reconcile();
  if(S.screen===5||S.screen===6){
    /* revalidate a restored review against the current message and plan */
    if(S.rev!==stateHash()){S.rev=null;}
    if(S.screen===6&&!canFinish()){S.screen=5;}
  }
  if(S.screen===5&&hasTyped()){lastReview=analyse(S.text);}
  setFr(S.fr);
  render();
})();
})();
</script>
</body>
</html>
