<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Useful English: Asking for a solution</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#E4F5F9;
  --green-tint:#F4F7DA;
  --yellow-tint:#FEF3CD;
  --focus:3px solid #2E2E2D;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#fff;color:var(--pazapa-grey-dark);
  font-family:"Open Sans",Arial,sans-serif;font-size:17px;line-height:1.5;max-width:100%;overflow-x:hidden;}
h1,h2,h3,legend{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;line-height:1.25;margin:0 0 8px 0;}
h2{font-size:24px;}
h2:focus{outline:none;}
p{margin:0 0 10px 0;}
.app{max-width:780px;margin:0 auto;padding:16px 16px 48px 16px;}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:4px solid var(--pazapa-blue);padding-bottom:10px;margin-bottom:16px;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand img{width:124px;height:auto;display:block;}
.brand-text{font-weight:700;font-size:14px;}
.eyebrow{font-size:13px;font-weight:700;}
.topbar h1{font-size:20px;margin:2px 0 0 0;}
.progress{display:flex;align-items:center;gap:10px;flex:1 1 180px;min-width:0;}
.track{flex:1 1 60px;height:10px;background:var(--pazapa-grey-light);border-radius:999px;overflow:hidden;}
.fill{height:100%;background:var(--pazapa-blue-dark);width:16.6%;transition:width .3s ease;}
.plabel{font-size:13px;font-weight:700;white-space:nowrap;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important;}}
button,input,textarea{font-family:inherit;touch-action:manipulation;}
button{font-size:16px;font-weight:700;cursor:pointer;border-radius:999px;min-height:48px;min-width:48px;padding:10px 22px;
  border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:var(--focus);outline-offset:3px;}
button.primary{background:var(--pazapa-blue-dark);border-color:var(--pazapa-blue-dark);color:#fff;}
button.primary:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6b6a;cursor:not-allowed;}
button.ghost{border-color:#9a9a99;}
button.help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
button.lang{padding:8px 16px;border-color:var(--pazapa-blue-dark);color:var(--pazapa-blue-dark);background:#fff;}
button:disabled{cursor:not-allowed;}
.screen[hidden]{display:none;}
.goal{background:var(--blue-tint);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;font-weight:700;}
.card{border:1px solid #bdbdbd;border-radius:var(--radius);padding:16px;margin:0 0 14px 0;background:#fff;}
fieldset.card{min-width:0;}
legend{font-size:18px;padding:0 6px;}
.clue{font-weight:600;margin-bottom:8px;}
.sit{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.sit img{width:92px;height:92px;border-radius:12px;display:block;}
.sit p{flex:1 1 200px;margin:0;font-weight:600;}
.strip{display:flex;gap:14px;align-items:center;border-radius:12px;padding:12px;margin-bottom:10px;background:var(--blue-tint);}
.strip:nth-child(even){background:var(--green-tint);}
.strip img{width:76px;height:76px;border-radius:10px;flex:0 0 auto;}
.strip>div{min-width:0;flex:1 1 auto;}
.strip .ctx{font-size:14px;font-weight:600;opacity:.85;margin:0;}
.strip .sent{font-size:19px;font-weight:700;margin:0;overflow-wrap:anywhere;}
.var{text-decoration:underline;text-decoration-style:dashed;text-decoration-thickness:2px;text-underline-offset:5px;background:var(--yellow-tint);padding:0 4px;border-radius:4px;}
.note{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600;}
.legend-line{font-size:14px;}
.answer-strip,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:10px;min-height:64px;align-items:center;}
.answer-strip{background:var(--blue-tint);border:2px dashed var(--pazapa-blue-dark);}
.bank{background:var(--pazapa-grey-light);margin-top:8px;}
.chip{font-size:16px;font-weight:700;border:2px solid var(--pazapa-blue-dark);background:#fff;border-radius:10px;padding:8px 16px;}
.chip:hover{background:var(--blue-tint);}
.placed{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--pazapa-blue-dark);border-radius:12px;padding:4px 6px;}
.placed.review{border-style:dashed;border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
.placed .num{font-size:12px;font-weight:800;background:var(--pazapa-blue-dark);color:#fff;border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;}
.placed .txt{font-weight:700;padding:0 4px;}
.placed button{padding:4px 10px;min-height:48px;min-width:48px;border-radius:10px;font-size:18px;}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:flex-start;}
.fb[hidden]{display:none;}
.fb .ico{font-weight:800;min-width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border:2px solid var(--pazapa-grey-dark);background:#fff;}
.fb.ok{background:var(--pazapa-green);}
.fb.retry{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);}
.fb.shown{background:var(--blue-tint);border:2px solid var(--pazapa-blue-dark);}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:10px;}
.gap-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:19px;font-weight:700;}
.gap-line input{font-size:18px;font-weight:700;min-height:48px;width:150px;max-width:100%;padding:6px 12px;border:2px solid var(--pazapa-grey-dark);border-radius:10px;}
.choice{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border:2px solid var(--pazapa-blue-dark);border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:700;background:#fff;}
.choice input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--pazapa-blue-dark);}
.choice:has(input:checked){background:var(--blue-tint);}
.choice:has(input:focus-visible){outline:var(--focus);outline-offset:2px;}
textarea{width:100%;min-height:110px;font-size:18px;padding:10px 12px;border:2px solid var(--pazapa-grey-dark);border-radius:10px;resize:vertical;}
.model{background:var(--blue-tint);border-radius:10px;padding:10px 14px;margin-top:10px;font-weight:700;}
.final{background:var(--blue-tint);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.final img{width:150px;height:150px;border-radius:12px;display:block;margin:0 auto 12px auto;}
.confirm{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;margin-top:12px;}
.confirm[hidden]{display:none;}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (max-width:480px){h2{font-size:21px;}.gap-line input{width:130px;}}
</style>
</head>

function norm(s){
  s = String(s == null ? '' : s);
  try{ s = s.normalize('NFKC'); }catch(e){}
  s = s.replace(/[‘’ʼ`´]/g, "'").replace(/[“”]/g, '"');
  s = s.replace(/\s+/g, ' ').trim().toLowerCase();
  s = s.replace(/[.!?,;:]+$/, '').trim();
  return s;
}
function isValid(st){ return st === 'ok' || st === 'shown'; }
function chunkText(it, id){ return it.chunks[id]; }
function orderText(it, o){ return o.split('').map(function(c){ return it.chunks[c]; }).join(' '); }
function buildCorrect(it, st){ return it.ok.indexOf(st.o) !== -1; }
function gapCorrect(it, st){ var v = norm(st.v); return !!v && it.ok.some(function(a){ return norm(a) === v; }); }
function choiceCorrect(it, st){ return st.v === it.ok; }

var REQ_RE = /\b(replace|refund|check)\b|send the correct (item|shirt|bag)/i;
var CLOSE_RE = /thank you|thanks|when will/i;
function appAnalyse(txt){
  var t = String(txt || '').replace(/\s+/g, ' ').trim();
  var sents = t.split(/[.?!]+/).map(function(x){ return x.trim(); }).filter(Boolean);
  return {empty:!t, count:sents.length, req:REQ_RE.test(t), close:CLOSE_RE.test(t)};
}
function appCorrect(st){ var a = appAnalyse(st.txt); return !a.empty && a.count <= 2 && a.req && a.close; }

function itemsValid(n){
  if(n === 2) return CFG.build.every(function(it){ var st = S.b[it.id]; return st.st === 'ok' ? buildCorrect(it, st) : st.st === 'shown'; });
  if(n === 3) return CFG.gaps.every(function(it){ var st = S.g[it.id]; return st.st === 'ok' ? gapCorrect(it, st) : st.st === 'shown'; });
  if(n === 4) return CFG.choices.every(function(it){ var st = S.c[it.id]; return st.st === 'ok' ? choiceCorrect(it, st) : st.st === 'shown'; });
  if(n === 5) return S.p.st === 'ok' ? appCorrect(S.p) : S.p.st === 'shown';
  return true;
}
function allValid(){ return itemsValid(2) && itemsValid(3) && itemsValid(4) && itemsValid(5); }

function findAPI(){

  try{ if(window.opener) wins.push(window.opener); }catch(e){}

}

function lmsSet(k, v){ try{ return String(lms.v === '2004' ? lms.api.SetValue(k, v) : lms.api.LMSSetValue(k, v)); }catch(e){ return 'false'; } }

function snapshot(){
  var b = {}, g = {}, c = {};
  CFG.build.forEach(function(it){ var s = S.b[it.id]; b[it.id] = [s.o, s.att, s.st]; });
  CFG.gaps.forEach(function(it){ var s = S.g[it.id]; g[it.id] = [String(s.v).slice(0, 20), s.att, s.st]; });
  CFG.choices.forEach(function(it){ var s = S.c[it.id]; c[it.id] = [s.v, s.att, s.st]; });
  return {v:SCHEMA, l:S.lang, s:S.screen, b:b, g:g, c:c, p:[String(S.p.txt).slice(0, 200), S.p.att, S.p.st], d:S.completed ? 1 : 0};

function clampAtt(n){ n = Math.floor(Number(n)); return (isFinite(n) && n >= 0) ? Math.min(n, 9) : 0; }
function cleanSt(x){ return (x === 'ok' || x === 'shown' || x === 'wrong') ? x : 'idle'; }
function restore(raw){
  if(!raw || typeof raw !== 'object' || raw.v !== SCHEMA) return false;
  var s = freshState();
  s.lang = raw.l === 'fr' ? 'fr' : 'en';
  CFG.build.forEach(function(it){
    var r = raw.b && raw.b[it.id]; if(!Array.isArray(r)) return;
    var ids = Object.keys(it.chunks), seen = {}, o = '';
    String(r[0] || '').split('').forEach(function(ch){ if(ids.indexOf(ch) !== -1 && !seen[ch]){ seen[ch] = 1; o += ch; } });
    var st = cleanSt(r[2]);
    var cur = {o:o, att:clampAtt(r[1]), st:st, rev:[]};
    if(st === 'ok' && !buildCorrect(it, cur)) cur.st = 'idle';
    if(st === 'wrong') cur.st = 'idle';
    s.b[it.id] = cur;
  });
  CFG.gaps.forEach(function(it){
    var r = raw.g && raw.g[it.id]; if(!Array.isArray(r)) return;
    var cur = {v:String(r[0] == null ? '' : r[0]).slice(0, 20), att:clampAtt(r[1]), st:cleanSt(r[2])};
    if(cur.st === 'ok' && !gapCorrect(it, cur)) cur.st = 'idle';
    if(cur.st === 'wrong') cur.st = 'idle';
    s.g[it.id] = cur;
  });
  CFG.choices.forEach(function(it){
    var r = raw.c && raw.c[it.id]; if(!Array.isArray(r)) return;
    var v = Math.floor(Number(r[0])); if(!(v >= 0 && v < it.opts.length)) v = -1;
    var cur = {v:v, att:clampAtt(r[1]), st:cleanSt(r[2])};
    if(cur.st === 'ok' && !choiceCorrect(it, cur)) cur.st = 'idle';
    if(cur.st === 'wrong') cur.st = 'idle';
    s.c[it.id] = cur;
  });
  if(Array.isArray(raw.p)){
    var p = {txt:String(raw.p[0] == null ? '' : raw.p[0]).slice(0, 200), att:clampAtt(raw.p[1]), st:cleanSt(raw.p[2])};
    if(p.st === 'ok' && !appCorrect(p)) p.st = 'idle';
    if(p.st === 'wrong') p.st = 'idle';
    s.p = p;

  var req = Math.floor(Number(raw.s)); if(!(req >= 1 && req <= TOTAL)) req = 1;
  // never trust a saved screen further than the work genuinely allows
  var max = 1;

  if(itemsValid(2)) max = 3; else max = Math.min(max, 2);
  if(max >= 3 && itemsValid(3)) max = 4; else max = Math.min(max, 3);
  if(max >= 4 && itemsValid(4)) max = 5; else max = Math.min(max, 4);
  if(max >= 5 && itemsValid(5)) max = 6; else max = Math.min(max, 5);
  S.screen = Math.min(req, max);
  S.completed = false;
  return true;
}
function persist(){

  if(str.length > 3500) return;
  try{ window.localStorage.setItem(KEY, str); }catch(e){}

  if(saveTimer) window.clearTimeout(saveTimer);
  saveTimer = window.setTimeout(pushToLMS, 400);
}

}

}
function changeBuild(it, newO, msg, fk){
  var st = S.b[it.id];
  st.o = newO; invalidate(2, st);
  pendingFocus = fk;
  renderBuild(); updateButtons(); persist();
  if(msg) announce(msg);
}
function addChunk(it, cid){
  var st = S.b[it.id];
  var total = Object.keys(it.chunks).length;
  var next = it.bank.split('').filter(function(c){ return c !== cid && st.o.indexOf(c) === -1; })[0];
  var fk = next ? ('B:' + it.id + ':' + next) : ('L:' + it.id + ':' + cid);
  changeBuild(it, st.o + cid, T('aAdd', {w:it.chunks[cid], p:st.o.length + 1, t:total}), fk);
}
function removeChunk(it, pos){
  var st = S.b[it.id];
  var cid = st.o.charAt(pos);
  changeBuild(it, st.o.slice(0, pos) + st.o.slice(pos + 1), T('aRm', {w:it.chunks[cid]}), 'B:' + it.id + ':' + cid);
}
function moveChunk(it, pos, d){
  var st = S.b[it.id];
  var a = st.o.split(''); var np = pos + d;
  if(np < 0 || np >= a.length) return;
  var cid = a[pos]; a.splice(pos, 1); a.splice(np, 0, cid);
  var fk = (d < 0 ? 'L:' : 'R:') + it.id + ':' + cid;
  if((d < 0 && np === 0) || (d > 0 && np === a.length - 1)) fk = (d < 0 ? 'R:' : 'L:') + it.id + ':' + cid;
  changeBuild(it, a.join(''), T('aMove', {w:it.chunks[cid], p:np + 1, t:a.length}), fk);
}
function showBuild(it){
  var st = S.b[it.id]; st.o = it.ok[0]; st.st = 'shown'; st.rev = [];
  renderBuild(); updateButtons(); persist(); announce(shownText('build', it));
}
function checkBuild(){
  var good = 0;
  CFG.build.forEach(function(it){
    var st = S.b[it.id];
    if(isValid(st.st) && (st.st === 'shown' || buildCorrect(it, st))){ good++; return; }
    var total = Object.keys(it.chunks).length;
    if(buildCorrect(it, st)){ st.st = 'ok'; st.rev = []; good++; return; }
    st.st = 'wrong'; if(st.o.length) st.att = Math.min(9, st.att + 1);
    st.rev = [];
    var ref = it.ok[0];
    for(var i = 0; i < st.o.length; i++){ if(st.o.charAt(i) !== ref.charAt(i)) st.rev.push(i); }
  });
  renderBuild(); updateButtons(); persist();
  announce(T('aChecked', {k:good, t:CFG.build.length}) + (itemsValid(2) ? ' ' + T('aCont') : ''));
}

/* ================= Screen 3 ================= */
function usedWords(except){
  var u = {};
  CFG.gaps.forEach(function(it){ if(it.id === except) return; var v = norm(S.g[it.id].v); if(v) u[v] = true; });
  return u;
}
function renderBank3(){
  var bank = $('wordBank'); bank.innerHTML = '';
  bank.setAttribute('aria-label', T('bankLabel'));
  var cur = CFG.gaps[activeGap];
  var used = usedWords(cur ? cur.id : '');
  CFG.gapBank.forEach(function(w){
    var isUsed = !!used[norm(w)];
    bank.appendChild(el('button', {type:'button', class:'chip', lang:'en', text:w, disabled:isUsed ? '' : null, 'aria-disabled':isUsed ? 'true' : null, on:{click:function(){ pickWord(w); }}}));
  });
}
function renderGaps(){
  var box = $('gapItems'); box.innerHTML = '';
  CFG.gaps.forEach(function(it, idx){
    var st = S.g[it.id];
    var input = el('input', {type:'text', id:'in_' + it.id, value:st.v, 'aria-label':T('gapN', {n:idx + 1}) + ': ' + T('typeHere'), autocomplete:'off', autocapitalize:'none', spellcheck:'false', lang:'en'});
    input.addEventListener('focus', function(){ activeGap = idx; renderBank3(); });
    input.addEventListener('input', function(){
      st.v = input.value; invalidate(3, st);
      var f = $('fbg_' + it.id); if(f){ f.hidden = true; f.className = 'fb'; f.innerHTML = ''; }
      var sb = $('sm_' + it.id); if(sb) sb.hidden = !(st.att >= 2);
      renderBank3(); updateButtons(); persist();
    });
    var line = el('div', {class:'gap-line', lang:'en'}, [it.pre, input, it.post]);
    var fbHold = el('div', {id:'fbg_' + it.id});
    var row = el('div', {class:'row'}, []);
    var sm = el('button', {type:'button', class:'help', id:'sm_' + it.id, text:T('showMe'), hidden:(st.att >= 2 && !isValid(st.st)) ? null : '', on:{click:function(){ showGap(it); }}});
    row.appendChild(sm);
    var card = el('fieldset', {class:'card'}, [el('legend', {text:T('gapN', {n:idx + 1})}), el('p', {class:'clue', text:T('clueWord') + ' ' + T('clue_' + it.id)}), line, fbHold, row]);
    box.appendChild(card);
    paintGapFb(it);
  });
  renderBank3();
}
function paintGapFb(it){
  var st = S.g[it.id]; var holder = $('fbg_' + it.id); if(!holder) return;
  holder.innerHTML = '';
  var f = fbBox(st, 'gap', it);
  holder.appendChild(f);
  var sm = $('sm_' + it.id); if(sm) sm.hidden = !(st.att >= 2 && !isValid(st.st));
}
function pickWord(w){
  var idx = activeGap;
  if(S.g[CFG.gaps[idx].id].v){
    for(var i = 0; i < CFG.gaps.length; i++){ if(!S.g[CFG.gaps[i].id].v){ idx = i; break; } }
  }
  activeGap = idx;
  var cur = CFG.gaps[idx];
  var st = S.g[cur.id];
  st.v = w; invalidate(3, st);
  var inp = $('in_' + cur.id); if(inp) inp.value = w;
  paintGapFb(cur);
  renderBank3(); updateButtons(); persist();
  announce(w + ' → ' + T('gapN', {n:idx + 1}));
  if(inp) inp.focus();
}
function showGap(it){
  var st = S.g[it.id]; st.v = it.ok[0]; st.st = 'shown';
  var inp = $('in_' + it.id); if(inp) inp.value = st.v;
  paintGapFb(it); renderBank3(); updateButtons(); persist(); announce(shownText('gap', it));
}
function checkGaps(){
  var good = 0;
  CFG.gaps.forEach(function(it){
    var st = S.g[it.id];
    if(st.st === 'shown'){ good++; return; }
    if(gapCorrect(it, st)){ st.st = 'ok'; good++; }
    else{ st.st = 'wrong'; if(norm(st.v)) st.att = Math.min(9, st.att + 1); }
    paintGapFb(it);
  });
  updateButtons(); persist();
  announce(T('aChecked', {k:good, t:CFG.gaps.length}) + (itemsValid(3) ? ' ' + T('aCont') : ''));
}

/* ================= Screen 4 ================= */
function renderChoices(){
  var box = $('choiceItems'); box.innerHTML = '';
  CFG.choices.forEach(function(it, idx){
    var st = S.c[it.id];
    var name = 'ch_' + it.id;
    var sit = el('div', {class:'sit'}, [
      el('img', {src:IMG[it.img], alt:'', width:92, height:92}),
      el('p', {text:T('sit_' + it.id)})
    ]);
    var group = el('div', {role:'radiogroup', 'aria-label':T('sitN', {n:idx + 1}), style:'margin-top:12px;'});
    it.opts.forEach(function(o, oi){
      var inp = el('input', {type:'radio', name:name, id:name + '_' + oi, value:String(oi)});
      if(st.v === oi) inp.checked = true;
      inp.addEventListener('change', function(){
        st.v = oi; invalidate(4, st);
        renderChoiceFb(it); updateButtons(); persist();
      });
      group.appendChild(el('label', {class:'choice', lang:'en', 'for':name + '_' + oi}, [inp, el('span', {text:o})]));
    });
    var fbHold = el('div', {id:'fbc_' + it.id});
    var row = el('div', {class:'row'}, [el('button', {type:'button', class:'help', id:'smc_' + it.id, text:T('showMe'), hidden:(st.att >= 2 && !isValid(st.st)) ? null : '', on:{click:function(){ showChoice(it); }}})]);
    box.appendChild(el('fieldset', {class:'card'}, [el('legend', {text:T('sitN', {n:idx + 1})}), sit, group, fbHold, row]));
    renderChoiceFb(it);
  });
}
function renderChoiceFb(it){
  var st = S.c[it.id]; var h = $('fbc_' + it.id); if(!h) return;
  h.innerHTML = ''; h.appendChild(fbBox(st, 'choice', it));
  var sm = $('smc_' + it.id); if(sm) sm.hidden = !(st.att >= 2 && !isValid(st.st));
}
function showChoice(it){
  var st = S.c[it.id]; st.v = it.ok; st.st = 'shown';
  var r = document.getElementById('ch_' + it.id + '_' + it.ok); if(r) r.checked = true;
  renderChoiceFb(it); updateButtons(); persist(); announce(shownText('choice', it));
}
function checkChoices(){
  var good = 0;
  CFG.choices.forEach(function(it){
    var st = S.c[it.id];
    if(st.st === 'shown'){ good++; return; }
    if(choiceCorrect(it, st)){ st.st = 'ok'; good++; }
    else{ st.st = 'wrong'; if(st.v >= 0) st.att = Math.min(9, st.att + 1); }
    renderChoiceFb(it);
  });
  updateButtons(); persist();
  announce(T('aChecked', {k:good, t:CFG.choices.length}) + (itemsValid(4) ? ' ' + T('aCont') : ''));
}

/* ================= Screen 5 ================= */
function renderPhrases(){
  var bank = $('phraseBank'); bank.innerHTML = '';
  bank.setAttribute('aria-label', T('s5bank'));
  [['req', 'phReq'], ['close', 'phClose']].forEach(function(g){
    bank.appendChild(el('span', {style:'font-weight:800;font-size:14px;width:100%;', text:T(g[1])}));
    CFG.phrases[g[0]].forEach(function(p){
      bank.appendChild(el('button', {type:'button', class:'chip', lang:'en', text:p, on:{click:function(){ addPhrase(p); }}}));
    });
  });
}
function addPhrase(p){
  var ta = $('msg');
  var t = ta.value.replace(/\s+$/, '');
  ta.value = (t ? t + ' ' : '') + p;
  if(ta.value.length > 200) ta.value = ta.value.slice(0, 200);
  onMsgChange();
  announce('"' + p + '"');
}
function onMsgChange(){
  S.p.txt = $('msg').value;
  invalidate(5, S.p);
  paint5(); updateButtons(); persist();
}
function paint5(){
  var st = S.p;
  var fb = $('fb5'), sg = $('sugg5'), md = $('model5'), sm = $('show5');
  fb.hidden = true; fb.className = 'fb'; fb.innerHTML = ''; sg.innerHTML = ''; md.hidden = true;
  sm.hidden = !(st.att >= 2 && !isValid(st.st));
  if(st.st === 'ok'){
    fb.hidden = false; fb.className = 'fb ok';
    fb.appendChild(el('span', {class:'ico', 'aria-hidden':'true', text:'✓'})); fb.appendChild(el('span', {text:T('appOk')}));
    suggestion();
  } else if(st.st === 'shown'){
    fb.hidden = false; fb.className = 'fb shown';
    fb.appendChild(el('span', {class:'ico', 'aria-hidden':'true', text:'i'})); fb.appendChild(el('span', {text:T('appShown')}));
    md.hidden = false; md.setAttribute('lang', 'en'); md.textContent = T('appModel', {m:CFG.model});
  } else if(st.st === 'wrong'){
    var a = appAnalyse(st.txt);
    var msgs = [];
    if(a.empty) msgs.push(T('appEmpty'));
    else{
      if(a.count > 2) msgs.push(T('appTooLong'));
      if(!a.req) msgs.push(T('appNeedReq'));
      if(!a.close) msgs.push(T('appNeedClose'));
    }
    fb.hidden = false; fb.className = 'fb retry';
    fb.appendChild(el('span', {class:'ico', 'aria-hidden':'true', text:'!'}));
    var box = el('span', null, msgs.map(function(m){ return el('span', {style:'display:block;', text:m}); }));
    fb.appendChild(box);
    suggestion();
  }
}
function suggestion(){
  var t = S.p.txt.replace(/\s+/g, ' ').trim();
  if(!t) return;
  var fixed = (t.match(/[^.?!]+[.?!]*/g) || [t]).map(function(x){
    x = x.trim(); x = x.charAt(0).toUpperCase() + x.slice(1);
    if(!/[.?!]$/.test(x)) x += /^(when|can|could|will|do|does)\b/i.test(x) ? '?' : '.';
    return x;
  }).join(' ');
  if(fixed !== t){ $('sugg5').appendChild(el('p', {style:'margin-top:8px;font-size:15px;', lang:'en', text:T('fixIt', {s:fixed})})); }
}
function check5(){
  var st = S.p;
  if(st.st === 'shown') return;
  st.txt = $('msg').value;
  if(appCorrect(st)){ st.st = 'ok'; }
  else{ st.st = 'wrong'; st.att = Math.min(9, st.att + 1); }
  paint5(); updateButtons(); persist();
  announce(st.st === 'ok' ? T('appOk') + ' ' + T('aCont') : $('fb5').textContent);
}
function show5(){
  var st = S.p; st.st = 'shown'; st.txt = CFG.model; $('msg').value = CFG.model;
  paint5(); updateButtons(); persist(); announce(T('appShown'));
}

/* ================= Try again ================= */
function fullReset(){
  var lang = S.lang;
  S = freshState(); S.lang = lang;
  completionSent = false; activeGap = 0;
  $('msg').value = '';
  clearSaved();
  renderAll();
  $('confirm').hidden = true;
  show(1, true);
  window.scrollTo(0, 0);
}

/* ================= Wiring ================= */
function renderAll(){
  applyStatic();
  buildStrips(); renderBuild(); renderGaps(); renderChoices(); renderPhrases();
  $('msg').value = S.p.txt; paint5();
  updateChrome(); updateButtons();
}
$('langBtn').addEventListener('click', function(){
  S.lang = S.lang === 'en' ? 'fr' : 'en';
  var keepFocus = document.activeElement && document.activeElement.id === 'langBtn';
  renderAll(); persist();
  if(keepFocus) $('langBtn').focus();
  announce(S.lang === 'fr' ? 'Instructions en français.' : 'Instructions in English.');
});
$('c1').addEventListener('click', function(){ show(2, true); window.scrollTo(0, 0); });
$('k2').addEventListener('click', checkBuild);
$('k3').addEventListener('click', checkGaps);
$('k4').addEventListener('click', checkChoices);
$('k5').addEventListener('click', check5);
[2,3,4,5].forEach(function(n){ $('c' + n).addEventListener('click', function(){ goNext(n); }); });
$('msg').addEventListener('input', onMsgChange);
$('clearMsg').addEventListener('click', function(){ $('msg').value = ''; onMsgChange(); $('msg').focus(); });
$('show5').addEventListener('click', show5);
$('tryAgain').addEventListener('click', function(){ $('confirm').hidden = false; $('yesRetry').focus(); });
$('noRetry').addEventListener('click', function(){ $('confirm').hidden = true; $('tryAgain').focus(); });
$('yesRetry').addEventListener('click', fullReset);
doneBtn.addEventListener('click', function(){
  if(doneBtn.disabled) return;
  if(S.screen !== TOTAL || !allValid()) return;
  activityCompleted();
  S.completed = true;
  doneBtn.disabled = true;
  doneBtn.textContent = T('doneOk');
  $('doneNote').textContent = T('doneNote');
  announce(T('doneNote'));
  persist();
});

/* ================= Boot ================= */
(function boot(){
  var raw = loadSaved();
  if(raw) restore(raw);
  renderAll();
  show(S.screen, false);
  try{ if(window.localStorage.getItem(KEY + '_done') === '1' && S.screen === TOTAL){ /* completion already sent earlier; Done stays available for this session */ } }catch(e){}
  // re-detect an LMS API after the first interaction
  document.addEventListener('click', function(){ if(!lms) ensureLMS(); }, {once:true});
  if(typeof module !== 'undefined'){ module.exports = {norm:norm, appAnalyse:appAnalyse}; }
})();
})();
</script>
