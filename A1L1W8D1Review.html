<!DOCTYPE html>
<html lang="en-GB" data-ui="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading, listening, and writing check — Review, improve and retry</title>
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-tint:#EAF8FB;
  --green-tint:#F4F8D9;
  --yellow-tint:#FFF4CC;
  --muted:#4a4a48;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--pazapa-grey-light);color:var(--pazapa-grey-dark);font-family:"Open Sans",Arial,sans-serif;font-size:1rem;line-height:1.55;}
h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;line-height:1.25;margin:0 0 .5em;}
.app{max-width:780px;margin:0 auto;min-height:100vh;background:#fff;border-top:8px solid var(--pazapa-blue);}
header.top{padding:16px 20px 12px;border-bottom:1px solid var(--pazapa-grey-light);}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.logo{height:40px;width:auto;display:block;}
.eyebrow{margin:12px 0 2px;color:var(--pazapa-blue-dark);font-weight:700;font-size:.9rem;}
h1{font-size:1.3rem;margin:0;}
main{padding:20px;}
.screen[hidden]{display:none;}
.screen h2{font-size:1.4rem;color:var(--pazapa-grey-dark);}
.screen h2:focus{outline:none;}
.lead{color:var(--muted);margin:0 0 16px;}
.card{background:var(--blue-tint);border-radius:14px;padding:16px;margin:0 0 16px;}
.card.green{background:var(--green-tint);}
.card.yellow{background:var(--yellow-tint);}
.card h3{font-size:1.05rem;}
.small{font-size:.92rem;color:var(--muted);margin:.25em 0 .75em;}
.pic{display:block;width:100%;max-width:240px;height:auto;border-radius:12px;margin:0 auto 12px;}
.pic.sm{max-width:150px;margin:0;}
.pics{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.btn{min-height:48px;min-width:48px;padding:12px 22px;border-radius:12px;border:2px solid var(--pazapa-blue-dark);background:var(--pazapa-blue-dark);color:#fff;font:700 1rem "Open Sans",Arial,sans-serif;cursor:pointer;touch-action:manipulation;}
.btn.sec{background:#fff;color:var(--pazapa-blue-dark);}
.btn:disabled{background:#d9dfe0;border-color:#d9dfe0;color:#4a4a48;cursor:not-allowed;}
.btn.sec:disabled{background:#fff;border-color:#c5ced0;color:#6a6a68;}
.btn.link{border:none;background:none;color:var(--pazapa-blue-dark);text-decoration:underline;padding:10px 4px;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 6px #fff;}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}
.opts{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
.opt{min-height:48px;padding:12px 16px;border-radius:12px;border:2px solid var(--pazapa-blue-dark);background:#fff;color:var(--pazapa-grey-dark);font:600 1rem "Open Sans",Arial,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation;}
.opt:hover:not(:disabled){background:var(--blue-tint);}
.opt.ok{background:var(--green-tint);border-color:#7d8a12;}
.opt.ok::after{content:" \2713";font-weight:700;}
.opt.try{background:var(--yellow-tint);border-color:#a37a00;}
.opt.try::after{content:" \21BB";font-weight:700;}
.opt:disabled{cursor:default;color:var(--pazapa-grey-dark);}
.fb{margin:8px 0 0;font-size:.95rem;min-height:1.4em;}
.hint{background:var(--yellow-tint);border-left:6px solid var(--pazapa-yellow);padding:8px 12px;margin:8px 0;border-radius:8px;font-size:.95rem;}
.stem{font-weight:700;margin:0 0 6px;}
.target{font-weight:700;font-size:1.05rem;margin:4px 0;}
.gloss{display:none;font-size:.9rem;font-weight:400;font-style:italic;color:var(--muted);}
html[data-ui="fr"] .gloss{display:block;}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0;}
legend{font-weight:700;padding:0;margin-bottom:8px;}
.choice{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px;border:2px solid var(--pazapa-blue);border-radius:12px;margin:0 0 10px;background:#fff;cursor:pointer;touch-action:manipulation;}
.choice input{width:24px;height:24px;flex:0 0 24px;margin:2px 0 0;accent-color:var(--pazapa-blue-dark);}
.choice.disabled{opacity:.7;cursor:default;}
.tag{display:inline-block;background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;}
textarea{width:100%;min-height:120px;padding:12px;border:2px solid var(--pazapa-blue-dark);border-radius:12px;font:1rem "Open Sans",Arial,sans-serif;color:var(--pazapa-grey-dark);resize:vertical;}
.readonly{background:#f6f6f6;border:2px solid #d0d0d0;border-radius:12px;padding:12px;margin:0 0 12px;white-space:pre-wrap;word-break:break-word;}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
@media (max-width:560px){.compare{grid-template-columns:1fr;}}
.compare .card{margin:0;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none;}
.bank li{background:#fff;border:2px solid var(--pazapa-blue);border-radius:12px;padding:8px 12px;}
.bank button{min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--pazapa-blue-dark);background:#fff;color:var(--pazapa-grey-dark);font:600 .95rem "Open Sans",Arial,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation;}
ul.clean{margin:0 0 8px;padding-left:1.2em;}
.status{font-size:.95rem;min-height:1.4em;margin:6px 0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.donemsg{font-weight:700;margin:14px 0 0;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <img class="logo" data-img="logo" alt="Pazapa">
      <button type="button" class="btn sec" id="langBtn"></button>
    </div>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="h1"></h1>
  </header>

  <main>
    <!-- SCREEN 1 -->
    <section class="screen" id="screen-0" aria-labelledby="h-0">
      <h2 id="h-0" tabindex="-1" data-t="s1_h"></h2>
      <div class="pics"><img class="pic sm" data-img="form" alt=""><img class="pic sm" data-img="notice" alt=""></div>
      <p class="lead" data-t="s1_welcome"></p>
      <fieldset>
        <legend data-t="s1_q"></legend>
        <div id="goalOpts"></div>
      </fieldset>
      <p class="fb" id="goalFb"></p>
      <div class="card"><p style="margin:0" data-t="s1_plan"></p></div>
      <div class="actions"><button type="button" class="btn" id="btnStart" data-t="btn_start"></button></div>
    </section>

    <!-- SCREEN 2 -->
    <section class="screen" id="screen-1" aria-labelledby="h-1" hidden>
      <h2 id="h-1" tabindex="-1" data-t="s2_h"></h2>
      <p class="lead" data-t="s2_intro"></p>
      <div id="recall"></div>
      <div class="actions"><button type="button" class="btn" id="btnRecallNext" data-t="btn_continue"></button></div>
    </section>

    <!-- SCREEN 3 -->
    <section class="screen" id="screen-2" aria-labelledby="h-2" hidden>
      <h2 id="h-2" tabindex="-1" data-t="s3_h"></h2>
      <img class="pic" data-img="request" alt="">
      <div class="card">
        <p style="margin:0 0 8px"><strong data-t="s3_situation"></strong></p>
        <p style="margin:0"><span data-t="s3_purpose"></span></p>
      </div>
      <p class="small" data-t="s3_rule"></p>
      <label for="firstText" class="stem" data-t="s3_label"></label>
      <textarea id="firstText" rows="5" maxlength="400" autocomplete="off" spellcheck="true"></textarea>
      <div id="recFirst" style="margin-top:14px"></div>
      <p class="status" id="firstNeed" data-t="s3_need"></p>
      <div class="actions"><button type="button" class="btn" id="btnFirst" data-t="btn_review_first"></button></div>
    </section>

    <!-- SCREEN 4 -->
    <section class="screen" id="screen-3" aria-labelledby="h-3" hidden>
      <h2 id="h-3" tabindex="-1" data-t="s4_h"></h2>
      <p class="lead" data-t="s4_sub"></p>
      <div class="card">
        <h3 data-t="s4_first"></h3>
        <div id="s4First"></div>
      </div>
      <div class="card green">
        <h3 data-t="s4_well"></h3>
        <ul class="clean" id="s4Well"></ul>
      </div>
      <fieldset>
        <legend data-t="s4_choose"></legend>
        <p class="small" data-t="s4_choose_note"></p>
        <div id="focusOpts"></div>
      </fieldset>
      <div class="card yellow">
        <h3 data-t="s4_bank"></h3>
        <ul class="bank" id="s4Bank"></ul>
        <div class="row"><button type="button" class="btn sec" id="btnExample" aria-expanded="false" aria-controls="exampleBox"></button></div>
        <div id="exampleBox" hidden></div>
      </div>
      <div class="actions"><button type="button" class="btn" id="btnSecond" data-t="btn_second"></button></div>
    </section>

    <!-- SCREEN 5 -->
    <section class="screen" id="screen-4" aria-labelledby="h-4" hidden>
      <h2 id="h-4" tabindex="-1" data-t="s5_h"></h2>
      <div class="card">
        <h3 data-t="s5_first_saved"></h3>
        <div id="s5First"></div>
      </div>
      <div class="card yellow">
        <p style="margin:0 0 6px"><strong data-t="s5_apply"></strong></p>
        <ul class="clean" id="s5Focus"></ul>
      </div>
      <label for="secondText" class="stem" data-t="s5_label"></label>
      <textarea id="secondText" rows="5" maxlength="400" autocomplete="off" spellcheck="true"></textarea>
      <div class="row"><button type="button" class="btn sec" id="btnCopy" data-t="s5_copy"></button></div>
      <p class="stem" style="margin-top:14px" data-t="s5_bank"></p>
      <ul class="bank" id="s5Bank"></ul>
      <div id="recSecond" style="margin-top:14px"></div>
      <p class="status" id="secondNeed"></p>
      <div class="actions"><button type="button" class="btn" id="btnCompare" data-t="btn_compare"></button></div>
    </section>

    <!-- SCREEN 6 -->
    <section class="screen" id="screen-5" aria-labelledby="h-5" hidden>
      <h2 id="h-5" tabindex="-1" data-t="s6_h"></h2>
      <div class="compare" id="s6Compare"></div>
      <div class="card green">
        <p style="margin:0" id="s6Summary"></p>
        <p class="small" style="margin:8px 0 0" data-t="s6_note"></p>
      </div>
      <fieldset>
        <legend data-t="s6_reflect_q"></legend>
        <div id="reflOpts"></div>
      </fieldset>
      <div class="actions"><button type="button" class="btn" id="btnFinish" data-t="btn_finish"></button></div>
    </section>

    <!-- SCREEN 7 -->
    <section class="screen" id="screen-6" aria-labelledby="h-6" hidden>
      <h2 id="h-6" tabindex="-1" data-t="s7_review"></h2>
      <img class="pic" data-img="appointment" alt="">
      <p class="lead" data-t="s7_sub"></p>
      <div class="card yellow">
        <h3 data-t="s7_week_h"></h3>
        <p style="margin:0" data-t="s7_week"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="doneBtn" data-t="btn_done"></button>
        <button type="button" class="btn sec" id="retryBtn" data-t="btn_retry"></button>
      </div>
      <p class="donemsg" id="doneMsg" role="status"></p>
    </section>
  </main>
  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
</div>

/* ---------- deterministic checks ---------- */
var RX={
 greeting:/\b(hello|hi|dear|good (morning|afternoon|evening))\b/,
 purpose:/\b((could|can|would) you|please|help|explain)\b/,
 info:/\b(homework|form|appointment|notice|time|when|monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|today)\b|o'clock|\b\d{1,2}([:.]\d{2})?\s?(am|pm)?\b/,
 phrase:/could you explain|please return the form|the appointment is at|my phone number is|thank you for your help|when should i return/,
 ending:/\b(thank you|thanks|thank)\b/
};
function norm(s){return String(s||"").normalize("NFKC").replace(/[‘’ʼ`]/g,"'").replace(/\s+/g," ").trim().toLowerCase().replace(/[.!?…]+$/,"");}
function words(s){return String(s||"").trim().split(/\s+/).filter(Boolean).length;}
function analyze(text){
 var n=norm(text), r={};
 Object.keys(RX).forEach(function(k){r[k]=RX[k].test(n);});
 var g=n.search(RX.greeting);
 var mids=[n.search(RX.purpose),n.search(RX.info)].filter(function(x){return x>=0;});
 var mid=mids.length?Math.min.apply(null,mids):-1;
 var em=RX.ending.exec(n), e=em?em.index:-1;
 r.order=(g<0||mid<0||g<=mid)&&(e<0||mid<0||e>=mid);
 r.count=(r.greeting?1:0)+(r.purpose?1:0)+(r.info?1:0)+(r.ending?1:0);
 return r;
}
function focusDone(a,k){
 if(k==="meaning")return a.purpose&&a.info;
 if(k==="phrase")return a.phrase;
 if(k==="ending")return a.ending;
 if(k==="order")return a.order&&a.count>=3;
 return false;
}
function suggestions(a){
 var out=[];
 if(!a.purpose||!a.info)out.push({k:"meaning",s:!a.info&&a.purpose?"sug_info":"sug_purpose"});
 if(!a.ending)out.push({k:"ending",s:"sug_ending"});
 if(!a.phrase)out.push({k:"phrase",s:"sug_phrase"});
 if(!a.order)out.push({k:"order",s:"sug_order"});
 return out.slice(0,2);
}

function cleanText(s){return typeof s==="string"?s.slice(0,400):"";}
function sanitize(o){
 var s=blank();
 if(!o||typeof o!=="object"||o.v!==VER)return s;
 s.screen=(typeof o.screen==="number"&&o.screen>=0&&o.screen<=6)?Math.floor(o.screen):0;
 s.lang=o.lang==="fr"?"fr":"en";
 s.goal=o.goal===true;
 if(o.rc&&typeof o.rc==="object"){ITEMS.forEach(function(it){var x=o.rc[it.id]; if(x&&typeof x==="object"){s.rc[it.id]={sel:(typeof x.sel==="number"&&x.sel>=0&&x.sel<it.opts.length)?x.sel:null,h:(typeof x.h==="number"&&x.h>=0&&x.h<=2)?Math.floor(x.h):0};}});}
 if(o.first&&typeof o.first==="object")s.first={text:cleanText(o.first.text),spoken:o.first.spoken===true};
 if(Array.isArray(o.focus))s.focus=o.focus.filter(function(k){return FOCI.indexOf(k)>=0;}).slice(0,2);
 s.model=o.model===true;
 if(o.second&&typeof o.second==="object")s.second={text:cleanText(o.second.text),spoken:o.second.spoken===true};
 if(Array.isArray(o.refl))s.refl=o.refl.filter(function(k){return REFL.indexOf(k)>=0;});
 s.draftFirst=cleanText(o.draftFirst);s.draftSecond=cleanText(o.draftSecond);

 return s;
}

  !!state.second&&validSecond(state.second.text,state.second.spoken),

}

function persistNow(){
 var s=JSON.stringify(state);
 lsSet(KEY,s);
 if(discover()){
  lmsInit();
  if(s.length<3500){
   if(lmsSet("cmi.suspend_data",s))lmsCommit();
  }
 }
}
function save(immediate){
 if(immediate){clearTimeout(saveTimer);persistNow();return;}
 clearTimeout(saveTimer);saveTimer=setTimeout(persistNow,600);
}
function load(){
 var raw=null;
 if(discover()){lmsInit();var sd=lmsGet("cmi.suspend_data");if(sd&&sd.length<60000)raw=sd;}
 if(!raw)raw=lsGet(KEY);

}

var DONE_OK=["completed","passed"];
function activityCompleted(){

   lmsInit();
   var sk=LMS.v==="2004"?"cmi.completion_status":"cmi.core.lesson_status";
   var cur=lmsGet(sk).toLowerCase();
   if(DONE_OK.indexOf(cur)>=0){ok=true;}
   else{
    var a=lmsSet(sk,"completed");
    var b=lmsCommit();
    var v=lmsGet(sk).toLowerCase();
    ok=a&&b&&(DONE_OK.indexOf(v)>=0||v==="");
   }
  }else{
   lsSet(DONEKEY,"completed");ok=true;
  }
 }catch(e){ok=false;}
 lsSet(DONEKEY,"completed");
 completionSent=true;

}

  "<label class=\"choice\"><input type=\"checkbox\" data-r=\"spoken\"><span data-t=\"rec_spoken\"></span></label>"+
  "</fieldset>";
 function q(r){return host.querySelector("[data-r=\""+r+"\"]");}
 var bRec=q("rec"),bStop=q("stop"),bPlay=q("play"),bAgain=q("again"),st=q("status"),au=q("audio"),sp=q("spoken");
 function status(k){st.setAttribute("data-t",k);st.textContent=t(k);}
 function buttons(recording){
  bRec.disabled=recording||starting;bStop.disabled=!recording;
  bPlay.disabled=recording||!hasAudio;bAgain.disabled=recording||!hasAudio;
 }
 function release(){
  if(stream){try{stream.getTracks().forEach(function(tr){tr.stop();});}catch(e){} stream=null;}
 }
 function revoke(){if(url){try{URL.revokeObjectURL(url);}catch(e){} url=null;} au.removeAttribute("src");}
 function discard(){
  if(mr&&mr.state!=="inactive"){try{mr.onstop=null;mr.stop();}catch(e){}}
  release();revoke();hasAudio=false;chunks=[];mr=null;
 }
 function begin(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){status("rec_unsupported");return;}
  starting=true;buttons(false);status("rec_asking");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
   starting=false;stream=s;chunks=[];
   try{mr=new MediaRecorder(s);}catch(e){release();status("rec_fail");buttons(false);return;}
   mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data);};
   mr.onerror=function(){release();status("rec_fail");buttons(false);};
   mr.onstop=function(){
    release();
    var blob=chunks.length?new Blob(chunks,{type:(mr&&mr.mimeType)||"audio/webm"}):null;
    if(!blob||blob.size<200){hasAudio=false;status("rec_empty");buttons(false);return;}
    revoke();url=URL.createObjectURL(blob);au.src=url;hasAudio=true;status("rec_ready");buttons(false);
   };
   try{mr.start();}catch(e){release();status("rec_fail");buttons(false);return;}
   status("rec_recording");buttons(true);bStop.focus();
  }).catch(function(err){
   starting=false;
   var n=err&&err.name;
   if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError")status("rec_denied");
   else if(n==="NotFoundError"||n==="DevicesNotFoundError"||n==="OverconstrainedError")status("rec_nodevice");
   else status("rec_fail");
   buttons(false);
  });
 }
 bRec.addEventListener("click",function(){discard();begin();});
 bStop.addEventListener("click",function(){if(mr&&mr.state!=="inactive"){try{mr.stop();}catch(e){release();status("rec_fail");buttons(false);}}});
 bPlay.addEventListener("click",function(){
  if(!hasAudio)return;
  try{au.currentTime=0;var p=au.play();status("rec_playing");if(p&&p.catch)p.catch(function(){status("rec_fail");});}catch(e){status("rec_fail");}
 });
 au.addEventListener("ended",function(){status("rec_ready");});
 bAgain.addEventListener("click",function(){discard();buttons(false);begin();});
 sp.addEventListener("change",function(){setSpoken(sp.checked);});
 sp.checked=!!getSpoken();
 var api={
  reset:function(){discard();buttons(false);status("rec_idle");sp.checked=false;},
  destroy:function(){discard();},
  sync:function(){sp.checked=!!getSpoken();},
  apply:function(){
   host.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"));});
  }
 };
 recorders.push(api);
 buttons(false);
 return api;
}
function destroyAudio(){recorders.forEach(function(r){r.destroy();});}
window.addEventListener("pagehide",destroyAudio);
window.addEventListener("beforeunload",destroyAudio);

/* ---------- Screen 3 ---------- */
var recFirst,recSecond;
function updateFirstNeed(){
 var ta=$("firstText");
 var ok=validFirst(ta.value,state.spokenFirst);
 $("firstNeed").textContent=ok?"":t("s3_need");
 return ok;
}

/* ---------- Screen 4 ---------- */
function firstBlock(host,fa){
 host.innerHTML="";
 if(!fa)return;
 if(fa.text){var d=document.createElement("div");d.className="readonly";d.setAttribute("lang","en-GB");d.textContent=fa.text;host.appendChild(d);}
 if(fa.spoken){var p=document.createElement("p");p.className="small";p.textContent=t("s4_spoken_only");host.appendChild(p);}
}
function renderS4(){
 var fa=state.first;if(!fa)return;
 firstBlock($("s4First"),fa);
 var well=$("s4Well");well.innerHTML="";
 var a=analyze(fa.text),sug=[];
 var added=0;
 ["purpose","info","greeting","phrase","ending"].forEach(function(k){
  if(a[k]){var li=document.createElement("li");li.textContent=t("ok_"+k);well.appendChild(li);added++;}
 });
 if(!added){var l2=document.createElement("li");l2.textContent=fa.text?t("ok_started"):t("ok_spoken");well.appendChild(l2);}
 if(fa.text)sug=suggestions(a);
 var host=$("focusOpts");host.innerHTML="";
 FOCI.forEach(function(k){
  var lab=document.createElement("label");lab.className="choice";
  var inp=document.createElement("input");inp.type="checkbox";inp.value=k;inp.checked=state.focus.indexOf(k)>=0;
  inp.disabled=!inp.checked&&state.focus.length>=2;
  if(inp.disabled)lab.classList.add("disabled");
  var span=document.createElement("span");span.textContent=t("f_"+k);
  var sg=sug.filter(function(x){return x.k===k;})[0];
  if(sg){var tg=document.createElement("span");tg.className="tag";tg.textContent=t("suggested");span.appendChild(tg);
   var sm=document.createElement("span");sm.className="small";sm.style.display="block";sm.style.margin="2px 0 0";sm.textContent=t(sg.s);span.appendChild(sm);}
  inp.addEventListener("change",function(){
   var i=state.focus.indexOf(k);
   if(inp.checked&&i<0&&state.focus.length<2)state.focus.push(k);
   if(!inp.checked&&i>=0)state.focus.splice(i,1);
   state.second=null;state.refl=[];
   renderS4();updateButtons();save();
   var again=$("focusOpts").querySelector("input[value=\""+k+"\"]");if(again)again.focus({preventScroll:true});
  });
  lab.appendChild(inp);lab.appendChild(span);host.appendChild(lab);
 });
 var bank=$("s4Bank");bank.innerHTML="";
 BANK.forEach(function(b){
  var li=document.createElement("li");
  li.innerHTML="<span lang=\"en-GB\">"+esc(b.en)+"</span><span class=\"gloss\" lang=\"fr\">"+esc(b.fr)+"</span>";
  bank.appendChild(li);
 });
 var ex=$("exampleBox");
 $("btnExample").textContent=ex.hidden?t("ex_show"):t("ex_hide");
 if(!ex.hidden){
  ex.innerHTML="<div class=\"readonly\" lang=\"en-GB\" style=\"margin-top:10px\">"+esc(EXAMPLE.en)+"</div><span class=\"gloss\" lang=\"fr\">"+esc(EXAMPLE.fr)+"</span><p class=\"small\">"+esc(t("ex_note"))+"</p>";
 }
}

/* ---------- Screen 5 ---------- */
function renderS5(){
 var fa=state.first;if(!fa)return;
 firstBlock($("s5First"),fa);
 var ul=$("s5Focus");ul.innerHTML="";
 state.focus.forEach(function(k){var li=document.createElement("li");li.textContent=t("f_"+k);ul.appendChild(li);});
 var bank=$("s5Bank");bank.innerHTML="";
 BANK.forEach(function(b){
  var li=document.createElement("li");li.style.padding="4px";
  var btn=document.createElement("button");btn.type="button";btn.setAttribute("lang","en-GB");
  btn.innerHTML="+ "+esc(b.en)+"<span class=\"gloss\" lang=\"fr\">"+esc(b.fr)+"</span>";
  btn.addEventListener("click",function(){
   var ta=$("secondText");var v=ta.value;
   ta.value=(v&&!/\s$/.test(v)?v+" ":v)+b.en;
   onSecondInput();ta.focus();
  });
  li.appendChild(btn);bank.appendChild(li);
 });
 updateSecondNeed();
}
function secondDraftValid(){return validSecond($("secondText").value,state.spokenSecond);}
function updateSecondNeed(){
 var ok=secondDraftValid();
 var need=$("secondNeed");
 if(ok)need.textContent=t("s5_ready");
 else need.textContent=t("s5_same");
 return ok;
}
function onSecondInput(){
 state.draftSecond=$("secondText").value;
 state.second=null;state.refl=[];
 updateSecondNeed();updateButtons();save();
}

/* ---------- Screen 6 ---------- */
function partList(a){
 return ["purpose","info","greeting","phrase","ending"].filter(function(k){return a[k];});
}
function joinParts(keys){return keys.map(function(k){return t("part_"+k);}).join(ui==="fr"?", ":", ");}
function renderS6(){
 var f=state.first,s=state.second;if(!f||!s)return;
 var cmp=$("s6Compare");cmp.innerHTML="";
 [[f,"s6_first"],[s,"s6_second"]].forEach(function(p){
  var c=document.createElement("div");c.className="card";
  var h=document.createElement("h3");h.textContent=t(p[1]);c.appendChild(h);
  if(p[0].text){var d=document.createElement("div");d.className="readonly";d.setAttribute("lang","en-GB");d.style.background="#fff";d.textContent=p[0].text;c.appendChild(d);}
  if(p[0].spoken){var sp=document.createElement("p");sp.className="small";sp.textContent=t("spoken_lbl");c.appendChild(sp);}
  cmp.appendChild(c);
 });
 var fa=analyze(f.text),sa=analyze(s.text);
 var gained=partList(sa).filter(function(k){return !fa[k];});
 var msg;
 if(s.text&&gained.length)msg=t("sum_gain",{x:joinParts(gained)});
 else if(s.text&&partList(sa).length)msg=t("sum_keep",{x:joinParts(partList(sa))});
 else if(!s.text&&s.spoken)msg=t("sum_spoken");
 else msg=t("sum_try");
 var done=s.text?state.focus.filter(function(k){return focusDone(sa,k);}):[];
 if(done.length)msg+=" "+t("sum_focus_yes",{x:done.map(function(k){return t("f_"+k).toLowerCase();}).join(" / ")});
 $("s6Summary").textContent=msg;
 var host=$("reflOpts");host.innerHTML="";
 REFL.forEach(function(k){
  var lab=document.createElement("label");lab.className="choice";
  var inp=document.createElement("input");inp.type="checkbox";inp.value=k;inp.checked=state.refl.indexOf(k)>=0;
  inp.addEventListener("change",function(){
   var i=state.refl.indexOf(k);
   if(inp.checked&&i<0)state.refl.push(k);
   if(!inp.checked&&i>=0)state.refl.splice(i,1);
   updateButtons();save();
  });
  var sp2=document.createElement("span");sp2.textContent=t("r_"+k);
  lab.appendChild(inp);lab.appendChild(sp2);host.appendChild(lab);
 });
}

/* ---------- buttons ---------- */
var btnStart=$("btnStart"),btnRecallNext=$("btnRecallNext"),btnFirst=$("btnFirst"),btnSecond=$("btnSecond"),btnCompare=$("btnCompare"),btnFinish=$("btnFinish"),doneBtn=$("doneBtn"),retryBtn=$("retryBtn");
doneBtn.disabled=true;
function updateButtons(){
 btnStart.disabled=!state.goal;
 btnRecallNext.disabled=!ITEMS.every(function(it){return recallOk(it.id);});
 btnFirst.disabled=!validFirst($("firstText").value,state.spokenFirst);
 btnSecond.disabled=!(state.focus.length>=1);
 btnCompare.disabled=!secondDraftValid();
 btnFinish.disabled=!(state.refl.length>=1);
 doneBtn.disabled=!(cur===6&&isComplete())||doneShown;
 $("doneMsg").textContent=doneShown?t("done_msg"):"";
}

function renderAll(){
 applyStatic();
 recorders.forEach(function(r){r.apply();});
 updateFirstNeed();
 renderGoals();
 renderRecall();
 renderS4();
 renderS5();
 renderS6();
 updateButtons();
}

/* ---------- events ---------- */
$("langBtn").addEventListener("click",function(){
 ui=ui==="fr"?"en":"fr";state.lang=ui;renderAll();save();
 announce(ui==="fr"?"Français":"English");
 $("langBtn").focus({preventScroll:true});
});
btnStart.addEventListener("click",function(){if(state.goal)show(1);});
btnRecallNext.addEventListener("click",function(){if(gates()[1])show(2);});
$("firstText").addEventListener("input",function(){
 state.draftFirst=this.value;updateFirstNeed();updateButtons();save();
});
btnFirst.addEventListener("click",function(){
 var ta=$("firstText");
 if(!validFirst(ta.value,state.spokenFirst))return;
 state.first={text:ta.value.trim(),spoken:!!state.spokenFirst};
 state.focus=[];state.second=null;state.refl=[];state.draftSecond="";
 $("secondText").value="";state.spokenSecond=false;recSecond.reset();
 show(3);
});
$("btnExample").addEventListener("click",function(){
 var ex=$("exampleBox");ex.hidden=!ex.hidden;
 $("btnExample").setAttribute("aria-expanded",String(!ex.hidden));
 if(!ex.hidden)state.model=true;
 renderS4();save();
});
btnSecond.addEventListener("click",function(){if(state.focus.length>=1)show(4);});
$("secondText").addEventListener("input",onSecondInput);
$("btnCopy").addEventListener("click",function(){
 if(state.first&&state.first.text){$("secondText").value=state.first.text;onSecondInput();$("secondText").focus();}
});
btnCompare.addEventListener("click",function(){
 if(!secondDraftValid())return;
 state.second={text:$("secondText").value.trim(),spoken:!!state.spokenSecond};
 state.refl=[];
 show(5);
});
btnFinish.addEventListener("click",function(){if(gates()[5])show(6);});
doneBtn.addEventListener("click",function(){
 if(!(cur===6&&isComplete()))return;
 activityCompleted();
 doneShown=true;
 updateButtons();
 announce(t("done_msg"));
 retryBtn.focus();
});
retryBtn.addEventListener("click",function(){
 var lang=ui;
 state=blank();state.lang=lang;goalPick=null;doneShown=false;
 $("firstText").value="";$("secondText").value="";
 recFirst.reset();recSecond.reset();
 $("exampleBox").hidden=true;$("btnExample").setAttribute("aria-expanded","false");
 lsDel(KEY);
 show(0);
});

/* ---------- init ---------- */
recFirst=Recorder($("recFirst"),function(){return state.spokenFirst;},function(v){state.spokenFirst=v;updateFirstNeed();updateButtons();save();});
recSecond=Recorder($("recSecond"),function(){return state.spokenSecond;},function(v){state.spokenSecond=v;state.second=null;state.refl=[];updateSecondNeed();updateButtons();save();});

state=load();
ui=state.lang==="fr"?"fr":"en";
/* revalidate restored progress against the current rules */
var allowed=maxScreen();
if(state.screen>allowed)state.screen=allowed;
$("firstText").value=state.draftFirst;
$("secondText").value=state.draftSecond;
recFirst.sync();recSecond.sync();
if(state.screen>=4&&!state.second&&state.screen===5){state.screen=4;}
show(state.screen,true);
})();
</script>
</body>
</html>
