<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Using an online learning platform — Build Useful English</title>
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-blue-dark:#1B7E92;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;
    --blue-tint:#E3F5F9;
    --green-tint:#F4F7DA;
    --yellow-tint:#FEF3CD;
    --radius:14px;
    --focus:3px solid #2E2E2D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff;color:var(--pazapa-grey-dark);
    font-family:"Open Sans",Arial,sans-serif;font-size:16px;line-height:1.5;max-width:100%;overflow-x:hidden;}
  h1,h2,h3{font-family:"Filson Soft","Open Sans",Arial,sans-serif;font-weight:800;line-height:1.25;margin:0 0 8px 0;}
  h1{font-size:20px;} h2{font-size:24px;} h3{font-size:17px;}
  p{margin:0 0 10px 0;}
  .app{max-width:780px;margin:0 auto;padding:16px 16px 48px 16px;}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:4px solid var(--pazapa-blue);margin-bottom:12px;}
  .logo{width:120px;height:auto;display:block;flex:0 0 auto;}
  .title-wrap{flex:1 1 220px;min-width:0;}
  .eyebrow{font-size:13px;font-weight:700;overflow-wrap:break-word;}
  .progress{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .track{flex:1 1 auto;height:10px;background:var(--pazapa-grey-light);border-radius:999px;overflow:hidden;}
  .fill{height:100%;width:16.6%;background:var(--pazapa-blue-dark);transition:width .3s ease;}
  .plabel{font-size:13px;font-weight:700;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  .screen{display:none;} .screen.active{display:block;}
  .fr{display:none;font-style:italic;color:#1B5E6E;font-size:.93em;}
  body.fr-on .fr{display:block;}
  body.fr-on .fr.fr-i{display:inline;}
  .btn .fr-i,button .fr{color:inherit;font-style:italic;font-weight:600;}

  button,.chip-btn,input[type=text],textarea{font-family:inherit;}
  button{font-size:16px;font-weight:700;cursor:pointer;border-radius:999px;min-height:48px;min-width:48px;padding:10px 22px;
    border:2px solid var(--pazapa-grey-dark);background:#fff;color:var(--pazapa-grey-dark);touch-action:manipulation;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,label.opt:focus-within{outline:var(--focus);outline-offset:3px;box-shadow:0 0 0 6px #fff;}
  button.primary{background:var(--pazapa-blue-dark);border-color:var(--pazapa-blue-dark);color:#fff;}
  button.primary:disabled,button.help:disabled{background:var(--pazapa-grey-light);border-color:var(--pazapa-grey-light);color:#6b6b6b;cursor:not-allowed;}
  button.ghost{border-color:#9a9a9a;}
  button.help{background:var(--yellow-tint);border-color:var(--pazapa-yellow);}
  button.lang{border-color:var(--pazapa-blue-dark);color:var(--pazapa-blue-dark);padding:8px 16px;}
  button.lang[aria-pressed="true"]{background:var(--pazapa-blue-dark);color:#fff;}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}

  .card{border:1px solid #cfcfcf;border-radius:var(--radius);padding:16px;margin-bottom:14px;background:#fff;}
  .instruction{font-weight:600;}
  .pic{width:64px;height:auto;border-radius:10px;flex:0 0 auto;background:#FBF1E3;}
  .item-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px;}
  .item-head .txt{flex:1 1 auto;min-width:0;}
  .num{font-weight:800;color:var(--pazapa-blue-dark);}
  .clue{margin:0;}

  /* Screen 1 */
  .ex{display:flex;gap:14px;align-items:center;border:1px solid #cfcfcf;border-left:8px solid var(--pazapa-blue);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;}
  .ex .ctx{font-size:14px;margin:0 0 4px 0;}
  .ex .sent{font-size:19px;font-weight:700;margin:0;overflow-wrap:break-word;}
  u.swap{background:var(--blue-tint);text-decoration:underline;text-decoration-style:dashed;text-decoration-thickness:2px;text-underline-offset:4px;padding:1px 4px;border-radius:5px;}
  .legend{font-size:14px;margin:0 0 12px 0;}
  .notice{background:var(--blue-tint);border-radius:var(--radius);padding:14px 16px;margin:6px 0 4px 0;}
  .notice .lab{font-weight:800;display:block;margin-bottom:2px;}

  /* chunks */
  .strip,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:10px;min-height:64px;align-items:center;}
  .strip{background:var(--blue-tint);border:2px dashed var(--pazapa-blue-dark);margin-bottom:8px;}
  .bank{background:var(--pazapa-grey-light);}
  .strip:empty::before{content:"Your sentence";color:#4a4a4a;font-size:14px;}
  .chunk{border:2px solid var(--pazapa-blue-dark);background:#fff;border-radius:10px;padding:8px 14px;font-size:17px;}
  .chunk.placed{background:var(--pazapa-blue);border-color:var(--pazapa-blue-dark);color:var(--pazapa-grey-dark);}
  .chunk .pos{display:inline-block;min-width:22px;font-size:13px;font-weight:800;margin-right:4px;}
  .sublabel{font-size:13px;font-weight:700;margin:6px 0 4px 0;}

  /* gap-fill */
  .gap-line{font-size:19px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px 0;}
  input[type=text].gap{font-size:18px;font-weight:700;min-height:48px;width:9.5em;max-width:100%;padding:6px 12px;border:2px solid var(--pazapa-blue-dark);border-radius:10px;background:#fff;color:var(--pazapa-grey-dark);}
  input[type=text].gap.active{border-width:4px;}
  .wordbank{background:var(--pazapa-grey-light);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}
  .wordbank .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .wordbank button{border-radius:10px;border-color:var(--pazapa-blue-dark);}

  /* choices */
  fieldset{border:1px solid #cfcfcf;border-radius:var(--radius);padding:14px 16px 12px 16px;margin:0 0 14px 0;min-width:0;}
  legend{padding:0 6px;font-weight:800;max-width:100%;}
  label.opt{display:flex;gap:10px;align-items:center;min-height:48px;padding:8px 12px;border:2px solid #9a9a9a;border-radius:10px;margin:8px 0;cursor:pointer;touch-action:manipulation;background:#fff;}
  label.opt input{width:22px;height:22px;flex:0 0 auto;margin:0;accent-color:var(--pazapa-blue-dark);}
  label.opt.sel{border-color:var(--pazapa-blue-dark);background:var(--blue-tint);}
  label.opt.best{border-color:#7d8a12;background:var(--green-tint);}
  label.opt.again{border-color:var(--pazapa-yellow);background:var(--yellow-tint);}
  label.opt .tag{font-size:13px;font-weight:800;margin-left:auto;white-space:nowrap;}
  label.opt .otext{flex:1 1 auto;min-width:0;}

  /* feedback */
  .fb{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:600;}
  .fb-icon{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--pazapa-grey-dark);background:#fff;}
  .fb-ok{background:var(--green-tint);border:2px solid var(--pazapa-green);}
  .fb-retry{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);}
  .fb-info{background:var(--blue-tint);border:2px solid var(--pazapa-blue);}
  .fb-text{flex:1 1 auto;min-width:0;overflow-wrap:break-word;}
  .fb-text .xline{display:block;font-weight:600;margin-top:4px;}
  .screen-fb{min-height:8px;}

  textarea{width:100%;font-size:18px;min-height:96px;padding:10px 12px;border:2px solid var(--pazapa-blue-dark);border-radius:10px;resize:vertical;color:var(--pazapa-grey-dark);}
  .chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .chips-row button{border-radius:10px;border-color:var(--pazapa-blue-dark);text-align:left;}
  .model{display:flex;gap:14px;align-items:center;background:var(--blue-tint);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}
  .model img{width:150px;max-width:34%;height:auto;border-radius:10px;}
  .helpbox{background:var(--yellow-tint);border:2px solid var(--pazapa-yellow);border-radius:var(--radius);padding:12px 14px;margin-top:10px;}

  .final{background:var(--green-tint);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .final h2{margin-bottom:6px;}
  .final img{width:100%;max-width:420px;height:auto;border-radius:10px;display:block;margin:12px 0 0 0;}
  .confirm{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;margin-top:12px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media (max-width:480px){
    .logo{width:104px;} h2{font-size:21px;} .pic{width:54px;}
    .ex{flex-direction:row;} .ex .sent{font-size:17px;} .model{flex-direction:column;align-items:flex-start;} .model img{max-width:100%;width:100%;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <img id="logo" class="logo" alt="Pazapa" width="120" height="33">
    <div class="title-wrap">
      <div class="eyebrow">Week 13 · Lesson 1 · Using an online learning platform · Step 4 of 7</div>
      <h1>Build Useful English<span class="fr fr-i" lang="fr"> · Construire un anglais utile</span></h1>
    </div>
    <button type="button" id="frBtn" class="lang" aria-pressed="false" lang="fr">Français</button>
  </header>

  <div class="progress" role="progressbar" id="progressBar" aria-label="Activity progress" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" aria-valuetext="Screen 1 of 6">
    <div class="track"><div class="fill" id="progressFill"></div></div>
    <div class="plabel" id="progressLabel">Screen 1 of 6</div>
  </div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <!-- SCREEN 1 -->
  <section class="screen active" id="screen1" aria-labelledby="h1s">
    <h2 id="h1s" tabindex="-1"></h2>
    <p class="instruction" id="s1Intro"></p>
    <p class="legend" id="s1Legend"></p>
    <div id="s1Examples"></div>
    <div class="notice" id="s1Notice"></div>
    <div class="btn-row"><button type="button" class="primary btn" id="btnNext1"></button></div>
  </section>

  <!-- SCREEN 2 -->
  <section class="screen" id="screen2" aria-labelledby="h2s" aria-hidden="true">
    <h2 id="h2s" tabindex="-1"></h2>
    <p class="instruction" id="s2Intro"></p>
    <div id="s2Items"></div>
    <div class="screen-fb" id="s2Fb"></div>
    <div class="btn-row">
      <button type="button" class="primary btn" id="btnCheck2"></button>
      <button type="button" class="primary btn" id="btnNext2" disabled></button>
    </div>
  </section>

  <!-- SCREEN 3 -->
  <section class="screen" id="screen3" aria-labelledby="h3s" aria-hidden="true">
    <h2 id="h3s" tabindex="-1"></h2>
    <p class="instruction" id="s3Intro"></p>
    <div class="wordbank" id="s3Bank"></div>
    <div id="s3Items"></div>
    <div class="screen-fb" id="s3Fb"></div>
    <div class="btn-row">
      <button type="button" class="primary btn" id="btnCheck3"></button>
      <button type="button" class="primary btn" id="btnNext3" disabled></button>
    </div>
  </section>

  <!-- SCREEN 4 -->
  <section class="screen" id="screen4" aria-labelledby="h4s" aria-hidden="true">
    <h2 id="h4s" tabindex="-1"></h2>
    <p class="instruction" id="s4Intro"></p>
    <div id="s4Items"></div>
    <div class="screen-fb" id="s4Fb"></div>
    <div class="btn-row">
      <button type="button" class="primary btn" id="btnCheck4"></button>
      <button type="button" class="primary btn" id="btnNext4" disabled></button>
    </div>
  </section>

  <!-- SCREEN 5 -->
  <section class="screen" id="screen5" aria-labelledby="h5s" aria-hidden="true">
    <h2 id="h5s" tabindex="-1"></h2>
    <p class="instruction" id="s5Intro"></p>
    <div class="model" id="s5Model"></div>
    <p class="instruction" id="s5Task"></p>
    <fieldset id="s5BankProblem"></fieldset>
    <fieldset id="s5BankQuestion"></fieldset>
    <label for="s5Text" class="instruction" id="s5Label"></label>
    <textarea id="s5Text" rows="3" maxlength="200" autocomplete="off" spellcheck="false" autocapitalize="sentences"></textarea>
    <div class="btn-row">
      <button type="button" class="ghost btn" id="btnClear5"></button>
      <button type="button" class="help btn" id="btnHelp5"></button>
    </div>
    <div class="helpbox" id="s5Help" hidden></div>
    <div class="screen-fb" id="s5Fb"></div>
    <div class="btn-row">
      <button type="button" class="primary btn" id="btnCheck5"></button>
      <button type="button" class="help btn" id="btnShow5" hidden></button>
      <button type="button" class="primary btn" id="btnNext5" disabled></button>
    </div>
  </section>

  <!-- SCREEN 6 -->
  <section class="screen" id="screen6" aria-labelledby="h6s" aria-hidden="true">
    <div class="final">
      <h2 id="h6s" tabindex="-1"></h2>
      <p id="s6a"></p>
      <p id="s6b"></p>
      <img id="s6img" alt="">
    </div>
    <p id="doneNote" role="status" style="font-weight:700;min-height:24px;"></p>
    <div class="confirm" id="confirmPanel" hidden>
      <p style="font-weight:700;" id="confirmText"></p>
      <div class="btn-row" style="margin-top:6px;">
        <button type="button" class="primary btn" id="btnConfirmYes"></button>
        <button type="button" class="ghost btn" id="btnConfirmNo"></button>
      </div>
    </div>
    <div class="btn-row">
      <button type="button" class="primary btn" id="doneBtn" disabled></button>
      <button type="button" class="ghost btn" id="btnTryAgain"></button>
    </div>
  </section>

</div>

    function commit(){ try{ var r = (ver === '2004') ? api.Commit('') : api.LMSCommit(''); return r === true || r === 'true' || r === 1 || r === '1'; }catch(e){ return false; } }
    function init(){
      if(!detect()){ return false; }
      if(inited){ return true; }
      try{
        var r = (ver === '2004') ? api.Initialize('') : api.LMSInitialize('');
        inited = (r === true || r === 'true' || r === 1 || r === '1');
        if(inited){ ownInit = true; }
      }catch(e){ inited = false; }
      if(!inited){
        var t = get(ver === '2004' ? 'cmi.completion_status' : 'cmi.core.lesson_status');
        inited = (t !== null);
      }
      return inited;
    }
    function status(){
      if(!init()){ return null; }
      if(ver === '2004'){ return { c:get('cmi.completion_status'), s:get('cmi.success_status') }; }
      return { c:get('cmi.core.lesson_status') };
    }
    function isDone(st){
      if(!st){ return false; }
      var c = String(st.c || '').toLowerCase(), s = String(st.s || '').toLowerCase();
      return c === 'completed' || c === 'passed' || s === 'passed';
    }
    return {
      available: function(){ return detect(); },
      readSuspend: function(){
        if(!init()){ return null; }
        return get(ver === '2004' ? 'cmi.suspend_data' : 'cmi.suspend_data');
      },
      saveProgress: function(data, screen){
        if(!init()){ return false; }
        var st = status() || {};
        var c = String(st.c || '').toLowerCase();
        set('cmi.suspend_data', data);
        if(ver === '1.2'){
          set('cmi.core.lesson_location', String(screen));
          if(c === '' || c === 'not attempted' || c === 'unknown' || c === 'browsed'){ set('cmi.core.lesson_status', 'incomplete'); }
        } else {
          set('cmi.location', String(screen));
          if(c === '' || c === 'not attempted' || c === 'unknown'){ set('cmi.completion_status', 'incomplete'); }
        }
        return commit();
      },
      complete: function(){
        if(!init()){ return false; }
        var st = status();
        if(isDone(st)){ return true; }
        if(ver === '2004'){ set('cmi.completion_status', 'completed'); } else { set('cmi.core.lesson_status', 'completed'); }
        commit();
        return isDone(status());
      },
      finish: function(){
        if(!inited || !ownInit){ return; }
        try{ commit(); if(ver === '2004'){ api.Terminate(''); } else { api.LMSFinish(''); } }catch(e){}
        inited = false; ownInit = false;
      }
    };
  })();

  function snapshot(){
    return JSON.stringify({
      v: SCHEMA, sc: state.screen, fr: state.fr, dn: state.done,
      a: state.s2.map(function(x){ return [x.o, x.a, x.r, x.c]; }),
      b: state.s3.map(function(x){ return [x.t, x.a, x.r, x.c]; }),
      c: state.s4.map(function(x){ return [x.k, x.a, x.r, x.c]; }),
      d: [state.s5.t, state.s5.a, state.s5.r, state.s5.c, state.s5.h]
    });
  }
  function intIn(x, lo, hi, dflt){ return (typeof x === 'number' && isFinite(x) && x >= lo && x <= hi) ? Math.floor(x) : dflt; }
  function parseSnapshot(raw){
    var obj = null;
    try{ obj = JSON.parse(raw); }catch(e){ return null; }
    if(!obj || typeof obj !== 'object' || obj.v !== SCHEMA){ return null; }
    var s = freshState(obj.fr === 1);
    var i;
    if(Array.isArray(obj.a)){
      for(i = 0; i < s.s2.length; i++){
        var r2 = obj.a[i]; if(!Array.isArray(r2)){ continue; }
        var seen = {}, o = [];
        if(Array.isArray(r2[0])){
          r2[0].forEach(function(j){ if(typeof j === 'number' && j >= 0 && j < CFG.s2[i].chunks.length && !seen[j]){ seen[j] = 1; o.push(Math.floor(j)); } });
        }
        s.s2[i].o = o; s.s2[i].a = intIn(r2[1], 0, 20, 0);
        s.s2[i].r = (r2[2] === 1 && s.s2[i].a >= 2) ? 1 : 0;
        s.s2[i].c = (r2[3] === 1 && matchSeq(o, CFG.s2[i].valid)) ? 1 : 0;
        if(s.s2[i].r){ s.s2[i].o = CFG.s2[i].valid[0].slice(); }
      }
    }
    if(Array.isArray(obj.b)){
      for(i = 0; i < s.s3.length; i++){
        var r3 = obj.b[i]; if(!Array.isArray(r3)){ continue; }
        var t3 = (typeof r3[0] === 'string') ? r3[0].slice(0, 30) : '';
        s.s3[i].t = t3; s.s3[i].a = intIn(r3[1], 0, 20, 0);
        s.s3[i].r = (r3[2] === 1 && s.s3[i].a >= 2) ? 1 : 0;
        s.s3[i].c = (r3[3] === 1 && check3Value(i, t3).ok) ? 1 : 0;
        if(s.s3[i].r){ s.s3[i].t = CFG.s3[i].show; }
      }
    }
    if(Array.isArray(obj.c)){
      for(i = 0; i < s.s4.length; i++){
        var r4 = obj.c[i]; if(!Array.isArray(r4)){ continue; }
        var k = intIn(r4[0], -1, 2, -1);
        s.s4[i].k = k; s.s4[i].a = intIn(r4[1], 0, 20, 0);
        s.s4[i].r = (r4[2] === 1 && s.s4[i].a >= 2) ? 1 : 0;
        s.s4[i].c = (r4[3] === 1 && k === CFG.s4[i].correct) ? 1 : 0;
        if(s.s4[i].r){ s.s4[i].k = CFG.s4[i].correct; }
      }
    }
    if(Array.isArray(obj.d)){
      var t5 = (typeof obj.d[0] === 'string') ? obj.d[0].slice(0, 200) : '';
      s.s5.t = t5; s.s5.a = intIn(obj.d[1], 0, 20, 0);
      s.s5.r = (obj.d[2] === 1 && s.s5.a >= 2) ? 1 : 0;
      s.s5.c = (obj.d[3] === 1 && analyse5(t5).ok) ? 1 : 0;
      s.s5.h = obj.d[4] === 1 ? 1 : 0;
      if(s.s5.r){ s.s5.t = CFG.s5.modelHelp; }
    }
    var saved = intIn(obj.sc, 1, 6, 1);
    var tmp = state; state = s;
    var reach = maxReachable();
    var allOk = allValid();
    state = tmp;
    s.screen = Math.min(saved, reach);
    s.done = (obj.dn === 1 && allOk) ? 1 : 0;
    return s;
  }
  function compactForLms(){
    var snap = snapshot();
    if(snap.length > 3500){
      var keep = state.s5.t; state.s5.t = state.s5.t.slice(0, 60);
      snap = snapshot(); state.s5.t = keep;
    }
    return snap;
  }
  function saveLocal(){
    try{ window.localStorage.setItem(STORAGE_KEY, snapshot()); }catch(e){}
  }
  function clearLocal(){
    try{ window.localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }
  var pendingLms = false;
  function persist(){
    saveLocal();
    try{
      LMS.saveProgress(compactForLms(), state.screen);
      if(pendingLms && state.done){ if(LMS.complete()){ pendingLms = false; } }
    }catch(e){}
  }
  function loadState(){
    var fromLms = null, fromLocal = null;
    try{ var raw = LMS.readSuspend(); if(raw){ fromLms = parseSnapshot(raw); } }catch(e){}
    try{ var rl = window.localStorage.getItem(STORAGE_KEY); if(rl){ fromLocal = parseSnapshot(rl); } }catch(e2){}
    return fromLms || fromLocal || null;
  }

      t.appendChild(h);
      t.appendChild(mk('p', 'clue', '<strong>' + Ti("Clue:", "Indice :") + '</strong> ' + T(it.clue[0], it.clue[1])));
      head.appendChild(t); card.appendChild(head);
      var line = mk('div', 'gap-line');
      line.appendChild(tx('span', null, it.pre));
      var inp = document.createElement('input'); inp.type = 'text'; inp.className = 'gap';
      inp.setAttribute('aria-label', 'Answer for sentence ' + (i + 1));
      inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocapitalize', 'none'); inp.setAttribute('spellcheck', 'false'); inp.maxLength = 30;
      inp.value = state.s3[i].t;
      inp.addEventListener('input', function(){ on3Input(i, inp.value, false); });
      inp.addEventListener('focus', function(){ setActive3(i); });
      line.appendChild(inp);
      line.appendChild(tx('span', null, it.post));
      card.appendChild(line);
      var fbh = mk('div'); card.appendChild(fbh);
      var smh = mk('div'); card.appendChild(smh);
      host.appendChild(card);
      in3.push(inp); fb3.push(fbh); sm3.push(smh);
    });
    CFG.s3.forEach(function(it, i){ refresh3(i); });
  }
  function setActive3(i){
    active3 = i;
    in3.forEach(function(x, k){ if(k === i){ x.classList.add('active'); } else { x.classList.remove('active'); } });
  }
  function useBank3(w){
    var i = active3;
    if(i == null || i < 0 || i >= in3.length){
      i = 0;
      for(var k = 0; k < in3.length; k++){ if(!in3[k].value){ i = k; break; } }
    }
    in3[i].value = w; setActive3(i);
    on3Input(i, w, true);
    announce('Used ' + w + ' in sentence ' + (i + 1) + '.');
  }
  function on3Input(i, val, fromBank){
    var st = state.s3[i];
    st.t = String(val).slice(0, 30); st.c = 0; st.r = 0; FB.s3[i] = null; FB.scr.s3 = null; putFb($('s3Fb'), null);
    refresh3(i); persist(); syncNav();
  }
  function refresh3(i){
    var st = state.s3[i];
    putFb(fb3[i], FB.s3[i]);
    sm3[i].innerHTML = '';
    if(st.a >= 2 && !st.r && !(st.c && check3Value(i, st.t).ok)){
      var b = mk('button', 'help btn', '<span class="en">Show me</span><span class="fr fr-i" lang="fr"> · Montre-moi</span>');
      b.type = 'button'; b.style.marginTop = '10px';
      b.addEventListener('click', function(){ reveal3(i); });
      sm3[i].appendChild(b);
    }
  }
  function reveal3(i){
    var st = state.s3[i], it = CFG.s3[i];
    st.t = it.show; st.r = 1; st.c = 0; in3[i].value = it.show;
    FB.s3[i] = { k:'info', en:"Answer shown. Read the sentence once more.", fr:"Réponse affichée. Relisez la phrase une fois.", x:[["Sentence:", "Phrase :", it.pre + " " + it.show + " " + it.post]] };
    FB.scr.s3 = null; putFb($('s3Fb'), null);
    refresh3(i); persist(); syncNav(); announce('Answer shown for sentence ' + (i + 1) + '.');
    summary3(true);
  }
  function summary3(silent){
    if(valid3()){ FB.scr.s3 = { k:'ok', en:"All four sentences are complete. You can continue.", fr:"Les quatre phrases sont terminées. Vous pouvez continuer." }; }
    else { FB.scr.s3 = null; }
    putFb($('s3Fb'), FB.scr.s3);
    if(!silent && FB.scr.s3){ announce(FB.scr.s3.en); }
  }
  function check3(){
    var wrong = 0, empty = 0;
    CFG.s3.forEach(function(it, i){
      var st = state.s3[i];
      if(st.r){ return; }
      var res = check3Value(i, in3[i].value);
      st.t = in3[i].value.slice(0, 30);
      if(res.empty){
        st.c = 0; empty++;
        FB.s3[i] = { k:'info', en:"Choose or type an answer first.", fr:"Choisissez ou tapez d'abord une réponse." };
      } else if(res.ok){
        st.c = 1;
        FB.s3[i] = { k:'ok', en:"Correct. That fits the clue.", fr:"Correct. Cela correspond à l'indice." };
        if(res.suggest){ FB.s3[i].x = [["You wrote:", "Vous avez écrit :", in3[i].value.trim()], ["Suggestion:", "Suggestion :", res.suggest]]; }
      } else {
        st.c = 0; st.a++; wrong++;
        FB.s3[i] = { k:'retry', en:"Not yet. Read the clue again. Your answer is still here.", fr:"Pas encore. Relisez l'indice. Votre réponse est toujours là.",
          x:[["You wrote:", "Vous avez écrit :", in3[i].value.trim()]] };
      }
    });
    CFG.s3.forEach(function(it, i){ refresh3(i); });
    if(valid3()){ summary3(false); }
    else {
      FB.scr.s3 = { k: wrong ? 'retry' : 'info',
        en: wrong ? "Some answers need another try. Check the messages above." : "Complete all four sentences, then check again.",
        fr: wrong ? "Certaines réponses demandent un nouvel essai. Lisez les messages ci-dessus." : "Complétez les quatre phrases, puis vérifiez à nouveau." };
      putFb($('s3Fb'), FB.scr.s3); announce(FB.scr.s3.en);
    }
    persist(); syncNav();
  }

  /* ---------------- SCREEN 4 ---------------- */
  function render4(focusIdx){
    var host = $('s4Items'); host.innerHTML = '';
    CFG.s4.forEach(function(it, i){
      var st = state.s4[i];
      var fs = mk('fieldset'); fs.id = 's4f' + i;
      var lg = mk('legend', null, '<span class="num">' + (i + 1) + '.</span> ' + Ti("Situation", "Situation")); fs.appendChild(lg);
      var head = mk('div', 'item-head');
      head.appendChild(img(it.img, 'pic', ''));
      head.appendChild(mk('div', 'txt', '<p class="clue" style="font-weight:600;">' + T(it.sit[0], it.sit[1]) + '</p>'));
      fs.appendChild(head);
      var resolved = st.r || (st.c && st.k === it.correct);
      it.opts.forEach(function(o, k){
        var lab = mk('label', 'opt');
        var radio = document.createElement('input'); radio.type = 'radio'; radio.name = 'q' + i; radio.value = String(k);
        radio.checked = (st.k === k);
        var cls = '', tag = '';
        if(st.k === k){
          cls = 'sel';
          if(resolved){ cls = 'best'; tag = "✓ Best response"; }
          else if(FB.s4[i] && FB.s4[i].k === 'retry'){ cls = 'again'; tag = "! Try again"; }
        }
        if(cls){ lab.className = 'opt ' + cls; }
        lab.appendChild(radio);
        lab.appendChild(mk('span', 'otext', '<span class="en">' + o[0] + '</span><span class="fr" lang="fr">' + o[1] + '</span>'));
        if(tag){ lab.appendChild(tx('span', 'tag', tag)); }
        radio.addEventListener('change', function(){ choose4(i, k); });
        fs.appendChild(lab);
      });
      var fbh = mk('div'); if(FB.s4[i]){ fbh.appendChild(fbNode(FB.s4[i])); } fs.appendChild(fbh);
      if(st.a >= 2 && !resolved){
        var sm = mk('button', 'help btn', '<span class="en">Show me</span><span class="fr fr-i" lang="fr"> · Montre-moi</span>');
        sm.type = 'button'; sm.addEventListener('click', function(){ reveal4(i); });
        fs.appendChild(sm);
      }
      host.appendChild(fs);
    });
    if(focusIdx != null){
      var r = document.querySelector('#s4f' + focusIdx + ' input:checked');
      if(r){ r.focus(); }
    }
  }
  function choose4(i, k){
    var st = state.s4[i]; st.k = k; st.c = 0; st.r = 0; FB.s4[i] = null; FB.scr.s4 = null; putFb($('s4Fb'), null);
    persist(); syncNav(); render4(i);
  }
  function reveal4(i){
    var st = state.s4[i], it = CFG.s4[i];
    st.k = it.correct; st.r = 1; st.c = 0;
    FB.s4[i] = { k:'info', en:"Answer shown. " + it.why[0], fr:"Réponse affichée. " + it.why[1] };
    persist(); syncNav(); render4(i); announce('Answer shown for situation ' + (i + 1) + '.');
    summary4(true);
  }
  function summary4(silent){
    if(valid4()){ FB.scr.s4 = { k:'ok', en:"All three situations are complete. You can continue.", fr:"Les trois situations sont terminées. Vous pouvez continuer." }; }
    else { FB.scr.s4 = null; }
    putFb($('s4Fb'), FB.scr.s4);
    if(!silent && FB.scr.s4){ announce(FB.scr.s4.en); }
  }
  function check4(){
    var wrong = 0, none = 0;
    CFG.s4.forEach(function(it, i){
      var st = state.s4[i];
      if(st.r){ return; }
      if(st.k < 0){
        st.c = 0; none++; FB.s4[i] = { k:'info', en:"Choose a response first.", fr:"Choisissez d'abord une réponse." };
      } else if(st.k === it.correct){
        st.c = 1; FB.s4[i] = { k:'ok', en:"Correct. " + it.why[0], fr:"Correct. " + it.why[1] };
      } else {
        st.c = 0; st.a++; wrong++;
        FB.s4[i] = { k:'retry', en:"Not yet. Read the situation again. Does this sentence help?", fr:"Pas encore. Relisez la situation. Cette phrase aide-t-elle ?" };
      }
    });
    render4();
    if(valid4()){ summary4(false); }
    else {
      FB.scr.s4 = { k: wrong ? 'retry' : 'info',
        en: wrong ? "Some responses need another try. Check the messages above." : "Choose a response for each situation, then check again.",
        fr: wrong ? "Certaines réponses demandent un nouvel essai. Lisez les messages ci-dessus." : "Choisissez une réponse pour chaque situation, puis vérifiez à nouveau." };
      putFb($('s4Fb'), FB.scr.s4); announce(FB.scr.s4.en);
    }
    persist(); syncNav();
  }

  /* ---------------- SCREEN 5 ---------------- */
  var ta5 = $('s5Text');
  function build5(){
    function bankFs(id, title, list, listFr){
      var fs = $(id); fs.innerHTML = '';
      fs.appendChild(mk('legend', null, title));
      var row = mk('div', 'chips-row');
      list.forEach(function(p, k){
        var b = mk('button'); b.type = 'button';
        b.innerHTML = '<span class="en">' + p + '</span><span class="fr" lang="fr">' + listFr[k] + '</span>';
        b.setAttribute('aria-label', 'Add to message: ' + p);
        b.addEventListener('click', function(){ addPhrase5(p); });
        row.appendChild(b);
      });
      fs.appendChild(row);
    }
    bankFs('s5BankProblem', Ti("Problem", "Problème"), CFG.s5.problems, CFG.s5.problemFr);
    bankFs('s5BankQuestion', Ti("Question", "Question"), CFG.s5.questions, CFG.s5.questionFr);
    ta5.value = state.s5.t;
    refresh5();
  }
  function addPhrase5(p){
    var t = ta5.value;
    if(t && !/\s$/.test(t)){ t += ' '; }
    t += p;
    if(t.length > 200){ return; }
    ta5.value = t; on5Input();
    announce('Added to your message: ' + p);
  }
  function on5Input(){
    var st = state.s5;
    st.t = ta5.value.slice(0, 200); st.c = 0; st.r = 0; FB.s5 = null; FB.scr.s5 = null;
    refresh5(); persist(); syncNav();
  }
  function refresh5(){
    var st = state.s5;
    putFb($('s5Fb'), FB.s5);
    var showBtn = $('btnShow5');
    showBtn.hidden = !(st.a >= 2 && !st.r && !(st.c && analyse5(st.t).ok));
    var hb = $('s5Help');
    if(st.h){
      hb.hidden = false;
      hb.innerHTML = '<strong>' + Ti("Model", "Modèle") + '</strong><p style="font-size:18px;font-weight:700;margin:4px 0;">' + CFG.s5.modelHelp + '</p><p class="fr">' + CFG.s5.modelHelpFr + '</p>';
    } else { hb.hidden = true; hb.innerHTML = ''; }
  }
  function check5(){
    var st = state.s5;
    st.t = ta5.value.slice(0, 200);
    var res = analyse5(st.t);
    if(!norm(st.t)){
      st.c = 0; FB.s5 = { k:'info', en:"Write your message first. Use the phrase bank to help you.", fr:"Écrivez d'abord votre message. Utilisez la banque de phrases." };
    } else if(res.ok){
      st.c = 1;
      FB.s5 = { k:'ok', en:"Good message. It has a problem and a question.", fr:"Bon message. Il contient un problème et une question." };
      var x = [["You wrote:", "Vous avez écrit :", st.t.trim()]].concat(res.notes);
      if(res.notes.length){ FB.s5.x = x; }
    } else {
      st.c = 0; st.a++;
      var en = [], fr = [];
      if(!res.problem){ en.push("Add your problem, for example: I can't open the video."); fr.push("Ajoutez votre problème, par exemple : I can't open the video."); }
      if(!res.question){ en.push("Add one question, for example: How do I log in?"); fr.push("Ajoutez une question, par exemple : How do I log in?"); }
      if(res.tooLong){ en.push("Use a maximum of two sentences."); fr.push("Utilisez deux phrases au maximum."); }
      FB.s5 = { k:'retry', en:"Not yet. " + en.join(" "), fr:"Pas encore. " + fr.join(" "), x:[["You wrote:", "Vous avez écrit :", st.t.trim()]].concat(res.notes) };
    }
    refresh5();
    FB.scr.s5 = FB.s5;
    announce(FB.s5.en);
    persist(); syncNav();
  }
  function show5(){
    var st = state.s5;
    st.t = CFG.s5.modelHelp; ta5.value = st.t; st.r = 1; st.c = 0;
    FB.s5 = { k:'info', en:"Model shown. Read it once more, then continue.", fr:"Modèle affiché. Relisez-le une fois, puis continuez." };
    refresh5(); persist(); syncNav(); announce('Model shown.');
  }

  /* ---------------- completion ---------------- */
  function activityCompleted(){
    if(completionSent){ return; }
    completionSent = true;
    var ok = false;
    try{ ok = LMS.complete(); }catch(e){ ok = false; }
    if(!ok){ pendingLms = true; }
    try{ console.log('W13D1 Build Useful English completed'); }catch(e2){}
  }
  function onDone(){
    if(state.done || !allValid()){ return; }
    try{ activityCompleted(); }catch(e){}
    state.done = 1;
    setBtn('doneBtn', ["Done ✓", "Terminé ✓"]);
    doneBtn.disabled = true;
    $('doneNote').innerHTML = T("Well done! You have completed this activity.", "Bravo ! Vous avez terminé cette activité.");
    announce('Well done! You have completed this activity.');
    persist();
  }

  /* ---------------- restart ---------------- */
  function resetAll(){
    var fr = state.fr;
    state = freshState(fr);
    FB = { s2:[], s3:[], s4:[], s5:null, scr:{} };
    active3 = null;
    completionSent = false;
    clearLocal();
    $('doneNote').textContent = '';
    $('confirmPanel').hidden = true;
    setBtn('doneBtn', BTN.done);
    doneBtn.disabled = true;
    putFb($('s2Fb'), null); putFb($('s3Fb'), null); putFb($('s4Fb'), null);
    render2(); build3(); render4(); build5();
    current = 1;
    document.querySelectorAll('.screen').forEach(function(s, idx){
      if(idx === 0){ s.classList.add('active'); s.setAttribute('aria-hidden', 'false'); } else { s.classList.remove('active'); s.setAttribute('aria-hidden', 'true'); }
    });
    goTo(1);
  }

  /* ---------------- language toggle ---------------- */
  function applyLang(){
    document.body.classList.toggle('fr-on', !!state.fr);
    var b = $('frBtn');
    b.setAttribute('aria-pressed', state.fr ? 'true' : 'false');
    b.textContent = state.fr ? 'Français ✓' : 'Français';
    b.setAttribute('aria-label', state.fr ? 'Français : traduction activée. Appuyez pour la désactiver.' : 'Afficher la traduction en français');
  }

  /* ---------------- boot ---------------- */
  buildStatic();
  var restored = loadState();
  if(restored){ state = restored; }
  applyLang();
  render2(); build3(); render4(); build5();
  if(state.done){ completionSent = true; setBtn('doneBtn', ["Done ✓", "Terminé ✓"]); $('doneNote').innerHTML = T("Well done! You have completed this activity.", "Bravo ! Vous avez terminé cette activité."); }
  // show the restored screen without stealing focus on first load
  (function(){
    var n = Math.min(state.screen, maxReachable());
    if(n > 1){
      $('screen1').classList.remove('active'); $('screen1').setAttribute('aria-hidden', 'true');
      var s = $('screen' + n); s.classList.add('active'); s.setAttribute('aria-hidden', 'false');
      current = n; state.screen = n;
    }
    setProgress(current);
    syncNav();
  })();

  /* ---------------- events ---------------- */
  $('frBtn').addEventListener('click', function(){
    state.fr = state.fr ? 0 : 1; applyLang(); persist();
    announce(state.fr ? 'Traduction française activée.' : 'French translation off.');
  });
  $('btnNext1').addEventListener('click', function(){ goTo(2); });
  $('btnCheck2').addEventListener('click', check2);
  $('btnNext2').addEventListener('click', function(){ if(valid2()){ goTo(3); } });
  $('btnCheck3').addEventListener('click', check3);
  $('btnNext3').addEventListener('click', function(){ if(valid3()){ goTo(4); } });
  $('btnCheck4').addEventListener('click', check4);
  $('btnNext4').addEventListener('click', function(){ if(valid4()){ goTo(5); } });
  ta5.addEventListener('input', on5Input);
  $('btnClear5').addEventListener('click', function(){ ta5.value = ''; on5Input(); ta5.focus(); announce('Message cleared.'); });
  $('btnHelp5').addEventListener('click', function(){ state.s5.h = 1; refresh5(); persist(); announce('Model shown.'); });
  $('btnCheck5').addEventListener('click', check5);
  $('btnShow5').addEventListener('click', show5);
  $('btnNext5').addEventListener('click', function(){ if(valid5()){ goTo(6); } });
  doneBtn.addEventListener('click', onDone);
  $('btnTryAgain').addEventListener('click', function(){ $('confirmPanel').hidden = false; $('btnConfirmYes').focus(); });
  $('btnConfirmNo').addEventListener('click', function(){ $('confirmPanel').hidden = true; $('btnTryAgain').focus(); });
  $('btnConfirmYes').addEventListener('click', resetAll);
  window.addEventListener('pagehide', function(){ try{ LMS.finish(); }catch(e){} });

  if(typeof module !== 'undefined'){ module.exports = { norm:norm, analyse5:analyse5, check3Value:check3Value, parseSnapshot:parseSnapshot }; }
})();
</script>
</body>
</html>
